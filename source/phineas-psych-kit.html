ades."], ["Participants", "1,200 ninth graders from 10 public high schools in North Carolina took part. Students were 14 to 15 years old. See the table for demographics."], ["Method", "Students were randomly assigned to complete two 25-minute online lessons about how the brain grows with effort (growth mindset) or two 25-minute lessons about brain functions (control). Math achievement was measured as each student's end-of-year math grade point average on a 4.0 scale. Parents were notified and could opt their child out, and students' records were analyzed without names."], ["Results", "Growth mindset students finished the year with an average math GPA of 2.48; control students averaged 2.39 (p = .03). The effect size was small (d = 0.10)."], ["Discussion", "The program produced a small but statistically significant improvement in math grades."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "49%"], ["Male", "51%"], ["White", "46%"], ["Black", "28%"], ["Hispanic", "19%"], ["Asian", "7%"], ["Free/reduced lunch", "52%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of math achievement.", "C": "Describe what the effect size (d = 0.10) indicates, given that the result was statistically significant.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that a growth mindset program raises math grades."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["gpa", "grade point", "grade"], ["4.0", "end-of-year", "end of year", "math"]], "labels": ["Says it was the math grade (GPA)", "Gives a detail from this study (end-of-year, 4.0 scale)"]}, "C": {"nums": ["0.10", ".10", "2.48", "2.39"], "meaning": ["small", "minor", "tiny", "size", "significant"], "subject": ["mindset", "program", "lesson"], "kind": "other"}, "D": {"eth": [{"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["parent", "opt", "notified"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "younger children", "adults", "other countries"], "demo": ["49%", "51%", "46%", "28%", "19%", "7%", "52%", "female", "male", "white", "black", "hispanic", "asian", "free/reduced lunch", "north carolina", "10", "1,200", "ninth", "free"]}, "F": {"data": ["2.48", "2.39", ".03", "0.10", ".10"], "concept": ["small", "minor", "tiny", "size", "significant", "mindset", "program", "lesson"]}}, "model": {"A": "The research method is an experiment because students were randomly assigned to growth mindset or control lessons, and the researchers manipulated the lesson content.", "B": "Math achievement was operationally defined as each student's end-of-year math GPA on a 4.0 scale.", "C": "The small effect size (d = 0.10) indicates that even though the difference was statistically significant, the growth mindset program only raised math grades by a small amount (2.48 vs. 2.39).", "D": "The researchers followed confidentiality: students' records were analyzed without names.", "E": "The findings are fairly generalizable to U.S. public high school students because the sample was large (1,200 students from 10 schools) and diverse (46% White, 28% Black, 19% Hispanic), but all were ninth graders in North Carolina, so they cannot be confidently extended to younger children, adults, or other countries.", "F": "The results support the hypothesis, but weakly. Growth mindset students averaged a 2.48 math GPA versus 2.39 for controls (p = .03), which shows the lessons improved grades beyond chance, but the small effect size (d = 0.10) means the improvement was minor."}}, {"id": "phonedesk", "title": "Phone Presence and Working Memory", "topic": "Cognition · Attention", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that simply having your phone nearby reduces the mental capacity available for other tasks."], ["Participants", "520 undergraduate students at a university in Texas took part. Participants were 18 to 24 years old (mean age 20.1). See the table for demographics."], ["Method", "Participants were randomly assigned to leave their phone (silenced) face down on the desk, in their bag, or in another room. They then completed a working memory task. Working memory was measured as the number of letters (out of 75) participants correctly remembered while solving math problems. Participants gave informed consent and were debriefed about the purpose after the session."], ["Results", "The phone-on-desk group remembered an average of 30.9 letters. The bag group averaged 31.6. The other-room group averaged 33.6 (p = .03 for desk vs. other room)."], ["Discussion", "The closer the phone, the lower the working memory performance, even though phones were silent."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "57%"], ["Male", "43%"], ["White", "48%"], ["Hispanic", "28%"], ["Asian", "14%"], ["Black", "10%"], ["Age 18–24", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of working memory.", "C": "Describe what the mean letters remembered indicate about the three groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that having a phone nearby reduces working memory."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["number", "letters", "how many"], ["75", "math", "remember", "correct"]], "labels": ["Says it was the number of letters remembered", "Gives a detail from this study (out of 75, while solving math problems)"]}, "C": {"nums": ["30.9", "31.6", "33.6"], "meaning": ["memory", "remember", "letters", "capacity"], "subject": ["desk", "bag", "other room", "phone"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}], "notIn": ["confid", "withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "older adults", "children"], "demo": ["57%", "43%", "48%", "28%", "14%", "10%", "100%", "female", "male", "white", "hispanic", "asian", "black", "age 18–24", "texas", "one university", "20.1", "520"]}, "F": {"data": ["30.9", "31.6", "33.6"], "concept": ["memory", "remember", "letters", "capacity", "desk", "bag", "other room", "phone"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to where their phone was placed, and the researchers manipulated phone location.", "B": "Working memory was operationally defined as the number of letters (out of 75) participants correctly remembered while solving math problems.", "C": "The other-room group remembered the most letters (33.6), the bag group remembered fewer (31.6), and the desk group remembered the fewest (30.9), which indicates that working memory got worse the closer the phone was.", "D": "The researchers followed debriefing: participants were told the purpose of the study after the session.", "E": "The findings may not generalize to everyone because participants were 18 to 24-year-old undergraduates at one Texas university. They may apply to young adult college students but cannot be confidently extended to older adults who use phones less, or to children.", "F": "The results support the hypothesis. Participants with their phone on the desk remembered 30.9 letters compared with 33.6 when it was in another room (p = .03), which shows that even a silent nearby phone uses up mental capacity that would otherwise go to the task."}}, {"id": "gorilla", "title": "Task Difficulty and Inattentional Blindness", "topic": "Sensation & perception · Attention", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Inattentional blindness is failing to notice a visible object when attention is directed elsewhere. Researchers tested the hypothesis that a harder task increases inattentional blindness."], ["Participants", "120 adults at a science museum in Illinois volunteered. Participants were 18 to 70 years old (mean age 34.8). See the table for demographics."], ["Method", "Participants watched a 75-second video of people passing basketballs. They were randomly assigned to an easy task (count total passes) or a hard task (count bounce passes and aerial passes separately). Halfway through, a person in a gorilla costume walked through the scene. Noticing was measured as whether participants answered \"yes\" when asked afterward if they saw anything unusual and could describe the gorilla. Participants agreed to take part and were told afterward about the gorilla and the study's purpose."], ["Results", "72% of the easy-task group noticed the gorilla. Only 45% of the hard-task group noticed it (p = .003)."], ["Discussion", "When attention was more heavily focused, more people missed an obvious, unexpected object."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "51%"], ["Male", "49%"], ["White", "58%"], ["Black", "17%"], ["Hispanic", "15%"], ["Asian", "10%"], ["Age 18–70", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of noticing.", "C": "Describe what the percentages who noticed the gorilla (72% vs. 45%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that a harder task increases inattentional blindness."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["yes", "said", "answer"], ["describe", "unusual", "gorilla"]], "labels": ["Says it was answering yes when asked", "Gives a detail from this study (saw something unusual and could describe the gorilla)"]}, "C": {"nums": ["72", "45"], "meaning": ["notic", "miss", "saw", "gorilla"], "subject": ["easy", "hard", "task"], "kind": "groups"}, "D": {"eth": [{"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}], "notIn": ["confid", "withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "museum"], "demo": ["51%", "49%", "58%", "17%", "15%", "10%", "100%", "female", "male", "white", "black", "hispanic", "asian", "age 18–70", "museum", "illinois", "volunteer", "34.8", "18", "70"]}, "F": {"data": ["72", "45"], "concept": ["notic", "miss", "saw", "gorilla", "easy", "hard", "task"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to an easy or hard counting task, and the researchers manipulated task difficulty.", "B": "Noticing was operationally defined as whether participants said \"yes\" when asked if they saw anything unusual and could describe the gorilla.", "C": "The percentages indicate that more people in the easy-task group noticed the gorilla (72%) than in the hard-task group (45%), so the harder task made people more likely to miss it.", "D": "The researchers followed debriefing: afterward, participants were told about the gorilla and the study's purpose.", "E": "The findings are fairly generalizable because participants ranged from 18 to 70 years old and the sample was diverse (58% White, 17% Black, 15% Hispanic), but all were museum visitors in Illinois who volunteered, so they may not represent people who do not visit museums, or children.", "F": "The results support the hypothesis. Only 45% of the hard-task group noticed the gorilla compared with 72% of the easy-task group (p = .003), which shows that when attention is more focused on a demanding task, people are more likely to miss a visible, unexpected object."}}, {"id": "hearing", "title": "Age and Hearing Thresholds", "topic": "Sensation & perception · Thresholds", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "The absolute threshold is the weakest stimulus a person can detect 50% of the time. Researchers examined whether age is related to the absolute threshold for high-pitched sounds."], ["Participants", "400 adults from Melbourne, Australia, took part. Participants were 20 to 79 years old (mean age 49.5). See the table for demographics."], ["Method", "Each participant sat in a soundproof booth and heard high-pitched (8,000 Hz) tones at different volumes. Hearing threshold was measured as the quietest volume, in decibels, that a participant detected on 50% of trials. Age was taken from each participant's birth date. No one was assigned to groups. Participants signed consent forms and anyone with a threshold suggesting hearing loss was given a referral to an audiologist."], ["Results", "Age was positively correlated with hearing threshold (r = +.67, p < .001). Participants in their 20s had an average threshold of 12 decibels, while participants in their 70s had an average of 54 decibels."], ["Discussion", "Older adults needed much louder high-pitched sounds to detect them."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "52%"], ["Men", "48%"], ["White", "71%"], ["Asian", "21%"], ["Other", "8%"], ["Age 20–79", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of hearing threshold.", "C": "Describe what the correlation coefficient (r = +.67) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that hearing for high-pitched sounds gets worse with age."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["decibel", "db", "volume", "quietest"], ["50%", "half", "8,000", "8000", "tone", "trials"]], "labels": ["Says it was the quietest volume in decibels", "Gives a detail from this study (8,000 Hz tone, detected 50% of the time)"]}, "C": {"nums": [".67", "12", "54"], "meaning": ["hear", "threshold", "louder", "sound"], "subject": ["age", "older", "younger"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["referral", "audiologist", "referred"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "factory"], "demo": ["52%", "48%", "71%", "21%", "8%", "100%", "women", "men", "white", "asian", "other", "age 20–79", "melbourne", "australia", "49.5", "20", "79"]}, "F": {"data": [".67", "12", "54"], "concept": ["hear", "threshold", "louder", "sound", "age", "older", "younger"]}}, "model": {"A": "The research method is a correlational study because the researchers measured age and hearing threshold without manipulating either variable.", "B": "Hearing threshold was operationally defined as the quietest volume in decibels at which a participant detected an 8,000 Hz tone on 50% of trials.", "C": "The correlation of r = +.67 indicates a strong positive relationship: older participants tended to have higher thresholds, meaning they needed louder sounds to hear high-pitched tones.", "D": "The researchers followed protection from harm: anyone with a threshold suggesting hearing loss was referred to an audiologist.", "E": "The findings may not generalize to everyone because participants were adults from Melbourne, Australia, and 71% were White. They may apply to adults in similar cities but cannot be confidently extended to children or to people with different noise exposure, such as factory workers.", "F": "The results support the hypothesis. Age was strongly correlated with hearing threshold (r = +.67), with people in their 20s detecting tones at 12 decibels compared with 54 decibels for people in their 70s, which shows that hearing for high-pitched sounds declines with age (though this correlational design cannot rule out other causes like noise exposure)."}}, {"id": "vr", "title": "Virtual Reality Distraction and Pain During Dental Work", "topic": "Sensation & perception · Pain", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Gate control theory says distraction can \"close the gate\" to pain signals. Researchers tested the hypothesis that virtual reality distraction reduces pain during dental cleanings."], ["Participants", "80 dental patients at a clinic in Spain took part. Participants were 18 to 65 years old (mean age 41.0). See the table for demographics."], ["Method", "Patients were randomly assigned to wear a VR headset showing an underwater world during their cleaning or to have a standard cleaning with no headset. Pain was measured as the patient's rating on a 0 to 100 scale right after the cleaning. Patients signed consent forms and were told they could remove the headset or stop the cleaning at any time."], ["Results", "The VR group rated their pain at 22 on average. The standard group rated it at 41 (p < .001)."], ["Discussion", "Immersive distraction cut pain ratings nearly in half."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "56%"], ["Men", "44%"], ["Spanish", "89%"], ["Other", "11%"], ["Age 18–65", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of pain.", "C": "Describe what the difference in mean pain ratings indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that virtual reality distraction reduces pain."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["rating", "rate", "scale", "score"], ["100", "0 to 100", "after"]], "labels": ["Says it was a rating on a scale", "Gives a detail from this study (0–100, right after the cleaning)"]}, "C": {"nums": ["22", "41"], "meaning": ["pain", "hurt", "less"], "subject": ["vr", "virtual", "headset", "standard"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["confid", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "surgery"], "demo": ["56%", "44%", "89%", "11%", "100%", "women", "men", "spanish", "other", "age 18–65", "spain", "spanish", "clinic", "41.0"]}, "F": {"data": ["22", "41"], "concept": ["pain", "hurt", "less", "vr", "virtual", "headset", "standard"]}}, "model": {"A": "The research method is an experiment because patients were randomly assigned to have a VR headset or a standard cleaning, and the researchers manipulated whether patients used VR.", "B": "Pain was operationally defined as the patient's rating on a 0 to 100 scale right after the dental cleaning.", "C": "The VR group rated their pain lower (22) than the standard group (41), which indicates that the VR distraction reduced how much pain patients felt.", "D": "The researchers followed the right to withdraw: patients were told they could remove the headset or stop the cleaning at any time.", "E": "The findings may not generalize to everyone because 89% of participants were Spanish adults at one dental clinic. They may apply to adult dental patients in Spain but cannot be confidently extended to children or to more intense pain such as surgery.", "F": "The results support the hypothesis. Patients using VR rated their pain at 22 compared with 41 for standard cleanings (p < .001), which shows that distraction reduced pain, consistent with gate control theory's idea that attention elsewhere can close the gate to pain signals."}}, {"id": "supertaste", "title": "Taste Sensitivity and Vegetable Eating", "topic": "Sensation & perception · Taste", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Supertasters have more taste buds and experience bitter tastes more strongly. Researchers examined whether taste sensitivity is related to how many vegetables people eat."], ["Participants", "250 adults from Vermont took part. Participants were 20 to 65 years old (mean age 44.2). See the table for demographics."], ["Method", "Taste sensitivity was measured as the number of taste buds counted in a 6 mm circle on the tip of the tongue, using blue dye and a magnified photo. Vegetable intake was measured as the number of vegetable servings per week reported in a food diary kept for 2 weeks. Participants were not assigned to eat anything. Participants gave informed consent and were told they could withdraw at any time."], ["Results", "The number of taste buds was negatively correlated with vegetable servings per week (r = -.29, p < .01). People with the most taste buds ate 11 servings a week on average, compared with 17 servings for people with the fewest."], ["Discussion", "People with more taste buds tended to eat fewer vegetables, possibly because many vegetables taste bitter to them."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "61%"], ["Men", "39%"], ["White", "93%"], ["Other", "7%"], ["Age 20–65", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of taste sensitivity.", "C": "Describe what the correlation coefficient (r = -.29) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that being a supertaster causes people to eat fewer vegetables."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["number", "count", "how many"], ["taste bud", "6 mm", "tongue", "dye", "photo"]], "labels": ["Says it was the number of taste buds", "Gives a detail from this study (6 mm circle on the tongue, blue dye photo)"]}, "C": {"nums": [".29", "11", "17"], "meaning": ["vegetable", "eat", "fewer", "servings"], "subject": ["taste", "buds", "supertaster"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["confid", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "other cultures"], "demo": ["61%", "39%", "93%", "7%", "100%", "women", "men", "white", "other", "age 20–65", "vermont", "44.2", "20", "65"]}, "F": {"data": [".29", "11", "17"], "concept": ["vegetable", "eat", "fewer", "servings", "taste", "buds", "supertaster"], "stanceWant": "refute", "stanceHint": "The claim says being a supertaster CAUSES eating fewer vegetables. A correlation can't show cause, so say the results only partly support (or don't support) the causal claim."}}, "model": {"A": "The research method is a correlational study because the researchers measured taste buds and vegetable intake without manipulating anything or assigning groups.", "B": "Taste sensitivity was operationally defined as the number of taste buds counted in a 6 mm circle on the tip of the tongue using blue dye and a magnified photo.", "C": "The correlation of r = -.29 indicates a weak-to-moderate negative relationship: people with more taste buds tended to eat fewer servings of vegetables each week.", "D": "The researchers followed the right to withdraw: participants were told they could withdraw at any time.", "E": "The findings may not generalize because 93% of participants were White adults from Vermont. They may apply to White adults in similar areas but cannot be confidently extended to people from cultures with different diets, or to children.", "F": "The results only partly support the claim. Taste buds were negatively correlated with vegetable intake (r = -.29), with the most sensitive tasters eating 11 servings a week versus 17 for the least, but because this is a correlational study it cannot show that sensitivity causes lower intake; family food habits could also explain it."}}, {"id": "erp", "title": "Exposure and Response Prevention for OCD", "topic": "Treatment · OCD", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Exposure and response prevention (ERP) has people face triggers without doing their compulsions. Researchers tested the hypothesis that ERP reduces OCD symptoms more than relaxation training."], ["Participants", "72 adults diagnosed with OCD from two clinics in Massachusetts took part. Participants were 19 to 58 years old (mean age 33.6). See the table for demographics."], ["Method", "Participants were randomly assigned to 12 weekly sessions of ERP or 12 weekly sessions of relaxation training. OCD symptoms were measured with the Yale-Brown Obsessive Compulsive Scale (Y-BOCS), scored 0 to 40, by an interviewer who did not know each participant's group. The hospital review board approved the study, participants signed consent forms, and relaxation participants were offered ERP afterward."], ["Results", "ERP participants' Y-BOCS scores dropped from 26.1 to 14.3 (11.8 points). Relaxation participants' scores dropped from 25.7 to 22.9 (2.8 points). The difference was significant (p < .001)."], ["Discussion", "ERP greatly reduced OCD symptoms compared with relaxation alone."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "58%"], ["Men", "42%"], ["White", "81%"], ["Hispanic", "8%"], ["Black", "6%"], ["Asian", "5%"], ["Age 19–58", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of OCD symptoms.", "C": "Describe what the drops in mean Y-BOCS scores indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that ERP reduces OCD symptoms more than relaxation training."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "y-bocs", "ybocs", "yale"], ["40", "0 to 40", "interview"]], "labels": ["Names the measure (score on the Yale-Brown scale)", "Gives a detail from this study (0–40, given by an interviewer)"]}, "C": {"nums": ["11.8", "2.8", "14.3", "22.9"], "meaning": ["ocd", "symptom", "reduc", "drop"], "subject": ["erp", "exposure", "relaxation"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["offered", "afterward", "after"]}], "notIn": ["confid", "withdraw", "debrief"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "teens"], "demo": ["58%", "42%", "81%", "8%", "6%", "5%", "100%", "women", "men", "white", "hispanic", "black", "asian", "age 19–58", "massachusetts", "two clinics", "33.6"]}, "F": {"data": ["11.8", "2.8", "14.3", "22.9"], "concept": ["ocd", "symptom", "reduc", "drop", "erp", "exposure", "relaxation"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to ERP or relaxation training, and the researchers manipulated the type of therapy.", "B": "OCD symptoms were operationally defined as the score on the Yale-Brown Obsessive Compulsive Scale (0 to 40) given by an interviewer who did not know each participant's group.", "C": "ERP participants' scores dropped by 11.8 points while relaxation participants' dropped by only 2.8, which indicates that ERP reduced OCD symptoms much more than relaxation.", "D": "The researchers followed institutional approval: the hospital review board approved the study.", "E": "The findings may not generalize to everyone with OCD because 81% of participants were White adults from two Massachusetts clinics. They may apply to White adults seeking treatment but cannot be confidently extended to children, teens, or more diverse groups.", "F": "The results support the hypothesis. Y-BOCS scores dropped 11.8 points with ERP compared with 2.8 with relaxation (p < .001), which shows that facing triggers without doing compulsions, not just learning to relax, is what reduced OCD symptoms."}}, {"id": "dogs", "title": "Service Dogs and PTSD Symptoms in Veterans", "topic": "Trauma disorders · Treatment", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that having a trained service dog reduces PTSD symptoms in military veterans."], ["Participants", "140 military veterans diagnosed with PTSD from VA clinics in three states took part. Participants were 25 to 68 years old (mean age 44.9). See the table for demographics."], ["Method", "Veterans were randomly assigned to receive a service dog right away or to a waitlist group that continued usual care and received a dog after 3 months. PTSD symptoms were measured with the PCL-5 checklist (scored 0 to 80, higher = more severe). Veterans gave informed consent, could leave the study at any time while keeping their usual care, and their information was kept confidential."], ["Results", "After 3 months, the service dog group's PCL-5 scores dropped by 12.4 points on average. The waitlist group's scores dropped by 4.1 points (p = .002)."], ["Discussion", "Service dogs led to a meaningful drop in PTSD symptoms on top of usual care."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Men", "82%"], ["Women", "18%"], ["White", "69%"], ["Black", "18%"], ["Hispanic", "9%"], ["Other", "4%"], ["Age 25–68", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of PTSD symptoms.", "C": "Describe what the drops in mean PCL-5 scores indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that service dogs reduce PTSD symptoms."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "pcl"], ["80", "0 to 80", "checklist", "higher"]], "labels": ["Names the measure (score on the PCL-5)", "Gives a detail from this study (0–80, higher = more severe)"]}, "C": {"nums": ["12.4", "4.1"], "meaning": ["ptsd", "symptom", "reduc", "drop"], "subject": ["dog", "waitlist"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "civilians", "women"], "demo": ["82%", "18%", "69%", "18%", "9%", "4%", "100%", "men", "women", "white", "black", "hispanic", "other", "age 25–68", "veteran", "military", "three states", "44.9", "82%"]}, "F": {"data": ["12.4", "4.1"], "concept": ["ptsd", "symptom", "reduc", "drop", "dog", "waitlist"]}}, "model": {"A": "The research method is an experiment because veterans were randomly assigned to get a service dog or to a waitlist, and the researchers manipulated whether veterans had a dog.", "B": "PTSD symptoms were operationally defined as the score on the PCL-5 checklist, scored 0 to 80 with higher scores meaning more severe symptoms.", "C": "The service dog group's scores dropped by 12.4 points compared with 4.1 points for the waitlist group, which indicates that veterans with service dogs had a much larger reduction in PTSD symptoms.", "D": "The researchers followed the right to withdraw: veterans could leave the study at any time while keeping their usual care.", "E": "The findings may not generalize to everyone with PTSD because 82% of participants were male military veterans. They may apply to male veterans but cannot be confidently extended to women, civilians with PTSD from other traumas, or children.", "F": "The results support the hypothesis. Veterans with service dogs had PCL-5 scores drop by 12.4 points compared with 4.1 for the waitlist group (p = .002), which shows that having a service dog reduced PTSD symptoms beyond the effect of usual care alone."}}, {"id": "thinideal", "title": "Thin-Ideal Images and Body Dissatisfaction", "topic": "Eating disorders · Social influence", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that looking at idealized thin images on social media increases body dissatisfaction in young women."], ["Participants", "160 female college students in Sydney, Australia, took part. Participants were 17 to 25 years old (mean age 19.4). See the table for demographics."], ["Method", "Participants were randomly assigned to scroll through 30 social media posts showing thin, edited models or 30 posts showing travel destinations, for 10 minutes. Body dissatisfaction was measured as the rating on a 0 to 100 line (\"How dissatisfied are you with your body right now?\") before and after scrolling. Participants were screened for eating disorders, and anyone at risk was not included and was given support resources. Everyone was debriefed and shown an article on how photos are edited."], ["Results", "Body dissatisfaction increased by 14.2 points in the thin-image group and by 1.3 points in the travel group (p < .001)."], ["Discussion", "Just 10 minutes of thin-ideal images raised body dissatisfaction."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "100%"], ["White", "63%"], ["Asian", "27%"], ["Other", "10%"], ["Age 17–25", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of body dissatisfaction.", "C": "Describe what the increases in mean body dissatisfaction indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that thin-ideal images increase body dissatisfaction."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["rating", "rate", "scale", "line"], ["100", "0 to 100", "dissatisfied", "before and after"]], "labels": ["Says it was a rating on a scale", "Gives a detail from this study (0–100 line, before and after scrolling)"]}, "C": {"nums": ["14.2", "1.3"], "meaning": ["dissatisf", "body", "worse"], "subject": ["thin", "travel", "image", "posts"], "kind": "groups"}, "D": {"eth": [{"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["screen", "support", "not included", "at risk"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}], "notIn": ["consent", "confid", "withdraw", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "men", "older women"], "demo": ["100%", "63%", "27%", "10%", "100%", "female", "white", "asian", "other", "age 17–25", "sydney", "australia", "female", "college", "19.4"]}, "F": {"data": ["14.2", "1.3"], "concept": ["dissatisf", "body", "worse", "thin", "travel", "image", "posts"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to view thin-model posts or travel posts, and the researchers manipulated the type of images.", "B": "Body dissatisfaction was operationally defined as the rating on a 0 to 100 line answering \"How dissatisfied are you with your body right now?\" before and after scrolling.", "C": "Body dissatisfaction rose by 14.2 points in the thin-image group but only 1.3 points in the travel group, which indicates that viewing thin-ideal images made women feel much worse about their bodies.", "D": "The researchers followed protection from harm: participants were screened for eating disorders, and anyone at risk was not included and was given support resources.", "E": "The findings may not generalize to everyone because 100% of participants were female college students in Sydney aged 17 to 25. They may apply to young women but cannot be confidently extended to men, older women, or people from other cultures.", "F": "The results support the hypothesis. Body dissatisfaction increased by 14.2 points after viewing thin-ideal images compared with 1.3 points after travel images (p < .001), which shows that the images themselves, not just using social media, raised body dissatisfaction."}}, {"id": "adhdbreaks", "title": "Movement Breaks and On-Task Behavior in Students with ADHD", "topic": "Neurodevelopmental disorders · ADHD", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that short movement breaks help students with ADHD stay on task."], ["Participants", "54 students diagnosed with ADHD from six elementary schools in Florida took part. Students were 7 to 11 years old (mean age 9.1). See the table for demographics."], ["Method", "Students were randomly assigned to have three 5-minute movement breaks (jumping, stretching) during the school day or three 5-minute quiet reading breaks. On-task behavior was measured as the percentage of 15-second intervals in which a trained observer, who did not know each student's group, saw the student looking at their work or the teacher during a 30-minute math lesson. Parents gave written consent, students agreed, and their names were not used in reports."], ["Results", "Students with movement breaks were on task during 79% of intervals. Students with reading breaks were on task during 62% (p = .004)."], ["Discussion", "Short bursts of physical activity improved focus during class."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Male", "74%"], ["Female", "26%"], ["White", "45%"], ["Hispanic", "31%"], ["Black", "19%"], ["Other", "5%"], ["Age 7–11", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of on-task behavior.", "C": "Describe what the percentages (79% vs. 62%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that movement breaks help students with ADHD stay on task."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["percentage", "percent", "%"], ["15-second", "15 second", "interval", "observer", "looking at"]], "labels": ["Says it was the percentage of intervals", "Gives a detail from this study (15-second intervals, looking at work or teacher)"]}, "C": {"nums": ["79", "62"], "meaning": ["task", "focus", "attention"], "subject": ["movement", "reading", "break"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "girls", "teens", "adults"], "demo": ["74%", "26%", "45%", "31%", "19%", "5%", "100%", "male", "female", "white", "hispanic", "black", "other", "age 7–11", "florida", "six", "elementary", "9.1", "7", "11"]}, "F": {"data": ["79", "62"], "concept": ["task", "focus", "attention", "movement", "reading", "break"]}}, "model": {"A": "The research method is an experiment because students were randomly assigned to movement breaks or reading breaks, and the researchers manipulated the type of break.", "B": "On-task behavior was operationally defined as the percentage of 15-second intervals in which a trained observer saw the student looking at their work or the teacher during a 30-minute math lesson.", "C": "Students with movement breaks were on task more often (79% of intervals) than students with reading breaks (62%), which indicates that movement breaks helped students with ADHD focus better.", "D": "The researchers followed informed consent: parents gave written consent and students agreed to take part.", "E": "The findings may not generalize to all people with ADHD because participants were 7 to 11-year-old elementary students in Florida, and 74% were boys. They may apply to young boys with ADHD but cannot be confidently extended to girls, teens, or adults.", "F": "The results support the hypothesis. Students with movement breaks were on task during 79% of intervals compared with 62% for reading breaks (p = .004), which shows that physical activity, not just any break, improved focus for students with ADHD."}}, {"id": "cannabis", "title": "Teen Cannabis Use and Later Psychosis", "topic": "Schizophrenia · Drugs", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers examined whether heavy cannabis use in the teen years is related to developing a psychotic disorder in adulthood."], ["Participants", "45,000 men who were drafted into the military in Sweden at age 18 were followed for 15 years. See the table for demographics."], ["Method", "At age 18, each man reported how many times he had used cannabis. Psychosis was measured as whether he was later diagnosed with schizophrenia or another psychotic disorder in national hospital records. The researchers did not assign anyone to use cannabis. The national ethics board approved the study, and records were linked using codes rather than names."], ["Results", "Men who had used cannabis more than 50 times by age 18 were 3.1 times as likely to be diagnosed with a psychotic disorder as men who never used it. Use was positively correlated with later diagnosis (r = +.12, p < .001)."], ["Discussion", "Heavy teen cannabis use was linked to later psychosis. Because the study was correlational, the researchers note that early symptoms might have led some men to use cannabis."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Men", "100%"], ["Swedish", "97%"], ["Other", "3%"], ["Age at start", "18"], ["Years followed", "15"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of psychosis.", "C": "Describe what the finding that heavy users were 3.1 times as likely to be diagnosed indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that teen cannabis use causes psychotic disorders."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["diagnos"], ["hospital", "records", "schizophrenia", "psychotic", "15 years"]], "labels": ["Says it was a diagnosis", "Gives a detail from this study (schizophrenia or psychotic disorder in national hospital records)"]}, "C": {"nums": ["3.1", "50 times"], "meaning": ["psychosis", "psychotic", "schizophrenia", "likely", "risk"], "subject": ["cannabis", "marijuana", "user"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["consent", "withdraw", "debrief", "harm"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "women", "other countries"], "demo": ["100%", "97%", "3%", "18", "15", "men", "swedish", "other", "age at start", "years followed", "sweden", "swedish", "military", "men", "45,000", "18"]}, "F": {"data": ["3.1", ".12", "50"], "concept": ["psychosis", "psychotic", "schizophrenia", "likely", "risk", "cannabis", "marijuana", "user"], "stanceWant": "refute", "stanceHint": "The claim says cannabis CAUSES psychosis. A correlational study can't prove cause, so say the results only partly support the causal claim, and give the alternative explanation."}}, "model": {"A": "The research method is a correlational study because the researchers measured cannabis use and later diagnoses without assigning anyone to use cannabis.", "B": "Psychosis was operationally defined as being diagnosed with schizophrenia or another psychotic disorder in national hospital records during the 15 years after age 18.", "C": "It indicates that men who used cannabis more than 50 times by age 18 had a much higher risk of psychosis: they were more than three times as likely to be diagnosed as men who never used it.", "D": "The researchers followed confidentiality: records were linked using codes rather than names.", "E": "The findings may not generalize to everyone because 100% of participants were men and 97% were Swedish military recruits. They may apply to Swedish men but cannot be confidently extended to women or to people in countries with different cannabis potency.", "F": "The results partly support the claim. Heavy users were 3.1 times as likely to be diagnosed with a psychotic disorder (r = +.12), which shows a link, but because this is correlational it cannot prove cannabis caused psychosis: early symptoms of schizophrenia may have led some men to use cannabis."}}, {"id": "lithium", "title": "Lithium and Relapse in Bipolar Disorder", "topic": "Bipolar disorders · Medications", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Mood stabilizers such as lithium are used to treat bipolar disorder. Researchers tested the hypothesis that lithium prevents mood episodes better than a placebo."], ["Participants", "180 adults with bipolar I disorder from hospitals in the United Kingdom took part. Participants were 21 to 65 years old (mean age 42.0). See the table for demographics."], ["Method", "All participants were currently stable. They were randomly assigned to take lithium or an identical placebo pill daily for 18 months, in a double-blind design. Relapse was measured as having a manic or depressive episode severe enough to need a change in treatment, as decided by a psychiatrist. Participants gave informed consent, their blood was checked monthly for safe lithium levels, and anyone who relapsed was immediately given full treatment."], ["Results", "By 18 months, 31% of the lithium group had relapsed, compared with 63% of the placebo group (p < .001)."], ["Discussion", "Lithium cut the relapse rate roughly in half."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "57%"], ["Men", "43%"], ["White", "84%"], ["Black", "8%"], ["Asian", "6%"], ["Other", "2%"], ["Age 21–65", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of relapse.", "C": "Describe what the relapse percentages (31% vs. 63%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that lithium prevents mood episodes."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["episode", "relapse"], ["manic", "depressive", "psychiatrist", "change in treatment", "18 months"]], "labels": ["Says it was having a mood episode", "Gives a detail from this study (manic or depressive episode needing a treatment change, judged by a psychiatrist)"]}, "C": {"nums": ["31", "63"], "meaning": ["relapse", "episode", "less likely", "prevent"], "subject": ["lithium", "placebo"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["blood", "monthly", "safe", "relapsed"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "bipolar ii", "teens"], "demo": ["57%", "43%", "84%", "8%", "6%", "2%", "100%", "women", "men", "white", "black", "asian", "other", "age 21–65", "united kingdom", "uk", "british", "hospital", "42.0"]}, "F": {"data": ["31", "63"], "concept": ["relapse", "episode", "less likely", "prevent", "lithium", "placebo"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to take lithium or a placebo, and the researchers manipulated which pill participants received.", "B": "Relapse was operationally defined as having a manic or depressive episode severe enough to need a change in treatment, as decided by a psychiatrist within 18 months.", "C": "The percentages indicate that people taking lithium were much less likely to relapse (31%) than people taking a placebo (63%), so lithium roughly halved the chance of a new mood episode.", "D": "The researchers followed protection from harm: participants' blood was checked monthly for safe lithium levels, and anyone who relapsed immediately got full treatment.", "E": "The findings may not generalize to everyone with bipolar disorder because 84% of participants were White adults from UK hospitals, and all had bipolar I. They may apply to White British adults with bipolar I but cannot be confidently extended to people with bipolar II, teens, or other ethnic groups.", "F": "The results support the hypothesis. Only 31% of the lithium group relapsed compared with 63% of the placebo group (p < .001), and because the design was double-blind with a placebo, this shows lithium itself, not expectations, prevented mood episodes."}}, {"id": "tms", "title": "rTMS for Treatment-Resistant Depression", "topic": "Treatment · Brain stimulation", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Repetitive transcranial magnetic stimulation (rTMS) uses magnetic pulses to stimulate the brain. Researchers tested the hypothesis that rTMS reduces depression in people who did not improve with medication."], ["Participants", "120 adults with treatment-resistant depression from four clinics in South Korea took part. Participants were 20 to 64 years old (mean age 45.3). See the table for demographics."], ["Method", "Participants were randomly assigned to real rTMS or \"sham\" rTMS, which looked and sounded the same but did not deliver magnetic pulses. Both groups had 20 sessions over 4 weeks. Depression was measured with the Hamilton Depression Rating Scale (HAM-D, 0 to 52) by raters who did not know the group. Participants gave informed consent and were told they might receive the sham treatment; sham participants were offered real rTMS afterward."], ["Results", "The real rTMS group's HAM-D scores dropped by 9.6 points on average. The sham group's scores dropped by 4.2 points (p = .001). 38% of the real group went into remission, compared with 15% of the sham group."], ["Discussion", "rTMS reduced depression in patients who had not responded to medication, with no memory side effects reported."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "61%"], ["Men", "39%"], ["Korean", "100%"], ["Age 20–64", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of depression.", "C": "Describe what the remission percentages (38% vs. 15%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that rTMS reduces treatment-resistant depression."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "ham-d", "hamilton"], ["52", "0 to 52", "rater", "did not know"]], "labels": ["Names the measure (score on the Hamilton scale)", "Gives a detail from this study (0–52, by raters who did not know the group)"]}, "C": {"nums": ["38", "15"], "meaning": ["remission", "recover", "better", "depress"], "subject": ["rtms", "real", "sham"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["offered", "afterward"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "other cultures"], "demo": ["61%", "39%", "100%", "100%", "women", "men", "korean", "age 20–64", "south korea", "korean", "four clinics", "45.3"]}, "F": {"data": ["9.6", "4.2", "38", "15", ".001"], "concept": ["remission", "recover", "better", "depress", "rtms", "real", "sham"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to real or sham rTMS, and the researchers manipulated whether participants received real magnetic pulses.", "B": "Depression was operationally defined as the score on the Hamilton Depression Rating Scale (0 to 52) given by raters who did not know each participant's group.", "C": "The percentages indicate that far more patients recovered with real rTMS: 38% of the real group went into remission compared with only 15% of the sham group.", "D": "The researchers followed informed consent: participants agreed to the study after being told they might receive the sham treatment.", "E": "The findings may not generalize widely because 100% of participants were Korean adults with treatment-resistant depression. They may apply to Korean adults who did not respond to medication but cannot be confidently extended to teens, people from other cultures, or people with milder depression.", "F": "The results support the hypothesis. Real rTMS reduced HAM-D scores by 9.6 points compared with 4.2 for sham (p = .001), and 38% of the real group reached remission versus 15% of the sham group, which shows the magnetic stimulation itself, not just the experience of treatment, reduced depression."}}, {"id": "lighttx", "title": "Bright Light Therapy and Seasonal Depression", "topic": "Depressive disorders · Treatment", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that daily bright light therapy reduces depression that appears in winter."], ["Participants", "56 adults with winter-pattern depression from Minnesota took part. Participants were 22 to 60 years old (mean age 39.8). See the table for demographics."], ["Method", "Participants were randomly assigned to sit in front of a bright light box (10,000 lux) or a dim red light (placebo) for 30 minutes each morning for 6 weeks. Depression was measured with the Beck Depression Inventory (BDI, 0 to 63). The study was approved by the university's review board, participants signed consent forms, and those who got worse were referred for additional treatment."], ["Results", "The bright light group's BDI scores dropped from 24.5 to 11.9. The dim light group's scores dropped from 23.8 to 19.6 (p < .001)."], ["Discussion", "Bright morning light substantially reduced winter depression symptoms."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "70%"], ["Men", "30%"], ["White", "90%"], ["Other", "10%"], ["Age 22–60", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of depression.", "C": "Describe what the change in mean BDI scores indicates about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that bright light therapy reduces winter depression."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "bdi", "beck"], ["63", "0 to 63", "inventory"]], "labels": ["Names the measure (score on the Beck Depression Inventory)", "Gives a detail from this study (scored 0–63)"]}, "C": {"nums": ["24.5", "11.9", "23.8", "19.6", "12.6", "4.2"], "meaning": ["depress", "reduc", "drop", "lower"], "subject": ["bright", "dim", "light"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["referred", "worse"]}], "notIn": ["confid", "withdraw", "debrief"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "men", "sunny"], "demo": ["70%", "30%", "90%", "10%", "100%", "women", "men", "white", "other", "age 22–60", "minnesota", "39.8", "70%", "90%"]}, "F": {"data": ["24.5", "11.9", "23.8", "19.6", "12.6", "4.2"], "concept": ["depress", "reduc", "drop", "lower", "bright", "dim", "light"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to a bright light box or a dim red light, and the researchers manipulated light brightness.", "B": "Depression was operationally defined as the score on the Beck Depression Inventory, scored 0 to 63.", "C": "The bright light group's scores dropped by about 12.6 points (24.5 to 11.9) while the dim light group's dropped by about 4.2 points (23.8 to 19.6), which indicates that bright light reduced depression much more.", "D": "The researchers followed institutional approval: the university's review board approved the study.", "E": "The findings may not generalize to everyone because 90% of participants were White adults from Minnesota, where winters are long and dark, and 70% were women. They may apply to adults in northern climates but cannot be confidently extended to people in sunny regions or to men.", "F": "The results support the hypothesis. BDI scores fell from 24.5 to 11.9 with bright light compared with 23.8 to 19.6 with dim light (p < .001), which shows that the bright light itself, not just sitting in front of a lamp, reduced winter depression."}}, {"id": "selfies", "title": "Narcissism and Selfie Posting", "topic": "Personality disorders · Social media", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers examined whether narcissistic traits are related to how often people post selfies."], ["Participants", "800 adults in the United Kingdom completed the study online. Participants were 18 to 40 years old (mean age 27.3). See the table for demographics."], ["Method", "Narcissism was measured as the score on the 16-item Narcissistic Personality Inventory (NPI-16, 0 to 16). Selfie posting was measured as the number of selfies each participant posted on social media in the past month, counted from their own accounts. No one was assigned to post anything. Participants agreed to an online consent form, and responses were anonymous."], ["Results", "Narcissism scores were positively correlated with selfie posting (r = +.28, p < .001). Participants in the top 10% of narcissism scores posted an average of 19 selfies a month, compared with 6 for the bottom 10%."], ["Discussion", "People with more narcissistic traits tended to post more selfies. The study could not tell whether posting selfies increases narcissism or the other way around."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "57%"], ["Men", "42%"], ["Nonbinary", "1%"], ["White", "82%"], ["Asian", "9%"], ["Black", "5%"], ["Other", "4%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of narcissism.", "C": "Describe what the correlation coefficient (r = +.28) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that posting selfies makes people more narcissistic."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["score", "npi", "narcissistic personality inventory"], ["16", "0 to 16", "items", "item"]], "labels": ["Names the measure (score on the Narcissistic Personality Inventory)", "Gives a detail from this study (16 items, scored 0–16)"]}, "C": {"nums": [".28", "19", "6"], "meaning": ["more", "post", "higher"], "subject": ["narciss", "selfie"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "older adults", "other cultures"], "demo": ["57%", "42%", "1%", "82%", "9%", "5%", "4%", "women", "men", "nonbinary", "white", "asian", "black", "other", "united kingdom", "uk", "british", "27.3", "18", "40"]}, "F": {"data": [".28", "19", "6", ".001"], "concept": ["more", "post", "higher", "narciss", "selfie"], "stanceWant": "refute", "stanceHint": "The claim says selfies MAKE people narcissistic (cause). A correlation can't show which way it goes, so say the results do not support (or only partly support) the causal claim."}}, "model": {"A": "The research method is a correlational study because the researchers measured narcissism and selfie posting without manipulating either or assigning groups.", "B": "Narcissism was operationally defined as the score on the 16-item Narcissistic Personality Inventory (0 to 16).", "C": "The correlation of r = +.28 indicates a weak-to-moderate positive relationship: people with higher narcissism scores tended to post more selfies.", "D": "The researchers followed confidentiality: responses were collected anonymously.", "E": "The findings may not generalize to everyone because participants were 18 to 40-year-old adults in the UK, 82% of whom were White. They may apply to young White British adults but cannot be confidently extended to teens, older adults, or people from other cultures.", "F": "The results do not support the claim that selfies make people more narcissistic. Narcissism and selfie posting were positively correlated (r = +.28), with high scorers posting 19 selfies a month versus 6, but because the study is correlational it cannot show direction: narcissistic people may simply post more selfies."}}, {"id": "cbti", "title": "CBT for Insomnia vs. Sleep Hygiene Advice", "topic": "Treatment · Sleep disorders", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that cognitive behavioral therapy for insomnia (CBT-I) improves sleep more than basic sleep hygiene advice."], ["Participants", "110 adults with insomnia from a sleep clinic in Montreal, Canada, took part. Participants were 25 to 70 years old (mean age 51.2). See the table for demographics."], ["Method", "Participants were randomly assigned to 6 weekly sessions of CBT-I (changing beliefs about sleep and setting a strict sleep schedule) or a single session of sleep hygiene advice (avoid caffeine, keep the room dark). Insomnia was measured as the number of minutes participants were awake after first falling asleep, averaged from 2 weeks of sleep diaries. Participants gave informed consent, and the hygiene group was offered CBT-I after the study."], ["Results", "Minutes awake per night dropped from 72 to 31 in the CBT-I group and from 70 to 61 in the sleep hygiene group (p < .001)."], ["Discussion", "CBT-I greatly reduced nighttime waking compared with basic advice."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "62%"], ["Men", "38%"], ["White", "79%"], ["Black", "8%"], ["Other", "13%"], ["Age 25–70", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of insomnia.", "C": "Describe what the changes in mean minutes awake indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that CBT-I improves sleep more than sleep hygiene advice."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["minutes", "time", "how long"], ["awake", "diary", "diaries", "after falling asleep", "2 weeks"]], "labels": ["Says it was measured in minutes", "Gives a detail from this study (minutes awake after falling asleep, from sleep diaries)"]}, "C": {"nums": ["72", "31", "70", "61", "41"], "meaning": ["awake", "sleep", "waking"], "subject": ["cbt", "hygiene", "advice"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["offered", "after the study"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens"], "demo": ["62%", "38%", "79%", "8%", "13%", "100%", "women", "men", "white", "black", "other", "age 25–70", "montreal", "canada", "one sleep clinic", "51.2"]}, "F": {"data": ["72", "31", "70", "61", "41"], "concept": ["awake", "sleep", "waking", "cbt", "hygiene", "advice"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to CBT-I or sleep hygiene advice, and the researchers manipulated the type of treatment.", "B": "Insomnia was operationally defined as the number of minutes participants were awake after first falling asleep, averaged from 2 weeks of sleep diaries.", "C": "Minutes awake dropped by 41 in the CBT-I group (72 to 31) but only by 9 in the hygiene group (70 to 61), which indicates that CBT-I reduced nighttime waking much more.", "D": "The researchers followed informed consent: participants agreed to take part after being informed about the study.", "E": "The findings may not generalize to everyone with insomnia because participants were adults from one sleep clinic in Montreal and 79% were White. They may apply to adults seeking treatment at a clinic but cannot be confidently extended to teens or people who never seek help.", "F": "The results support the hypothesis. Minutes awake fell from 72 to 31 with CBT-I compared with 70 to 61 with hygiene advice (p < .001), which shows that changing beliefs and behaviors about sleep worked better than general tips."}}, {"id": "alcoholdrive", "title": "Alcohol and Driving Errors in a Simulator", "topic": "Drugs · Depressants", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Alcohol is a depressant. Researchers tested the hypothesis that a moderate dose of alcohol increases driving errors."], ["Participants", "40 adults from Wellington, New Zealand, took part. All were 21 to 35 years old (mean age 26.7), held a driver's license, and were moderate drinkers. See the table for demographics."], ["Method", "Participants were randomly assigned to drink orange juice mixed with alcohol (bringing them to a blood alcohol level of about 0.06%) or orange juice with a small amount of alcohol rubbed on the rim of the glass for smell (placebo). After 30 minutes, they drove a 20-minute route in a driving simulator. Driving errors were measured as the number of times the simulated car crossed a lane line. Participants were screened by a doctor, stayed in the lab until their blood alcohol was zero, and were driven home by taxi."], ["Results", "The alcohol group crossed lane lines 14.3 times on average. The placebo group crossed lane lines 6.1 times (p < .001)."], ["Discussion", "Even moderate alcohol more than doubled lane errors."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Men", "55%"], ["Women", "45%"], ["European", "76%"], ["Māori", "14%"], ["Other", "10%"], ["Age 21–35", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of driving errors.", "C": "Describe what the difference in mean lane crossings indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that moderate alcohol increases driving errors."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["number", "times", "how many"], ["lane", "line", "simulat", "20-minute", "route"]], "labels": ["Says it was the number of times", "Gives a detail from this study (crossing a lane line in the simulator)"]}, "C": {"nums": ["14.3", "6.1"], "meaning": ["error", "lane", "driving", "more"], "subject": ["alcohol", "placebo"], "kind": "groups"}, "D": {"eth": [{"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["taxi", "zero", "stayed", "doctor", "screen"]}], "notIn": ["consent", "confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "older", "heavy drinkers"], "demo": ["55%", "45%", "76%", "14%", "10%", "100%", "men", "women"
