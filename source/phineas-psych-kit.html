ction time.", "C": "Describe what the correlation coefficient (r = -.41) indicates about video game play and reaction time.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that playing action video games causes faster reaction times."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["millisecond", "ms", "time", "how long", "how fast"], ["key", "dot", "press", "screen", "50 trials"]], "labels": ["Says it was measured as time in milliseconds", "Gives a detail from this study (pressing a key when a dot appears, 50 trials)"]}, "C": {"nums": [".41", "285", "342"], "meaning": ["reaction", "faster", "quicker"], "subject": ["video game", "gam", "play"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "women", "children"], "demo": ["71%", "29%", "44%", "38%", "9%", "9%", "100%", "male", "female", "hispanic", "white", "native american", "other", "age 18–26", "arizona", "community college", "20.8"]}, "F": {"data": [".41", "285", "342", ".001"], "concept": ["reaction", "faster", "quicker", "video game", "gam", "play"], "stanceWant": "refute", "stanceHint": "The claim says gaming CAUSES faster reactions. A correlational study can't show cause and effect, so the strongest answer says the results do not support (or only partly support) the causal claim."}}, "model": {"A": "The research method is a correlational study because the researchers measured hours of gaming and reaction time without manipulating either variable or randomly assigning participants.", "B": "Reaction time was operationally defined as the average number of milliseconds it took participants to press a key after a dot appeared on the screen, across 50 trials.", "C": "The correlation of r = -.41 indicates a moderate negative relationship: participants who played more hours of action video games tended to have lower (faster) reaction times.", "D": "The researchers followed confidentiality: participants' data were stored under ID numbers instead of names.", "E": "The findings may not generalize to everyone because 71% of participants were male and all were 18 to 26-year-old community college students in Arizona. They may apply to young adult men but cannot be confidently extended to women, children, or older adults.", "F": "The results do not support the claim that gaming causes faster reaction times. Although hours of play were negatively correlated with reaction time (r = -.41), this is a correlational study, so it cannot show cause and effect: people with naturally fast reactions might choose to play more action games."}}, {"id": "music", "title": "Background Music and Reading Comprehension", "topic": "Research methods · Attention", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Many students listen to music while they study. Researchers tested the hypothesis that music with lyrics hurts reading comprehension."], ["Participants", "90 students from one high school in Georgia took part. Students were 15 to 17 years old (mean age 16.0). See the table for demographics."], ["Method", "Students were randomly assigned to read a 1,200-word passage while listening to popular music with lyrics, the same music without lyrics, or silence. Reading comprehension was measured as the number of correct answers on a 20-question multiple-choice test taken right after reading. Parents signed permission forms and students agreed to take part. Students were told they could stop at any time without it affecting their grades."], ["Results", "The silence group averaged 15.6 correct answers. The instrumental group averaged 14.9. The lyrics group averaged 11.8. The lyrics group scored significantly lower than both other groups (p < .01), while the silence and instrumental groups did not differ significantly."], ["Discussion", "Lyrics, not music itself, appeared to interfere with reading. The researchers suggest that processing words in songs competes with processing words on the page."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "53%"], ["Male", "47%"], ["Black", "41%"], ["White", "37%"], ["Hispanic", "14%"], ["Asian", "8%"], ["Age 15–17", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of reading comprehension.", "C": "Describe what the mean test scores indicate about the three groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that music with lyrics hurts reading comprehension."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["correct", "score", "number", "answers"], ["20", "multiple-choice", "multiple choice", "test", "1,200", "passage"]], "labels": ["Says it was the number of correct answers", "Gives a detail from this study (20-question multiple-choice test after the passage)"]}, "C": {"nums": ["15.6", "14.9", "11.8"], "meaning": ["comprehension", "understand", "reading", "scored", "correct"], "subject": ["lyrics", "instrumental", "silence", "music"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["confid", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "adults", "college"], "demo": ["53%", "47%", "41%", "37%", "14%", "8%", "100%", "female", "male", "black", "white", "hispanic", "asian", "age 15–17", "georgia", "one high school", "16.0", "15", "17"]}, "F": {"data": ["15.6", "14.9", "11.8"], "concept": ["comprehension", "understand", "reading", "scored", "correct", "lyrics", "instrumental", "silence", "music"]}}, "model": {"A": "The research method is an experiment because students were randomly assigned to one of three listening conditions, and the researchers manipulated the type of background sound.", "B": "Reading comprehension was operationally defined as the number of correct answers on a 20-question multiple-choice test taken right after reading a 1,200-word passage.", "C": "The lyrics group scored lower (11.8) than the instrumental (14.9) and silence (15.6) groups, which indicates that music with lyrics reduced students' understanding of what they read, while instrumental music did not.", "D": "The researchers followed the right to withdraw: students were told they could stop at any time without it affecting their grades.", "E": "The findings may not generalize to all students because everyone came from one high school in Georgia and were 15 to 17 years old. They may apply to high school students but cannot be confidently extended to college students, adults, or students in other regions.", "F": "The results support the hypothesis. The lyrics group averaged 11.8 correct answers compared with 15.6 for silence and 14.9 for instrumental music (p < .01), which shows that lyrics specifically reduced comprehension, since instrumental music did not cause a significant drop."}}, {"id": "notes", "title": "Laptop vs. Handwritten Notes and Conceptual Learning", "topic": "Research methods · Memory", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that taking notes by hand leads to better understanding of lecture material than typing notes on a laptop."], ["Participants", "146 undergraduates at a university in New Jersey took part for course credit. Participants were 18 to 23 years old (mean age 19.8). See the table for demographics."], ["Method", "Participants were randomly assigned to take notes either by hand or on a laptop while watching a 15-minute recorded lecture. One week later, they took a test. Conceptual learning was measured as the number of points (out of 10) earned on five short-answer questions that asked participants to apply ideas from the lecture. Participants gave informed consent, and after the test they were told the full purpose of the study."], ["Results", "Handwriting participants scored an average of 6.8 points on conceptual questions. Laptop participants scored an average of 5.1 points (p = .002). Laptop users wrote 62% more words, often copying the lecture word for word."], ["Discussion", "Typing seemed to encourage copying without processing. The researchers note that all participants were students at one university."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "58%"], ["Male", "42%"], ["White", "55%"], ["Asian", "21%"], ["Hispanic", "14%"], ["Black", "10%"], ["Age 18–23", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of conceptual learning.", "C": "Describe what the difference in mean conceptual scores indicates about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that handwritten notes lead to better understanding than laptop notes."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["points", "score", "number"], ["10", "short-answer", "short answer", "apply", "five", "week"]], "labels": ["Says it was a score (points earned)", "Gives a detail from this study (five short-answer application questions, out of 10, a week later)"]}, "C": {"nums": ["6.8", "5.1"], "meaning": ["understand", "concept", "learn", "scored"], "subject": ["hand", "laptop", "typ"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}], "notIn": ["confid", "withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "college", "students"], "demo": ["58%", "42%", "55%", "21%", "14%", "10%", "100%", "female", "male", "white", "asian", "hispanic", "black", "age 18–23", "new jersey", "one university", "19.8"]}, "F": {"data": ["6.8", "5.1", ".002", "62%"], "concept": ["understand", "concept", "learn", "scored", "hand", "laptop", "typ"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to take notes by hand or on a laptop, and the researchers manipulated the note-taking method.", "B": "Conceptual learning was operationally defined as the number of points (out of 10) earned on five short-answer questions that asked participants to apply ideas from the lecture one week later.", "C": "Handwriting participants scored higher on conceptual questions (6.8) than laptop participants (5.1), which indicates that taking notes by hand led to better understanding of the lecture's ideas.", "D": "The researchers followed debriefing: after the test, participants were told the full purpose of the study.", "E": "The findings may not generalize to all learners because participants were 18 to 23-year-old undergraduates at one New Jersey university, and 55% were White. They may apply to college students but cannot be confidently extended to younger students, older adults, or other kinds of classes.", "F": "The results support the hypothesis. Handwriting participants averaged 6.8 points on conceptual questions compared with 5.1 for laptop users (p = .002), which shows that writing by hand led to deeper understanding, likely because laptop users copied the lecture word for word instead of processing it."}}, {"id": "bedscreen", "title": "Screen Time Before Bed and Sleep Onset", "topic": "Sleep · Correlation", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers examined whether using phones and tablets before bed is related to how long it takes teens to fall asleep."], ["Participants", "310 middle school students from two schools in Oregon took part. Students were 11 to 14 years old (mean age 12.6). See the table for demographics."], ["Method", "For two weeks, students wore a wrist sleep tracker and kept a diary. Bedtime screen use was measured as the number of minutes of screen use recorded in the hour before lights out. Sleep onset was measured as the number of minutes between lights out and falling asleep, as recorded by the wrist tracker. The researchers did not tell students how to use their devices. Parents gave consent and students gave assent. Names were replaced with codes before data were analyzed."], ["Results", "Bedtime screen use was positively correlated with time to fall asleep (r = +.38, p < .001). Students with more than 45 minutes of bedtime screen use took an average of 31 minutes to fall asleep, compared with 14 minutes for students with no screen use."], ["Discussion", "More screen time before bed was associated with taking longer to fall asleep. The researchers point out that anxious students might both use screens more and have trouble sleeping."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "49%"], ["Male", "51%"], ["White", "67%"], ["Hispanic", "19%"], ["Asian", "8%"], ["Other", "6%"], ["Age 11–14", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of sleep onset.", "C": "Describe what the correlation coefficient (r = +.38) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that using screens before bed causes teens to take longer to fall asleep."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["minutes", "time", "how long"], ["lights out", "fall asleep", "falling asleep", "tracker", "wrist"]], "labels": ["Says it was measured in minutes", "Gives a detail from this study (lights out to falling asleep, wrist tracker)"]}, "C": {"nums": [".38", "31", "14"], "meaning": ["sleep", "asleep", "longer"], "subject": ["screen", "phone", "device"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "middle school", "older teens"], "demo": ["49%", "51%", "67%", "19%", "8%", "6%", "100%", "female", "male", "white", "hispanic", "asian", "other", "age 11–14", "oregon", "two schools", "12.6", "11", "14"]}, "F": {"data": [".38", "31", "14", ".001"], "concept": ["sleep", "asleep", "longer", "screen", "phone", "device"], "stanceWant": "refute", "stanceHint": "The claim says screens CAUSE the delay. A correlational study can't show cause and effect, so say the results do not support (or only partly support) the causal claim, and why."}}, "model": {"A": "The research method is a correlational study because the researchers measured bedtime screen use and sleep onset without manipulating either or assigning students to groups.", "B": "Sleep onset was operationally defined as the number of minutes between lights out and falling asleep, as recorded by a wrist sleep tracker over two weeks.", "C": "The correlation of r = +.38 indicates a moderate positive relationship: students who used screens longer before bed tended to take longer to fall asleep.", "D": "The researchers followed confidentiality: students' names were replaced with codes before the data were analyzed.", "E": "The findings may not generalize to all teens because participants were 11 to 14-year-olds from two schools in Oregon, and 67% were White. They may apply to middle schoolers but cannot be confidently extended to older teens, adults, or more diverse communities.", "F": "The results do not fully support the causal claim. Screen use was positively correlated with sleep onset (r = +.38), and heavy users took 31 minutes to fall asleep versus 14 minutes for non-users, but because the study is correlational it cannot show that screens caused the delay: a third variable such as anxiety could cause both."}}, {"id": "bluelight", "title": "Blue-Light-Blocking Glasses and Sleep Quality", "topic": "Sleep · Circadian rhythm", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Light from screens can interfere with circadian rhythms. Researchers tested the hypothesis that wearing blue-light-blocking glasses in the evening improves sleep."], ["Participants", "48 adults with insomnia symptoms from a city in Norway took part. Participants were 22 to 55 years old (mean age 38.5). See the table for demographics."], ["Method", "Participants were randomly assigned to wear amber blue-light-blocking glasses or clear placebo glasses for the 3 hours before bed for two weeks. Participants did not know which glasses blocked blue light. Sleep quality was measured as the score on the Pittsburgh Sleep Quality Index (PSQI), a questionnaire scored 0 to 21, where lower scores mean better sleep. The study was approved by a regional ethics committee, and participants signed consent forms."], ["Results", "The amber-glasses group's PSQI scores improved from 11.2 to 7.4 (a drop of 3.8 points). The placebo group's scores improved from 11.0 to 10.1 (a drop of 0.9 points). The difference was statistically significant (p = .01)."], ["Discussion", "Blocking blue light in the evening improved sleep quality more than wearing clear glasses. The researchers note that the sample was small and all from one country."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "63%"], ["Men", "37%"], ["Norwegian", "92%"], ["Other", "8%"], ["Age 22–55", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of sleep quality.", "C": "Describe what the drops in mean PSQI scores indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that blue-light-blocking glasses improve sleep."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "psqi", "pittsburgh"], ["0 to 21", "21", "questionnaire", "lower"]], "labels": ["Names the measure (score on the Pittsburgh Sleep Quality Index)", "Gives a detail from this study (0–21, lower = better sleep)"]}, "C": {"nums": ["3.8", "0.9", "7.4", "10.1"], "meaning": ["sleep", "improv", "quality", "better"], "subject": ["amber", "blue", "placebo", "clear", "glasses"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}], "notIn": ["confid", "withdraw", "debrief", "harm"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "insomnia", "teens"], "demo": ["63%", "37%", "92%", "8%", "100%", "women", "men", "norwegian", "other", "age 22–55", "norway", "norwegian", "38.5", "48"]}, "F": {"data": ["3.8", "0.9", "7.4", "10.1"], "concept": ["sleep", "improv", "quality", "better", "amber", "blue", "placebo", "clear", "glasses"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to wear amber or clear placebo glasses, and the researchers manipulated the type of glasses.", "B": "Sleep quality was operationally defined as the score on the Pittsburgh Sleep Quality Index, a 0 to 21 questionnaire where lower scores mean better sleep.", "C": "The amber-glasses group's scores dropped by 3.8 points while the placebo group's dropped by only 0.9, which indicates that the blue-light-blocking group's sleep quality improved much more.", "D": "The researchers followed institutional approval: the study was approved by a regional ethics committee before it began.", "E": "The findings may not generalize widely because 92% of participants were Norwegian adults with insomnia symptoms, and only 48 people took part. They may apply to Norwegian adults with sleep problems but cannot be confidently extended to teens, good sleepers, or people in places with different daylight patterns.", "F": "The results support the hypothesis. The amber group's PSQI scores dropped 3.8 points compared with 0.9 for the placebo group (p = .01), and because the placebo group also wore glasses, this shows the improvement came from blocking blue light, not just from expecting to sleep better."}}, {"id": "naps", "title": "Afternoon Naps and Memory Consolidation", "topic": "Sleep · Memory", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that a short afternoon nap helps people hold on to newly learned information."], ["Participants", "64 university students in Germany took part. Participants were 19 to 28 years old (mean age 22.9). See the table for demographics."], ["Method", "All participants learned 50 pairs of words at noon. They were then randomly assigned to take a 60-minute nap in the lab or to watch a nature video for 60 minutes while staying awake. At 5 p.m., memory was measured as the percentage of word pairs participants correctly recalled when shown the first word of each pair. Participants gave informed consent and were told they could leave at any time."], ["Results", "The nap group recalled 78% of word pairs on average. The video group recalled 63% (p < .001)."], ["Discussion", "A short nap helped participants retain new information. The researchers note that all participants were university students in one country."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "55%"], ["Male", "45%"], ["German", "84%"], ["Other", "16%"], ["Age 19–28", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of memory.", "C": "Describe what the mean recall percentages indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that an afternoon nap improves memory for new information."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["percentage", "percent", "%", "number", "how many"], ["word pair", "pairs", "50", "first word", "recall"]], "labels": ["Says it was the percentage recalled", "Gives a detail from this study (50 word pairs, cued by the first word)"]}, "C": {"nums": ["78", "63"], "meaning": ["memory", "recall", "remember"], "subject": ["nap", "video", "awake", "sleep"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["confid", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "university", "students"], "demo": ["55%", "45%", "84%", "16%", "100%", "female", "male", "german", "other", "age 19–28", "germany", "german", "22.9", "19", "28"]}, "F": {"data": ["78", "63", ".001"], "concept": ["memory", "recall", "remember", "nap", "video", "awake", "sleep"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to nap or watch a video, and the researchers manipulated whether participants slept.", "B": "Memory was operationally defined as the percentage of the 50 word pairs participants correctly recalled at 5 p.m. when shown the first word of each pair.", "C": "The nap group recalled a higher percentage of word pairs (78%) than the video group (63%), which indicates that napping helped participants remember more of what they had learned.", "D": "The researchers followed the right to withdraw: participants were told they could leave the study at any time.", "E": "The findings may not generalize to everyone because participants were 19 to 28-year-old university students and 84% were German. They may apply to young adult students but cannot be confidently extended to children, older adults, or people from other cultures.", "F": "The results support the hypothesis. The nap group recalled 78% of word pairs compared with 63% for the video group (p < .001), which shows that sleeping after learning helped consolidate the new memories better than staying awake."}}, {"id": "gratitude", "title": "Gratitude Journaling and Depressive Symptoms", "topic": "Depressive disorders · Positive psychology", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that writing about things you are grateful for reduces depressive symptoms."], ["Participants", "150 adults recruited online from across the United States took part. Participants were 21 to 64 years old (mean age 37.2). See the table for demographics."], ["Method", "Participants were randomly assigned to write three things they were grateful for each night or to write three things that happened that day, for 4 weeks. Depressive symptoms were measured with the PHQ-9 questionnaire (scored 0 to 27; higher = more symptoms) before and after the 4 weeks. Participants agreed to an online consent form. People with severe depression scores at the start were referred to mental health services instead of being included."], ["Results", "The gratitude group's PHQ-9 scores dropped from 10.4 to 7.1 (a drop of 3.3 points). The daily-events group's scores dropped from 10.1 to 9.4 (a drop of 0.7 points). The difference was statistically significant (p = .02), with a small-to-medium effect size (d = 0.38)."], ["Discussion", "Gratitude journaling produced a modest drop in depressive symptoms. The researchers note that participants volunteered online and were mostly women."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "74%"], ["Men", "24%"], ["Nonbinary", "2%"], ["White", "69%"], ["Black", "13%"], ["Hispanic", "11%"], ["Asian", "7%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of depressive symptoms.", "C": "Describe what the effect size (d = 0.38) indicates about the results.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that gratitude journaling reduces depressive symptoms."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "phq"], ["0 to 27", "27", "questionnaire", "higher"]], "labels": ["Names the measure (score on the PHQ-9)", "Gives a detail from this study (0–27, higher = more symptoms)"]}, "C": {"nums": ["0.38", ".38"], "meaning": ["small", "medium", "modest", "size", "strength", "depress", "symptom"], "subject": ["gratitude", "journal", "writing"], "kind": "other"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["severe", "referred", "mental health services"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "women", "men"], "demo": ["74%", "24%", "2%", "69%", "13%", "11%", "7%", "women", "men", "nonbinary", "white", "black", "hispanic", "asian", "online", "united states", "37.2"]}, "F": {"data": ["3.3", "0.7", ".02", "0.38", "10.4", "7.1"], "concept": ["small", "medium", "modest", "size", "strength", "depress", "symptom", "gratitude", "journal", "writing"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to gratitude writing or daily-events writing, and the researchers manipulated what participants wrote about.", "B": "Depressive symptoms were operationally defined as participants' score on the PHQ-9 questionnaire, scored 0 to 27 with higher scores meaning more symptoms.", "C": "An effect size of d = 0.38 indicates that, although gratitude journaling significantly reduced depressive symptoms compared with the control group, the size of the improvement was small to medium, not large.", "D": "The researchers followed protection from harm: people with severe depression scores were referred to mental health services instead of being included.", "E": "The findings may not generalize to everyone because 74% of participants were women and 69% were White, and all volunteered online. They may apply to White women who seek out online studies but cannot be confidently extended to men, people with severe depression, or people who would not volunteer.", "F": "The results support the hypothesis, though the effect was modest. The gratitude group's scores dropped 3.3 points compared with 0.7 for the control group (p = .02), which shows gratitude writing reduced symptoms more than simply writing about the day, but the effect size of d = 0.38 means the benefit was small to medium."}}, {"id": "cold", "title": "Perceived Stress and Catching a Cold", "topic": "Health psychology · Stress", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that people under more stress are more likely to get sick when exposed to a cold virus."], ["Participants", "276 healthy adults from Pittsburgh, Pennsylvania, took part and were paid. Participants were 18 to 55 years old (mean age 30.1). See the table for demographics."], ["Method", "Participants first completed the Perceived Stress Scale (scored 0 to 40). Researchers then split them into a high-stress group (top third of scores) and a low-stress group (bottom third). All participants were given nasal drops containing a mild cold virus and stayed in a hotel for 5 days. Getting a cold was defined as having both the virus in nasal samples and clinical symptoms such as congestion, as judged by a doctor who did not know participants' stress scores. The study was approved by the university's review board, and participants were monitored by doctors throughout."], ["Results", "47% of the high-stress group developed a cold, compared with 27% of the low-stress group (p < .01)."], ["Discussion", "People reporting more stress were more likely to get sick. Because stress was measured, not assigned, the researchers caution that other differences between the groups might matter."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "45%"], ["Men", "55%"], ["White", "73%"], ["Black", "21%"], ["Other", "6%"], ["Age 18–55", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of getting a cold.", "C": "Describe what the percentages (47% vs. 27%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that stress increases the chance of getting sick."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["virus", "nasal", "sample"], ["symptom", "congestion", "doctor", "clinical"]], "labels": ["Says it required the virus to be present", "Gives the symptom part (clinical symptoms like congestion judged by a doctor)"]}, "C": {"nums": ["47", "27"], "meaning": ["cold", "sick", "ill"], "subject": ["stress", "high", "low"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["monitor", "doctor"]}], "notIn": ["consent", "confid", "withdraw", "debrief"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "older adults"], "demo": ["45%", "55%", "73%", "21%", "6%", "100%", "women", "men", "white", "black", "other", "age 18–55", "pittsburgh", "pennsylvania", "30.1", "paid"]}, "F": {"data": ["47", "27"], "concept": ["cold", "sick", "ill", "stress", "high", "low"]}}, "model": {"A": "The research method is a correlational study (it is not a true experiment) because participants were grouped by their existing stress scores rather than randomly assigned to stress levels.", "B": "Getting a cold was operationally defined as having the virus in nasal samples plus clinical symptoms such as congestion, as judged by a doctor who did not know participants' stress scores.", "C": "The percentages indicate that people with high stress were more likely to get sick: 47% of the high-stress group developed a cold compared with 27% of the low-stress group.", "D": "The researchers followed protection from harm: participants were monitored by doctors throughout their 5-day stay.", "E": "The findings may not generalize to everyone because participants were healthy 18 to 55-year-olds from Pittsburgh and 73% were White. They may apply to healthy adults but cannot be confidently extended to children, older adults, or people with weak immune systems.", "F": "The results support the hypothesis that stress is linked to getting sick: 47% of high-stress participants caught a cold versus 27% of low-stress participants (p < .01), which shows that stress weakens resistance to illness, consistent with immunosuppression. However, since stress was not assigned, other differences could also play a role."}}, {"id": "aces", "title": "Adverse Childhood Experiences and Adult Heart Disease", "topic": "Health psychology · ACEs", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Adverse childhood experiences (ACEs) include abuse, neglect, and household dysfunction. Researchers examined whether the number of ACEs a person had is related to heart disease in adulthood."], ["Participants", "8,400 adults who visited a health clinic in California completed the survey. Participants were 25 to 85 years old (mean age 56). See the table for demographics."], ["Method", "Participants filled out a confidential questionnaire counting how many of 10 types of ACEs they experienced before age 18 (scores 0 to 10). Heart disease was measured from each participant's medical record as whether a doctor had ever diagnosed coronary heart disease. Nobody was assigned to any condition. Participants consented to their medical records being used, and records were stored without names."], ["Results", "People with 4 or more ACEs were 2.2 times as likely to have heart disease as people with 0 ACEs. The number of ACEs was positively correlated with heart disease (r = +.21, p < .001)."], ["Discussion", "More childhood adversity was linked to a higher risk of heart disease decades later. The researchers note that participants all had health insurance through one provider."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "54%"], ["Men", "46%"], ["White", "75%"], ["Hispanic", "11%"], ["Asian", "8%"], ["Black", "5%"], ["College educated", "62%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of adverse childhood experiences.", "C": "Describe what the finding that people with 4 or more ACEs were 2.2 times as likely to have heart disease indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that adverse childhood experiences cause heart disease."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["number", "count", "how many", "score"], ["10", "before 18", "before age 18", "questionnaire", "types"]], "labels": ["Says it was a count of ACEs", "Gives a detail from this study (out of 10 types, before age 18, questionnaire)"]}, "C": {"nums": ["2.2", "4 or more"], "meaning": ["heart", "risk", "likely", "disease"], "subject": ["ace", "childhood"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "uninsured", "other countries"], "demo": ["54%", "46%", "75%", "11%", "8%", "5%", "62%", "women", "men", "white", "hispanic", "asian", "black", "college educated", "california", "insurance", "one provider", "56", "8,400"]}, "F": {"data": ["2.2", ".21", ".001"], "concept": ["heart", "risk", "likely", "disease", "ace", "childhood"], "stanceWant": "refute", "stanceHint": "The claim says ACEs CAUSE heart disease. A correlational study can't prove cause, so the strongest answer says the results only partly support (or do not support) the causal claim."}}, "model": {"A": "The research method is a correlational study because the researchers measured ACEs and heart disease without manipulating anything or assigning participants to groups.", "B": "Adverse childhood experiences were operationally defined as the number of 10 types of ACEs (0 to 10) a participant reported experiencing before age 18 on a questionnaire.", "C": "It indicates that people with many childhood adversities had a much higher risk of heart disease: those with 4 or more ACEs were more than twice as likely to have heart disease as those with none.", "D": "The researchers followed confidentiality: the questionnaire was confidential and records were stored without names.", "E": "The findings may not generalize to everyone because 75% of participants were White, 62% were college educated, and all had insurance through one California provider. They may apply to insured, educated adults but cannot be confidently extended to people without health insurance or people in other countries.", "F": "The results partly support the claim. Four or more ACEs made heart disease 2.2 times as likely and the correlation was positive (r = +.21), but because the study is correlational it cannot prove ACEs cause heart disease; other factors, such as smoking or poverty, could explain the link."}}, {"id": "meditate", "title": "Meditation App Use and Cortisol", "topic": "Health psychology · Coping", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Cortisol is a stress hormone. Researchers tested the hypothesis that a daily meditation app lowers stress hormone levels in nurses."], ["Participants", "82 hospital nurses in Chicago, Illinois, took part. Participants were 24 to 59 years old (mean age 39.7). See the table for demographics."], ["Method", "Nurses were randomly assigned to use a meditation app for 10 minutes a day for 6 weeks or to a waitlist control group that got the app after the study. Stress was measured as the level of cortisol in saliva samples collected at 8 a.m. on the same day each week. The hospital's ethics board approved the study, and nurses were told that taking part would not affect their jobs. Data were labeled with ID numbers."], ["Results", "The app group's average morning cortisol fell by 18%. The waitlist group's fell by 3% (p = .01)."], ["Discussion", "Brief daily meditation lowered a biological measure of stress. The researchers note the sample was mostly women from one hospital."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "88%"], ["Men", "12%"], ["White", "49%"], ["Black", "24%"], ["Hispanic", "15%"], ["Asian", "12%"], ["Age 24–59", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of stress.", "C": "Describe what the percentage drops in cortisol indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that a daily meditation app lowers stress hormone levels."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["cortisol"], ["saliva", "8 a.m", "morning", "sample", "weekly", "each week"]], "labels": ["Names the measure (cortisol level)", "Gives a detail from this study (saliva samples at 8 a.m. each week)"]}, "C": {"nums": ["18", "3%"], "meaning": ["cortisol", "stress", "hormone"], "subject": ["app", "meditat", "waitlist"], "kind": "groups"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["jobs", "affect", "not affect"]}], "notIn": ["consent", "withdraw", "debrief"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "nurses", "men"], "demo": ["88%", "12%", "49%", "24%", "15%", "12%", "100%", "women", "men", "white", "black", "hispanic", "asian", "age 24–59", "chicago", "one hospital", "nurses", "39.7"]}, "F": {"data": ["18", "3%"], "concept": ["cortisol", "stress", "hormone", "app", "meditat", "waitlist"]}}, "model": {"A": "The research method is an experiment because nurses were randomly assigned to use the app or to a waitlist control group, and the researchers manipulated app use.", "B": "Stress was operationally defined as the level of cortisol in saliva samples collected at 8 a.m. on the same day each week.", "C": "The app group's cortisol fell by 18% while the waitlist group's fell by only 3%, which indicates that nurses who meditated had a much larger drop in stress hormones.", "D": "The researchers followed confidentiality: data were labeled with ID numbers instead of names.", "E": "The findings may not generalize to everyone because 88% of participants were women and all were nurses at one Chicago hospital. They may apply to female healthcare workers but cannot be confidently extended to men, people in less stressful jobs, or teens.", "F": "The results support the hypothesis. Morning cortisol dropped 18% in the app group versus 3% in the waitlist group (p = .01), which shows that daily meditation lowered the body's stress hormone, a biological sign of reduced stress."}}, {"id": "placebo", "title": "Expectations and Pain: A Placebo Cream Study", "topic": "Research methods · Placebo effect", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that simply believing you received a painkiller reduces the pain you feel."], ["Participants", "60 university students in Ontario, Canada, took part. Participants were 18 to 25 years old (mean age 20.5). See the table for demographics."], ["Method", "All participants had a mild heat stimulus applied to their forearm. Before the heat, participants were randomly assigned to have a cream described as \"a powerful pain reliever\" or the same cream described as \"a moisturizer.\" The cream had no active ingredient in either case. Pain was measured as each participant's rating of the heat on a 0 to 10 scale. The heat was kept below the level that could damage skin, and participants could stop the heat at any time. Afterward, everyone was told the cream was inactive and why deception was needed."], ["Results", "The \"pain reliever\" group rated the heat at 4.1 on average. The \"moisturizer\" group rated it at 6.3 (p < .001)."], ["Discussion", "Expecting pain relief reduced pain ratings even though the cream was inactive."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "60%"], ["Male", "40%"], ["White", "52%"], ["Asian", "30%"], ["Black", "10%"], ["Other", "8%"], ["Age 18–25", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of pain.", "C": "Describe what the difference in mean pain ratings indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that believing you received a painkiller reduces pain."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["rating", "rate", "scale", "score"], ["0 to 10", "10", "heat"]], "labels": ["Says it was a rating on a scale", "Gives a detail from this study (0–10 rating of the heat)"]}, "C": {"nums": ["4.1", "6.3"], "meaning": ["pain", "hurt", "less"], "subject": ["pain reliever", "moisturizer", "cream", "told"], "kind": "groups"}, "D": {"eth": [{"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["below", "damage", "stop the heat", "skin"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["consent", "confid", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "chronic pain", "older adults"], "demo": ["60%", "40%", "52%", "30%", "10%", "8%", "100%", "female", "male", "white", "asian", "black", "other", "age 18–25", "ontario", "canada", "20.5", "18", "25"]}, "F": {"data": ["4.1", "6.3"], "concept": ["pain", "hurt", "less", "pain reliever", "moisturizer", "cream", "told"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to be told the cream was a pain reliever or a moisturizer, and the researchers manipulated what participants were told.", "B": "Pain was operationally defined as each participant's rating of the heat stimulus on a 0 to 10 scale.", "C": "The \"pain reliever\" group rated the heat as less painful (4.1) than the \"moisturizer\" group (6.3), which indicates that expecting relief reduced the pain participants felt, a placebo effect.", "D": "The researchers followed debriefing: afterward, everyone was told the cream was inactive and why deception was needed.", "E": "The findings may not generalize to everyone because participants were 18 to 25-year-old university students in Ontario. They may apply to young adults experiencing mild, short pain but cannot be confidently extended to older adults or people with chronic pain.", "F": "The results support the hypothesis. Participants told the inactive cream was a pain reliever rated the heat 4.1 compared with 6.3 for those told it was a moisturizer (p < .001); since the cream was identical, this shows that expectations alone reduced pain."}}, {"id": "cafeteria", "title": "Phones at the Lunch Table: A Naturalistic Observation", "topic": "Research methods · Observation", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers wanted to describe how phone use relates to face-to-face conversation among teens in a natural setting."], ["Participants", "Researchers observed 240 students during lunch at four public high schools in Ohio. Based on school records, students were 14 to 18 years old. See the table for school demographics."], ["Method", "Two trained observers sat in each cafeteria and recorded behavior without interacting with students. Every 2 minutes, observers recorded whether each student at a table was looking at a phone and whether they were talking with someone at the table. Conversation was measured as the percentage of 2-minute checks in which a student was talking with someone at the table. Observers did not record names or any identifying information, and the schools approved the study."], ["Results", "Students who had a phone out on the table were talking during 41% of checks, compared with 68% for students without a phone out. The two observers agreed on 94% of their recordings."], ["Discussion", "Visible phones were associated with less face-to-face conversation. The researchers note that they could not tell why students had their phones out."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "50%"], ["Male", "50%"], ["White", "61%"], ["Black", "24%"], ["Hispanic", "9%"], ["Other", "6%"], ["Age 14–18", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of conversation.", "C": "Describe what the percentages (41% vs. 68%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that having a phone out reduces face-to-face conversation."}, "r": {"A": {"answer": "naturalistic observation", "keys": ["naturalistic", "observation"], "clues": ["natural", "observed", "watched", "recorded", "without interfering", "did not interact"], "trap": "experiment", "trapHint": "The researchers only watched and recorded behavior in a natural setting without changing anything, so it is a naturalistic observation, not an experiment."}, "B": {"groups": [["percentage", "percent", "%", "how often"], ["2-minute", "two-minute", "2 minute", "check", "talking", "table"]], "labels": ["Says it was the percentage of checks", "Gives a detail from this study (2-minute checks, talking with someone at the table)"]}, "C": {"nums": ["41", "68"], "meaning": ["talk", "conversation"], "subject": ["phone"], "kind": "groups"}, "D": {"eth": [{"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}], "notIn": ["consent", "withdraw", "debrief", "harm"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "adults", "younger"], "demo": ["50%", "50%", "61%", "24%", "9%", "6%", "100%", "female", "male", "white", "black", "hispanic", "other", "age 14–18", "ohio", "four", "public"]}, "F": {"data": ["41", "68", "94"], "concept": ["talk", "conversation", "phone"], "stanceWant": "refute", "stanceHint": "The claim says phones REDUCE conversation (cause). An observation can't show cause and effect, so say the results only partly support the causal claim, and why."}}, "model": {"A": "The research method is naturalistic observation because trained observers recorded students' behavior in their natural cafeteria setting without interacting with them or changing anything.", "B": "Conversation was operationally defined as the percentage of 2-minute checks in which a student was talking with someone at their table.", "C": "The percentages indicate that students with a phone out talked with others less often (41% of checks) than students without a phone out (68%).", "D": "The researchers followed confidentiality: observers did not record names or any identifying information.", "E": "The findings may not generalize to all teens because the students came from four public high schools in Ohio and 61% were White. They may apply to Ohio high school students but cannot be confidently extended to adults, younger children, or other regions.", "F": "The results partly support the claim. Students with phones out talked during 41% of checks versus 68% without phones, which shows a link between phones and less conversation, but because this was an observation with no manipulation, it cannot show that the phones caused it; quieter students might take their phones out more."}}, {"id": "casehm", "title": "A Case Study of Memory After Hippocampus Damage", "topic": "The brain · Memory", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers studied a rare case to learn which brain areas are needed to form new memories."], ["Participants", "The study focused on one 52-year-old man, referred to as \"Patient R.K.,\" from Boston, Massachusetts. A viral infection had damaged both of his hippocampi. Before the illness he worked as an engineer."], ["Method", "Over 3 years, researchers conducted in-depth interviews, brain scans, and memory tests with R.K. New memory formation was measured as the number of 15 objects R.K. could name 30 minutes after seeing them. R.K. and his wife gave written consent, his name and identifying details were changed in all reports, and he could stop any session when he was tired."], ["Results", "R.K. recalled an average of 1 out of 15 objects after 30 minutes, compared with an average of 11 out of 15 for healthy men his age. He could still remember events from before his illness and could learn new motor skills, such as tracing a star in a mirror, even though he did not remember practicing."], ["Discussion", "The hippocampus appears necessary for forming new long-term memories of facts and events but not for older memories or motor skills."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Participants", "1 man"], ["Age", "52"], ["Occupation before illness", "Engineer"], ["Location", "Boston, MA"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of new memory formation.", "C": "Describe what R.K.'s score compared with healthy men his age indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that the hippocampus is needed to form new long-term memories."}, "r": {"A": {"answer": "case study", "keys": ["case study"], "clues": ["one person", "one individual", "in-depth", "in depth", "single", "rare"], "trap": "experiment", "trapHint": "The researchers studied one person in depth and did not manipulate anything across groups, so it is a case study."}, "B": {"groups": [["number", "how many", "objects"], ["15", "30 minutes", "thirty minutes", "name"]], "labels": ["Says it was the number of objects named", "Gives a detail from this study (out of 15, after 30 minutes)"]}, "C": {"nums": ["1 out of 15", "1 of 15", "11", "15"], "meaning": ["memory", "remember", "recall", "impair"], "subject": ["r.k", "rk", "patient", "healthy"], "kind": "other"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "one person", "one man", "rare"], "demo": ["1 man", "52", "participants", "age", "occupation before illness", "location", "one", "52", "single", "boston", "engineer"]}, "F": {"data": ["1 out of 15", "1 of 15", "11", "15"], "concept": ["memory", "remember", "recall", "impair", "r.k", "rk", "patient", "healthy"]}}, "model": {"A": "The research method is a case study because the researchers examined one individual, Patient R.K., in depth over 3 years.", "B": "New memory formation was operationally defined as the number of 15 objects R.K. could name 30 minutes after seeing them.", "C": "R.K. recalled only 1 of 15 objects compared with 11 of 15 for healthy men his age, which indicates that his ability to form new memories was severely impaired.", "D": "The researchers followed confidentiality: R.K.'s name and identifying details were changed in all reports.", "E": "The findings cannot be confidently generalized because the study involved only one 52-year-old man with a rare type of brain damage. They may help explain other patients with similar hippocampus damage but cannot be extended to the general population.", "F": "The results support the hypothesis. R.K., whose hippocampi were damaged, recalled only 1 of 15 objects after 30 minutes compared with 11 of 15 for healthy men, while his old memories and motor learning stayed intact, which shows the hippocampus is needed specifically for forming new long-term memories."}}, {"id": "casesplit", "title": "A Case Study of a Split-Brain Patient", "topic": "The brain · Split brain", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers studied a patient whose corpus callosum had been cut to stop severe seizures, to learn how the two hemispheres share information."], ["Participants", "The study focused on one 34-year-old woman, called \"Patient V.J.,\" from Ohio, who is right-handed and had the surgery at age 27."], ["Method", "Over 2 years, researchers ran 40 testing sessions. In each test, a word flashed briefly to either her left or right visual field. Language ability for each hemisphere was measured as the percentage of trials in which she could correctly say the word out loud. V.J. signed a consent form explaining all procedures, could take breaks or stop any session, and her identity was kept confidential."], ["Results", "V.J. correctly said 96% of words flashed to her right visual field but only 4% of words flashed to her left visual field. However, she could point to the correct object with her left hand on 89% of left-visual-field trials."], ["Discussion", "Information reaching only the right hemisphere could guide her left hand but could not be put into words."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Participants", "1 woman"], ["Age", "34"], ["Handedness", "Right-handed"], ["Surgery age", "27"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of language ability.", "C": "Describe what the percentages of words she said correctly (96% vs. 4%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that the left hemisphere controls speech."}, "r": {"A": {"answer": "case study", "keys": ["case study"], "clues": ["one person", "one individual", "in-depth", "in depth", "single", "rare"], "trap": "experiment", "trapHint": "The researchers studied one person in depth and did not manipulate anything across groups, so it is a case study."}, "B": {"groups": [["percentage", "percent", "%"], ["say", "out loud", "aloud", "flash", "word"]], "labels": ["Says it was the percentage of trials", "Gives a detail from this study (correctly saying the flashed word out loud)"]}, "C": {"nums": ["96", "4%", "4 %"], "meaning": ["say", "speak", "language", "word", "hemisphere"], "subject": ["right visual field", "left visual field", "right", "left"], "kind": "other"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "one person", "rare", "left-handed"], "demo": ["1 woman", "34", "27", "participants", "age", "handedness", "surgery age", "one", "34", "single", "right-handed", "ohio"]}, "F": {"data": ["96", "4%", "89"], "concept": ["say", "speak", "language", "word", "hemisphere", "right visual field", "left visual field", "right", "left"]}}, "model": {"A": "The research method is a case study because the researchers studied one individual, Patient V.J., in depth over 2 years.", "B": "Language ability was operationally defined as the percentage of trials in which V.J. correctly said a briefly flashed word out loud.", "C": "She correctly said 96% of words shown to her right visual field but only 4% of words shown to her left visual field, which indicates that words reaching her left hemisphere could be spoken while words reaching only her right hemisphere could not.", "D": "The researchers followed informed consent: V.J. signed a consent form explaining all procedures before testing.", "E": "The findings cannot be confidently generalized because the study involved only one 34-year-old right-handed woman with a rare surgery. They may help explain other split-brain patients but cannot be extended to people with an intact corpus callosum or to left-handed people.", "F": "The results support the hypothesis. V.J. could say 96% of words sent to her right visual field (left hemisphere) but only 4% sent to her left visual field (right hemisphere), even though her left hand pointed correctly 89% of the time, which shows the right hemisphere saw the words but only the left hemisphere could speak them."}}, {"id": "metassri", "title": "A Meta-Analysis of Antidepressants for Depression", "topic": "Treatment · Medications", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers wanted to know how well SSRI antidepressants work compared with a placebo."], ["Participants", "The researchers combined data from 52 published studies that included a total of 13,400 adults diagnosed with major depressive disorder. Studies were from 18 countries. See the table for the combined sample."], ["Method", "The researchers searched research databases for randomized studies comparing an SSRI with a placebo pill for at least 6 weeks. Improvement was measured as the percentage of patients in each study whose depression scores dropped by at least half (called \"response\"). All included studies had been approved by ethics boards and had informed consent from participants."], ["Results", "Across all studies, 54% of patients taking SSRIs responded, compared with 38% of patients taking a placebo. The overall effect size was small to medium (d = 0.31). SSRIs worked better for people with severe depression than for people with mild depression."], ["Discussion", "SSRIs were more effective than placebo, but placebos also helped many patients."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "64%"], ["Men", "36%"], ["From North America", "48%"], ["From Europe", "37%"], ["Other regions", "15%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of improvement.", "C": "Describe what the response rates (54% vs. 38%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that SSRIs are an effective treatment for depression."}, "r": {"A": {"answer": "meta-analysis", "keys": ["meta-analysis", "meta analysis", "metaanalysis"], "clues": ["combined", "multiple studies", "many studies", "studies", "pooled"], "trap": "experiment", "trapHint": "The researchers did not run a new study on participants: they combined the results of many existing studies. That is a meta-analysis."}, "B": {"groups": [["percentage", "percent", "%"], ["half", "50%", "dropped", "scores", "response"]], "labels": ["Says it was the percentage of patients", "Gives a detail from this study (scores dropping by at least half = response)"]}, "C": {"nums": ["54", "38"], "meaning": ["improv", "respond", "better", "depress"], "subject": ["ssri", "placebo", "antidepressant"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}], "notIn": ["confid", "withdraw", "debrief", "harm"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "other regions", "western"], "demo": ["64%", "36%", "48%", "37%", "15%", "women", "men", "from north america", "from europe", "other regions", "52", "13,400", "18 countries", "north america", "europe"]}, "F": {"data": ["54", "38", "0.31", ".31"], "concept": ["improv", "respond", "better", "depress", "ssri", "placebo", "antidepressant"]}}, "model": {"A": "The research method is a meta-analysis because the researchers combined the results of 52 existing studies instead of collecting new data.", "B": "Improvement was operationally defined as the percentage of patients whose depression scores dropped by at least half (\"response\") after at least 6 weeks.", "C": "The response rates indicate that more patients improved on SSRIs (54%) than on a placebo (38%), though many patients also improved on a placebo.", "D": "The original studies followed informed consent: participants in every included study agreed to take part after being informed.", "E": "The findings are fairly generalizable because they combine 13,400 adults from 18 countries, but 64% were women and 85% were from North America or Europe. They may apply to adults in Western countries but cannot be confidently extended to teens or people from other regions.", "F": "The results support the claim. Across 52 studies, 54% of patients responded to SSRIs compared with 38% on placebo, which shows SSRIs are more effective than an inactive pill, though the small-to-medium effect size (d = 0.31) shows the benefit is modest, especially for mild depression."}}, {"id": "metaex", "title": "A Meta-Analysis of Exercise and Depression", "topic": "Depressive disorders · Health", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers asked whether exercise reduces depressive symptoms, combining evidence from many studies."], ["Participants", "The researchers combined 35 randomized studies that included 2,500 adults with depression from 14 countries. See the table for the combined sample."], ["Method", "Studies were included if they randomly assigned adults with depression to an exercise program or a no-exercise control for at least 4 weeks. Depressive symptoms were measured in each study with standard questionnaires, and the researchers combined the results as an overall effect size. All included studies reported ethics approval."], ["Results", "Across studies, exercise reduced depressive symptoms with a moderate overall effect size (d = 0.56). The effect was larger for programs with 3 or more sessions a week (d = 0.69) than for programs with fewer sessions (d = 0.38)."], ["Discussion", "Exercise was an effective way to reduce depressive symptoms, and more frequent programs worked better."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "68%"], ["Men", "32%"], ["Average age", "43"], ["From Europe", "52%"], ["From North America", "30%"], ["Other regions", "18%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of the size of the exercise effect.", "C": "Describe what the overall effect size (d = 0.56) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that exercise reduces depressive symptoms."}, "r": {"A": {"answer": "meta-analysis", "keys": ["meta-analysis", "meta analysis", "metaanalysis"], "clues": ["combined", "multiple studies", "many studies", "studies", "pooled"], "trap": "experiment", "trapHint": "The researchers did not run a new study on participants: they combined the results of many existing studies. That is a meta-analysis."}, "B": {"groups": [["effect size", "d ="], ["combined", "35", "questionnaire", "studies"]], "labels": ["Names it as an effect size", "Gives a detail from this study (combined across 35 studies, questionnaire scores)"]}, "C": {"nums": ["0.56", ".56"], "meaning": ["moderate", "depress", "symptom", "size", "fewer", "reduc"], "subject": ["exercise"], "kind": "other"}, "D": {"eth": [{"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}], "notIn": ["consent", "confid", "withdraw", "debrief", "harm"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "men", "other parts"], "demo": ["68%", "32%", "43", "52%", "30%", "18%", "women", "men", "average age", "from europe", "from north america", "other regions", "35", "2,500", "14 countries", "europe", "north america", "43"]}, "F": {"data": ["0.56", ".56", "0.69", "0.38"], "concept": ["moderate", "depress", "symptom", "size", "fewer", "reduc", "exercise"]}}, "model": {"A": "The research method is a meta-analysis because the researchers combined the results of 35 existing randomized studies.", "B": "The size of the exercise effect was operationally defined as the overall effect size calculated by combining questionnaire-based depression results across 35 studies.", "C": "An effect size of d = 0.56 indicates that exercise had a moderate effect: people who exercised had noticeably fewer depressive symptoms than those who did not.", "D": "The original studies followed institutional approval: all included studies reported approval from an ethics board.", "E": "The findings may not generalize to everyone because 68% of participants were women and 82% were from Europe or North America. They may apply to adults in Western countries but cannot be confidently extended to teens, men, or people in other parts of the world.", "F": "The results support the hypothesis. Combining 35 studies, exercise reduced depressive symptoms with a moderate effect size (d = 0.56), and programs with 3 or more sessions a week had an even larger effect (d = 0.69), which shows that exercise reduces depression and that more frequent exercise helps more."}}, {"id": "mindset", "title": "Growth Mindset Lessons and Math Grades", "topic": "Cognition · Education", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "A growth mindset is the belief that abilities can improve with effort. Researchers tested the hypothesis that a short growth mindset program raises math gr
