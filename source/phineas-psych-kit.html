orning"], "model": {"A": "High schools should start later in the morning because a later start lets teens get more sleep, which improves their grades and safety.", "Bi": "After Seattle high schools moved start times from 7:50 to 8:45 a.m., students slept 34 minutes longer and median biology grades rose by 4.5% (Source 1).", "Bii": "This supports the claim because the extra sleep from the later start was followed by better academic performance. This can be explained by memory consolidation: during sleep, the brain moves newly learned information into long-term memory, so students who sleep longer can store and recall more of what they learned in class.", "Ci": "Teens' melatonin did not begin rising until about 10:45 p.m., compared with about 9:30 p.m. for adults (Source 2).", "Cii": "This supports a later start because teens are not able to fall asleep early, so an early start cuts their sleep short. This is explained by the circadian rhythm: during adolescence the biological clock shifts later, so teens are naturally evening-energized, and forcing them to wake early works against their internal 24-hour cycle."}}, {"id": "exercise", "title": "Exercise and Mental Health", "topic": "Health psychology · Depression", "question": "Develop and justify an argument about whether exercise should be recommended as a treatment for depression.", "sources": [{"title": "Exercise vs. Medication", "text": "156 adults ages 50–77 with major depressive disorder in North Carolina were randomly assigned to aerobic exercise (3 times a week), an antidepressant, or both for 16 weeks. All three groups improved similarly: about 60–69% no longer met criteria for depression. Six months later, the exercise-only group had a lower relapse rate (8%) than the medication-only group (38%)."}, {"title": "Exercise and the Brain", "text": "In a study of 40 young adults, 30 minutes of moderate cycling increased levels of BDNF, a protein that helps neurons grow, by 32% compared with resting. Participants also reported a 25% improvement in mood ratings immediately afterward."}, {"title": "Dropout From Exercise Programs", "text": "A review of 40 exercise studies for depression found that about 18% of participants dropped out, similar to dropout rates for antidepressant medication studies. Participants who exercised in supervised groups were less likely to drop out than those who exercised alone."}], "topicWords": ["exercise", "depress", "treat", "recommend"], "model": {"A": "Exercise should be recommended as a treatment for depression because it reduces symptoms about as well as medication and helps prevent relapse.", "Bi": "Six months after treatment, adults who only exercised had a relapse rate of 8%, compared with 38% for those who only took medication (Source 1).", "Bii": "This supports the claim because exercise not only reduced depression but kept it from coming back better than medication. From the behavioral perspective, exercise works through positive reinforcement: the mood boost after each workout rewards the behavior, making people more likely to keep exercising, which sustains the improvement.", "Ci": "Thirty minutes of moderate cycling raised mood ratings by 25% right afterward (Source 2).", "Cii": "This supports recommending exercise because even one session improved mood. This can be explained by endorphins, the brain's natural painkillers that are released during exercise; they produce positive feelings (a \"runner's high\") that counteract the low mood of depression."}}, {"id": "phones", "title": "Phones in the Classroom", "topic": "Attention · Learning", "question": "Develop and justify an argument about whether schools should ban phones during class.", "sources": [{"title": "Phone Bans and Test Scores", "text": "Researchers studied 91 high schools in England before and after they banned phones. After the bans, students' test scores rose by an average of 6.4%, with the lowest-achieving students improving the most (14.2%)."}, {"title": "Texting During Lectures", "text": "145 college students were randomly assigned to text during a 20-minute video lecture or not. On a quiz afterward, students who texted scored 60% on average while students who did not text scored 72%."}, {"title": "Phones and Belonging", "text": "In a survey of 2,000 students ages 13–18, 58% said they used their phones during free time at school to talk with friends, and students reported feeling more connected when they could message friends at lunch. Students who used phones only at lunch did not have lower grades than those who never used phones."}], "topicWords": ["phone", "class", "ban", "school"], "model": {"A": "Schools should ban phones during class time because phones distract students and lower their learning.", "Bi": "After 91 high schools in England banned phones, students' test scores rose by 6.4% on average, and the lowest-achieving students improved by 14.2% (Source 1).", "Bii": "This supports the claim because removing phones was followed by higher achievement. This can be explained by selective attention: we can only focus our conscious awareness on a limited amount at once, so a phone pulls attention away from the lesson, and removing it lets students focus fully on what is being taught.", "Ci": "Students who texted during a lecture scored 60% on a quiz, compared with 72% for students who did not text (Source 2).", "Cii": "This supports a ban during class because texting directly reduced how much students learned. This is explained by encoding: to remember information, it must first be encoded into memory, and dividing attention between texting and the lecture means less of the lecture is encoded into long-term memory."}}, {"id": "mindful", "title": "Mindfulness for Students", "topic": "Health psychology · Stress", "question": "Develop and justify an argument about whether schools should teach mindfulness to reduce student stress.", "sources": [{"title": "Mindfulness in Middle School", "text": "300 middle school students in Boston were randomly assigned to 8 weeks of mindfulness lessons or coding lessons. The mindfulness group reported 18% lower stress and had lower cortisol levels at the end of the program, while the coding group showed no change."}, {"title": "Mindfulness and Attention", "text": "Undergraduates who completed 2 weeks of daily mindfulness practice improved their reading comprehension scores by 16 percentile points on a standardized test and reported less mind-wandering during the test than students in a nutrition class."}, {"title": "Large School Trial", "text": "A study of 8,376 students ages 11–16 in 84 schools in the United Kingdom found that a school-based mindfulness program did not improve students' depression or well-being scores compared with usual social-emotional lessons after one year. Many students reported not practicing outside class."}], "topicWords": ["mindful", "stress", "school", "student", "teach"], "model": {"A": "Schools should teach mindfulness because it reduces students' stress and improves their focus, especially when students actually practice it.", "Bi": "Middle school students who took 8 weeks of mindfulness lessons reported 18% lower stress and had lower cortisol levels, while students in coding lessons showed no change (Source 1).", "Bii": "This supports the claim because mindfulness lowered both reported stress and a biological stress marker. This can be explained by the parasympathetic nervous system: mindful breathing activates the rest-and-digest response, calming the body after the sympathetic fight-or-flight response, which lowers stress hormones.", "Ci": "Undergraduates who practiced mindfulness daily for 2 weeks improved their reading comprehension by 16 percentile points and reported less mind-wandering (Source 2).", "Cii": "This supports teaching mindfulness because it helped students focus during a test. This is explained by emotion-focused coping: mindfulness helps students regulate anxious feelings about a stressor instead of being overwhelmed by them, so they can direct attention back to the task."}}, {"id": "violentgames", "title": "Violent Video Games and Aggression", "topic": "Learning · Aggression", "question": "Develop and justify an argument about whether violent video games increase aggression in young people.", "sources": [{"title": "Short-Term Aggression in the Lab", "text": "210 college students were randomly assigned to play a violent or nonviolent video game for 15 minutes. Afterward, those who played the violent game gave an opponent louder noise blasts (a lab measure of aggression) on average, 6.8 vs. 5.6 on a 10-point scale."}, {"title": "Long-Term Study of Teens", "text": "Researchers followed 3,034 children and teens in Singapore for 2 years. Those who played more violent games at the start reported more aggressive thoughts and behaviors two years later, even after controlling for their earlier aggression (r = +.15)."}, {"title": "Meta-Analysis of Many Studies", "text": "A meta-analysis combining 24 long-term studies with 17,000 participants found a small link between violent game play and later physical aggression (effect size r = .08). The researchers concluded the effect is real but small."}], "topicWords": ["violent", "game", "aggress"], "model": {"A": "Violent video games slightly increase aggression in young people, so parents should limit how much violent gaming children do.", "Bi": "College students who played a violent game for 15 minutes gave louder noise blasts to an opponent than students who played a nonviolent game, 6.8 versus 5.6 on a 10-point scale (Source 1).", "Bii": "This supports the claim because playing a violent game caused more aggressive behavior right afterward in an experiment. This can be explained by observational learning: players watch and imitate aggressive models in the game, much like children in Bandura's Bobo doll study imitated an adult who hit the doll, which makes aggressive responses more likely.", "Ci": "A meta-analysis of 24 studies with 17,000 participants found a small but real link between violent game play and later physical aggression (r = .08) (Source 3).", "Cii": "This supports the claim that the increase is slight because combining many studies shows a consistent but small effect. From the behavioral perspective, games reward violent actions with points and progress, so through operant conditioning (positive reinforcement) players learn that aggression pays off, even if the effect on real behavior is modest."}}, {"id": "studying", "title": "How to Study Effectively", "topic": "Memory · Learning", "question": "Develop and justify an argument about the most effective way for students to study for exams.", "sources": [{"title": "Practice Testing", "text": "120 undergraduates studied a passage either by rereading it four times or by reading it once and taking three practice recall tests. One week later, the practice-test group remembered 61% of the information compared with 40% for the rereading group."}, {"title": "Spacing Study Sessions", "text": "Students who studied vocabulary in three sessions spread one week apart recalled 74% of the words on a final test, while students who studied for the same total time in one session recalled 51%."}, {"title": "Student Habits Survey", "text": "In a survey of 177 college students, 84% said rereading notes was their main study strategy, and only 11% regularly tested themselves. Students who reported cramming the night before had lower GPAs on average (2.9) than students who spread out studying (3.3)."}], "topicWords": ["study", "exam", "test", "memor", "learn"], "model": {"A": "The most effective way to study is to quiz yourself on material over several spaced-out sessions instead of rereading or cramming.", "Bi": "Students who took practice recall tests remembered 61% of a passage after one week, compared with 40% for students who reread it four times (Source 1).", "Bii": "This supports the claim because self-quizzing led to much better long-term memory than rereading. This is explained by the testing effect: actively retrieving information strengthens the memory pathways for it, so each practice test makes the information easier to recall later.", "Ci": "Students who studied vocabulary in three sessions a week apart recalled 74% of the words, compared with 51% for students who studied for the same time in one session (Source 2).", "Cii": "This supports spacing out study sessions because spacing improved recall by more than 20 percentage points. This is explained by the spacing effect (distributed practice): information studied over time is consolidated more strongly into long-term memory than information crammed in one session (massed practice)."}}, {"id": "caffeineteen", "title": "Caffeine and Teenagers", "topic": "Drugs · Sleep", "question": "Develop and justify an argument about whether teenagers should limit caffeine.", "sources": [{"title": "Caffeine and Teen Sleep", "text": "Researchers tracked 1,800 teens in Canada for one week. Teens who had more than 100 mg of caffeine a day (about 1 energy drink) slept 46 minutes less on school nights than teens who had none, and were more likely to report daytime sleepiness."}, {"title": "Caffeine Dependence", "text": "In a study of 245 teens who regularly drank caffeine, 76% reported at least one withdrawal symptom, such as headaches or irritability, when they went a day without it. Teens needed more caffeine over time to feel the same alertness."}, {"title": "Caffeine and Test Performance", "text": "120 college students were randomly assigned to drink coffee with 200 mg of caffeine or decaf before a 30-minute attention test. The caffeine group made 18% fewer errors, but the difference disappeared for students who were already well-rested."}], "topicWords": ["caffeine", "teen", "limit"], "model": {"A": "Teenagers should limit caffeine because it cuts into their sleep and can lead to dependence.", "Bi": "Teens who had more than 100 mg of caffeine a day slept 46 minutes less on school nights than teens who had none (Source 1).", "Bii": "This supports the claim because caffeine was linked to losing nearly an hour of sleep a night. Caffeine is a stimulant that excites the central nervous system; this explains why it interferes with falling asleep and disrupts the circadian rhythm's normal signal to sleep at night.", "Ci": "76% of teens who regularly drank caffeine reported withdrawal symptoms such as headaches or irritability when they went a day without it (Source 2).", "Cii": "This supports limiting caffeine because many teens are already physically dependent on it. This is explained by tolerance and withdrawal: with regular use the body adapts, so teens need more caffeine for the same effect, and stopping causes discomfort, which keeps them using it."}}, {"id": "pets", "title": "Animals and Stress", "topic": "Health psychology · Coping", "question": "Develop and justify an argument about whether colleges should offer therapy animal programs to reduce student stress.", "sources": [{"title": "Therapy Dogs and Stress", "text": "246 undergraduates were randomly assigned to pet therapy dogs for 10 minutes, watch a slideshow of dogs, or wait. The petting group had significantly lower salivary cortisol afterward, while the other groups did not."}, {"title": "Long-Term Effects", "text": "In an 8-week study of 300 college students at risk for academic problems, those who spent time with therapy dogs weekly showed greater improvements in executive function (planning and memory) than students who only attended stress management lectures."}, {"title": "Animal Programs and Allergies", "text": "A survey of 50 universities with therapy animal programs found that 92% of attending students said the program reduced their stress, but 6% of students reported avoiding events because of allergies or fear of dogs."}], "topicWords": ["animal", "dog", "stress", "college", "therapy"], "model": {"A": "Colleges should offer therapy animal programs because interacting with animals reduces students' stress and helps them think more clearly.", "Bi": "Students who petted therapy dogs for 10 minutes had significantly lower cortisol afterward, while students who watched a slideshow of dogs or waited did not (Source 1).", "Bii": "This supports the claim because touching a real animal lowered a biological stress marker. This connects to the General Adaptation Syndrome: chronic stress keeps students in the resistance stage with stress hormones flowing, and a calming activity can lower cortisol before they reach the exhaustion stage.", "Ci": "Students at risk for academic problems who spent time with therapy dogs every week for 8 weeks improved more in planning and memory than students who attended stress lectures (Source 2).", "Cii": "This supports the claim because lower stress was linked to better thinking skills. This can be explained by the prefrontal cortex, which handles planning, judgment, and decision making; high stress impairs it, so reducing stress lets it function better."}}, {"id": "gratitude", "title": "Gratitude and Well-Being", "topic": "Positive psychology · Depression", "question": "Develop and justify an argument about whether writing gratitude letters improves mental health.", "sources": [{"title": "Gratitude Letters in Therapy", "text": "293 adults seeking counseling were randomly assigned to write a gratitude letter each week for 3 weeks, write about negative experiences, or do no writing. Twelve weeks later, the gratitude group reported significantly better mental health than both other groups."}, {"title": "Gratitude and Sleep", "text": "In a study of 401 adults, people who scored higher on a gratitude questionnaire fell asleep faster and slept longer (r = +.29). People who were grateful had fewer negative thoughts before sleep."}, {"title": "Limits of Gratitude Exercises", "text": "A meta-analysis of 38 studies found that gratitude exercises had only a small effect on depression (d = 0.13). Effects were larger for people who did the exercises voluntarily rather than because they were assigned to."}], "topicWords": ["gratitude", "grateful", "mental health", "writing", "letter"], "model": {"A": "Writing gratitude letters improves mental health, but the benefits are modest and strongest for people who choose to do it.", "Bi": "Adults who wrote a weekly gratitude letter for 3 weeks reported better mental health 12 weeks later than adults who wrote about negative experiences or did no writing (Source 1).", "Bii": "This supports the claim because gratitude writing had a lasting positive effect on mental health. This can be explained by cognitive restructuring: focusing on positive events replaces automatic negative thoughts with more positive, realistic ones, which improves mood over time.", "Ci": "A meta-analysis of 38 studies found gratitude exercises had only a small effect on depression (d = 0.13), with larger effects for people who did them voluntarily (Source 3).", "Cii": "This supports the claim that benefits are modest and depend on choice. This is explained by intrinsic motivation: people who do an activity because they want to engage with it more deeply and get more out of it than people pushed by outside requirements."}}, {"id": "teletherapy", "title": "Online vs. In-Person Therapy", "topic": "Treatment · Psychotherapy", "question": "Develop and justify an argument about whether online therapy is as effective as in-person therapy.", "sources": [{"title": "Online CBT for Depression", "text": "A study of 1,200 adults in Australia randomly assigned people with depression to 8 weeks of online CBT or face-to-face CBT. Both groups showed similar reductions in depression scores (about 45% average improvement)."}, {"title": "Therapeutic Relationship Online", "text": "Clients in video therapy rated their bond with their therapist at 4.3 out of 5, compared with 4.5 for in-person clients. The difference was not statistically significant."}, {"title": "Access to Care", "text": "After a rural clinic in Montana began offering video therapy, the number of patients who completed at least 8 sessions rose from 41% to 63%, mostly because patients no longer had to drive long distances."}], "topicWords": ["online", "therapy", "in-person", "effective", "video"], "model": {"A": "Online therapy is as effective as in-person therapy and should be offered because it helps more people complete treatment.", "Bi": "Adults with depression who received 8 weeks of online CBT improved by about 45%, the same as adults who received face-to-face CBT (Source 1).", "Bii": "This supports the claim because both formats produced the same improvement. CBT works by cognitive restructuring, helping clients identify and replace negative thoughts; this process depends on what is taught and practiced, not on being in the same room, so it works just as well online.", "Ci": "After a rural clinic offered video therapy, the share of patients completing at least 8 sessions rose from 41% to 63% (Source 3).", "Cii": "This supports offering online therapy because more people finished treatment when it was easier to attend. From the humanistic perspective, therapy helps people reach their full potential through a supportive relationship, and removing barriers lets more people experience the unconditional positive regard that drives growth."}}, {"id": "medvsCBT", "title": "Medication or Therapy for Depression", "topic": "Treatment", "question": "Develop and justify an argument about whether depression should be treated with medication, therapy, or both.", "sources": [{"title": "Combined Treatment", "text": "681 adults with chronic depression were randomly assigned to an antidepressant, CBT, or both for 12 weeks. 48% improved with medication alone, 48% with therapy alone, and 73% with both."}, {"title": "Relapse After Treatment", "text": "After treatment ended, 76% of patients treated only with medication relapsed within a year, compared with 31% of patients who had received CBT."}, {"title": "Speed of Improvement", "text": "Patients taking antidepressants reported noticeable improvement after about 4 weeks on average, while therapy patients reported noticeable improvement after about 8 weeks."}], "topicWords": ["medication", "therapy", "depress", "treat", "both"], "model": {"A": "Depression should be treated with both medication and therapy because the combination helps the most people improve.", "Bi": "After 12 weeks, 73% of adults with chronic depression improved with both medication and CBT, compared with 48% with either one alone (Source 1).", "Bii": "This supports the claim because combining treatments helped far more patients. This fits the biopsychosocial model: depression involves biological factors (like serotonin imbalances that antidepressants target) and psychological factors (like negative thinking that therapy targets), so treating both works best.", "Ci": "76% of patients treated only with medication relapsed within a year, compared with 31% of patients who had received CBT (Source 2).", "Cii": "This supports including therapy because therapy gave patients lasting protection. Aaron Beck's cognitive theory explains this: CBT teaches patients to recognize and challenge the negative cognitive triad (negative thoughts about the self, world, and future), a skill that keeps working after treatment ends."}}, {"id": "nature", "title": "Nature and Attention", "topic": "Attention · Stress", "question": "Develop and justify an argument about whether spending time in nature improves mental functioning.", "sources": [{"title": "Nature Walks and Memory", "text": "38 adults were randomly assigned to take a 50-minute walk in an arboretum or along a busy downtown street. Those who walked in nature improved their scores on a backward digit span memory test by 20%, while city walkers showed no improvement."}, {"title": "Green Space and Mental Health", "text": "A study of 943,000 people in Denmark found that children who grew up with the least green space nearby had up to a 55% higher risk of developing a psychiatric disorder later in life than those with the most green space."}, {"title": "Nature and Rumination", "text": "Participants who walked in a natural area for 90 minutes reported less rumination (repetitive negative thinking) and showed reduced activity in a brain region linked to sadness, compared with participants who walked in an urban area."}], "topicWords": ["nature", "green", "walk", "attention", "mental"], "model": {"A": "Spending time in nature improves mental functioning by restoring attention and reducing negative thinking.", "Bi": "Adults who took a 50-minute walk in an arboretum improved their backward digit span scores by 20%, while those who walked downtown showed no improvement (Source 1).", "Bii": "This supports the claim because time in nature improved a memory skill. This can be explained by working memory, the short-term system that holds and manipulates information; a calm natural setting lets it recover from the demands of busy city stimuli, so it performs better afterward.", "Ci": "People who walked in nature for 90 minutes reported less rumination than those who walked in an urban area (Source 3).", "Cii": "This supports the claim because nature reduced repetitive negative thinking. Selective attention explains this: in nature, attention is gently drawn outward to the surroundings instead of focusing on one's own worries, which interrupts the cycle of rumination."}}, {"id": "support", "title": "Social Support and Health", "topic": "Health psychology", "question": "Develop and justify an argument about whether social relationships protect physical health.", "sources": [{"title": "Loneliness and Mortality", "text": "A meta-analysis of 148 studies with 308,849 participants found that people with strong social relationships had a 50% greater likelihood of survival over the study periods than people with weak social ties."}, {"title": "Social Support and Healing", "text": "Married couples were given small blister wounds. Couples who had a hostile discussion healed 40% more slowly than couples who had a supportive discussion."}, {"title": "Friendship and Colds", "text": "276 adults were exposed to a cold virus. People with 6 or more types of social relationships were about 4 times less likely to develop a cold than people with 1 to 3 types."}], "topicWords": ["social", "relationship", "health", "support", "friend"], "model": {"A": "Strong social relationships protect physical health by reducing stress and strengthening the body's ability to fight illness.", "Bi": "People with 6 or more types of social relationships were about 4 times less likely to develop a cold after exposure to the virus than people with 1 to 3 types (Source 3).", "Bii": "This supports the claim because more relationships meant better resistance to illness. This is explained by the tend-and-befriend response: under stress, seeking out social support calms the body's stress reaction, reducing stress hormones that otherwise cause immunosuppression.", "Ci": "Married couples who had a hostile discussion healed 40% more slowly than couples who had a supportive discussion (Source 2).", "Cii": "This supports the claim because supportive relationships helped the body heal. Hostile conflict activates the sympathetic nervous system and its fight-or-flight response; when this stays active, the body diverts resources away from repair, so healing slows."}}, {"id": "kidsscreens", "title": "Screens and Young Children", "topic": "Development · Language", "question": "Develop and justify an argument about whether children under age 3 should have limited screen time.", "sources": [{"title": "Screen Time and Language", "text": "Among 893 children in Canada, each 30-minute increase in daily handheld screen time at 18 months was linked to a 49% higher risk of expressive speech delay."}, {"title": "Video Chat vs. Video", "text": "Toddlers ages 12–25 months learned new words from a person over live video chat as well as from a person in the room, but learned almost no words from a prerecorded video showing the same person."}, {"title": "Parent Talk", "text": "Researchers recorded 329 families at home. For every extra hour of TV on in the background, adults spoke about 770 fewer words to their toddler."}], "topicWords": ["screen", "child", "toddler", "limit", "language"], "model": {"A": "Children under 3 should have limited screen time because screens reduce the language interaction they need to develop speech.", "Bi": "Each 30-minute increase in daily handheld screen time at 18 months was linked to a 49% higher risk of expressive speech delay (Source 1).", "Bii": "This supports the claim because more screen time went with slower speech development. From the sociocultural perspective, children learn language through social interaction with caregivers, so time spent on a screen replaces the back-and-forth talking that builds speech.", "Ci": "For every extra hour of background TV, adults spoke about 770 fewer words to their toddler (Source 3).", "Cii": "This supports limiting screens because even background TV reduced language exposure. This is explained by neuroplasticity: a young child's brain rapidly forms connections based on experience, so hearing fewer words means fewer language connections are strengthened."}}, {"id": "adhdmove", "title": "Physical Activity and ADHD", "topic": "Neurodevelopmental disorders", "question": "Develop and justify an argument about whether schools should add physical activity breaks to help students with ADHD.", "sources": [{"title": "Movement Breaks", "text": "54 elementary students with ADHD were randomly assigned to movement breaks or quiet reading breaks. Students with movement breaks were on task 79% of the time compared with 62% for reading breaks."}, {"title": "Exercise and Dopamine", "text": "In a brain imaging study of 24 adults, 30 minutes of aerobic exercise increased the availability of dopamine in brain regions involved in attention."}, {"title": "Before-School Program", "text": "202 children ages 6–8 in Vermont and Indiana did 31 minutes of activity before school for 12 weeks. Children with ADHD symptoms showed a 23% greater reduction in inattention ratings from parents than children in a sedentary program."}], "topicWords": ["physical activity", "exercise", "adhd", "movement", "school", "break"], "model": {"A": "Schools should add physical activity breaks because movement improves attention in students with ADHD.", "Bi": "Students with ADHD who had movement breaks were on task 79% of the time, compared with 62% for students with reading breaks (Source 1).", "Bii": "This supports the claim because movement breaks helped students focus. This can be explained by operant conditioning: if teachers make breaks a reward for focused work, the break acts as positive reinforcement, increasing on-task behavior.", "Ci": "30 minutes of aerobic exercise increased the availability of dopamine in brain regions involved in attention (Source 2).", "Cii": "This supports the claim by showing a biological reason exercise helps. From the biological perspective, ADHD is linked to differences in brain chemistry; exercise boosts neurotransmitter activity in attention circuits, much like stimulant medications do, which improves focus."}}, {"id": "placebo", "title": "The Power of Expectations", "topic": "Research methods · Placebo effect", "question": "Develop and justify an argument about whether expectations can change how people feel physically.", "sources": [{"title": "Placebo Pain Relief", "text": "60 students had a heat stimulus applied to their arm after receiving an inactive cream. Those told it was a powerful pain reliever rated pain at 4.1 out of 10, while those told it was a moisturizer rated it 6.3."}, {"title": "Open-Label Placebo", "text": "97 adults with chronic back pain took pills they were told were placebos. After 3 weeks, their pain decreased by 30% compared with 9% for patients who continued usual care."}, {"title": "Price and Placebo", "text": "Participants who were told a fake painkiller cost $2.50 a pill reported pain relief 85% of the time, compared with 61% for those told it cost 10 cents."}], "topicWords": ["expectation", "placebo", "pain", "feel", "belie"], "model": {"A": "Expectations can change how people feel physically, because believing a treatment will work reduces the pain they experience.", "Bi": "Students who were told an inactive cream was a powerful pain reliever rated heat pain at 4.1 out of 10, compared with 6.3 for students told it was a moisturizer (Source 1).", "Bii": "This supports the claim because only the expectation differed, yet pain changed. This can be explained by top-down processing: the brain uses expectations to interpret incoming sensations, so expecting relief shapes the perception of pain.", "Ci": "Participants told a fake painkiller cost $2.50 reported relief 85% of the time, compared with 61% for those told it cost 10 cents (Source 3).", "Cii": "This supports the claim because a higher price raised expectations and led to more relief. Gate control theory explains how expectations can affect pain: signals from the brain can close the spinal cord's \"gate,\" blocking some pain signals from reaching the brain."}}, {"id": "stressimmune", "title": "Stress and Getting Sick", "topic": "Health psychology · Stress", "question": "Develop and justify an argument about whether chronic stress makes people more likely to get sick.", "sources": [{"title": "Stress and Colds", "text": "276 adults were exposed to a cold virus. People who had experienced chronic stress for at least a month were 2 to 3 times more likely to develop a cold than people with no chronic stress."}, {"title": "Exams and Immunity", "text": "Medical students' blood was tested during a calm period and during exams. During exams, their natural killer cells (immune cells that fight viruses) were 25% less active."}, {"title": "Caregivers and Healing", "text": "Adults caring for a family member with dementia took 24% longer to heal a small wound than similar adults who were not caregivers."}], "topicWords": ["stress", "sick", "ill", "immune", "chronic"], "model": {"A": "Chronic stress makes people more likely to get sick because it weakens the immune system.", "Bi": "People who had experienced chronic stress for at least a month were 2 to 3 times more likely to develop a cold after exposure to the virus (Source 1).", "Bii": "This supports the claim because long-term stress greatly increased the chance of illness. The General Adaptation Syndrome explains this: under ongoing stress the body moves from the resistance stage into the exhaustion stage, when its resources are depleted and it is more vulnerable to disease.", "Ci": "During exams, medical students' natural killer cells were 25% less active than during a calm period (Source 2).", "Cii": "This supports the claim by showing stress directly weakens immune cells. Stress activates the sympathetic nervous system and the release of the stress hormone cortisol, which leads to immunosuppression, leaving the body less able to fight viruses."}}, {"id": "naps", "title": "Naps and Learning", "topic": "Sleep · Memory", "question": "Develop and justify an argument about whether schools should give students time for short naps.", "sources": [{"title": "Naps and Memory", "text": "Students who learned 50 word pairs and then took a 60-minute nap recalled 78% of them later, compared with 63% for students who stayed awake."}, {"title": "Short Naps and Alertness", "text": "A 10-minute nap improved alertness and reaction time for 2.5 hours in sleep-deprived adults, while a 30-minute nap caused grogginess for about 15 minutes afterward."}, {"title": "Napping in Chinese Schools", "text": "A survey of 2,928 students ages 10–12 in China, where midday naps are common, found that students who napped 3 or more times a week had 7.6% higher academic achievement scores and fewer behavior problems."}], "topicWords": ["nap", "school", "student", "time", "learn"], "model": {"A": "Schools should give students time for short naps because napping improves memory and alertness.", "Bi": "Students who took a 60-minute nap after learning 50 word pairs recalled 78% of them, compared with 63% for students who stayed awake (Source 1).", "Bii": "This supports the claim because napping after learning helped students remember more. Memory consolidation explains this: during sleep, the hippocampus helps transfer new memories into long-term storage, so a nap after class protects what was just learned.", "Ci": "Students in China who napped 3 or more times a week had 7.6% higher academic achievement scores than those who napped less (Source 3).", "Cii": "This supports the claim because frequent napping was linked to better school performance. The circadian rhythm explains why a midday nap fits: alertness naturally dips in the early afternoon, so a short rest during that dip restores energy for the rest of the school day."}}, {"id": "concussion", "title": "Youth Football and the Brain", "topic": "The brain · Neuroplasticity", "question": "Develop and justify an argument about whether children under 12 should play tackle football.", "sources": [{"title": "Early Tackle Football", "text": "Among 214 former football players, those who began tackle football before age 12 had twice the risk of problems with behavior and mood later in life as those who started at 12 or older."}, {"title": "Head Impacts in Youth Players", "text": "Sensors in helmets of 9- to 12-year-old players recorded an average of 240 head impacts per season, and some impacts were as forceful as those in college football."}, {"title": "Benefits of Team Sports", "text": "In a survey of 11,000 adolescents, those who played team sports had 19% lower odds of depression symptoms than those who did not play any sport."}], "topicWords": ["football", "tackle", "child", "under 12", "brain"], "model": {"A": "Children under 12 should not play tackle football because repeated head impacts can harm their developing brains, though they should play safer team sports instead.", "Bi": "Former players who began tackle football before age 12 had twice the risk of later behavior and mood problems as those who started at 12 or older (Source 1).", "Bii": "This supports the claim because early tackle football was linked to long-term problems. The prefrontal cortex, which handles judgment and emotional control, is still developing in childhood; repeated hits during this period may disrupt its development, leading to later mood and behavior issues.", "Ci": "Children who played team sports had 19% lower odds of depression symptoms than those who did not play any sport (Source 3).", "Cii": "This supports having children play safer team sports instead because sports benefit mental health. Social support explains this benefit: being part of a team provides belonging and encouragement, which buffers stress and protects against depression."}}, {"id": "rewards", "title": "Paying Kids to Read", "topic": "Motivation · Learning", "question": "Develop and justify an argument about whether schools should give students rewards for reading books.", "sources": [{"title": "Pizza for Pages", "text": "In a program across 2,500 elementary schools, students earned a free pizza for reading a set number of books. During the 6-month program, students in participating classes read an average of 8 more books than students in non-participating classes."}, {"title": "After the Rewards Stop", "text": "Researchers followed 160 fourth graders after a 4-week reading reward program ended. Students who had been rewarded chose to read during free time 22% of the time afterward, compared with 41% for similar students who had never been rewarded."}, {"title": "Choice and Reading", "text": "In a study of 1,100 middle school students in Texas, students who were allowed to choose their own books reported enjoying reading 1.5 times more than students assigned books, and read for 15 more minutes per day at home."}], "topicWords": ["reward", "reading", "read", "school", "student"], "model": {"A": "Schools should not give students rewards for reading because rewards boost reading only briefly and can reduce students' love of reading once they stop.", "Bi": "Fourth graders who had been rewarded for reading chose to read during free time only 22% of the time after the program ended, compared with 41% for students who were never rewarded (Source 2).", "Bii": "This supports the claim because the rewarded students read less once the rewards were gone. This is explained by the overjustification effect: when people are rewarded for something they already enjoy, their intrinsic motivation drops because they start to see the activity as something done for a prize.", "Ci": "Middle school students who chose their own books enjoyed reading 1.5 times more and read 15 more minutes per day at home than students assigned books (Source 3).", "Cii": "This supports the claim because students can be motivated to read without prizes. Self-determination theory explains this: people are most motivated when their needs for autonomy, competence, and relatedness are met, and letting students choose books gives them autonomy."}}, {"id": "allnighter", "title": "Pulling an All-Nighter", "topic": "Sleep · Memory", "question": "Develop and justify an argument about whether students should stay up all night to study before a test.", "sources": [{"title": "Sleep Loss and Learning", "text": "28 young adults either slept normally or stayed awake for 35 hours, then tried to learn 150 pictures. The sleep-deprived group remembered 19% fewer pictures two days later than the group that slept."}, {"title": "Students Who Never Pulled All-Nighters", "text": "In a survey of 120 students at a college in New York, students who had pulled at least one all-nighter that semester had an average GPA of 2.95, compared with 3.1 for students who never had."}, {"title": "Sleep and Reaction Time", "text": "After 24 hours without sleep, 40 adults performed on a driving simulator about as poorly as people with a blood alcohol level of 0.10%, which is above the legal limit for driving."}], "topicWords": ["all night", "all-night", "study", "sleep", "stay up", "test"], "model": {"A": "Students should not stay up all night to study because losing sleep makes it harder to remember what they studied and to perform well.", "Bi": "Young adults who stayed awake for 35 hours remembered 19% fewer pictures two days later than adults who slept normally (Source 1).", "Bii": "This supports the claim because staying awake hurt the ability to learn new information. This is explained by the hippocampus, which forms new memories; without sleep it does not work well, so less new information can be stored.", "Ci": "After 24 hours without sleep, adults performed on a driving simulator about as poorly as people with a blood alcohol level of 0.10% (Source 3).", "Cii": "This supports the claim because sleep loss impairs performance as much as being drunk. The prefrontal cortex, which handles attention, judgment, and quick decisions, is especially weakened by sleep deprivation, so tired students make more mistakes on tests."}}, {"id": "praise", "title": "Praising Effort vs. Intelligence", "topic": "Motivation · Development", "question": "Develop and justify an argument about how parents and teachers should praise children.", "sources": [{"title": "Effort Praise and Persistence", "text": "128 fifth graders solved puzzles and were randomly praised either for being smart or for working hard. When given a harder puzzle afterward, 90% of the effort-praised children chose a challenging task, compared with about 33% of the intelligence-praised children."}, {"title": "Praise at Home", "text": "Researchers recorded parents talking with their 1- to 3-year-olds at home and followed the children for 5 years. Children whose parents gave more effort praise were more likely at ages 7–8 to believe that abilities can improve with practice (r = +.32)."}, {"title": "Mindset Intervention", "text": "A 50-minute online lesson teaching that the brain can grow with effort was given to 12,000 ninth graders in the U.S. Lower-achieving students who took the lesson raised their GPAs by 0.10 points more than students who did not."}], "topicWords": ["praise", "effort", "child", "parent", "teacher"], "model": {"A": "Parents and teachers should praise children's effort rather than their intelligence because effort praise makes children more willing to take on challenges.", "Bi": "90% of fifth graders praised for working hard chose a challenging puzzle, compared with about 33% of children praised for being smart (Source 1).", "Bii": "This supports the claim because effort praise led children to seek out challenges. This is explained by growth mindset: children praised for effort learn that ability can improve, so they see hard tasks as chances to grow rather than threats to their image of being smart.", "Ci": "Lower-achieving ninth graders who took a 50-minute lesson about the brain growing with effort raised their GPAs 0.10 points more than students who did not (Source 3).", "Cii": "This supports the claim because teaching that effort matters improved real grades. Self-efficacy explains this: when students believe their effort will lead to success, they feel capable of succeeding and work harder, which raises their grades."}}, {"id": "music", "title": "Music While Studying", "topic": "Attention · Memory", "question": "Develop and justify an argument about whether students should listen to music while studying.", "sources": [{"title": "Lyrics and Reading", "text": "64 college students read passages in silence, with instrumental music, or with music that had lyrics. Students reading with lyrical music scored 18% lower on comprehension than those in silence; instrumental music did not significantly lower scores."}, {"title": "Music and Mood", "text": "In a survey of 500 high school students, 72% said music helped them feel less bored while doing homework, and students who listened to music they liked reported starting homework sooner."}, {"title": "Memorizing Lists", "text": "Participants who memorized lists of letters while listening to music they liked recalled 11% fewer letters than participants who worked in quiet, even though many said the music helped them."}], "topicWords": ["music", "study", "listen", "student"], "model": {"A": "Students should study in silence or with instrumental music only, because music with lyrics interferes with learning even when students think it helps.", "Bi": "College students who read with lyrical music scored 18% lower on comprehension than students who read in silence (Source 1).", "Bii": "This supports the claim because lyrics lowered how well students understood what they read. This is explained by working memory: it has a limited capacity, and processing the words in a song competes with processing the words being read.", "Ci": "People who memorized lists while listening to music they liked recalled 11% fewer letters than people who worked in quiet, even though many said the music helped (Source 3).", "Cii": "This supports the claim because students' belief that music helps did not match their actual results. This is an example of confirmation bias: students notice times music felt helpful and ignore evidence that it hurts their memory, so they keep studying with it."}}, {"id": "teenbrain", "title": "Raising the Driving Age", "topic": "Development · The brain", "question": "Develop and justify an argument about whether the minimum age for an unrestricted driver's license should be raised to 18.", "sources": [{"title": "Teen Crash Rates", "text": "Drivers ages 16–17 in the U.S. had a crash rate about 3 times higher per mile driven than drivers age 20 and older. Crash risk was highest in the first 6 months after getting a license."}, {"title": "Passengers and Risk", "text": "In a driving simulator study of 66 teenage drivers, teens who drove with a friend in the car ran 40% more yellow lights and took more risks than teens who drove alone. Adults' driving did not change with passengers."}, {"title": "Graduated Licensing", "text": "States with strict graduated licensing laws (limits on night driving and teen passengers for new drivers) saw a 20% drop in fatal crashes among 16-year-old drivers compared with states without such laws."}], "topicWords": ["driv", "license", "age", "18", "teen"], "model": {"A": "The minimum age for an unrestricted driver's license should be raised to 18 because younger teens take more risks behind the wheel and crash more often.", "Bi": "Drivers ages 16–17 had a crash rate about 3 times higher per mile driven than drivers age 20 and older (Source 1).", "Bii": "This supports the claim because younger drivers were far more dangerous. This is explained by the prefrontal cortex, which controls judgment and impulse control; it is not fully developed until the mid-20s, so younger teens are less able to weigh risks while driving.", "Ci": "Teens who drove with a friend in the car ran 40% more yellow lights than teens who drove alone, while adults' driving did not change (Source 2).", "Cii": "This supports the claim because young drivers take more risks under peer influence. This is explained by the limbic system, the brain's emotion and reward system, which is highly active in adolescence; the presence of peers boosts the rewarding feeling of risky behavior."}}, {"id": "loneliness", "title": "Loneliness in Older Adults", "topic": "Health psychology · Development", "question": "Develop and justify an argument about whether communities should invest in programs that connect older adults with others.", "sources": [{"title": "Loneliness and Health", "text": "A study of 3,000 adults ages 57–85 in the U.S. found that those who felt lonely had blood pressure readings an average of 14 points higher than those who did not, and were 45% more likely to die over the 6-year study."}, {"title": "Intergenerational Program", "text": "Older adults who volunteered in elementary schools for 15 hours a week for one school year showed improved memory test scores and increased activity in brain areas linked to planning, compared with a waitlist group."}, {"title": "Phone Call Program", "text": "240 adults over 65 who received short, friendly phone calls 2–5 times a week for 4 weeks reported 20% less loneliness and fewer symptoms of anxiety than adults who did not receive calls."}], "topicWords": ["older", "elder", "connect", "community", "program", "senior"], "model": {"A": "Communities should invest in programs that connect older adults with others because social connection improves their physical health, thinking, and mood.", "Bi": "Older adults who volunteered in elementary schools 15 hours a week for a year showed improved memory test scores compared with a waitlist group (Source 2).", "Bii": "This supports the claim because staying socially active helped older adults' thinking. This is explained by neuroplasticity: the brain keeps forming and strengthening connections in late adulthood when it is challenged by new activities and social interaction.", "Ci": "Adults over 65 who received friendly phone calls 2–5 times a week reported 20% less loneliness and fewer anxiety symptoms than adults who did not (Source 3).", "Cii": "This supports the claim because even small amounts of contact improved mood. Erikson's final stage, integrity versus despair, explains this: older adults who feel connected and valued are more likely to look back on life with satisfaction rather than despair."}}, {"id": "marijuana", "title": "Teen Cannabis Use", "topic": "Drugs · The brain", "question": "Develop and justify an argument about whether communities should invest in programs to prevent teenagers from using marijuana.", "sources": [{"title": "Memory and Teen Users", "text": "Researchers compared 48 adolescents who used marijuana weekly with 50 non-users. The weekly users scored 12% lower on a test of verbal memory, even after not using for one month."}, {"title": "Age of First Use", "text": "A study of 1,037 people in New Zealand followed from birth to age 38 found that those who used marijuana regularly starting in their teens lost an average of 8 IQ points; people who started as adults did not show the same drop."}, {"title": "Prevention Program", "text": "Middle schools in Iowa that used a 7-session prevention program had 33% fewer students who tried marijuana by 12th grade than schools without the program."}], "topicWords": ["marijuana", "cannabis", "teen", "prevent", "program"], "model": {"A": "Communities should invest in programs to prevent teens from using marijuana because using it during adolescence can cause lasting harm to memory and thinking.", "Bi": "People who used marijuana regularly starting in their teens lost an average of 8 IQ points by age 38, but those who started as adults did not (Source 2).", "Bii": "This supports the claim because the harm happened when use began in adolescence. This is explained by synaptic pruning: the teenage brain is still removing unused connections and strengthening others, so a drug during this period can disrupt how brain connections are shaped.", "Ci": "Middle schools that used a 7-session prevention program had 33% fewer students who tried marijuana by 12th grade (Source 3).", "Cii": "This supports the claim because prevention programs actually work. From the sociocultural perspective, teens are influenced by the norms of the people around them, and prevention programs change the perceived norm so that using drugs seems less common and less accepted."}}, {"id": "eatingdis", "title": "Social Media and Body Image", "topic": "Eating disorders · Social media", "question": "Develop and justify an argument about whether social media platforms should limit appearance-focused content shown to teens.", "sources": [{"title": "Instagram and Body Satisfaction", "text": "112 young women were randomly assigned to view Instagram posts of thin, edited models or posts of travel scenes for 10 minutes. Afterward, the model group's body satisfaction scores dropped by 14% while the travel group's did not change."}, {"title": "Eating Disorder Symptoms", "text": "A survey of 1,000 girls ages 12–17 found that those who spent more than 2 hours a day on image-based apps were 2 times as likely to report disordered eating behaviors, such as skipping meals to lose weight."}, {"title": "Body-Positive Posts", "text": "Participants who viewed body-positive posts (showing a range of body types) for 10 minutes reported higher body satisfaction and appreciation for their own bodies than participants who viewed neutral posts."}], "topicWords": ["social media", "appearance", "body", "teen", "limit", "content"], "model": {"A": "Social media platforms should limit appearance-focused content shown to teens because it lowers body satisfaction and is linked to disordered eating.", "Bi": "Young women who viewed Instagram posts of thin, edited models for 10 minutes had a 14% drop in body satisfaction, while those who viewed travel posts did not change (Source 1).", "Bii": "This supports the claim because even brief exposure to idealized bodies made people feel worse about their own. This is explained by social comparison theory: viewers compare themselves to edited, unrealistic images, making upward comparisons that lower their self-esteem.", "Ci": "Participants who viewed body-positive posts showing a range of body types reported higher body satisfaction than those who viewed neutral posts (Source 3).", "Cii": "This supports limiting harmful content and showing different content instead. The sociocultural perspective explains this: beauty standards are learned from the culture around us, so changing which bodies teens see can change what they consider normal and attractive."}}, {"id": "ptsdtreat", "title": "Treating PTSD", "topic": "Treatment · Trauma disorders", "question": "Develop and justify an argument about whether exposure-based therapy should be the first treatment offered for PTSD.", "sources": [{"title": "Prolonged Exposure Therapy", "text": "In a study of 284 female veterans with PTSD, those who received 10 sessions of prolonged exposure therapy (repeatedly and safely revisiting trauma memories) were 1.8 times more likely to no longer meet criteria for PTSD than veterans who received supportive talk therapy."}, {"title": "Lasting Gains", "text": "Five years after treatment with exposure-based therapy, 78% of 171 patients with PTSD from a car accident still showed significant improvement in symptoms."}, {"title": "Dropout Rates", "text": "A review of 55 studies found that about 28% of patients in trauma-focused therapies dropped out, slightly higher than the 23% dropout rate for non-trauma-focused therapies."}], "topicWords": ["exposure", "ptsd", "therapy", "treat", "first"], "model": {"A": "Exposure-based therapy should be the first treatment offered for PTSD because it helps more patients recover and the benefits last.", "Bi": "Female veterans who received 10 sessions of prolonged exposure therapy were 1.8 times more likely to no longer meet criteria for PTSD than veterans who received supportive talk therapy (Source 1).", "Bii": "This supports the claim because exposure therapy helped more people recover. Classical conditioning explains why: trauma reminders became conditioned stimuli for fear, and repeatedly facing them safely without harm leads to extinction of the conditioned fear response.", "Ci": "Five years after exposure-based therapy, 78% of patients still showed significant improvement in symptoms (Source 2).", "Cii": "This supports the claim because the benefits lasted for years. From the behavioral perspective, avoidance keeps PTSD going through negative reinforcement (avoiding reminders relieves anxiety), and exposure therapy breaks this cycle, so improvement lasts."}}, {"id": "bilingual", "title": "Learning a Second Language Early", "topic": "Development · Language", "question": "Develop and justify an argument about whether elementary schools should start teaching a second language in kindergarten.", "sources": [{"title": "Age and Accent", "text": "Researchers tested 240 immigrants who learned English at different ages. Those who began before age 7 spoke with native-like pronunciation 85% of the time, compared with 25% of those who began after age 15."}, {"title": "Bilingual Children and Attention", "text": "In a study of 104 children ages 5–7, bilingual children scored 15% higher than monolingual children on tasks that required switching between rules, such as sorting cards first by color and then by shape."}, {"title": "Language Programs and Test Scores", "text": "In North Carolina, students in dual-language programs that began in kindergarten scored about half a grade level higher in reading by 5th grade than similar students in English-only classes."}], "topicWords": ["second language", "language", "kindergarten", "school", "teach"], "model": {"A": "Elementary schools should start teaching a second language in kindergarten because young children learn languages more easily and gain thinking skills.", "Bi": "Immigrants who began learning English before age 7 spoke with native-like pronunciation 85% of the time, compared with 25% of those who began after 15 (Source 1).", "Bii": "This supports the claim because children who started young learned the language much more naturally. This is explained by the critical period for language: there is a window in early childhood when the brain is especially ready to learn language, so starting in kindergarten takes advantage of it.", "Ci": "Bilingual children scored 15% higher than monolingual children on tasks that required switching between rules (Source 2).", "Cii": "This supports the claim because learning two languages strengthened children's thinking skills. This is explained by neuroplasticity: young brains rewire based on experience, and regularly switching between languages strengthens the brain networks used for attention and flexible thinking."}}];

function ebqSave(){const D=EBQS.get(), id=S.ebq.id; D.drafts[id]=D.drafts[id]||{}; document.querySelectorAll('[data-ebq-part]').forEach(t=>D.drafts[id][t.dataset.ebqPart]=t.value); EBQS.set(D); return D}
async function ebqCheck(){
  const D=ebqSave(), A=S.ebq, set=ebqFind(A.id), ans=D.drafts[set.id]||{};
  A.err=''; let G=null;
  if(GEM.get().key){ A.loading=true; renderEBQ();
    try{ G=await ebqGeminiGrade(set,ans) }catch(e){ A.err=e.message||String(e) }
    A.loading=false; if(S.ebq!==A) return; }
  if(!G) G=gradeEBQ(set,ans);
  A.graded=G; const D2=EBQS.get(); D2.best[set.id]=Math.max(D2.best[set.id]??0,G.total); EBQS.set(D2); renderEBQ();
  const art=document.querySelector('.aaq-art'); if(art) window.scrollTo({top:art.offsetTop+art.offsetHeight-60});
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.ebqPart&&S.ebq){clearTimeout(ebqSave.t);ebqSave.t=setTimeout(ebqSave,400)}});
function ebqClick(t){
  if(t.dataset.ebqStart){S.ebq={id:t.dataset.ebqStart,mode:t.dataset.mode,phase:'read',end:Date.now()+15*60000};if(t.dataset.mode==='timed'){const D=EBQS.get();D.drafts[S.ebq.id]={};EBQS.set(D)}renderEBQ();window.scrollTo({top:0});return true}
  if(t.dataset.ebqHl!==undefined){const D=EBQS.get(),id=S.ebq.id,i=+t.dataset.ebqHl,s=new Set(D.hl[id]||[]);s.has(i)?s.delete(i):s.add(i);D.hl[id]=[...s];EBQS.set(D);t.classList.toggle('hl');return true}
  const a=t.dataset.act; if(!a||!a.startsWith('ebq-')) return false;
  if(a==='ebq-back'){if(S.ebq)ebqSave();S.ebq=null;renderEBQ()}
  else if(a==='ebq-random'){const D=EBQS.get(),todo=ebqAll().filter(x=>D.best[x.id]===undefined),pool=todo.length?todo:ebqAll(),x=pool[Math.floor(Math.random()*pool.length)];S.ebq={id:x.id,mode:'free',phase:'write'};renderEBQ();window.scrollTo({top:0})}
  else if(a==='ebq-gen'){const n=$('#gemnote'),b=t;b.disabled=true;b.textContent='Writing sources… (up to 30s)';ebqGenerate($('#gentopic').value).then(x=>{S.ebq={id:x.id,mode:'free',phase:'write'};renderEBQ();window.scrollTo({top:0})}).catch(e=>{b.disabled=false;b.textContent='Generate';n.textContent='✗ '+e.message})}
  else if(a==='ebq-check')ebqCheck();
  else if(a==='ebq-skipread'){S.ebq.phase='write';S.ebq.end=Date.now()+30*60000;renderEBQ()}
  else if(a==='ebq-clear'){if(confirm('Clear all your answers for this prompt?')){const D=EBQS.get();D.drafts[S.ebq.id]={};EBQS.set(D);S.ebq.graded=null;renderEBQ()}}
  return true;
}

/* ---------- Settings ---------- */
const SETTINGS = [
  {g:'Display'},
  {k:'theme', label:'Theme', opts:[['auto','Match device'],['light','Light'],['dark','Dark']]},
  {k:'size', label:'Text size', opts:[['s','Small'],['m','Normal'],['l','Large'],['xl','Extra large']]},
  {k:'hooks', label:'Memory hooks', help:'Hide them to test whether you know the term without the trick.', opts:[[true,'Show'],[false,'Hide']]},
  {g:'Decks'},
  {k:'includeOpt', label:'Optional topics in "All decks"', help:'Adds Optional: Split Brain to All decks in the study guide, flashcards, and quizzes. It never counts toward the main progress bar.', opts:[[false,'Leave out'],[true,'Include']]},
  {g:'Flashcards'},
  {k:'fcPool', label:'Which cards', help:'Trouble terms are cards you\'ve missed in Learn lessons and haven\'t fixed yet.', opts:[['unknown','Not known yet'],['all','All cards'],['weak','Trouble terms']]},
  {k:'fcOrder', label:'Order', help:'In order follows the study guide, section by section.', opts:[['shuffle','Shuffled'],['section','In order']]},
  {g:'Quiz'},
  {k:'quizMix', label:'Question type', opts:[['mixed','Mixed'],['terms','Terms only'],['scen','Scenarios only']]},
  {k:'quizDir', label:'Term questions ask', opts:[['mixed','Both ways'],['def','Definition → term'],['term','Term → definition']]},
  {k:'quizFocus', label:'Focus', help:'"Not known first" pulls cards you haven\'t marked “got it” before the rest.', opts:[['unknown','Not known first'],['random','Random'],['weak','Trouble terms']]},
  {k:'timer', label:'Timer per question', help:'Running out of time counts as a miss. Timers only apply to the Quiz tab, not Learn.', opts:[[0,'Off'],[15,'15s'],[30,'30s'],[60,'60s']]}
];
function renderSettings(){
  let h='<div class="qbox">', open=false;
  SETTINGS.forEach(s=>{
    if(s.g){h+=(open?'</div>':'')+`<div class="set-group"><h2>${esc(s.g)}</h2>`;open=true;return}
    h+=`<div class="set-row"><div class="label">${esc(s.label)}</div><div class="seg">${s.opts.map(([v,l])=>`<button class="btn small" data-set="${s.k}" data-val="${esc(JSON.stringify(v))}" aria-pressed="${S.set[s.k]===v}">${esc(l)}</button>`).join('')}</div>${s.help?`<p>${esc(s.help)}</p>`:''}</div>`;
  });
  const known=CARDS.filter(c=>S.known[c.id]).length, weak=CARDS.filter(c=>S.miss[c.id]).length;
  h+=`</div><div class="set-group"><h2>Your progress</h2>
    <p class="deck-sub" style="margin:0">${known} terms marked “got it,” ${S.done.length} lessons done, ${weak} trouble terms. Progress is saved in this browser only. Back it up before clearing your browser data or switching devices.</p>
    <div class="toggle"><button class="btn" data-act="export">Download backup</button><button class="btn" data-act="import">Restore from backup</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p id="dataNote" class="deck-sub" style="margin:0" aria-live="polite"></p>
    <div class="toggle"><button class="btn small" data-act="defaults">Reset settings to default</button></div>
    <p class="deck-sub" style="margin:0;font-size:.88rem">Resetting settings never changes your progress. To erase progress, use “Reset progress” at the top.</p></div></div>`;
  $('#view').innerHTML=h;
}
function exportProgress(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('ps1-')) data[k]=localStorage.getItem(k);}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'psych-unit-1',saved:new Date().toISOString(),data},null,1)],{type:'application/json'}));
  a.download=`psych-unit-1-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importProgress(file){
  const note=$('#dataNote');
  file.text().then(txt=>{
    const j=JSON.parse(txt), d=j&&j.app==='psych-unit-1'&&j.data;
    if(!d||typeof d!=='object'||!Object.keys(d).length||Object.entries(d).some(([k,v])=>!k.startsWith('ps1-')||typeof v!=='string')) throw 0;
    if(!confirm('Restore this backup? It replaces the progress saved in this browser.')) return;
    Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));
    location.reload();
  }).catch(()=>{note.textContent='That file isn\'t a backup from this study kit. Nothing was changed.'});
}

/* ---------- Wiring ---------- */
function render(){renderTabs();renderChips();renderMeter();$('#chips').hidden=S.tab==='settings'||S.tab==='aaq'||S.tab==='ebq'||(S.tab==='quiz'&&!!(S.quiz&&S.quiz.test)); if(S.tab==='learn')renderLearn(); else if(S.tab==='guide')renderGuide(); else if(S.tab==='cards')renderCards(); else if(S.tab==='settings')renderSettings(); else if(S.tab==='aaq')renderAAQ(); else if(S.tab==='ebq')renderEBQ(); else renderQuiz();}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]) importProgress(e.target.files[0]); else if(['tmc','ttf','tscen'].includes(e.target.id)) syncTestInputs();});
document.addEventListener('click',e=>{
  const hs=e.target.closest('[data-aaq-hl]'); if(hs){aaqClick(hs);return}
  const he=e.target.closest('[data-ebq-hl]'); if(he){ebqClick(he);return}
  const t=e.target.closest('button'); if(!t) return;
  if(aaqClick(t)||ebqClick(t)) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;store.set('ps1-tab2',S.tab);render();window.scrollTo({top:0});return}
  if(t.dataset.goto){S.tab=t.dataset.goto;store.set('ps1-tab2',S.tab);if(S.tab==='cards')S.fc=null;if(S.tab==='quiz')S.quiz=null;render();return}
  if(t.dataset.scopeLearn){startScopeLearn(t.dataset.scopeLearn);return}
  if(t.dataset.scopeQuiz){setQuizScope(t.dataset.scopeQuiz);return}
  if(t.dataset.lesson!==undefined){startLesson(+t.dataset.lesson);return}
  if(t.dataset.lopt!==undefined){learnPick(+t.dataset.lopt);return}
  if(t.dataset.deck){S.deck=t.dataset.deck;store.set('ps1-deck',S.deck);S.fc=null;S.quiz=null;
    if(S.tab==='learn'&&S.deck!=='all'){const ls=DECK_VIEW.filter(d=>deckIn(d.id)&&(!d.opt||S.deck===d.id)).flatMap(d=>LESSONS.map((l,i)=>i).filter(i=>LESSONS[i].d===d.id&&!LESSONS[i].skip));startLesson(ls.find(i=>!S.done.includes(i))??ls[0]);renderChips();return}
    render();return}
  if(t.dataset.act&&t.dataset.act.startsWith('l-')){
    const a=t.dataset.act;
    if(a==='l-map'){S.showMap=!S.showMap;renderLearn()}
    else if(a==='l-quiz'){beginLessonQuiz();window.scrollTo({top:0})}
    else if(a==='l-next'){nextLearnQ()}
    else if(a==='l-nextlesson'){startLesson(S.li+1)}
    else if(a==='l-redo'){startLesson(S.li)}
    else if(a==='l-scopequiz'){S.tab='quiz';store.set('ps1-tab2','quiz');setQuizScope(S.deck);render();startQuiz(30);window.scrollTo({top:0})}
    else if(a==='l-scopeexam'){const sc=S.deck;S.tab='quiz';store.set('ps1-tab2','quiz');setQuizScope(sc);render();startTest(examCfg(30));window.scrollTo({top:0})}
    else if(a==='l-final'){S.deck='all';store.set('ps1-deck','all');S.tab='quiz';store.set('ps1-tab2','quiz');render();startQuiz(40)}
    return;
  }
  if(t.dataset.tdeck||t.dataset.tset||(t.dataset.act||'').startsWith('t-')){
    if($('#tmc')) syncTestInputs();
    const T=S.test, a=t.dataset.act;
    if(t.dataset.tdeck){const id=t.dataset.tdeck; T.decks=T.decks.includes(id)?T.decks.filter(x=>x!==id):DECKS.map(d=>d.id).filter(x=>x===id||T.decks.includes(x))}
    else if(t.dataset.tset) T[t.dataset.tset]=JSON.parse(t.dataset.val);
    else if(a==='t-core') T.decks=DECKS.filter(d=>!d.opt).map(d=>d.id);
    else if(a==='t-unit') T.decks=DECKS.filter(d=>d.unit===t.dataset.unit&&!d.opt).map(d=>d.id);
    else if(a==='t-every') T.decks=DECKS.map(d=>d.id);
    else if(a==='t-none') T.decks=[];
    else if(a==='t-start'){startTest();window.scrollTo({top:0});return}
    else if(a==='t-again'){startTest(S.quiz&&S.quiz.cfg);window.scrollTo({top:0});return}
    else if(a==='t-next'){testNav(1);return}
    else if(a==='t-back'){testNav(-1);return}
    else if(a==='t-finish'){finishTest();return}
    saveTest(); S.quizNote=''; renderQuiz(); return;
  }
  if(t.dataset.set){S.set[t.dataset.set]=JSON.parse(t.dataset.val);saveSet();applySet();S.fc=null;S.quiz=null;S.quizNote='';render();return}
  if(t.dataset.know){const id=t.dataset.know;setKnown(id,!S.known[id]);t.setAttribute('aria-pressed',!!S.known[id]);t.textContent=S.known[id]?'✓ Got it':'Got it?';return}
  if(t.dataset.quiz){startQuiz(+t.dataset.quiz);return}
  if(t.dataset.opt!==undefined){pick(+t.dataset.opt);return}
  const a=t.dataset.act;
  if(a==='flip'){S.fc.flipped=!S.fc.flipped;renderCards()}
  else if(a==='got')fcAnswer(true);
  else if(a==='learning')fcAnswer(false);
  else if(a==='shuffle'||a==='again'){S.fc=null;renderCards()}
  else if(a==='front'){S.fcFront=S.fcFront==='term'?'def':'term';store.set('ps1-front',S.fcFront);S.fc.flipped=false;renderCards()}
  else if(a==='only'||a==='pool-all'){S.set.fcPool=a==='pool-all'?'all':POOL_NEXT[S.set.fcPool];saveSet();S.fc=null;renderCards()}
  else if(a==='next'){S.quiz.i++;S.quiz.picked=null;renderQuiz();window.scrollTo({top:0})}
  else if(a==='retry'){startQuiz(0,S.retryIds)}
  else if(a==='newquiz'){S.quiz=null;renderQuiz()}
  else if(a==='exam'){startTest(examCfg(+t.dataset.n));window.scrollTo({top:0})}
  else if(a==='customquiz'){const n=Math.max(1,Math.min(200,parseInt($('#qcount').value,10)||15));store.set('ps1-qcount',n);startQuiz(n)}
  else if(a==='export')exportProgress();
  else if(a==='import')$('#importFile').click();
  else if(a==='defaults'){S.set=Object.assign({},DEF_SET);saveSet();applySet();S.fc=null;S.quiz=null;render()}
});
$('#reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.confirm){S.known={};store.set('ps1-known',{});S.fc=null;S.done=[];S.miss={};S.li=0;S.L=null;store.set('ps1-done',[]);store.set('ps1-miss',{});store.set('ps1-li',0);b.textContent='Reset progress';delete b.dataset.confirm;render();}
  else{b.dataset.confirm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.dataset.confirm){delete b.dataset.confirm;b.textContent='Reset progress'}},3000)}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(S.tab==='learn'&&S.L){
    const L=S.L;
    if(L.phase==='quiz'){
      const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
      if(m!==undefined&&L.picked===null)learnPick(m);
      else if(e.key==='Enter'&&L.picked!==null){e.preventDefault();nextLearnQ()}
    }
    return;
  }
  if(S.tab==='cards'&&S.fc&&S.fc.q.length){
    if(e.code==='Space'){e.preventDefault();S.fc.flipped=!S.fc.flipped;renderCards()}
    else if(e.key==='1')fcAnswer(false); else if(e.key==='2')fcAnswer(true);
  } else if(S.tab==='quiz'&&S.quiz&&S.quiz.i<S.quiz.qs.length){
    const m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[e.key.toLowerCase()];
    if(S.quiz.atEnd){
      if(m!==undefined)pick(m);
      else if(e.key==='Enter'){e.preventDefault();testNav(1)}
      else if(e.key==='ArrowLeft')testNav(-1);
    }
    else if(m!==undefined&&S.quiz.picked===null)pick(m);
    else if(e.key==='Enter'&&S.quiz.picked!==null){S.quiz.i++;S.quiz.picked=null;renderQuiz()}
  }
});
render();
</script>

</body></html>
