, "european", "māori", "other", "age 21–35", "wellington", "new zealand", "26.7", "21", "35"]}, "F": {"data": ["14.3", "6.1"], "concept": ["error", "lane", "driving", "more", "alcohol", "placebo"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to an alcohol drink or a placebo drink, and the researchers manipulated alcohol intake.", "B": "Driving errors were operationally defined as the number of times the simulated car crossed a lane line during a 20-minute route.", "C": "The alcohol group crossed lane lines more often (14.3 times) than the placebo group (6.1 times), which indicates that alcohol made participants' driving much less accurate.", "D": "The researchers followed protection from harm: participants stayed in the lab until their blood alcohol was zero and were driven home by taxi.", "E": "The findings may not generalize to everyone because participants were 21 to 35-year-old moderate drinkers from Wellington, and 76% were European. They may apply to young adult social drinkers but cannot be confidently extended to older drivers, heavy drinkers, or people who never drink.", "F": "The results support the hypothesis. The alcohol group crossed lane lines 14.3 times compared with 6.1 for the placebo group (p < .001), and because the placebo group also expected alcohol, this shows that alcohol itself, a depressant that slows reactions, increased driving errors."}}, {"id": "energy", "title": "Energy Drinks and Teen Sleep", "topic": "Drugs · Sleep", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers examined whether drinking energy drinks is related to how much sleep teens get."], ["Participants", "1,500 high school students in Minnesota completed a statewide school survey. Students were 14 to 18 years old (mean age 15.9). See the table for demographics."], ["Method", "Energy drink use was measured as the number of energy drinks students reported drinking in the past 7 days. Sleep was measured as the number of hours students reported sleeping on a typical school night. Students were not assigned to drink anything. The survey was anonymous, parents could opt their child out, and students could skip any question."], ["Results", "Energy drink use was negatively correlated with school-night sleep (r = -.26, p < .001). Students who had 5 or more energy drinks a week slept 6.1 hours a night on average, compared with 7.3 hours for students who had none."], ["Discussion", "Teens who drank more energy drinks slept less. The researchers note that teens who sleep less might drink energy drinks to stay awake."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "50%"], ["Male", "49%"], ["Nonbinary", "1%"], ["White", "72%"], ["Black", "10%"], ["Hispanic", "9%"], ["Asian", "9%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of energy drink use.", "C": "Describe what the correlation coefficient (r = -.26) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that energy drinks cause teens to sleep less."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["number", "how many", "count"], ["7 days", "past week", "seven days", "energy drink"]], "labels": ["Says it was the number of drinks", "Gives a detail from this study (in the past 7 days)"]}, "C": {"nums": [".26", "6.1", "7.3"], "meaning": ["sleep", "less", "fewer", "hours"], "subject": ["energy drink", "drink"], "kind": "corr"}, "D": {"eth": [{"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["parent", "opt"]}], "notIn": ["debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "adults"], "demo": ["50%", "49%", "1%", "72%", "10%", "9%", "9%", "female", "male", "nonbinary", "white", "black", "hispanic", "asian", "minnesota", "statewide", "15.9", "14", "18"]}, "F": {"data": [".26", "6.1", "7.3", ".001"], "concept": ["sleep", "less", "fewer", "hours", "energy drink", "drink"], "stanceWant": "refute", "stanceHint": "The claim says energy drinks CAUSE less sleep. A correlation can't show cause, so say the results do not prove (or only partly support) the claim."}}, "model": {"A": "The research method is a correlational study because the researchers measured energy drink use and sleep from a survey without manipulating either.", "B": "Energy drink use was operationally defined as the number of energy drinks students reported drinking in the past 7 days.", "C": "The correlation of r = -.26 indicates a weak negative relationship: teens who drank more energy drinks tended to get fewer hours of sleep on school nights.", "D": "The researchers followed confidentiality: the survey was anonymous.", "E": "The findings may not generalize to all teens because participants were 14 to 18-year-olds in Minnesota and 72% were White. They may apply to Minnesota high school students but cannot be confidently extended to adults or to teens in more diverse areas.", "F": "The results do not prove the claim. Energy drink use was negatively correlated with sleep (r = -.26), with heavy drinkers sleeping 6.1 hours versus 7.3 for non-drinkers, but because the study is correlational it cannot show that energy drinks cause less sleep; teens who sleep less may drink them to stay awake."}}, {"id": "hindsight", "title": "Hindsight Bias After an Election", "topic": "Research methods · Bias", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Hindsight bias is believing, after learning an outcome, that you would have predicted it. Researchers tested the hypothesis that learning an outcome makes people think it was more predictable."], ["Participants", "200 adults from across Canada were recruited online. Participants were 18 to 74 years old (mean age 41.6). See the table for demographics."], ["Method", "All participants read the same description of a close election between two candidates. They were randomly assigned to be told that Candidate A won, that Candidate B won, or not told the result. Hindsight bias was measured as how likely participants said the winner was to win, rated from 0% to 100%, as if they had predicted it before the election. Participants gave consent, were told the election was fictional at the end, and their responses were anonymous."], ["Results", "Participants told that a candidate won rated that candidate's chance of winning at 71% on average. Participants not told the result rated each candidate at about 50% (p < .001)."], ["Discussion", "Learning the outcome made the result seem much more predictable than it really was."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "52%"], ["Men", "48%"], ["White", "70%"], ["Asian", "17%"], ["Indigenous", "5%"], ["Other", "8%"], ["Age 18–74", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of hindsight bias.", "C": "Describe what the ratings (71% vs. about 50%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that knowing an outcome makes it seem more predictable."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["rating", "rate", "percent", "%", "likely"], ["0% to 100%", "0 to 100", "winner", "predict"]], "labels": ["Says it was a rating of how likely", "Gives a detail from this study (0–100%, how likely the winner was to win)"]}, "C": {"nums": ["71", "50"], "meaning": ["predict", "likely", "bias", "obvious"], "subject": ["told", "not told", "result", "winner"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "other countries", "internet"], "demo": ["52%", "48%", "70%", "17%", "5%", "8%", "100%", "women", "men", "white", "asian", "indigenous", "other", "age 18–74", "canada", "online", "41.6", "18", "74"]}, "F": {"data": ["71", "50"], "concept": ["predict", "likely", "bias", "obvious", "told", "not told", "result", "winner"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to be told different election results, and the researchers manipulated what result participants learned.", "B": "Hindsight bias was operationally defined as how likely participants said the winning candidate was to win, rated from 0% to 100%, as if predicting before the election.", "C": "Participants who were told a candidate won rated that candidate's chances higher (71%) than participants who were not told (about 50%), which indicates that knowing the outcome made it seem more predictable.", "D": "The researchers followed debriefing: at the end, participants were told the election was fictional.", "E": "The findings are fairly generalizable because participants were adults from 18 to 74 years old across Canada, but 70% were White and all volunteered online. They may apply to Canadian adults but cannot be confidently extended to people who do not use the internet or to other countries.", "F": "The results support the hypothesis. People told the outcome rated the winner's chances at 71% compared with about 50% for people not told (p < .001), which shows that learning the result made it seem more predictable after the fact, which is hindsight bias."}}, {"id": "framing", "title": "Wording Effects in a Health Survey", "topic": "Research methods · Framing", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that the way a question is worded changes how people answer it."], ["Participants", "300 adults at a shopping mall in Atlanta, Georgia, took part. Participants were 18 to 80 years old (mean age 43.5). See the table for demographics."], ["Method", "Participants read about a new surgery and were randomly assigned to one of two versions: \"90% of patients survive\" or \"10% of patients die.\" Support was measured as the percentage of participants who answered \"yes\" to \"Would you choose this surgery?\" The facts were the same in both versions. Participants agreed verbally, no names were collected, and they were told about the two versions afterward."], ["Results", "72% of people who read \"90% survive\" said yes. Only 44% of people who read \"10% die\" said yes (p < .001)."], ["Discussion", "Equal information framed in different words led to very different choices."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "54%"], ["Men", "46%"], ["Black", "49%"], ["White", "38%"], ["Hispanic", "8%"], ["Other", "5%"], ["Age 18–80", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of support for the surgery.", "C": "Describe what the percentages (72% vs. 44%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that question wording changes how people answer."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["percentage", "percent", "%", "yes"], ["would you choose", "choose", "surgery", "yes"]], "labels": ["Says it was the percentage who said yes", "Gives a detail from this study (yes to \"Would you choose this surgery?\")"]}, "C": {"nums": ["72", "44"], "meaning": ["choose", "chose", "support", "yes", "answer"], "subject": ["surviv", "die", "death", "wording", "framed", "version"], "kind": "groups"}, "D": {"eth": [{"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}], "notIn": ["withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "doctors", "other countries"], "demo": ["54%", "46%", "49%", "38%", "8%", "5%", "100%", "women", "men", "black", "white", "hispanic", "other", "age 18–80", "atlanta", "georgia", "mall", "43.5", "18", "80"]}, "F": {"data": ["72", "44"], "concept": ["choose", "chose", "support", "yes", "answer", "surviv", "die", "death", "wording", "framed", "version"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to read one of two wordings, and the researchers manipulated the wording.", "B": "Support for the surgery was operationally defined as the percentage of participants who answered \"yes\" to \"Would you choose this surgery?\"", "C": "The percentages indicate that many more people chose the surgery when it was described in terms of survival (72%) than in terms of death (44%), even though the facts were the same.", "D": "The researchers followed debriefing: participants were told about the two versions afterward.", "E": "The findings are fairly generalizable because participants ranged from 18 to 80 years old with a mix of backgrounds (49% Black, 38% White), but all were shoppers at one mall in Atlanta. They may apply to American adults but cannot be confidently extended to doctors or people in other countries.", "F": "The results support the hypothesis. 72% chose the surgery when told 90% survive, compared with 44% when told 10% die (p < .001); since the information was identical, this shows that the wording alone changed people's answers, a wording (framing) effect."}}, {"id": "cheating", "title": "Anonymity and Honest Answers About Cheating", "topic": "Research methods · Social desirability bias", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Social desirability bias is giving answers that make you look good. Researchers tested the hypothesis that students report more cheating when their answers are anonymous."], ["Participants", "400 students from two public high schools in Michigan took part. Students were 14 to 18 years old (mean age 16.2). See the table for demographics."], ["Method", "Students were randomly assigned to answer a survey either face to face with a teacher writing down their answers or on an anonymous paper form dropped into a sealed box. Reported cheating was measured as the percentage of students who answered \"yes\" to \"Have you cheated on a test this school year?\" Parents could opt their child out, students could skip questions, and no student was punished for any answer."], ["Results", "58% of students in the anonymous group said they had cheated, compared with 21% in the face-to-face group (p < .001)."], ["Discussion", "Students were nearly three times as likely to admit cheating when anonymous."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "51%"], ["Male", "49%"], ["White", "63%"], ["Black", "20%"], ["Hispanic", "10%"], ["Other", "7%"], ["Age 14–18", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of reported cheating.", "C": "Describe what the percentages (58% vs. 21%) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that anonymity leads to more honest answers."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["percentage", "percent", "%", "yes"], ["cheated", "cheat", "school year", "test"]], "labels": ["Says it was the percentage who said yes", "Gives a detail from this study (yes to \"Have you cheated on a test this school year?\")"]}, "C": {"nums": ["58", "21"], "meaning": ["cheat", "admit", "honest"], "subject": ["anonymous", "face to face", "face-to-face"], "kind": "groups"}, "D": {"eth": [{"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["punish", "no student"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["parent", "opt"]}], "notIn": ["confid", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "college", "private"], "demo": ["51%", "49%", "63%", "20%", "10%", "7%", "100%", "female", "male", "white", "black", "hispanic", "other", "age 14–18", "michigan", "two", "public", "16.2"]}, "F": {"data": ["58", "21"], "concept": ["cheat", "admit", "honest", "anonymous", "face to face", "face-to-face"]}}, "model": {"A": "The research method is an experiment because students were randomly assigned to answer face to face or anonymously, and the researchers manipulated how students answered.", "B": "Reported cheating was operationally defined as the percentage of students who answered \"yes\" to \"Have you cheated on a test this school year?\"", "C": "The percentages indicate that students admitted cheating far more often when anonymous (58%) than face to face (21%), suggesting many face-to-face students hid the truth.", "D": "The researchers followed protection from harm: no student was punished for any answer.", "E": "The findings may not generalize to all students because participants were 14 to 18-year-olds from two Michigan public high schools, and 63% were White. They may apply to American high school students but cannot be confidently extended to college students or private schools.", "F": "The results support the hypothesis. 58% admitted cheating anonymously compared with only 21% face to face (p < .001), which shows that when students could be identified, social desirability bias led many to give dishonest answers to look good."}}, {"id": "hassles", "title": "Daily Hassles and Mood in College Students", "topic": "Health psychology · Stressors", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Daily hassles are small everyday stressors. Researchers examined whether the number of daily hassles students experience is related to their mood."], ["Participants", "150 students at a university in Colorado took part. Participants were 18 to 24 years old (mean age 20.4). See the table for demographics."], ["Method", "For 14 days, students received a phone survey every evening. Daily hassles were measured as the number of items students checked on a list of 20 hassles (such as \"running late,\" \"phone died,\" \"argument with roommate\"). Mood was measured as their rating of their mood that day from 1 (very bad) to 10 (very good). Students were not assigned to experience hassles. They gave informed consent and their answers were stored using ID numbers."], ["Results", "The number of daily hassles was negatively correlated with mood (r = -.44, p < .001). On days with 5 or more hassles, the average mood rating was 4.8, compared with 7.6 on days with 0 or 1 hassle."], ["Discussion", "More daily hassles were linked to worse daily mood."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "64%"], ["Male", "35%"], ["Nonbinary", "1%"], ["White", "70%"], ["Hispanic", "18%"], ["Asian", "7%"], ["Other", "5%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of daily hassles.", "C": "Describe what the correlation coefficient (r = -.44) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that daily hassles are related to worse mood."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["number", "count", "how many"], ["20", "list", "checked", "hassles"]], "labels": ["Says it was a count of hassles", "Gives a detail from this study (items checked on a list of 20)"]}, "C": {"nums": [".44", "4.8", "7.6"], "meaning": ["mood", "worse", "lower"], "subject": ["hassle"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["withdraw", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "working adults", "older adults", "teens"], "demo": ["64%", "35%", "1%", "70%", "18%", "7%", "5%", "female", "male", "nonbinary", "white", "hispanic", "asian", "other", "colorado", "one university", "20.4", "18", "24"]}, "F": {"data": [".44", "4.8", "7.6"], "concept": ["mood", "worse", "lower", "hassle"]}}, "model": {"A": "The research method is a correlational study because the researchers measured daily hassles and mood without manipulating either.", "B": "Daily hassles were operationally defined as the number of items students checked each evening on a list of 20 hassles, such as \"running late\" or \"phone died.\"", "C": "The correlation of r = -.44 indicates a moderate negative relationship: on days when students had more hassles, their mood tended to be worse.", "D": "The researchers followed confidentiality: students' answers were stored using ID numbers.", "E": "The findings may not generalize to everyone because participants were 18 to 24-year-old students at one Colorado university, and 70% were White. They may apply to college students but cannot be confidently extended to working adults, teens, or older adults.", "F": "The results support the hypothesis. Hassles and mood were negatively correlated (r = -.44), and mood averaged 4.8 on days with 5 or more hassles versus 7.6 on days with 0 or 1, which shows that more daily hassles go with worse mood, though as a correlational study it cannot prove the hassles caused it."}}, {"id": "groupdep", "title": "Group vs. Individual Therapy for Depression", "topic": "Treatment · Modes of therapy", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that group therapy is as effective as individual therapy for depression."], ["Participants", "160 adults with major depressive disorder from community clinics in Ontario, Canada, took part. Participants were 20 to 65 years old (mean age 40.7). See the table for demographics."], ["Method", "Participants were randomly assigned to 12 weeks of individual CBT (one therapist, one client) or group CBT (one therapist, 8 clients). Both used the same lessons. Depression was measured with the PHQ-9 (0 to 27). Cost was measured as the clinic's total therapist cost per client. Participants gave informed consent, group members agreed to keep what others shared private, and anyone at risk of self-harm received immediate individual care."], ["Results", "PHQ-9 scores dropped by 7.8 points in the individual group and 7.2 points in the group-therapy group. The difference was not statistically significant (p = .48). Group therapy cost $420 per client, compared with $1,560 for individual therapy."], ["Discussion", "Group therapy reduced depression about as well as individual therapy at a much lower cost."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "66%"], ["Men", "34%"], ["White", "58%"], ["Asian", "19%"], ["Black", "12%"], ["Other", "11%"], ["Age 20–65", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of depression.", "C": "Describe what the p-value (p = .48) indicates about the difference between the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that group therapy is as effective as individual therapy for depression."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "phq"], ["27", "0 to 27", "questionnaire"]], "labels": ["Names the measure (score on the PHQ-9)", "Gives a detail from this study (scored 0–27)"]}, "C": {"nums": [".48"], "meaning": ["chance", "not significant", "not statistically", "no real difference", "equal", "similar", "same"], "subject": ["group", "individual"], "kind": "other"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["self-harm", "risk", "immediate"]}], "notIn": ["withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "men", "severe"], "demo": ["66%", "34%", "58%", "19%", "12%", "11%", "100%", "women", "men", "white", "asian", "black", "other", "age 20–65", "ontario", "canada", "community", "40.7"]}, "F": {"data": ["7.8", "7.2", ".48", "420", "1,560"], "concept": ["chance", "not significant", "not statistically", "no real difference", "equal", "similar", "same", "group", "individual"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to individual or group CBT, and the researchers manipulated the mode of therapy.", "B": "Depression was operationally defined as the score on the PHQ-9 questionnaire, scored 0 to 27.", "C": "A p-value of .48 indicates that the difference between the groups (7.8 vs. 7.2 points) was not statistically significant and could easily be due to chance, so both types of therapy reduced depression about equally.", "D": "The researchers followed confidentiality: group members agreed to keep what others shared private.", "E": "The findings may not generalize to everyone because participants were adults from community clinics in Ontario, and 66% were women. They may apply to Canadian adults in community care but cannot be confidently extended to teens, men, or people with severe depression.", "F": "The results support the hypothesis. Depression scores dropped 7.2 points with group therapy and 7.8 with individual therapy, a difference that was not statistically significant (p = .48), which shows the two were about equally effective, while group therapy cost far less ($420 vs. $1,560 per client)."}}, {"id": "reappraise", "title": "Rethinking Stress Before a Test", "topic": "Health psychology · Coping", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that learning to view stress as helpful (eustress) improves test performance."], ["Participants", "90 students preparing for a graduate admissions exam at a university in Massachusetts took part. Participants were 21 to 30 years old (mean age 23.8). See the table for demographics."], ["Method", "Before a practice exam, participants were randomly assigned to read a short message saying that feeling anxious can improve performance by sending more energy to the brain, or a message with general test-taking tips. Performance was measured as the score on the math section of the practice exam (scored 130 to 170). Participants gave informed consent and were debriefed afterward."], ["Results", "The stress-reappraisal group scored 157.4 on average. The tips group scored 152.9 (p = .01). The reappraisal group also scored higher on the real exam months later."], ["Discussion", "Thinking of stress as helpful improved performance under pressure."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "49%"], ["Men", "51%"], ["White", "59%"], ["Asian", "25%"], ["Hispanic", "9%"], ["Black", "7%"], ["Age 21–30", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of test performance.", "C": "Describe what the difference in mean scores indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that viewing stress as helpful improves test performance."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score"], ["math", "130", "170", "practice exam"]], "labels": ["Says it was a score", "Gives a detail from this study (math section, 130–170)"]}, "C": {"nums": ["157.4", "152.9"], "meaning": ["score", "perform", "higher", "better"], "subject": ["reappraisal", "tips", "message", "stress"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}], "notIn": ["confid", "withdraw", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "younger students", "test anxiety"], "demo": ["49%", "51%", "59%", "25%", "9%", "7%", "100%", "women", "men", "white", "asian", "hispanic", "black", "age 21–30", "massachusetts", "graduate", "23.8", "21", "30"]}, "F": {"data": ["157.4", "152.9"], "concept": ["score", "perform", "higher", "better", "reappraisal", "tips", "message", "stress"]}}, "model": {"A": "The research method is an experiment because participants were randomly assigned to read a stress-reappraisal message or general tips, and the researchers manipulated the message.", "B": "Test performance was operationally defined as the score on the math section of the practice exam, scored from 130 to 170.", "C": "The reappraisal group scored higher (157.4) than the tips group (152.9), which indicates that viewing stress as helpful improved students' math performance.", "D": "The researchers followed debriefing: participants were told the purpose of the study afterward.", "E": "The findings may not generalize to everyone because participants were 21 to 30-year-old university students preparing for a graduate exam in Massachusetts, a high-achieving group. They may apply to high-achieving young adults but cannot be confidently extended to younger students or people with test anxiety disorders.", "F": "The results support the hypothesis. The reappraisal group scored 157.4 compared with 152.9 for the tips group (p = .01), which shows that seeing stress as helpful (eustress) improved performance rather than hurting it."}}, {"id": "therapydog", "title": "Therapy Dogs and Student Stress During Exams", "topic": "Health psychology · Stress", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that spending time with a therapy dog reduces students' stress during exam week."], ["Participants", "120 undergraduates at a university in British Columbia, Canada, took part. Participants were 18 to 26 years old (mean age 20.6). See the table for demographics."], ["Method", "During exam week, students were randomly assigned to spend 20 minutes petting and talking to a trained therapy dog, to watch a slideshow of dog photos, or to wait in a quiet room. Stress was measured as the student's rating of \"How stressed do you feel right now?\" from 1 to 7, right before and right after the 20 minutes. Students with dog allergies or fear of dogs were not included, all gave consent, and handlers kept the dogs on leashes."], ["Results", "Stress ratings dropped by 2.1 points in the live dog group, 0.6 points in the photo group, and 0.4 points in the quiet room group. The live dog group's drop was significantly larger than both others (p < .001)."], ["Discussion", "Time with a real dog reduced exam stress more than photos or quiet time."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "72%"], ["Male", "27%"], ["Nonbinary", "1%"], ["White", "46%"], ["Asian", "41%"], ["Other", "13%"], ["Age 18–26", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of stress.", "C": "Describe what the drops in mean stress ratings indicate about the three groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that time with a therapy dog reduces student stress."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["rating", "rate", "scale"], ["1 to 7", "7", "how stressed", "before and after"]], "labels": ["Says it was a rating", "Gives a detail from this study (1–7, \"How stressed do you feel right now?\")"]}, "C": {"nums": ["2.1", "0.6", "0.4"], "meaning": ["stress", "drop", "reduc", "less"], "subject": ["dog", "photo", "quiet"], "kind": "groups"}, "D": {"eth": [{"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["allerg", "fear", "leash", "not included"]}, {"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}], "notIn": ["confid", "withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "men", "older adults"], "demo": ["72%", "27%", "1%", "46%", "41%", "13%", "100%", "female", "male", "nonbinary", "white", "asian", "other", "age 18–26", "british columbia", "canada", "one university", "20.6"]}, "F": {"data": ["2.1", "0.6", "0.4"], "concept": ["stress", "drop", "reduc", "less", "dog", "photo", "quiet"]}}, "model": {"A": "The research method is an experiment because students were randomly assigned to a live dog, dog photos, or a quiet room, and the researchers manipulated the activity.", "B": "Stress was operationally defined as the student's rating of \"How stressed do you feel right now?\" from 1 to 7, before and after the 20 minutes.", "C": "Stress ratings dropped the most in the live dog group (2.1 points) compared with the photo (0.6) and quiet room (0.4) groups, which indicates that interacting with a real dog reduced stress much more than the other activities.", "D": "The researchers followed protection from harm: students with dog allergies or a fear of dogs were not included, and handlers kept the dogs on leashes.", "E": "The findings may not generalize to everyone because 72% of participants were female students at one university in British Columbia. They may apply to female college students during exams but cannot be confidently extended to men, older adults, or everyday stress.", "F": "The results support the hypothesis. Stress dropped 2.1 points after time with a live dog compared with 0.6 for photos and 0.4 for a quiet room (p < .001), which shows it was interacting with a real dog, not just thinking about dogs or taking a break, that reduced stress."}}, {"id": "synesth", "title": "A Case Study of Color-Number Synesthesia", "topic": "Sensation & perception · Synesthesia", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Synesthesia is when one sense triggers another. Researchers studied one person who sees colors when she looks at numbers, to test whether her experiences are consistent and automatic."], ["Participants", "The study focused on one 29-year-old woman, called \"Participant E.M.,\" a graphic designer from Edinburgh, Scotland."], ["Method", "Over one year, researchers interviewed E.M. in depth and tested her repeatedly. Consistency was measured as the percentage of numbers 0 to 9 for which E.M. chose the same color on a 100-color chart when tested one year apart, without warning. E.M. gave informed consent, could stop testing whenever she wanted, and her identity was kept confidential. Researchers compared her with 20 non-synesthetes who were asked to invent and remember number-color pairs."], ["Results", "E.M. chose the same color for 100% of numbers after one year. The comparison group matched only 31% of their colors after just one week."], ["Discussion", "E.M.'s number-color pairs were highly consistent and automatic, supporting the idea that synesthesia is a real perceptual experience."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Participants", "1 woman"], ["Age", "29"], ["Occupation", "Graphic designer"], ["Comparison group", "20 adults"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of consistency.", "C": "Describe what E.M.'s 100% match compared with 31% for the comparison group indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that synesthesia produces consistent, automatic sensory experiences."}, "r": {"A": {"answer": "case study", "keys": ["case study"], "clues": ["one person", "one individual", "in-depth", "in depth", "single", "rare"], "trap": "experiment", "trapHint": "The researchers studied one person in depth and did not manipulate anything across groups, so it is a case study."}, "B": {"groups": [["percentage", "percent", "%"], ["same color", "chart", "one year", "0 to 9", "100-color"]], "labels": ["Says it was the percentage", "Gives a detail from this study (same color on a 100-color chart, one year apart)"]}, "C": {"nums": ["100%", "31"], "meaning": ["consistent", "same", "match", "remember"], "subject": ["e.m", "em", "comparison", "non-synesthete", "her"], "kind": "other"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}], "notIn": ["debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "rare", "one person"], "demo": ["1 woman", "29", "20 adults", "participants", "age", "occupation", "comparison group", "one", "29", "single", "edinburgh", "scotland", "graphic designer"]}, "F": {"data": ["100%", "31"], "concept": ["consistent", "same", "match", "remember", "e.m", "em", "comparison", "non-synesthete", "her"]}}, "model": {"A": "The research method is a case study because the researchers examined one person, E.M., in depth over one year.", "B": "Consistency was operationally defined as the percentage of numbers 0 to 9 for which E.M. chose the same color on a 100-color chart when tested one year apart without warning.", "C": "E.M. matched 100% of her colors after a full year while non-synesthetes matched only 31% after one week, which indicates that her number-color experiences were far more consistent than colors someone tries to memorize.", "D": "The researchers followed confidentiality: E.M.'s identity was kept confidential.", "E": "The findings cannot be confidently generalized because the study focused on only one 29-year-old woman with a rare condition. They may help explain other color-number synesthetes but cannot be extended to people with other types of synesthesia or to the general population.", "F": "The results support the hypothesis. E.M. matched 100% of number colors a year later without warning, compared with 31% after one week for people who memorized pairs, which shows her experiences were consistent and automatic rather than remembered, supporting synesthesia as a real perceptual experience."}}, {"id": "naturalobs", "title": "Aggression on the Playground: A Naturalistic Observation", "topic": "Research methods · Observation", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers wanted to describe how often children act aggressively during recess and whether it differs between free play and organized games."], ["Participants", "Researchers observed 180 children at three elementary schools in Kansas. Based on school records, children were 6 to 10 years old. See the table for school demographics."], ["Method", "Over 6 weeks, trained observers stood at the edge of the playground and did not interact with children. Aggression was measured as the number of hitting, pushing, or kicking acts per child during a 30-minute recess. Observers recorded during days with free play and days when teachers organized games. Schools gave permission, no names were recorded, and observers stopped any fight that could cause injury."], ["Results", "Children committed 1.8 aggressive acts per recess on free-play days and 0.7 acts on organized-game days. Two observers agreed on 91% of recorded acts."], ["Discussion", "Aggression was less common when recess games were organized."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Girls", "48%"], ["Boys", "52%"], ["White", "76%"], ["Hispanic", "14%"], ["Black", "7%"], ["Other", "3%"], ["Age 6–10", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of aggression.", "C": "Describe what the average aggressive acts per recess (1.8 vs. 0.7) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the claim that organized games cause children to be less aggressive at recess."}, "r": {"A": {"answer": "naturalistic observation", "keys": ["naturalistic", "observation"], "clues": ["natural", "observed", "watched", "recorded", "without interfering", "did not interact"], "trap": "experiment", "trapHint": "The researchers only watched and recorded behavior in a natural setting without changing anything, so it is a naturalistic observation, not an experiment."}, "B": {"groups": [["number", "count", "how many"], ["hit", "push", "kick", "30-minute", "recess"]], "labels": ["Says it was the number of acts", "Gives a detail from this study (hitting, pushing, or kicking during a 30-minute recess)"]}, "C": {"nums": ["1.8", "0.7"], "meaning": ["aggress", "fight", "hit", "less", "more"], "subject": ["free play", "free-play", "organized"], "kind": "groups"}, "D": {"eth": [{"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["stopped", "injur", "fight"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Institutional approval", "keys": ["institutional", "review board", "irb", "ethics board", "ethics committee", "approved", "approval"], "ev": ["board", "approved", "review", "ethics committee", "irb"]}], "notIn": ["consent", "withdraw", "debrief"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "teens", "urban"], "demo": ["48%", "52%", "76%", "14%", "7%", "3%", "100%", "girls", "boys", "white", "hispanic", "black", "other", "age 6–10", "kansas", "three", "elementary", "6", "10"]}, "F": {"data": ["1.8", "0.7", "91"], "concept": ["aggress", "fight", "hit", "less", "more", "free play", "free-play", "organized"], "stanceWant": "refute", "stanceHint": "The claim says organized games CAUSE less aggression. An observation with no manipulation can't prove cause, so say the results only partly support the claim, and why."}}, "model": {"A": "The research method is naturalistic observation because trained observers watched and recorded children's behavior on the playground without interacting with them.", "B": "Aggression was operationally defined as the number of hitting, pushing, or kicking acts per child during a 30-minute recess.", "C": "Children were more aggressive on free-play days (1.8 acts per recess) than on organized-game days (0.7 acts), which indicates that aggression happened less often when games were organized.", "D": "The researchers followed protection from harm: observers stopped any fight that could cause injury.", "E": "The findings may not generalize to all children because they came from three elementary schools in Kansas and 76% were White. They may apply to young children in similar schools but cannot be confidently extended to teens or schools in more diverse or urban areas.", "F": "The results only partly support the claim. Children averaged 1.8 aggressive acts on free-play days versus 0.7 on organized-game days, which shows a link, but because the researchers only observed and did not manipulate or randomly assign anything, it cannot prove organized games caused less aggression; other differences between those days could matter."}}, {"id": "twins", "title": "Twin Study of Anxiety", "topic": "Anxiety disorders · Genetics", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers compared identical and fraternal twins to examine how much genes are related to anxiety."], ["Participants", "1,800 adult twin pairs from the Netherlands Twin Registry took part. Twins were 18 to 70 years old (mean age 38.5). See the table for demographics."], ["Method", "Each twin completed the GAD-7 questionnaire (0 to 21) separately. The researchers calculated how strongly twins' scores were correlated within identical twin pairs (who share nearly 100% of genes) and within fraternal twin pairs (who share about 50%). No one was assigned to any condition. Twins gave written consent, data were stored with codes, and twins with very high scores were given information about mental health services."], ["Results", "Identical twins' anxiety scores were correlated at r = +.52. Fraternal twins' scores were correlated at r = +.24 (p < .001 for the difference)."], ["Discussion", "Anxiety scores were much more similar in identical twins, suggesting a genetic contribution to anxiety. Because the correlations were well below 1.0, environment also matters."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Women", "61%"], ["Men", "39%"], ["Dutch", "95%"], ["Other", "5%"], ["Identical pairs", "44%"], ["Fraternal pairs", "56%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of anxiety.", "C": "Describe what the two correlations (r = +.52 vs. r = +.24) indicate.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that genes contribute to anxiety."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["score", "gad-7", "gad7", "gad"], ["21", "0 to 21", "questionnaire", "separately"]], "labels": ["Names the measure (score on the GAD-7)", "Gives a detail from this study (scored 0–21, completed separately)"]}, "C": {"nums": [".52", ".24"], "meaning": ["similar", "gene", "anxiety", "related"], "subject": ["identical", "fraternal", "twin"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Confidentiality", "keys": ["confidential", "anonymous", "anonymity", "privacy", "private"], "ev": ["name", "id number", "code", "anonymous", "identif", "identity", "stored", "not record", "not collect", "private", "shared"]}, {"name": "Protection from harm", "keys": ["protection from harm", "protect", "harm", "safety", "safe"], "ev": ["information", "services", "high scores"]}], "notIn": ["withdraw", "debrief", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "other countries"], "demo": ["61%", "39%", "95%", "5%", "44%", "56%", "women", "men", "dutch", "other", "identical pairs", "fraternal pairs", "netherlands", "dutch", "registry", "38.5"]}, "F": {"data": [".52", ".24", ".001"], "concept": ["similar", "gene", "anxiety", "related", "identical", "fraternal", "twin"]}}, "model": {"A": "The research method is a correlational study because the researchers measured how strongly twins' anxiety scores were related without manipulating any variable.", "B": "Anxiety was operationally defined as each twin's score on the GAD-7 questionnaire, scored 0 to 21.", "C": "The correlations indicate that identical twins' anxiety scores were much more similar (r = +.52) than fraternal twins' scores (r = +.24), so sharing more genes went with more similar anxiety levels.", "D": "The researchers followed confidentiality: data were stored with codes instead of names.", "E": "The findings may not generalize to everyone because 95% of participants were Dutch adults, and 61% were women. They may apply to Dutch adults but cannot be confidently extended to children or people from other countries and cultures.", "F": "The results support the hypothesis. Identical twins, who share nearly all their genes, had more similar anxiety scores (r = +.52) than fraternal twins (r = +.24), which shows genes contribute to anxiety; however, because the identical twin correlation is far below 1.0, environment also plays a role."}}, {"id": "ashadow", "title": "Social Anxiety and Eye Contact", "topic": "Anxiety disorders · Social anxiety", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers examined whether social anxiety is related to how much eye contact people make during a conversation."], ["Participants", "96 college students at a university in Virginia took part. Participants were 18 to 23 years old (mean age 19.9). See the table for demographics."], ["Method", "Participants completed the Social Phobia Inventory (SPIN, 0 to 68). They then had a 5-minute conversation with a research assistant while wearing eye-tracking glasses. Eye contact was measured as the percentage of conversation time the participant spent looking at the assistant's eyes. Nobody was assigned to a group. Participants gave consent, could end the conversation at any time, and were debriefed afterward."], ["Results", "Social anxiety scores were negatively correlated with eye contact (r = -.47, p < .001). Students with the highest anxiety scores looked at the assistant's eyes 18% of the time, compared with 41% for students with the lowest scores."], ["Discussion", "More socially anxious students made less eye contact."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Female", "60%"], ["Male", "40%"], ["White", "64%"], ["Black", "17%"], ["Asian", "11%"], ["Hispanic", "8%"], ["Age 18–23", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of eye contact.", "C": "Describe what the correlation coefficient (r = -.47) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that people with more social anxiety make less eye contact."}, "r": {"A": {"answer": "correlational study", "keys": ["correlation"], "clues": ["relationship", "measured", "no manipulation", "not manipulat", "not assign", "did not assign", "two variables"], "trap": "experiment", "trapHint": "Nothing was manipulated and nobody was randomly assigned: the researchers only measured variables and looked at how they relate. That makes it correlational, not an experiment."}, "B": {"groups": [["percentage", "percent", "%", "time"], ["eye", "eye-track", "eye track", "5-minute", "conversation", "looking"]], "labels": ["Says it was the percentage of time", "Gives a detail from this study (looking at the assistant's eyes, measured with eye tracking)"]}, "C": {"nums": [".47", "18", "41"], "meaning": ["eye contact", "eyes", "looking", "less"], "subject": ["anxiety", "anxious"], "kind": "corr"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}, {"name": "Debriefing", "keys": ["debrief"], "ev": ["after", "purpose", "told", "explained"]}], "notIn": ["confid", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "children", "other cultures"], "demo": ["60%", "40%", "64%", "17%", "11%", "8%", "100%", "female", "male", "white", "black", "asian", "hispanic", "age 18–23", "virginia", "one university", "19.9", "18", "23"]}, "F": {"data": [".47", "18", "41"], "concept": ["eye contact", "eyes", "looking", "less", "anxiety", "anxious"]}}, "model": {"A": "The research method is a correlational study because the researchers measured social anxiety and eye contact without manipulating either variable.", "B": "Eye contact was operationally defined as the percentage of a 5-minute conversation the participant spent looking at the research assistant's eyes, measured with eye-tracking glasses.", "C": "The correlation of r = -.47 indicates a moderate negative relationship: students with higher social anxiety scores tended to spend less time looking at the assistant's eyes.", "D": "The researchers followed the right to withdraw: participants could end the conversation at any time.", "E": "The findings may not generalize to everyone because participants were 18 to 23-year-old college students at one Virginia university, and 60% were female. They may apply to young American college students but cannot be confidently extended to children or to cultures where direct eye contact is less common.", "F": "The results support the hypothesis. Social anxiety and eye contact were negatively correlated (r = -.47), with the most anxious students looking at the assistant's eyes 18% of the time versus 41% for the least anxious, which shows that more social anxiety goes with less eye contact."}}, {"id": "autismei", "title": "Early Intervention for Autism Spectrum Disorder", "topic": "Neurodevelopmental disorders · Treatment", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers tested the hypothesis that intensive early intervention improves communication in toddlers with autism spectrum disorder (ASD)."], ["Participants", "48 toddlers diagnosed with ASD from Seattle, Washington, took part. Children were 18 to 30 months old at the start (mean 23.4 months). See the table for demographics."], ["Method", "Toddlers were randomly assigned to 2 years of an intensive play-based therapy program (20 hours a week with trained therapists and parents) or to the usual community services. Communication was measured as each child's score on a standardized language test (average for children = 100). Parents gave written consent, could leave the study at any time, and the community group received regular referrals to local services."], ["Results", "After 2 years, the intensive-therapy group's language scores rose by 18.9 points on average. The community group's scores rose by 4.6 points (p = .002)."], ["Discussion", "Intensive early intervention produced large gains in communication."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Boys", "79%"], ["Girls", "21%"], ["White", "71%"], ["Asian", "13%"], ["Hispanic", "9%"], ["Black", "7%"], ["Age 18–30 months", "100%"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of communication.", "C": "Describe what the increases in mean language scores indicate about the two groups.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Explain the extent to which the research findings can be generalized, using specific evidence from the participants.", "F": "Explain how the results support or refute the hypothesis that intensive early intervention improves communication in toddlers with ASD."}, "r": {"A": {"answer": "experiment", "keys": ["experiment"], "clues": ["random", "assign", "manipulat", "independent variable", "control", "groups"]}, "B": {"groups": [["score", "test"], ["language", "standardized", "100"]], "labels": ["Says it was a test score", "Gives a detail from this study (standardized language test, average = 100)"]}, "C": {"nums": ["18.9", "4.6"], "meaning": ["language", "communicat", "improv", "rose"], "subject": ["intensive", "community", "therapy"], "kind": "groups"}, "D": {"eth": [{"name": "Informed consent", "keys": ["informed consent", "consent form", "consented", "gave consent", "give consent", "signed consent", "assent"], "ev": ["signed", "consent form", "agreed", "told", "permission", "explained", "written", "gave"]}, {"name": "Right to withdraw", "keys": ["withdraw", "leave at any time", "stop at any time", "quit", "drop out", "leave the study"], "ev": ["any time", "anytime", "stop", "leave", "penalty", "without"]}], "notIn": ["confid", "debrief", "harm", "approval"]}, "E": {"pop": ["adults", "older", "children", "teen", "college", "students", "women", "men", "general", "other countries", "other cultures", "people who", "population", "girls", "older children"], "demo": ["79%", "21%", "71%", "13%", "9%", "7%", "100%", "boys", "girls", "white", "asian", "hispanic", "black", "age 18–30 months", "seattle", "washington", "23.4", "79%", "71%"]}, "F": {"data": ["18.9", "4.6"], "concept": ["language", "communicat", "improv", "rose", "intensive", "community", "therapy"]}}, "model": {"A": "The research method is an experiment because toddlers were randomly assigned to intensive therapy or usual community services, and the researchers manipulated the type of intervention.", "B": "Communication was operationally defined as each child's score on a standardized language test, where the average for children is 100.", "C": "The intensive-therapy group's scores rose by 18.9 points while the community group's rose by only 4.6, which indicates that the intensive program improved children's communication much more.", "D": "The researchers followed informed consent: parents gave written consent before their child took part.", "E": "The findings may not generalize to all children with ASD because participants were toddlers from Seattle, 79% were boys, and 71% were White. They may apply to young boys with ASD but cannot be confidently extended to girls, older children, or families in other areas.", "F": "The results support the hypothesis. Language scores rose 18.9 points with intensive therapy compared with 4.6 with community services (p = .002), which shows that intensive early intervention, not just growing older, improved communication."}}, {"id": "pdscreen", "title": "Shyness or Avoidant Personality? A Case Study", "topic": "Personality disorders", "source": "Adapted summary of a peer-reviewed study (practice article written for this kit).", "sections": [["Introduction", "Researchers studied one woman to describe how avoidant personality disorder affects daily life and how it responds to treatment."], ["Participants", "The study focused on one 31-year-old woman, called \"Ms. L.,\" an accountant from Dublin, Ireland, diagnosed with avoidant personality disorder."], ["Method", "Over 18 months, researchers conducted in-depth interviews with Ms. L. and her sister, reviewed her journals, and tracked her progress in 40 weekly therapy sessions using CBT. Social avoidance was measured as the number of social invitations she accepted each month. Ms. L. gave written consent, all identifying details were changed, and she could stop the study at any time."], ["Results", "Before treatment, Ms. L. accepted 0 of an average 6 invitations per month. After 18 months, she accepted 4 of an average 7 invitations per month. She reported that fear of rejection, not lack of interest, had kept her from socializing."], ["Discussion", "Ms. L.'s avoidance was driven by fear of criticism and rejection and improved with long-term CBT."]], "table": {"head": ["Characteristic", "Percent"], "rows": [["Participants", "1 woman"], ["Age", "31"], ["Occupation", "Accountant"], ["Location", "Dublin, Ireland"]]}, "q": {"A": "Identify the research method used in the study.", "B": "State the operational definition of social avoidance.", "C": "Describe what the change in accepted invitations (0 of 6 before vs. 4 of 7 after) indicates.", "D": "Identify one ethical guideline the researchers followed and describe how they applied it.", "E": "Exp const AAQ_RUBRIC=`AP Psychology Article Analysis Question (AAQ) rubric. Parts A-E are worth 1 point each; Part F is worth 2 points.
A (Research method, task verb IDENTIFY): earn the point for naming the correct research method (experiment, correlational study, case study, naturalistic observation, meta-analysis, etc.). Random assignment + a manipulated variable = experiment. No explanation is required.
B (Research variable, STATE): earn the point for the operational definition used IN THIS STUDY: how the researchers actually measured or manipulated the variable, with measurable specifics from the Method. A general textbook definition earns 0.
C (Statistic interpretation, DESCRIBE): earn the point for saying what the statistic means for the study (which group did better / direction and meaning of the relationship) and connecting it to what was investigated. Only restating the numbers earns 0.
D (Ethical guidelines, IDENTIFY + DESCRIBE): earn the point only if the student names a specific ethical guideline that the article actually describes AND describes how the researchers applied it, with evidence from the article. A guideline not described in the article earns 0.
E (Generalizability, EXPLAIN): earn the point for a claim about whether the findings generalize, naming a specific population, AND citing specific participant demographics from the study (percentages, ages, location, etc.). No specific demographics = 0.
F (Argumentation, EXPLAIN): point 1 for citing a specific result (data) from the study; point 2 for an accurate explanation of how that result supports or refutes the hypothesis/claim. Claiming a correlational or observational study proves causation is NOT accurate.
Be fair like a real AP reader: accept any correct wording, do not require the model answer's exact words, ignore spelling, and do not award points for vague or incorrect answers.`;

${'ABCDEF'.split('').map(k=>k+'. '+art.model[k]).join('\n')}

STUDENT ANSWERS:
${'ABCDEF'.split('').map(k=>k+'. '+((answers[k]||'').trim()||'(blank)')).join('\n')}

Grade each part for a high school student. Respond with JSON only, exactly in this shape:
{"parts":{"A":{"points":0,"earned":["what they did right"],"missing":["what is missing or wrong, specific to their answer"],"tip":"one concrete tip to fix or remember this"}, "B":{...}, "C":{...}, "D":{...}, "E":{...}, "F":{"points":0,...}}, "overall":"2-3 sentences: biggest strengths and what to practice next"}
points must be 0 or 1 for A-E and 0, 1, or 2 for F. Keep each list item under 25 words and speak directly to the student ("you").`;
  const res=await gemini(prompt), parts={}; let total=0;
  AAQ_PARTS.forEach(p=>{const g=(res.parts||{})[p.k]||{}, max=p.k==='F'?2:1, pts=Math.max(0,Math.min(max,Math.round(+g.points||0)));

    ck(!!num,'Uses the statistic from the article.','Doesn\'t mention the actual numbers from the Results.');
    const corr=R.needPositive||R.kind==='corr';
    const dir=R.kind==='other'?true:corr?ck(!!aaqHas(t,['positive','negative','more','higher','increase','go up','goes up','tend','fewer','less','lower']),'Says the direction of the relationship (positive or negative).','Doesn\'t say the direction. A + sign means positive (both go up together); a − sign means negative (one goes up as the other goes down).'):ck(!!cmp&&!!subj,'Compares the groups (which one did better).','Doesn\'t clearly say which group scored higher or lower.');
    const meaning=ck(!!mean,'Connects the number to what was being studied.','Doesn\'t say what the number MEANS for the research question. Restating numbers alone earns 0.');
    if(dir&&meaning) pts=1;
    if(num&&!meaning) tips.push('You have the numbers. Now add "which indicates that…" and say what it means.');
    if(R.speedHint&&!aaqHas(t,['faster','quicker','less time','shorter','lower'])) tips.push('Careful: here a LOWER time is BETTER (faster). Say which group was faster.');
    if(corr&&aaqHas(t,['cause','causes','led to','makes'])) tips.push('Don\'t say one variable "causes" the other in Part C. A correlation only shows a relationship.');
  }
  if(k==='D'){
    const hit=R.eth.find(g=>aaqHas(t,g.keys.map(x=>x.toLowerCase())));
    const other=R.notIn.map(x=>({consent:'Informed consent',confid:'Confidentiality',withdraw:'Right to withdraw',debrief:'Debriefing',harm:'Protection from harm',approval:'Institutional approval'}[x])).filter(Boolean);
    const otherHit=R.notIn.find(x=>aaqHas(t,({consent:['informed consent','consent'],confid:['confidential','anonym'],withdraw:['withdraw'],debrief:['debrief'],harm:['protection from harm'],approval:['institutional','review board','irb','ethics board']})[x]||[]));
    const named=ck(!!hit,`Identifies a guideline this study followed: ${hit?hit.name:''}.`,otherHit?'The guideline you named isn\'t described in this article. Stick to what the text shows.':'Doesn\'t name a specific ethical guideline (informed consent, confidentiality, debriefing, right to withdraw, protection from harm…).');
    const desc=ck(!!(hit&&aaqHas(t,hit.ev)),'Describes how the researchers applied it, with evidence from the article.',hit?`Name is there, but describe HOW they did it in this study (find the sentence in the Method that shows ${hit.name.toLowerCase()}).`:'Doesn\'t describe how the researchers applied a guideline.');
    if(named&&desc) pts=1;
    tips.push('Guidelines this article actually describes: '+R.eth.map(g=>g.name).join(', ')+'.');
  }
  if(k==='E'){
    const claim=ck(!!aaqHas(t,AAQ_WORDS.claim),'Makes a claim about whether the findings generalize.','Doesn\'t make a clear claim ("The findings can / cannot be generalized to…").');
    const demo=ck(!!aaqHas(t,R.demo),'Cites specific participant demographics from the study.','Doesn\'t cite specific demographics (percentages, ages, location). This is the #1 way students lose this point.');
    const pop=ck(!!aaqHas(t,R.pop),'Names a population the results may or may not apply to.','Doesn\'t name a specific population (e.g., "older adults," "teens in other states").');
    if(claim&&demo&&pop) pts=1;
    if(!/\d/.test(raw)) tips.push('Put a number in: quote a percentage or age range straight from the demographic table.');
    if(n<20) tips.push('"Explain" needs reasoning. One short sentence usually isn\'t enough here.');
  }
  if(k==='F'){
    const data=ck(!!aaqHas(t,R.data),'Point 1: Uses a specific result (numbers) from the study.','Point 1 missing: quote specific numbers from the Results section.');
    const stance=aaqHas(t,AAQ_WORDS.support), link=aaqHas(t,AAQ_WORDS.link), concept=aaqHas(t,R.concept);
    const accurate=R.stanceWant!=='refute'||!!aaqHas(t,['not support','doesn\'t support','does not support','refute','cannot','can\'t','partially','not prove','doesn\'t prove','does not prove','not show caus','correlational']);
    if(stance&&link&&concept&&!accurate){ck(false,'','Point 2 missing: the explanation isn\'t accurate. '+R.stanceHint); pts=data?1:0; return {pts,max:2,checks,tips};}
    const expl=ck(!!(stance&&link&&concept),'Point 2: Says support/refute and explains how the result connects to the hypothesis.',!stance?'Point 2 missing: say clearly whether the results SUPPORT or REFUTE the hypothesis.':!link?'Point 2 missing: explain HOW the data connects ("…which shows that…", "because…").':'Point 2 missing: connect it back to the specific concept in the hypothesis.');
    pts=(data?1:0)+(expl?1:0);
    if(R.stanceWant==='refute'&&stance&&!aaqHas(t,['not support','doesn\'t support','does not support','refute','cannot','can\'t','partially','correlation does not','correlational'])) tips.push(R.stanceHint);
    if(n<25) tips.push('Part F is worth 2 points. Plan on 2–3 sentences: claim, data, and how the data proves the claim.');
  }
  return {pts,max:k==='F'?2:1,checks,tips};
}

function aaqTick(){

    if(S.tab!=='aaq'||!S.aaq||S.aaq!==A){clearInterval(aaqTimer);aaqTimer=null;return}
    let s=Math.max(0,Math.ceil((A.end-Date.now())/1000));
    if(s<=0&&A.phase==='read'){A.phase='write';A.end=Date.now()+15*60000;renderAAQ();return}
    const el=$('#aaqtime'); if(el){el.textContent=(A.phase==='read'?'Reading ':'Writing ')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');el.classList.toggle('low',A.phase==='write'&&s<=120)}
    if(s<=0&&A.phase==='write'){clearInterval(aaqTimer);aaqTimer=null;A.mode='free';aaqCheck()}
  }; tick(); if(!aaqTimer) aaqTimer=setInterval(tick,500);
}
function aaqSave(){const D=AAQS.get(), id=S.aaq.id; D.drafts[id]=D.drafts[id]||{}; document.querySelectorAll('[data-aaq-part]').forEach(t=>D.drafts[id][t.dataset.aaqPart]=t.value); AAQS.set(D); return D}
async function aaqCheck(){

  if(GEM.get().key){ A.loading=true; renderAAQ();

    A.loading=false; if(S.aaq!==A) return; }
  if(!G&&art.r){ const parts={}; let total=0; AAQ_PARTS.forEach(p=>{const g=gradeAAQ(art,p.k,ans[p.k]);parts[p.k]=g;total+=g.pts}); G={parts,total}; }
  if(!G&&!GEM.get().key) A.err='No Gemini key saved.';
  A.graded=G; if(G){const D2=AAQS.get(); D2.best[art.id]=Math.max(D2.best[art.id]??0,G.total); AAQS.set(D2)} renderAAQ();

document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.aaqPart&&S.aaq){clearTimeout(aaqSave.t);aaqSave.t=setTimeout(aaqSave,400)}});
function aaqClick(t){
  if(t.dataset.aaqStart){S.aaq={id:t.dataset.aaqStart,mode:t.dataset.mode,phase:'read',end:Date.now()+10*60000};if(t.dataset.mode==='timed'){const D=AAQS.get();D.drafts[S.aaq.id]={};AAQS.set(D)}renderAAQ();window.scrollTo({top:0});return true}
  if(t.dataset.aaqHl!==undefined){const D=AAQS.get(),id=S.aaq.id,i=+t.dataset.aaqHl,s=new Set(D.hl[id]||[]);s.has(i)?s.delete(i):s.add(i);D.hl[id]=[...s];AAQS.set(D);t.classList.toggle('hl');return true}
  const a=t.dataset.act; if(!a||!a.startsWith('aaq-')) return false;
  if(a==='aaq-back'){if(S.aaq)aaqSave();S.aaq=null;renderAAQ()}
  else if(a==='aaq-savekey'){const k=$('#gemkey').value.trim(), m=$('#gemmodel').value.trim()||'gemini-2.5-flash', G=GEM.get(); GEM.set({key:k||G.key,model:m}); render(); $('#gemnote').textContent=k||G.key?'Saved. Tap Test to check it works.':'Paste a key first.'}
  else if(a==='aaq-delkey'){GEM.set({key:'',model:GEM.get().model});render()}
  else if(a==='aaq-testkey'){const n=$('#gemnote');n.textContent='Testing…';gemini('Respond with JSON only: {"ok":true}').then(()=>{n.textContent='✓ Your key works.'}).catch(e=>{n.textContent='✗ '+e.message})}
  else if(a==='aaq-random'){const D=AAQS.get(),todo=aaqAll().filter(x=>D.best[x.id]===undefined),pool=todo.length?todo:aaqAll(),x=pool[Math.floor(Math.random()*pool.length)];S.aaq={id:x.id,mode:'free',phase:'write'};renderAAQ();window.scrollTo({top:0})}
  else if(a==='aaq-gen'){const n=$('#gemnote'),b=t;b.disabled=true;b.textContent='Writing an article… (up to 30s)';aaqGenerate($('#gentopic').value,$('#genmethod').value).then(x=>{S.aaq={id:x.id,mode:'free',phase:'write'};renderAAQ();window.scrollTo({top:0})}).catch(e=>{b.disabled=false;b.textContent='Generate';n.textContent='✗ '+e.message})}
  else if(a==='aaq-check')aaqCheck();
  else if(a==='aaq-skipread'){S.aaq.phase='write';S.aaq.end=Date.now()+15*60000;renderAAQ()}
  else if(a==='aaq-clear'){if(confirm('Clear all your answers for this article?')){const D=AAQS.get();D.drafts[S.aaq.id]={};AAQS.set(D);S.aaq.graded=null;renderAAQ()}}
  return true;
}
