− 75 = 10.","why":["","","",""]},{"id":"q3-23","type":"mcq","topic":"Statistics & Data","stem":"Ty is in the 70th percentile on a psychology test. This means:","options":["He got 70% of the questions right.","He scored higher than 70% of his peers.","He scored 70 points.","70% of students scored higher than him."],"ans":1,"exp":"Percentile rank = the percentage of scores below yours.","why":["","","",""]}]},{"name":"Mock exam","mode":"exam","exam":"Mock exam","examTips":["Turn the Timer on and answer every question without looking anything up.","Aim for about one minute per question. Flag hard ones and come back."],"tips":["A mix of exam-style questions from every deck in this unit."],"questions":[{"id":"qM1","type":"mcq","topic":"Perspectives in Psychology","stem":"Antonio is feeling much healthier now that he is focusing on his positive traits and having good relationships. Which perspective fits best?","options":["Biological","Psychodynamic","Humanistic","Behavioral"],"ans":2,"exp":"Positivity, relationships, and well-being are humanistic.","why":["","","",""]},{"id":"qM2","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective is based heavily on the ideas of Freud?","options":["Humanistic","Cognitive","Sociocultural","Psychodynamic"],"ans":3,"exp":"Psychodynamic: the unconscious mind and childhood experiences.","why":["","","",""]},{"id":"qM3","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective focuses on genetics, brain chemistry, hormones, and neurotransmitters?","options":["Evolutionary","Biological","Cognitive","Behavioral"],"ans":1,"exp":"That's the biological perspective. Evolutionary is about survival and reproduction.","why":["","","",""]},{"id":"qM4","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective emphasizes memory, problem solving, intelligence, and perception?","options":["Behavioral","Humanistic","Psychodynamic","Cognitive"],"ans":3,"exp":"Cognitive = internal thought processes.","why":["","","",""]},{"id":"qM5","type":"mcq","topic":"Perspectives in Psychology","stem":"Which of the following best describes the behavioral perspective?","options":["Behavior comes from the unconscious mind.","Behavior is mostly determined by genes.","Behavior is shaped by learned experiences, and rewarded behaviors tend to be repeated.","Behavior depends on a person's culture."],"ans":2,"exp":"Behavioral = learning and rewards.","why":["","","",""]},{"id":"qM6","type":"mcq","topic":"Perspectives in Psychology","stem":"Which of the following best describes the evolutionary perspective?","options":["Behavior is shaped by childhood memories.","Behaviors exist because they helped our ancestors survive and reproduce.","Behavior is shaped by social norms.","Behavior depends on how we think about situations."],"ans":1,"exp":"Evolutionary = protection, adaptive behavior, and reproduction.","why":["","","",""]},{"id":"qM7","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the evolutionary perspective?","options":["Fearing spiders helped his ancestors avoid dangerous bites and survive.","A frightening spider experience from early childhood is affecting him unconsciously.","His thoughts about spiders are exaggerated and unrealistic.","In his culture, spiders are treated as scary and disgusting."],"ans":0,"exp":"Survival advantage for ancestors = evolutionary. The others are psychodynamic, cognitive, and sociocultural.","why":["","","",""]},{"id":"qM8","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the psychodynamic perspective?","options":["A frightening spider experience from early childhood is affecting him unconsciously.","Fearing spiders helped his ancestors survive.","His brain chemistry makes him more anxious.","People around him taught him spiders are gross."],"ans":0,"exp":"Unconscious mind + childhood = psychodynamic.","why":["","","",""]},{"id":"qM9","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the cognitive perspective?","options":["He believes every spider he sees could kill him, and those thoughts drive his fear.","He inherited a gene linked to anxiety.","In his culture, spiders are seen as dangerous.","He has an unconscious memory of being bitten."],"ans":0,"exp":"Cognitive = how thought processes shape behavior.","why":["","","",""]},{"id":"qM10","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the sociocultural perspective?","options":["Fearing spiders helped his ancestors survive.","In his culture, spiders are commonly treated as scary and disgusting.","His neurotransmitter levels are unusual.","He focuses on his potential to overcome fear."],"ans":1,"exp":"Culture or way of life = sociocultural.","why":["","","",""]},{"id":"qM11","type":"mcq","topic":"Research Methods","stem":"Which of the following best explains why psychologists rely on research instead of intuition?","options":["Intuition is distorted by hindsight bias, overconfidence, and misunderstanding of probability.","Intuition is always wrong.","Research never contains errors.","Intuition only works for experts."],"ans":0,"exp":"Your slides: psychology exists because intuition is unreliable, due to hindsight bias, misunderstanding of probability, and overconfidence.","why":["","","",""]},{"id":"qM12","type":"mcq","topic":"Research Methods","stem":"Which of the following is the correct order of the first four steps of the scientific method?","options":["Make a hypothesis → observe → replicate → develop a theory","Observe → develop a theory → make a hypothesis → test it","Test → observe → develop a theory → evaluate","Develop a theory → replicate → observe → make a hypothesis"],"ans":1,"exp":"Observe, theory, hypothesis, test, evaluate, modify, replicate.","why":["","","",""]},{"id":"qM13","type":"mcq","topic":"Research Methods","stem":"A researcher decides that \"smiling\" means at least four teeth showing and \"friendly\" means the photographer tells at least two jokes. These are:","options":["Hypotheses","Confounding variables","Theories","Operational definitions"],"ans":3,"exp":"Operational definitions state exactly how each variable will be measured.","why":["","","",""]},{"id":"qM14","type":"mcq","topic":"Research Methods","stem":"Which of the following best explains why operational definitions are important?","options":["They guarantee the hypothesis will be supported.","Without them, other researchers can't replicate the study.","They replace the need for a control group.","They make the sample representative."],"ans":1,"exp":"Your slides: research cannot be replicated without operational definitions.","why":["","","",""]},{"id":"qM15","type":"mcq","topic":"Research Methods","stem":"A researcher repeats another scientist's study with new participants to see whether the results hold up. This is:","options":["Replication","Debriefing","Sampling bias","Naturalistic observation"],"ans":0,"exp":"Replicating means doing the research a second time to check that the results are reliable.","why":["","","",""]},{"id":"qM16","type":"mcq","topic":"Research Methods","stem":"Which research method is the only one that can establish cause and effect?","options":["Correlational study","Case study","Survey","Experiment"],"ans":3,"exp":"Experiments manipulate variables to establish cause and effect.","why":["","","",""]},{"id":"qM17","type":"mcq","topic":"Research Methods","stem":"A psychologist spends two years studying one patient with a rare memory disorder in great detail. Which of the following is the biggest weakness of this method?","options":["It gives too little in-depth information.","It cannot describe behavior.","It always involves deception.","The findings may not apply to others, because the patient may be atypical."],"ans":3,"exp":"Case studies can be misleading if the person is atypical, and can lead to overgeneralizing.","why":["","","",""]},{"id":"qM18","type":"mcq","topic":"Research Methods","stem":"A researcher wants to know how 2,000 teens feel about social media and needs results quickly. Which method fits best?","options":["Case study","Survey","Naturalistic observation","Experiment"],"ans":1,"exp":"Surveys collect a lot of self-reported data in a short time.","why":["","","",""]},{"id":"qM19","type":"mcq","topic":"Research Methods","stem":"Which of the following is a disadvantage of naturalistic observation?","options":["Subjects may notice the observer and act differently.","Subjects behave less honestly than in a lab.","It requires manipulating variables.","It only studies one person."],"ans":0,"exp":"It's non-invasive, but subjects may become aware of the observer, and it can be time consuming.","why":["","","",""]},{"id":"qM20","type":"mcq","topic":"Research Methods","stem":"As hours of sleep decrease, levels of stress increase. Which type of correlation is this?","options":["Positive","Negative","Zero","Perfect positive"],"ans":1,"exp":"One goes down while the other goes up: negative.","why":["","","",""]},{"id":"qM21","type":"mcq","topic":"Statistics & Data","stem":"Which of the following best describes the purpose of descriptive statistics?","options":["To decide whether results apply to a whole population","To manipulate variables","To organize and summarize data meaningfully","To prove cause and effect"],"ans":2,"exp":"Descriptive statistics organize data. Deciding whether results generalize is inferential statistics.","why":["","","",""]},{"id":"qM22","type":"mcq","topic":"Statistics & Data","stem":"Which type of graph is a bar graph that shows a frequency distribution?","options":["Scatterplot","Pie chart","Histogram","Line graph"],"ans":2,"exp":"Histograms show frequency distributions and make patterns quick to spot.","why":["","","",""]},{"id":"qM23","type":"mcq","topic":"Statistics & Data","stem":"What is the mean of 3, 5, 7, 9, 11, 13?","options":["7","9","6","8"],"ans":3,"exp":"3 + 5 + 7 + 9 + 11 + 13 = 48, and 48 ÷ 6 = 8.","why":["","","",""]},{"id":"qM24","type":"mcq","topic":"Statistics & Data","stem":"What is the median of 4, 10, 6, 2, 8, 12?","options":["6","8","10","7"],"ans":3,"exp":"In order: 2, 4, 6, 8, 10, 12. The two middle numbers are 6 and 8, so the median is (6 + 8) ÷ 2 = 7.","why":["","","",""]},{"id":"qM25","type":"mcq","topic":"Statistics & Data","stem":"For the data 2, 3, 3, 5, 9, 9, 9, 12, which statement is correct?","options":["Mode = 9, median = 7, mean = 6.5","Mode = 3, median = 5, mean = 6.5","Mode = 9, median = 5, mean = 7","Mode = 9, median = 7, mean = 7"],"ans":0,"exp":"9 appears most (mode). Middle two are 5 and 9, so the median is 7. Sum is 52, and 52 ÷ 8 = 6.5.","why":["","","",""]},{"id":"qM26","type":"mcq","topic":"Statistics & Data","stem":"Scores: 55, 70, 70, 85, 100. What is the range?","options":["70","45","76","100"],"ans":1,"exp":"100 − 55 = 45. (70 is the mode and median; 76 is the mean.)","why":["","","",""]},{"id":"qM27","type":"mcq","topic":"Statistics & Data","stem":"Which of the following best explains why standard deviation is a more useful measure of variation than the range?","options":["It is easier to calculate.","It shows the most common score.","It shows how much all the scores vary around the mean, not just the gap between the two extremes.","It is always smaller than the mean."],"ans":2,"exp":"The range only uses the highest and lowest scores, so it's just a rough estimate.","why":["","","",""]},{"id":"qM28","type":"mcq","topic":"Statistics & Data","stem":"Class A and Class B both averaged 80 on a test. Class A's standard deviation is 3; Class B's is 15. Which statement is true?","options":["Class A's scores are more spread out.","Class B scored higher on average.","Class B's scores are more spread out.","Both classes have the same spread."],"ans":2,"exp":"A bigger standard deviation means scores are more dispersed around the mean.","why":["","","",""]},{"id":"qM29","type":"mcq","topic":"Statistics & Data","stem":"IQ scores have a mean of 100 and a standard deviation of 15. About what percent of people score between 85 and 115?","options":["95%","50%","68%","99%"],"ans":2,"exp":"85–115 is within 1 standard deviation of the mean: about 68%.","why":["","","",""]},{"id":"qM30","type":"mcq","topic":"Statistics & Data","stem":"On the same IQ scale, about 95% of people score between:","options":["70 and 130","85 and 115","55 and 145","100 and 130"],"ans":0,"exp":"Within 2 standard deviations (2 × 15 = 30 points) of 100.","why":["","","",""]}]}]}},"u1":{"images":{},"decks":[{"id":1,"name":"The Neuron","optional":false,"sections":[{"name":"Parts of a neuron","cards":[{"term":"Neuron","def":"A nerve cell; the basic building block of the brain and nervous system. Hundreds of billions form networks throughout the body.","hook":"","asks":[{"q":"A scientist looks at a single cell that sends signals through the nervous system. What is she looking at?","right":"A neuron","wrong":[["A glial cell that only supports other cells","Glia support and protect neurons; they aren't the signaling cell."],["A hormone in the bloodstream","A hormone is a chemical, not a cell."],["A neurotransmitter","That is the chemical messenger a neuron releases."]],"exp":"Neurons are the basic building blocks of the nervous system."},{"q":"About how many neurons form networks throughout the body, according to your card?","right":"Hundreds of billions","wrong":[["A few thousand, mostly located in the spinal cord","Far too few."],["Exactly one million","Not on your card."],["About 50","Far too few."]],"exp":"Hundreds of billions of neurons form networks."}]},{"term":"Glial cells (glia)","def":"Support cells in the brain that nourish and protect neurons. Your slides say there are about 50x more of them than neurons.","hook":"\"Glia\" = glue: they hold the system together.","asks":[{"q":"Which cells outnumber neurons and spend their time nourishing and protecting them?","right":"Glial cells","wrong":[["Sensory neurons from the skin","Those carry messages; they don't mainly support other cells."],["Motor neurons","Those carry signals to muscles."],["Vesicles","Vesicles are sacs inside neurons, not cells."]],"exp":"Glia = glue: they support the system."},{"q":"Your slides compare glial cells to neurons in number. Which is true?","right":"Glia outnumber neurons about 50 to 1","wrong":[["Neurons outnumber glia by about fifty to one in the brain","It's the other way around."],["They are equal in number","Not on your slides."],["Glia exist only in the spinal cord","They're in the brain."]],"exp":"About 50x more glia than neurons."}]},{"term":"Dendrites","def":"Branch-like structures extending from the cell body. Their receptors receive chemical signals from other neurons.","hook":"Dendrites = Detect.","asks":[{"q":"A neuron receives a chemical message from the neuron next to it. Which part detects the message first?","right":"The dendrites","wrong":[["The axon","The axon carries the impulse away from the cell body."],["The terminal buttons at the very end of the axon","Those send signals on, not receive them."],["The myelin sheath","Myelin coats and speeds up the axon."]],"exp":"Dendrites = detect."},{"q":"A drug blocks the receptors on a neuron's branch-like receiving parts. Which part is affected?","right":"The dendrites","wrong":[["The axon, which carries signals away from the cell body","The axon sends, not receives."],["The myelin sheath","Myelin has no receptors for messages."],["The vesicles","Those store neurotransmitters."]],"exp":"Dendrite receptors receive chemical signals."}]},{"term":"Soma","def":"The cell body. Holds the nucleus, keeps the cell alive, and decides when the neuron will fire.","hook":"","asks":[{"q":"Which part of the neuron holds the nucleus and decides whether the neuron will fire?","right":"The soma","wrong":[["The dendrites that receive chemical messages","Dendrites receive signals; the soma decides."],["The synapse","That is the gap between neurons."],["The vesicles","Those store neurotransmitters."]],"exp":"The soma is the cell body."},{"q":"Which part of a neuron keeps the cell alive?","right":"The soma","wrong":[["The terminal buttons at the very ends of the axon branches","Those hold vesicles."],["The synapse","That is a gap."],["The myelin sheath","That coats the axon."]],"exp":"The soma holds the nucleus and keeps the cell alive."}]},{"term":"Axon","def":"The long pathway an electrical impulse travels down when the neuron fires.","hook":"Axon = Away from the cell body.","asks":[{"q":"Once a neuron fires, which part does the electrical impulse travel down?","right":"The axon","wrong":[["The dendrites, which receive messages","Dendrites receive; the impulse travels down the axon."],["The synapse","The synapse is a gap, not a pathway inside the neuron."],["The soma","The soma starts the signal; it travels down the axon."]],"exp":"Axon = away from the cell body."},{"q":"Myelin coats which part of a neuron?","right":"The axon","wrong":[["The dendrites, which receive incoming chemical messages","Myelin coats the axon."],["The soma","Myelin coats the axon."],["The synapse","The synapse is a gap."]],"exp":"Myelin protects the axon and speeds the signal."}]},{"term":"Myelin sheath","def":"Fatty coating that protects the axon and speeds up the electrical signal.","hook":"Like insulation on a wire.","asks":[{"q":"Two neurons are identical except that one has a fatty coating on its axon. What will be different?","right":"Its signals travel faster","wrong":[["It will release fewer neurotransmitters into the synapse","Myelin affects speed, not how much is released."],["It will never reach threshold","Myelin doesn't change threshold."],["It will have more dendrites","Myelin coats the axon only."]],"exp":"Myelin protects the axon and speeds the signal, like insulation on a wire."},{"q":"Two runners touch a hot stove at the same moment. One has thick myelin on the neurons involved; the other's myelin is thin. Whose brain gets the pain signal first?","right":"The runner with thick myelin","wrong":[["The runner with thin myelin, since thinner coating lets more signal through","Myelin speeds the signal up."],["Both at exactly the same time","Myelin changes the speed."],["Neither; myelin blocks pain","Myelin doesn't block signals."]],"exp":"Myelin speeds up the electrical signal, like insulation on a wire."}]},{"term":"Terminal branches","def":"The frayed ends of the axon. Each one ends in a terminal button.","hook":"","asks":[{"q":"After traveling down the axon, the signal spreads into the frayed ends of the axon. What are these ends called?","right":"Terminal branches","wrong":[["Dendrites, which receive signals","Dendrites are at the receiving end, not the end of the axon."],["Myelin","Myelin coats the axon."],["The soma","The soma is the cell body."]],"exp":"Terminal branches are the axon's frayed ends, each ending in a terminal button."},{"q":"In the path of a signal, what comes right after the axon?","right":"The terminal branches","wrong":[["The dendrites of the very same neuron that sent the signal","Those are at the start."],["The soma","That comes before the axon."],["The cell nucleus","That is in the soma."]],"exp":"Axon → terminal branches → terminal buttons."}]},{"term":"Terminal buttons","def":"Knobs at the ends of the terminal branches that hold the vesicles.","hook":"","asks":[{"q":"Where are the vesicles of neurotransmitters held, at the tip of each terminal branch?","right":"In the terminal buttons","wrong":[["In the myelin sheath along the length of the axon","Myelin is a fatty coating, not storage."],["In the dendrites","Dendrites receive signals."],["In the synapse","The synapse is the gap they are released into."]],"exp":"Terminal buttons are knobs that hold the vesicles."},{"q":"Which structure sits at the very end of each terminal branch?","right":"A terminal button","wrong":[["A dendrite that waits to receive a signal from another cell","Dendrites are on the receiving neuron."],["A glial cell","Glia are support cells."],["A synapse","The synapse is the gap beyond it."]],"exp":"Each terminal branch ends in a terminal button."}]},{"term":"Vesicles","def":"Tiny sacs in the terminal buttons that store neurotransmitters.","hook":"","asks":[{"q":"A drug damages the tiny sacs that store neurotransmitters. Which part is it damaging?","right":"The vesicles","wrong":[["The receptor sites on the next neuron's dendrites","Receptors receive; vesicles store."],["The myelin","Myelin coats the axon."],["The soma","The soma is the cell body."]],"exp":"Vesicles store neurotransmitters in the terminal buttons."},{"q":"When a neuron fires, what do the vesicles release into the synapse?","right":"Neurotransmitters","wrong":[["Hormones that travel through the bloodstream to distant organs","Hormones come from glands."],["Myelin","Myelin coats axons."],["Glial cells","Those are support cells."]],"exp":"Vesicles store neurotransmitters."}]},{"term":"Synapse","def":"The gap between two neurons (also called the synaptic cleft or synaptic gap). Neurons never actually touch.","hook":"","asks":[{"q":"Neurotransmitters are released and float across to the next neuron. What space do they cross?","right":"The synapse","wrong":[["The myelin sheath around the axon","Myelin is a coating, not a gap."],["The axon","The axon is part of the neuron."],["The vesicle","That is a storage sac."]],"exp":"The synapse is the gap; neurons never actually touch."},{"q":"Do two neurons physically touch at a synapse?","right":"No; there's a gap","wrong":[["Yes, the axon of one fuses directly with the dendrite of the next","Neurons never actually touch."],["Only in the spinal cord","Never."],["Only during sleep","Never."]],"exp":"The synapse is a gap; neurons never touch."}]}]},{"name":"Firing a neuron","cards":[{"term":"Resting potential","def":"The neuron is not firing; its dendrites are waiting to receive neurotransmitters.","hook":"","asks":[{"q":"A neuron isn't firing; its dendrites are just waiting to receive neurotransmitters. What state is it in?","right":"Resting potential","wrong":[["The refractory period after it has just fired","That is recovery after firing."],["Action potential","That is the firing itself."],["Threshold","That is the level needed to fire."]],"exp":"Not firing, waiting for input."},{"q":"Which state comes right before a neuron reaches threshold?","right":"Resting potential","wrong":[["The refractory period, the recovery time after firing","That comes after firing."],["Reuptake","That happens after release."],["Action potential","That is the firing itself."]],"exp":"Resting → threshold → action potential."}]},{"term":"Threshold","def":"The level of stimulation the dendrites must receive before the neuron will fire.","hook":"","asks":[{"q":"A neuron gets a little stimulation and doesn't fire, then more and it does. What level did the stimulation finally reach?","right":"Threshold","wrong":[["The refractory period","That is recovery time after firing."],["Reuptake","That is reabsorbing leftover neurotransmitters."],["Resting potential, the state of not firing","That is the state before firing."]],"exp":"The neuron fires only once threshold is reached."},{"q":"Stimulation stays just below a neuron's threshold. What happens?","right":"It does not fire","wrong":[["It fires weakly, at about half of its usual strength","There's no partial firing."],["It fires twice","It doesn't fire at all."],["It enters reuptake","Not related."]],"exp":"No threshold, no action potential."}]},{"term":"Action potential","def":"The electrical signal that the soma starts once threshold is reached; it travels down the axon.","hook":"","asks":[{"q":"Threshold is reached and an electrical signal races from the soma down the axon. What is this signal?","right":"An action potential","wrong":[["Reuptake of neurotransmitters into the sending neuron","Reuptake happens after release."],["Resting potential","That is the non-firing state."],["A hormone","Hormones travel in the blood."]],"exp":"The action potential is the neuron firing."},{"q":"Where does the action potential start, according to your card?","right":"At the soma","wrong":[["In the synapse between two neurons that are next to each other","The synapse is a gap."],["In the dendrites only","The soma starts it."],["In the vesicles","Those store chemicals."]],"exp":"The soma starts the action potential once threshold is reached."}]},{"term":"All-or-none principle","def":"A neuron either fires completely or not at all. It never partially fires, and a stronger stimulus does not make a stronger firing.","hook":"Like a gun: you either pull the trigger or you don't.","asks":[{"q":"A doctor doubles the strength of a stimulus to a neuron that already fires. What happens to how strongly it fires?","right":"Nothing; it fires the same way","wrong":[["It fires twice as strongly as before","A stronger stimulus never makes a stronger firing."],["It fires half as strongly","It either fires completely or not at all."],["It partially fires","Neurons never partially fire."]],"exp":"All or none: a neuron fires completely or not at all."},{"q":"A classmate says, \"A weak stimulus that barely reaches threshold makes a neuron fire weakly.\" What is wrong with that?","right":"Reaching threshold always means a full firing","wrong":[["Nothing; weaker stimuli always produce weaker firings in a neuron","A neuron never fires partially."],["Weak stimuli make neurons fire twice","Not how it works."],["Weak stimuli cause reuptake","Not related."]],"exp":"All or none: once threshold is reached the neuron fires completely; a stronger stimulus doesn't make a stronger firing."}]},{"term":"Reuptake","def":"Leftover neurotransmitters in the synapse get reabsorbed by the neuron that released them.","hook":"","asks":[{"q":"After a message is sent, leftover neurotransmitters are pulled back into the neuron that released them. What is this?","right":"Reuptake","wrong":[["The refractory period","That is recovery time when the neuron can't fire."],["Threshold","That is the level needed to fire."],["An action potential traveling the axon","That is the firing itself."]],"exp":"Reuptake reabsorbs leftover neurotransmitters."},{"q":"A drug blocks reuptake. What happens to the neurotransmitter?","right":"It stays in the synapse longer","wrong":[["It is destroyed right away before it can reach the next neuron","Blocking reuptake keeps it around."],["It turns into a hormone","Not how it works."],["It moves into the myelin","Not how it works."]],"exp":"Blocking reuptake leaves more neurotransmitter in the synapse."}]},{"term":"Refractory period","def":"The recovery time after firing when the neuron cannot fire again, no matter how many neurotransmitters it receives.","hook":"Like a toilet: you have to wait to flush again.","asks":[{"q":"Right after firing, a neuron gets flooded with neurotransmitters but still can't fire. Why?","right":"It's in its refractory period","wrong":[["It's at resting potential, waiting for input","At rest it could fire if stimulated."],["Its myelin is damaged","Myelin damage slows signals; it doesn't block firing right after a fire."],["Reuptake is blocked","That would leave more neurotransmitter in the synapse."]],"exp":"Like a toilet: you have to wait to flush again."},{"q":"A neuron has just fired. A split second later, a burst of neurotransmitters hits its dendrites, well above threshold. What happens right then?","right":"Nothing; it can't fire yet","wrong":[["It fires an even stronger signal than it did the first time","Firing never gets stronger, and it's in recovery."],["It fires at half strength","Neurons never half-fire."],["It releases more myelin","Not related."]],"exp":"During the refractory period the neuron can't fire, no matter how many neurotransmitters it receives."}]}]},{"name":"Diseases","cards":[{"term":"Multiple sclerosis (MS)","def":"Disease caused by deterioration of the myelin sheath (demyelination). Causes trouble with movement and walking.","hook":"MS = Myelin Sheath.","asks":[{"q":"A patient's axons are losing their fatty coating, and walking has become difficult. What is the most likely disease?","right":"Multiple sclerosis","wrong":[["Myasthenia gravis, an autoimmune muscle disorder","That blocks acetylcholine receptors; it doesn't damage myelin."],["Alzheimer's","That is linked to memory and low acetylcholine."],["Parkinson's","That is linked to low dopamine."]],"exp":"MS = myelin sheath breakdown (demyelination)."},{"q":"Two patients have muscle weakness. In one, antibodies attack the muscles' ACh receptors; in the other, the coating on the axons is breaking down. Which one has MS?","right":"The one whose axon coating is breaking down","wrong":[["The one whose antibodies attack the muscles' acetylcholine receptors","That is myasthenia gravis."],["Both have MS","Only one fits MS."],["Neither; both have Parkinson's","Parkinson's is low dopamine."]],"exp":"MS is deterioration of the myelin sheath."}]},{"term":"Myasthenia gravis","def":"Autoimmune disorder where antibodies block or destroy the muscles' receptor sites for acetylcholine, causing muscle weakness.","hook":"","asks":[{"q":"A patient's antibodies are destroying the muscles' receptor sites for acetylcholine, causing weakness. What disorder is this?","right":"Myasthenia gravis","wrong":[["Multiple sclerosis, a breakdown of myelin","MS damages myelin, not acetylcholine receptors."],["Parkinson's","That is linked to low dopamine."],["Schizophrenia","That is linked to high dopamine."]],"exp":"An autoimmune disorder blocking acetylcholine receptors at the muscles."},{"q":"What kind of disorder is myasthenia gravis?","right":"Autoimmune","wrong":[["Psychotic, involving hallucinations, delusions and disorganized speech","It's a neuromuscular autoimmune disorder."],["A sleep disorder","Not a sleep disorder."],["A mood disorder","Not a mood disorder."]],"exp":"Antibodies block or destroy acetylcholine receptor sites."}]}]}],"intro":["Parts of a neuron, how it fires, and two diseases that disrupt it."]},{"id":2,"name":"Neurotransmitters","optional":false,"sections":[{"name":"Basics","cards":[{"term":"Neurotransmitter","def":"A chemical messenger released into the synapse that carries a signal from one neuron to the next.","hook":"","asks":[{"q":"A chemical is released into the synapse and carries a signal to the next neuron. What is it?","right":"A neurotransmitter","wrong":[["A hormone carried through the bloodstream","Hormones travel in the blood, not across a synapse."],["A glial cell","That is a support cell."],["A vesicle","That is the sac that stores it."]],"exp":"Neurotransmitters are chemical messengers between neurons."},{"q":"Where are neurotransmitters released?","right":"Into the synapse","wrong":[["Into the bloodstream, so they can travel to distant organs","That is hormones."],["Into the myelin","Not where they go."],["Into the cochlea","Not where they go."]],"exp":"Neurotransmitters are released into the synapse."}]},{"term":"Excitatory","def":"Describes a neurotransmitter that makes the next neuron more likely to fire.","hook":"Excite = Go.","asks":[{"q":"A chemical makes the next neuron more likely to fire. How is it described?","right":"Excitatory","wrong":[["Inhibitory, because it calms the next neuron","Inhibitory keeps the next neuron from firing."],["Refractory","That is the recovery period, not a chemical type."],["Afferent","That describes neurons carrying sensory messages in."]],"exp":"Excite = go."},{"q":"Which neurotransmitter is the major excitatory one?","right":"Glutamate","wrong":[["GABA, the main calming chemical of the nervous system","GABA is the major inhibitory one."],["Serotonin","Your slides list it as inhibitory."],["Endorphins","Your slides list them as inhibitory."]],"exp":"Glutamate is the major excitatory neurotransmitter."}]},{"term":"Inhibitory","def":"Describes a neurotransmitter that keeps the next neuron from firing.","hook":"Inhibit = Stop.","asks":[{"q":"A chemical keeps the next neuron from firing. How is it described?","right":"Inhibitory","wrong":[["Excitatory, because it signals the neuron to go","Excitatory makes firing more likely."],["Efferent","That describes motor neurons carrying signals out."],["Afferent","That describes sensory neurons."]],"exp":"Inhibit = stop."},{"q":"Which neurotransmitter is the major inhibitory one?","right":"GABA","wrong":[["Glutamate, the main chemical involved in learning and memory","Glutamate is the major excitatory one."],["Acetylcholine","Your slides list it as excitatory."],["Substance P","Your slides list it as excitatory."]],"exp":"GABA is the primary inhibitory neurotransmitter."}]}]},{"name":"The chemicals","cards":[{"term":"Acetylcholine (ACh)","def":"Mainly controls movement (muscle action) and also plays a role in memory. Found in both the central and peripheral nervous systems. Too little is linked to Alzheimer's; too much causes muscle spasms; blocked receptors cause paralysis.","hook":"ACh = ACTion (muscles) + Alzheimer's.","asks":[{"q":"A patient with Alzheimer's has trouble with memory, and a doctor suspects too little of a chemical that also controls muscle action. Which one?","right":"Acetylcholine","wrong":[["Dopamine, the pleasure chemical","Low dopamine is linked to Parkinson's."],["Serotonin","Low serotonin is linked to depression."],["Endorphins","Those are natural painkillers."]],"exp":"ACh controls movement and plays a role in memory; too little is linked to Alzheimer's."},{"q":"A poison blocks acetylcholine receptors at the muscles. What would you expect?","right":"Paralysis","wrong":[["Muscle spasms, the effect of having far too much acetylcholine","Spasms come from too much ACh."],["Hallucinations","Not ACh."],["Insomnia","Not ACh."]],"exp":"Blocked ACh receptors cause paralysis."}]},{"term":"Dopamine","def":"The \"pleasure chemical\": reward pathway, anticipating something good, movement, alertness, and motor coordination. Low levels are linked to Parkinson's and addictive behaviors; high levels are linked to schizophrenia.","hook":"Low = Parkinson's shakes. High = schizophrenia.","asks":[{"q":"A patient has tremors and trouble starting movements. Low levels of which neurotransmitter are most likely?","right":"Dopamine","wrong":[["Glutamate, the major excitatory chemical","Glutamate is tied to thinking and learning; too much is linked to anxiety."],["GABA","Too little GABA is linked to anxiety."],["Substance P","That sends pain signals."]],"exp":"Low dopamine is linked to Parkinson's."},{"q":"High dopamine levels are linked to which disorder?","right":"Schizophrenia","wrong":[["Parkinson's disease, which involves tremors and slow movement","That is low dopamine."],["Alzheimer's","That is low ACh."],["Depression","That is low serotonin."]],"exp":"High dopamine is linked to schizophrenia."}]},{"term":"Serotonin","def":"Affects mood, emotion, appetite, and sleep. High levels mean more happiness; low levels are linked to depression, anger-control problems, and OCD.","hook":"","asks":[{"q":"A doctor treats a patient's depression with a drug that keeps more of a mood-related chemical in the synapse. Which chemical?","right":"Serotonin","wrong":[["Acetylcholine, which controls muscle action","ACh is about movement and memory."],["Adrenaline","That is a fight-or-flight hormone."],["Melatonin","That regulates sleep."]],"exp":"Low serotonin is linked to depression; SSRIs raise it."},{"q":"Low serotonin is linked to which problems on your card?","right":"Depression, anger problems and OCD","wrong":[["Parkinson's disease and a range of addictive behaviors","Those are low dopamine."],["Muscle spasms","That is too much ACh."],["Schizophrenia","That is high dopamine."]],"exp":"Low serotonin: depression, anger-control problems, OCD."}]},{"term":"SSRI","def":"Selective serotonin reuptake inhibitor. An antidepressant that blocks reuptake so serotonin stays in the synapse longer.","hook":"","asks":[{"q":"A drug blocks the reabsorption of serotonin so it stays in the synapse longer. What kind of drug is it?","right":"An SSRI","wrong":[["An antipsychotic that blocks dopamine","That would target dopamine, not serotonin."],["A stimulant","Stimulants excite the nervous system."],["A hallucinogen","Those distort perception."]],"exp":"Selective serotonin reuptake inhibitor: an antidepressant."},{"q":"Two antidepressants both raise serotonin. One blocks serotonin from being reabsorbed; the other doesn't. Which one is an SSRI?","right":"The one that blocks reabsorption","wrong":[["The one that adds brand new serotonin made outside the body","SSRIs block reuptake."],["Both are SSRIs","Only the reuptake blocker is."],["Neither","The reuptake blocker is an SSRI."]],"exp":"Selective serotonin reuptake inhibitor: blocks reuptake so serotonin stays longer."}]},{"term":"Norepinephrine","def":"Acts as both a neurotransmitter and a hormone (noradrenaline). Drives the sympathetic fight-or-flight response, plus focus, attention, and quick decisions. High levels are linked to developing fears; low levels to depression and ADHD.","hook":"","asks":[{"q":"A neurotransmitter that also acts as a hormone sharpens focus and drives the fight-or-flight response. Which one?","right":"Norepinephrine","wrong":[["GABA, the main inhibitory neurotransmitter","GABA calms the nervous system."],["Melatonin","That regulates sleep."],["Leptin","That signals fullness."]],"exp":"Norepinephrine (noradrenaline) drives the sympathetic response."},{"q":"Low norepinephrine is linked to which problems on your card?","right":"Depression and ADHD","wrong":[["Developing fears and phobias, which come from high levels","Fears are linked to high levels."],["Parkinson's","That is low dopamine."],["Paralysis","That is blocked ACh."]],"exp":"Low norepinephrine: depression and ADHD."}]},{"term":"GABA","def":"Gamma-aminobutyric acid: the primary inhibitory neurotransmitter. A natural tranquilizer that calms the nervous system. Too little is linked to anxiety disorders; too much causes sleepiness.","hook":"GABA = Gotta Always Be Asleep.","asks":[{"q":"A patient with an anxiety disorder may have too little of the brain's natural tranquilizer. Which chemical?","right":"GABA","wrong":[["Glutamate, the major excitatory chemical","Too much glutamate, not too little, is linked to anxiety."],["Dopamine","Dopamine is about reward and movement."],["Oxytocin","That is the bonding hormone."]],"exp":"GABA is the primary inhibitory neurotransmitter; too little is linked to anxiety."},{"q":"What happens with too much GABA?","right":"Sleepiness","wrong":[["Anxiety disorders, which come from having too little GABA","That is too little GABA."],["Muscle spasms","That is too much ACh."],["Hallucinations","That is high dopamine."]],"exp":"Too much GABA causes sleepiness."}]},{"term":"Glutamate","def":"The major excitatory neurotransmitter. Involved in thinking, memory, and learning. Too much is linked to high anxiety, OCD, and migraines.","hook":"Glutamate = Go.","asks":[{"q":"A student is learning new vocabulary. Which major excitatory neurotransmitter is involved in thinking, memory and learning?","right":"Glutamate","wrong":[["GABA, the major inhibitory chemical","GABA calms; glutamate excites."],["Endorphins","Those relieve pain."],["Melatonin","That regulates sleep."]],"exp":"Glutamate = go: the major excitatory neurotransmitter."},{"q":"Too much glutamate is linked to which problems?","right":"High anxiety, OCD and migraines","wrong":[["Sleepiness and calm, like the effects of too much GABA","That is too much GABA."],["Parkinson's","That is low dopamine."],["Paralysis","That is blocked ACh."]],"exp":"Too much glutamate: high anxiety, OCD, migraines."}]},{"term":"Endorphins","def":"The brain's natural painkillers, released by the pituitary gland. Relieve pain and stress; example: runner's high.","hook":"\"Endogenous morphine.\"","asks":[{"q":"After a long run, Jamie feels a wave of calm and less pain. Which chemicals are responsible?","right":"Endorphins","wrong":[["Substance P, which sends pain signals","Substance P sends pain signals; endorphins relieve pain."],["Ghrelin","That signals hunger."],["Acetylcholine","That controls muscle action."]],"exp":"Endorphins are natural painkillers: the runner's high."},{"q":"Which gland releases endorphins, according to your card?","right":"The pituitary gland","wrong":[["The adrenal glands, which sit on top of the two kidneys","Those release adrenaline."],["The pineal gland","That releases melatonin."],["The stomach","That makes ghrelin."]],"exp":"Endorphins are released by the pituitary gland."}]},{"term":"Substance P","def":"Involved in pain regulation (sending pain signals). Levels rise with stress, heat, and painful stimuli.","hook":"P = Pain.","asks":[{"q":"Levels of a neurotransmitter rise when you touch a hot stove and feel pain. Which one?","right":"Substance P","wrong":[["Endorphins, the natural painkillers","Endorphins reduce pain; substance P sends it."],["Serotonin","That affects mood."],["Oxytocin","That is the bonding hormone."]],"exp":"P = pain."},{"q":"Which three things raise substance P levels, according to your card?","right":"Stress, heat and painful stimuli","wrong":[["Sleep, darkness and calm, the way melatonin rises at night","That is melatonin."],["Food and fullness","That is leptin."],["Exercise and joy","That fits endorphins."]],"exp":"Substance P rises with stress, heat and painful stimuli."}]}]}],"intro":["Excitatory vs. inhibitory, and what each chemical does — plus what too much or too little looks like."]},{"id":3,"name":"Nervous & Endocrine Systems","optional":false,"sections":[{"name":"Functions & neurons","cards":[{"term":"Three functions of the nervous system","def":"Sensory input (gather info from the senses), integration (the brain processes it and decides), and motor output (signals go to muscles and glands).","hook":"","asks":[{"q":"You see a ball, decide to catch it, and move your hands. Which order of nervous system functions does this follow?","right":"Sensory input, integration, motor output","wrong":[["Motor output, integration, then sensory input at the very end","The senses come first, then the decision, then movement."],["Integration, sensory input, motor output","You must sense the ball before deciding."],["Sensory input, motor output, integration","The brain decides before you move."]],"exp":"Gather information, process it, act on it."},{"q":"Your brain decides to answer a question after hearing it. Which function is the deciding?","right":"Integration","wrong":[["Sensory input, gathering information through the senses","That is hearing the question."],["Motor output","That is speaking."],["Reuptake","Not a nervous system function."]],"exp":"Integration: the brain processes and decides."}]},{"term":"Sensory (afferent) neurons","def":"Carry messages from sensory receptors in to the brain and spinal cord.","hook":"Afferent = Arrive.","asks":[{"q":"Your finger touches a hot pan. Which neurons carry that message in to the spinal cord and brain?","right":"Sensory (afferent) neurons","wrong":[["Motor (efferent) neurons that run out to the muscles","Motor neurons carry signals out."],["Interneurons","Those relay between sensory and motor neurons."],["Glial cells","Those support neurons."]],"exp":"Afferent = arrive."},{"q":"A patient can move his hand on command but can't feel a pinprick on it. Which neurons from the hand are most likely damaged?","right":"Sensory (afferent) neurons","wrong":[["Motor (efferent) neurons that carry commands out to the muscles","He can still move; the problem is feeling."],["Interneurons in the cerebellum","Not the most likely damage."],["Glial cells in the eye","Not related."]],"exp":"Afferent = arrive: sensory messages coming in."}]},{"term":"Motor (efferent) neurons","def":"Carry signals from the brain and spinal cord out to muscles and organs.","hook":"Efferent = Exit.","asks":[{"q":"After your brain decides to pull your hand back, which neurons carry the signal out to your arm muscles?","right":"Motor (efferent) neurons","wrong":[["Sensory (afferent) neurons that run in from the skin","Those carry messages in."],["Interneurons","Those connect neurons inside the brain and spinal cord."],["Mirror neurons","Those aren't on this card."]],"exp":"Efferent = exit."},{"q":"A patient feels a pinprick on her foot but can't move the foot away. Which neurons to the foot are most likely damaged?","right":"Motor (efferent) neurons","wrong":[["Sensory (afferent) neurons that carry feelings in from the skin","She can still feel the pinprick."],["Interneurons in the eye","Not related."],["Vesicles","Those store neurotransmitters."]],"exp":"Efferent = exit: signals going out to muscles."}]},{"term":"Interneurons","def":"Relay neurons in the brain and spinal cord that connect sensory and motor neurons and pass information between them.","hook":"Inter = in between.","asks":[{"q":"Which neurons inside the spinal cord connect the message from your skin to the signal going out to your muscles?","right":"Interneurons","wrong":[["Sensory neurons carrying the message from the skin","Those bring the message in."],["Motor neurons","Those carry the signal out."],["Glial cells","Those support neurons."]],"exp":"Inter = in between."},{"q":"Where are interneurons found?","right":"In the brain and spinal cord","wrong":[["In the skin and muscles at the far ends of the limbs","Those have sensory and motor neurons."],["In the eye only","Not only."],["In the bloodstream","Neurons aren't in the blood."]],"exp":"Interneurons relay information within the brain and spinal cord."}]}]},{"name":"Divisions","cards":[{"term":"Central nervous system (CNS)","def":"The brain and the spinal cord.","hook":"","asks":[{"q":"A car accident damages a person's spinal cord. Which division of the nervous system was injured?","right":"The central nervous system","wrong":[["The peripheral nervous system of nerves in the limbs","The spinal cord is central, not peripheral."],["The somatic nervous system","That is part of the peripheral system."],["The endocrine system","That is a system of glands."]],"exp":"CNS = brain and spinal cord."},{"q":"Which two parts make up the central nervous system?","right":"The brain and spinal cord","wrong":[["The somatic and autonomic systems that reach the whole body","Those are parts of the peripheral system."],["The eyes and ears","Not the CNS."],["The heart and lungs","Not the CNS."]],"exp":"CNS = brain + spinal cord."}]},{"term":"Spinal cord","def":"The \"highway\" connecting the brain to the rest of the body; sends messages both ways.","hook":"","asks":[{"q":"Which structure acts as the \"highway\" sending messages both ways between the brain and the body?","right":"The spinal cord","wrong":[["The corpus callosum, linking the two hemispheres","That connects the hemispheres, not brain to body."],["The pituitary gland","That is a gland."],["The cerebellum","That handles balance and coordination."]],"exp":"The spinal cord connects the brain to the body."},{"q":"In which direction does the spinal cord send messages?","right":"Both ways","wrong":[["Only from the brain down to the body, never back up","It sends messages both ways."],["Only up to the brain","Both ways."],["Only to the eyes","Not true."]],"exp":"The spinal cord sends messages both ways."}]},{"term":"Peripheral nervous system (PNS)","def":"All the nerves outside the brain and spinal cord, connecting them to the rest of the body.","hook":"","asks":[{"q":"Nerves in your hand are damaged, but your brain and spinal cord are fine. Which division was injured?","right":"The peripheral nervous system","wrong":[["The central nervous system of brain and spinal cord","The brain and spinal cord are fine."],["The limbic system","That is a group of brain structures."],["The reticular formation","That is in the brainstem."]],"exp":"PNS = all nerves outside the brain and spinal cord."},{"q":"Which two systems are part of the peripheral nervous system?","right":"Somatic and autonomic","wrong":[["The brain and the spinal cord, linked by the brainstem","Those are the CNS."],["Endocrine and limbic","Not PNS divisions."],["Rods and cones","Those are in the eye."]],"exp":"The PNS includes the somatic and autonomic systems."}]},{"term":"Nerves","def":"Bundles of neurons that act like wires carrying messages to and from the brain and spinal cord.","hook":"","asks":[{"q":"Bundles of neurons run like wires from your spinal cord to your fingers. What are these bundles called?","right":"Nerves","wrong":[["Glial cells packed around the spinal cord","Glia support neurons; they aren't bundles of them."],["Synapses","Those are gaps between neurons."],["Hormones","Those are chemicals in the blood."]],"exp":"Nerves carry messages to and from the CNS."},{"q":"What analogy does your card use for nerves?","right":"Wires carrying messages","wrong":[["Insulation wrapped around an electrical wire to protect it","That is myelin."],["A switchboard","That is the thalamus."],["A highway","That is the spinal cord."]],"exp":"Nerves act like wires carrying messages."}]},{"term":"Somatic nervous system","def":"Part of the peripheral system that controls voluntary movements, like walking or picking up a pencil.","hook":"Soma = body you move on purpose.","asks":[{"q":"You decide to pick up a pencil. Which part of the peripheral nervous system controls this?","right":"The somatic nervous system","wrong":[["The autonomic nervous system, which runs on its own","That controls involuntary actions like heartbeat."],["The parasympathetic system","That calms the body."],["The endocrine system","That releases hormones."]],"exp":"Somatic = voluntary movement."},{"q":"Which action uses the somatic nervous system?","right":"Kicking a ball on purpose","wrong":[["Your heart speeding up when you are suddenly frightened","That is autonomic."],["Digesting lunch","That is autonomic."],["Your pupils widening","That is autonomic."]],"exp":"Somatic = voluntary movement."}]},{"term":"Autonomic nervous system","def":"Part of the peripheral system that controls involuntary actions like heartbeat and digestion. Split into sympathetic and parasympathetic.","hook":"Autonomic = automatic.","asks":[{"q":"Your heart beats and your stomach digests food without you thinking about it. Which system controls this?","right":"The autonomic nervous system","wrong":[["The somatic nervous system of voluntary movement","That controls movements you choose."],["The central nervous system only","These are peripheral, involuntary controls."],["The reticular formation","That controls arousal."]],"exp":"Autonomic = automatic."},{"q":"Which two divisions make up the autonomic nervous system?","right":"Sympathetic and parasympathetic","wrong":[["Somatic and central, which control voluntary movement","Not the autonomic divisions."],["Afferent and efferent","Those are neuron types."],["Left and right","Those are hemispheres."]],"exp":"Autonomic = sympathetic + parasympathetic."}]},{"term":"Sympathetic nervous system","def":"Arouses the body: the fight, flight, or freeze response.","hook":"Sympathetic = Stressed.","asks":[{"q":"A dog suddenly lunges at you, and your heart pounds and you're ready to run. Which system is active?","right":"Sympathetic","wrong":[["Parasympathetic, the rest-and-digest system","That calms the body down."],["Somatic","That controls voluntary movement."],["Central","The fight-or-flight response is autonomic."]],"exp":"Sympathetic = stressed: fight, flight or freeze."},{"q":"Which response does the sympathetic system trigger besides fight and flight?","right":"Freeze","wrong":[["Rest and digest, the calming response after danger has passed","That is parasympathetic."],["Sleep","Not on your card."],["Tend","That is tend-and-befriend, not on this card."]],"exp":"Fight, flight or freeze."}]},{"term":"Parasympathetic nervous system","def":"Calms the body back down: rest and digest.","hook":"Parasympathetic = Peace (or a Parachute down).","asks":[{"q":"After the dog leaves, your heart rate slows and you calm down. Which system is now active?","right":"Parasympathetic","wrong":[["Sympathetic, the fight-or-flight system","That arouses the body."],["Somatic","That controls voluntary movement."],["Reticular","That controls arousal and consciousness."]],"exp":"Parasympathetic = peace: rest and digest."},{"q":"After a big Thanksgiving dinner on the couch, your heart rate is slow and your stomach is busy digesting. Which system is most active?","right":"Parasympathetic","wrong":[["Sympathetic, which gets the body ready to fight, flee or freeze","That is arousal, not rest."],["Somatic","That is voluntary movement."],["Central","Rest and digest is autonomic."]],"exp":"Parasympathetic = rest and digest."}]},{"term":"Reflex","def":"A simple, automatic response to a stimulus (like the knee-jerk), directed by the spinal cord instead of the brain, which makes it faster.","hook":"","asks":[{"q":"A doctor taps your knee and your leg kicks before you even think about it. Why is this so fast?","right":"The spinal cord directs it, not the brain","wrong":[["The brain plans the kick in advance","The brain isn't directing it."],["Hormones carry the signal through the blood quickly","Hormones are slow."],["The cerebellum controls all reflexes","Reflexes are directed by the spinal cord."]],"exp":"Reflexes skip the brain, which makes them faster."},{"q":"Which structure directs a knee-jerk reflex?","right":"The spinal cord","wrong":[["The cerebral cortex, after planning the movement carefully","Reflexes skip the brain."],["The thalamus","Not the director."],["The hippocampus","Not involved."]],"exp":"Reflexes are directed by the spinal cord."}]}]},{"name":"Endocrine system","cards":[{"term":"Endocrine system","def":"The system of glands that releases and regulates hormones.","hook":"","asks":[{"q":"Which system uses glands to release hormones into the bloodstream?","right":"The endocrine system","wrong":[["The somatic nervous system of voluntary movement","That controls voluntary movement."],["The limbic system","That is a group of brain structures."],["The central nervous system","That is the brain and spinal cord."]],"exp":"The endocrine system is the system of glands."},{"q":"Which structure is part of the endocrine system?","right":"The adrenal glands","wrong":[["The corpus callosum that connects the brain's two hemispheres","That is a brain structure."],["The retina","That is in the eye."],["The cochlea","That is in the ear."]],"exp":"The endocrine system is the system of glands."}]},{"term":"Hormones vs. neurotransmitters","def":"Hormones travel through the bloodstream, so they act more slowly than neurotransmitters, but their effects last longer.","hook":"","asks":[{"q":"Why does the jittery feeling after a scare last longer than the quick jolt of fear itself?","right":"Hormones in the blood act slower but last longer","wrong":[["Neurotransmitters travel through the blood very slowly","Neurotransmitters cross synapses quickly."],["Hormones work faster than neurotransmitters","Hormones are slower."],["The brain stops releasing chemicals","The difference is how hormones travel."]],"exp":"Hormones travel through the bloodstream: slower, but longer lasting."},{"q":"Which is true about hormones compared with neurotransmitters?","right":"Slower, but the effects last longer","wrong":[["Faster, and the effects wear off almost right away afterward","That describes neurotransmitters."],["They travel across synapses","Hormones travel in the blood."],["They come from vesicles","They come from glands."]],"exp":"Hormones travel in the bloodstream: slower, longer-lasting."}]},{"term":"Pituitary gland","def":"The \"master gland.\" Regulates stress, growth, and reproduction and signals the other glands to release their hormones.","hook":"","asks":[{"q":"Which gland signals the other glands to release their hormones?","right":"The pituitary gland","wrong":[["The adrenal glands on top of the kidneys","Those release adrenaline."],["The pineal gland","That releases melatonin."],["The thalamus","That is a sensory relay station, not a gland."]],"exp":"The pituitary is the master gland."},{"q":"Which three functions does the pituitary regulate, according to your card?","right":"Stress, growth and reproduction","wrong":[["Hunger, fullness and digestion of the food that is eaten","Those involve ghrelin and leptin."],["Vision and hearing","Not glands."],["Balance","That is vestibular."]],"exp":"The master gland regulates stress, growth and reproduction."}]},{"term":"Adrenaline","def":"Hormone from the adrenal glands (on top of the kidneys). Raises heart rate, blood pressure, and blood sugar for the fight-or-flight energy surge.","hook":"","asks":[{"q":"During a scary roller coaster, your heart rate, blood pressure and blood sugar jump. Which hormone caused this?","right":"Adrenaline","wrong":[["Melatonin from the pineal gland","That helps you sleep."],["Leptin","That signals fullness."],["Oxytocin","That is the bonding hormone."]],"exp":"Adrenaline from the adrenal glands fuels fight-or-flight."},{"q":"Where are the adrenal glands located?","right":"On top of the kidneys","wrong":[["Deep in the brain, right next to the thalamus and pineal gland","That is the pineal gland."],["In the stomach","That makes ghrelin."],["In the neck","Not on your card."]],"exp":"Adrenal glands sit on top of the kidneys."}]},{"term":"Ghrelin","def":"Hunger hormone made in the stomach; tells the body you are hungry.","hook":"Ghrelin = Growling stomach.","asks":[{"q":"Your stomach growls before lunch. Which hormone is telling your body you're hungry?","right":"Ghrelin","wrong":[["Leptin, the fullness hormone","Leptin tells you you're full."],["Melatonin","That regulates sleep."],["Estrogen","That is a sex hormone."]],"exp":"Ghrelin = growling stomach."},{"q":"Where is ghrelin made?","right":"In the stomach","wrong":[["In the small intestine, according to your Psych slides","That is leptin."],["In the pituitary","Not ghrelin."],["In the pineal gland","That is melatonin."]],"exp":"Ghrelin is made in the stomach."}]},{"term":"Leptin","def":"Hormone that tells the body you are full (satiety). Your slides say it is made in the small intestine.","hook":"Leptin = Leave the table.","asks":[{"q":"After Thanksgiving dinner you feel stuffed and push your plate away. Which hormone signals this?","right":"Leptin","wrong":[["Ghrelin, the hunger hormone","Ghrelin signals hunger."],["Adrenaline","That is the fight-or-flight hormone."],["Testosterone","That is a sex hormone."]],"exp":"Leptin = leave the table."},{"q":"Where do your slides say leptin is made?","right":"In the small intestine","wrong":[["In the stomach, the organ that growls when you are hungry","That is ghrelin."],["In the testes","That is testosterone."],["In the pineal gland","That is melatonin."]],"exp":"Your slides say leptin is made in the small intestine."}]},{"term":"Testosterone","def":"Sex hormone made in the testes and ovaries; the hormone most responsible for sex drive. Men have more. Too much is linked to aggression.","hook":"","asks":[{"q":"Which sex hormone is most responsible for sex drive and, in excess, is linked to aggression?","right":"Testosterone","wrong":[["Estrogen, the female sex hormone","Estrogen is important for reproduction."],["Oxytocin","That is the bonding hormone."],["Melatonin","That regulates sleep."]],"exp":"Testosterone: sex drive; too much is linked to aggression."},{"q":"Where is testosterone made, according to your card?","right":"In the testes and ovaries","wrong":[["In the adrenal glands only, together with adrenaline","Your card says testes and ovaries."],["In the stomach","That is ghrelin."],["In the pineal gland","That is melatonin."]],"exp":"Testosterone is made in the testes and ovaries."}]},{"term":"Estrogen","def":"Sex hormone important for reproduction; women have more of it.","hook":"","asks":[{"q":"Which sex hormone, important for reproduction, do women have more of?","right":"Estrogen","wrong":[["Testosterone, which men have more of","Men have more testosterone."],["Ghrelin","That signals hunger."],["Adrenaline","That fuels fight-or-flight."]],"exp":"Estrogen is important for reproduction."},{"q":"Which description fits estrogen?","right":"A sex hormone important for reproduction","wrong":[["The hunger hormone that makes your stomach growl before meals","That is ghrelin."],["The love hormone","That is oxytocin."],["The sleep hormone","That is melatonin."]],"exp":"Estrogen is important for reproduction; women have more."}]},{"term":"Oxytocin","def":"The \"love\" or social-bonding hormone. Made by the hypothalamus and released by the pituitary. Important in labor, mother–baby bonding, and bonding with friends and partners. Low levels are linked to postpartum depression.","hook":"","asks":[{"q":"A new mother feels a powerful bond with her baby during and after birth. Which hormone is most involved?","right":"Oxytocin","wrong":[["Melatonin, released in darkness","That regulates sleep."],["Adrenaline","That fuels fight-or-flight."],["Ghrelin","That signals hunger."]],"exp":"Oxytocin is the love or bonding hormone."},{"q":"Low oxytocin is linked to which condition on your card?","right":"Postpartum depression","wrong":[["Parkinson's disease and its tremors and slow movement","That is low dopamine."],["Anxiety","That is low GABA."],["Obesity","Not on your card."]],"exp":"Low oxytocin is linked to postpartum depression."}]},{"term":"Melatonin","def":"Hormone from the pineal gland, released in response to darkness. Regulates circadian rhythm (sleep-wake cycle) and helps you sleep.","hook":"","asks":[{"q":"As it gets dark at night, you start feeling sleepy. Which hormone is rising?","right":"Melatonin","wrong":[["Adrenaline from the adrenal glands","That wakes you up for fight-or-flight."],["Leptin","That signals fullness."],["Ghrelin","That signals hunger."]],"exp":"Melatonin from the pineal gland responds to darkness."},{"q":"Which gland releases melatonin?","right":"The pineal gland","wrong":[["The pituitary gland, the master gland of the endocrine system","Not melatonin."],["The adrenal glands","They release adrenaline."],["The thyroid","Not on your card."]],"exp":"Melatonin comes from the pineal gland."}]}]}],"intro":["How the nervous system is divided, the three neuron types, and the hormones you need to know."]},{"id":4,"name":"The Brain","optional":false,"sections":[{"name":"Old brain","cards":[{"term":"Brainstem","def":"The medulla plus the pons; handles automatic survival functions.","hook":"","asks":[{"q":"Which part of the brain, made of the medulla and pons, handles automatic survival functions?","right":"The brainstem","wrong":[["The cerebral cortex, the wrinkled outer layer","The cortex handles higher thinking."],["The limbic system","That handles emotion and memory."],["The corpus callosum","That connects the hemispheres."]],"exp":"Brainstem = medulla + pons."},{"q":"A patient's brainstem is damaged. Which kinds of functions are most at risk?","right":"Automatic survival functions","wrong":[["Fine motor skills, coordination and balance, like riding a bike","That is the cerebellum."],["Language comprehension","That is Wernicke's area."],["Face recognition","That is the right hemisphere."]],"exp":"The brainstem handles automatic survival functions."}]},{"term":"Medulla","def":"Base of the brainstem; controls life-sustaining functions like breathing and heartbeat.","hook":"Medulla = Most important (keeps you alive).","asks":[{"q":"A blow to the base of the brainstem stops a person's breathing. Which structure was damaged?","right":"The medulla","wrong":[["The cerebellum, which controls balance","The cerebellum handles coordination."],["The thalamus","That relays senses."],["The hippocampus","That stores memories."]],"exp":"The medulla controls breathing and heartbeat."},{"q":"Why is an injury to the base of the brainstem often far more dangerous than one to the cerebellum?","right":"The medulla controls breathing and heartbeat","wrong":[["The cerebellum controls breathing and the heartbeat, but the medulla does not","It's the reverse."],["The medulla stores long-term memories","That is the hippocampus."],["The medulla controls vision","That is the occipital lobe."]],"exp":"The medulla controls life-sustaining functions."}]},{"term":"Pons","def":"Connects the spinal cord to the brain; involved in automatic processes, especially the sleep-wake cycle.","hook":"Pons = bridge (French \"pont\").","asks":[{"q":"Which brainstem structure is especially involved in the sleep-wake cycle and connects the spinal cord to the brain?","right":"The pons","wrong":[["The amygdala, which processes fear","The amygdala is in the limbic system."],["The occipital lobe","That processes vision."],["Broca's area","That controls speech."]],"exp":"Pons = bridge."},{"q":"A patient's sleep-wake cycle is badly disrupted after a small brainstem stroke. Which structure is most likely involved?","right":"The pons","wrong":[["The occipital lobe at the back of the brain, which processes vision","That is vision."],["Broca's area","That is speech."],["The amygdala","That is fear."]],"exp":"The pons is involved in automatic processes, especially the sleep-wake cycle."}]},{"term":"Reticular formation","def":"Network in the brainstem (part of the pons, per your slides) that controls arousal and consciousness. Damage can cause a coma.","hook":"","asks":[{"q":"After damage to a network in the brainstem, a patient falls into a coma. Which network was damaged?","right":"The reticular formation","wrong":[["The corpus callosum between the hemispheres","That connects the two hemispheres."],["Wernicke's area","That is for understanding language."],["The motor cortex","That controls voluntary movement."]],"exp":"The reticular formation controls arousal and consciousness."},{"q":"The reticular formation controls which two things?","right":"Arousal and consciousness","wrong":[["Hunger and fullness, through signals from the stomach and gut","That is the hypothalamus."],["Vision and color","That is the occipital lobe."],["Speech production","That is Broca's area."]],"exp":"Arousal and consciousness."}]},{"term":"Thalamus","def":"Sits on top of the brainstem; the brain's sensory relay station. All senses except smell get routed through it.","hook":"Thalamus = sensory switchboard.","asks":[{"q":"Light, sound and touch signals are all routed through one structure on their way to the cortex. Which one?","right":"The thalamus","wrong":[["The hypothalamus below it","That regulates hunger, thirst and temperature."],["The amygdala","That processes fear."],["The pons","That is involved in sleep."]],"exp":"The thalamus is the sensory switchboard (every sense but smell)."},{"q":"Which sense is NOT routed through the thalamus?","right":"Smell","wrong":[["Vision, which travels from the eyes to the occipital lobe","Vision goes through the thalamus."],["Hearing","Hearing goes through it."],["Touch","Touch goes through it."]],"exp":"All senses except smell go through the thalamus."}]},{"term":"Cerebellum","def":"\"Little brain\" at the back. Handles fine motor control, coordination, posture, and balance, plus learned motor skills like riding a bike. Alcohol strongly affects it.","hook":"Cerebellum = balance (think \"bell\" ringing while you wobble).","asks":[{"q":"After a few drinks, a person stumbles and can't walk a straight line. Which part of the brain is most affected?","right":"The cerebellum","wrong":[["The hippocampus, which stores long-term memory","That handles memory, not balance."],["The medulla","That controls breathing and heartbeat."],["The occipital lobe","That processes vision."]],"exp":"The cerebellum handles balance and coordination; alcohol strongly affects it."},{"q":"Which learned skill relies on the cerebellum, according to your card?","right":"Riding a bike","wrong":[["Remembering a phone number for a few seconds before dialing it","That isn't the cerebellum's job."],["Recognizing a face","That is the right hemisphere."],["Feeling fear","That is the amygdala."]],"exp":"Learned motor skills like riding a bike."}]}]},{"name":"Limbic system","cards":[{"term":"Limbic system","def":"Brain structures involved in emotion and long-term memory: the amygdala, hippocampus, and hypothalamus.","hook":"","asks":[{"q":"Which group of brain structures, including the amygdala and hippocampus, handles emotion and long-term memory?","right":"The limbic system","wrong":[["The brainstem of the medulla and pons","That handles survival functions."],["The cerebral cortex","That is the wrinkled outer layer."],["The endocrine system","That is a system of glands."]],"exp":"Limbic system: amygdala, hippocampus, hypothalamus."},{"q":"Which three structures make up the limbic system on your card?","right":"Amygdala, hippocampus, hypothalamus","wrong":[["Medulla, pons and reticular formation in the brainstem","Those are brainstem parts."],["Frontal, parietal, occipital","Those are lobes."],["Rods, cones, ganglia","Those are in the eye."]],"exp":"Amygdala, hippocampus and hypothalamus."}]},{"term":"Amygdala","def":"Processes emotion, especially fear and aggression. Triggers fight-or-flight, helps read others' emotions, and helps store emotional memories.","hook":"Two almonds of fear.","asks":[{"q":"A woman with damage to one brain structure shows no fear, even of snakes. Which structure is most likely damaged?","right":"The amygdala","wrong":[["The hippocampus, which stores memories","That handles memory, not fear."],["The cerebellum","That handles balance."],["The pons","That is involved in sleep."]],"exp":"The amygdala processes fear and aggression."},{"q":"A man can't read fear on other people's faces and doesn't form emotional memories of scary events. Which structure is most likely damaged?","right":"The amygdala","wrong":[["The hippocampus, which stores ordinary facts and events","The emotional part points to the amygdala."],["The medulla","That is breathing."],["The pons","That is sleep."]],"exp":"The amygdala reads others' emotions and stores emotional memories."}]},{"term":"Hippocampus","def":"Helps store information into long-term memory. One of the first areas damaged by Alzheimer's.","hook":"A hippo never forgets.","asks":[{"q":"After surgery, a patient can't form any new long-term memories. Which structure was most likely removed?","right":"The hippocampus","wrong":[["The amygdala, which processes fear","That handles emotion, especially fear."],["The medulla","That controls breathing."],["The occipital lobe","That processes vision."]],"exp":"A hippo never forgets: the hippocampus stores new long-term memories."},{"q":"Which disease is one of the first to damage the hippocampus?","right":"Alzheimer's","wrong":[["Parkinson's, which comes from low levels of dopamine","Not on your card."],["Multiple sclerosis","That damages myelin."],["Narcolepsy","That is a sleep disorder."]],"exp":"The hippocampus is one of the first areas damaged by Alzheimer's."}]},{"term":"Hypothalamus","def":"Regulates the autonomic nervous system and monitors body temperature, thirst, hunger, and sexual responses.","hook":"The 4 Fs: feeding, fighting, fleeing, and mating.","asks":[{"q":"Which structure monitors body temperature, hunger, thirst and sexual responses?","right":"The hypothalamus","wrong":[["The thalamus, the sensory relay station","That relays senses."],["The cerebellum","That handles balance."],["Broca's area","That controls speech."]],"exp":"The hypothalamus: feeding, fighting, fleeing, mating."},{"q":"Which system does the hypothalamus regulate?","right":"The autonomic nervous system","wrong":[["The somatic nervous system of voluntary, chosen movements","That is voluntary movement."],["The visual cortex","Not the hypothalamus."],["Speech","Not the hypothalamus."]],"exp":"The hypothalamus regulates the autonomic nervous system."}]},{"term":"Lateral hypothalamus (LH)","def":"Part of the hypothalamus that triggers feelings of hunger. Damage → loss of hunger.","hook":"Lateral = Lunch.","asks":[{"q":"A rat with damage to one part of its hypothalamus stops eating entirely. Which part?","right":"The lateral hypothalamus","wrong":[["The ventromedial hypothalamus, which signals fullness","Damage there causes overeating."],["The pineal gland","That releases melatonin."],["The hippocampus","That stores memories."]],"exp":"Lateral = lunch: damage means loss of hunger."},{"q":"Rat A stops eating after damage to one part of its hypothalamus; rat B overeats after damage to another part. Which parts were damaged, in order?","right":"Rat A: lateral; rat B: ventromedial","wrong":[["Rat A: ventromedial; rat B: lateral, the other way around","Lateral damage stops hunger; VMH damage causes overeating."],["Both: lateral","Their symptoms are opposite."],["Both: hippocampus","That is memory."]],"exp":"LH damage → loss of hunger; VMH damage → overeating."}]},{"term":"Ventromedial hypothalamus (VMH)","def":"Part of the hypothalamus that signals fullness. Damage → overeating.","hook":"Ventromedial = Very full.","asks":[{"q":"A rat with damage to one part of its hypothalamus overeats and never seems full. Which part?","right":"The ventromedial hypothalamus","wrong":[["The lateral hypothalamus, which triggers hunger","Damage there causes loss of hunger."],["The amygdala","That processes fear."],["The thalamus","That relays senses."]],"exp":"Ventromedial = very full: damage means overeating."},{"q":"What does the VMH signal when it works normally?","right":"Fullness","wrong":[["Hunger, telling the body that it is time for lunch","That is the LH."],["Fear","That is the amygdala."],["Sleep","That is melatonin."]],"exp":"Ventromedial = very full."}]}]},{"name":"Cerebral cortex","cards":[{"term":"Cerebral cortex","def":"The wrinkled outer layer of the brain, split into a left and right hemisphere. Its four lobes: frontal, parietal, occipital, temporal (F-POT).","hook":"","asks":[{"q":"Which wrinkled outer layer of the brain is split into two hemispheres and four lobes?","right":"The cerebral cortex","wrong":[["The limbic system deep inside the brain","That is a group of inner structures."],["The brainstem","That is the medulla and pons."],["The cerebellum","That is the \"little brain\" at the back."]],"exp":"Four lobes: frontal, parietal, occipital, temporal (F-POT)."},{"q":"A neurologist says a patient's damage is in the wrinkled outer layer of the brain. Which kinds of function are most likely affected?","right":"Higher functions like planning, language and vision","wrong":[["Only breathing and heartbeat, which keep the patient alive","Those are brainstem functions."],["Only reflexes","Those are spinal cord."],["Only hormone release","That is endocrine."]],"exp":"The cerebral cortex holds the four lobes (F-POT)."}]},{"term":"Frontal lobe","def":"Front of the brain; home of the prefrontal cortex, motor cortex, and Broca's area.","hook":"","asks":[{"q":"Which lobe holds the prefrontal cortex, the motor cortex and Broca's area?","right":"The frontal lobe","wrong":[["The temporal lobe, which holds Wernicke's area","Wernicke's area is in the temporal lobe."],["The occipital lobe","That processes vision."],["The parietal lobe","That processes body sensations."]],"exp":"The frontal lobe is at the front of the brain."},{"q":"Where is the frontal lobe?","right":"At the front of the brain","wrong":[["At the very back of the brain, where vision is processed","That is the occipital lobe."],["On top","That is the parietal lobe."],["On the sides","That is the temporal lobe."]],"exp":"Front of the brain."}]},{"term":"Prefrontal cortex","def":"Front of the frontal lobe; executive functions — judgment, planning, reasoning, problem solving, moral judgment, and personality.","hook":"","asks":[{"q":"A teen makes impulsive decisions partly because one area involved in judgment and planning isn't fully developed. Which area?","right":"The prefrontal cortex","wrong":[["The somatosensory cortex, which registers touch","That handles body sensations."],["The occipital lobe","That processes vision."],["The medulla","That controls breathing."]],"exp":"The prefrontal cortex handles executive functions like judgment and planning."},{"q":"Which functions belong to the prefrontal cortex?","right":"Judgment, planning and moral reasoning","wrong":[["Processing sounds and storing long-term memories of events","That is the temporal lobe."],["Balance","That is the cerebellum."],["Breathing","That is the medulla."]],"exp":"Executive functions: judgment, planning, reasoning, moral judgment, personality."}]},{"term":"Motor cortex","def":"Strip at the rear of the frontal lobe that controls voluntary movement.","hook":"Motor is in front of Sensory (somatosensory) — \"M before S.\"","asks":[{"q":"A stroke damages the strip at the back of a patient's frontal lobe, and he can't move his arm on purpose. Which area?","right":"The motor cortex","wrong":[["The somatosensory cortex just behind it","That registers touch, not movement."],["The hippocampus","That stores memories."],["Wernicke's area","That is for understanding language."]],"exp":"The motor cortex controls voluntary movement."},{"q":"Surgeons stimulate a strip at the back of a patient's frontal lobe, and her fingers twitch. Which strip did they touch?","right":"The motor cortex","wrong":[["The somatosensory cortex, which would make her feel a touch instead","That registers touch."],["The visual cortex","That processes sight."],["Wernicke's area","That is language."]],"exp":"The motor cortex controls voluntary movement."}]},{"term":"Broca's area","def":"Left frontal lobe, next to the motor cortex; controls speech production.","hook":"Broca = broken speech.","asks":[{"q":"Which area in the left frontal lobe controls speech production?","right":"Broca's area","wrong":[["Wernicke's area in the temporal lobe","Wernicke's is for understanding language."],["The amygdala","That processes fear."],["The occipital lobe","That processes vision."]],"exp":"Broca = broken speech when damaged."},{"q":"Where is Broca's area located?","right":"Left frontal lobe, by the motor cortex","wrong":[["Right temporal lobe, next to the primary auditory cortex","That isn't Broca's area."],["Occipital lobe","That is vision."],["Cerebellum","That is balance."]],"exp":"Broca's area: left frontal lobe, next to the motor cortex."}]},{"term":"Broca's aphasia","def":"Difficulty producing speech; sentences are short and simple, often just a noun and a verb, but understanding is mostly fine.","hook":"","asks":[{"q":"After a stroke, a man understands questions but can only answer \"Walk... dog...\" with great effort. What does he most likely have?","right":"Broca's aphasia","wrong":[["Wernicke's aphasia, where fluent speech makes little sense","In Wernicke's, speech flows but makes little sense."],["Hindsight bias","That is a thinking error."],["Prosopagnosia","That isn't on this card."]],"exp":"Short, effortful sentences with good understanding = Broca's aphasia."},{"q":"In Broca's aphasia, which ability is mostly fine?","right":"Understanding language","wrong":[["Producing long, fluent sentences without effort or pauses","That is what's impaired."],["Moving the arms","Not the point."],["Seeing colors","Not related."]],"exp":"Speech production suffers; understanding is mostly fine."}]},{"term":"Phineas Gage","def":"Railroad worker who had an iron rod driven through his prefrontal cortex. His personality changed: irritable, profane, dishonest, poor emotional control.","hook":"","asks":[{"q":"After an iron rod went through his prefrontal cortex, a man became irritable, profane and dishonest. What does his case show?","right":"The prefrontal cortex shapes personality","wrong":[["The cerebellum controls
