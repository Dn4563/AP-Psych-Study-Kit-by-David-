p). Top-down = perception (your knowledge, experience, or context interprets it)."},{"deck":1,"text":"Both thresholds are measured at 50% of the time. Absolute = can you detect it at all? Difference (JND) = can you tell it changed?"}],"practice":{"sections":[{"name":"Perception","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q1-1","type":"mcq","topic":"Perception","stem":"Which of the following best describes selective attention?","options":["Noticing every stimulus in the environment equally","The weakest stimulus a person can detect","Using past experience to interpret what you sense","Focusing conscious awareness on one particular stimulus and not something else"],"ans":3,"exp":"Selective attention = focusing on one thing and NOT something else.","why":["","","",""]},{"id":"q1-2","type":"mcq","topic":"Perception","stem":"In a class demo, the word GREEN is printed in purple ink, and students must say the ink color. Many answer slowly or say \"green\" by mistake. This demonstrates:","options":["Change blindness","The cocktail party effect","Weber's law","The Stroop effect"],"ans":3,"exp":"The Stroop effect is the delayed reaction when you must say the color of a word instead of the word itself.","why":["","","",""]},{"id":"q1-3","type":"mcq","topic":"Perception","stem":"Which of the following is the best example of change blindness?","options":["A driver talking on the phone doesn't see a pedestrian in the crosswalk.","Between shots in a movie, an actor's drink switches from full to empty, and most viewers don't notice.","At a noisy party, you hear your name from across the room.","You can hear a watch ticking 20 feet away."],"ans":1,"exp":"Missing a CHANGE = change blindness. Not seeing the pedestrian at all is inattentional blindness, the trap answer.","why":["","","",""]},{"id":"q1-4","type":"mcq","topic":"Perception","stem":"Which of the following is the best example of inattentional blindness?","options":["An actor's shirt changes color between scenes, and viewers miss it.","You notice one red dot in a field of blue dots.","Your music goes from volume 5 to 10, and you notice.","While focused on texting, Ben walks past a bright yellow car parked right in front of him and never sees it."],"ans":3,"exp":"Failing to see a visible object because attention is elsewhere = inattentional blindness. The shirt is change blindness.","why":["","","",""]},{"id":"q1-5","type":"mcq","topic":"Perception","stem":"What do change blindness and inattentional blindness have in common?","options":["Both are caused by damage to the occipital lobe.","Both happen because attention is directed elsewhere.","Both involve hearing rather than vision.","Both are forms of extrasensory perception."],"ans":1,"exp":"Both come from attention being directed elsewhere. The difference is missing a change vs. missing an object.","why":["","","",""]},{"id":"q1-6","type":"mcq","topic":"Perception","stem":"A student is so focused on her notes in a noisy cafeteria that she doesn't notice her friend sit down right across from her. Which concept best explains this?","options":["The cocktail party effect","The absolute threshold","Inattentional blindness","Precognition"],"ans":2,"exp":"Her friend was fully visible, but her attention was directed elsewhere.","why":["","","",""]},{"id":"q1-7","type":"mcq","topic":"Perception","stem":"At a crowded school dance, Lena can focus on her friend's voice and tune out everyone else. This best illustrates:","options":["The pop-out phenomenon","The cocktail party effect","Change blindness","The difference threshold"],"ans":1,"exp":"Focusing auditory attention on one voice while filtering out others is the cocktail party effect.","why":["","","",""]},{"id":"q1-8","type":"mcq","topic":"Perception","stem":"Which of the following best explains why you might suddenly notice your own name being said across a noisy cafeteria?","options":["Your absolute threshold for sound drops in loud places.","Top-down processing shuts off in noisy places.","Your brain can register your name even amongst background noise.","Change blindness makes you notice sounds."],"ans":2,"exp":"That's part of the cocktail party effect on your slides.","why":["","","",""]},{"id":"q1-9","type":"mcq","topic":"Perception","stem":"In a crowd of people wearing black, one person in a bright orange jacket instantly catches your eye. This is:","options":["The pop-out phenomenon","Inattentional blindness","The Stroop effect","Clairvoyance"],"ans":0,"exp":"Something different popping out to get your attention is the pop-out phenomenon.","why":["","","",""]},{"id":"q1-10","type":"mcq","topic":"Perception","stem":"Which of the following best describes the difference between bottom-up and top-down processing?","options":["Bottom-up uses past experience; top-down uses only the senses.","Bottom-up happens only in vision; top-down only in hearing.","They are two names for the same process.","Bottom-up starts with sensory receptors sending information up to the brain (sensation); top-down uses knowledge, experience, and context to interpret it (perception)."],"ans":3,"exp":"Bottom-up = sensation. Top-down = perception.","why":["","","",""]},{"id":"q1-11","type":"mcq","topic":"Perception","stem":"Looking at a messy handwritten note, you see a squiggle and recognize it as the number 15. Recognizing what the squiggle means is an example of:","options":["Bottom-up processing","The absolute threshold","Top-down processing","Selective attention"],"ans":2,"exp":"Your slides: being aware of the squiggle is bottom-up; knowing what it means is top-down.","why":["","","",""]},{"id":"q1-12","type":"mcq","topic":"Perception","stem":"You can read a paragraph where the middle letters of every word are scrambled, as long as the first and last letters are in place. Which of the following best explains this?","options":["Bottom-up processing: the eyes read every letter separately","Top-down processing: the mind reads each word as a whole","The Stroop effect","Weber's law"],"ans":1,"exp":"The mind doesn't read every letter by itself, but the word as a whole. That's top-down.","why":["","","",""]},{"id":"q1-13","type":"mcq","topic":"Perception","stem":"Which of the following is an example of bottom-up processing?","options":["Recognizing a friend's messy handwriting because you've seen it before","Reading scrambled words because you know the language","Using the context of a sentence to figure out a smudged word","Receptors in your skin register the cold of an ice cube and send that information up to the brain"],"ans":3,"exp":"Bottom-up = receptors registering information and sending it up. The others all use knowledge or context (top-down).","why":["","","",""]},{"id":"q1-14","type":"mcq","topic":"Perception","stem":"Which of the following best defines the absolute threshold?","options":["The weakest amount of a stimulus a person can detect 50% of the time","The smallest change in a stimulus a person can notice 50% of the time","The point at which a stimulus becomes painful","The constant amount a stimulus must change to be noticed"],"ans":0,"exp":"Absolute = detecting it at all. The second option is the difference threshold, the trap answer.","why":["","","",""]},{"id":"q1-15","type":"mcq","topic":"Perception","stem":"Which of the following is an example of an absolute threshold?","options":["Noticing your music went from volume 5 to 10","Noticing 1 ounce added to a 10-ounce weight","Hearing a watch ticking 20 feet away","Not noticing an actor's shirt change color"],"ans":2,"exp":"The watch is the faintest sound you can detect. The other two \"noticing\" options are about changes (difference threshold).","why":["","","",""]},{"id":"q1-16","type":"mcq","topic":"Perception","stem":"The difference threshold (just noticeable difference) is best described as:","options":["The weakest stimulus a person ctly into her twin's mind. This claim is called:","options":["Telepathy","Clairvoyance","Precognition","Selective attention"],"ans":0,"exp":"Telepathy = mind-to-mind communication.","why":["","","",""]},{"id":"q1-22","type":"mcq","topic":"Perception","stem":"A man claims he dreamed about a car crash the night before it happened. This claim is called:","options":["Telepathy","Clairvoyance","The pop-out phenomenon","Precognition"],"ans":3,"exp":"Precognition = perceiving future events.","why":["","","",""]},{"id":"q1-23","type":"mcq","topic":"Perception","stem":"Which statement about extrasensory perception (ESP) is most accurate?","options":["There is no scientific basis for it, and psychic visions given to police are no more accurate than other people's guesses.","Studies show clairvoyance helps police solve most cases.","Telepathy has been proven in laboratory experiments.","Precognition is a type of bottom-up processing."],"ans":0,"exp":"Your slides: no scientific basis, and psychics do no better than guesses.","why":["","","",""]},{"id":"q1-24","type":"mcq","topic":"Perception","stem":"Which of the following best explains why some people believe psychics are accurate?","options":["Psychics make so many predictions that some are bound to be right, and people remember the hits and forget the misses.","Psychics have lower absolute thresholds than other people.","Psychics use top-down processing and other people don't.","Most psychic predictions turn out to be correct."],"ans":0,"exp":"So many predictions → a few hits; people focus on the 1 or 2 correct ones.","why":["","","",""]},{"id":"q1-25","type":"mcq","topic":"Perception","stem":"Which pair is correctly matched?","options":["Clairvoyance — perceiving events you didn't witness","Telepathy — perceiving future events","Precognition — mind-to-mind communication","Pop-out phenomenon — failing to notice a change"],"ans":0,"exp":"Telepathy = mind to mind, precognition = the future, and failing to notice a change is change blindness.","why":["","","",""]}]},{"name":"Mock exam","mode":"exam","exam":"Mock exam","examTips":["Turn the Timer on and answer every question without looking anything up.","Aim for about one minute per question. Flag hard ones and come back."],"tips":["A mix of exam-style questions from every deck in this unit."],"questions":[{"id":"qM1","type":"mcq","topic":"Perception","stem":"Which of the following best describes selective attention?","options":["Noticing every stimulus in the environment equally","Focusing conscious awareness on one particular stimulus and not something else","The weakest stimulus a person can detect","Using past experience to interpret what you sense"],"ans":1,"exp":"Selective attention = focusing on one thing and NOT something else.","why":["","","",""]},{"id":"qM2","type":"mcq","topic":"Perception","stem":"In a class demo, the word GREEN is printed in purple ink, and students must say the ink color. Many answer slowly or say \"green\" by mistake. This demonstrates:","options":["Change blindness","The cocktail party effect","Weber's law","The Stroop effect"],"ans":3,"exp":"The Stroop effect is the delayed reaction when you must say the color of a word instead of the word itself.","why":["","","",""]},{"id":"qM3","type":"mcq","topic":"Perception","stem":"Which of the following is the best example of change blindness?","options":["A driver talking on the phone doesn't see a pedestrian in the crosswalk.","Between shots in a movie, an actor's drink switches from full to empty, and most viewers don't notice.","At a noisy party, you hear your name from across the room.","You can hear a watch ticking 20 feet away."],"ans":1,"exp":"Missing a CHANGE = change blindness. Not seeing the pedestrian at all is inattentional blindness, the trap answer.","why":["","","",""]},{"id":"qM4","type":"mcq","topic":"Perception","stem":"Which of the following is the best example of inattentional blindness?","options":["While focused on texting, Ben walks past a const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const shuf = (a) => {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const ask = (m) => (typeof confirm === "function" ? confirm(m) : true);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

/* Which unit is open: the part of the address after #. No match means the course home page. */
const UNIT = (() => {
  const id = decodeURIComponent(location.hash.slice(1));
  return COURSE.units.find((u) => u.id === id) || null;
})();
const D = UNIT ? UNITDATA[UNIT.id] : null;
addEventListener("hashchange", () => location.reload());

/* Saved progress is namespaced per course and unit, so kits on the same github.io site never overwrite each other. */
const keyOf = (u, part) => "sk:" + COURSE.id + ":" + u.id + ":" + part;
const PREFK = "sk:" + COURSE.id + ":prefs";
COURSE.units.forEach((u) => {
  /* One-time copy from the keys the old single-unit kits used. */
  const legacy = u.legacyKeys || {};
  ["kit", "pt"].forEach((part) => {
    try {
      const k = keyOf(u, part);
      if (legacy[part] && localStorage.getItem(k) === null) {
        const v = localStorage.getItem(legacy[part]);
        if (v !== null) localStorage.setItem(k, v);
      }
    } catch (e) {}
  });
});
const LSK = UNIT ? keyOf(UNIT, "kit") : null;
const PTK = UNIT ? keyOf(UNIT, "pt") : null;
const readJSON = (k) => {
  try {
    const r = localStorage.getItem(k);
    return r ? JSON.parse(r) : null;
  } catch (e) {
    return null;
  }
};
const writeJSON = (k, v) => {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {}
};

/* Theme and text size apply to the whole course, including the unit list. */
const PREF_DEF = { theme: "auto", size: 2 };

  const root = document.documentElement;

/* Course home (list of units) and the frame around an open unit: header, progress meter, tabs, deck chips. */
function hubLink() {
  return COURSE.hub ? '<a class="hublink" href="' + esc(COURSE.hub) + '">' + ICON.back + "Study Hub</a>" : "<span></span>";
}

/* Credit line on every kit page. The engine is MIT-licensed (kit-core/LICENSE): copies must keep this line. */
const CREDIT_URL = "https://dn4563.github.io/Study-Hub-by-David/";
function creditLine() {
  return '<footer class="credit">Study kit engine by <a href="' + CREDIT_URL + '">David Noskow</a></footer>';
}

function unitProgress(u) {
  const data = UNITDATA[u.id],
    saved = readJSON(keyOf(u, "kit")) || {},
    known = saved.known || {};
  const ids = [];
  data.decks.forEach((dk) => {
    if (dk.optional) return;
    dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => ids.push(dk.id + "." + si + "." + ci)));
  });
  let answered = 0,
    total = 0;
  const pt = readJSON(keyOf(u, "pt"));
  data.practice.sections.forEach((s) => {
    const st = pt && pt.secs ? (pt.secs.find((x) => x.name === s.name) || {}).st || {} : {};
    s.questions.forEach((q) => {
      total++;
      const x = st[q.id];
      if (x && (x.checked || x.mark != null || Object.keys(x.pm || {}).length)) answered++;
    });
  });
  return { got: ids.filter((id) => known[id]).length, tot: ids.length, answered: answered, total: total };
}

    '<header class="top"><div class="topbar">' +

    "</p></header>";
  h += '<main><ul class="unitlist">';
  COURSE.units.forEach((u) => {
    const p = unitProgress(u),
      pct = p.tot ? Math.round((100 * p.got) / p.tot) : 0;
    h +=
      '<li><a class="unitrow" href="#' +
      esc(u.id) +
      '"><span class="ulabel">' +
      esc(u.label) +
      '</span><span class="ubody"><span class="utitle">' +
      esc(u.title) +
      "</span>" +

  D.decks.forEach((dk) =>
    dk.sections.forEach((sc, si) => {
      sc.cards.forEach((c) => ALL.push(c));
      const n = sc.cards.length,
        parts = Math.max(1, Math.ceil(n / 5)),
        base = Math.floor(n / parts),
        extra = n % parts;
      let i = 0;
      for (let p = 0; p < parts; p++) {
        const sz = base + (p < extra ? 1 : 0);
        LESSONS.push({
          id: dk.id + "." + si + "." + p,
          deck: dk.id,
          sec: dk.id + "." + si,
          secName: sc.name,
          part: p,
          parts: parts,
          title: sc.name + (parts > 1 ? " (part " + (p + 1) + " of " + parts + ")" : ""),
          cards: sc.cards.slice(i, i + sz),
        });
        i += sz;
      }
    }),
  );
}

/* 30-runner.js */
/* Question builders and the one-at-a-time runner used by Quiz, the final mixed quiz and retries. */
let FC = null,
  TM = null;
const LET = "ABCDE";
function stopTM() {
  clearInterval(TM);
  TM = null;
}
function pickDir() {
  const d = SAVE.settings.dir;
  return d === "both" ? (Math.random() < 0.5 ? "t2d" : "d2t") : d;
}
/* Distractors come from the same section first, then the same deck, then anywhere, preferring similar lengths
   so the right answer never stands out by length. */
function distractors(card, n, field) {
  const target = card[field];
  const fair = (c) => !MIX || field !== "def" || !hasTerm(c.def, card.term);
  const tiers = [
    ALL.filter((c) => c !== card && c.sec === card.sec),
    ALL.filter((c) => c !== card && c.deck === card.deck && c.sec !== card.sec),
    ALL.filter((c) => c.deck !== card.deck),
  ];
  const out = [];
  for (const tier of tiers) {
    const cand = shuf(tier);
    const close = cand.filter((c) => {
      const r = c[field].length / target.length;
      return r >= 0.7 && r <= 1.3;
    });
    const ord = close.concat(cand.filter((c) => close.indexOf(c) < 0));
    for (const c of ord) {
      if (out.length >= n) break;
      if (fair(c) && c[field] !== target && !out.some((o) => o[field] === c[field])) out.push(c);
    }
    if (out.length >= n) break;
  }
  return out;
}
/* Units with "learnMix" on (set per unit in course.json) hide the term inside definitions used as questions
   or choices, and mix in each card's applied questions. Units without it behave exactly as before. */
const MIX = !!(UNIT && UNIT.learnMix);
const STOP = /^(with|from|into|that|this|they|their|than|then|have|each|also|only|some|more|most)$/i;
/* A word counts as the term when it starts with the term word's stem and adds at most a short ending
   (isotope -> isotopes, isotopic). Longer words that merely share letters (mole -> molecules) don't. */
function termStems(term) {
  return (term.match(/[A-Za-z]{4,}/g) || []).filter((w) => !STOP.test(w)).map((w) => w.toLowerCase().slice(0, Math.max(4, w.length >= 8 ? w.length - 2 : w.length - 1)));
}
function maskTerm(text, term) {
  const stems = termStems(term);
  let hidden = 0;
  const out = text.replace(/[A-Za-z]+/g, (w) => {
    const lw = w.toLowerCase();
    if (stems.some((st) => lw.startsWith(st) && lw.length - st.length <= 3)) {
      hidden++;
      return "_____";
    }
    return w;
  });
  return { text: out, ratio: hidden / Math.max(1, (text.match(/[A-Za-z]+/g) || []).length) };
}
/* Mixed units: a definition used as the clue has the term blanked out (and is skipped if that leaves too
   little). Answer choices are never blanked: a term -> definition question is only asked when the card's
   definition doesn't contain its own term, and wrong choices that mention the asked term are left out. */
const hasTerm = (text, term) => maskTerm(text, term).ratio > 0;
const clueOK = (card) => !MIX || maskTerm(card.def, card.term).ratio <= 0.2;
const choicesOK = (card) => !MIX || !hasTerm(card.def, card.term);
const shownDef = (c) => (MIX ? maskTerm(c.def, c.term).text : c.def);
function askQ(card, a) {
  return {
    kind: "ap",
    card: card,
    ask: "Apply it",
    prompt: esc(a.q),
    options: shuf([{ t: a.right, ok: true }].concat(a.wrong.map((w) => ({ t: w[0], ok: false, why: w[1] })))),
    explain: (a.exp ? esc(a.exp) + "<br>" : "") + "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function mcQ(card, dir, nopt) {
  dir = dir || pickDir();
  const okDir = (d) => (d === "d2t" ? clueOK(card) : choicesOK(card));
  if (!okDir(dir)) dir = dir === "d2t" ? "t2d" : "d2t";
  /* No fair definition question for this card: ask its applied question instead. */
  if (!okDir(dir) && card.asks && card.asks.length) return askQ(card, card.asks[Math.floor(Math.random() * card.asks.length)]);
  nopt = nopt || 4;
  const field = dir === "t2d" ? "def" : "term";
  const opts = shuf(
    [{ t: card[field], ok: true }].concat(
      distractors(card, nopt - 1, field).map((c) => ({
        t: c[field],
        ok: false,
        why:
          dir === "t2d"
            ? 'That description belongs to "' + c.term + '", not to "' + card.term + '".'
            : '"' + c.term + '" means: ' + c.def + ' That is a different idea from the description in the question, which fits "' + card.term + '".',
      })),
    ),
  );
  return {
    kind: "mc",
    card: card,
    dir: dir,
    ask: dir === "t2d" ? "Which description best matches this term?" : "Which term matches this description?",
    prompt: dir === "t2d" ? "<b>" + esc(card.term) + "</b>" : esc(shownDef(card)),
    options: opts,
    explain: "<b>" + esc(card.term) + "</b>: " + esc(card.def) + hookLine(card),
  };
}
function tfQ(card) {
  let isTrue = Math.random() < 0.5,
    other = null;
  if (!isTrue) {
    const pool = ALL.filter((c) => c !== card && c.sec === card.sec);
    const pool2 = pool.length ? pool : ALL.filter((c) => c !== card && c.deck === card.deck);
    if (pool2.length) other = shuf(pool2)[0];
    else isTrue = true;
  }
  return {
    kind: "tf",
    card: card,
    ask: "True or false: this definition matches the term.",
    prompt: "<b>" + esc(card.term) + "</b><br>" + esc(isTrue ? card.def : other.def),
    options: [
      { t: "True", ok: isTrue },
      { t: "False", ok: !isTrue },
    ],
    explain: (isTrue ? "True. " : "False. That definition belongs to <b>" + esc(other.term) + "</b>. ") + "<b>" + esc(card.term) + "</b>: " + esc(card.def),
  };
}
function scQ(s, ask) {
  return {
    kind: "sc",
    deck: s.deck,
    ask: ask || "Apply it",
    prompt: esc(s.q),
    options: shuf(s.opts.map((t, i) => ({ t: t, ok: i === s.ans, why: i === s.ans ? "" : (s.why && s.why[i]) || "" }))),
    explain: esc(s.exp),
  };
}
const hookLine = (c) => (SAVE.settings.hooks && c.hook ? '<span class="hook"><b>Hook</b> ' + esc(c.hook) + "</span>" : "");
const fresh = (q) => (q.kind === "mc" ? mcQ(q.card, q.dir, q.options.length) : q.kind === "tf" ? tfQ(q.card) : Object.assign({}, q, { elim: [] }));
/* A missed term comes back re-rolled: 35% chance it flips direction, always with reshuffled options. */
const reroll = (q) => mcQ(q.card, Math.random() < 0.35 ? (q.dir === "t2d" ? "d2t" : "t2d") : q.dir || pickDir(), Math.max(3, q.options.length));

function startRun(cfg) {
  stopTM();
  UI.run = Object.assign({ i: 0, picked: null, sel: null, res: [], left: 0, done: false, fin: false }, cfg);
  armTM();

}
/* Per-question timer: running out counts as a miss. */
function armTM() {
  stopTM();
  const R = UI.run;
  if (!R || R.done || !R.timer) return;
  R.left = R.timer;
  TM = setInterval(() => {
    R.left--;
    const e = document.getElementById("rt");
    if (e) e.textContent = R.left + " s";
    if (R.left <= 0) {
      stopTM();
      if (R.picked === null) rpickAct(-1);
    }
  }, 1000);
}
function runHTML() {
  const R = UI.run;
  if (R.done) return resultHTML();
  const q = R.qs[R.i],
    n = R.qs.length,
    answered = R.picked !== null,
    confirmOn = SAVE.settings.confirm;
  let h =
    '<section class="panel"><div class="rtop"><h2>' +
    esc(R.title) +
    '</h2><span class="muted">Question ' +
    (R.i + 1) +
    " of " +
    n +
    "</span>" +
    (R.timer ? '<span class="timer">' + ICON.clock + '<span id="rt">' + R.left + " s</span></span>" : "") +
    '<button class="lnk" data-act="rquit">Quit</button></div>' +
    lockToggle();
  h += '<p class="qask">' + esc(q.ask) + '</p><div class="qprompt">' + q.prompt + '</div><div class="opts">';
  q.elim = q.elim || [];
  q.options.forEach((o, k) => {
    let c = "opt";
    if (answered && R.immediate) {
      if (o.ok) c += " right";
      else if (k === R.picked) c += " wrong";
    }
    if (!answered && confirmOn && R.sel === k) c += " sel";
    h += optRow(c, "rpick", k, LET[k], esc(o.t), "relim", q.elim.indexOf(k) >= 0, answered);
  });
  h += "</div>";
  if (!answered && confirmOn) h += lockHTML("rconfirm", R.sel);
  if (answered && R.immediate) {
    const ok = R.picked >= 0 && q.options[R.picked].ok;
    h +=
      '<div class="fb ' +
      (ok ? "ok" : "bad") +
      '"><b>' +
      (R.picked < 0 ? "Time's up." : ok ? "Correct." : "Not quite.") +
      "</b> " +
      q.explain +
      "</div>" +
      (q.kind === "tf" ? "" : whyHTML(q.options, R.picked, "")) +
      '<div class="qnav"><button class="btn" data-act="rnext">' +
      (R.i + 1 < n ? "Next" : "See results") +
      "</button></div>";
  }
  return h + '</section><p class="kbd">Keys: A to E or 1 to 5 picks a choice. Enter locks it in, then goes to the next question.</p>';
}
function resultHTML() {
  const R = UI.run,
    first = R.res.filter((r) => !r.q.tries),
    ok = first.filter((r) => r.ok).length,
    miss = first.filter((r) => !r.ok);
  let h =
    '<section class="panel"><h2>' +
    esc(R.title) +
    ': results</h2><p class="big">' +
    ok +
    " of " +
    first.length +
    " right on the first try (" +
    (first.length ? Math.round((ok / first.length) * 100) : 0) +
    "%)</p>";
  if (R.breakdown) h += breakdownHTML(R);
  if (miss.length) {
    h += "<h3>Review these</h3>";
    miss.forEach((r) => {
      const c = r.q.options.find((o) => o.ok);
      h += '<div class="rev"><div class="qprompt">' + r.q.prompt + "</div><p><b>Answer:</b> " + esc(c.t) + '</p><p class="muted">' + r.q.explain + "</p></div>";
    });
  }
  h +=
    '<div class="qnav">' +
    (miss.length && !R.noRetry ? '<button class="btn" data-act="rretry">Retry the ' + plural(miss.length, "missed question") + "</button>" : "") +
    (R.again ? '<button class="btn sec" data-act="qagain">Same settings, new quiz</button>' : "") +
    '<button class="btn sec" data-act="rdone">Back</button></div></section>';

}
function rpickAct(k) {
  const R = UI.run;
  if (!R || R.picked !== null || R.done) return;
  stopTM();
  const q = R.qs[R.i],
    ok = k >= 0 && !!q.options[k].ok;
  R.picked = k;
  R.res.push({ q: q, ok: ok });
  if (q.card) {

  const li = LI(),
    lesson = LESSONS[li];
  const doneC = [];
  LESSONS.forEach((l, i) => {
    if (i !== li && SAVE.done[l.id]) l.cards.forEach((c) => doneC.push(c));
  });
  /* Mixed units: a term used as a review in either of the last 2 lessons sits out this one. */
  const cool = MIX ? [].concat(...(SAVE.revHist || []).slice(-2)) : [];
  const pool = cool.length && doneC.filter((c) => cool.indexOf(c.id) < 0).length >= 3 ? doneC.filter((c) => cool.indexOf(c.id) < 0) : doneC;
  const weak = shuf(pool.filter((c) => SAVE.trouble[c.id] > 0)),
    other = shuf(pool.filter((c) => !(SAVE.trouble[c.id] > 0)));
  const reviews = weak
    .concat(other)
    .slice(0, Math.min(3, doneC.length))
    .map((c) => ({ type: "card", id: c.id, review: true }));
  if (MIX) {
    SAVE.revHist = (SAVE.revHist || []).concat([reviews.map((r) => r.id)]).slice(-2);
    save();
  }
  let q = shuf(lesson.cards).map((c) => (MIX ? { type: "card", id: c.id, form: "mc" } : { type: "card", id: c.id }));
  reviews.forEach((r) => q.splice(1 + Math.floor(Math.random() * q.length), 0, r));
  /* Mixed units, round 2: about 3 of every 4 lesson terms that have an applied question come back as one. */
  if (MIX) {
    const withAsk = shuf(lesson.cards.filter((c) => c.asks && c.asks.length));
    const n = Math.round(withAsk.length * AP_SHARE);
    q = q.concat(shuf(withAsk.slice(0, n)).map((c) => ({ type: "card", id: c.id, form: "ap", r2: true })));
  }
  if (isLastOfDeck(lesson)) {
    const idx = [];
    D.sq.forEach((s, i) => s.deck === lesson.deck && idx.push(i));
    q = q.concat(
      shuf(idx)
        .slice(0, 6)
        .map((i) => ({ type: "sc", idx: i })),
    );
  }
  let nRecall = 0;
  if (recallOn() && !isFirstOfDeck(lesson) && earlierUnits().length && Math.random() < RECALL_RATE) {
    const pick = pickRecall();
    if (pick) {
      const nCards = q.filter((it) => it.type !== "sc").length;
      q.splice(1 + Math.floor(Math.random() * Math.max(1, nCards - 1)), 0, { type: "recall", unit: pick.u, id: pick.id });
      nRecall = 1;
    }
  }
  UI.L = { phase: "quiz", queue: q, cur: null, picked: null, first: 0, firstTotal: q.length - nRecall, missed: new Set(), scenMiss: [], scenMissIdx: [], recallMiss: [], tried: new Set() };
  nextLearnQ();
};
function learnPick(k) {
  const L = UI.L;
  if (!L || L.phase !== "quiz" || L.picked !== null || UI.run) return;
  L.picked = k;
  if (L.cur.recall) {
    const ok = !!L.cur.options[k].ok;
    recallResult(L.cur.recall, ok);
    if (!ok) (L.recallMiss = L.recallMiss || []).push(L.cur);
    return render();
  }
  const q = L.cur,
    ok = !!q.options[k].ok,
    key = L.item.type === "sc" ? "s" + L.item.idx : L.item.r2 ? L.item.id + "#ap" : L.item.id,
    firstTime = !L.tried.has(key);
  L.tried.add(key);
  if (ok && firstTime) L.first++;
  if (q.card) {
    const id = q.card.id;
    if (ok) {
      if (!L.missed.has(id)) {
        setKnown(id, true);
        if (SAVE.trouble[id]) SAVE.trouble[id] = Math.max(0, SAVE.trouble[id] - 1);
        save();
      }
    } else {
      L.missed.add(id);
      SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
      setKnown(id, false);
      /* Mixed units bring the term back 2 or 3 questions later, in a different form; others keep the fixed 2. */
      const gap = MIX ? 2 + Math.floor(Math.random() * 2) : 2;
      L.queue.splice(Math.min(L.queue.length, gap), 0, Object.assign({}, L.item, MIX ? { avoid: q.kind === "ap" ? "ap" : "mc" } : {}));
    }
  } else if (!ok) {
    L.scenMiss.push(q);
    L.scenMissIdx.push(L.item.idx);
  }
  render();
}
ACT.lopt = (t) => {
  const L = UI.L,
    k = Number(t.dataset.k);
  if (!L || L.phase !== "quiz" || L.picked !== null) return;
  if (SAVE.settings.confirm) {
    L.sel = k;
    render();
  } else learnPick(k);
};
ACT.lconfirm = () => {
  const L = UI.L;
  if (L && L.phase === "quiz" && L.picked === null && L.sel != null) learnPick(L.sel);
};
ACT.lelim = (t) => {

  const k = Number(t.dataset.k);

};
ACT.lnext = () => {

};
ACT.lfinal = () =>

/* A lesson in progress survives a reload. */
function packL() {
  const L = UI.L;
  if (!L) return null;
  if (L.phase === "teach") return { phase: "teach" };
  const o = { phase: L.phase, sr: !!L.sr, first: L.first, firstTotal: L.firstTotal, missed: [...L.missed], tried: [...L.tried], scen: L.scenMissIdx || [] };
  if (L.phase === "quiz") {
    const q = L.queue.slice();
    if (L.item && L.picked === null) q.unshift(L.item);
    o.queue = q;
  }
  return o;
}
function restoreL() {
  const p = SAVE.ui && SAVE.ui.L;
  if (!p || !p.phase) return;
  try {
    if (p.phase === "teach") {
      UI.L = { phase: "teach" };
      return;
    }
    const L = {
      phase: p.phase,
      sr: !!p.sr,
      queue: (p.queue || []).filter((it) =>
        it.type === "sc" ? D.sq[it.idx] : it.type === "recall" ? COURSE.units.some((u) => u.id === it.unit && UNITDATA[u.id]) : BYID[it.id],
      ),
      cur: null,
      picked: null,
      first: p.first || 0,
      firstTotal: p.firstTotal || 0,
      missed: new Set((p.missed || []).filter((id) => BYID[id])),
      scenMissIdx: (p.scen || []).filter((i) => D.sq[i]),
      tried: new Set(p.tried || []),
    };
    L.scenMiss = L.scenMissIdx.map((i) => learnQ({ type: "sc", idx: i }));
    UI.L = L;
    if (L.phase === "quiz") {
      if (!L.queue.length) UI.L = { phase: "teach" };
      else {
        L.item = L.queue.shift();
        L.cur = learnQ(L.item);
      }
    }
  } catch (e) {
    UI.L = { phase: "teach" };
  }
}

/* Flashcards, modeled on Quizlet's flashcard mode.
   Pool: not known yet / all / trouble terms / starred. Order: shuffled or section order. Side first: term or definition
   (the Swap sides button flips it in one tap).
   Two modes:
   - Sort: Not yet / Got it. "Not yet" returns the card about 4 cards later. Back undoes the last choice,
     including its Got it / trouble change. The round ends with a results screen.
   - Browse: Previous / Next through the pool, no sorting.

  else if (p === "trouble") pool = pool.filter((c) => SAVE.trouble[c.id] > 0);
  else if (p === "starred") pool = pool.filter((c) => SAVE.star[c.id]);
  if (SAVE.settings.fcOrder === "shuffle") pool = shuf(pool);

/* Every sort records enough to undo it exactly. */
function fcPush(id) {
  FC.hist.push({ q: FC.q.slice(), got: FC.got.slice(), learning: FC.learning.slice(), known: !!SAVE.known[id], trouble: SAVE.trouble[id], id: id });
}
ACT.fcflip = () => {
  FC.flip = !FC.flip;
  render();
};
ACT.fcagain = () => {
  FC = null;
  render();
};
ACT.fcgot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  setKnown(id, true);
  if (FC.learning.indexOf(id) < 0 && FC.got.indexOf(id) < 0) FC.got.push(id);
  FC.flip = false;

ACT.fcnot = () => {
  if (fcBrowse() || !FC.q.length) return;
  const id = FC.q[0];
  fcPush(id);
  FC.q.shift();
  delete SAVE.known[id];
  SAVE.trouble[id] = (SAVE.trouble[id] || 0) + 1;
  if (FC.learning.indexOf(id) < 0) FC.learning.push(id);
  FC.q.splice(Math.min(FC.q.length, 4), 0, id);
  FC.flip = false;
  save();
  render();
};
ACT.fcback = () => {
  const h = FC && FC.hist.pop();
  if (!h) return;
  FC.q = h.q;
  FC.got = h.got;
  FC.learning = h.learning;
  if (h.known) SAVE.known[h.id] = true;
  else delete SAVE.known[h.id];
  if (h.trouble === undefined) delete SAVE.trouble[h.id];
  else SAVE.trouble[h.id] = h.trouble;
  FC.flip = false;
  save();
  render();
};
ACT.fclearn = () => {
  const ids = FC.learning.slice();
  fcBuild(ids);
  render();
};
ACT.fcprev = () => {
  if (FC.i > 0) FC.i--;
  FC.flip = false;
  render();
};
ACT.fcnext = () => {
  if (FC.i < FC.list.length - 1) FC.i++;
  FC.flip = false;
  render();
};
ACT.fcswap = () => {
  SAVE.settings.fcFirst = SAVE.settings.fcFirst === "term" ? "def" : "term";
  FC.flip = false;
  save();
  render();
};
ACT.fcshuf = () => {
  if (fcBrowse()) {
    FC.list = shuf(FC.list);
    FC.i = 0;
  } else FC.q = shuf(FC.q);
  FC.flip = false;
  render();

ACT.fcstar = () => {
  const id = fcCur();
  if (!id) return;
  if (SAVE.star[id]) delete SAVE.star[id];

document.addEventListener("keydown", (e) => {
  if (!UNIT || UI.tab !== "flash" || UI.run || !FC) return;
  const tg = e.target && e.target.tagName;
  if (tg === "INPUT" || tg === "TEXTAREA" || tg === "SELECT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const browse = fcBrowse();
  if (!(browse ? FC.list.length : FC.q.length)) {
    if (!browse && e.key === "ArrowLeft") ACT.fcback();

  if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();

  else if (e.key === "ArrowLeft") browse ? ACT.fcprev() : ACT.fcback();
  else if (e.key === "s" || e.key === "S") ACT.fcstar();
  else if (!browse && e.key === "1") ACT.fcnot();
  else if (!browse && e.key === "2") ACT.fcgot();

/* 70-quiz.js */
/* Quiz builder: decks, how many of each type, number of choices, feedback timing, order and an optional
   per-question timer. Results break down by type and topic, with retry-missed and rerun. */
function initQ() {
  if (!UI.q) UI.q = { decks: {}, mc: 10, tf: 5, sc: 6, nopt: 4, fb: "immediate", order: "shuffle", timer: SAVE.settings.timer };
  D.decks.forEach((d) => {
    if (UI.q.decks[d.id] === undefined) UI.q.decks[d.id] = true;
  });
}
function QSET(t) {
  initQ();
  if (t.dataset.qd !== undefined) {
    const d = D.decks.find((x) => String(x.id) === t.dataset.qd);
    if (d) UI.q.decks[d.id] = t.checked;
    clampQ();
    return render();
  }
  if (t.type === "number") {
    UI.q[t.dataset.q] = Math.max(0, Math.floor(Number(t.value) || 0));
    clampQ();
    return render();
  }
  UI.q[t.dataset.q] = t.value;
}
/* Real limits for the chosen decks. Multiple choice and true/false share the decks' terms (a term is asked
   once, one way or the other); applied questions are counted separately. */
function quizCaps() {
  const decks = quizDecks();
  return { terms: ALL.filter((c) => decks.indexOf(c.deck) >= 0).length, applied: appliedCount() };
}
function clampQ() {
  const c = quizCaps(),
    q = UI.q;
  q.mc = Math.min(Math.max(0, Number(q.mc) || 0), c.terms);
  q.tf = Math.min(Math.max(0, Number(q.tf) || 0), c.terms - q.mc);
  q.sc = Math.min(Math.max(0, Number(q.sc) || 0), c.applied);
}
/* Questions from the last quiz go to the back of the line next time, so a rerun starts with new ones. */
let QRECENT = new Set();
/* How many applied questions the chosen decks have: scenarios plus applied (asks.json) questions. */
function appliedPool(decks) {
  const pool = [];
  D.sq.forEach((s, i) => decks.indexOf(s.deck) >= 0 && pool.push({ key: "s" + i, make: () => scQ(s) }));
  ALL.filter((c) => decks.indexOf(c.deck) >= 0).forEach((c) => (c.asks || []).forEach((a, i) => pool.push({ key: "a" + c.id + ":" + i, make: () => askQ(c, a) })));
  return pool;
}
const quizDecks = () => D.decks.map((d) => d.id).filter((id) => !UI.q || UI.q.decks[id] !== false);
function appliedCount() {
  return appliedPool(quizDecks()).length;
}
function quizHTML() {
  if (UI.run) return runHTML();
  initQ();
  const q = UI.q;
  const so = (k, opts) =>

ACT.qstart = () => {
  initQ();
  const q = UI.q,
    decks = D.decks.map((d) => d.id).filter((id) => q.decks[id]);
  if (!decks.length) {
    UI.qmsg = "Pick at least one deck.";
    return render();
  }
  clampQ();
  /* Random order, then (stable sorts) the Settings focus first and last quiz's questions last. */
  const recentLast = (key) => (QRECENT.has(key) ? 1 : 0);
  let pool = shuf(ALL.filter((c) => decks.indexOf(c.deck) >= 0));
  pool.sort((a, b) => recentLast("c" + a.id) - recentLast("c" + b.id));
  const f = SAVE.settings.focus;
  if (f === "trouble") pool.sort((a, b) => (SAVE.trouble[b.id] || 0) - (SAVE.trouble[a.id] || 0));
  else if (f === "unknown") pool.sort((a, b) => (SAVE.known[a.id] ? 1 : 0) - (SAVE.known[b.id] ? 1 : 0));
  let nmc = Number(q.mc) || 0,
    ntf = Number(q.tf) || 0,
    nsc = Number(q.sc) || 0;
  const qt = SAVE.settings.qType;
  if (qt === "terms") nsc = 0;
  if (qt === "scen") nmc = ntf = 0;
  const qs = [],
    np = Number(q.nopt) || 4;
  /* Each term once: the first nmc as multiple choice, the next ntf as true or false. */
  nmc = Math.min(nmc, pool.length);
  ntf = Math.min(ntf, pool.length - nmc);
  const used = new Set();
  for (let i = 0; i < nmc; i++) {
    const mq = mcQ(pool[i], null, np);
    qs.push(mq);
    used.add("c" + pool[i].id);
    /* A card with no fair definition question is asked with its applied question; don't ask that one again below. */
    if (mq.kind === "ap") used.add("a" + pool[i].id + ":" + pool[i].asks.findIndex((a) => esc(a.q) === mq.prompt));
  }
  for (let i = nmc; i < nmc + ntf; i++) {
    qs.push(tfQ(pool[i]));
    used.add("c" + pool[i].id);
  }
  /* Applied pool: the decks' scenario questions plus every applied (asks.json) question, each at most once. */
  const ap = shuf(appliedPool(decks).filter((it) => !used.has(it.key)));
  ap.sort((a, b) => recentLast(a.key) - recentLast(b.key));
  ap.slice(0, nsc).forEach((it) => {
    qs.push(it.make());
    used.add(it.key);
  });
  QRECENT = used;
  if (!qs.length) {
    UI.qmsg = "Nothing to ask with those settings.";
    return render();
  }
  UI.qmsg = "";
  startRun({ title: "Quiz", qs: q.order === "shuffle" ? shuf(qs) : qs, immediate: q.fb === "immediate", timer: Number(q.timer) || 0, retry: false, breakdown: true, again: true });
};

/* 85-backup.js */
/* Whole-course backup on the course home page: one file with every unit's saved progress (and the course's
   theme and text size). Restore reads that file back. In a kit built with content/import-map.json (for example
   the Psych kit, whose content came from Phineas's kit), Restore also reads that other kit's backup file and
   carries over the cards marked known and the missed-term counts. */
let bkMsg = "";
const BK_PREFIX = "sk:" + COURSE.id + ":";
function backupData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(BK_PREFIX) === 0) data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  return { app: "study-kit", course: COURSE.id, saved: new Date().toISOString(), data: data };
}
function restoreData(o) {
  if (!o || o.app !== "study-kit" || typeof o.data !== "object") throw new Error("unreadable");
  if (o.course !== COURSE.id) throw new Error("other course");
  const keys = Object.keys(o.data).filter((k) => k.indexOf(BK_PREFIX) === 0 && typeof o.data[k] === "string");
  if (!keys.length) throw new Error("empty");
  keys.forEach((k) => {
    try {
      localStorage.setItem(k, o.data[k]);
    } catch (e) {}
  });
  return "Restored your progress for " + plural(new Set(keys.map((k) => k.split(":")[2])).size - (o.data[BK_PREFIX + "prefs"] ? 1 : 0), "unit") + ".";
}
/* Every card in a unit, optional decks included, keyed by term. */
function termIds(u) {
  const out = {};
  UNITDATA[u.id].decks.forEach((dk) => dk.sections.forEach((sc, si) => sc.cards.forEach((c, ci) => (out[c.term] = dk.id + "." + si + "." + ci))));
  return out;
}
function importForeign(o) {
  const M = IMPORT_MAP;
  const parse = (k) => {
    try {
      return JSON.parse((o.data || {})[k] || "null") || {};
    } catch (e) {
      return {};
    }
  };
  const known = parse(M.known),
    miss = parse(M.miss);
  const per = {};
  const ids = {};
  const touch = (hisId) => {
    const m = M.cards[hisId];
    if (!m) return null;
    const u = COURSE.units.find((x) => x.id === m[0]);
    if (!u) return null;
    ids[u.id] = ids[u.id] || termIds(u);
    const id = ids[u.id][m[1]];
    if (!id) return null;
    if (!per[u.id]) per[u.id] = { u: u, saved: readJSON(keyOf(u, "kit")) || {}, known: 0, trouble: 0 };
    const p = per[u.id];
    p.saved.known = p.saved.known || {};
    p.saved.trouble = p.saved.trouble || {};
    return { p: p, id: id };
  };
  Object.keys(known).forEach((h) => {
    if (!known[h]) return;
    const t = touch(h);
    if (!t) return;
    if (!t.p.saved.known[t.id]) t.p.known++;
    t.p.saved.known[t.id] = true;
  });
  Object.keys(miss).forEach((h) => {
    const n = Number(miss[h]) || 0;
    if (n <= 0) return;
    const t = touch(h);
    if (!t) return;
    if (!((t.p.saved.trouble[t.id] || 0) > 0)) t.p.trouble++;
    t.p.saved.trouble[t.id] = Math.max(t.p.saved.trouble[t.id] || 0, n);
  });
  const parts = [];
  let nk = 0,
    nt = 0;
  COURSE.units.forEach((u) => {
    const p = per[u.id];
    if (!p) return;
    writeJSON(keyOf(u, "kit"), p.saved);
    nk += p.known;
    nt += p.trouble;
    parts.push(u.label + ": " + p.known + " known, " + p.trouble + " to practice");
  });
  if (!parts.length) throw new Error("nothing");
  return "Brought over " + plural(nk, "known card") + " and " + plural(nt, "missed term") + " from " + M.name + ". " + parts.join(" · ") + ".";
}
function readBackupFile(text) {
  const o = JSON.parse(text);
  if (IMPORT_MAP && o && o.app === IMPORT_MAP.app) return importForeign(o);
  return restoreData(o);
}
const BK_ERR = {
  "other course": "That backup is from a different course. Restore it in that course's study kit.",
  empty: "That backup has no saved progress in it.",
  nothing: "None of the cards in that backup match this kit.",
};
function backupHTML() {
  return (

    (IMPORT_MAP ? " Restore also accepts a backup file from " + esc(IMPORT_MAP.name) + "." : "") +
    '</p><div class="qnav"><button class="btn sec" data-act="bkdown">Download backup</button><button class="btn sec" data-act="bkup">Restore from backup</button></div>' +
    '<input type="file" id="bkfile" accept=".json,application/json" hidden>' +

}
ACT.bkdown = () => {

/* Practice Test and exams. Sections sit behind their own top tabs. One question at a time with a numbered
   palette (gray = not visited, outlined = visited, green = correct, red = incorrect, amber = partly right,
   ring = current, corner mark = flagged). Question types: mcq, tf, label, diagram, frq, saq. */
const PT = { sec: 0, secs: [], timerOn: false, elapsed: 0, iv: null, retest: null, msg: "", intro: {}, res: null };
const TYPE_NAME = { mcq: "Multiple choice", tf: "True or false", label: "Labeling", diagram: "Diagram labeling", frq: "Free response", saq: "Short answer" };
const newSt = () => ({ elim: [], visited: false, checked: false, sel: null, correct: null, flag: false, items: {}, work: "", abox: "", ans: {}, revealed: false, mark: null, pm: {} });
const isWritten = (q) => q.type === "frq" || q.type === "saq";
const itemsOf = (q) => (q.type === "diagram" ? q.pins.map((p, i) => Object.assign({ t: "Pin " + (i + 1) }, p)) : q.items);

function initPT() {
  D.practice.sections.forEach((s) => {
    const sec = { name: s.name, mode: s.mode || "practice", exam: s.exam || s.name, tips: s.tips || [], examTips: s.examTips || [], sources: s.sources || {}, qs: s.questions, byId: {}, cur: 0, st: {}, oo: {} };
    sec.qs.forEach((q) => {
      if (q.type === "tf") {
        q.options = ["True", "False"];
        q.ai = q.ans ? 0 : 1;
      } else if (q.type === "mcq") q.ai = q.ans;
      sec.byId[q.id] = q;
      sec.st[q.id] = newSt();
      if (q.type === "mcq") sec.oo[q.id] = q.options.map((o, i) => i);
    });
    sec.orig = sec.qs.map((q) => q.id);
    sec.order = sec.orig.slice();
    PT.secs.push(sec);
  });
  PTload(readJSON(PTK));
}

/* Points earned on one question, 0 to 1, or null if not answered yet. Multi-part items earn partial credit. */
function frac(q, s) {
  if (isWritten(q)) {
    const ks = q.parts.map((p) => p.k),
      pm = s.pm || {};
    if (ks.every((k) => pm[k] !== undefined)) return ks.filter((k) => pm[k]).length / ks.length;
    return null;
  }
  if (q.type === "label" || q.type === "diagram") {
    const it = itemsOf(q);
    return s.checked ? it.filter((x, i) => s.items[i] === x.ans).length / it.length : null;
  }
  return s.checked ? (s.correct ? 1 : 0) : null;
}
function status(q, s) {
  const f = frac(q, s);

}

  order.forEach((oi, pos) => {

    const ex = s.elim.indexOf(oi) >= 0;
    if (s.checked) {
      if (oi === q.ai) c += " right";
      else if (oi === s.sel) c += " wrong";
    } else if (oi === s.sel && !ex) c += " sel";
    h += q.type === "mcq" ? optRow(c, "ptopt", oi, LET[pos], esc(q.options[oi]), "ptelim", ex, s.checked) : '<div class="optrow"><button class="' + c + '" data-act="ptopt" data-k="' + oi + '"' + (s.checked ? " disabled" : "") + '><span class="ot">' + q.options[oi] + "</span></button></div>";
  });
  h += '</div><div class="qnav">';
  if (!s.checked && SAVE.settings.confirm) h += '<button class="btn" data-act="ptcheck"' + (s.sel === null ? " disabled" : "") + ">Check Answer</button>";
  h += nav + "</div>";
  if (s.checked) {
    h += '<div class="fb ' + (s.correct ? "ok" : "bad") + '"><b>' + (s.correct ? "Correct." : "Incorrect.") + "</b>" + (q.type === "tf" ? " The statement is " + (q.ans ? "true." : "false.") : "") + topic + "</div>";
    if (q.type === "mcq") {
      const od = sec.oo[id].map((oi) => ({ t: q.options[oi], ok: oi === q.ai, why: oi === q.ai ? "" : (q.why && q.why[oi]) || "" }));
      h += whyHTML(od, sec.oo[id].indexOf(s.sel), esc(q.exp));
    } else h += '<div class="why good"><p>' + esc(q.exp) + "</p></div>";
  }
  return h;
}
function labelRowsHTML(q, s) {
  return (
    '<ol class="litems">' +
    itemsOf(q)
      .map((it, i) => {
        const sel = s.items[i],
          right = s.checked && sel === it.ans;
        return (
          '<li class="litem' +
          (q.type === "diagram" ? " pinrow" : "") +
          (s.checked ? (right ? " right" : " wrong") : "") +
          '"><span class="lt"><span class="ln">' +
          (i + 1) +
          "</span>" +
          esc(q.type === "diagram" ? "" : it.t) +
          '</span><span class="lbtns" role="group" aria-label="Label for item ' +
          (i + 1) +
          '">' +
          q.labels
            .map((lb, k) => {
              let c = "lb";
              if (s.checked) {
                if (k === it.ans) c += " right";
                else if (k === sel) c += " wrong";
              } else if (k === sel) c += " sel";
              return '<button class="' + c + '" data-act="ptitem" data-i="' + i + '" data-v="' + k + '"' + (s.checked ? " disabled" : "") + ' aria-pressed="' + (k === sel) + '">' + esc(lb) + "</button>";
            })
            .join("") +
          "</span>" +
          (s.checked ? '<span class="lfb">' + (right ? "<b>Correct.</b> " : "<b>Answer: " + esc(q.labels[it.ans]) + ".</b> ") + esc(it.exp || "") + "</span>" : "") +
          "</li>"
        );
      })
      .join("") +
    "</ol>"
  );
}
function diagramHTML(q, s) {
  return (
    '<figure class="diagram"><div class="dimg"><img src="' +
    srcImg(q.img) +
    '" alt="' +
    esc(q.alt || "Diagram for this question") +
    '">' +
    q.pins
      .map((p, i) => {
        const st = s.checked ? (s.items[i] === p.ans ? " right" : " wrong") : s.items[i] !== undefined ? " set" : "";
        return '<span class="pin' + st + '" style="left:' + p.x + "%;top:" + p.y + '%">' + (i + 1) + "</span>";
      })
      .join("") +
    "</div>" +
    (q.credit ? '<figcaption class="credit">' + esc(q.credit) + "</figcaption>" : "") +
    "</figure>"
  );
}
function writtenHTML(q, s, nav, topic) {
  let h = q.title ? '<h3 class="qhead">' + esc(q.title) + "</h3>" : "";
  if (q.stem) h += '<div class="stem">' + esc(q.stem) + "</div>";
  if (q.lead) h += '<p class="stem">' + esc(q.lead) + "</p>";
  if (q.data && q.data.length) h += '<figure class="src"><figcaption><b>Data</b></figcaption>' + q.data.map((d) => "<p>" + esc(d) + "</p>").join("") + "</figure>";
  if (q.type === "frq") {
    h += '<ol class="fparts" type="a">' + q.parts.map((p) => "<li>" + esc(p.prompt) + "</li>").join("") + "</ol>";
    h += '<label class="part"><span class="pl">Work area <small>Show your steps and reasoning.</small></span><textarea rows="7" data-ans="work">' + esc(s.work) + "</textarea></label>";
    h += '<label class="part"><span class="pl">Answer box <small>Final answers, labeled a, b, c.</small></span><textarea rows="4" data-ans="abox">' + esc(s.abox) + "</textarea></label>";
  } else
    q.parts.forEach((p) => {
      h += '<label class="part"><span class="pl">(' + esc(p.k) + ") " + esc(p.prompt) + '</span><textarea rows="4" data-ans="' + esc(p.k) + '" placeholder="Complete sentences: topic sentence, evidence, analysis.">' + esc(s.ans[p.k] || "") + "</textarea></label>";
    });
  h += '<div class="qnav"><button class="btn" data-act="ptcheck"' + (s.revealed ? " disabled" : "") + ">Check Answer</button>" + nav + "</div>";
  if (!s.revealed) return h;
  h += '<div class="model"><h4>' + (q.type === "saq" ? "Model answers" : "Worked solution") + "</h4>";
  q.parts.forEach((p) => {
    h += '<div class="mpart"><p class="mk-q"><b>(' + esc(p.k) + ")</b> " + esc(p.prompt) + (p.skill ? ' <span class="skill">' + esc(p.skill) + "</span>" : "") + "</p>";
    if (p.tea)
      h +=
        '<dl class="tea"><div><dt>Topic sentence</dt><dd>' +
        esc(p.tea[0]) +
        "</dd></div><div><dt>Evidence</dt><dd>" +
        esc(p.tea[1]) +
        "</dd></div><div><dt>Analysis</dt><dd>" +
        esc(p.tea[2]) +
        "</dd></div></dl>";
    else h += "<p>" + esc(p.model) + "</p>";
    if (p.earns) h += '<p class="earns"><b>Earns the point if:</b> ' + esc(p.earns) + "</p>";
    if (p.weak) h += '<p class="weak"><b>Weak answer:</b> ' + esc(p.weak) + "</p>";
    h +=
      '<div class="selfmark" role="group" aria-label="Self-mark part ' +
      esc(p.k) +
      '"><span>Part (' +
      esc(p.k) +
      ')</span><button class="mk' +
      (s.pm[p.k] === true ? " on right" : "") +
      '" data-act="ptpart" data-p="' +
      esc(p.k) +
      '" data-v="1" aria-pressed="' +
      (s.pm[p.k] === true) +
      '">I got it</button><button class="mk' +
      (s.pm[p.k] === false ? " on wrong" : "") +
      '" data-act="ptpart" data-p="' +
      esc(p.k) +
      '" data-v="0" aria-pressed="' +
      (s.pm[p.k] === false) +
      '">I missed it</button></div></div>';
  });
  const f = frac(q, s);
  h += '<div class="qnav"><button class="mk" data-act="ptmark" data-v="1">All parts right</button><button class="mk" data-act="ptmark" data-v="0">All parts wrong</button></div>';
  if (f !== null) h += '<div class="fb' + (f === 1 ? " ok" : f === 0 ? " bad" : "") + '"><b>' + fmt1(f * q.parts.length) + " of " + q.parts.length + " parts</b> counted." + topic + "</div>";
  return h + "</div>";
}

function ptSectionHTML() {
  const M = ptMode();
  if (!PT.secs[PT.sec] || PT.secs[PT.sec].mode !== M) PT.sec = Math.max(0, PT.secs.findIndex((x) => x.mode === M));
  const v = curView(),
    sec = v.sec,
    ids = v.ids,
    st = v.st,
    hd = v.h;
  if (hd.cur >= ids.length) hd.cur = Math.max(0, ids.length - 1);
  const id = ids[hd.cur],
    q = sec.byId[id],
    s = st[id];
  s.visited = true;
  let h = '<section class="panel pt"><div class="rtop"><h2>' + esc(sec.name) + '</h2><span class="score">' + secScore(sec, ids, st) + "</span></div>";
  if (v.R)
    h +=
      '<div class="banner">Retest round: ' +
      ids.filter((i) => status(sec.byId[i], st[i]) === "ok").length +
      " of " +
      ids.length +
      ' now correct. Right answers here update the main section. <button class="lnk" data-act="ptendretest">Back to the full section</button></div>';
  h += introHTML(sec);
  h +=
    '<div class="pals" role="group" aria-label="Questions">' +
    ids
      .map(
        (x, n) =>
          '<button class="pal ' +
          status(sec.byId[x], st[x]) +
          (st[x].flag ? " flag" : "") +
          '" data-act="ptjump" data-n="' +
          n +
          '"' +
          (n === hd.cur ? ' aria-current="step"' : "") +
          ' aria-label="Question ' +
          (n + 1) +
          (st[x].flag ? ", flagged" : "") +
          '">' +
          (n + 1) +
          "</button>",
      )
      .join("") +
    "</div>";
  h += '<p class="qtitle">Question ' + (hd.cur + 1) + " of " + ids.length + ", " + TYPE_NAME[q.type] + "</p>";
  h += srcHTML(q.src ? sec.sources[q.src] : null);
  const nav =
    '<button class="btn sec" data-act="ptprev"' +
    (hd.cur === 0 ? " disabled" : "") +
    ">Previous</button>" +
    '<button class="btn sec" data-act="ptnext"' +
    (hd.cur >= ids.length - 1 ? " disabled" : "") +
    ">Next</button>" +
    '<button class="btn ghost" data-act="ptflag" aria-pressed="' +
    !!s.flag +
    '">' +
    ICON.flag +
    (s.flag ? "Flagged" : "Flag for review") +
    "</button>";
  const tp = q.topic || q.skill;
  const topic = tp ? ' <span class="skill">' + esc(tp) + "</span>" : "";
  if (q.type === "mcq" || q.type === "tf") h += choiceQHTML(q, s, sec, id, nav, topic);
  else if (q.type === "label" || q.type === "diagram") {
    h += '<div class="stem">' + esc(q.stem) + "</div>";
    if (q.type === "diagram") h += diagramHTML(q, s);
    h += labelRowsHTML(q, s);
    const all = itemsOf(q).every((it, i) => s.items[i] !== undefined);
    h += '<div class="qnav"><button class="btn" data-act="ptcheck"' + (!all || s.checked ? " disabled" : "") + ">Check Answer</button>" + nav + "</div>";
    if (s.checked) {
      const it = itemsOf(q),
        n = it.filter((x, i) => s.items[i] === x.ans).length;
      h += '<div class="fb' + (s.correct ? " ok" : n ? "" : " bad") + '"><b>' + n + " of " + it.length + " correct.</b> You earn " + fmt1(n / it.length) + " of 1 point." + topic + "</div>";
    }
  } else h += writtenHTML(q, s, nav, topic);
  return h + "</section>";
}

function ptControls(M) {
  const sec = PT.secs[PT.sec];
  return (
    '<div class="ptctl"><button class="btn ghost" data-act="pttimer" aria-pressed="' +
    PT.timerOn +
    '">' +

    "</button>" +
    (sec.shuffled ? '<button class="btn ghost" data-act="ptunshuffle">' + ICON.undo + "Original order</button>" : "") +
    '<button class="btn ghost" data-act="ptretest">' +
    ICON.redo +
    'Retest missed questions</button><button class="btn ghost" data-act="ptprint">' +
    ICON.print +

    "</button></div>"
  );
}
function examGroups() {
  const g = [];
  PT.secs.forEach((x) => {
    if (x.mode === "exam" && g.indexOf(x.exam) < 0) g.push(x.exam);
  });
  return g;
}
function ptHTML() {
  const M = ptMode();
  const groups = M === "exam" ? examGroups() : [];
  const showRes = M === "exam" && PT.res != null && groups.indexOf(PT.res) >= 0;
  let h =
    '<div class="subtabs" role="tablist">' +
    PT.secs
      .map((x, i) =>
        x.mode !== M ? "" : '<button class="stab" role="tab" data-act="ptsec" data-i="' + i + '" aria-selected="' + (!showRes && i === PT.sec) + '">' + esc(x.name) + "</button>",
      )
      .join("") +
    groups.map((g) => '<button class="stab res" role="tab" data-act="ptres" data-g="' + esc(g) + '" aria-selected="' + (showRes && PT.res === g) + '">' + esc(g) + " results</button>").join("") +
    "</div>";
  if (showRes) return h + resHTML(PT.res);
  if (!PT.secs.some((x) => x.mode === M)) return h + '<section class="panel"><p class="muted">No sections here yet.</p></section>';

/* ---------- actions ---------- */
function PTinput(t) {
  const c = cur3(),
    k = t.dataset.ans;
  if (k === "work" || k === "abox") c.s[k] = t.value;
  else c.s.ans[k] = t.value;
  PTsave();
}
/* A right answer in a retest round also updates the main section. */
function syncMain() {
  const R = PT.retest;
  if (!R || R.sec !== PT.sec) return;
  const sec = PT.secs[R.sec],
    c = cur3(),
    m = sec.st[c.id],
    r = R.st[c.id];
  if (frac(c.q, r) === 1) {
    Object.assign(m, { checked: r.checked, correct: r.correct, sel: r.sel, revealed: r.revealed, mark: r.mark });
    m.items = Object.assign({}, r.items);
    m.pm = Object.assign({}, r.pm);
  }
}
function checkCur() {
  const c = cur3();
  if (isWritten(c.q)) c.s.revealed = true;
  else if (c.q.type === "label" || c.q.type === "diagram") {
    const it = itemsOf(c.q);
    if (c.s.checked || !it.every((x, i) => c.s.items[i] !== undefined)) return;
    c.s.checked = true;
    c.s.correct = it.every((x, i) => c.s.items[i] === x.ans);
  } else {
    if (c.s.sel === null || c.s.checked) return;
    c.s.checked = true;
    c.s.correct = c.s.sel === c.q.ai;
  }
  syncMain();
  render();
}
ACT.ptsec = (t) => {
  PT.res = null;
  PT.sec = Number(t.dataset.i);
  render();
};
ACT.ptres = (t) => {
  PT.res = t.dataset.g;
  render();
  window.scrollTo(0, 0);
};
ACT.ptintro = () => {
  const n = PT.secs[PT.sec].name;
  PT.intro[n] = !PT.intro[n];
  render();
};
ACT.ptjump = (t) => {
  curView().h.cur = Number(t.dataset.n);
  render();
};
ACT.ptprev = () => {
  const v = curView();
  if (v.h.cur > 0) v.h.cur--;
  render();
};
ACT.ptnext = () => {
  const v = curView();
  if (v.h.cur < v.ids.length - 1) v.h.cur++;
  render();
};
ACT.ptopt = (t) => {
  const c = cur3(),
    o = Number(t.dataset.k);
  if (c.s.checked || c.s.elim.indexOf(o) >= 0) return;
  c.s.sel = o;
  if (!SAVE.settings.confirm) return checkCur();
  render();
};
ACT.ptcheck = checkCur;
ACT.ptelim = (t) => {
  const c = cur3();
  if (c.s.checked) return;
  const o = Number(t.dataset.k);
  toggleElim(c.s.elim, o);
  if (c.s.sel === o) c.s.sel = null;
  render();
};
ACT.ptitem = (t) => {
  const c = cur3();
  if (c.s.checked) return;
  c.s.items[Number(t.dataset.i)] = Number(t.dataset.v);
  render();
};
ACT.ptmark = (t) => {
  const c = cur3(),
    v = t.dataset.v === "1";
  c.s.mark = v;
  c.q.parts.forEach((p) => (c.s.pm[p.k] = v));
  syncMain();
  render();
};
ACT.ptpart = (t) => {
  const c = cur3();
  c.s.pm[t.dataset.p] = t.dataset.v === "1";
  c.s.mark = null;
  syncMain();
  render();
};
ACT.ptflag = () => {
  const c = cur3();
  c.s.flag = !c.s.flag;
  render();
};
ACT.ptshuffle = () => {
  const sec = PT.secs[PT.sec];
  sec.order = shuf(sec.orig);
  sec.cur = 0;
  sec.qs.forEach((q) => q.type === "mcq" && (sec.oo[q.id] = shuf(q.options.map((o, i) => i))));
  sec.shuffled = true;
  PT.retest = null;
  render();
};
ACT.ptunshuffle = () => {
  const sec = PT.secs[PT.sec];
  sec.order = sec.orig.slice();
  sec.cur = 0;
  sec.qs.forEach((q) => q.type === "mcq" && (sec.oo[q.id] = q.options.map((o, i) => i)));
  sec.shuffled = false;
  PT.retest = null;
  render();
};
function freshSec(sec) {
  sec.qs.forEach((q) => (sec.st[q.id] = newSt()));
  sec.cur = 0;
}
ACT.ptresetsec = () => {
  if (!ask("Clear every answer in " + PT.secs[PT.sec].name + "?")) return;
  freshSec(PT.secs[PT.sec]);
  if (PT.retest && PT.retest.sec === PT.sec) PT.retest = null;
  render();
};
ACT.ptresetall = () => {
  const M = ptMode();
  if (!ask(M === "exam" ? "Clear every answer in every exam section?" : "Clear every answer in every practice section?")) return;
  PT.secs.forEach((x) => x.mode === M && freshSec(x));
  PT.retest = null;
  PT.elapsed = 0;
  render();
};
ACT.ptretest = () => {
  const sec = PT.secs[PT.sec],
    ids = sec.order.filter((id) => ["bad", "partial"].indexOf(status(sec.byId[id], sec.st[id])) >= 0);
  if (!ids.length) {
    PT.msg = "No missed questions in this section yet. Check some answers first.";
    return render();
  }
  const st = {};
  ids.forEach((id) => (st[id] = newSt()));
  PT.retest = { sec: PT.sec, ids: ids, st: st, cur: 0 };
  render();
};
ACT.ptendretest = () => {
  PT.retest = null;
  render();
};
function tick() {
  PT.elapsed++;
  const e = document.getElementById("pttime");
  if (e) e.textContent = fmtT(PT.elapsed);
  if (PT.elapsed % 5 === 0) PTsave();
}
ACT.pttimer = () => {
  PT.timerOn = !PT.timerOn;
  clearInterval(PT.iv);
  if (PT.timerOn) PT.iv = setInterval(tick, 1000);
  render();
};

/* ---------- printable view ---------- */
ACT.ptprint = () => {
  const sec = PT.secs[PT.sec],
    seen = {};
  let b = "";
  sec.order.forEach((id, n) => {
    const q = sec.byId[id];
    if (q.src && !seen[q.src]) {
      seen[q.src] = 1;
      b += srcHTML(sec.sources[q.src]);
    }
    b += '<div class="q"><b>' + (n + 1) + ".</b> ";
    if (q.type === "mcq") b += esc(q.stem) + sec.oo[id].map((oi, pos) => "<div>" + LET[pos] + ". " + esc(q.options[oi]) + "</div>").join("");
    else if (q.type === "tf") b += "True or false: " + esc(q.stem);
    else if (q.type === "label" || q.type === "diagram")
      b +=
        esc(q.stem) +
        " (" +
        q.labels.map(esc).join(" / ") +
        ")" +
        (q.type === "diagram" ? '<div><img style="max-width:100%" src="' + srcImg(q.img) + '"></div><p>' + esc(q.credit || "") + "</p>" : "") +
        itemsOf(q)
          .map((it, i) => "<div>" + (i + 1) + ". " + esc(q.type === "diagram" ? "Pin " + (i + 1) : it.t) + " ______________</div>")
          .join("");
    else
      b +=
        esc(q.title || q.lead || "") +
        " " +
        esc(q.stem || "") +
        (q.data && q.data.length ? '<div class="src">' + q.data.map(esc).join("<br>") + "</div>" : "") +
        q.parts.map((p) => "<p>(" + esc(p.k) + ") " + esc(p.prompt) + '</p><div class="ln"></div><div class="ln"></div><div class="ln"></div>').join("");
    b += "</div>";
  });
  const w = window.open("", "_blank");
  if (!w) {
    PT.msg = "Your browser blocked the print window. Allow pop-ups for this page and try again.";
    return render();
  }
  w.document.write(
    "<!doctype html><html><head><meta charset=utf-8><title>" +
      esc(sec.name) +
      "</title><style>body{font:15px/1.5 Georgia,serif;margin:28px;max-width:46rem}.src{border:1px solid #888;padding:10px;margin:14px 0}figcaption span{display:block;font-size:13px;color:#444}.q{margin:16px 0;break-inside:avoid}.ln{border-bottom:1px solid #999;height:26px}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #888;padding:4px 8px}</style></head><body><h2>" +
      esc(COURSE.name + ", " + UNIT.label + ": " + sec.name) +
      "</h2>" +
      b +
      "</body></html>",
  );
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
};

/* ---------- saving ---------- */
function PTpack() {
  return {
    sec: PT.sec,
    timerOn: PT.timerOn,
    elapsed: PT.elapsed,
    intro: PT.intro,
    secs: PT.secs.map((s) => ({ name: s.name, order: s.order, cur: s.cur, st: s.st, oo: s.oo, shuffled: !!s.shuffled })),
    retest: PT.retest ? { sec: PT.retest.sec, ids: PT.retest.ids, st: PT.retest.st, cur: PT.retest.cur } : null,
  };
}
function PTsave() {
  if (PTK) writeJSON(PTK, PTpack());
}
function PTload(o) {
  try {
    if (!o || !o.secs) return;
    o.secs.forEach((x) => {
      const s = PT.secs.find((y) => y.name === x.name);
      if (!s) return;
      if (Array.isArray(x.order) && x.order.length === s.orig.length && x.order.every((id) => s.byId[id])) s.order = x.order;
      if (typeof x.cur === "number") s.cur = Math.min(Math.max(0, x.cur), s.order.length - 1);
      s.shuffled = x.shuffled === undefined ? !!o.shuffled : !!x.shuffled;
      s.qs.forEach((q) => {
        const st = x.st && x.st[q.id];
        if (st && typeof st === "object") {
          const n = Object.assign(newSt(), st, { items: Object.assign({}, st.items || {}), pm: Object.assign({}, st.pm || {}), ans: Object.assign({}, st.ans || {}), elim: (st.elim || []).slice() });
          /* Old World SAQ saves kept per-part marks in "parts". */
          if (st.parts && q.type === "saq") Object.keys(st.parts).forEach((k) => st.parts[k] !== null && (n.pm[k] = st.parts[k]));
          if (st.ans && typeof st.ans === "object" && q.type === "saq") n.ans = Object.assign({}, st.ans);
          s.st[q.id] = n;
        }
        const oo = x.oo && x.oo[q.id];
        if (q.type === "mcq" && Array.isArray(oo) && oo.length === q.options.length) s.oo[q.id] = oo;
      });
    });
    if (typeof o.sec === "number" && PT.secs[o.sec]) PT.sec = o.sec;
    PT.intro = o.intro || {};
    PT.elapsed = Number(o.elapsed) || 0;
    PT.retest = null;
    if (o.retest && PT.secs[o.retest.sec] && Array.isArray(o.retest.ids)) {
      const rs = PT.secs[o.retest.sec];
      if (o.retest.ids.every((id) => rs.byId[id])) {
        PT.retest = { sec: o.retest.sec, ids: o.retest.ids, st: {}, cur: o.retest.cur || 0 };
        o.retest.ids.forEach((id) => (PT.retest.st[id] = Object.assign(newSt(), (o.retest.st || {})[id] || {})));
      }
    }
    if (o.timerOn && !PT.timerOn) {
      PT.timerOn = true;
      PT.iv = setInterval(tick, 1000);
    }
  } catch (e) {}
}
function PTreset() {
  PT.secs.forEach((s) => {
    s.qs.forEach((q) => {
      s.st[q.id] = newSt();
      if (q.type === "mcq") s.oo[q.id] = q.options.map((o, i) => i);
    });
    s.order = s.orig.slice();
    s.cur = 0;
    s.shuffled = false;
  });
  PT.retest = null;
  PT.elapsed = 0;
  PT.sec = 0;
  PTsave();
}

/* 95-results.js */
/* Per-exam results page (score with partial credit, by type, what to study next, question by question) and
   the Progress tab (every practice topic ranked weakest first). */
const topicOf = (q) => q.topic || q.skill || "Other";
function reviewDeck(topic) {
  const d = D.topicDeck && D.topicDeck[topic];
  return d === undefined ? null : D.allDecks.find((x) => x.id === d) || null;
}
const barHTML = (p) => '<span class="bar ' + (p < 60 ? "low" : p < 85 ? "mid" : "high") + '" aria-hidden="true"><i style="width:' + p + '%"></i></span>';
const jumpBtn = (si, q, label) => '<button class="lnk" data-act="progjump" data-s="' + si + '" data-id="' + esc(q.id) + '">' + esc(label) + "</button>";

function resDetail(q, s) {
  if (q.type === "mcq" || q.type === "tf")
    return "<p><b>Your answer:</b> " + (s.sel == null ? "none" : esc(q.options[s.sel])) + "</p><p><b>Correct answer:</b> " + esc(q.options[q.ai]) + '</p><p class="muted">' + esc(q.exp) + "</p>";
  if (q.type === "label" || q.type === "diagram")
    return (
      "<ul>" +
      itemsOf(q)
        .map((it, i) => {
          const sel = s.items[i],
            ok = sel === it.ans;
          return (
            "<li>" +
            esc(q.type === "diagram" ? "Pin " + (i + 1) : it.t) +
            ": " +
            (ok ? "<b>" + esc(q.labels[it.ans]) + "</b>, correct" : "you said " + (sel === undefined ? "nothing" : esc(q.labels[sel])) + ", correct is <b>" + esc(q.labels[it.ans]) + '</b>. <span class="muted">' + esc(it.exp || "") + "</span>") +
            "</li>"
          );
        })
        .join("") +
      "</ul>"
    );
  return (
    '<ol class="fparts" type="a">' +
    q.parts
      .map((p) => "<li><p><b>" + (s.pm[p.k] === true ? "Got it. " : s.pm[p.k] === false ? "Missed. " : "") + "</b>" + esc(p.prompt) + "</p><p>" + esc(p.tea ? p.tea.join(" ") : p.model) + "</p></li>")
      .join("") +
    "</ol>"
  );
}

function resHTML(group) {
  const secs = PT.secs.map((sec, si) => ({ sec: sec, si: si })).filter((x) => x.sec.mode === "exam" && x.sec.exam === group);
  let tot = 0,
    ok = 0,
    done = 0;
  const byType = {},
    byTopic = {},
    rows = [];
  secs.forEach((x) =>
    x.sec.orig.forEach((id, n) => {
      const q = x.sec.byId[id],
        s = x.sec.st[id],
        f0 = frac(q, s),
        f = f0 === null ? 0 : f0;
      tot++;
      ok += f;
      if (f0 !== null) done++;
      const T = (byType[TYPE_NAME[q.type]] = byType[TYPE_NAME[q.type]] || { ok: 0, tot: 0, n: 0 });
      T.tot++;
      T.ok += f;
      if (f0 !== null) T.n++;
      const P = (byTopic[topicOf(q)] = byTopic[topicOf(q)] || { ok: 0, tot: 0, bad: 0, none: 0 });
      P.tot++;
      P.ok += f;
      if (f0 === null) P.none++;
      else if (f0 < 1) P.bad++;
      rows.push({ x: x, q: q, s: s, f0: f0, n: n });
    }),
  );
  let h = '<section class="panel"><div class="rtop"><h2>' + esc(group) + " results</h2></div>";
  if (!done) return h + '<p class="muted">Nothing checked yet. Work through this exam, press Check Answer (or self-mark written answers), then come back. Each exam is scored on its own.</p></section>';
  const pct = Math.round((ok / tot) * 100);
  h +=
    '<div class="fb' +
    (pct >= 85 ? " ok" : pct < 60 ? " bad" : "") +
    '"><p class="big">' +
    fmt1(ok) +
    " of " +
    tot +
    " points (" +
    pct +
    "%)</p><p>Partial credit counts." +
    (done < tot ? " " + plural(tot - done, "question") + " not answered or self-marked yet, worth 0 points." : "") +
    " " +
    (pct >= 85 ? "Strong. Review the few misses below." : pct >= 70 ? "Solid, but the topics below still need work." : "Not there yet. Use the study list below, then retake this exam.") +
    "</p></div>";
  h +=
    '<h3>By question type</h3><div class="wk">' +
    Object.keys(byType)
      .map((k) => {
        const t = byType[k],
          p = Math.round((t.ok / t.tot) * 100);
        return '<div class="wkrow"><div class="wkhead"><b>' + esc(k) + "</b><span>" + fmt1(t.ok) + " of " + t.tot + " points" + (t.n < t.tot ? ", " + (t.tot - t.n) + " not answered" : "") + "</span></div>" + barHTML(p) + "</div>";
      })
      .join("") +
    "</div>";
  const need = Object.keys(byTopic)
    .filter((k) => byTopic[k].bad || byTopic[k].none)
    .sort((a, b) => byTopic[a].ok / byTopic[a].tot - byTopic[b].ok / byTopic[b].tot);
  h += "<h3>What to study next</h3>";
  if (!need.length) h += "<p>Nothing missed. Try the Practice Test sections for more.</p>";
  else
    h +=
      '<div class="wk">' +
      need
        .map((k) => {
          const t = byTopic[k],
            p = Math.round((t.ok / t.tot) * 100),
            dk = reviewDeck(k);
          const miss = rows.filter((r) => topicOf(r.q) === k && r.f0 !== 1);
          return (
            '<div class="wkrow"><div class="wkhead"><b>' +
            esc(k) +
            "</b><span>" +
            fmt1(t.ok) +
            " of " +
            t.tot +
            " points" +
            (t.none ? ", " + t.none + " not answered" : "") +
            "</span></div>" +
            barHTML(p) +
            '<p class="wkmiss">Go back to: ' +
            miss.map((r) => jumpBtn(r.x.si, r.q, r.x.sec.name + ", question " + (r.n + 1))).join(", ") +
            "</p>" +
            (dk ? '<p class="wkrev">Then review <b>' + esc(dk.name) + "</b> in the Study guide.</p>" : "") +
            "</div>"
          );
        })
        .join("") +
      "</div>";
  h += "<h3>Question by question</h3>";
  rows.forEach((r) => {
    const st = r.f0 === null ? "none" : r.f0 === 1 ? "ok" : r.f0 > 0 ? "partial" : "bad";
    const parts = isWritten(r.q) ? r.q.parts.length : r.q.type === "label" || r.q.type === "diagram" ? itemsOf(r.q).length : 1;
    const lbl = { ok: "Correct", bad: "Missed", none: "Not answered", partial: "Partly right, " + fmt1(r.f0 * parts) + " of " + parts }[st];
    const stem = r.q.title || r.q.stem || r.q.lead || "";
    h +=
      '<details class="resq ' +
      st +
      '"' +
      (st === "ok" ? "" : " open") +
      '><summary><span class="pal ' +
      st +
      '" aria-hidden="true">' +
      (r.n + 1) +
      "</span><span><b>" +
      lbl +
      "</b> " +
      esc(r.x.sec.name) +
      ", " +
      esc(TYPE_NAME[r.q.type]) +
      ' <span class="skill">' +
      esc(topicOf(r.q)) +
      "</span><br>" +
      esc(stem.length > 160 ? stem.slice(0, 160) + "..." : stem) +
      "</span></summary>" +
      (st === "ok"
        ? ""
        : '<div class="resd">' +
          (r.f0 !== null || isWritten(r.q) ? resDetail(r.q, r.s) : '<p class="muted">You did not check this question.</p>') +
          "<p>" +
          jumpBtn(r.x.si, r.q, "Go to this question") +
          "</p></div>") +
      "</details>";
  });
  return h + "</section>";
}

function progHTML() {
  const T = {};
  PT.secs.forEach((sec, si) =>
    sec.qs.forEach((q) => {
      const o = (T[topicOf(q)] = T[topicOf(q)] || { ok: 0, n: 0, miss: [], total: 0 });
      o.total++;
      const f = frac(q, sec.st[q.id]);
      if (f !== null) {
        o.n++;
        o.ok += f;
        if (f < 1) o.miss.push({ si: si, q: q });
      }
    }),
  );
  const rows = Object.keys(T)
    .map((n) => ({ n: n, o: T[n], pct: T[n].n ? T[n].ok / T[n].n : null }))
    .sort((a, b) => (a.pct === null) - (b.pct === null) || (a.pct || 0) - (b.pct || 0));
  let h = '<section class="panel"><h2>Weak topics</h2>';
  h += rows.some((r) => r.o.n)
    ? '<p class="muted">Every question you have checked or self-marked, ranked weakest first. Under 3 answers counts as an early number.</p>'
    : '<p class="muted">Answer some practice or exam questions and your topics show up here, weakest first.</p>';
  h += '<div class="wk">';
  rows.forEach((r) => {
    const p = r.pct === null ? 0 : Math.round(r.pct * 100),
      dk = reviewDeck(r.n);
    h +=
      '<div class="wkrow"><div class="wkhead"><b>' +
      esc(r.n) +
      "</b><span>" +
      (r.pct === null ? "Not started" : fmt1(r.o.ok) + " of " + r.o.n + " points (" + p + "%)" + (r.o.n < 3 ? ", early" : "")) +
      ", " +
      plural(r.o.total, "question") +
      " in the kit</span></div>" +
      barHTML(p);
    if (r.o.miss.length) h += '<p class="wkmiss">Missed: ' + r.o.miss.map((m) => jumpBtn(m.si, m.q, PT.secs[m.si].name + ", question " + (PT.secs[m.si].orig.indexOf(m.q.id) + 1))).join(", ") + "</p>";
    if (dk && (r.pct === null || r.pct < 0.85)) h += '<p class="wkrev">Review <b>' + esc(dk.name) + "</b> in the Study guide.</p>";
    h += "</div>";
  });
  h += "</div>";
  const tr = Object.keys(SAVE.trouble).filter((k) => SAVE.trouble[k] && !SAVE.known[k] && BYID[k]).length;
  if (tr) h += '<p class="muted">You also have ' + plural(tr, "trouble term") + " in the Flashcards pool.</p>";
  return h + "</section>";
}
ACT.progjump = (t) => {
  const si = Number(t.dataset.s),
    sec = PT.secs[si];
  UI.tab = sec.mode === "exam" ? "exam" : "pt";
  PT.res = null;
  PT.sec = si;
  PT.retest = null;
  const i = sec.order.indexOf(t.dataset.id);
  if (i >= 0) sec.cur = i;
  render();
  window.scrollTo(0, 0);
};

/* 99-boot.js */
/* Start: the course home page, or the unit named after # in the address. */
if (UNIT) {
  initShell();
  initPT();
  restoreL();
}
render();

</script>
