sure and family dynamics. Which explanation is this?","right":"Sociocultural","wrong":[["Psychodynamic, about hidden childhood conflicts","That focuses on the unconscious."],["Biological","That focuses on genes and chemistry."],["Cognitive","That focuses on individual thoughts."]],"exp":"Social and cultural relationships and dynamics."},{"q":"Which explanation would focus on how a person's family dynamics and culture shape her disorder?","right":"Sociocultural","wrong":[["Biological, focused on genes and brain chemistry","That is about the body."],["Psychodynamic","That is about the unconscious."],["Evolutionary","That is about survival."]],"exp":"Social and cultural relationships and dynamics."}]},{"term":"Humanistic explanation","def":"A lack of social support and being unable to reach our full potential.","hook":"","asks":[{"q":"A counselor says a client's depression comes from lacking support and being unable to reach his potential. Which explanation is this?","right":"Humanistic","wrong":[["Evolutionary, about traits that lower survival","That focuses on survival."],["Behavioral","That focuses on conditioning."],["Biological","That focuses on the body."]],"exp":"Lack of support and unmet potential."},{"q":"A lonely young man feels stuck and unable to grow. Which explanation of his depression fits this description?","right":"Humanistic","wrong":[["Behavioral, learned through conditioning and reinforcement","Not about reinforcement."],["Biological","Not about the body."],["Psychodynamic","Not about the unconscious."]],"exp":"Lack of social support and inability to reach full potential."}]},{"term":"Evolutionary explanation","def":"Behaviors and mental processes that reduce our chance of survival.","hook":"","asks":[{"q":"Which explanation looks at a disorder as behaviors and mental processes that reduce our chance of survival?","right":"Evolutionary","wrong":[["Sociocultural, about social and cultural dynamics","That focuses on culture."],["Cognitive","That focuses on thoughts."],["Humanistic","That focuses on potential."]],"exp":"Evolutionary: processes that reduce survival chances."},{"q":"Which explanation asks how a disorder's behaviors reduce a person's chance of survival?","right":"Evolutionary","wrong":[["Cognitive, which looks at a person's irrational thoughts","That is about thoughts."],["Humanistic","That is about potential."],["Behavioral","That is about learning."]],"exp":"Behaviors and mental processes that reduce our chance of survival."}]}]},{"name":"A warning","cards":[{"term":"Intern syndrome","def":"A condition often reported by medical students, who believe they are experiencing the symptoms of the disease they are studying. Your slide's rule: don't diagnose yourself or others; you are not qualified.","hook":"","asks":[{"q":"After reading about anxiety disorders, Zoe decides she has three of them. What does your slide warn about?","right":"Intern syndrome: don't diagnose yourself","wrong":[["The Barnum effect, which only applies to horoscopes and readings","The slide names intern syndrome for this."],["Hindsight bias","That is \"I knew it all along.\""],["Tend-and-befriend","That is a stress response."]],"exp":"Students often believe they have the conditions they study."},{"q":"What is your slide's rule for avoiding intern syndrome?","right":"Don't diagnose yourself or others","wrong":[["Study only one disorder at a time so you don't get them confused","The rule is about diagnosing."],["Always trust your first guess","Not the rule."],["Diagnose friends to practice","That breaks the rule."]],"exp":"You are not qualified to diagnose yourself or others."}]}]}],"intro":["When something counts as a disorder (the 3 Ds), the DSM-5, how each approach explains disorders, and intern syndrome."]},{"id":3,"name":"Anxiety Disorders","optional":false,"sections":[{"name":"Anxiety disorders","cards":[{"term":"Anxiety disorders","def":"Disorders characterized by persistent, excessive worry and fear that can significantly interfere with daily life. They include generalized anxiety disorder, panic disorder, and phobias.","hook":"","asks":[{"q":"Which group of disorders is defined by persistent, excessive worry and fear that interferes with daily life?","right":"Anxiety disorders","wrong":[["Dissociative disorders, a disconnection from identity","Those involve disconnection, not mainly fear."],["Personality disorders","Those are lasting patterns of behavior."],["Neurodevelopmental disorders","Those begin in early childhood."]],"exp":"GAD, panic disorder, phobias and others."},{"q":"Which three disorders does your slide list among anxiety disorders?","right":"GAD, panic disorder and phobias","wrong":[["OCD, hoarding and PTSD, which all involve intense anxiety","Those are in their own DSM-5 categories."],["Bipolar I and II","Those are mood disorders."],["ADHD and ASD","Those are neurodevelopmental."]],"exp":"Anxiety disorders include GAD, panic disorder and phobias."}]}]},{"name":"Phobias","cards":[{"term":"Specific phobia","def":"Intense or irrational fear or anxiety that is out of proportion to the actual threat and may result in a panic attack. It interferes with activities of daily living.","hook":"","asks":[{"q":"Dana's fear of spiders is so intense she won't enter her own basement, though spiders there are harmless. What does she likely have?","right":"A specific phobia","wrong":[["Generalized anxiety disorder about everyday things","GAD is worry about many things."],["Agoraphobia","That is fear of places where escape is hard."],["Panic disorder","That is about recurring panic attacks."]],"exp":"Intense fear out of proportion to the actual threat."},{"q":"What makes a fear of heights a specific phobia rather than ordinary caution?","right":"It's out of proportion and disrupts daily life","wrong":[["Any fear at all of high places counts as a specific phobia","Ordinary caution isn't a phobia."],["It must involve animals","Phobias can be of many things."],["It must last 2 years","Not the criterion on your slides."]],"exp":"Intense or irrational fear out of proportion to the threat that interferes with daily living."}]},{"term":"Symptoms of specific phobias","def":"Intense fear and anxiety, avoidance of the feared object or situation, panic attacks, and feeling out of control. Physical: sweating, rapid heartbeat, tremors. Behavioral: avoiding the object and places where contact is possible.","hook":"","asks":[{"q":"Which symptom fits a specific phobia?","right":"Avoiding the feared object or situation","wrong":[["Long periods of elevated mood and very little sleep","That is mania."],["Losing memories of personal information","That is dissociative amnesia."],["Hearing voices","That is a positive symptom of schizophrenia."]],"exp":"Intense fear, avoidance, panic attacks, feeling out of control."},{"q":"A woman afraid of dentists skips appointments and won't drive past the office. Which kind of symptom is this?","right":"A behavioral symptom: avoidance","wrong":[["A physical symptom such as sweating, tremors and a racing heart","Avoidance is behavioral."],["A positive symptom","That is schizophrenia."],["A cognitive symptom only","Avoiding places is behavioral."]],"exp":"Behavioral: avoiding the object and places where contact is possible."}]}]},{"name":"Agoraphobia","cards":[{"term":"Agoraphobia","def":"Marked anxiety about using public transportation, being in open spaces, being in enclosed places, being in a crowd, and/or being outside of the home alone.","hook":"Agora = marketplace: fear of being out where escape is hard.","asks":[{"q":"Marcus hasn't left his house in months because he fears crowds and public transportation. What does he likely have?","right":"Agoraphobia","wrong":[["Social anxiety disorder, fear of being judged","His fear is about places and crowds, not judgment."],["Specific phobia of one object","His fears cover many situations."],["GAD","That is worry about everyday things."]],"exp":"Anxiety about crowds, open or enclosed spaces, transport, being out alone."},{"q":"What does the hook \"Agora = marketplace\" help you remember about agoraphobia?","right":"Fear of being out where escape is hard","wrong":[["Fear of shopping only, and of nothing else in the outside world","It covers crowds, transport, open and enclosed places."],["Fear of spiders","That is a specific phobia."],["Fear of being judged","That is social anxiety."]],"exp":"Agora = marketplace: fear of being out where escape is hard."}]},{"term":"Symptoms of agoraphobia","def":"Physical: sweating, tremors, rapid heartbeat. Behavioral: avoiding situations that cause anxiety, staying home, social isolation. Cognitive: intense fear of a panic attack, of being trapped or unable to escape, or of losing control; feeling overwhelmed or helpless; difficulty concentrating or making decisions.","hook":"","asks":[{"q":"Which pattern fits agoraphobia?","right":"Staying home for fear of a panic attack","wrong":[["Extreme mood swings between mania and depression","That is bipolar disorder."],["Fidgeting and blurting out answers","Those are ADHD symptoms."],["Hoarding","That is an OCD-related disorder."]],"exp":"Avoidance, staying home and isolation, with fear of a panic attack."},{"q":"Which is a cognitive symptom of agoraphobia?","right":"Fear of being trapped and unable to escape","wrong":[["Sweating, shaking and a pounding heart in a crowded place","Those are physical."],["Staying home","That is behavioral."],["Social isolation","That is behavioral."]],"exp":"Cognitive: fear of a panic attack, of being trapped, or of losing control."}]}]},{"name":"Panic & social anxiety","cards":[{"term":"Panic disorder","def":"An anxiety disorder where you regularly have sudden attacks of panic or fear. Everyone feels anxiety and panic sometimes, but someone with panic disorder feels anxiety, stress, and panic regularly and at any time, often for no apparent reason.","hook":"","asks":[{"q":"Jen has sudden attacks of terror with a racing heart several times a month and constantly worries about the next one. What does she likely have?","right":"Panic disorder","wrong":[["Generalized anxiety disorder about many everyday things","GAD is constant worry, not sudden attacks."],["Specific phobia","Her attacks aren't tied to one object."],["Bipolar II","That is a mood disorder."]],"exp":"Recurring sudden panic attacks."},{"q":"What separates panic disorder from the panic everyone feels sometimes?","right":"It happens regularly, often for no reason","wrong":[["It only ever happens once, during a single scary event","It's regular."],["It never involves anxiety","It does."],["It only happens at night","Not on your slides."]],"exp":"Panic disorder: regular panic at any time, often for no apparent reason."}]},{"term":"Symptoms of panic disorder","def":"Panic attacks, and anxiety about having panic attacks.","hook":"","asks":[{"q":"Which two symptoms define panic disorder on your slides?","right":"Panic attacks and fear of having more","wrong":[["Hallucinations and disorganized speech or behavior","Those are schizophrenia symptoms."],["Inattention and impulsivity","Those are ADHD."],["Binge eating and purging","That is bulimia."]],"exp":"Panic attacks, plus anxiety about having panic attacks."},{"q":"Marco has had three panic attacks and now spends every day worrying about when the next one will hit. Which part of panic disorder does that worry show?","right":"Anxiety about having more attacks","wrong":[["A specific phobia of one object, like spiders or needles","His fear is of the attacks themselves."],["Social anxiety","His fear isn't about being judged."],["Hoarding","Not related."]],"exp":"Panic disorder includes anxiety about having panic attacks."}]},{"term":"Social anxiety disorder (social phobia)","def":"An intense and persistent fear of social situations where one may be scrutinized or judged by others.","hook":"","asks":[{"q":"Ethan skips class presentations and parties because he's terrified of being judged and humiliated. What does he likely have?","right":"Social anxiety disorder","wrong":[["Agoraphobia, fear of crowds and open spaces","His fear is about being judged."],["Panic disorder","His fear is tied to social judgment."],["Avoidant personality disorder only","His fear is centered on social situations where he's judged."]],"exp":"Intense fear of social situations where one may be judged."},{"q":"Which situation would most likely trigger social anxiety disorder?","right":"Giving a speech to classmates","wrong":[["Riding a crowded bus without knowing where the nearest exit is","That fear of escape fits agoraphobia."],["Seeing a spider","That is a specific phobia."],["Leaving the stove on","That fits OCD."]],"exp":"Fear of social situations where one may be judged."}]},{"term":"Symptoms of social anxiety disorder","def":"Fear or anxiety in social situations where judgment is feared; fear of being embarrassed, humiliated, or rejected; difficulty making eye contact or speaking in public; overanalyzing social interactions; panic attacks before, during, or after social events.","hook":"","asks":[{"q":"Which symptom fits social anxiety disorder?","right":"Trouble making eye contact around others","wrong":[["Believing you have special powers and a mission from God","That is a delusion of grandeur."],["Losing track of time for days","That fits dissociative disorders."],["Washing hands for hours","That fits OCD."]],"exp":"Fear of embarrassment or rejection, trouble with eye contact or speaking."},{"q":"After every party, Leah replays each conversation for hours, sure she embarrassed herself. Which symptom is this?","right":"Overanalyzing social interactions","wrong":[["A compulsion to repeat the same action over and over again","That is OCD."],["A fugue state","That is dissociative."],["A manic episode","That is bipolar."]],"exp":"Overanalyzing social interactions is a symptom of social anxiety disorder."}]}]},{"name":"Generalized anxiety disorder","cards":[{"term":"Generalized anxiety disorder (GAD)","def":"Excessive, persistent, and uncontrollable worry about a wide range of everyday situations. It's nonspecific anxiety and fear. For a diagnosis, it must last at least 6 months and interfere with daily functioning.","hook":"Generalized = worried about everything, not one thing.","asks":[{"q":"For over six months, Priya has worried constantly about grades, money, health and her family, with no single focus. What does she likely have?","right":"Generalized anxiety disorder","wrong":[["Specific phobia of a single feared object","Her worry isn't about one object."],["Panic disorder","She has constant worry, not sudden attacks."],["Agoraphobia","Her worry isn't about places."]],"exp":"Nonspecific, uncontrollable worry for at least 6 months."},{"q":"How long must the worry last for a GAD diagnosis?","right":"At least 6 months","wrong":[["At least two full years without any break from the worrying","Two years is persistent depressive disorder."],["Two weeks","That is MDD."],["One day","Too short."]],"exp":"GAD: at least 6 months and interfering with daily functioning."}]},{"term":"Symptoms of GAD","def":"Excessive anxiety and worry, increased muscle aches or soreness, impaired concentration, fatigue, irritability, restlessness, and difficulty sleeping.","hook":"","asks":[{"q":"Which set of symptoms fits GAD?","right":"Restlessness, fatigue, poor focus, sore muscles","wrong":[["Hallucinations, delusions and disorganized speech or behavior","Those are schizophrenia symptoms."],["Identity switches","That is DID."],["Purging after meals","That is bulimia."]],"exp":"Worry plus muscle aches, poor concentration, fatigue, irritability, restlessness, sleep trouble."},{"q":"Which physical symptom is listed for GAD?","right":"Muscle aches and soreness","wrong":[["Hearing voices that tell the person what they should do","That is a hallucination."],["Weight loss from restricting food","That fits anorexia."],["Tremors only during social events","That fits social anxiety."]],"exp":"GAD: muscle aches, poor concentration, fatigue, irritability, restlessness, sleep trouble."}]}]},{"name":"Causes","cards":[{"term":"Behavioral cause of anxiety disorders","def":"Anxiety disorders can develop through learned behaviors, such as associating certain situations or objects with danger, or through modeling the anxiety responses of others.","hook":"","asks":[{"q":"A girl watches her mother panic at every thunderstorm and develops the same fear. Which cause of anxiety does this show?","right":"Behavioral: modeling and learning","wrong":[["Biological: low levels of GABA and serotonin in the brain","That is a chemical cause."],["Genetic: inheriting the fear","The point here is watching and learning."],["Cognitive only","The key is modeling."]],"exp":"Anxiety can be learned by association or modeling."},{"q":"A boy who was trapped in an elevator now panics in elevators. Which cause of anxiety does this show?","right":"Behavioral: linking a situation with danger","wrong":[["Genetic: a predisposition to anxiety that runs in the family","The cause here is the bad experience."],["Biological","Not about chemicals."],["Cognitive only","The key is the learned association."]],"exp":"Associating situations or objects with danger."}]},{"term":"Cognitive cause of anxiety disorders","def":"Maladaptive thinking and emotional responses.","hook":"","asks":[{"q":"A therapist says a client's anxiety comes from always expecting the worst. Which cause is this?","right":"Cognitive: maladaptive thinking","wrong":[["Biological: hormone or neurotransmitter imbalances","That is a chemical cause."],["Genetic","That is inherited predisposition."],["Behavioral","That is learned association."]],"exp":"Maladaptive thinking and emotional responses."},{"q":"Which thought shows the cognitive cause of anxiety?","right":"\"If I fail this quiz, my life is ruined.\"","wrong":[["\"My parents both have anxiety, so I probably inherited it from them.\"","That points to genetics."],["\"My GABA must be low.\"","That is biological."],["\"I learned to fear dogs after a bite.\"","That is behavioral."]],"exp":"Maladaptive thinking."}]},{"term":"Biological cause of anxiety disorders","def":"Imbalances in neurotransmitters like serotonin and GABA, and hormonal imbalances.","hook":"","asks":[{"q":"A doctor links a patient's anxiety to low GABA and serotonin. Which cause is this?","right":"Biological","wrong":[["Cognitive, from always expecting the worst outcome","That is about thinking patterns."],["Behavioral","That is about learning."],["Sociocultural","That is about culture."]],"exp":"Neurotransmitter and hormonal imbalances."},{"q":"Why might a doctor treat anxiety with a drug that boosts GABA?","right":"Low GABA is a biological cause","wrong":[["Too much GABA causes anxiety, so the drug will remove extra GABA","Imbalances like low GABA are linked to anxiety."],["GABA is a hormone","It's a neurotransmitter."],["GABA causes phobias","Not on your slides."]],"exp":"Imbalances in serotonin and GABA are a biological cause."}]},{"term":"Genetic cause of anxiety disorders","def":"A genetic predisposition.","hook":"","asks":[{"q":"Anxiety disorders run in Ken's family, even among relatives raised apart. Which cause does this suggest?","right":"Genetic predisposition","wrong":[["Behavioral modeling of anxious relatives at home","They were raised apart, so modeling is less likely."],["Cognitive","That is about thinking."],["Catastrophes","That is a stressor type."]],"exp":"A genetic predisposition."},{"q":"Which evidence would best support a genetic cause of anxiety?","right":"Identical twins raised apart both develop it","wrong":[["A child who copies her anxious mother's reactions to storms","That is modeling (behavioral)."],["A person who thinks irrationally","That is cognitive."],["A traumatic event","That is environmental."]],"exp":"A genetic predisposition."}]}]}],"intro":["Specific phobias, agoraphobia, panic disorder, social anxiety disorder, GAD, and their causes."]},{"id":4,"name":"Depressive & Bipolar Disorders","optional":false,"sections":[{"name":"Depressive disorders","cards":[{"term":"Depressive disorders","def":"Characterized by a sad, empty, or irritable mood along with physical and cognitive changes that affect a person's ability to function. Depression is a mental health condition, not just a temporary mood swing.","hook":"","asks":[{"q":"Which group of disorders involves a sad, empty or irritable mood with physical and cognitive changes that hurt functioning?","right":"Depressive disorders","wrong":[["Anxiety disorders, with fear and constant worry","Those center on fear and worry."],["Dissociative disorders","Those involve disconnection."],["Neurodevelopmental disorders","Those begin in childhood."]],"exp":"Depressive disorders."},{"q":"Why do your slides stress that depression is \"not just a temporary mood swing\"?","right":"It's a condition that affects functioning","wrong":[["Because it always goes away by itself within a day or two","It's a mental health condition."],["Because it only affects sleep","It affects many areas."],["Because it's caused by mania","That is bipolar."]],"exp":"A sad, empty or irritable mood with changes that affect functioning."}]},{"term":"Depression quick facts","def":"Depression affects over 18 million U.S. adults (one in ten) in any given year and over 300 million people worldwide. It is the leading cause of disability for ages 15–44 and worldwide. It is the primary reason someone dies by suicide about every 13 minutes (over 41,000 people a year).","hook":"","asks":[{"q":"According to your slides, about how many U.S. adults does depression affect in a given year?","right":"Over 18 million (one in ten)","wrong":[["About 500 people in every major U.S. city each year","The number is far larger."],["One in a million","Far too small."],["Nearly everyone","Far too large."]],"exp":"Over 18 million U.S. adults; the leading cause of disability for ages 15–44."},{"q":"Depression is the leading cause of disability for which age group, according to your slides?","right":"Ages 15–44","wrong":[["Ages 65 and older, after people have retired from work","Your slides say 15–44."],["Ages 5–10","Not on your slides."],["Only newborns","Not on your slides."]],"exp":"Leading cause of disability for ages 15–44 and worldwide."}]},{"term":"Major depressive disorder (MDD)","def":"Symptoms that last 2 weeks or more and are a change from previous functioning.","hook":"MDD = 2 weeks.","asks":[{"q":"For three weeks, Alex has felt hopeless, lost interest in everything and barely sleeps, a big change from before. What might he have?","right":"Major depressive disorder","wrong":[["Persistent depressive disorder, lasting two years","That needs two years or more."],["Bipolar I","He has no manic episodes."],["GAD","That is worry, not low mood."]],"exp":"MDD: symptoms for 2 weeks or more, a change from before."},{"q":"How long must symptoms last for major depressive disorder?","right":"2 weeks or more","wrong":[["Two years or more without a break, most days of the week","That is persistent depressive disorder."],["6 months","That is GAD."],["One day","Too short."]],"exp":"MDD = 2 weeks, a change from previous functioning."}]},{"term":"Symptoms of major depressive disorder","def":"Feeling sad and helpless nearly every day; loss of interest in favorite activities; significant weight loss or gain; changes in sleep (insomnia or hypersomnia); difficulty concentrating or thinking; feelings of worthlessness; fatigue or low energy; thoughts of death or suicide (seeking help is important).","hook":"","asks":[{"q":"Which symptom fits major depressive disorder?","right":"Losing interest in favorite activities","wrong":[["Racing thoughts and a decreased need for sleep each night","Those are manic symptoms."],["Fear of crowds","That is agoraphobia."],["Blurting out answers","That is ADHD."]],"exp":"Sadness, loss of interest, weight and sleep changes and more."},{"q":"Which symptom list fits major depressive disorder?","right":"Worthlessness, fatigue, sleep changes","wrong":[["Racing thoughts, grandiosity and very little need for sleep","Those are manic symptoms."],["Flashbacks and hypervigilance","Those are PTSD."],["Fidgeting and blurting","Those are ADHD."]],"exp":"MDD symptoms include worthlessness, fatigue and changes in sleep."}]},{"term":"Persistent depressive disorder","def":"Symptoms of depression present for most of the day on most days for two years or more. No manic episodes (then it would most likely be bipolar disorder), and not due to drug use.","hook":"Persistent = 2 years.","asks":[{"q":"For over two years, Nora has felt low most of the day on most days, without any manic episodes. What fits best?","right":"Persistent depressive disorder","wrong":[["Major depressive disorder lasting a few weeks at most","MDD needs only 2 weeks; hers has lasted years."],["Bipolar II","She has no hypomanic episodes."],["Panic disorder","That involves panic attacks."]],"exp":"Depression most days for two years or more."},{"q":"A man has felt low most days for three years and has had a manic episode. Why isn't persistent depressive disorder the right label?","right":"A manic episode points to bipolar disorder","wrong":[["Three years is too short to count as persistent depressive disorder","Two years or more qualifies."],["He must also have hallucinations","Not required."],["It must start before age 12","That is ADHD."]],"exp":"Persistent depressive disorder has no manic episodes; with mania it's most likely bipolar."}]},{"term":"Causes of depressive disorders","def":"Genetic: family histories and twin studies show a genetic component. Biological: imbalances in serotonin, dopamine, and norepinephrine; hormonal imbalances; medical conditions like chronic pain. Environmental: high stress from job loss, death of a loved one, financial or relationship problems; childhood trauma, social isolation, poverty.","hook":"","asks":[{"q":"Twin studies show depression often runs in families. Which cause does this support?","right":"A genetic component","wrong":[["Too much dopamine causing hallucinations and delusions","That is linked to schizophrenia."],["Teratogens","Those affect development before birth."],["Gate control","That is about pain."]],"exp":"Genetic, biological and environmental causes."},{"q":"A woman becomes depressed after losing her job and her home. Which category of cause fits best?","right":"Environmental","wrong":[["Genetic, shown through her family history and twin studies","The trigger here is the life event."],["Biological","Not about chemistry."],["Teratogens","Those act before birth."]],"exp":"Environmental: high stress from job loss, financial problems and more."}]}]},{"name":"Bipolar disorders","cards":[{"term":"Bipolar disorders","def":"Characterized by extreme mood swings between periods of mania (elevated mood) and depression (low mood).","hook":"Bi = two poles: high and low.","asks":[{"q":"Sam swings between weeks of extreme energy and weeks of deep sadness. Which group of disorders fits?","right":"Bipolar disorders","wrong":[["Depressive disorders, which have low mood only","Those don't include manic highs."],["Anxiety disorders","Those center on fear."],["Dissociative disorders","Those involve disconnection."]],"exp":"Bi = two poles: mania and depression."},{"q":"What does the hook \"Bi = two poles\" refer to?","right":"Mania and depression","wrong":[["Two separate personalities, each with its own name and memories","That is DID."],["Two hemispheres","Not related."],["Two weeks of symptoms","That is MDD."]],"exp":"Extreme swings between mania and depression."}]},{"term":"Manic episode","def":"Elevated mood, feeling euphoric or overly happy; increased energy and activity; decreased need for sleep; racing thoughts and rapid speech; grandiosity and inflated self-esteem; impulsivity and risk-taking; irritability and aggression.","hook":"","asks":[{"q":"For a week, Jay barely sleeps, talks rapidly, feels invincible and spends his savings on impulse. What is he experiencing?","right":"A manic episode","wrong":[["A depressive episode with fatigue and hopelessness","His mood is elevated, not low."],["A panic attack","That is a sudden burst of fear."],["Dissociative fugue","That is sudden travel with memory loss."]],"exp":"Elevated mood, energy, little sleep, grandiosity, impulsivity."},{"q":"Which detail points to a manic episode rather than just a very good week?","right":"Barely sleeping and risky spending","wrong":[["Feeling content after getting a good grade on a big test","Normal happiness isn't mania."],["Feeling tired","That fits depression."],["Worrying about deadlines","That is everyday stress."]],"exp":"Mania: decreased need for sleep, impulsivity, risk-taking, grandiosity."}]},{"term":"Depressive episode (bipolar)","def":"Persistent sadness, hopelessness, or emptiness; loss of interest in activities; fatigue; difficulty concentrating and making decisions; changes in appetite and sleep; feelings of worthlessness and guilt; suicidal thoughts or behaviors.","hook":"","asks":[{"q":"Between her highs, a woman with bipolar disorder feels hopeless, tired and can't make decisions. What is this phase?","right":"A depressive episode","wrong":[["A hypomanic episode with milder high energy","Her mood is low."],["A manic episode","Her mood is low, not high."],["A panic attack","That is a burst of fear."]],"exp":"Sadness, hopelessness, fatigue and poor concentration."},{"q":"Which feature appears in a bipolar depressive episode on your slides?","right":"Feelings of worthlessness and guilt","wrong":[["Grandiosity and an inflated sense of self-esteem and power","Those are manic."],["Decreased need for sleep","That is manic."],["Racing thoughts","That is manic."]],"exp":"Sadness, hopelessness, fatigue, worthlessness, guilt."}]},{"term":"Bipolar I","def":"The more severe form. Full-blown manic episodes with extreme euphoria, inflated self-esteem, impulsivity, and psychosis (hallucinations or delusions). Severe effect on daily functioning; usually an earlier onset than Bipolar II; may have longer periods of depression.","hook":"I = more Intense.","asks":[{"q":"A patient has full manic episodes with hallucinations and needs hospitalization. Which disorder fits?","right":"Bipolar I","wrong":[["Bipolar II, which has milder hypomanic episodes","Bipolar II has no psychosis or full mania."],["Persistent depressive disorder","That has no mania."],["GAD","That is an anxiety disorder."]],"exp":"Bipolar I: full-blown mania, possibly with psychosis."},{"q":"Which detail best separates Bipolar I from Bipolar II?","right":"Full mania, possibly with psychosis","wrong":[["Milder hypomanic episodes that never include any psychosis at all","That describes Bipolar II."],["No depression","Both include depression."],["It is more common","Bipolar II is more common."]],"exp":"I = more Intense: full-blown mania, possible psychosis."}]},{"term":"Bipolar II","def":"The less severe form. Hypomanic episodes instead of full mania, less severe symptoms, and no psychosis. More common, but still has a significant impact on daily functioning.","hook":"","asks":[{"q":"A patient has periods of depression and milder high-energy episodes, but never full mania or psychosis. Which disorder fits?","right":"Bipolar II","wrong":[["Bipolar I, with full mania and possible psychosis","Bipolar I has full mania."],["Major depressive disorder","That has no highs."],["Schizophrenia","That is a psychotic disorder."]],"exp":"Bipolar II: hypomania, no psychosis."},{"q":"Which is true of Bipolar II on your slides?","right":"It's more common than Bipolar I","wrong":[["It includes psychosis and full-blown manic episodes as well","Those are Bipolar I."],["It has no impact on daily life","It still has a significant impact."],["It has no depression","It includes depression."]],"exp":"Bipolar II: hypomania, no psychosis, more common."}]},{"term":"Hypomanic episode","def":"A lesser form of mania than full-blown mania. Seen in Bipolar II.","hook":"Hypo = under (less than) mania.","asks":[{"q":"In Bipolar II, the \"high\" periods are less extreme than full mania. What are they called?","right":"Hypomanic episodes","wrong":[["Manic episodes with extreme euphoria and psychosis","Those are full-blown mania."],["Panic attacks","Those are bursts of fear."],["Dissociative episodes","Those involve disconnection."]],"exp":"Hypo = under mania."},{"q":"What does \"hypo\" in hypomanic tell you?","right":"It is less than full mania","wrong":[["It is more extreme than full mania, with psychosis","Hypo = under."],["It is a depressive episode","It's a high, not a low."],["It lasts 2 years","Not on your slides."]],"exp":"Hypo = under (less than) mania; seen in Bipolar II."}]},{"term":"Causes of bipolar disorder","def":"Genetic: family history is a strong indicator; some genes may increase susceptibility. Biological: imbalances in serotonin, dopamine, and norepinephrine and hormonal imbalances; sleep disturbances can increase symptoms. Environmental: stressful life events (trauma, loss, abuse) can increase symptoms; early childhood abuse and neglect increase the likelihood. Cultural: your slide says it's more common among Hispanic and African Americans than Caucasians.","hook":"","asks":[{"q":"Which is the strongest indicator of bipolar disorder risk on your slides?","right":"Family history","wrong":[["Eating too much sugar during childhood and the teen years","Not on your slides."],["A single stressful day","That alone isn't a cause."],["Being left-handed","Not on your slides."]],"exp":"Genetics (family history) is a strong indicator, plus biological factors."},{"q":"Which factor can increase bipolar symptoms, according to your slides?","right":"Sleep disturbances","wrong":[["Getting enough regular sleep every night on a steady schedule","Disturbed sleep, not good sleep, increases symptoms."],["A loving family","Not listed as a cause."],["Low dopamine only","Imbalances of several neurotransmitters are listed."]],"exp":"Biological: sleep disturbances can increase symptoms."}]}]}],"intro":["Major depressive disorder, persistent depressive disorder, Bipolar I vs. II, manic and depressive episodes, and causes."]},{"id":5,"name":"Neurodevelopmental Disorders","optional":false,"sections":[{"name":"Neurodevelopmental disorders","cards":[{"term":"Neurodevelopmental disorders","def":"Disorders associated with issues in central nervous system functioning that begin to appear in early childhood. They usually involve issues with social, intellectual, academic, or interpersonal functioning, and range from developmental, language, and speech delays to autism and ADHD.","hook":"","asks":[{"q":"Which group of disorders involves central nervous system issues that start to appear in early childhood?","right":"Neurodevelopmental disorders","wrong":[["Personality disorders, lasting patterns that start in adulthood","Those are diagnosed later."],["Dissociative disorders","Those usually follow trauma."],["Anxiety disorders","Those center on fear."]],"exp":"ADHD and ASD are neurodevelopmental disorders."},{"q":"When do neurodevelopmental disorders usually begin to appear?","right":"In early childhood","wrong":[["In late adulthood, after a person has turned sixty","They begin in early childhood."],["Only after a trauma","That is trauma disorders."],["In adolescence only","They appear in early childhood."]],"exp":"CNS issues that begin to appear in early childhood."},{"q":"Which is NOT an example of a neurodevelopmental disorder or delay on your slides?","right":"Panic disorder","wrong":[["Autism spectrum disorder","ASD is neurodevelopmental."],["ADHD","ADHD is neurodevelopmental."],["A speech or language delay","Those are listed."]],"exp":"They range from developmental, language and speech delays to autism and ADHD."}]},{"term":"Causes of neurodevelopmental disorders","def":"Not usually a single cause: a combination of genetic/biological and environmental factors. Environmental factors include exposure to teratogens like alcohol, tobacco, and other toxins; low birth weight; and maternal stress, trauma, and illness.","hook":"","asks":[{"q":"Which best describes the causes of neurodevelopmental disorders on your slides?","right":"Genes plus environmental factors","wrong":[["A single gene inherited from the father in every case","Usually there isn't a single cause."],["Bad parenting alone","Not on your slides."],["Watching too much TV","Not on your slides."]],"exp":"A combination of genetic/biological and environmental factors."},{"q":"Which is listed as an environmental factor for neurodevelopmental disorders?","right":"Low birth weight","wrong":[["Too much screen time during the teenage years in high school","Not on your slides."],["A high GABA level","Not on your slides."],["A divorce in adulthood","Not on your slides."]],"exp":"Teratogens, low birth weight, and maternal stress, trauma and illness."}]},{"term":"High heritability","def":"ADHD and ASD both tend to run in families, which suggests a strong genetic component.","hook":"","asks":[{"q":"ADHD and ASD both tend to run in families. What does this suggest?","right":"A strong genetic component","wrong":[["They are caused only by teratogens before birth","Running in families points to genes."],["They are learned by imitation","Not on your slides."],["They are caused by stress","Not on your slides."]],"exp":"High heritability."},{"q":"If a parent has ADHD, what does \"high heritability\" suggest about the child?","right":"A higher chance of having it too","wrong":[["The child is certain to develop ADHD before the age of eight","Heritability raises the chance; it doesn't guarantee it."],["The child can't develop ASD","Not implied."],["ADHD is caused only by teratogens","It suggests a genetic component."]],"exp":"ADHD and ASD run in families, suggesting a strong genetic component."}]},{"term":"Teratogens","def":"Harmful substances a baby is exposed to before birth, like alcohol, tobacco, and other toxins.","hook":"","asks":[{"q":"A pregnant woman drinks alcohol, and her baby is born with developmental problems. What was the alcohol in this case?","right":"A teratogen","wrong":[["A neurotransmitter that carries messages between neurons","Alcohol isn't a neurotransmitter."],["An ACE","ACEs happen after birth, in childhood."],["A hormone","Alcohol isn't a hormone."]],"exp":"Harmful substances before birth."},{"q":"Which of these is a teratogen?","right":"Tobacco smoke before birth","wrong":[["A loud classroom during the child's first years of school","Teratogens act before birth."],["Fast food in childhood","Not a teratogen."],["A stressful job","Not a teratogen."]],"exp":"Harmful substances a baby is exposed to before birth."}]}]},{"name":"ADHD","cards":[{"term":"ADHD","def":"Attention deficit hyperactivity disorder: a neurodevelopmental disorder with a persistent pattern of inattention and/or hyperactivity-impulsivity that interferes with functioning or development.","hook":"","asks":[{"q":"A boy constantly fidgets, can't wait his turn and loses focus in every class, at home and school. Which disorder fits?","right":"ADHD","wrong":[["Autism spectrum disorder with repetitive behavior","ASD centers on social contact and repetitive behaviors."],["GAD","That is anxiety."],["Bipolar II","That is a mood disorder."]],"exp":"Inattention and/or hyperactivity-impulsivity that interferes with functioning."},{"q":"Which two patterns define ADHD?","right":"Inattention and/or hyperactivity-impulsivity","wrong":[["Mania alternating with long periods of serious depression","That is bipolar."],["Obsessions and compulsions","That is OCD."],["Hallucinations and delusions","That is schizophrenia."]],"exp":"A persistent pattern of inattention and/or hyperactivity-impulsivity."}]},{"term":"ADHD symptom count","def":"Six or more symptoms of inattention and/or hyperactivity-impulsivity for children up to age 16, or five or more for ages 17 and older and adults.","hook":"6 for kids, 5 for 17+.","asks":[{"q":"How many symptoms are needed for an ADHD diagnosis in a 10-year-old?","right":"Six or more","wrong":[["Five or more, the number used for adults","Five is for ages 17 and older."],["Three or more","Not enough."],["Eleven","That is the number of substance use disorder criteria."]],"exp":"6 for kids, 5 for 17 and older."},{"q":"A 20-year-old shows five ADHD symptoms. Does that meet the count for adults?","right":"Yes; 5 is enough at 17 and older","wrong":[["No; everyone, at any age, needs at least six symptoms","Six is for children up to 16."],["No; adults need ten","Not the rule."],["Adults can't be diagnosed","They can."]],"exp":"6 for kids, 5 for 17+."}]},{"term":"Inattention symptoms","def":"Doesn't listen when spoken to directly; doesn't follow instructions; difficulty organizing tasks; avoids tasks that require sustained mental effort; often loses things; easily distracted; forgetful.","hook":"","asks":[{"q":"Which is an inattention symptom of ADHD?","right":"Often losing things","wrong":[["Running and climbing when it isn't appropriate","That is hyperactivity."],["Blurting out answers","That is impulsivity."],["Talking excessively","That is hyperactivity."]],"exp":"Not listening, not following instructions, losing things, easily distracted."},{"q":"A student keeps forgetting homework, loses her calculator and drifts off when spoken to. Which symptom group is this?","right":"Inattention","wrong":[["Hyperactivity, which includes fidgeting and climbing around","These are attention problems."],["Impulsivity","That is blurting and interrupting."],["Compulsions","That is OCD."]],"exp":"Forgetful, loses things, doesn't listen when spoken to directly."}]},{"term":"Hyperactivity symptoms","def":"Fidgety; runs about or climbs excessively; difficulty playing quietly; energetic; talks excessively.","hook":"","asks":[{"q":"Which is a hyperactivity symptom of ADHD?","right":"Fidgeting","wrong":[["Not following instructions on multi-step tasks","That is inattention."],["Interrupting others","That is impulsivity."],["Avoiding tasks that need focus","That is inattention."]],"exp":"Fidgety, running and climbing, talking excessively."},{"q":"A child can't stay seated, climbs on furniture and talks nonstop. Which symptom group is this?","right":"Hyperactivity","wrong":[["Inattention, which includes losing things and forgetfulness","These are activity-level problems."],["Impulsivity","That is blurting and interrupting."],["Mania","That is bipolar."]],"exp":"Fidgety, runs and climbs excessively, talks excessively."}]},{"term":"Impulsivity symptoms","def":"Blurts out answers before questions are finished; difficulty waiting their turn; interrupts conversations or intrudes on others.","hook":"","asks":[{"q":"Which is an impulsivity symptom of ADHD?","right":"Blurting out answers","wrong":[["Losing homework and school supplies very often","That is inattention."],["Fidgeting","That is hyperactivity."],["Climbing on furniture","That is hyperactivity."]],"exp":"Blurting, trouble waiting, interrupting."},{"q":"In class, a boy shouts answers before the teacher finishes and cuts in line. Which symptom group is this?","right":"Impulsivity","wrong":[["Hyperactivity, which includes fidgeting and running around","Blurting and cutting in line are impulsivity."],["Inattention","That is losing focus."],["Delusions","Not related."]],"exp":"Blurting out answers, trouble waiting, interrupting."}]},{"term":"Other ADHD criteria","def":"Several symptoms present before age 12; present in two or more settings (home, school, work, with friends); clear evidence they interfere with or reduce the quality of functioning; not better explained by another mental disorder; present at least 6 months and developmentally inappropriate.","hook":"Before 12, 2+ settings, 6+ months.","asks":[{"q":"A 15-year-old shows ADHD symptoms only at school, starting this year. Why would an ADHD diagnosis be unlikely?","right":"Symptoms must start before 12, in 2+ settings","wrong":[["ADHD can only be diagnosed after the age of 18","It is usually diagnosed in childhood."],["Symptoms must appear only at school","They must appear in two or more settings."],["ADHD needs 11 symptoms","Not the rule."]],"exp":"Several symptoms before age 12, in two or more settings."},{"q":"A 9-year-old shows ADHD symptoms only at home, starting two months ago. Which criteria are not yet met?","right":"Two settings and six months","wrong":[["The symptom count, which must reach at least twelve symptoms","Not the issue here; count isn't the problem described."],["Onset before age 20","Before 12 is the rule, and he's 9."],["A note from his teacher","No such rule; the criteria are settings and time."]],"exp":"Symptoms must appear in 2+ settings and last at least 6 months."}]},{"term":"ADHD onset","def":"The average onset is during childhood, usually around age eight. Diagnosing earlier can be difficult because many symptoms also occur in children without ADHD.","hook":"","asks":[{"q":"At about what age does ADHD typically begin?","right":"Around age eight","wrong":[["Around age 25, in early adulthood after college","Onset is in childhood."],["At birth","Diagnosing that early is difficult."],["In old age","It starts in childhood."]],"exp":"Average onset around age eight."},{"q":"Why is ADHD hard to diagnose very early in childhood?","right":"Many symptoms also occur in kids without ADHD","wrong":[["Young children are never inattentive or energetic at all","They often are."],["ADHD only starts in adulthood","Onset is usually around 8."],["There are no symptoms","There are."]],"exp":"Many symptoms also occur in children without ADHD."}]}]},{"name":"Autism spectrum disorder","cards":[{"term":"Autism spectrum disorder (ASD)","def":"Children with ASD seek out less emotional and social contact, tend to be hypersensitive to sensory stimuli, and may engage in simple, repetitive behaviors. Often they have difficulty with social interaction, maintaining eye contact, and picking up nonverbal cues like facial expressions or body language.","hook":"","asks":[{"q":"A child avoids eye contact and social play, is very sensitive to loud noises, and repeats the same actions. Which disorder fits?","right":"Autism spectrum disorder","wrong":[["ADHD, with inattention and hyperactivity","ADHD centers on attention and activity, not these social and sensory signs."],["Social anxiety disorder","That is fear of judgment."],["Schizophrenia","That is a psychotic disorder."]],"exp":"Less social contact, sensory sensitivity, repetitive behaviors."},{"q":"A child struggles to read facial expressions and body language and avoids eye contact. Which disorder fits best?","right":"Autism spectrum disorder","wrong":[["Social anxiety disorder, which is a fear of being judged","The key issue is reading social cues, not fear of judgment."],["ADHD","ADHD centers on attention and activity."],["Schizoid personality disorder","That is diagnosed later and isn't about reading cues."]],"exp":"ASD: difficulty with eye contact and nonverbal cues."}]},{"term":"Why \"spectrum\"?","def":"Symptoms of ASD range from mild to severe.","hook":"","asks":[{"q":"Why is autism called a \"spectrum\" disorder?","right":"Symptoms range from mild to severe","wrong":[["It only affects people who see colors very differently","Not related to color."],["It has exactly three types","Not on your slides."],["It always gets worse with age","Not on your slides."]],"exp":"The symptoms range from mild to severe."},{"q":"Two children both have ASD, but one needs little support and the other needs a lot. What explains this?","right":"ASD symptoms range from mild to severe","wrong":[["One of the two children must have been misdiagnosed by a doctor","Both can have ASD."],["One has ADHD instead","Not implied."],["ASD only affects boys","It's more common in boys, not only boys."]],"exp":"That is why it's called a spectrum."}]},{"term":"ASD statistics","def":"About 1 in 31 (3.2%) children aged 8 have been identified with ASD (CDC ADDM Network). ASD is over 3 times more common among boys than girls.","hook":"","asks":[{"q":"According to your slides, how much more common is ASD among boys than girls?","right":"Over 3 times","wrong":[["About the same among boys and girls at every age","It is over 3 times more common in boys."],["Twice as common in girls","It is more common in boys."],["Ten times","Not on your slides."]],"exp":"About 1 in 31 eight-year-olds; over 3 times more common in boys."},{"q":"About how many 8-year-olds have been identified with ASD, per your slides?","right":"About 1 in 31","wrong":[["About 1 in 1,000 eight-year-olds across the country","Your slides say about 1 in 31."],["About 1 in 2","Far too many."],["None","Not true."]],"exp":"About 1 in 31 (3.2%) children aged 8."}]}]}],"intro":["ADHD (symptoms and diagnosis rules) and autism spectrum disorder, plus their causes."]},{"id":6,"name":"Dissociative Disorders","optional":false,"sections":[{"name":"Dissociative disorders","cards":[{"term":"Dissociative disorders","def":"Disorders involving a loss of connection between thoughts, memories, feelings, surroundings, behavior, and identity. They include escaping from reality in ways that are not wanted and not healthy, and cause problems managing everyday life.","hook":"Dis-associate = disconnect.","asks":[{"q":"Which group of disorders involves a loss of connection between memories, identity and surroundings, often as an escape from reality?","right":"Dissociative disorders","wrong":[["Anxiety disorders, centered on fear and constant worry","Those center on fear."],["Mood disorders","Those center on mood."],["Eating disorders","Those center on food and weight."]],"exp":"Dissociative disorders: disconnection from thoughts, memory and identity."},{"q":"What does the hook \"dis-associate = disconnect\" describe?","right":"A loss of connection with memory and identity","wrong":[["A fear of being disconnected from friends and family members","Not the meaning."],["Disconnected neurons","Not the meaning."],["Losing Wi-Fi","Not the meaning."]],"exp":"Loss of connection between thoughts, memories, feelings, surroundings, behavior and identity."}]},{"term":"Cause of dissociative disorders","def":"The most common cause is severe trauma or major stress.","hook":"","asks":[{"q":"What is the most common cause of dissociative disorders, according to your slides?","right":"Severe trauma or major stress","wrong":[["Too much caffeine and other stimulants over many years","Not on your slides."],["A dopamine imbalance","That is linked to schizophrenia."],["Teratogens","Those affect development before birth."]],"exp":"Severe trauma or major stress."},{"q":"A soldier develops dissociative amnesia after a battle. What does this fit as the most common cause?","right":"Severe trauma","wrong":[["A genetic predisposition passed down from both of his parents","Trauma is the most common cause."],["Teratogens","Those act before birth."],["Too much dopamine","That is linked to schizophrenia."]],"exp":"The most common cause is severe trauma or major stress."}]},{"term":"Symptoms of dissociative disorders","def":"Memory loss and confusion about identity; feelings of detachment; reasoning difficulties; mood changes.","hook":"","asks":[{"q":"Which set of symptoms fits dissociative disorders?","right":"Memory loss, detachment, identity confusion","wrong":[["Fidgeting, blurting out answers and talking too much","Those are ADHD symptoms."],["Binge eating and purging","That is bulimia."],["Fear of crowds","That is agoraphobia."]],"exp":"Memory loss, identity confusion, detachment, reasoning trouble, mood changes."},{"q":"Which symptom fits dissociative disorders?","right":"Feeling detached from yourself","wrong":[["Fidgeting, climbing and running around constantly","That is ADHD."],["Fear of open spaces","That is agoraphobia."],["Binge eating","That is bulimia."]],"exp":"Memory loss, identity confusion, detachment, reasoning trouble, mood changes."}]}]},{"name":"Dissociative amnesia","cards":[{"term":"Dissociative amnesia","def":"A significant inability to recall important personal information, typically related to traumatic or stressful events.","hook":"","asks":[{"q":"After surviving a violent attack, a woman can't remember the event or the days around it. What does she likely have?","right":"Dissociative amnesia","wrong":[["Dissociative identity disorder with several alters","There is no sign of separate identities."],["Alzheimer's disease","That is a gradual brain disease."],["Narcolepsy","That is a sleep disorder."]],"exp":"Inability to recall important personal information, usually tied to trauma."},{"q":"What separates dissociative amnesia from normal forgetfulness?","right":"It's major personal memory tied to trauma","wrong":[["It only involves forgetting where you left your keys or phone","That is ordinary forgetfulness."],["It always involves alters","That is DID."],["It's caused by teratogens","Not on your slides."]],"exp":"A significant inability to recall important personal information, typically trauma-related."}]},{"term":"Symptoms of dissociative amnesia","def":"Inability to remember specific events or periods of time; loss of autobiographical information (personal identity, relationships, life experiences); confusion and disorientation about one's own life; may experience a fugue state.","hook":"","asks":[{"q":"Which symptom fits dissociative amnesia?","right":"Losing personal life memories","wrong":[["Hearing voices that tell you what to do each day","That is a hallucination (schizophrenia)."],["Constant worry","That is GAD."],["Extreme mood swings","That is bipolar disorder."]],"exp":"Inability to remember events or periods; loss of autobiographical information."},{"q":"Which experience can come with dissociative amnesia?","right":"A fugue state","wrong":[["A manic episode with racing thoughts and grandiose plans","That is bipolar."],["Hallucinations","That is schizophrenia."],["Tardive dyskinesia","That is a drug side effect."]],"exp":"Dissociative amnesia may include a fugue state."}]},{"term":"Fugue state","def":"When the individual wanders or travels without any awareness of their identity or situation. Can happen with dissociative amnesia.","hook":"Fugue = flee (Latin).","asks":[{"q":"A man is found in a city 300 miles away with no idea who he is or how he got there. What happened?","right":"A fugue state","wrong":[["A manic episode with grandiose plans and travel","Mania doesn't erase identity."],["Sleepwalking","He traveled far while awake."],["A panic attack","That is a burst of fear."]],"exp":"Wandering or traveling without awareness of identity."},{"q":"What does the hook \"fugue = flee\" describe?","right":"Wandering away without knowing who you are","wrong":[["Running from danger during the fight-or-flight response","That is the alarm response."],["A fear of travel","Not the meaning."],["Fleeing a crowd","That fits agoraphobia avoidance."]],"exp":"Wandering or traveling without awareness of identity."}]}]},{"name":"Dissociative identity disorder","cards":[{"term":"Dissociative identity disorder (DID)","def":"A severe condition with two or more distinct personality states (called \"alters\"), each with its own identity, memories, behaviors, and perspectives.","hook":"","asks":[{"q":"A patient has two distinct personalities with different names, memories and ways of speaking. What disorder fits?","right":"Dissociative identity disorder","wrong":[["Schizophrenia, with hallucinations and delusions","Schizophrenia isn't multiple personalities."],["Bipolar I","That is mood swings."],["Borderline personality disorder","That is unstable mood and relationships."]],"exp":"Two or more distinct personality states."},{"q":"A classmate says DID and schizophrenia are the same thing. What is the best correction?","right":"DID is separate identities, not psychosis","wrong":[["They are the same disorder, just called by two different names","They are different disorders."],["Schizophrenia involves alters","Alters are DID."],["DID always includes hallucinations","Not on your slides."]],"exp":"DID: two or more distinct personality states. Schizophrenia: psychosis."}]},{"term":"Alters","def":"The distinct personality states in dissociative identity disorder.","hook":"","asks":[{"q":"In DID, what are the separate personality states called?","right":"Alters","wrong":[["Delusions, false beliefs about the world","Those are false beliefs."],["Obsessions","Those are intrusive thoughts."],["Hallucinations","Those are false perceptions."]],"exp":"Alters each have their own identity, memories and behaviors."},{"q":"In DID, each alter has its own what, according to your slides?","right":"Identity, memories and behaviors","wrong":[["Body, brain and nervous system separate from the other alters","Alters share one body."],["Medication","Not on your slides."],["Hallucinations","Not on your slides."]],"exp":"Each with its own identity, memories, behaviors and perspectives."}]},{"term":"Symptoms of DID","def":"Two or more distinct personality states; shifts in identity that can happen suddenly or gradually; gaps in memory about significant events; confusion about one's own identity; feelings of detachment from oneself or the environment.","hook":"","asks":[{"q":"Which symptom fits dissociative identity disorder?","right":"Gaps in memory and shifts in identity","wrong":[["Repeatedly checking that the door is locked before leaving","That is OCD."],["A fear of being judged","That is social anxiety."],["Refusing to eat","That fits anorexia."]],"exp":"Distinct personality states, identity shifts, memory gaps."},{"q":"A woman has gaps in her memory of important events and her identity shifts suddenly. Which disorder do these symptoms fit?","right":"Dissociative identity disorder","wrong":[["Bipolar I disorder with extreme manic and depressive episodes","Mood swings aren't identity shifts."],["GAD","That is worry."],["ADHD","That is attention and activity."]],"exp":"Identity shifts and memory gaps."}]}]}],"intro":["Dissociative amnesia, fugue states, and dissociative identity disorder."]},{"id":7,"name":"Schizophrenia Spectrum","optional":false,"sections":[{"name":"Schizophrenia","cards":[{"term":"Schizophrenia","def":"A type of psychosis. The DSM-5 placed it on a spectrum of psychotic disorders because people experience its symptoms in a variety of ways. To be diagnosed, the patient must have at least 2 symptoms (positive and negative) for at least 6 months.","hook":"","asks":[{"q":"A patient hears voices, believes the TV sends him messages, and his speech jumps randomly between topics. Which disorder fits?","right":"Schizophrenia","wrong":[["Dissociative identity disorder with several alters","DID involves separate identities, not psychosis."],["Bipolar II","That has no psychosis."],["GAD","That is worry."]],"exp":"Schizophrenia is a psychotic disorder."},{"q":"What is needed to diagnose schizophrenia, according to your slides?","right":"At least 2 symptoms for at least 6 months","wrong":[["One symptom that lasts for at least two weeks in a row","That isn't the criterion on your slides."],["Only negative symptoms","At least 2 symptoms."],["Symptoms before age 12","That is ADHD."]],"exp":"At least 2 symptoms (positive and negative) for at least 6 months."}]}]},{"name":"Symptoms","cards":[{"term":"Positive symptoms","def":"Symptoms that indicate something added: delusions, hallucinations, disorganized thinking/speech, and disorganized motor movement.","hook":"Positive = added, not \"good.\"","asks":[{"q":"Hallucinations and delusions are called \"positive\" symptoms. Why?","right":"They add something not normally there","wrong":[["They are good signs that the patient will soon recover","Positive doesn't mean good."],["They respond well to praise","Not related."],["They happen only in happy moods","Not related."]],"exp":"Positive = added, not \"good.\""},{"q":"Which list contains only positive symptoms of schizophrenia?","right":"Delusions, hallucinations, disorganized speech","wrong":[["Flat affect, catatonic stupor and a lack of motivation or interest","Those are negative."],["Mania and depression","Those are bipolar."],["Obsessions and compulsions","Those are OCD."]],"exp":"Positive = added."}]},{"term":"Delusions","def":"False beliefs. Can be delusions of grandeur (importance) or delusions of persecution (paranoia).","hook":"Delusion = false belief.","asks":[{"q":"A woman is sure she is secretly the queen of England, despite all evidence. What symptom is this?","right":"A delusion","wrong":[["A hallucination, a false perception of the senses","A hallucination is a false perception; this is a false belief."],["Flat affect","That is no emotional expression."],["Word salad","That is jumbled speech."]],"exp":"Delusion = false belief."},{"q":"Which pair are both delusions?","right":"Grandeur and persecution","wrong":[["Hearing voices and seeing shadows that are not really there","Those are hallucinations."],["Flat affect and catatonia","Those are negative symptoms."],["Word salad and rhyming","That is disorganized speech."]],"exp":"Delusions of grandeur and of persecution."}]},{"term":"Delusions of grandeur","def":"False beliefs about one's own importance.","hook":"","asks":[{"q":"A man insists he has been chosen to save the world and has special powers. What type of delusion is this?","right":"A delusion of grandeur","wrong":[["A delusion of persecution, that people are out to get him","His belief is about his importance."],["A hallucination","That is a false perception."],["Hypervigilance","That is a PTSD symptom."]],"exp":"False beliefs about one's own importance."},{"q":"Which belief is a delusion of grandeur?","right":"\"I'm a famous genius chosen by God\"","wrong":[["\"My neighbors are secretly poisoning my food every night\"","That is persecution."],["\"I hear voices\"","That is a hallucination."],["\"I'm worthless\"","That fits depression."]],"exp":"False beliefs about one's own importance."}]},{"term":"Delusions of persecution","def":"False beliefs that others are out to get you (paranoia).","hook":"","asks":[{"q":"A woman is convinced her neighbors are poisoning her food and spying on her. What type of delusion is this?","right":"A delusion of persecution","wrong":[["A delusion of grandeur about her own importance","Her belief is that others are out to get her."],["A compulsion","That is a repetitive behavior."],["A fugue state","That is travel without awareness of identity."]],"exp":"Paranoia: others are out to get you."},{"q":"Which belief is a delusion of persecution?","right":"\"The government is tracking my thoughts\"","wrong":[["\"I am the most important and powerful person on the planet\"","That is grandeur."],["\"I see colors when I hear music\"","That is synesthesia."],["\"I'm always tired\"","That isn't a delusion."]],"exp":"False beliefs that others are out to get you."}]},{"term":"Hallucinations","def":"False perceptions: seeing, hearing, smelling, tasting, or feeling things that are not real.","hook":"Hallucination = false perception.","asks":[{"q":"A patient hears voices commenting on everything he does, though no one is there. What symptom is this?","right":"A hallucination","wrong":[["A delusion, a false belief held despite evidence","A delusion is a belief; this is a false perception."],["An obsession","That is an intrusive thought."],["Catatonic stupor","That is no movement."]],"exp":"Hallucination = false perception."},{"q":"Which is a hallucination rather than a delusion?","right":"Smelling smoke when there's no fire","wrong":[["Believing you have been chosen to save the world from danger","That is a delusion (a false belief)."],["Believing you're being followed","That is a delusion."],["Thinking you're famous","That is a delusion."]],"exp":"Hallucination = false perception; delusion = false belief."}]},{"term":"Disorganized thinking/speech","def":"Stringing words together in an unusual way (word salad), jumping from topic to topic, or rhyming.","hook":"","asks":[{"q":"A patient answers, \"The cat sky drives purple running.\" What symptom is this?","right":"Disorganized speech","wrong":[["Flat affect, a lack of emotional expression","That is about emotion, not speech."],["A delusion of grandeur","That is a false belief."],["Catatonic stupor","That is no movement."]],"exp":"Word salad, jumping topics or rhyming."},{"q":"A patient answers a question by rhyming: \"Bed, red, said, dead, head.\" Which positive symptom is this?","right":"Disorganized speech","wrong":[["Flat affect, a lack of emotional expression when speaking","His speech is disorganized, not flat."],["A delusion","That is a false belief."],["Catatonic stupor","That is no movement."]],"exp":"Word salad, topic-jumping or rhyming."}]},{"term":"Word salad","def":"Words strung together in a jumbled, unusual way. A sign of disorganized speech.","hook":"","asks":[{"q":"Words strung together in a jumbled way that makes no sense are a sign of what?","right":"Disorganized speech","wrong":[["Broca's aphasia, with short but meaningful phrases","Not the term on this card."],["Social anxiety","That is fear of judgment."],["Hypomania","That is a milder high."]],"exp":"Word salad is a sign of disorganized speech."},{"q":"A doctor hears a patient say \"car window sing loudly purple jump.\" What is this called?","right":"Word salad","wrong":[["Broca's aphasia, with slow and very effortful short phrases","Not the term on this card."],["Hypomania","That is a mood state."],["Flat affect","That is no emotion."]],"exp":"Words strung together in a jumbled way: disorganized speech."}]},{"term":"Disorganized motor movement","def":"Movement that is childlike, excessive, excited, silly, or purposeless.","hook":"","asks":[{"q":"A patient moves in silly, childlike, purposeless ways. Which positive symptom is this?","right":"Disorganized motor movement","wrong":[["Catatonic stupor, where there is no movement at all","That is a negative symptom: no movement."],["Flat affect","That is emotional."],["Hallucination","That is perception."]],"exp":"Childlike, excessive, silly or purposeless movement."},{"q":"Which is an example of disorganized motor movement?","right":"Silly, purposeless movements","wrong":[["Sitting completely still for hours without responding to anyone","That is catatonic stupor, a negative symptom."],["A normal walk","Not disorganized."],["A knee-jerk reflex","That is normal."]],"exp":"Childlike, excessive, excited, silly or purposeless movement."}]},{"term":"Negative symptoms","def":"Symptoms that indicate something absent: lack of emotional expression (flat affect), no movement (catatonic stupor), and lack of interest and motivation.","hook":"Negative = missing.","asks":[{"q":"A patient shows no emotion, barely moves and has lost all motivation. What kind of symptoms are these?","right":"Negative symptoms","wrong":[["Positive symptoms like hallucinations and delusions","Positive symptoms add something; these are absences."],["Manic symptoms","Those are elevated mood."],["Dissociative symptoms","Those involve disconnection."]],"exp":"Negative = missing: flat affect, catatonia, lack of motivation."},{"q":"Why is flat affect called a \"negative\" symptom?","right":"Something normal is missing","wrong":[["It is a bad sign that the patient will never recover from it","Negative doesn't mean bad."],["It's caused by negativity","Not the meaning."],["It adds something","That would be positive."]],"exp":"Negative = missing."}]},{"term":"Flat affect","def":"A lack of emotional expression. A negative symptom.","hook":"","asks":[{"q":"A patient describes his father's death in the same flat, expressionless tone as his breakfast. Which symptom is this?","right":"Flat affect","wrong":[["Word salad, jumbled and meaningless speech","His speech makes sense."],["A delusion","That is a false belief."],["Hypervigilance","That is always being on guard."]],"exp":"A lack of emotional expression."},{"q":"Which symptom group does flat affect belong to?","right":"Negative symptoms","wrong":[["Positive symptoms like hallucinations, delusions and word salad","Flat affect is an absence."],["Manic symptoms","Not mania."],["PTSD symptoms","Not PTSD."]],"exp":"Flat affect is a negative symptom."}]},{"term":"Catatonic stupor","def":"No movement. A negative symptom.","hook":"","asks":[{"q":"A patient sits completely still for hours, not responding or moving. Which symptom is this?","right":"Catatonic stupor","wrong":[["Disorganized motor movement that is silly and childlike","That is excessive movement, the opposite."],["A fugue state","That involves travel."],["A panic attack","That is a burst of fear."]],"exp":"No movement: a negative symptom."},{"q":"What separates catatonic stupor from disorganized motor movement?","right":"No movement vs. purposeless movement","wrong":[["Both are the same positive symptom of schizophrenia, just named twice","Catatonic stupor is negative."],["Catatonia is a delusion","It's a movement symptom."],["Disorganized movement is a drug side effect","That is tardive dyskinesia."]],"exp":"Catatonic stupor = no movement (negative); disorganized movement = purposeless movement (positive)."}]}]},{"name":"Causes","cards":[{"term":"Causes of schizophrenia","def":"Genetic or biological link (tends to run in families); prenatal exposure to certain viruses (teratogens like flu, herpes, rubella); imbalances in neurotransmitters like dopamine and glutamate.","hook":"","asks":[{"q":"Which is listed as a possible cause of schizophrenia on your slides?","right":"Prenatal exposure to certain viruses","wrong":[["Being raised by a strict parent who set high standards","Not on your slides."],["Eating too much sugar","Not on your slides."],["Too little dopamine","Excess dopamine is the hypothesis."]],"exp":"Genes, prenatal viruses (teratogens) and neurotransmitter imbalances."},{"q":"Which neurotransmitters are linked to schizophrenia on your slides?","right":"Dopamine and glutamate","wrong":[["Serotonin and GABA, which are linked to anxiety disorders","Not the pair listed for schizophrenia."],["Endorphins only","Not listed."],["Melatonin and leptin","Those are hormones."]],"exp":"Imbalances in neurotransmitters like dopamine and glutamate."}]},{"term":"Dopamine hypothesis","def":"The theory that an imbalance of dopamine in the brain can contribute to schizophrenia. It suggests the positive symptoms (delusions, hallucinations) are caused by an overproduction of dopamine.","hook":"Too much dopamine → positive symptoms.","asks":[{"q":"Antipsychotic drugs that block dopamine reduce hallucinations. Which theory does this support?","right":"The dopamine hypothesis","wrong":[["The diathesis-stress model of stress triggering a predisposition","That is about stress triggering a predisposition."],["Gate control theory","That is about pain."],["Tend-and-befriend","That is a stress response."]],"exp":"Too much dopamine activity may cause positive symptoms."},{"q":"If the dopamine hypothesis is right, which drug effect would you expect to reduce hallucinations?","right":"Blocking dopamine receptors","wrong":[["Raising the amount of dopamine in the brain's synapses","Too much dopamine is the problem."],["Boosting serotonin","That's for depression."],["Increasing GABA","That's for anxiety."]],"exp":"Overproduction of dopamine is linked to positive symptoms; antipsychotics block dopamine."}]},{"term":"Diathesis-stress model","def":"The idea that high levels of stress may trigger a genetic/biological predisposition (diathesis) to develop mental illness. Example: identical twins where one develops schizophrenia but the other does not.","hook":"Diathesis = the built-in risk; stress = the trigger.","asks":[{"q":"Identical twins share a genetic risk for schizophrenia, but only the one who goes through intense stress develops it. Which model explains this?","right":"The diathesis-stress model","wrong":[["The dopamine hypothesis about too much dopamine","That doesn't explain why only one twin developed it."],["The General Adaptation Syndrome","That describes stress stages."],["The 3 Ds","Those define disorders."]],"exp":"Stress can trigger a genetic predisposition."},{"q":"Which pair does the diathesis-stress model combine?","right":"A built-in risk plus a stress trigger","wrong":[["A dopamine imbalance plus a separate glutamate imbalance","Not the model."],["Two personalities","That is DID."],["Mania plus depression","That is bipolar."]],"exp":"Diathesis = the built-in risk; stress = the trigger."}]},{"term":"Diathesis","def":"A genetic or biological predisposition to develop a mental illness.","hook":"","asks":[{"q":"In the diathesis-stress model, what is the \"diathesis\"?","right":"A genetic or biological predisposition","wrong":[["A stressful event like a divorce or the loss of a job","That is the stress part."],["A type of therapy","Not a treatment."],["A hallucination","That is a symptom."]],"exp":"Diathesis = predisposition."},{"q":"Two cousins both inherit a risk for depression. What is that shared risk called?","right":"A diathesis","wrong":[["A delusion, a false belief held despite evidence","Not the term."],["A teratogen","That is a harmful substance before birth."],["An alter","That is DID."]],"exp":"A genetic or biological predisposition."}]}]}],"intro":["Positive and negative symptoms, causes, the dopamine hypothesis, and the diathesis-stress model."]},{"id":8,"name":"OCD & Trauma Disorders","optional":false,"sections":[{"name":"Obsessive-compulsive & related","cards":[{"term":"Obsessive-compulsive & related disorders","def":"A group including OCD, body dysmorphic disorder (BDD), hoarding disorder, trichotillomania (hair-pulling), and excoriation (skin-picking), characterized by intrusive thoughts and/or repetitive behaviors. Your slide: know the symptoms of OCD and hoarding.","hook":"","asks":[{"q":"OCD, hoarding, hair-pulling and skin-picking are grouped together. What is the group called?","right":"Obsessive-compulsive & related disorders","wrong":[["Anxiety disorders, as in older versions of the DSM","The DSM-5 moved them to their own category."],["Dissociative disorders","Those involve disconnection."],["Personality disorders","Those are enduring patterns."]],"exp":"OCD and related disorders."},{"q":"Which feature ties together OCD, hoarding, hair-pulling and skin-picking?","right":"Intrusive thoughts and/or repetitive behaviors","wrong":[["Hallucinations and delusions, like those seen in psychosis","That is psychosis."],["Mania","That is bipolar."],["Trauma exposure only","That is trauma disorders."]],"exp":"Characterized by intrusive thoughts and/or repetitive behaviors."}]},{"term":"Their own DSM-5 category","def":"OCD and related disorders like hoarding were part of anxiety disorders in earlier versions of the DSM. In the DSM-5 they were moved to their own category to show they are distinct from anxiety disorders.","hook":"","asks":[{"q":"Where were OCD and hoarding placed in older versions of the DSM, before getting their own category?","right":"Under anxiety disorders","wrong":[["Under personality disorders, as Cluster C problems","They were with anxiety disorders."],["Under eating disorders","No."],["Under mood disorders","No."]],"exp":"The DSM-5 gave them their own category."},{"q":"Why did the DSM-5 move OCD and hoarding out of anxiety disorders?","right":"To show they are distinct","wrong":[["Because they were found to be the very same disorder as PTSD","Not the reason."],["Because they're no longer disorders","They still are."],["Because they cause psychosis","Not the reason."]],"exp":"Moved to their own category to show they are distinct from anxiety disorders."}]},{"term":"Trichotillomania","def":"Hair-pulling disorder. An obsessive-compulsive related disorder.","hook":"","asks":[{"q":"A teen repeatedly pulls out her own hair and can't stop. Which disorder fits?","right":"Trichotillomania","wrong":[["Excoriation disorder, which involves picking at the skin","Excoriation is skin-picking."],["Hoarding disorder","That is difficulty discarding things."],["Anorexia","That is an eating disorder."]],"exp":"Hair-pulling disorder."},{"q":"Which group does trichotillomania belong to?","right":"Obsessive-compulsive & related disorders","wrong":[["Trauma- and stressor-related disorders like PTSD and acute stress","It's OCD-related."],["Dissociative disorders","Not dissociative."],["Neurodevelopmental disorders","Not neurodevelopmental."]],"exp":"Hair-pulling disorder: an obsessive-compulsive related disorder."}]},{"term":"Excoriation disorder","def":"Skin-picking disorder. An obsessive-compulsive related disorder.","hook":"","asks":[{"q":"A man picks at his skin until it bleeds and can't stop. Which disorder fits?","right":"Excoriation disorder","wrong":[["Trichotillomania, which involves pulling out hair","That is hair-pulling."],["Hoarding disorder","That is keeping possessions."],["Hypervigilance","That is a PTSD symptom."]],"exp":"Skin-picking disorder."},{"q":"What is the everyday name for excoriation disorder?","right":"Skin-picking disorder","wrong":[["Hair-pulling disorder, also called trichotillomania","That is trichotillomania."],["Hoarding disorder","That is saving items."],["Nail-biting disorder","Not the name."]],"exp":"Excoriation = skin-picking."}]}]},{"name":"OCD","cards":[{"term":"OCD","def":"Obsessive-compulsive disorder: characterized by obsessions and compulsions.","hook":"","asks":[{"q":"Every night, Ava worries her house will burn down and checks the stove 20 times before bed. Which disorder fits?","right":"OCD","wrong":[["Generalized anxiety disorder about many everyday things","Her worry leads to a specific repeated ritual."],["Specific phobia","She isn't avoiding a feared object."],["Hoarding disorder","She isn't keeping possessions."]],"exp":"Obsessions plus compulsions."},{"q":"Which two parts make up OCD?","right":"Obsessions and compulsions","wrong":[["Delusions and hallucinations that come with psychosis","That is schizophrenia."],["Mania and depression","That is bipolar."],["Inattention and hyperactivity","That is ADHD."]],"exp":"OCD: obsessions (thoughts) and compulsions (actions)."}]},{"term":"Obsessions","def":"Recurrent and persistent thoughts that are intrusive.","hook":"Obsessions = thoughts.","asks":[{"q":"In OCD, constant intrusive thoughts that germs are everywhere are called what?","right":"Obsessions","wrong":[["Compulsions, the repeated actions to reduce anxiety","Compulsions are the actions."],["Delusions","Those are false beliefs in psychosis."],["Hallucinations","Those are false perceptions."]],"exp":"Obsessions = thoughts."},{"q":"Which is an obsession rather than a compulsion?","right":"A constant fear that the house will burn","wrong":[["Checking the stove twenty times before leaving the house","That is a compulsion (action)."],["Counting steps","That is a compulsion."],["Washing hands","That is a compulsion."]],"exp":"Obsessions = thoughts."}]},{"term":"Compulsions","def":"Repetitive behaviors or mental acts the individual feels driven to perform.","hook":"Compulsions = actions.","asks":[{"q":"In OCD, washing your hands 50 times a day to ease anxiety is called what?","right":"A compulsion","wrong":[["An obsession, an intrusive and recurring thought","Obsessions are the thoughts."],["A delusion","That is a false belief."],["Tending","That is caring for others."]],"exp":"Compulsions = actions."},{"q":"Which is a compulsion rather than an obsession?","right":"Silently counting to 100 again and again","wrong":[["A recurring, intrusive thought that one's hands are dirty","That is an obsession (thought)."],["Fear of germs","That is an obsession."],["Worry about harm","That is an obsession."]],"exp":"Compulsions are repetitive behaviors or mental acts."}]},{"term":"The OCD cycle","def":"Obsession → distress → compulsion → relief → back to obsession.","hook":"","asks":[{"q":"Whic
