gardless of their income","That is justice."],["Keeping records private","That is respect for rights."],["Weighing a treatment's risks","That is beneficence and nonmaleficence."]],"exp":"Trust and responsibility."}]},{"term":"Beneficence and nonmaleficence","def":"Do no harm! Weigh the benefits against the risks of harm and make sure treatment won't harm others.","hook":"Non-male-ficence = no harm.","asks":[{"q":"Before starting a treatment, a therapist weighs its benefits against its risks of harm. Which ethics principle is this?","right":"Beneficence and nonmaleficence","wrong":[["Respect for rights and dignity, including privacy","That is about privacy and self-determination."],["Justice","That is fairness."],["Fidelity","That is trust."]],"exp":"Do no harm."},{"q":"A therapist considers a treatment that might help her client but could harm his family. Which principle tells her to weigh this?","right":"Beneficence and nonmaleficence","wrong":[["Integrity, being honest and transparent with every client","That is honesty."],["Justice","That is fairness."],["Fidelity","That is trust."]],"exp":"Do no harm: weigh benefits against risks, including to others."},{"q":"What is the shortest summary of beneficence and nonmaleficence?","right":"Do no harm","wrong":[["Tell the client the truth about everything, always","That is integrity."],["Treat everyone equally","That is justice."],["Keep everything private","That is respect for rights."]],"exp":"Non-male-ficence = no harm."}]},{"term":"Respect for rights and dignity","def":"Maintain the client's confidentiality and privacy, and allow for self-determination.","hook":"","asks":[{"q":"A therapist lets her client make his own choices and keeps his records private. Which ethics principle is this?","right":"Respect for rights and dignity","wrong":[["Justice, treating all clients fairly and equally","That is about equal access."],["Integrity","That is honesty."],["Beneficence","That is doing no harm."]],"exp":"Confidentiality, privacy and self-determination."},{"q":"A client decides to stop therapy, and the therapist accepts her choice. Which principle is this?","right":"Respect for rights and dignity","wrong":[["Beneficence and nonmaleficence, weighing harms and benefits","The point here is her self-determination."],["Integrity","That is honesty."],["Justice","That is fairness."]],"exp":"Allow self-determination."},{"q":"Which action shows respect for rights and dignity?","right":"Keeping a client's records private","wrong":[["Charging all clients exactly the same fee for every type of session","That is about fairness (justice)."],["Never lying","That is integrity."],["Weighing risks","That is beneficence."]],"exp":"Confidentiality, privacy and self-determination."}]},{"term":"Integrity","def":"Honesty, accuracy, and transparency. No lying to the client.","hook":"","asks":[{"q":"A therapist is always honest and transparent with her clients and never lies to them. Which ethics principle is this?","right":"Integrity","wrong":[["Fidelity and responsibility to the client's trust","That is building trust and responsibility."],["Justice","That is fairness."],["Respect for rights","That is privacy and choice."]],"exp":"Honesty, accuracy and transparency."},{"q":"A therapist accurately explains to a client what a treatment can and can't do. Which principle is she following?","right":"Integrity","wrong":[["Respect for rights and dignity, including the client's privacy","That is about privacy and choice."],["Justice","That is fairness."],["Fidelity","That is trust and responsibility."]],"exp":"Honesty, accuracy and transparency."},{"q":"Which action violates integrity?","right":"Lying about a treatment's results","wrong":[["Breaking confidentiality because a client threatens to harm someone","That is the allowed exception."],["Using group therapy","Not a violation."],["Referring to a psychiatrist","Not a violation."]],"exp":"No lying to the client."}]},{"term":"Justice","def":"Treat everyone equally; ensure fairness and equal access for all clients.","hook":"","asks":[{"q":"A clinic makes sure every client gets the same quality of care, no matter their background or income. Which ethics principle is this?","right":"Justice","wrong":[["Integrity, being honest and transparent with clients","That is honesty."],["Fidelity","That is trust."],["Beneficence","That is doing no harm."]],"exp":"Fairness and equal access for all clients."},{"q":"A clinic offers interpreters and sliding-scale fees so everyone can get care. Which principle is this?","right":"Justice","wrong":[["Integrity, being honest and transparent with all of its clients","That is honesty."],["Fidelity","That is trust."],["Beneficence","That is doing no harm."]],"exp":"Fairness and equal access for all clients."},{"q":"A therapist gives better care to clients she likes. Which principle is violated?","right":"Justice","wrong":[["Integrity, since she is not being honest with her clients","The issue is unequal treatment."],["Respect for rights","That is privacy and choice."],["Fidelity","That is trust and responsibility."]],"exp":"Treat everyone equally."}]}]},{"name":"Psychodynamic therapies","cards":[{"term":"Psychodynamic therapies","def":"Therapies that try to uncover the unconscious mind: free association and dream interpretation.","hook":"","asks":[{"q":"Which therapies try to uncover the unconscious mind through free association and dream interpretation?","right":"Psychodynamic therapies","wrong":[["Cognitive therapies that challenge negative thinking","Those focus on conscious thoughts."],["Behavioral therapies","Those use conditioning."],["Humanistic therapies","Those focus on growth and acceptance."]],"exp":"Psychodynamic therapies uncover the unconscious."},{"q":"A therapist believes a client's anxiety comes from hidden childhood conflicts and asks about his dreams. Which kind of therapy is this?","right":"Psychodynamic","wrong":[["Cognitive, which challenges conscious negative thinking patterns","Cognitive works on conscious thoughts."],["Behavioral","That uses conditioning."],["Humanistic","That focuses on growth and acceptance."]],"exp":"Psychodynamic therapies uncover the unconscious."},{"q":"Which two techniques belong to psychodynamic therapies?","right":"Free association, dream interpretation","wrong":[["Token economies and biofeedback from the behavioral therapies","Those are behavioral."],["Socratic questioning, fear hierarchies","Those are cognitive."],["Active listening, UPR","Those are humanistic."]],"exp":"Both try to uncover the unconscious."}]},{"term":"Free association","def":"A way to explore the unconscious: the person relaxes and says whatever comes to mind, no matter how trivial or embarrassing, while the psychologist sits out of the patient's line of vision. The therapist interprets, or helps the patient interpret, the missing pieces.","hook":"","asks":[{"q":"A patient lies on a couch and says whatever comes to mind, no matter how embarrassing. Which technique is this?","right":"Free association","wrong":[["Socratic questioning that challenges the patient's thoughts","That challenges thoughts with questions."],["Active listening","That is the therapist echoing and clarifying."],["Biofeedback","That uses sensors."]],"exp":"A way to explore the unconscious."},{"q":"Picture a free association session from your slides. Where does the psychologist sit, and what does the patient do?","right":"Out of view; patient says whatever comes to mind","wrong":[["Face to face, asking the patient deep questions that challenge each belief","That is Socratic questioning."],["Beside a screen showing the patient's heart rate","That is biofeedback."],["Across a table, handing out tokens for answers","That is a token economy."]],"exp":"The patient relaxes and says whatever comes to mind while the psychologist sits out of the patient's line of vision."},{"q":"A patient says whatever comes to mind, even embarrassing things, and the therapist helps interpret the missing pieces. Which technique is this?","right":"Free association","wrong":[["Active listening, echoing and restating what the client says","That is humanistic and doesn't interpret the unconscious."],["Cognitive restructuring","That replaces thoughts."],["Systematic desensitization","That is behavioral."]],"exp":"Free association explores the unconscious."}]},{"term":"Resistance","def":"When the patient is unable to remember details or goes blank during free association: a mental block.","hook":"","asks":[{"q":"During free association, a patient suddenly goes blank whenever her father comes up. What is this called?","right":"Resistance","wrong":[["Hypervigilance, always being on guard for danger","That is a PTSD symptom."],["Flat affect","That is no emotional expression."],["Congruence","That is the therapist being genuine."]],"exp":"A mental block during free association."},{"q":"Which situation shows resistance?","right":"A patient suddenly can't recall details","wrong":[["A client happily follows every one of the therapist's instructions","That isn't a mental block."],["A therapist echoes feelings","That is active listening."],["A patient earns tokens","That is a token economy."]],"exp":"Resistance is a mental block during free association."},{"q":"In which therapy is \"resistance\" a key idea?","right":"Psychodynamic therapy","wrong":[["Behavioral therapy that relies on tokens and rewards for change","Resistance is a psychodynamic concept."],["Biomedical therapy","Not a drug concept."],["Person-centered therapy","Not on your slides for that therapy."]],"exp":"Resistance appears during free association."}]},{"term":"Dream interpretation","def":"Exploring the symbolic meaning of dreams to uncover unconscious material. Dreams are seen as a window into the unconscious, revealing hidden desires, fears, and unresolved conflicts.","hook":"","asks":[{"q":"A therapist asks what a patient's recurring dream about falling might symbolize. Which technique is this?","right":"Dream interpretation","wrong":[["Cognitive restructuring of the patient's negative thoughts","That challenges thoughts."],["Systematic desensitization","That is behavioral."],["Token economy","That is behavioral."]],"exp":"Dreams as a window into the unconscious."},{"q":"A therapist says a patient's dream of being chased reveals a hidden fear he hasn't faced. Which belief underlies this?","right":"Dreams are a window into the unconscious","wrong":[["Dreams are just random brain activity with no meaning at all","Dream interpretation assumes they have hidden meaning."],["Dreams predict the future","That would be precognition."],["Dreams come from SSRIs","Not related."]],"exp":"Dreams reveal hidden desires, fears and conflicts."},{"q":"Which therapist would most likely use dream interpretation?","right":"A psychodynamic therapist","wrong":[["A behavioral therapist building a fear hierarchy for exposure","That is behavioral."],["A psychiatrist prescribing lithium","That is biomedical."],["A CBT therapist","CBT works on conscious thoughts."]],"exp":"Dream interpretation is psychodynamic."}]},{"term":"Hypnosis","def":"Used by Freud to uncover the unconscious, but research shows it is NOT a valid way to retrieve memories or regress in age. Today it's used to treat pain and anxiety by inducing relaxation and focused attention.","hook":"","asks":[{"q":"A TV show claims hypnosis can recover hidden childhood memories. What does research say?","right":"It is NOT a valid way to recover memories","wrong":[["It is the best way to recover memories from early childhood","Research says it isn't valid for that."],["It cures schizophrenia","Not on your slides."],["It only works on children","Not on your slides."]],"exp":"Today hypnosis is used for pain and anxiety, not memory recovery."},{"q":"What is hypnosis used for today, according to your slides?","right":"Treating pain and anxiety","wrong":[["Recovering hidden memories from early childhood accurately","Research says it's NOT valid for that."],["Curing schizophrenia","Not on your slides."],["Age regression","Research says it's not valid."]],"exp":"Today it's used for pain and anxiety by inducing relaxation."},{"q":"Who used hypnosis to try to uncover the unconscious?","right":"Freud","wrong":[["Rogers, who developed client-centered (person-centered) therapy","Rogers developed person-centered therapy."],["Beck","Beck developed a cognitive theory."],["Ellis","Ellis developed REBT."]],"exp":"Freud used hypnosis."}]}]},{"name":"Humanistic therapies","cards":[{"term":"Person-centered (client-centered) therapy","def":"The most widely used humanistic therapy, developed by Carl Rogers. Non-directive: the therapist offers acceptance, genuineness, and empathy and shows unconditional positive regard so the client can express their true feelings.","hook":"Rogers = client-centered.","asks":[{"q":"A therapist offers acceptance, genuineness and empathy and lets the client lead the session. Which therapy is this?","right":"Person-centered therapy","wrong":[["Cognitive behavioral therapy with homework and goals","CBT is directive and structured."],["Psychoanalysis","That interprets the unconscious."],["Aversion therapy","That is behavioral."]],"exp":"Carl Rogers' non-directive humanistic therapy."},{"q":"Who developed person-centered therapy?","right":"Carl Rogers","wrong":[["Albert Ellis, who developed rational emotive behavior therapy","Ellis developed REBT."],["Aaron Beck","Beck's theory is cognitive."],["Hans Eysenck","Eysenck studied therapy outcomes."]],"exp":"Rogers = client-centered."},{"q":"Which is the most widely used humanistic therapy?","right":"Person-centered therapy","wrong":[["Psychoanalysis, the therapy based on uncovering the unconscious","That is psychodynamic."],["REBT","That is cognitive behavioral."],["Aversion therapy","That is behavioral."]],"exp":"The most widely used humanistic therapy, developed by Carl Rogers."}]},{"term":"Non-directive therapy","def":"The therapist just listens, without directing, judging, or interpreting.","hook":"","asks":[{"q":"A therapist simply listens without judging, interpreting or telling the client what to do. What kind of therapy is this?","right":"Non-directive","wrong":[["Directive, with the therapist guiding each step","This therapist doesn't direct."],["Aversive","That pairs unpleasant states with behavior."],["Biomedical","That uses drugs."]],"exp":"The therapist listens without directing."},{"q":"A client asks, \"What should I do?\" The therapist answers, \"What do you feel is right?\" Which style is this?","right":"Non-directive","wrong":[["Directive, with the therapist telling the client exactly what to do","The therapist doesn't direct."],["Aversive","That is behavioral."],["Biomedical","That uses drugs."]],"exp":"The therapist listens without directing, judging or interpreting."},{"q":"Which therapy is non-directive?","right":"Person-centered therapy","wrong":[["REBT, where the therapist confronts the client's irrational beliefs","REBT is confrontational."],["Token economy","That is structured rewards."],["Systematic desensitization","That is structured exposure."]],"exp":"Person-centered therapy is non-directive."}]},{"term":"Unconditional positive regard","def":"A caring, accepting, nonjudgmental attitude: accepting and valuing the client as a person even if their thoughts, feelings, or behaviors aren't always approved of.","hook":"","asks":[{"q":"A client admits to something shameful, and the therapist still treats him with warmth and acceptance. What is she showing?","right":"Unconditional positive regard","wrong":[["Resistance, a block that comes up during therapy","That is a patient's mental block."],["Socratic questioning","That challenges thoughts."],["Congruence alone","That is being genuine; this is acceptance."]],"exp":"Accepting and valuing the client as a person."},{"q":"A client admits he relapsed into drinking. The therapist still treats him with warmth and acceptance as a person. What is this?","right":"Unconditional positive regard","wrong":[["Aversion therapy that pairs drinking with feeling sick afterward","That is behavioral."],["Resistance","That is a mental block."],["Integrity","That is honesty."]],"exp":"Accepting and valuing the client as a person."},{"q":"Does unconditional positive regard mean the therapist approves of everything the client does?","right":"No; she values the person, not every act","wrong":[["Yes; she must agree with every thought and action the client has","She accepts the person even if behaviors aren't approved of."],["Yes, unless they're in a group","Not a rule."],["No; she judges them harshly","It's nonjudgmental."]],"exp":"Accepting the client as a person even if behaviors aren't always approved of."}]},{"term":"Empathy, congruence, UPR","def":"The three parts of person-centered therapy. Empathy: understanding the client's perspective. Congruence: the counselor is genuine, open, and real. Unconditional positive regard: nonjudgmental acceptance.","hook":"","asks":[{"q":"Which three parts make up person-centered therapy?","right":"Empathy, congruence, unconditional positive regard","wrong":[["Mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness","Those are DBT skills."],["Alarm, resistance, exhaustion","Those are GAS stages."],["Obsession, compulsion, relief","That is the OCD cycle."]],"exp":"Understanding, genuineness and acceptance."},{"q":"A counselor is open and genuine with a client rather than putting on a professional act. Which part of person-centered therapy is this?","right":"Congruence","wrong":[["Unconditional positive regard, accepting the client without judgment","That is acceptance."],["Empathy","That is understanding the client's view."],["Resistance","That is a psychodynamic block."]],"exp":"Congruence: genuine, open, real."},{"q":"A therapist tries to see the situation from the client's point of view. Which part of person-centered therapy is this?","right":"Empathy","wrong":[["Congruence, being genuine and open with the client at all times","That is genuineness."],["Unconditional positive regard","That is acceptance."],["Integrity","That is an ethics principle."]],"exp":"Empathy: understanding the client's perspective."}]},{"term":"Active listening","def":"Empathetic listening in which the listener echoes, restates, and clarifies. A central part of Rogers' client-centered therapy.","hook":"","asks":[{"q":"A therapist says, \"So what I'm hearing is that you feel ignored at home. Is that right?\" What technique is this?","right":"Active listening","wrong":[["Free association, saying whatever comes to mind","That is the patient speaking freely."],["Dream interpretation","That is psychodynamic."],["Aversion therapy","That is behavioral."]],"exp":"Echoing, restating and clarifying."},{"q":"Which response is active listening?","right":"\"So you feel left out. Is that right?\"","wrong":[["\"That belief is irrational, and here is why you should drop it.\"","That is REBT-style confrontation."],["\"Tell me about your dreams.\"","That is psychodynamic."],["\"You'll earn a token.\"","That is a token economy."]],"exp":"Echo, restate, clarify."},{"q":"Active listening is a central part of which therapy?","right":"Rogers' client-centered therapy","wrong":[["Ellis's rational emotive behavior therapy for irrational beliefs","REBT confronts beliefs."],["Antabuse treatment","That is aversion therapy."],["ECT","That is biomedical."]],"exp":"Active listening is central to Rogers' client-centered therapy."}]}]},{"name":"Cognitive therapies","cards":[{"term":"Cognitive therapy","def":"Teaches people new, more adaptive ways of thinking and acting. Based on the idea that thoughts come between events and our emotional reactions. Methods: cognitive restructuring and fear hierarchies.","hook":"","asks":[{"q":"A therapist teaches a client that his thoughts about events, not the events themselves, drive his feelings. Which therapy is this?","right":"Cognitive therapy","wrong":[["Psychodynamic therapy exploring the unconscious mind","That digs into the unconscious."],["Biomedical therapy","That uses drugs."],["Token economy","That uses rewards."]],"exp":"Thoughts come between events and emotions."},{"q":"What is the core idea of cognitive therapy?","right":"Thoughts come between events and emotions","wrong":[["Emotions come only from hidden childhood memories we can't reach","That is psychodynamic."],["Behavior comes only from rewards","That is behavioral."],["Chemical imbalances cause everything","That is biomedical."]],"exp":"Cognitive therapy: change thoughts to change emotional reactions."},{"q":"Which two methods does cognitive therapy use, according to your slides?","right":"Cognitive restructuring and fear hierarchies","wrong":[["Free association and dream interpretation in long weekly sessions","Those are psychodynamic."],["Token economy, Antabuse","Those are behavioral."],["ECT, rTMS","Those are biomedical."]],"exp":"Methods: cognitive restructuring and fear hierarchies."}]},{"term":"Cognitive restructuring","def":"A method for changing how people think: recognizing and challenging pessimistic thoughts (\"I'm never going to make it\") and replacing them with positive ones (\"I can succeed if I try\").","hook":"","asks":[{"q":"A therapist helps a client replace \"I'll never make it\" with \"I can improve if I keep practicing.\" Which method is this?","right":"Cognitive restructuring","wrong":[["Systematic desensitization with a fear hierarchy","That is behavioral exposure."],["Free association","That is psychodynamic."],["Token economy","That is behavioral."]],"exp":"Challenging and replacing pessimistic thoughts."},{"q":"A student thinks, \"I bombed one test, so I'll fail out of school.\" Which response is cognitive restructuring?","right":"\"One test doesn't decide my grade; I can improve.\"","wrong":[["\"Let's look at what your dreams about school might mean to you.\"","That is psychodynamic."],["\"You'll earn a sticker for each study hour.\"","That is a token economy."],["\"Let's practice relaxing first.\"","That is part of systematic desensitization."]],"exp":"Challenge the pessimistic thought and replace it with a positive one."},{"q":"Which pair shows the two steps of cognitive restructuring?","right":"Challenge a thought, then replace it","wrong":[["Relax first, and then face each feared situation one step at a time","That is systematic desensitization."],["Earn tokens, trade for rewards","That is a token economy."],["Free associate, then interpret","That is psychodynamic."]],"exp":"Recognize and challenge pessimistic thoughts, then replace them."}]},{"term":"Socratic questioning","def":"A cognitive restructuring strategy: asking deep questions to challenge your thoughts, like \"What evidence supports my belief?\" or \"How might another person view this differently?\"","hook":"","asks":[{"q":"A therapist asks, \"What evidence do you have that everyone hates you?\" Which strategy is this?","right":"Socratic questioning","wrong":[["Active listening, restating what the client said","That echoes; this challenges."],["Dream interpretation","That is psychodynamic."],["Biofeedback","That uses sensors."]],"exp":"Deep questions that challenge thoughts."},{"q":"A therapist asks, \"How might your best friend see this situation differently?\" Which strategy is this?","right":"Socratic questioning","wrong":[["Unconditional positive regard toward the client's every feeling","That is acceptance, not challenging thoughts."],["Free association","That is saying whatever comes to mind."],["Biofeedback","That uses body sensors."]],"exp":"Deep questions that challenge your thoughts."},{"q":"Socratic questioning is a strategy within which method?","right":"Cognitive restructuring","wrong":[["Systematic desensitization with relaxation and a fear hierarchy","That is behavioral exposure."],["Dream interpretation","That is psychodynamic."],["Token economy","That is behavioral."]],"exp":"It's a cognitive restructuring strategy."}]},{"term":"Fear hierarchy","def":"A list of feared situations ranked from least to most anxiety-provoking, used in exposure therapy so people can gradually face their fears in a controlled, safe way.","hook":"","asks":[{"q":"A therapist and client list feared situations from \"seeing a photo of a dog\" up to \"petting a dog.\" What did they make?","right":"A fear hierarchy","wrong":[["A token economy chart of rewards for good behavior","That rewards behavior."],["A negative cognitive triad","That is negative thoughts."],["An ACE list","That lists childhood trauma."]],"exp":"Feared situations ranked from least to most anxiety-provoking."},{"q":"A client afraid of dogs ranks situations from \"seeing a dog picture\" up to \"petting a dog.\" How is this list used?","right":"To face fears gradually, least to most","wrong":[["To decide which dog-related dreams to interpret in the next session","That is psychodynamic."],["To earn tokens","That is a token economy."],["To set medication doses","Not related."]],"exp":"Fear hierarchies let people face fears gradually in a safe way."},{"q":"Which therapy builds a fear hierarchy and adds relaxation techniques?","right":"Systematic desensitization","wrong":[["Aversion therapy, which pairs an unwanted behavior with discomfort","That is the opposite."],["REBT","That confronts beliefs."],["Person-centered therapy","That is non-directive."]],"exp":"Systematic desensitization: fear hierarchy plus relaxation."}]},{"term":"Beck's cognitive theory of depression","def":"Aaron Beck: faulty information processing and core irrational beliefs make people vulnerable to depression. Depressed people develop a negative cognitive triad.","hook":"","asks":[{"q":"Which theory says depressed people develop negative ways of thinking about themselves, the world and the future?","right":"Beck's cognitive theory of depression","wrong":[["The dopamine hypothesis about chemical imbalance","That explains schizophrenia."],["The diathesis-stress model","That is stress plus predisposition."],["Gate control theory","That is about pain."]],"exp":"Aaron Beck: faulty information processing and the negative triad."},{"q":"According to Aaron Beck, what makes people vulnerable to depression?","right":"Faulty processing and irrational beliefs","wrong":[["Low dopamine levels in the brain's reward pathway and nothing else","Beck's theory is cognitive."],["Unconscious childhood conflicts","That is psychodynamic."],["Lack of rewards","That is behavioral."]],"exp":"Faulty information processing and core irrational beliefs."},{"q":"Which pattern do depressed people develop, according to Beck?","right":"A negative cognitive triad","wrong":[["A fear hierarchy ranked from least to most anxiety-provoking","That is used in exposure therapy."],["A token economy","That is behavioral."],["A therapeutic alliance","That is the bond with a therapist."]],"exp":"Negative thoughts about self, world and future."}]},{"term":"Negative cognitive triad","def":"Negative thoughts about yourself (\"I'm worthless\"), the world (\"No one cares about me\"), and the future (\"Things will never get better\").","hook":"Me, the world, the future.","asks":[{"q":"A depressed teen thinks, \"I'm worthless, nobody cares about me, and it will never get better.\" What does this show?","right":"The negative cognitive triad","wrong":[["A delusion of persecution that others are out to get him","These are negative thoughts, not paranoid beliefs."],["Word salad","His speech is organized."],["The OCD cycle","Not related."]],"exp":"Me, the world, the future."},{"q":"\"Things will never get better\" is a negative thought about which part of the triad?","right":"The future","wrong":[["Yourself, as in thinking you are worthless or a failure","That would be \"I'm worthless.\""],["The world","That would be \"No one cares about me.\""],["Your past","The triad is self, world, future."]],"exp":"Me, the world, the future."},{"q":"\"No one cares about me\" is a negative thought about which part of the triad?","right":"The world","wrong":[["The future, as in thinking nothing will ever improve","That would be \"Things will never get better.\""],["Yourself","That would be \"I'm worthless.\""],["Your family only","The triad is self, world, future."]],"exp":"Me, the world, the future."}]}]},{"name":"Behavioral therapies","cards":[{"term":"Behavioral therapies","def":"Therapies that apply conditioning principles: exposure therapies, aversion therapy, token economies, and biofeedback.","hook":"","asks":[{"q":"Which therapies apply conditioning principles, like exposure, aversion and token economies?","right":"Behavioral therapies","wrong":[["Humanistic therapies built on acceptance and empathy","Those focus on acceptance."],["Psychodynamic therapies","Those explore the unconscious."],["Biomedical therapies","Those use drugs."]],"exp":"Behavioral therapies use conditioning."},{"q":"Which list contains only behavioral therapies?","right":"Exposure, aversion, token economy, biofeedback","wrong":[["Free association, dream interpretation, hypnosis and active listening","Those are psychodynamic and humanistic."],["CBT, DBT, REBT","Those are cognitive behavioral."],["ECT, rTMS, lithium","Those are biomedical."]],"exp":"Behavioral therapies apply conditioning principles."},{"q":"What principle do all behavioral therapies apply?","right":"Conditioning","wrong":[["Uncovering the unconscious through dreams and free association","That is psychodynamic."],["Changing chemical imbalances","That is biomedical."],["Unconditional positive regard","That is humanistic."]],"exp":"Behavioral therapies apply conditioning principles."}]},{"term":"Exposure therapy","def":"Exposing people to what they would normally avoid. Your slide links it to Peter and the rabbit.","hook":"","asks":[{"q":"A therapist has a client who fears elevators ride one, again and again, until the fear fades. Which therapy is this?","right":"Exposure therapy","wrong":[["Aversion therapy, pairing a behavior with discomfort","That makes something unpleasant."],["Free association","That is psychodynamic."],["Person-centered therapy","That is humanistic."]],"exp":"Facing what you would normally avoid."},{"q":"Your slide links exposure therapy to which classic example?","right":"Peter and the rabbit","wrong":[["Phineas Gage and the iron rod through his prefrontal cortex","That is a brain-damage case."],["Split-brain patients","Those are about the hemispheres."],["The café example","That is about sampling."]],"exp":"Peter and the rabbit."},{"q":"A client who fears crowds is helped to spend more and more time in busy places until the fear fades. Which therapy is this?","right":"Exposure therapy","wrong":[["Aversion therapy, making the feared thing feel even more unpleasant","Aversion makes an unwanted behavior unpleasant."],["Dream interpretation","That is psychodynamic."],["Token economy","That uses rewards."]],"exp":"Exposing people to what they would normally avoid."}]},{"term":"Systematic desensitization","def":"Creating a fear hierarchy (from least scary to most scary) and learning relaxation techniques.","hook":"","asks":[{"q":"A client learns relaxation techniques, then works up a fear hierarchy step by step while staying relaxed. Which therapy is this?","right":"Systematic desensitization","wrong":[["Aversion therapy, the opposite kind of conditioning","Aversion makes things unpleasant; this makes fears calm."],["Token economy","That rewards behavior."],["Dream interpretation","That is psychodynamic."]],"exp":"A fear hierarchy plus relaxation."},{"q":"Which two ingredients define systematic desensitization?","right":"A fear hierarchy and relaxation","wrong":[["Antabuse and a pleasant behavior that the client wants to stop doing","That is aversion therapy."],["Tokens and privileges","That is a token economy."],["Dreams and free association","That is psychodynamic."]],"exp":"Least scary to most scary, while staying relaxed."},{"q":"Why is aversion therapy called the opposite of systematic desensitization?","right":"One adds discomfort; the other removes fear","wrong":[["One uses medication while the other uses only talk therapy sessions","Both are behavioral conditioning methods."],["They treat the same disorder","They work in opposite directions."],["One is humanistic","Both are behavioral."]],"exp":"Desensitization pairs fears with calm; aversion pairs a behavior with discomfort."}]},{"term":"Aversion therapy","def":"A type of counterconditioning that pairs an unpleasant state with an unwanted behavior. The opposite of systematic desensitization. Most common example: Antabuse for alcoholism.","hook":"","asks":[{"q":"A man trying to quit nail-biting paints his nails with a bitter-tasting polish. Which therapy does this match?","right":"Aversion therapy","wrong":[["Systematic desensitization through gradual relaxation","That reduces fear; this makes a habit unpleasant."],["Token economy","That gives rewards."],["Biofeedback","That uses sensors."]],"exp":"Pairing an unpleasant state with an unwanted behavior."},{"q":"A smoker gets a mild unpleasant shock each time he reaches for a cigarette. Which therapy does this match?","right":"Aversion therapy","wrong":[["Systematic desensitization through relaxation and a fear hierarchy","That reduces fear, not unwanted behavior."],["Token economy","That gives rewards."],["ECT","ECT causes a seizure to treat depression."]],"exp":"Pairing an unpleasant state with an unwanted behavior."},{"q":"What kind of conditioning is aversion therapy?","right":"Counterconditioning","wrong":[["Operant conditioning with rewards like tokens and privileges","That is a token economy."],["Biofeedback","That is control of body responses."],["Free association","That is psychodynamic."]],"exp":"Aversion therapy is a type of counterconditioning."}]},{"term":"Antabuse","def":"A drug that makes people feel physically ill if they drink alcohol, pairing a negative outcome with a previously pleasant stimulus. An example of aversion therapy.","hook":"","asks":[{"q":"A patient takes a drug that makes him feel sick if he drinks alcohol. What is it, and what therapy does it represent?","right":"Antabuse, for aversion therapy","wrong":[["Lithium, a mood stabilizer used for bipolar disorder","Lithium treats bipolar disorder."],["Prozac, for exposure therapy","Prozac is an antidepressant."],["Xanax, for token economy","Xanax is anti-anxiety."]],"exp":"Antabuse pairs drinking with feeling sick."},{"q":"Why does Antabuse help some people stop drinking?","right":"Drinking now makes them feel sick","wrong":[["It blocks dopamine so that alcohol no longer feels rewarding at all","Not how it's described on your slides."],["It increases GABA","That is anti-anxiety drugs."],["It replaces alcohol","Not how it works."]],"exp":"Pairs a negative outcome with a previously pleasant stimulus."},{"q":"Antabuse is the most common example of which therapy?","right":"Aversion therapy","wrong":[["Systematic desensitization for phobias and other intense fears","That reduces fears."],["Biomedical treatment for bipolar","That is lithium."],["Token economy","That uses rewards."]],"exp":"Antabuse for alcoholism = aversion therapy."}]},{"term":"Token economy","def":"An operant conditioning procedure that rewards a desired behavior: the patient earns tokens for the desired behavior and exchanges them for privileges or treats (5 gold stars = treasure box).","hook":"","asks":[{"q":"In a hospital unit, patients earn points for making their beds and trade them for privileges. What procedure is this?","right":"A token economy","wrong":[["Aversion therapy that makes the behavior unpleasant","That punishes; this rewards."],["Free association","That is psychodynamic."],["rTMS","That is a brain treatment."]],"exp":"Operant conditioning with tokens for desired behavior."},{"q":"A child earns a gold star for each completed chore and trades five for a toy. Which procedure is this?","right":"A token economy","wrong":[["Aversion therapy that makes skipping chores very unpleasant","No unpleasant state is used."],["Biofeedback","No sensors are used."],["Free association","That is psychodynamic."]],"exp":"5 gold stars = treasure box."},{"q":"A token economy is based on which kind of conditioning?","right":"Operant conditioning","wrong":[["Counterconditioning, like the aversion therapy of Antabuse","That is aversion therapy."],["Biomedical conditioning","Not a type on your slides."],["Unconditional positive regard","That is humanistic."]],"exp":"It rewards desired behavior."}]},{"term":"Biofeedback","def":"Based on conditioning principles: people learn to consciously control physiological responses like heart rate and muscle tension. Sensors monitor the body, the data is fed back to the person, and through practice they learn to influence those responses.","hook":"","asks":[{"q":"Sensors show a patient her heart rate on a screen so she can learn to slow it on purpose. What technique is this?","right":"Biofeedback","wrong":[["rTMS, which uses magnetic pulses on the brain","That stimulates neurons with magnets."],["ECT","That uses electric current."],["Hypnosis","That induces relaxation, not feedback from sensors."]],"exp":"Learning to consciously control physiological responses."},{"q":"Which part of biofeedback lets the person learn to control a body response?","right":"Seeing their own body data","wrong":[["Taking a medication that slows the heart down automatically","Biofeedback uses practice, not drugs."],["Being hypnotized","Not biofeedback."],["Talking about dreams","Not biofeedback."]],"exp":"Sensors feed data back; with practice they learn to influence it."},{"q":"Which response could a person learn to control through biofeedback?","right":"Heart rate","wrong":[["Their genetic predisposition to developing a disorder later on","Genes can't be controlled this way."],["Their dreams","Not on your slides."],["Other people's behavior","Not related."]],"exp":"Physiological responses like heart rate and muscle tension."}]}]},{"name":"Cognitive behavioral therapies","cards":[{"term":"Cognitive behavioral therapy (CBT)","def":"Applies both behavioral and cognitive principles. The idea: people's thinking influences their emotions and behavior.","hook":"","asks":[{"q":"A therapist helps a client change both her negative thoughts and her avoidance behaviors. Which therapy is this?","right":"CBT","wrong":[["Psychoanalysis, uncovering unconscious conflicts","That explores the unconscious."],["Person-centered therapy","That is non-directive."],["ECT","That is a brain treatment."]],"exp":"CBT applies both cognitive and behavioral principles."},{"q":"A therapist helps a client notice anxious thoughts and also practice going to parties step by step. Which therapy combines these?","right":"CBT","wrong":[["Psychoanalysis, exploring unconscious childhood conflicts and dreams","That doesn't target thoughts and behaviors directly."],["Person-centered therapy","That is non-directive."],["rTMS","That is biomedical."]],"exp":"CBT applies both cognitive and behavioral principles."},{"q":"What is the core idea behind CBT?","right":"Thinking shapes emotions and behavior","wrong":[["Behavior comes only from rewards and has nothing to do with thinking","CBT says thinking matters."],["The unconscious drives everything","That is psychodynamic."],["Only drugs can help","Not CBT."]],"exp":"People's thinking influences their emotions and behavior."}]},{"term":"Dialectical behavior therapy (DBT)","def":"A modified form of CBT that helps people manage intense emotions, improve relationships, and build a life worth living. Originally developed for borderline personality disorder.","hook":"DBT = borderline.","asks":[{"q":"A modified form of CBT helps a client with borderline personality disorder manage intense emotions. Which therapy is this?","right":"DBT","wrong":[["REBT, which confronts irrational beliefs head-on","REBT is Ellis's approach."],["Psychoanalysis","That is psychodynamic."],["Aversion therapy","That is behavioral."]],"exp":"DBT was originally developed for borderline personality disorder."},{"q":"DBT is a modified form of which therapy?","right":"CBT","wrong":[["Psychoanalysis, the therapy of free association and dreams","DBT is based on CBT."],["Person-centered therapy","DBT is based on CBT."],["Aversion therapy","DBT is based on CBT."]],"exp":"DBT is a modified form of CBT."},{"q":"Which goals fit DBT?","right":"Manage emotions, improve relationships","wrong":[["Uncover unconscious conflicts through dreams and free association","That is psychodynamic."],["Stop drinking through Antabuse","That is aversion therapy."],["Earn tokens","That is a token economy."]],"exp":"Manage intense emotions, improve relationships, build a life worth living."}]},{"term":"The 4 DBT skills","def":"Mindfulness (being aware of the present moment without judgment), distress tolerance (managing a crisis without making it worse), emotion regulation (understanding and changing emotions), and interpersonal effectiveness (getting needs met and keeping relationships).","hook":"","asks":[{"q":"Which list shows the four DBT skills?","right":"Mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness","wrong":[["Empathy, congruence, unconditional positive regard, active listening, free association","Those are mostly person-centered parts."],["Obsession, distress, compulsion, relief","That is the OCD cycle."],["Alarm, resistance, exhaustion","Those are GAS stages."]],"exp":"Mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness."},{"q":"During a crisis, a client gets through without making things worse. Which DBT skill is she using?","right":"Distress tolerance","wrong":[["Interpersonal effectiveness, keeping relationships while getting needs met","That is about relationships."],["Mindfulness","That is present-moment awareness."],["Emotion regulation","That is understanding and changing emotions."]],"exp":"Distress tolerance: managing a crisis without making it worse."},{"q":"A client asks a friend for help while keeping the friendship strong. Which DBT skill is this?","right":"Interpersonal effectiveness","wrong":[["Distress tolerance, getting through a crisis without making it worse","That is about crises."],["Mindfulness","That is awareness without judgment."],["Emotion regulation","That is changing emotions."]],"exp":"Getting needs met and keeping relationships."}]},{"term":"Rational emotive behavior therapy (REBT)","def":"Developed by Ellis: people engage in false self-talk, and changing their beliefs changes their emotions. The therapist confronts the client's irrational beliefs. Mainly used for anxiety. Steps: identify, challenge, and replace irrational beliefs.","hook":"REBT = confront.","asks":[{"q":"A therapist bluntly challenges a client's belief that he must be perfect, saying it's irrational. Which therapy is this?","right":"REBT","wrong":[["Person-centered therapy, which accepts without judging","That is non-directive and accepting."],["Free association","That is psychodynamic."],["Token economy","That is behavioral."]],"exp":"Ellis: changing beliefs changes emotions."},{"q":"What are the three steps of REBT?","right":"Identify, challenge, replace","wrong":[["Relax, rank fears from least to most, and then face each one in turn","That is systematic desensitization."],["Echo, restate, clarify","That is active listening."],["Alarm, resist, exhaust","Those are GAS stages."]],"exp":"Identify, challenge and replace irrational beliefs."},{"q":"REBT is mainly used for which problem?","right":"Anxiety","wrong":[["Schizophrenia's positive symptoms like hallucinations and delusions","Those are treated with antipsychotics."],["Alcoholism","That is often aversion therapy."],["Bipolar disorder","That is lithium."]],"exp":"Mainly used for anxiety."}]}]},{"name":"Modes of therapy","cards":[{"term":"Modes of therapy","def":"How therapy is delivered, not the type of therapy used: individual or group.","hook":"","asks":[{"q":"Individual and group therapy describe what, rather than the type of therapy?","right":"How therapy is delivered","wrong":[["Which disorders the therapy is able to treat and cure","Modes are about delivery."],["Which drugs are prescribed","Not related."],["How long therapy lasts","Not what modes describe."]],"exp":"Modes: individual or group."},{"q":"A client asks whether she'll get CBT or person-centered therapy. Is that a question about the \"mode\" of therapy?","right":"No; mode is individual or group","wrong":[["Yes; mode means the type of therapy, like CBT or psychoanalysis","Mode is how therapy is delivered."],["Yes, if it's biomedical","Mode isn't the type."],["Mode means the medication","Mode is individual or group."]],"exp":"Modes: how therapy is delivered (individual or group), not the type."},{"q":"Which choice is about the mode of therapy?","right":"Individual vs. group","wrong":[["CBT vs. REBT, two different cognitive behavioral approaches","That is the type of therapy."],["SSRIs vs. lithium","Those are drugs."],["ECT vs. rTMS","Those are biomedical treatments."]],"exp":"Modes are individual or group."}]},{"term":"Group therapy","def":"A therapist works with a small group with similar problems. People see they aren't the only ones, it's cheaper, they can work on coping skills together, and it relieves isolation.","hook":"","asks":[{"q":"Five people who have lost a loved one meet weekly with a therapist and realize they aren't alone. Which mode is this?","right":"Group therapy","wrong":[["Individual therapy, one-on-one with a therapist","There are five clients here."],["Biomedical therapy","That uses drugs."],["Aversion therapy","That is a type, not a mode."]],"exp":"Cheaper, reduces isolation, shows you aren't the only one."},{"q":"A teen with social anxiety joins a group of peers with the same problem. Which benefit of group therapy does this give him?","right":"He sees he isn't the only one","wrong":[["He gets fully personalized one-on-one attention every week","That is individual therapy."],["It's more private","Groups are less private."],["He gets medication","That is biomedical."]],"exp":"Group therapy shows people they aren't alone, is cheaper, and relieves isolation."},{"q":"Why might a clinic recommend group therapy to a client on a tight budget?","right":"It's cheaper","wrong":[["It is more personalized than any other kind of therapy","That is individual therapy."],["It never needs a therapist","A therapist leads it."],["It replaces medication","Not on your slides."]],"exp":"Group therapy is cheaper."}]},{"term":"Individual therapy","def":"One-on-one with a therapist. Personalized, more intimate, and flexible in scheduling, but very expensive. Some disorders can't be treated well in a group, so individual therapy is preferred.","hook":"","asks":[{"q":"A client needs a personalized, private approach and flexible scheduling, and can afford it. Which mode fits best?","right":"Individual therapy","wrong":[["Group therapy, which is cheaper and less private","It is less personalized and private."],["Deinstitutionalization","That is history."],["Pharmacology","That is drugs."]],"exp":"One-on-one: personalized but expensive."},{"q":"Which is a drawback of individual therapy on your slides?","right":"It's very expensive","wrong":[["It is less personalized than group therapy for most clients","It's more personalized."],["It's less flexible","It's more flexible."],["It can't treat any disorder","It treats many."]],"exp":"Personalized, intimate and flexible, but very expensive."},{"q":"Why might a therapist choose individual over group therapy for a client?","right":"Some disorders don't treat well in groups","wrong":[["Group therapy is always more expensive than individual therapy","Group therapy is cheaper."],["Individual therapy relieves isolation better","Groups help with isolation."],["It's required by law","Not on your slides."]],"exp":"Some disorders can't be treated well in a group."}]}]}],"intro":["History of treatment, biomedical therapies and medications, psychotherapy, ethics, and psychodynamic, humanistic, cognitive, behavioral, and CBT therapies."]}],"sq":[{"id":"SQ1","deck":1,"q":"Maya is nervous but excited about starting a new job in a new city. This challenging but manageable stress is:","opts":["Eustress","Distress","A daily hassle","A catastrophe"],"ans":0,"exp":"Eustress is motivating \"good\" stress that can lead to growth."},{"id":"SQ2","deck":1,"q":"After months of a stressful job, Leo keeps getting sick and feels completely drained. Which GAS stage is he in?","opts":["Exhaustion","Alarm","Resistance","Tend-and-befriend"],"ans":0,"exp":"Exhaustion: the body's resources are depleted and health problems appear."},{"id":"SQ3","deck":1,"q":"Jordan has a big exam coming up, so he makes a study schedule and goes to review sessions. This is:","opts":["Problem-focused coping","Emotion-focused coping","Tend-and-befriend","Eustress"],"ans":0,"exp":"Problem-focused coping deals with the stressor itself."},{"id":"SQ4","deck":1,"q":"After a hurricane, Ana gathers her neighbors so they can support and protect each other. This best fits:","opts":["Tend-and-befriend theory","The alarm stage","The exhaustion stage","General Adaptation Syndrome"],"ans":0,"exp":"Befriending = strengthening social connections for mutual support and protection."},{"id":"SQ5","deck":2,"q":"A woman washes her hands so often that she can't keep a job, and she feels miserable about it. Which of the 3 Ds does \"she can't keep a job\" show?","opts":["Dysfunctional/maladaptive","Deviant","Distressing","Diathesis"],"ans":0,"exp":"Dysfunctional/maladaptive = it interferes with functioning."},{"id":"SQ6","deck":2,"q":"After reading about anxiety disorders, Sam is sure he has all of them. This is called:","opts":["Intern syndrome","Agoraphobia","Hindsight bias","The Hawthorne effect"],"ans":0,"exp":"Intern syndrome: believing you have the symptoms of what you're studying. Don't diagnose yourself."},{"id":"SQ7","deck":2,"q":"A therapist says a client's depression comes from irrational beliefs like \"I always fail.\" Which approach is this?","opts":["Cognitive","Behavioral","Psychodynamic","Biological"],"ans":0,"exp":"Cognitive = maladaptive, irrational thoughts and beliefs."},{"id":"SQ8","deck":2,"q":"Which manual is used to classify psychological disorders in the United States?","opts":["DSM-5","APA Code of Ethics","The MMPI","The ICD-1"],"ans":0,"exp":"The Diagnostic and Statistical Manual of Mental Disorders, 5th edition."},{"id":"SQ9","deck":3,"q":"For more than a year, Emma has worried constantly about money, school, her health, and her family, and she can't sleep. She most likely has:","opts":["Generalized anxiety disorder","Panic disorder","A specific phobia","Agoraphobia"],"ans":0,"exp":"GAD = excessive worry about many everyday things for at least 6 months."},{"id":"SQ10","deck":3,"q":"Carlos stopped riding the bus and going to the mall because he's afraid he'll have a panic attack and won't be able to escape. He most likely has:","opts":["Agoraphobia","Social anxiety disorder","A specific phobia","GAD"],"ans":0,"exp":"Agoraphobia: fear of public transportation, crowds, and places where escape seems hard."},{"id":"SQ11","deck":3,"q":"Priya refuses to give her class presentation because she's terrified the other students will judge her. She most likely has:","opts":["Social anxiety disorder","Panic disorder","Agoraphobia","GAD"],"ans":0,"exp":"Social anxiety disorder = fear of being scrutinized or judged."},{"id":"SQ12","deck":4,"q":"For the past three weeks, Dana has felt sad nearly every day, lost interest in soccer, and can't sleep. She most likely has:","opts":["Major depressive disorder","Persistent depressive disorder","Bipolar II","GAD"],"ans":0,"exp":"MDD = symptoms for 2+ weeks. Persistent depressive disorder needs 2+ years."},{"id":"SQ13","deck":4,"q":"For a week, Tom barely slept, talked very fast, felt invincible, and spent all his savings. Earlier he had long periods of depression. He most likely has:","opts":["Bipolar disorder","Persistent depressive disorder","ADHD","GAD"],"ans":0,"exp":"Mania plus depression = bipolar disorder."},{"id":"SQ14","deck":4,"q":"A patient has hypomanic episodes and depression but no hallucinations or delusions. Which diagnosis fits?","opts":["Bipolar II","Bipolar I","Schizophrenia","Major depressive disorder"],"ans":0,"exp":"Bipolar II: hypomania, no psychosis."},{"id":"SQ15","deck":4,"q":"For over two years, Ray has felt down most of the day on most days, with no manic episodes and no drug use. This is:","opts":["Persistent depressive disorder","Major depressive disorder","Bipolar I","Dysthymic mania"],"ans":0,"exp":"Persistent depressive disorder = 2+ years."},{"id":"SQ16","deck":5,"q":"A 7-year-old fidgets constantly, blurts out answers, and can't wait his turn, both at home and at school. Which disorder fits best?","opts":["ADHD","Autism spectrum disorder","Social anxiety disorder","Bipolar disorder"],"ans":0,"exp":"Hyperactivity and impulsivity in 2+ settings point to ADHD."},{"id":"SQ17","deck":5,"q":"A child avoids eye contact, gets upset by loud sounds, and lines up toys the same way every day. Which diagnosis fits best?","opts":["Autism spectrum disorder","ADHD","GAD","Dissociative amnesia"],"ans":0,"exp":"ASD: less social contact, sensory hypersensitivity, repetitive behaviors."},{"id":"SQ18","deck":5,"q":"How many ADHD symptoms does a 19-year-old need for a diagnosis?","opts":["5 or more","6 or more","3 or more","10 or more"],"ans":0,"exp":"6+ up to age 16; 5+ for ages 17 and older."},{"id":"SQ19","deck":5,"q":"A pregnant woman drinks alcohol, and her child later has developmental delays. The alcohol acted as a:","opts":["Teratogen","Neurotransmitter","Hormone","Diathesis"],"ans":0,"exp":"Teratogens like alcohol and tobacco are environmental causes of neurodevelopmental disorders."},{"id":"SQ20","deck":6,"q":"After a car crash, Lena can't remember the accident or the week before it. She most likely has:","opts":["Dissociative amnesia","Dissociative identity disorder","Schizophrenia","GAD"],"ans":0,"exp":"Dissociative amnesia: unable to recall important personal information tied to trauma."},{"id":"SQ21","deck":6,"q":"A man is found in a city 300 miles from home with no idea who he is or how he got there. This is a:","opts":["Fugue state","Catatonic stupor","Manic episode","Panic attack"],"ans":0,"exp":"Fugue: wandering or traveling without awareness of identity."},{"id":"SQ22","deck":6,"q":"A patient has two distinct personalities with different names, memories, and behaviors. She most likely has:","opts":["Dissociative identity disorder","Schizophrenia","Borderline personality disorder","Bipolar I"],"ans":0,"exp":"DID: two or more distinct personality states (alters)."},{"id":"SQ23","deck":6,"q":"What is the most common cause of dissociative disorders?","opts":["Severe trauma or major stress","Too much dopamine","Teratogens","Low serotonin"],"ans":0,"exp":"Your slide: the most common cause is severe trauma or major stress."},{"id":"SQ24","deck":7,"q":"Mark believes the CIA has put a chip in his brain to track him. This is a:","opts":["Delusion of persecution","Hallucination","Delusion of grandeur","Negative symptom"],"ans":0,"exp":"A false belief that others are out to get you = delusion of persecution (paranoia)."},{"id":"SQ25","deck":7,"q":"Kim hears voices telling her what to do when no one is there. This is a:","opts":["Hallucination","Delusion","Flat affect","Word salad"],"ans":0,"exp":"Hallucination = false perception."},{"id":"SQ26","deck":7,"q":"A patient shows no emotion in his face or voice, even at his brother's wedding. This is:","opts":["Flat affect","Catatonic stupor","Word salad","A delusion"],"ans":0,"exp":"Flat affect = lack of emotional expression (a negative symptom)."},{"id":"SQ27","deck":7,"q":"Identical twins share the same genes, but only the one who went through severe stress developed schizophrenia. Which idea explains this?","opts":["Diathesis-stress model","Dopamine hypothesis","Tend-and-befriend theory","General Adaptation Syndrome"],"ans":0,"exp":"Stress triggered a genetic predisposition (diathesis)."},{"id":"SQ28","deck":8,"q":"Ari can't stop thinking his hands are contaminated, so he washes them 50 times a day. The washing is a(n):","opts":["Compulsion","Obsession","Delusion","Hallucination"],"ans":0,"exp":"Compulsions are the repetitive behaviors; the contamination thoughts are the obsessions."},{"id":"SQ29","deck":8,"q":"Nora's house is so full of old newspapers that she can't use her kitchen, but she feels upset at the idea of throwing them out. This is:","opts":["Hoarding disorder","OCD","Agoraphobia","GAD"],"ans":0,"exp":"Hoarding: difficulty discarding, distress at discarding, cluttered living areas."},{"id":"SQ30","deck":8,"q":"A veteran has flashbacks, nightmares, and is always on guard after combat. He most likely has:","opts":["PTSD","GAD","Bipolar disorder","DID"],"ans":0,"exp":"Flashbacks, nightmares, and hypervigilance are PTSD symptoms."},{"id":"SQ31","deck":8,"q":"According to the behavioral explanation, why do compulsions keep happening?","opts":["They reduce anxiety, which reinforces them","They are caused by too much dopamine","They come from childhood conflicts","They are learned only from parents"],"ans":0,"exp":"Operant conditioning: anxiety reduction = reinforcement."},{"id":"SQ32","deck":9,"q":"Lily is severely underweight but still restricts food because she's terrified of gaining weight. She most likely has:","opts":["Anorexia nervosa","Bulimia nervosa","Hoarding disorder","Binge eating disorder"],"ans":0,"exp":"Anorexia: refusal to maintain normal weight and intense fear of gaining weight."},{"id":"SQ33","deck":9,"q":"Jess regularly eats a huge amount of food in under two hours, feels out of control, and then makes herself vomit. She most likely has:","opts":["Bulimia nervosa","Anorexia nervosa","GAD","OCD"],"ans":0,"exp":"Bulimia: binge eating plus behaviors to prevent weight gain."},{"id":"SQ34","deck":9,"q":"Eating disorders are most common in which kind of culture, according to your slides?","opts":["Industrialized cultures that emphasize thinness","Cultures with food shortages","Cultures without media","Rural farming cultures"],"ans":0,"exp":"Cultural cause: industrialized cultures emphasizing thinness."},{"id":"SQ35","deck":9,"q":"A teen whose family pushes perfection and high achievement develops an eating disorder. Which cause fits best?","opts":["Social","Biological","Genetic","Cultural"],"ans":0,"exp":"Your slide lists a family focus on perfectionism/high achievement as a social cause."},{"id":"SQ36","deck":10,"q":"Max lies, steals, and hurts people without feeling any guilt. Which personality disorder fits best?","opts":["Antisocial","Avoidant","Schizoid","Dependent"],"ans":0,"exp":"Antisocial: disregard for others' rights, no empathy or remorse."},{"id":"SQ37","deck":10,"q":"Rachel can't decide what to eat without asking her boyfriend and panics at the thought of him leaving. Which personality disorder fits best?","opts":["Dependent","Narcissistic","Histrionic","Paranoid"],"ans":0,"exp":"Dependent: needs reassurance, fears abandonment, clingy."},{"id":"SQ38","deck":10,"q":"Which cluster contains odd or eccentric personality disorders?","opts":["Cluster A","Cluster B","Cluster C","Cluster D"],"ans":0,"exp":"A = odd/eccentric, B = dramatic, C = anxious."},{"id":"SQ39","deck":10,"q":"Chris believes he's better than everyone, demands admiration, and can't handle criticism. Which personality disorder fits best?","opts":["Narcissistic","Borderline","Avoidant","Schizotypal"],"ans":0,"exp":"Narcissistic: exaggerated self-importance, need for admiration, sensitive to criticism."},{"id":"SQ40","deck":11,"q":"A therapist asks a client to lie on a couch and say whatever comes to mind. This is:","opts":["Free association","Systematic desensitization","Active listening","Cognitive restructuring"],"ans":0,"exp":"Free association is a psychodynamic technique for exploring the unconscious."},{"id":"SQ41","deck":11,"q":"A therapist repeats back what the client says and never gives advice or judges. This is:","opts":["Person-centered therapy","Aversion therapy","Psychoanalysis","REBT"],"ans":0,"exp":"Carl Rogers' person-centered therapy is non-directive, with active listening."},{"id":"SQ42","deck":11,"q":"A man with alcoholism takes Antabuse so drinking makes him sick. This is:","opts":["Aversion therapy","Systematic desensitization","A token economy","Biofeedback"],"ans":0,"exp":"Aversion therapy pairs an unpleasant state with the unwanted behavior."},{"id":"SQ43","deck":11,"q":"A patient with schizophrenia takes a medication that blocks dopamine receptors. This is a(n):","opts":["Antipsychotic","Antidepressant","Benzodiazepine","Mood stabilizer"],"ans":0,"exp":"Antipsychotics block dopamine receptors and reduce positive symptoms."},{"id":"SQ44","deck":11,"q":"A therapist forcefully challenges a client's belief that \"everyone must like me.\" This is:","opts":["REBT","Person-centered therapy","Free association","A token economy"],"ans":0,"exp":"REBT: the therapist confronts irrational beliefs."},{"id":"SQ45","deck":11,"q":"Students earn stars for good behavior and trade 5 stars for a prize. This is a:","opts":["Token economy","Aversion therapy","Exposure therapy","Biofeedback"],"ans":0,"exp":"Token economy: operant conditioning with exchangeable rewards."}],"flows":[{"id":"F1-1","title":"General Adaptation Syndrome","deck":1,"steps":["Alarm: fight or flight","Resistance: cortisol & epinephrine, using up reserves","Exhaustion: resources depleted, health problems"]},{"id":"F8-1","title":"The OCD cycle","deck":8,"steps":["Obsession","Distress","Compulsion","Relief","Back to obsession"]}],"trees":[],"tables":[{"title":"Bipolar disorders","rows":[["","Bipolar I","Bipolar II"],["Severity","More severe","Less severe"],["Highs","Full-blown manic episodes","Hypomanic episodes (lesser form)"],["Psychosis","Can include hallucinations or delusions","No psychosis"],["How common","Less common; earlier onset","More common"],["Depression","May have longer periods of depression","Still a significant impact on daily life"]]},{"title":"Symptoms","rows":[["Type","Meaning","Examples"],["Positive","Something added","Delusions (false beliefs), hallucinations (false perceptions), disorganized speech (word salad), disorganized movement"],["Negative","Something absent","Flat affect, catatonic stupor (no movement), lack of interest and motivation"]]},{"title":"Personality disorders","rows":[["Cluster","Style","Disorders"],["A","Odd or eccentric","Paranoid, schizoid, schizotypal"],["B","Dramatic, emotional, erratic","Antisocial, histrionic, narcissistic, borderline"],["C","Anxious or fearful","Avoidant, dependent, obsessive-compulsive"]]},{"title":"Medications","rows":[["Class","Treats","How it works","Examples","Side effects"],["Antidepressants (SSRIs)","Depression","Block serotonin reuptake","Prozac, Paxil, Zoloft","Fatigue, forgetfulness, insomnia, weight gain"],["Anti-anxiety (benzodiazepines)","Anxiety","Depress the CNS; increase GABA","Xanax, Librium, Lorazepam, Valium","Drowsiness, dependency"],["Antipsychotics (neuroleptics)","Schizophrenia, severe bipolar","Block dopamine receptors","Haldol, Thorazine","Tardive dyskinesia, weight gain"],["Mood stabilizers","Bipolar disorder","—","Lithium","—"]]},{"title":"Brain treatments","rows":[["Treatment","How","Used for","Downsides"],["Lobotomy","Cuts neural connections to the frontal lobe","Rarely used today","Reduces functioning and awareness; vegetative state"],["rTMS","Magnetic pulses through the skull stimulate neurons","Chronic depression","None listed: no seizures, no memory loss, awake"],["ECT","Electric current causes a 30–60 second seizure","Extreme depression; lowers suicide risk","Memory loss; 40% relapse in 6 months"]]}],"watch":[{"deck":1,"text":"The stress slide says \"flight/flight/freeze.\" It means fight/flight/freeze."},{"deck":1,"text":"Coping: problem-focused = change the stressor itself. Emotion-focused = change how you feel about it."},{"deck":1,"text":"GAS order: Alarm → Resistance → Exhaustion."},{"deck":2,"text":"The evolutionary box says \"reduce our change of survival.\" It means chance."},{"deck":3,"text":"Agoraphobia is not only fear of open spaces: it also includes crowds, enclosed places, public transportation, and being outside the home alone."},{"deck":3,"text":"GAD = worry about everything for 6+ months. Panic disorder = sudden panic attacks and fear of having more."},{"deck":4,"text":"Time rules: major depressive disorder = 2 weeks or more. Persistent depressive disorder = 2 years or more."},{"deck":4,"text":"Bipolar I = full mania, can include psychosis, more severe. Bipolar II = hypomania, no psychosis, more common."},{"deck":4,"text":"If someone has depression plus a manic episode, it's bipolar disorder, not persistent depressive disorder."},{"deck":5,"text":"ADHD numbers: 6+ symptoms up to age 16, 5+ for 17 and older; symptoms before age 12; in 2+ settings; 6+ months. Average onset is around age 8."},{"deck":6,"text":"Dissociative identity disorder (multiple \"alters\") is not schizophrenia. Schizophrenia is psychosis: delusions and hallucinations."},{"deck":7,"text":"Positive symptoms are things added (delusions, hallucinations), not good things. Negative symptoms are things missing (flat affect, no movement, no motivation)."},{"deck":7,"text":"The negative symptoms box on your slide also lists \"disorganized movement\" next to catatonic stupor."},{"deck":8,"text":"In the DSM-5, OCD and hoarding are no longer anxiety disorders; they have their own category."},{"deck":8,"text":"Obsessions = thoughts. Compulsions = actions (or mental acts). The compulsion's relief is what reinforces it."},{"deck":9,"text":"Anorexia = restricting to a significantly low weight. Bulimia = binge eating plus trying to prevent weight gain (vomiting, laxatives, fasting, exercise)."},{"deck":10,"text":"Don't mix up OCD (obsessions + compulsions) with obsessive-compulsive personality disorder (Cluster C: perfectionism, rigid, needs control)."},{"deck":10,"text":"Paranoid personality disorder has no psychosis. Paranoid delusions of persecution are a schizophrenia symptom."},{"deck":11,"text":"Match the meds: antidepressants = SSRIs (serotonin); anti-anxiety = benzodiazepines (GABA); antipsychotics = block dopamine; mood stabilizer = lithium (bipolar)."},{"deck":11,"text":"Aversion therapy is the opposite of systematic desensitization."},{"deck":11,"text":"Only doctors and psychiatrists can prescribe medication."}],"practice":{"sections":[{"name":"Health Psychology","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q1-1","type":"mcq","topic":"Health Psychology","stem":"Which of the following best describes what happens when stress activates the sympathetic nervous system?","options":["The parasympathetic system shuts down permanently.","Leptin levels rise and hunger disappears.","The body immediately returns to baseline.","Hormones like cortisol are released, which can lead to hypertension, headaches, and immunosuppression."],"ans":3,"exp":"Stress → sympathetic nervous system → cortisol → hypertension, headaches, immunosuppression.","why":["","","",""]},{"id":"q1-2","type":"mcq","topic":"Health Psychology","stem":"Which of the following is the best example of eustress?","options":["Being stuck in traffic every day","Preparing for a wedding you're excited about","Going through a divorce","Living through a natural disaster"],"ans":1,"exp":"Eustress = challenging but manageable \"good\" stress. The others are distress.","why":["","","",""]},{"id":"q1-3","type":"mcq","topic":"Health Psychology","stem":"A dead phone, no Wi-Fi, and a deadline in the same afternoon are examples of:","options":["Catastrophes","Significant life changes","Eustress","Daily hassles"],"ans":3,"exp":"Daily hassles are everyday distress.","why":["","","",""]},{"id":"q1-4","type":"mcq","topic":"Health Psychology","stem":"Which of the following is an example of household dysfunction as an ACE?","options":["Moving to a new school","Having a parent who is incarcerated","Failing a test","Getting a new sibling"],"ans":1,"exp":"Household dysfunction: substance abuse, domestic violence, parent with mental illness, or an incarcerated parent.","why":["","","",""]},{"id":"q1-5","type":"mcq","topic":"Health Psychology","stem":"Which of the following best explains why people with many ACEs face higher health risks as adults?","options":["Stress during childhood affects how a child's brain and body develop, which shows up later in life.","ACEs only affect children until age 17.","ACEs are caused by genetic disorders.","ACEs make people less likely to smoke."],"ans":0,"exp":"Your slide: ACEs affect a child's brain and health as they grow up, raising risks like heart disease and depression.","why":["","","",""]},{"id":"q1-6","type":"mcq","topic":"Health Psychology","stem":"In which stage of the General Adaptation Syndrome is the body still in high stress, with cortisol and epinephrine flowing and reserves being used up?","options":["Resistance","Alarm","Exhaustion","Recovery"],"ans":0,"exp":"Alarm = immediate fight-or-flight; resistance = sustained stress; exhaustion = depleted.","why":["","","",""]},{"id":"q1-7","type":"mcq","topic":"Health Psychology","stem":"Which statement best describes the tend-and-befriend theory?","options":["Stress always triggers fight-or-flight.","People under stress avoid all social contact.","Under stress, some people, mainly women, respond by caring for others and building social connections instead of fight-or-flight.","Stress causes the body to become exhausted immediately."],"ans":2,"exp":"It's part of evolutionary psychology: protecting offspring and building support.","why":["","","",""]},{"id":"q1-8","type":"mcq","topic":"Health Psychology","stem":"Which of the following best describes the difference between problem-focused and emotion-focused coping?","options":["Problem-focused coping changes the stressor itself; emotion-focused coping changes how you feel about it.","Problem-focused coping is always better.","Emotion-focused coping deals with the root cause.","They are the same thing."],"ans":0,"exp":"Problem-focused = fix the problem. Emotion-focused = regulate the feeling.","why":["","","",""]},{"id":"q1-9","type":"mcq","topic":"Health Psychology","stem":"When is emotion-focused coping most likely to be used?","options":["When the stressor can easily be changed","Only during the alarm stage","When the stressor seems uncontrollable","Only by people with ACEs"],"ans":2,"exp":"Problem-focused coping works best when the stressor can be changed or controlled.","why":["","","",""]}]},{"name":"Intro to Psychological Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q2-1","type":"mcq","topic":"Intro to Psychological Disorders","stem":"According to your slides, professionals label thoughts, feelings, and behaviors as a disorder when they are:","options":["Rare, harmless, and temporary","Genetic, chronic, and dangerous","Diagnosed, treated, and cured","Deviant, dysfunctional/maladaptive, and distressing"],"ans":3,"exp":"The 3 Ds.","why":["","","",""]},{"id":"q2-2","type":"mcq","topic":"Intro to Psychological Disorders","stem":"A man believes that wearing his lucky socks helps his team win, but he functions well and isn't bothered by it. Why is this NOT considered a disorder?","options":["It isn't dysfunctional or distressing","It isn't a real belief","Only women can have disorders","It isn't in the DSM-5"],"ans":0,"exp":"A disorder needs all 3 Ds, not just being unusual.","why":["","","",""]},{"id":"q2-3","type":"mcq","topic":"Intro to Psychological Disorders","stem":"Which approach explains disorders through chemical imbalances, genetics, tumors, or brain structure?","options":["Psychodynamic","Humanistic","Biological","Sociocultural"],"ans":2,"exp":"Biological = medical/genetic issues and neurotransmitters/hormones.","why":["","","",""]},{"id":"q2-4","type":"mcq","topic":"Intro to Psychological Disorders","stem":"Which approach explains disorders as responses learned through conditioning and reinforcement?","options":["Cognitive","Behavioral","Evolutionary","Psychodynamic"],"ans":1,"exp":"Behavioral = learned through the environment.","why":["","","",""]},{"id":"q2-5","type":"mcq","topic":"Intro to Psychological Disorders","stem":"A therapist believes a client's anxiety comes from unconscious conflicts rooted in childhood. Which approach is this?","options":["Psychodynamic","Humanistic","Behavioral","Biological"],"ans":0,"exp":"Psychodynamic = unconscious thoughts and childhood experiences.","why":["","","",""]},{"id":"q2-6","type":"mcq","topic":"Intro to Psychological Disorders","stem":"Which approach says disorders result from a lack of social support and not being able to reach your full potential?","options":["Cognitive","Humanistic","Sociocultural","Evolutionary"],"ans":1,"exp":"Humanistic = potential and support.","why":["","","",""]}]},{"name":"Anxiety Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q3-1","type":"mcq","topic":"Anxiety Disorders","stem":"Which of the following best describes anxiety disorders?","options":["Brief nervousness before a test","Extreme mood swings between mania and depression","Persistent, excessive worry and fear that significantly interfere with daily life","A loss of connection between thoughts and identity"],"ans":2,"exp":"That's the slide's definition; GAD, panic disorder, and phobias are examples.","why":["","","",""]},{"id":"q3-2","type":"mcq","topic":"Anxiety Disorders","stem":"Which of the following best describes a specific phobia?","options":["Constant worry about many everyday things","An intense or irrational fear that is out of proportion to the actual threat","Sudden panic attacks for no reason","A fear of being judged in social situations"],"ans":1,"exp":"Specific phobias are tied to a particular object or situation.","why":["","","",""]},{"id":"q3-3","type":"mcq","topic":"Anxiety Disorders","stem":"Which disorder is described as \"nonspecific worry and fear\" lasting at least 6 months?","options":["Specific phobia","Generalized anxiety disorder","Panic disorder","Agoraphobia"],"ans":1,"exp":"GAD worry isn't tied to one specific thing.","why":["","","",""]},{"id":"q3-4","type":"mcq","topic":"Anxiety Disorders","stem":"A key symptom of panic disorder is:","options":["Fear of one specific object","Constant worry about money","Worrying about having more attacks","Avoiding eye contact"],"ans":2,"exp":"Panic disorder: panic attacks plus anxiety about having panic attacks.","why":["","","",""]},{"id":"q3-5","type":"mcq","topic":"Anxiety Disorders","stem":"Which of the following is a cognitive symptom of agoraphobia?","options":["Intense fear of being trapped or unable to escape","Sweating and tremors","Staying home","Rapid heartbeat"],"ans":0,"exp":"Sweating, tremors, and rapid heartbeat are physical; staying home is behavioral.","why":["","","",""]},{"id":"q3-6","type":"mcq","topic":"Anxiety Disorders","stem":"A child becomes terrified of dogs after watching her mother scream every time a dog walks by. Which cause of anxiety disorders does this show?","options":["Behavioral (modeling)","Biological","Genetic","Cognitive"],"ans":0,"exp":"Behavioral causes include modeling anxiety responses from others.","why":["","","",""]},{"id":"q3-7","type":"mcq","topic":"Anxiety Disorders","stem":"Which neurotransmitter imbalances do your slides link to anxiety disorders?","options":["Dopamine and glutamate","Acetylcholine and endorphins","Melatonin and leptin","Serotonin and GABA"],"ans":3,"exp":"Biological cause: imbalances in serotonin and GABA, plus hormonal imbalances.","why":["","","",""]}]},{"name":"Depressive & Bipolar Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q4-1","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Which of the following best describes depressive disorders?","options":["A temporary bad mood after a disappointment","Extreme mood swings between mania and depression","A sad, empty, or irritable mood with physical and cognitive changes that affect functioning","Persistent fear of social situations"],"ans":2,"exp":"Depression is a mental health condition, not just a temporary mood swing.","why":["","","",""]},{"id":"q4-2","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"What is the key time difference between major depressive disorder and persistent depressive disorder?","options":["MDD lasts 2+ years; persistent lasts 2+ weeks","Both last 6 months","There is no time requirement","MDD lasts 2+ weeks; persistent depressive disorder lasts 2+ years"],"ans":3,"exp":"MDD = 2 weeks. Persistent = 2 years.","why":["","","",""]},{"id":"q4-3","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Changes in sleep in major depressive disorder can include:","options":["Only sleepwalking","Insomnia or hypersomnia","Only narcolepsy","No changes in sleep"],"ans":1,"exp":"Your slide: changes in sleep (insomnia or hypersomnia).","why":["","","",""]},{"id":"q4-4","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Why would someone with long-term depression who also has a manic episode NOT be diagnosed with persistent depressive disorder?","options":["Mania shortens the depression","Manic episodes only happen in children","A manic episode means it would most likely be bipolar disorder","Persistent depressive disorder requires mania"],"ans":2,"exp":"Persistent depressive disorder requires no manic episodes.","why":["","","",""]},{"id":"q4-5","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Which of the following is a symptom of a manic episode?","options":["Decreased need for sleep and racing thoughts","Persistent sadness and fatigue","Loss of interest in activities","Feelings of worthlessness"],"ans":0,"exp":"The other three are depressive-episode symptoms.","why":["","","",""]},{"id":"q4-6","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Which statement correctly compares Bipolar I and Bipolar II?","options":["Bipolar I has full mania and can include psychosis; Bipolar II has hypomania and no psychosis.","Bipolar II is more severe than Bipolar I.","Bipolar I never includes depression.","Bipolar II includes hallucinations."],"ans":0,"exp":"Bipolar II is less severe but more common.","why":["","","",""]},{"id":"q4-7","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Which neurotransmitters do your slides link to both depressive and bipolar disorders?","options":["GABA and glutamate only","Acetylcholine and endorphins","Melatonin and oxytocin","Serotonin, dopamine, and norepinephrine"],"ans":3,"exp":"Both slides list imbalances in serotonin, dopamine, and norepinephrine.","why":["","","",""]},{"id":"q4-8","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Family histories and twin studies of depression suggest that:","options":["Depression is caused only by stress","There is a genetic component","Depression cannot run in families","Twins never share disorders"],"ans":1,"exp":"Your slide: family histories and twin studies indicate a genetic component.","why":["","","",""]}]},{"name":"Neurodevelopmental Disorders","mode":"practice","tips":["Exam-style
