<!doctype html>
<html lang="en" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP Psychology Study Kit</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
/* Design tokens shared by the Study Hub and every kit. The course accent comes from course.json
   (set at runtime as --accent-l / --accent-d). */
:root {
  --ground: #E9EBEE; --sheet: #FFFFFF; --sunk: #F3F4F6; --ink: #1A1D21; --ink-2: #555C65; --rule: #D6DAE0;
  --ok: #23774A; --ok-wash: #E3F2E9; --bad: #B3261E; --bad-wash: #FBE9E7; --mid: #9A5B00; --mid-wash: #FCF0DC;
  --t0: #3E6FB0; --t1: #B5552F; --t2: #3D8A5F; --t3: #7A5BB5; --t4: #A8862A; --t5: #3B8C99; --t6: #A54C79; --t7: #6B7280;
  --accent: var(--accent-l, #2C5AA0); --on-accent: #FFFFFF;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 8px; --r-sm: 6px; --fast: 120ms; --mid-t: 180ms;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
  --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
  --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
  --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #15171A; --sheet: #202328; --sunk: #1A1C20; --ink: #ECEEF0; --ink-2: #A5ABB3; --rule: #363A40;
    --ok: #6CC495; --ok-wash: #183527; --bad: #F08A80; --bad-wash: #3D1F1C; --mid: #E7B45F; --mid-wash: #3A2C14;
    --t0: #86AEEF; --t1: #E8977A; --t2: #7BC79B; --t3: #B49BEA; --t4: #D9BC63; --t5: #79C3CE; --t6: #DB8DB5; --t7: #A5ABB3;
    --accent: var(--accent-d, #86AEEF); --on-accent: #15171A; color-scheme: dark;
  }
}
:root { --accent-wash: color-mix(in srgb, var(--accent) 10%, var(--sheet)); }

/* Study kit layout and components. Uses tokens.css only. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.55 var(--sans); }
#app { max-width: 60rem; margin: 0 auto; padding: 0 16px 72px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font: 600 clamp(2rem, 5vw, 2.8rem)/1.05 var(--serif); letter-spacing: -.01em; }
h2 { font: 600 1.55rem/1.2 var(--serif); }
h3 { font-size: 1.05rem; font-weight: 600; margin: 22px 0 8px; }
h4 { font-size: .95rem; font-weight: 600; margin: 14px 0 6px; }
p { margin: 8px 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted, .hint { color: var(--ink-2); }
.hint { font-size: .9rem; }
.big { font-size: 1.25rem; font-weight: 600; }

/* header */
.top { padding: 22px 0 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.hublink { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .95rem; }
.hublink:hover { color: var(--accent); }
.credit { margin: 40px 0 8px; text-align: center; font-size: .85rem; color: var(--ink-2); }
.credit a { color: inherit; }
.credit a:hover { color: var(--accent); }
.kicker { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
.lede { color: var(--ink-2); max-width: 60ch; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; color: var(--ink-2); font-size: .95rem; }
.meter .bar { flex: 1 1 160px; }
.bar { display: block; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width var(--mid-t); }
.bar.low i { background: var(--bad); } .bar.mid i { background: var(--mid); } .bar.high i { background: var(--ok); }

/* tabs and chips */
.tabs { position: sticky; top: 0; z-index: 5; background: var(--ground); border-bottom: 1px solid var(--rule); margin: 0 -16px; padding: 0 16px; }
.tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 12px 10px; color: var(--ink-2); font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab[aria-current] { color: var(--ink); border-bottom-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .92rem; }
.chip small { color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.t0 { background: var(--t0); } .dot.t1 { background: var(--t1); } .dot.t2 { background: var(--t2); } .dot.t3 { background: var(--t3); }
.dot.t4 { background: var(--t4); } .dot.t5 { background: var(--t5); } .dot.t6 { background: var(--t6); } .dot.t7 { background: var(--t7); }
main { padding-top: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; transition: background-color var(--fast), border-color var(--fast); }
.btn:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.sec { background: var(--sheet); color: var(--ink); border-color: var(--rule); }
.btn.sec:hover { border-color: var(--ink-2); background: var(--sheet); }
.btn.ghost { background: transparent; color: var(--ink-2); border-color: transparent; padding: 8px 10px; min-height: 38px; font-weight: 500; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.ghost[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn:not(.ghost).danger { background: var(--sheet); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }

/* panels */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 24px; margin-bottom: 18px; }
.rtop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 12px; }
.rtop h2 { margin-right: auto; }
.msg { color: var(--bad); font-weight: 600; }
.kbd { color: var(--ink-2); font-size: .85rem; margin-top: -6px; }

/* questions and choices */
.lockt { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-2); margin-bottom: 4px; }
.qask { color: var(--ink-2); font-weight: 600; margin: 14px 0 4px; }
.qprompt, .stem { font-size: 1.12rem; line-height: 1.5; margin: 6px 0 16px; max-width: 70ch; }
.opts { display: grid; gap: 10px; }
.opts.tf { grid-template-columns: repeat(2, minmax(0, 12rem)); }
.optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.opt { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: var(--r-sm); padding: 12px 14px; transition: border-color var(--fast), background-color var(--fast); }
.opt:not(:disabled):hover { border-color: var(--ink-2); }
.opt .k { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.opt .ot { padding-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-wash); }
.opt.sel .k { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--ok); background: var(--ok-wash); }
.opt.right .k { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-wash); }
.opt.wrong .k { border-color: var(--bad); background: var(--bad); color: var(--sheet); }
.opt:disabled { cursor: default; color: var(--ink); }
.crossed .opt .ot { text-decoration: line-through; color: var(--ink-2); }
.crossed .opt { opacity: .7; }
.xoff { width: 40px; display: grid; place-items: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); border-radius: var(--r-sm); }
.xoff:hover { background: var(--sunk); color: var(--ink); }
.xoff[aria-pressed="true"] { color: var(--accent); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--ink-2); }
.fb.ok { background: var(--ok-wash); border-left-color: var(--ok); }
.fb.bad { background: var(--bad-wash); border-left-color: var(--bad); }
.fb p:first-child { margin-top: 0; } .fb p:last-child { margin-bottom: 0; }
.why { margin-top: 10px; padding: 12px 16px; border-radius: var(--r-sm); border: 1px solid var(--rule); }
.why .wh { font-size: .85rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.why.bad .wh { color: var(--bad); } .why.good .wh { color: var(--ok); }
.why p { margin: 6px 0 0; }
.qt { display: block; font-weight: 600; }
.whyall { margin-top: 10px; }
.whyall summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.whyall ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
.whyall li { padding: 10px 14px; background: var(--sunk); border-radius: var(--r-sm); }
.whyall li p { margin: 4px 0 0; }
.tag { display: inline-block; margin-top: 4px; font-size: .8rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.tag.ok { background: var(--ok-wash); color: var(--ok); } .tag.bad { background: var(--bad-wash); color: var(--bad); }
.hook { display: block; margin-top: 6px; color: var(--ink-2); font-size: .94rem; }
.hook b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.skill { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--ink-2); background: var(--sunk); border: 1px solid var(--rule); padding: 0 8px; border-radius: 999px; vertical-align: 1px; }

/* learn */
.lessonbar { margin-bottom: 14px; }
.lessonbar .rtop { margin-bottom: 8px; }
.lmap { margin-top: 14px; display: grid; gap: 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px; }
.lmdeck h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.lmlist { display: flex; flex-wrap: wrap; gap: 6px; }
.lm { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 10px; font-size: .9rem; }
.lm.done { color: var(--ok); }
.lm[aria-current] { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; color: var(--ink); }
.deckname { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 600; font-size: .92rem; margin: 0 0 4px; }
.terms { margin: 16px 0 0; display: grid; gap: 0; }
.terms > div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 13px 0; border-top: 1px solid var(--rule); }
.terms > div:first-child { border-top: 0; }
.terms dt { font-weight: 600; }
.terms dd { margin: 0; }
.terms.guide > div { grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr) auto; }
.know { align-self: start; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 4px 10px; font-size: .85rem; color: var(--ink-2); white-space: nowrap; }
.know[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); font-weight: 600; }
.chain { margin: 18px 0; }
.chain figcaption { font-weight: 600; font-size: .92rem; color: var(--ink-2); margin-bottom: 8px; }
.chain ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; counter-reset: c; }
.chain li { position: relative; background: var(--accent-wash); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--rule)); border-radius: var(--r-sm); padding: 7px 12px; font-size: .95rem; }
.chain li + li { margin-left: 22px; }
.chain li + li::before { content: ""; position: absolute; left: -20px; top: 50%; width: 14px; height: 2px; background: var(--ink-2); }
.chain li + li::after { content: ""; position: absolute; left: -10px; top: calc(50% - 4px); border: 5px solid transparent; border-left-color: var(--ink-2); border-right: 0; }
.watch { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--mid); background: var(--mid-wash); border-radius: var(--r-sm); }
.watch b { display: block; color: var(--mid); margin-bottom: 2px; }
.scorebig { font: 600 2.6rem/1 var(--serif); margin: 14px 0 0; }
.missed { padding-left: 20px; }
.missed li { margin: 6px 0; }

/* study guide */
.deckblock { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 22px 24px; margin-bottom: 18px; }
.deckblock > h2 { display: flex; align-items: center; gap: 10px; }
.tree { background: var(--sunk); border-radius: var(--r-sm); padding: 14px 16px; overflow-x: auto; font: .92rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.tablewrap { margin: 16px 0; }
.tablewrap figcaption { font-weight: 600; margin-bottom: 8px; }
.scrollx { overflow-x: auto; }
.gt { border-collapse: collapse; width: 100%; font-size: .95rem; }
.gt th, .gt td { border: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
.gt th { background: var(--sunk); font-weight: 600; }
.breakdown { max-width: 34rem; margin: 14px 0; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px 24px; }
.cblock h3 { margin-top: 6px; }
.cblock ul { padding-left: 18px; margin: 0; }

/* flashcards */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-bottom: 16px; }
.ctl label, .grp label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
select, input[type="number"] { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 8px; color: var(--ink); }
input[type="number"] { width: 4.5rem; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.fcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; width: 100%; min-height: 15rem; padding: 32px; background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: var(--r); text-align: center; }
.fterm { font: 600 2rem/1.15 var(--serif); }
.fdef { font-size: 1.15rem; max-width: 50ch; }
.fcard small { color: var(--ink-2); }
.fcnav .btn { flex: 1 1 8rem; }
.fctools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.fctools [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.fcprog { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
.fcprog .muted { flex: none; font-size: .92rem; }
.fcprog .bar { flex: 1 1 140px; }
.srb { margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: .8rem; font-weight: 600; white-space: nowrap; }

/* forms */
.form fieldset { border: 0; padding: 0; margin: 18px 0 0; }
.form legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.grp { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.chk { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; }
.chk input { margin-top: 3px; }
textarea { width: 100%; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; resize: vertical; margin-top: 12px; }

/* practice test */
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stab { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 7px 13px; font-size: .92rem; color: var(--ink-2); }
.stab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); font-weight: 600; }
.stab.res { border-style: dashed; }
.ptctl { display: flex; flex-wrap: wrap; gap: 2px; margin: 0 -10px 10px; }
.score { color: var(--ink-2); font-weight: 600; font-size: .95rem; }
.banner { background: var(--accent-wash); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; }
.intro { margin-bottom: 12px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.disclose .ic { transition: transform var(--fast); }
.disclose[aria-expanded="true"] .ic { transform: rotate(90deg); }
.intro ol { margin: 8px 0; padding-left: 22px; }
.intro li { margin: 4px 0; }
.pals { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.pal { position: relative; width: 38px; height: 38px; border-radius: var(--r-sm); border: 1.5px solid var(--rule); background: var(--sunk); color: var(--ink-2); font-weight: 600; font-size: .9rem; }
.pal.vis { background: var(--sheet); border-color: var(--mid); color: var(--ink); }
.pal.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.pal.bad { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.pal.partial { background: var(--mid-wash); border-color: var(--mid); color: var(--mid); }
.pal.none { background: var(--sunk); }
.pal[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 2px; }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border: 7px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); border-top-right-radius: var(--r-sm); }
.qtitle { color: var(--ink-2); font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
.qhead { font: 600 1.25rem/1.25 var(--serif); margin: 4px 0 8px; }
.src { margin: 0 0 16px; padding: 16px 18px; background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm); }
.src figcaption b { display: block; }
.sattr, .slab { display: block; font-size: .88rem; color: var(--ink-2); }
.srcimg { display: block; max-width: 100%; height: auto; margin: 12px 0; border-radius: 4px; }
.stext { font-family: var(--serif); font-size: 1.08rem; line-height: 1.6; max-width: 68ch; }
.pn { font-family: var(--sans); font-size: .8rem; font-weight: 600; color: var(--ink-2); margin-right: 6px; }
.litems { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.litem { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr); gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.litem.pinrow { grid-template-columns: auto minmax(0, 1fr); }
.litem.right { border-color: var(--ok); background: var(--ok-wash); }
.litem.wrong { border-color: var(--bad); background: var(--bad-wash); }
.lt { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
.ln { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: .8rem; }
.lbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.lb { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 5px 12px; font-size: .92rem; }
.lb.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.lb.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.lb.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
.lb:disabled { cursor: default; }
.lfb { grid-column: 1 / -1; font-size: .93rem; }
.diagram { margin: 0 0 16px; }
.dimg { position: relative; display: inline-block; max-width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: var(--r-sm); }
.dimg img { display: block; max-width: 100%; max-height: 34rem; width: auto; height: auto; border-radius: var(--r-sm); }
.pin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #1A1D21; color: #fff; font-size: .85rem; font-weight: 700; border: 2px solid #fff; box-shadow: 0 0 0 1px #1A1D21; }
.pin.set { background: var(--accent-l, #2C5AA0); }
.pin.right { background: #23774A; } .pin.wrong { background: #B3261E; }
.credit { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }
.fparts { padding-left: 22px; }
.fparts li { margin: 6px 0; }
.part { display: block; margin-top: 16px; }
.pl { display: block; font-weight: 600; }
.pl small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.model { margin-top: 20px; padding: 18px; background: var(--accent-wash); border-radius: var(--r-sm); }
.model h4 { margin-top: 0; font-size: 1rem; }
.mpart { padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--accent) 25%, var(--rule)); }
.mpart:first-of-type { border-top: 0; }
.tea { margin: 8px 0; display: grid; gap: 6px; }
.tea > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 10px; }
.tea dt { font-weight: 600; color: var(--accent); }
.tea dd { margin: 0; }
.earns, .weak { font-size: .95rem; }
.weak { color: var(--ink-2); }
.selfmark { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.selfmark > span { font-weight: 600; font-size: .9rem; margin-right: 4px; }
.mk { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r-sm); padding: 6px 12px; font-size: .9rem; }
.mk.on.right { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.mk.on.wrong { border-color: var(--bad); background: var(--bad); color: var(--sheet); }

/* results and progress */
.wk { display: grid; gap: 14px; }
.wkhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 6px; }
.wkhead span { color: var(--ink-2); font-size: .92rem; }
.wkmiss, .wkrev { font-size: .92rem; margin: 6px 0 0; }
.resq { border: 1px solid var(--rule); border-radius: var(--r-sm); margin: 8px 0; }
.resq summary { display: flex; gap: 12px; padding: 10px 12px; cursor: pointer; list-style: none; }
.resq summary::-webkit-details-marker { display: none; }
.resq .pal { flex: none; }
.resd { padding: 0 14px 12px 62px; }

/* course home */
.course { margin-bottom: 4px; }
.unitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.unitrow { display: grid; grid-template-columns: 7rem minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px 24px; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: var(--r); color: inherit; text-decoration: none; transition: border-color var(--fast); }
.unitrow:hover { border-color: var(--accent); }
.ulabel { font-weight: 600; color: var(--accent); }
.ubody { display: grid; gap: 4px; }
.utitle { font: 600 1.35rem/1.2 var(--serif); }
.ublurb { color: var(--ink-2); }
.ustat { font-size: .9rem; color: var(--ink-2); }
.ugo { display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--accent); }

@media (max-width: 640px) {
  .panel, .deckblock { padding: 18px 16px; }
  .terms > div, .terms.guide > div { grid-template-columns: minmax(0, 1fr); }
  .terms.guide .know { justify-self: start; }
  .litem:not(.pinrow) { grid-template-columns: minmax(0, 1fr); }
  .tea > div { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .unitrow { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
  .ulabel { grid-column: 1 / -1; }
  .resd { padding-left: 14px; }
  .opts.tf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  body { background: #fff; }
  .tabs, .chips, .topbar, .meter, .noprint, .qnav, .ptctl { display: none !important; }
  .panel, .deckblock { border: 0; padding: 0; }
}

/* Plain-language intros (deck big picture, section story) */
.intro { margin: 12px 0 16px; padding: 12px 16px; border-left: 4px solid var(--accent); background: var(--sunk); border-radius: var(--r-sm); }
.intro p { margin: 0 0 8px; line-height: 1.6; }
.intro p:last-child { margin-bottom: 0; }
.intro .introhead { font-weight: 700; font-size: .92rem; color: var(--accent); margin-bottom: 6px; }
.intro.bigpic { background: transparent; border: 1px solid var(--rule); border-left: 4px solid var(--accent); }
.introfold { margin: 8px 0 12px; }
.introfold summary { cursor: pointer; font-weight: 600; color: var(--accent); }

/* Course home: whole-course backup */
.backup { margin-top: 24px; }
.bkmsg { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--sunk); border-left: 4px solid var(--accent); }

<script>
const COURSE = {"id":"psych","name":"AP Psychology","tagline":"Content from Phineas's AP Psych study kit, used with his permission and reformatted by David. Pick a unit; progress in each one is saved in this browser.","hub":"https://dn4563.github.io/Study-Hub-by-David/","accent":"#2F6B5E","accentDark":"#7FC2B1","examTab":"Mock exam","units":[{"id":"u0","label":"Unit 0","title":"Perspectives, Research & Statistics","blurb":"The seven perspectives, research methods, and statistics and data.","learnMix":true},{"id":"u1","label":"Unit 1","title":"Neuroscience, Senses, Sleep & Drugs","blurb":"The neuron, neurotransmitters, the nervous and endocrine systems, the brain, vision, the other senses, and sleep, consciousness and drugs. Optional: split brain.","learnMix":true,"recall":true},{"id":"u5","label":"Unit 5","title":"Health, Disorders & Treatment","blurb":"Health psychology, an introduction to disorders, anxiety, depressive and bipolar, neurodevelopmental, dissociative, schizophrenia spectrum, OCD and trauma, eating and personality disorders, and treatment.","learnMix":true,"recall":true},{"id":"per","label":"Perception","title":"Perception","blurb":"Attention, top-down vs. bottom-up processing, thresholds, and ESP, from the Perception slides.","learnMix":true,"recall":true}]};
const UNITDATA = {"u0":{"images":{},"decks":[{"id":1,"name":"Perspectives in Psychology","optional":false,"sections":[{"name":"What perspectives are","cards":[{"term":"Psychological perspectives","def":"The different approaches psychologists use to explain human behavior and thought processes, like viewing a situation through a different set of lenses. There are 7.","hook":"Perspective = a pair of glasses.","asks":[{"q":"Two psychologists explain the same panic attack differently: one points to brain chemistry, the other to childhood memories. What does this show?","right":"The same behavior can be viewed through different lenses","wrong":[["One of the two psychologists must be wrong","Perspectives are different lenses, not right and wrong answers."],["Panic attacks can only be explained by brain chemistry","Several perspectives can explain the same behavior."],["Psychology has no agreed-upon methods for studying behavior","Perspectives are approaches to explaining behavior, not a lack of method."]],"exp":"Perspectives are like different pairs of glasses for looking at one behavior."},{"q":"Why do psychologists use several perspectives instead of just one?","right":"Each shows a different side of the behavior","wrong":[["Only one perspective can ever be correct, so they test all seven of them","Perspectives are lenses, not right and wrong answers."],["To avoid doing research","Perspectives don't replace research."],["Because the DSM requires it","Not on your slides."]],"exp":"Like looking through different sets of lenses."}]},{"term":"The 7 perspectives","def":"Psychodynamic, cognitive, behavioral, humanistic, biological, evolutionary, and sociocultural.","hook":"Your slide's hand: thumb = psychodynamic; fingers = cognitive, behavioral, humanism, biological; palm = sociocultural; wrist = evolutionary.","asks":[{"q":"A student lists the perspectives for a quiz. Which one does NOT belong on the list?","right":"Astrological","wrong":[["Evolutionary","Evolutionary is one of the 7."],["Sociocultural","Sociocultural is one of the 7."],["Psychodynamic","Psychodynamic is one of the 7."]],"exp":"The 7: psychodynamic, cognitive, behavioral, humanistic, biological, evolutionary, sociocultural."},{"q":"One psychologist says a fear of snakes was inherited from ancestors who survived by avoiding them; another says it was learned after a bad experience. Which two perspectives are these?","right":"Evolutionary and behavioral","wrong":[["Psychodynamic and humanistic, focused on the unconscious and on growth","Neither is about ancestors or learning."],["Biological and cognitive","Not the two described."],["Sociocultural and biological","Not the two described."]],"exp":"Ancestors' survival = evolutionary; learned experience = behavioral."}]}]},{"name":"The seven perspectives","cards":[{"term":"Psychodynamic perspective","def":"Behavior is influenced by your unconscious mind and past experiences, especially those from childhood. Based heavily on the ideas of Freud.","hook":"Iceberg: most of the mind is hidden below the surface.","asks":[{"q":"A therapist says Tom's fear of commitment comes from feelings about his parents' divorce that he isn't aware of. Which perspective is this?","right":"Psychodynamic","wrong":[["Behavioral","Behavioral looks at rewards and learning, not unconscious feelings."],["Cognitive","Cognitive looks at conscious thought processes like memory and problem solving."],["Sociocultural","Sociocultural looks at culture, not unconscious feelings."]],"exp":"Unconscious mind + childhood experiences = psychodynamic (Freud)."},{"q":"Which explanation of a teen's nail-biting is psychodynamic?","right":"An unconscious conflict from early childhood","wrong":[["He gets attention from his parents each time he bites his nails","That is behavioral (reinforcement)."],["A genetic tendency toward anxiety","That is biological."],["Grooming helped ancestors survive","That is evolutionary."]],"exp":"Psychodynamic: the unconscious mind and childhood experiences."}]},{"term":"Cognitive perspective","def":"How our internal thought processes shape our behavior. Emphasizes memory, problem solving, intelligence, and perception.","hook":"Cognitive = thinking.","asks":[{"q":"A psychologist studies how students' ways of organizing information affect how well they solve math problems. Which perspective is she using?","right":"Cognitive","wrong":[["Humanistic","Humanistic focuses on potential and free will."],["Biological","Biological focuses on genes, hormones and brain chemistry."],["Sociocultural","Sociocultural focuses on culture and social influences."]],"exp":"Thinking, memory and problem solving = cognitive."},{"q":"A student keeps failing tests because she always assumes she'll forget everything. Which perspective focuses on that thought?","right":"Cognitive","wrong":[["Behavioral, which looks at rewards and punishments she has received","The focus here is her thinking."],["Evolutionary","Not about ancestors."],["Biological","Not about genes or chemistry."]],"exp":"Thought processes shape behavior."}]},{"term":"Behavioral perspective","def":"How our behaviors have been influenced by our learned experiences. We often repeat behaviors that are reinforced by positive rewards.","hook":"The dog that jumps through a hoop for a treat.","asks":[{"q":"A child keeps cleaning her room because her parents give her a sticker each time. Which perspective best explains this?","right":"Behavioral","wrong":[["Psychodynamic","There is no unconscious conflict here, just a reward."],["Evolutionary","Stickers have nothing to do with ancestral survival."],["Cognitive","The explanation is the reward, not her thought processes."]],"exp":"Behaviors that are reinforced by rewards get repeated."},{"q":"A dog learns to sit because it gets a treat each time. Which perspective explains this best?","right":"Behavioral","wrong":[["Humanistic, about reaching one's full potential through free will","This is about rewards."],["Cognitive","Not about thought processes."],["Sociocultural","Not about culture."]],"exp":"Reinforced behaviors are repeated."}]},{"term":"Humanistic perspective","def":"How humans can achieve their full potential, emphasizing free will, self-efficacy, and self-actualization. Also emphasizes relationships, positivity, and maximizing well-being.","hook":"Humanistic = hopeful, reaching your potential.","asks":[{"q":"A counselor helps a client set goals so he can become the best version of himself, stressing that he is free to choose his path. Which perspective is this?","right":"Humanistic","wrong":[["Behavioral","Behavioral focuses on rewards, not free will and potential."],["Biological","Nothing here involves the body or brain chemistry."],["Psychodynamic","Nothing here involves the unconscious or childhood."]],"exp":"Full potential, free will and self-actualization = humanistic."},{"q":"Which word list fits the humanistic perspective?","right":"Free will, self-actualization, positivity","wrong":[["Unconscious mind, childhood conflicts and hidden desires from Freud","That is psychodynamic."],["Genes, hormones, neurotransmitters","That is biological."],["Rewards, punishments, learning","That is behavioral."]],"exp":"Humanistic = potential, free will, positivity."}]},{"term":"Biological perspective","def":"The importance of genetics, brain chemistry, hormones, and neurotransmitters (like dopamine and serotonin) in influencing behavior and thinking.","hook":"Bio = body: genes, brain, chemicals.","asks":[{"q":"A researcher explains a teen's mood swings by changes in hormones and serotonin levels. Which perspective is this?","right":"Biological","wrong":[["Sociocultural","That would focus on culture, not body chemistry."],["Humanistic","That would focus on potential and free will."],["Cognitive","That would focus on thought processes."]],"exp":"Genes, hormones and neurotransmitters = biological."},{"q":"A twin study finds anxiety runs in families. Which perspective does this support?","right":"Biological","wrong":[["Sociocultural, since families share the same culture and norms","The twin focus points to genes."],["Humanistic","Not about potential."],["Psychodynamic","Not about the unconscious."]],"exp":"Genetics, brain chemistry, hormones and neurotransmitters."}]},{"term":"Evolutionary perspective","def":"Human behavior is a result of evolutionary processes that protect us, give us adaptive behaviors, and help us be more successful at reproducing.","hook":"What helped our ancestors survive.","asks":[{"q":"Why do people fear snakes more than cars, even though cars kill far more people? Which perspective would say fearing snakes protected our ancestors?","right":"Evolutionary","wrong":[["Behavioral","Behavioral would point to learned rewards and punishments."],["Psychodynamic","Psychodynamic would point to unconscious conflicts."],["Humanistic","Humanistic would point to growth and potential."]],"exp":"Behaviors that helped ancestors survive and reproduce = evolutionary."},{"q":"Why might people prefer sweet, high-calorie food, according to the evolutionary perspective?","right":"It helped ancestors survive","wrong":[["Their parents rewarded them with candy as children, building a habit","That is behavioral."],["Their culture values dessert","That is sociocultural."],["Low serotonin","That is biological."]],"exp":"Behaviors that helped ancestors survive and reproduce."}]},{"term":"Sociocultural perspective","def":"Humans behave and act differently based on the influences of their culture or way of life.","hook":"Socio = society; culture = way of life.","asks":[{"q":"In one country people greet with a bow, in another with a handshake. Which perspective best explains the difference?","right":"Sociocultural","wrong":[["Biological","Greeting styles come from culture, not genes."],["Evolutionary","These customs differ by culture, not by ancestral survival needs."],["Psychodynamic","Greeting customs come from culture, not unconscious conflicts."]],"exp":"Culture and way of life shape behavior."},{"q":"Teens in one country value independence, while teens in another value family duty. Which perspective explains the difference?","right":"Sociocultural","wrong":[["Biological, from different genes in the teens of each country","Culture explains this difference."],["Evolutionary","Not about ancestors."],["Cognitive","Not about thinking processes."]],"exp":"Culture and way of life shape behavior."}]}]},{"name":"Applying perspectives","cards":[{"term":"Applying a perspective","def":"To analyze a behavior from a perspective, explain it using what that perspective focuses on. The same behavior can be explained by more than one perspective.","hook":"","asks":[{"q":"A test asks you to explain why someone overeats using two perspectives. What is the best approach?","right":"Explain it with what each perspective focuses on","wrong":[["Pick the one correct perspective and ignore the rest","The same behavior can be explained by more than one perspective."],["Describe the behavior in detail without any theory","Applying means explaining it through a perspective's focus."],["Name the perspectives without connecting them to the behavior","You must tie each perspective's focus to the behavior."]],"exp":"Apply a perspective by using its focus (rewards, genes, culture, etc.) to explain the behavior."},{"q":"To explain road rage from the behavioral perspective, what should you focus on?","right":"What has been rewarded or learned","wrong":[["The driver's unconscious childhood conflicts and hidden feelings","That is psychodynamic."],["Stress hormones","That is biological."],["Ancestors' survival","That is evolutionary."]],"exp":"Apply a perspective using its focus."}]},{"term":"Slide example: Suzanne","def":"Suzanne loves romantic comedies. Your slide's sociocultural explanation: in her culture it's popular for women to enjoy romantic movies, and going gives her something to do with friends and an easy topic of conversation.","hook":"","asks":[{"q":"Suzanne loves romantic comedies. Which explanation uses the same perspective as your slide's example?","right":"Her friends all watch them, so it's what her group does together","wrong":[["Watching them releases dopamine and serotonin in her brain's reward system","That is a biological explanation."],["She was rewarded with praise the first time she chose one","That is a behavioral explanation."],["They remind her of unresolved feelings from her childhood","That is a psychodynamic explanation."]],"exp":"The slide's explanation is sociocultural: her culture and friends make romantic movies popular and social."},{"q":"Which explanation of Suzanne loving romantic comedies uses the humanistic perspective?","right":"They help her grow and feel positive","wrong":[["Watching them is popular among the women in her culture and friends","That is the slide's sociocultural explanation."],["Dopamine release","That is biological."],["Childhood memories","That is psychodynamic."]],"exp":"Humanistic focuses on growth and positivity."}]},{"term":"Perspective keywords","def":"Unconscious, childhood, Freud → psychodynamic. Thoughts, memory, problem solving → cognitive. Rewards, learning → behavioral. Potential, free will, positivity → humanistic. Genes, hormones, neurotransmitters → biological. Ancestors, survival, reproduction → evolutionary. Culture, social norms → sociocultural.","hook":"","asks":[{"q":"A test question mentions \"ancestors\" and \"reproduction.\" Which perspective is it most likely pointing to?","right":"Evolutionary","wrong":[["Sociocultural","Its keywords are culture and social norms."],["Humanistic","Its keywords are potential, free will and positivity."],["Cognitive","Its keywords are thoughts, memory and problem solving."]],"exp":"Ancestors, survival, reproduction → evolutionary."},{"q":"A question mentions \"social norms.\" Which perspective is it pointing to?","right":"Sociocultural","wrong":[["Cognitive, which is about memory, thoughts and problem solving","Its keywords are thoughts and memory."],["Behavioral","Its keywords are rewards and learning."],["Biological","Its keywords are genes and hormones."]],"exp":"Culture and social norms → sociocultural."}]}]}],"intro":["The 7 psychological perspectives from the 0.3 slides, what each one focuses on, and how to apply them to a scenario."]},{"id":2,"name":"Research Methods","optional":false,"sections":[{"name":"Why psychology needs research","cards":[{"term":"Intuition","def":"Understanding without conscious reasoning. Your slides ask whether we can rely on it. We can't, which is why psychology uses research.","hook":"","asks":[{"q":"A coach picks players based on a gut feeling instead of their stats. Why would a psychologist distrust this?","right":"Understanding without reasoning is often wrong","wrong":[["Gut feelings are always based on careful research","Intuition is understanding without conscious reasoning."],["Coaches are not allowed to use statistics","Nothing stops them; the issue is relying on intuition."],["Intuition can only be used by trained psychologists","Anyone can use it; it just isn't reliable."]],"exp":"We can't rely on intuition, which is why psychology uses research."},{"q":"Which situation shows why we can't rely on intuition?","right":"Someone is sure a coin is \"due\" for heads","wrong":[["A scientist runs an experiment and repeats it to check her results","That is research, not intuition."],["A teacher uses a test","Not an intuition error."],["A doctor reads an MRI","Not an intuition error."]],"exp":"Intuition fails through misunderstanding probability, hindsight bias and overconfidence."}]},{"term":"Why intuition fails","def":"Your slides: \"Psychology exists because our intuition sucks,\" because of hindsight bias, misunderstanding of probability, and overconfidence.","hook":"HMO: Hindsight, Misunderstanding probability, Overconfidence.","asks":[{"q":"Which set of problems does your class say makes intuition unreliable?","right":"Hindsight bias, misjudging chance, overconfidence","wrong":[["Placebo effect, Hawthorne effect and Barnum effect","Those are problems with research studies."],["Case studies, surveys and naturalistic observation","Those are descriptive research methods."],["Mean, median and mode","Those are measures of central tendency."]],"exp":"HMO: Hindsight, Misunderstanding probability, Overconfidence."},{"q":"Which of these is NOT one of the reasons your slides give for intuition failing?","right":"Too much research","wrong":[["Hindsight bias, believing you knew it all along after the fact","That is on the list."],["Overconfidence","That is on the list."],["Misunderstanding probability","That is on the list."]],"exp":"HMO: hindsight, misunderstanding probability, overconfidence."}]},{"term":"Hindsight bias","def":"The tendency to believe, after learning the outcome, that you would have foreseen it.","hook":"\"I knew it all along!\"","asks":[{"q":"After the election, Jordan says, \"I always knew she would win,\" though he predicted the opposite. What is this?","right":"Hindsight bias","wrong":[["Overconfidence","Overconfidence is overestimating your knowledge before the fact."],["Gambler's fallacy","That is seeing patterns in random data."],["Barnum effect","That is believing general descriptions apply specifically to you."]],"exp":"\"I knew it all along!\" after learning the outcome."},{"q":"After a team loses the championship, fans say the coach's strategy was obviously wrong. What bias might this be?","right":"Hindsight bias","wrong":[["Overconfidence about how much one knows before the game starts","This is judging after the outcome."],["Barnum effect","Not about personality descriptions."],["Placebo effect","Not about expectations of a treatment."]],"exp":"\"I knew it all along\" after the outcome."}]},{"term":"Overconfidence","def":"The tendency to overestimate your knowledge and/or ability.","hook":"","asks":[{"q":"Maya is sure she aced the test and doesn't check her answers, but she scores a 62. What best explains her certainty?","right":"Overconfidence","wrong":[["Hindsight bias","Hindsight bias happens after the outcome is known."],["The placebo effect","That is a result caused by expectations in an experiment."],["Social desirability bias","That is answering to look good to others."]],"exp":"Overestimating your knowledge or ability."},{"q":"Students predict they'll finish a project in 2 days, but it takes 6. Which error does this show?","right":"Overconfidence","wrong":[["Hindsight bias about having known the result all along","This is a prediction before the fact."],["Gambler's fallacy","Not about random patterns."],["Sampling bias","Not about samples."]],"exp":"Overestimating knowledge or ability."}]},{"term":"Misunderstanding of probability","def":"People are bad at judging chance and very large numbers. Your class showed this with a coin toss and by guessing what could hold a million, a billion, and a trillion dollars.","hook":"","asks":[{"q":"After five coin flips land heads, Sam is sure the next one must be tails. What weakness of intuition does this show?","right":"Misunderstanding probability","wrong":[["Hindsight bias","Hindsight bias is about claiming you knew an outcome after it happened."],["Being watched (the Hawthorne effect)","That is changing behavior because you are watched."],["Operational definitions","Those are exact ways to measure variables."]],"exp":"Each flip is still 50/50; people are bad at judging chance."},{"q":"Which belief shows a misunderstanding of probability?","right":"A family with 3 girls is \"due\" for a boy","wrong":[["A fair coin has about a 50% chance of landing on heads each flip","That is correct."],["Large samples are better","That is correct."],["Correlation isn't causation","That is correct."]],"exp":"Each event is still independent; people are bad at judging chance."}]}]},{"name":"The scientific method","cards":[{"term":"The scientific method (7 steps)","def":"1. Observe some aspect of the universe. 2. Develop a theory. 3. Use the theory to make a hypothesis. 4. Test the predictions with experiments, using operational definitions. 5. Evaluate the results. 6. Modify the theory in light of your findings. 7. Replicate.","hook":"","asks":[{"q":"A researcher has just tested her predictions and evaluated the results. What should she do next?","right":"Modify the theory based on her findings","wrong":[["Develop a theory for the first time","The theory comes before the hypothesis and testing."],["Make her very first observation","Observing is step 1."],["Write the hypothesis before running any test","The hypothesis comes before testing."]],"exp":"Observe, theory, hypothesis, test, evaluate, modify, replicate."},{"q":"What is the last step of the scientific method on your slides?","right":"Replicate","wrong":[["Develop a theory that explains what has been observed so far","That is step 2."],["Make a hypothesis","That is step 3."],["Observe","That is step 1."]],"exp":"Step 7: replicate."}]},{"term":"Theory","def":"A general idea that is consistent with what you have observed. Step 2 of the scientific method.","hook":"","asks":[{"q":"After noticing that tired students seem to remember less, a researcher proposes a general idea that sleep supports memory. What has she proposed?","right":"A theory","wrong":[["A hypothesis","A hypothesis is a specific, testable prediction made from a theory."],["An operational definition","That is how a variable will be measured."],["A replication","That is repeating a study."]],"exp":"A theory is a general idea that fits what you observed (step 2)."},{"q":"Which statement is a theory rather than a hypothesis?","right":"Friendly people make others feel relaxed","wrong":[["Students with a friendly photographer will smile more in their photos","That is a testable prediction (hypothesis)."],["Smiling will be counted","That is an operational definition."],["The study will be repeated","That is replication."]],"exp":"A theory is a general idea."}]},{"term":"Hypothesis","def":"An educated prediction or guess, made using a theory. Step 3 of the scientific method. Example from your slides: students are more likely to smile for their senior pictures if they have a friendly photographer.","hook":"Hypothesis = the testable prediction.","asks":[{"q":"\"Students who sleep 8 hours will score higher on tomorrow's memory test than students who sleep 4 hours.\" What is this statement?","right":"A hypothesis","wrong":[["A theory","A theory is a broad idea; this is a specific prediction."],["A debriefing","A debriefing explains a study after it ends."],["A correlation coefficient","That is a number from -1 to +1."]],"exp":"A hypothesis is a testable prediction made from a theory."},{"q":"Which statement is a hypothesis rather than a theory?","right":"Kids who eat breakfast will score higher on today's quiz","wrong":[["Good nutrition helps the brain think more clearly in general over time","That is a general idea (theory)."],["People like breakfast","Not a prediction from a theory."],["Breakfast is a meal","Not a prediction."]],"exp":"A hypothesis is a specific, testable prediction made from a theory."}]},{"term":"Operational definition","def":"Exact specifications of how the research is conducted, including exactly how each variable will be measured. Needed in step 4. Your class did a Lego activity on this.","hook":"Operational = how it OPERATES in the study.","asks":[{"q":"A study measures \"aggression\" as the number of times a child hits a doll in 10 minutes. What is this?","right":"An operational definition","wrong":[["A confounding variable in the study","A confounding variable is an outside influence on the results."],["A hypothesis","A hypothesis is a prediction, not a measurement plan."],["A case study","A case study examines one person or group in depth."]],"exp":"It states exactly how the variable is measured."},{"q":"Which is the best operational definition of \"studying\"?","right":"Minutes spent reading notes, timed","wrong":[["Doing schoolwork in a way that helps you learn the material well","Too vague to measure."],["Trying hard","Too vague."],["Being a good student","Too vague."]],"exp":"Exactly how the variable will be measured."}]},{"term":"Why operational definitions matter","def":"Research cannot be replicated without operational definitions. In the senior-picture example, both \"smiling\" and \"friendliness\" need one, because people disagree about how many of the students in the yearbook photos are smiling.","hook":"","asks":[{"q":"Two labs run the \"same\" happiness study but get different results because each measured happiness differently. What was missing?","right":"A shared operational definition","wrong":[["A larger control group of participants","Group size doesn't fix measuring the variable differently."],["Informed consent","Consent is an ethics rule, not a measurement plan."],["A higher p-value","A p-value doesn't define how to measure a variable."]],"exp":"Research can't be replicated without operational definitions."},{"q":"In the senior-picture example, why does \"smiling\" need an operational definition?","right":"People disagree about who is smiling","wrong":[["Smiling is impossible to see in printed yearbook photos at all","It can be seen; people judge it differently."],["It doesn't; it's obvious","People disagree."],["Only friendliness needs one","Both do."]],"exp":"Both \"smiling\" and \"friendliness\" need operational definitions."}]},{"term":"Replicate","def":"Doing the research a second time to ensure the reliability of the results. Step 7 of the scientific method.","hook":"Replicate = repeat.","asks":[{"q":"A surprising finding is published. Other researchers run the identical study to see if they get the same result. What are they doing?","right":"Replicating it","wrong":[["Debriefing it","Debriefing explains a study to participants afterward."],["Operationalizing it","That means defining how variables are measured."],["Hypothesizing it","They are repeating it, not making a prediction."]],"exp":"Replication checks that results are reliable (step 7)."},{"q":"A study's result disappears when other labs repeat it. What does this suggest?","right":"The original result may not be reliable","wrong":[["The original study is now proven to be completely true and accurate","Failed replication weakens it."],["Replication is unethical","Not true."],["The theory is a hypothesis","Not the point."]],"exp":"Replication ensures the reliability of results."}]}]},{"name":"Types of research","cards":[{"term":"Three types of research","def":"Descriptive, correlational, and experimental.","hook":"","asks":[{"q":"Which list names the three types of research on your slides?","right":"Descriptive, correlational, experimental","wrong":[["Case study, survey, naturalistic observation","Those are all descriptive methods."],["Mean, median, mode","Those are measures of central tendency."],["Population, sample, control group","Those are parts of an experiment."]],"exp":"Descriptive, correlational and experimental."},{"q":"Which type of research is the only one that can show cause and effect?","right":"Experimental","wrong":[["Correlational, which shows how two variables are related","Correlation doesn't show cause."],["Descriptive","Doesn't show cause."],["Surveys","Descriptive; doesn't show cause."]],"exp":"Only experiments can show cause and effect."}]},{"term":"Descriptive research","def":"Describes behaviors, often using case studies, surveys, or naturalistic observations.","hook":"","asks":[{"q":"A researcher watches and records how children share toys at recess, without changing anything. What type of research is this?","right":"Descriptive","wrong":[["Experimental","Nothing is manipulated, so it can't be an experiment."],["Correlational","She isn't measuring a relationship between two variables."],["Meta-analysis","That combines the results of many studies."]],"exp":"Describing behavior (here by naturalistic observation) is descriptive research."},{"q":"Which method is descriptive research?","right":"A case study","wrong":[["An experiment with a control group and a manipulated variable","That is experimental."],["A correlation coefficient","That is correlational."],["A meta-analysis","That combines studies."]],"exp":"Descriptive: case studies, surveys, naturalistic observation."}]},{"term":"Correlational research","def":"Associates different factors or variables: it tells us about the relationship between two variables.","hook":"","asks":[{"q":"A study finds that students who use their phones more tend to sleep less. What type of research is this?","right":"Correlational","wrong":[["Experimental","No variable was manipulated."],["Descriptive","It relates two variables rather than just describing one."],["A case study of one student","It studies many students, not one in depth."]],"exp":"It shows a relationship between two variables."},{"q":"A researcher finds that more exercise goes with better mood. What can she conclude?","right":"They are related","wrong":[["Exercise definitely causes better mood in every person who tries it","Correlation can't show cause."],["Mood causes exercise","Can't show direction."],["Nothing at all","She found a relationship."]],"exp":"Correlational research shows a relationship between two variables."}]},{"term":"Experimental research","def":"Manipulates variables to establish cause-and-effect relationships. Of the three types, only experiments can show cause and effect.","hook":"","asks":[{"q":"A researcher wants to prove that caffeine CAUSES faster reaction times. Which type of research must she use?","right":"Experimental","wrong":[["Correlational","Correlation can't show cause and effect."],["Descriptive","Describing behavior can't show cause and effect."],["A survey","Self-reports can't show cause and effect."]],"exp":"Only experiments can show cause and effect."},{"q":"To prove music improves focus, which design is needed?","right":"Randomly assign some to music, some to silence","wrong":[["Ask students whether they think that music helps them focus","That is a survey."],["Watch students in the library","That is observation."],["Study one musician","That is a case study."]],"exp":"Experiments manipulate variables to show cause and effect."}]}]},{"name":"Descriptive methods","cards":[{"term":"Case study","def":"A descriptive method that examines one individual or group in depth.","hook":"","asks":[{"q":"A psychologist spends two years studying one patient with a rare memory loss. What method is this?","right":"A case study","wrong":[["A survey","Surveys question a sample of a group."],["An experiment","Nothing is being manipulated."],["Naturalistic observation","That watches behavior in natural settings, usually many people."]],"exp":"One individual examined in depth."},{"q":"Why might a researcher choose a case study for a rare disorder?","right":"Few people have it, so depth helps","wrong":[["To get a large random sample of the whole population at once","Case studies examine one person or group."],["To prove cause and effect","Case studies can't."],["To use a control group","Not a case study."]],"exp":"A case study examines one individual or group in depth."}]},{"term":"Case study: pros and cons","def":"Advantages: in-depth information about a limited number of subjects; illustrates general principles that can be applied to others. Disadvantages: misleading if the individual is atypical or underrepresented; can overgeneralize the results.","hook":"","asks":[{"q":"A researcher concludes all people with brain injuries react like the one patient she studied. What weakness of case studies is this?","right":"Overgeneralizing from one atypical person","wrong":[["Collecting too much data in a short time","That is an advantage of surveys."],["Participants acting differently when watched","That is a problem with observation."],["Questions being poorly worded","That is a problem with surveys."]],"exp":"Case studies can mislead if the person is atypical, and results can be overgeneralized."},{"q":"Which is an advantage of a case study?","right":"In-depth information about one subject","wrong":[["It can always be generalized safely to the entire population","That is a risk, not a strength."],["It shows cause and effect","It can't."],["It's quick","Not listed."]],"exp":"Advantage: in-depth information; illustrates general principles."}]},{"term":"Naturalistic observation","def":"A descriptive technique that observes and records behavior in naturally occurring situations, without trying to manipulate or control the situation.","hook":"","asks":[{"q":"A researcher sits in a mall food court and records how often people check their phones, without interacting. What method is this?","right":"Naturalistic observation","wrong":[["A survey","She isn't asking anyone questions."],["A controlled laboratory experiment","She isn't manipulating anything."],["A case study","She is watching many people, not one in depth."]],"exp":"Observing behavior in natural settings without controlling it."},{"q":"What is the key rule of naturalistic observation?","right":"Don't control or manipulate the situation","wrong":[["Ask every participant to fill out a survey about their behavior","That is a survey."],["Assign people to groups","That is an experiment."],["Study one person","That is a case study."]],"exp":"Observe and record without manipulating."}]},{"term":"Naturalistic observation: pros and cons","def":"Advantage: non-invasive, so subjects are more likely to show honest behavior in a natural setting. Disadvantages: can be time consuming; subjects may notice the observer and act differently; the observer may misinterpret the subjects' actions.","hook":"","asks":[{"q":"During an observation, the shoppers notice the researcher and start acting more politely. What problem is this?","right":"Subjects acting differently because they notice the observer","wrong":[["A poor response rate because too few people send back the survey","That is a survey problem."],["Overgeneralizing from one subject","That is a case-study problem."],["Poorly worded questions","That is a survey problem."]],"exp":"One disadvantage: subjects may notice the observer and change their behavior."},{"q":"Which is an advantage of naturalistic observation?","right":"People act honestly in natural settings","wrong":[["It takes very little time and can be finished in a single afternoon","It can be time consuming."],["It shows cause","It can't."],["Subjects never notice","They might."]],"exp":"Non-invasive: subjects are more likely to show honest behavior."}]},{"term":"Survey","def":"A descriptive technique used to get the self-reported attitudes and behaviors of a particular group, usually by questioning a representative random sample of the group.","hook":"","asks":[{"q":"A school sends a questionnaire to a random sample of 300 students about their study habits. What method is this?","right":"A survey","wrong":[["A case study","A case study looks at one person in depth."],["An experiment","Nothing is manipulated."],["Naturalistic observation","Students report on themselves instead of being watched."]],"exp":"Self-reported attitudes and behaviors from a sample."},{"q":"What makes a survey's results more likely to apply to the whole group?","right":"A representative random sample","wrong":[["Asking only the researcher's closest friends and family members","That is a biased sample."],["Asking leading questions","That skews results."],["A small sample","Bigger is better."]],"exp":"Surveys question a representative random sample."}]},{"term":"Survey: pros and cons","def":"Advantages: collects a large amount of data in a short time; flexible (online, in person, etc.). Disadvantages: poorly worded questions can skew responses; participants may try to please the researcher; people may lie to look better or have mistaken memories; can have a poor response rate.","hook":"","asks":[{"q":"A survey asks, \"Don't you agree that homework is a waste of time?\" What disadvantage of surveys does this show?","right":"Poorly worded questions skew responses","wrong":[["It can be very time consuming to watch subjects","That is an observation problem."],["It studies only one atypical individual","That is a case-study problem."],["It can't collect much data quickly","Surveys collect a lot of data quickly."]],"exp":"The question pushes people toward one answer."},{"q":"Which is an advantage of surveys?","right":"Lots of data in a short time","wrong":[["People always answer completely honestly about their own behavior","People may lie or misremember."],["It shows cause","It can't."],["Wording never matters","Wording can skew answers."]],"exp":"Advantages: large amounts of data quickly; flexible."}]}]},{"name":"Correlation","cards":[{"term":"Correlation","def":"Research that tells us about the relationship between two variables (a \"co-relation\").","hook":"","asks":[{"q":"A researcher wants to know whether hours of TV and reading scores are related, without changing anything. What is she studying?","right":"A correlation","wrong":[["A cause-and-effect relationship","Without manipulation, she can't show cause."],["An operational definition","That is how a variable is measured."],["A placebo effect","That is a result caused by expectations."]],"exp":"Correlation describes the relationship between two variables."},{"q":"Which question could correlational research answer?","right":"Do taller people earn more?","wrong":[["Does a new drug cause people's depression to go down?","That needs an experiment."],["What is one patient's life like?","That is a case study."],["What happens at recess?","That is observation."]],"exp":"Correlation describes a relationship between two variables."}]},{"term":"Positive correlation","def":"Two variables increase or decrease together. Examples from your slides: as sleep increases, memory increases; as salary decreases, spending also decreases; as hourly pay increases, employee morale increases.","hook":"Same direction = positive.","asks":[{"q":"The more hours students practice piano, the higher their recital scores. What kind of correlation is this?","right":"Positive","wrong":[["Negative","In a negative correlation, one goes up as the other goes down."],["Zero","There is a clear relationship here."],["Bimodal","Bimodal describes a curve with two peaks, not a correlation."]],"exp":"Both variables increase together."},{"q":"Which pair is a positive correlation from your slides?","right":"More sleep, better memory","wrong":[["More absences from school, which go with lower grades","That is negative."],["Less sleep, more stress","That is negative."],["Shoe size and grades","That is zero."]],"exp":"Both variables move in the same direction."}]},{"term":"Negative correlation","def":"When one variable increases, the other decreases. Examples from your slides: as absences increase, grades decrease; as hours of sleep decrease, levels of stress increase.","hook":"Opposite directions = negative.","asks":[{"q":"As the number of absences rises, a student's grades fall. What kind of correlation is this?","right":"Negative","wrong":[["Positive","In a positive correlation both move the same way."],["Zero","There is a relationship here."],["Perfect positive","The variables move in opposite directions."]],"exp":"One goes up, the other goes down."},{"q":"Which pair would most likely show a negative correlation?","right":"Hours of TV and homework completed","wrong":[["Hours of practice and skill, which both go up together","That is positive."],["Height and weight","Usually positive."],["Shoe size and IQ","Likely zero."]],"exp":"One goes up as the other goes down."}]},{"term":"Zero (no) correlation","def":"No relationship between the two variables. On a scatterplot, the dots are scattered with no pattern.","hook":"","asks":[{"q":"A scatterplot of shoe size and math grades shows dots spread everywhere with no pattern. What does this show?","right":"No correlation","wrong":[["A strong positive correlation","That would show dots rising together in a line."],["A strong negative correlation","That would show dots falling in a line."],["A cause-and-effect relationship","A scatterplot alone can't show cause."]],"exp":"No pattern means no relationship."},{"q":"What correlation coefficient means no relationship?","right":"0","wrong":[["-1.0, which is the strongest possible negative relationship","That is a perfect negative."],["+1.0","That is perfect positive."],["+0.9","That is high positive."]],"exp":"0 means no correlation."}]},{"term":"Correlation coefficient","def":"A number from -1.0 to +1.0. The sign shows the direction. The closer to +1 or -1, the stronger the relationship; 0 means no correlation. Your slide's chart: 1 perfect, 0.9 high, 0.5 low, 0 none, and the same on the negative side.","hook":"","asks":[{"q":"Which correlation coefficient shows the STRONGEST relationship?","right":"-0.92","wrong":[["+0.45","Closer to zero, so weaker."],["+0.10","Very close to zero, so very weak."],["0.00","Zero means no correlation."]],"exp":"Strength depends on how close the number is to +1 or -1, not on the sign."},{"q":"Which coefficient is a weaker relationship than -0.5?","right":"+0.3","wrong":[["-0.8, which is further away from zero on the number line","That is stronger."],["+0.9","That is stronger."],["-1.0","That is perfect."]],"exp":"Strength is how close it is to +1 or -1, not the sign."}]},{"term":"Positive isn't \"good\"","def":"Positive doesn't mean \"good\" and negative doesn't mean \"bad.\" The sign only describes the direction of the relationship.","hook":"","asks":[{"q":"A study finds a positive correlation between stress and illness. A classmate says, \"Positive, so that's good news.\" What is wrong?","right":"Positive only means both rise together","wrong":[["Positive correlations always prove causation","No correlation proves causation."],["Stress and illness can't be correlated","They can be; the sign just shows direction."],["The correlation must actually be zero","Nothing suggests that."]],"exp":"The sign describes direction, not whether it is good or bad."},{"q":"A study finds a negative correlation between exercise and illness. Is that bad news?","right":"No; more exercise goes with less illness","wrong":[["Yes, because every negative correlation is a sign of something bad","Negative only means opposite directions."],["Yes, exercise causes illness","Not what it shows."],["It means no relationship","That would be zero."]],"exp":"The sign describes direction, not good or bad."}]},{"term":"Correlation does not equal causation","def":"Two things being related doesn't mean one causes the other. Your slides' example: ice cream sales and violent crime are correlated, but ice cream doesn't turn people into criminals. Ice cream and sunburn are correlated because hot, sunny summer weather causes both.","hook":"A third factor (like summer weather) can cause both.","asks":[{"q":"Cities with more firefighters have more fire damage. Which conclusion is best?","right":"A third factor, like bigger fires, may explain both","wrong":[["Firefighters cause fire damage","Correlation does not show causation."],["The study proves fewer firefighters would reduce damage","A correlation can't prove that."],["There is no relationship between the two","There is a relationship; it just isn't proven causal."]],"exp":"Like ice cream and sunburn, a third factor (big fires) causes both."},{"q":"Ice cream sales and sunburns rise together. What explains this best?","right":"Hot, sunny weather causes both","wrong":[["Eating ice cream makes people's skin burn more easily in the sun","Correlation doesn't show cause."],["Sunburns make people crave ice cream","Not shown."],["It's a coincidence with no cause","A third factor explains it."]],"exp":"A third factor (summer weather) causes both."}]}]},{"name":"Experiments","cards":[{"term":"Population","def":"The group that the research is meant to apply to.","hook":"","asks":[{"q":"A researcher wants her findings to apply to all U.S. high school students. What is \"all U.S. high school students\" in her study?","right":"The population","wrong":[["The sample","The sample is the smaller group actually studied."],["The control group","That group doesn't receive the manipulated variable."],["The dependent variable","That is what is measured."]],"exp":"The population is the group the research is meant to apply to."},{"q":"A study samples 200 nurses to learn about all U.S. nurses. What is the population?","right":"All U.S. nurses","wrong":[["The 200 nurses who actually take part in the study itself","That is the sample."],["The control group","That is part of the sample."],["The researchers","Not the population."]],"exp":"The group the research is meant to apply to."}]},{"term":"Sample","def":"A variety of people from the population used as participants in the research.","hook":"","asks":[{"q":"From all U.S. high school students, a researcher studies 500. What are the 500?","right":"The sample","wrong":[["The population","The population is all U.S. high school students."],["The independent variable","That is the factor the researcher changes."],["A case study","A case study examines one person or group in depth."]],"exp":"The sample is the people from the population who take part."},{"q":"Why do researchers study a sample instead of the whole population?","right":"Studying everyone is usually impossible","wrong":[["The sample is always much larger than the population being studied","It's smaller."],["To avoid ethics rules","Not the reason."],["To get biased results","Not the goal."]],"exp":"A sample is a variety of people from the population."}]},{"term":"Representative (random) sample","def":"Participants chosen fairly to represent a population: everyone in the group being studied has an equal chance of being included.","hook":"","asks":[{"q":"To study students at her school, a researcher draws names from a list of every student. Why is this a good method?","right":"Everyone has an equal chance of being chosen","wrong":[["It guarantees the hypothesis will be supported","No method guarantees that."],["It lets her pick the students she knows best","Picking friends would be biased."],["It means she doesn't need a control group","Sampling and control groups are separate issues."]],"exp":"A random sample fairly represents the population."},{"q":"Which sampling method is most representative of a school?","right":"Drawing names from every grade at random","wrong":[["Asking only the students who happen to be in the library at lunch","That isn't random."],["Asking only seniors","Not representative."],["Asking volunteers","Not random."]],"exp":"Everyone has an equal chance of being included."}]},{"term":"Experimental group","def":"Participants who receive the manipulated variable. Example from your slides: the group that takes the antidepressant.","hook":"","asks":[{"q":"In a study of a new reading app, one group of students uses the app for a month. What is this group?","right":"The experimental group","wrong":[["The control group","The control group doesn't use the app."],["The population","The population is everyone the study is meant to apply to."],["The dependent variable","That is what gets measured."]],"exp":"It receives the manipulated variable."},{"q":"In a caffeine study, which group is the experimental group?","right":"The group that drinks caffeine","wrong":[["The group that drinks plain water with no caffeine in it","That is the control group."],["The population","Not a group in the study."],["The researchers","Not participants."]],"exp":"The experimental group receives the manipulated variable."}]},{"term":"Control group","def":"Participants who do not receive the manipulated variable. Example from your slides: the group that doesn't take the antidepressant. Comparing the groups shows whether the medication really reduces depression.","hook":"Control = compare.","asks":[{"q":"In the same reading-app study, why does the researcher include students who don't use the app?","right":"To compare them with the app users","wrong":[["To make the sample bigger without affecting results","The point is comparison, not size."],["Because they are the population","They are part of the sample."],["To measure the independent variable","The IV is manipulated, not measured."]],"exp":"Comparing the groups shows whether the app really works."},{"q":"A drug study finds both the drug group and the sugar-pill group improved equally. What does the control group reveal?","right":"The drug may not really work","wrong":[["The drug works very well, since its group improved during the study","The control group improved just as much."],["The study had no sample","Not shown."],["The DV was manipulated","Not shown."]],"exp":"Comparing the groups shows whether the treatment really works."}]},{"term":"Independent variable (IV)","def":"The factor that is manipulated or controlled by the researcher. Examples from your slides: amount of sleep (does sleep deprivation cause poor memory?); temperature (does room temperature affect test scores?).","hook":"IV = what I change.","asks":[{"q":"A researcher gives some people 2 hours of sleep and others 8 hours, then tests their memory. What is the independent variable?","right":"The amount of sleep","wrong":[["The memory test score","That is the dependent variable."],["The people's ages","Age wasn't manipulated; it could be a confounding variable."],["The room where the test is taken","That isn't what the researcher changes."]],"exp":"The IV is what the researcher manipulates."},{"q":"Does room temperature affect test scores? What is the IV?","right":"Room temperature","wrong":[["Test scores, which are measured once the test is finished","That is the DV."],["The students' ages","Not manipulated."],["The test","Held constant."]],"exp":"IV = what I change."}]},{"term":"Dependent variable (DV)","def":"The factor that is measured or observed by the researcher. Examples from your slides: strength of memory; test scores.","hook":"The DV depends on the IV. DV = data.","asks":[{"q":"A study tests whether room temperature affects test scores. What is the dependent variable?","right":"The test scores","wrong":[["The room temperature","That is the independent variable."],["The number of participants","That is sample size."],["The type of test given","That is held the same, not measured."]],"exp":"The DV is what is measured; it depends on the IV."},{"q":"Does sleep deprivation cause poor memory? What is the DV?","right":"Strength of memory","wrong":[["The amount of sleep, which is changed by the researcher","That is the IV."],["The number of participants","Not the DV."],["The researcher","Not a variable."]],"exp":"The DV depends on the IV; it's what is measured."}]},{"term":"Confounding variable","def":"An outside influence that affects the results of the study. Example from your slides: when studying how exercise (IV) affects weight loss (DV), possible confounding variables are diet, amount of sleep, and genetic issues.","hook":"","asks":[{"q":"A study finds a new exercise plan causes weight loss, but the exercise group also ate healthier. What is the healthier eating?","right":"A confounding variable","wrong":[["The independent variable","The IV is the exercise plan."],["The dependent variable","The DV is weight loss."],["The control group","That is a group, not an outside influence."]],"exp":"An outside influence that affects the results."},{"q":"Studying how exercise affects weight loss, which could be a confounding variable?","right":"Diet","wrong":[["Weight loss, which is what the researcher is measuring at the end","That is the DV."],["Exercise","That is the IV."],["The control group","That's a group."]],"exp":"Diet, sleep and genetics could confound the results."}]}]},{"name":"Problems with research","cards":[{"term":"Problems with research (all 11)","def":"Placebo effect,
