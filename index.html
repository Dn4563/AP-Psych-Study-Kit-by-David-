mbic = amygdala (emotion), hippocampus (memory), hypothalamus (drives). Breathing and heartbeat are the medulla, part of the brainstem.","why":["","","",""]},{"id":"q4-4","type":"mcq","topic":"The Brain","stem":"Which of the following best describes the primary function of the cerebellum?","options":["Coordinating voluntary movement, balance, and posture","Regulating emotions and forming memories","Controlling hunger, thirst, and body temperature","Producing speech"],"ans":0,"exp":"The cerebellum (\"little brain\") handles balance, coordination, and learned motor skills.","why":["","","",""]},{"id":"q4-5","type":"mcq","topic":"The Brain","stem":"Which part of the brain plays a crucial role in controlling arousal and attention, and if damaged could leave a person in a coma?","options":["Hippocampus","Reticular formation","Thalamus","Hypothalamus"],"ans":1,"exp":"The reticular formation controls arousal and consciousness. The hypothalamus is the trap: it handles hunger, thirst, temperature, and the 4 Fs.","why":["","","",""]},{"id":"q4-6","type":"mcq","topic":"The Brain","stem":"Which part of the brainstem is most involved in regulating the sleep-wake cycle?","options":["Medulla","Cerebellum","Pons","Amygdala"],"ans":2,"exp":"The pons connects the spinal cord to the brain and helps regulate sleep. The medulla handles breathing and heartbeat.","why":["","","",""]},{"id":"q4-7","type":"mcq","topic":"The Brain","stem":"A gymnast's fall damages her medulla. Which function is most at risk?","options":["Recognizing faces","Breathing and heartbeat","Forming new memories","Producing speech"],"ans":1,"exp":"The medulla controls life-sustaining functions, which is why medulla damage can be fatal.","why":["","","",""]},{"id":"q4-8","type":"mcq","topic":"The Brain","stem":"After a stroke, Mr. Lee understands everything his family says, but he speaks slowly in short, broken phrases like \"want... coffee.\" Which area was most likely damaged?","options":["Wernicke's area","Broca's area","Occipital lobe","Cerebellum"],"ans":1,"exp":"Broca's = broken speech production, with understanding mostly intact.","why":["","","",""]},{"id":"q4-9","type":"mcq","topic":"The Brain","stem":"After a head injury, Ana speaks fluently, but her sentences make little sense and she can't follow what others say. Which area was most likely damaged?","options":["Broca's area","Motor cortex","Amygdala","Wernicke's area"],"ans":3,"exp":"Wernicke's = understanding language. The speech flows but doesn't make sense.","why":["","","",""]},{"id":"q4-10","type":"mcq","topic":"The Brain","stem":"Which lobe contains the somatosensory cortex, which processes touch, temperature, and pain?","options":["Parietal lobe","Frontal lobe","Occipital lobe","Temporal lobe"],"ans":0,"exp":"The somatosensory cortex is in the parietal lobe, right behind the motor cortex (in the frontal lobe).","why":["","","",""]},{"id":"q4-11","type":"mcq","topic":"The Brain","stem":"A tumor in the temporal lobe would most likely affect a person's:","options":["Vision","Balance","Hearing and understanding of language","Breathing"],"ans":2,"exp":"The temporal lobe holds the auditory cortex and Wernicke's area.","why":["","","",""]},{"id":"q4-12","type":"mcq","topic":"The Brain","stem":"A stroke damages the motor cortex in Tom's left hemisphere. Which of the following is most likely?","options":["Weakness or paralysis on the left side of his body","Weakness or paralysis on the right side of his body","Blindness in both eyes","Loss of hearing in his left ear"],"ans":1,"exp":"Contralateral control: the left brain controls the right side of the body.","why":["","","",""]},{"id":"q4-13","type":"mcq","topic":"The Brain","stem":"Which of the following best describes the role of the thalamus?","options":["It stores long-term memories.","It controls hunger and thirst.","It coordinates balance.","It relays incoming sensory information (except smell) to the right areas of the cortex."],"ans":3,"exp":"The thalamus is the sensory switchboard. Smell is the one sense that skips it.","why":["","","",""]},{"id":"q4-14","type":"mcq","topic":"The Brain","stem":"Which brain structure is most involved in fear and aggression?","options":["Hippocampus","Pons","Cerebellum","Amygdala"],"ans":3,"exp":"The amygdala processes fear and aggression and triggers fight-or-flight.","why":["","","",""]},{"id":"q4-15","type":"mcq","topic":"The Brain","stem":"After surgery, a patient remembers his childhood clearly but cannot form any new long-term memories. Which structure was most likely removed?","options":["Amygdala","Hippocampus","Cerebellum","Thalamus"],"ans":1,"exp":"The hippocampus moves new information into long-term memory. Old memories are stored elsewhere, so they survive.","why":["","","",""]},{"id":"q4-16","type":"mcq","topic":"The Brain","stem":"A rat stops eating after damage to part of its hypothalamus. Which part was most likely damaged?","options":["Lateral hypothalamus","Ventromedial hypothalamus","Amygdala","Hippocampus"],"ans":0,"exp":"Lateral = lunch (hunger). Damage to the ventromedial hypothalamus causes overeating instead.","why":["","","",""]},{"id":"q4-17","type":"mcq","topic":"The Brain","stem":"Which part of the brain regulates body temperature, hunger, and thirst?","options":["Thalamus","Hypothalamus","Medulla","Cerebellum"],"ans":1,"exp":"Hypothalamus: temperature, thirst, hunger, and sexual responses. Don't mix it up with the thalamus, the sensory relay.","why":["","","",""]},{"id":"q4-18","type":"mcq","topic":"The Brain","stem":"Which of the following best describes the role of the prefrontal cortex?","options":["Processing visual information","Planning, judgment, decision making, and personality","Coordinating balance","Relaying sensory information"],"ans":1,"exp":"The prefrontal cortex handles executive functions; it was Phineas Gage's injury.","why":["","","",""]},{"id":"q4-19","type":"mcq","topic":"The Brain","stem":"A doctor wants to check for a tumor quickly by looking at the shape of a patient's brain structures, not their activity. Which scan fits best?","options":["fMRI","PET scan","EEG","CT scan"],"ans":3,"exp":"CT (and MRI) show structure. fMRI, PET, and EEG show activity.","why":["","","",""]},{"id":"q4-20","type":"mcq","topic":"The Brain","stem":"A researcher wants to see which brain areas become more active when people look at photos of their friends, as precisely as possible. Which technique is best?","options":["CT scan","MRI","fMRI","X-ray"],"ans":2,"exp":"fMRI shows function through blood flow and is more precise than PET.","why":["","","",""]},{"id":"q4-21","type":"mcq","topic":"The Brain","stem":"Which technique records brain waves through electrodes placed on the scalp and is often used to detect seizures?","options":["PET scan","MRI","CT scan","EEG"],"ans":3,"exp":"EEG = electrical activity.","why":["","","",""]},{"id":"q4-22","type":"mcq","topic":"The Brain","stem":"Doctors sometimes cut the corpus callosum in patients with severe epilepsy. Which of the following best describes the purpose of this surgery?","options":["To speed up communication between the hemispheres","To improve memory and learning","To keep seizures from spreading from one hemisphere to the other","To reduce activity in the frontal lobe"],"ans":2,"exp":"The corpus callosum connects the hemispheres. Cutting it stops seizure activity from crossing over.","why":["","","",""]},{"id":"q4-23","type":"mcq","topic":"The Brain","stem":"Which statement about the two hemispheres is most accurate?","options":["The right hemisphere controls the right side of the body.","Language is processed equally by both hemispheres.","The corpus callosum controls movement on both sides of the body.","The left hemisphere is usually dominant for language, and each hemisphere controls the opposite side of the body."],"ans":3,"exp":"Left = language. Each side of the brain controls the opposite side of the body.","why":["","","",""]},{"id":"q4-24","type":"mcq","topic":"The Brain","stem":"Which of the following best explains why young children often recover better from brain injuries than adults do?","options":["Children's brains are more plastic, so other areas can take over lost functions more easily.","Children can grow new neurons anywhere in the brain.","Children do not use their cerebral cortex yet.","Children's neurons do not have myelin."],"ans":0,"exp":"Plasticity is greatest in childhood. Neurogenesis happens in only a couple of areas, so B is a trap.","why":["","","",""]},{"id":"q4-25","type":"mcq","topic":"The Brain","stem":"Which of the following correctly matches a brain structure with its function?","options":["Medulla — breathing and heartbeat","Hippocampus — balance","Cerebellum — fear","Amygdala — vision"],"ans":0,"exp":"Hippocampus = memory, cerebellum = balance, amygdala = fear, occipital lobe = vision.","why":["","","",""]},{"id":"q4-26","type":"mcq","topic":"The Brain","stem":"Which part of the brain is primarily responsible for processing visual information?","options":["Occipital lobe","Frontal lobe","Parietal lobe","Temporal lobe"],"ans":0,"exp":"Occipital = optical, at the back of the brain.","why":["","","",""]}]},{"name":"Vision","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q5-1","type":"mcq","topic":"Vision","stem":"Which of the following best explains why it is hard to see colors in a dimly lit room?","options":["Rods detect color only in bright light.","Cones need more light to work, and rods, which work in dim light, don't detect color.","The lens can't focus in dim light.","The optic nerve shuts off in darkness."],"ans":1,"exp":"Rods = reduced light, black and white. Cones = color, need brighter light.","why":["","","",""]},{"id":"q5-2","type":"mcq","topic":"Vision","stem":"Which of the following correctly describes the path of light through the eye?","options":["Lens → cornea → retina → pupil","Retina → lens → pupil → cornea","Cornea → pupil → lens → retina","Pupil → retina → cornea → lens"],"ans":2,"exp":"Light enters through the cornea, passes the pupil, is focused by the lens, and lands on the retina.","why":["","","",""]},{"id":"q5-3","type":"mcq","topic":"Vision","stem":"Which theory best explains why a person with red-green color blindness has trouble telling red from green?","options":["Opponent-process theory","Trichromatic theory","Gate control theory","Feature detection"],"ans":1,"exp":"Trichromatic theory: red, green, and blue cones. Color blindness usually comes from impaired red or green cones.","why":["","","",""]},{"id":"q5-4","type":"mcq","topic":"Vision","stem":"Which of the following is a monocular depth cue?","options":["Retinal disparity","Comparing the slightly different images from each eye","Linear perspective","Using both eyes to judge how close something is"],"ans":2,"exp":"Linear perspective works with one eye. The other three all need both eyes (binocular).","why":["","","",""]},{"id":"q5-5","type":"mcq","topic":"Vision","stem":"Which Gestalt principle explains why you see the letters on a page as separate words rather than one long string?","options":["Proximity","Similarity","Closure","Figure-ground"],"ans":0,"exp":"Proximity: things close together get grouped together.","why":["","","",""]},{"id":"q5-6","type":"mcq","topic":"Vision","stem":"Every player on one team wears red, so you see them as one group separate from the team in blue. Which Gestalt principle is this?","options":["Proximity","Closure","Figure-ground","Similarity"],"ans":3,"exp":"Similarity: things that look alike get grouped together.","why":["","","",""]},{"id":"q5-7","type":"mcq","topic":"Vision","stem":"Which part of the eye changes shape to focus images on near or far objects?","options":["Lens","Iris","Cornea","Retina"],"ans":0,"exp":"That shape change is called accommodation.","why":["","","",""]},{"id":"q5-8","type":"mcq","topic":"Vision","stem":"Which of the following best describes feature detectors?","options":["Neurons in the visual cortex that respond to specific details like edges, angles, and movement","Cells in the retina that detect color","The muscle that controls pupil size","Neurons that carry signals from the eye to the brain"],"ans":0,"exp":"Feature detectors are in the visual cortex, not the eye.","why":["","","",""]},{"id":"q5-9","type":"mcq","topic":"Vision","stem":"In a painting, a distant mountain looks hazy and blurry, so viewers see it as far away. Which depth cue is the artist using?","options":["Interposition","Retinal disparity","Linear perspective","Relative clarity"],"ans":3,"exp":"Relative clarity: sharp objects seem close, hazy ones seem far.","why":["","","",""]},{"id":"q5-10","type":"mcq","topic":"Vision","stem":"Which of the following best describes transduction in vision?","options":["The lens bends light so it focuses on the retina.","Rods and cones in the retina convert light energy into neural impulses.","The optic nerve carries signals to the occipital lobe.","The iris controls how much light enters the eye."],"ans":1,"exp":"Transduction = converting energy into neural signals, and it happens in the retina.","why":["","","",""]}]},{"name":"Hearing, Smell, Taste, Touch & more","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q6-1","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"An older adult's eardrum and middle-ear bones are damaged, but the cochlea is healthy. What type of hearing loss is this, and can it be treated?","options":["Conduction hearing loss; it can often be fixed with surgery","Sensorineural hearing loss; it cannot be reversed","Conduction hearing loss; it can never be treated","Sensorineural hearing loss; it can be fixed with surgery"],"ans":0,"exp":"Conduction = the parts that conduct sound (eardrum, ossicles). It's correctable. Sensorineural is the cochlea or auditory nerve.","why":["","","",""]},{"id":"q6-2","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Which treatment would most likely help someone whose hearing loss comes from damaged hair cells in the cochlea?","options":["A cochlear implant","Surgery to repair the ossicles","Glasses with stronger lenses","Medication that raises serotonin"],"ans":0,"exp":"Hair-cell damage is sensorineural. A cochlear implant sends signals straight to the auditory nerve.","why":["","","",""]},{"id":"q6-3","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Two sounds are equally loud, but one is a high whistle and the other a low drum. What property of the sound waves is different?","options":["Amplitude","Loudness","Frequency","Localization"],"ans":2,"exp":"Frequency = pitch. Amplitude = loudness, and the question says they're equally loud.","why":["","","",""]},{"id":"q6-4","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"A gymnast can do a backflip with her eyes closed because she senses where her arms and legs are. Which sense makes this possible?","options":["Vestibular sense","Kinesthesis","Olfaction","Gustation"],"ans":1,"exp":"Kinesthesis senses the position of body parts. The vestibular sense is about the head's position and balance.","why":["","","",""]},{"id":"q6-5","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"The smell of fresh cookies instantly brings back a vivid childhood memory. Which of the following best explains why?","options":["Smell signals go straight to brain areas connected to the limbic system, which handles emotion and memory.","Smell is processed in the occipital lobe.","The thalamus amplifies smell signals before they reach the cortex.","Taste buds store memories of familiar foods."],"ans":0,"exp":"Smell is the only sense that skips the thalamus. It connects directly to emotion and memory areas.","why":["","","",""]},{"id":"q6-6","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Which of the following best describes gate control theory?","options":["Pain is felt only when all four skin senses are activated at once.","The spinal cord has a neurological \"gate\" that can block pain signals or let them reach the brain.","The thalamus decides which pains are real.","Pain receptors stop firing after a few seconds."],"ans":1,"exp":"Distraction or rubbing the spot can close the gate.","why":["","","",""]},{"id":"q6-7","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Years after losing his arm, Marcus still feels an itch in his missing hand. This is called:","options":["Synesthesia","Prosopagnosia","Sensory interaction","Phantom limb sensation"],"ans":3,"exp":"The sensory cortex area for the missing limb is still active.","why":["","","",""]},{"id":"q6-8","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Whenever Priya hears a trumpet, she also sees the color orange. This is an example of:","options":["Sensory interaction","Synesthesia","Prosopagnosia","Kinesthesis"],"ans":1,"exp":"Synesthesia is one sense triggering another. Sensory interaction is the trap: one sense influencing another, like smell and taste.","why":["","","",""]},{"id":"q6-9","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"A person with prosopagnosia would have the most trouble:","options":["Tasting bitter foods","Keeping their balance","Hearing high-pitched sounds","Recognizing a friend's face"],"ans":3,"exp":"Prosopagnosia = face blindness.","why":["","","",""]},{"id":"q6-10","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Jamal finds jalapeños unbearably hot, while his friend barely notices them. Jamal is most likely:","options":["Experiencing synesthesia","Experiencing sensory interaction","A supertaster","Experiencing phantom limb sensation"],"ans":2,"exp":"Supertasters have more taste buds and feel tastes and pain more intensely.","why":["","","",""]},{"id":"q6-11","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Which of the following is one of the five basic tastes?","options":["Spicy","Cold","Umami","Minty"],"ans":2,"exp":"The five are sweet, sour, salty, bitter, and umami. \"Spicy\" is actually pain.","why":["","","",""]}]},{"name":"Sleep, Consciousness & Drugs","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q7-1","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which statement about sleep is most accurate?","options":["Sleep is an altered state of consciousness, and the brain stays active even during sound sleep.","During sleep, the body and brain shut off until morning.","Only some people dream, and only on some nights.","Sleep is a period of dormancy for both the body and the brain."],"ans":0,"exp":"Your slides: sleep is NOT dormancy; the brain is still active, and everyone dreams every night.","why":["","","",""]},{"id":"q7-2","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best describes the circadian rhythm?","options":["The order of the four sleep stages","A disorder in which people fall asleep suddenly","The body's biological clock: regular cycles on a 24-hour schedule, synced with day and night","A drug's effect on dopamine"],"ans":2,"exp":"Circadian rhythm = the biological clock on a 24-hour cycle.","why":["","","",""]},{"id":"q7-3","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Tia, 16, struggles in her first-period class but feels sharp by evening. Her grandfather is up at dawn and fades by dinner. Which of the following best explains this?","options":["Tia has narcolepsy and her grandfather has insomnia.","Most teens are evening-energized, while most older adults are morning people.","Older adults don't have circadian rhythms.","Teens' body temperature is highest in the morning."],"ans":1,"exp":"Teens and young adults improve across the day; older adults lose energy as the day goes on.","why":["","","",""]},{"id":"q7-4","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following correctly describes body temperature across the day?","options":["It is highest at night and lowest in the morning.","It stays the same all day.","It rises through the day, dips in the afternoon, and is lowest at night.","It is lowest in the afternoon and highest at night."],"ans":2,"exp":"Body temperature increases throughout the day, dips in the afternoon, and is lowest at night.","why":["","","",""]},{"id":"q7-5","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following is an effect of sleep loss?","options":["Lower risk of high blood pressure","Suppressed immune cell production and more colds","Better memory consolidation","Faster reaction time"],"ans":1,"exp":"Sleep loss weakens the immune system, raises blood pressure risk, and hurts memory and reaction time.","why":["","","",""]},{"id":"q7-6","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best explains why ongoing sleep loss is linked to obesity?","options":["It raises leptin, which makes people hungrier.","It increases GABA, which slows metabolism.","It blocks the reuptake of dopamine.","It raises hunger-arousing ghrelin, lowers hunger-suppressing leptin, and increases fat cell production."],"ans":3,"exp":"Ghrelin up, leptin down, more fat cells → greater risk of obesity.","why":["","","",""]},{"id":"q7-7","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"A student who has been sleeping only four hours a night has trouble focusing in class and remembering what she studied. Which effect of sleep loss is this?","options":["Increased inflammation in the joints","Increased leptin","Narcolepsy","Diminished attentional focus and memory consolidation"],"ans":3,"exp":"Brain effects of sleep loss: less focus, weaker memory consolidation, higher risk of depression.","why":["","","",""]},{"id":"q7-8","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Darnell's wife notices that he stops breathing several times every night. Darnell most likely has:","options":["Narcolepsy","Insomnia","Sleep apnea","Night terrors"],"ans":2,"exp":"Sleep apnea = you stop breathing in your sleep.","why":["","","",""]},{"id":"q7-9","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"In the middle of a conversation, Rosa suddenly falls asleep without warning. She most likely has:","options":["Narcolepsy","Insomnia","Sleep apnea","Sleepwalking"],"ans":0,"exp":"Narcolepsy = falling asleep spontaneously. Insomnia is the opposite: you can't sleep.","why":["","","",""]},{"id":"q7-10","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following correctly describes night terrors?","options":["Intense fear and screaming or crying during Stage 3, usually not remembered the next morning","Bad dreams that are remembered in detail the next morning","Suddenly falling asleep during the day","Stopping breathing during sleep"],"ans":0,"exp":"Night terrors are not nightmares: Stage 3, intense terror, no recollection in the morning.","why":["","","",""]},{"id":"q7-11","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best describes an agonist?","options":["A drug that blocks the effects of a neurotransmitter","A drug that fits into receptors, mimics a neurotransmitter, and increases its effects","A drug that only affects the body, not the brain","The discomfort after stopping a drug"],"ans":1,"exp":"Agonist = acts like the neurotransmitter. Example: opiates mimic endorphins.","why":["","","",""]},{"id":"q7-12","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best describes an antagonist?","options":["A drug that mimics a neurotransmitter and increases its effects","A drug made from the opium poppy","A drug that only works on hormones","A drug that blocks the effects of a neurotransmitter"],"ans":3,"exp":"Antagonist = against it. Your slides' example: cocaine blocking dopamine reuptake.","why":["","","",""]},{"id":"q7-13","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Cocaine produces alertness, euphoria, and motivation by:","options":["Mimicking endorphins","Increasing GABA","Blocking the reabsorption (reuptake) of dopamine","Damaging serotonin-producing neurons"],"ans":2,"exp":"Cocaine blocks dopamine reuptake, then comes a huge crash with anxiety, depression, and cravings.","why":["","","",""]},{"id":"q7-14","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"People at a party get loud and do wild things after drinking, so some assume alcohol is a stimulant. Which of the following best explains why it is actually a depressant?","options":["It blocks the reuptake of dopamine.","It mimics adrenaline.","It distorts visual and auditory perception.","It intensifies GABA and reduces glutamate, slowing neural activity, reactions, and judgment."],"ans":3,"exp":"Depressants reduce neural activity. Alcohol only seems like a stimulant because of how people act.","why":["","","",""]},{"id":"q7-15","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"A doctor prescribes a \"downer\" to treat a patient's insomnia. It increases GABA and has effects similar to alcohol. Which type of drug is it most likely?","options":["A stimulant","A hallucinogen","An amphetamine","A barbiturate/sedative"],"ans":3,"exp":"Barbiturates/sedatives: \"downers,\" used for insomnia, alcohol-like, increase GABA, and cause dependence.","why":["","","",""]},{"id":"q7-16","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which drug mimics adrenaline, gives a sense of euphoria followed by a huge crash, and leads to a cycle of addiction?","options":["Benzodiazepines","LSD","Codeine","Amphetamines"],"ans":3,"exp":"Amphetamines mimic epinephrine/adrenaline. Meth and ecstasy are forms.","why":["","","",""]},{"id":"q7-17","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which substance is considered both a stimulant and a hallucinogen?","options":["Caffeine","Ecstasy (MDMA)","Alcohol","Morphine"],"ans":1,"exp":"Ecstasy/MDMA is on your slides as a form of amphetamine and as a hallucinogen.","why":["","","",""]},{"id":"q7-18","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Heavy ecstasy use can permanently lower a person's mood and impair memory. Which of the following best explains why?","options":["It can damage serotonin-producing neurons.","It increases GABA and slows neural activity.","It acts as an agonist for endorphins.","It blocks the reuptake of dopamine."],"ans":0,"exp":"Ecstasy can damage serotonin-producing neurons → permanent deflation of mood and memory problems.","why":["","","",""]},{"id":"q7-19","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which drug produces hallucinations and delusions like a psychotic state and can lead to paranoia and panic attacks?","options":["THC","Caffeine","LSD","Codeine"],"ans":2,"exp":"LSD can result in psychosis, memory loss, paranoia, panic attacks, nightmares, and aggression.","why":["","","",""]},{"id":"q7-20","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"THC, the active ingredient in marijuana, is most likely to produce:","options":["Severe insomnia and heart palpitations","Depressed heartbeat and breathing","A huge crash with strong cravings","Mild hallucinations, relaxation, and a distorted sense of time"],"ans":3,"exp":"THC: mild hallucinations, euphoria, relaxation, wellbeing, and time distortion.","why":["","","",""]},{"id":"q7-21","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best explains why opioids such as heroin relieve pain?","options":["They act as agonists for endorphins, reducing pain and increasing positive feelings.","They block the reuptake of dopamine.","They increase glutamate.","They distort visual and auditory perception."],"ans":0,"exp":"Opioids are endorphin agonists.","why":["","","",""]},{"id":"q7-22","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"With continued opioid use, the brain stops producing its own dopamine and endorphins. This most directly leads to:","options":["Better natural pain control","Narcolepsy","Dependence, tolerance, and withdrawal","Improved memory"],"ans":2,"exp":"Opioids result in dependence, tolerance, withdrawal, and physiological and psychological addiction.","why":["","","",""]},{"id":"q7-23","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following correctly matches a drug with its category?","options":["Benzodiazepines — stimulant","Caffeine — stimulant","LSD — opioid","Codeine — depressant"],"ans":1,"exp":"Benzodiazepines are depressants, LSD is a hallucinogen, and codeine is an opioid.","why":["","","",""]},{"id":"q7-24","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following best describes the difference between substance use and substance abuse?","options":["Use involves illegal drugs; abuse involves legal drugs.","Use doesn't interfere with daily functioning; abuse is a pattern that hurts functioning, can be dangerous, and leads to legal trouble.","Use happens daily; abuse happens only occasionally.","There is no difference between them."],"ans":1,"exp":"Substance use = no interference with daily life. Substance abuse = it inhibits functioning.","why":["","","",""]},{"id":"q7-25","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Nina says, \"I don't even enjoy it anymore, but I can't stop wanting it.\" This best describes:","options":["Tolerance","Substance use","Addiction","Withdrawal"],"ans":2,"exp":"Addiction: users want the drug more than they like the drug, and keep using despite consequences.","why":["","","",""]},{"id":"q7-26","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Withdrawal is best described as:","options":["The discomfort and distress that follow stopping an addictive drug, which can be physiological and/or psychological","Needing more of a drug to get the same effect","Using a drug without it affecting daily life","The euphoria right after taking a drug"],"ans":0,"exp":"Withdrawal can be physiological, psychological, or both. \"Needing more\" is tolerance.","why":["","","",""]},{"id":"q7-27","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"A person meets 7 of the DSM-5 criteria for substance use disorder. The disorder would be classified as:","options":["Severe","Mild","Moderate","Not a disorder"],"ans":0,"exp":"Your slide: mild = 3, moderate = 4 or 5, severe = 6 or more.","why":["","","",""]},{"id":"q7-28","type":"mcq","topic":"Sleep, Consciousness & Drugs","stem":"Which of the following is one of the DSM-5 criteria for substance use disorder?","options":["Using a substance once at a party","Wanting to cut down or stop using but not managing to","Drinking coffee in the morning","Taking medicine exactly as prescribed"],"ans":1,"exp":"\"Wanting to cut down or stop but not managing to\" is criterion 2 on the slide's list of 11.","why":["","","",""]}]},{"name":"Split Brain","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q8-1","type":"mcq","topic":"Split Brain","stem":"A split-brain patient holds a hidden key in her left hand and can't see it. Asked what she is holding, which of the following is most likely?","options":["She can't name it, but she can pick out the key with her left hand.","She names it right away.","She can point to the key only with her right hand.","She can't identify it in any way."],"ans":0,"exp":"Touch from the left hand goes to the right hemisphere, which can't speak but controls the left hand.","why":["","","",""]},{"id":"q8-2","type":"mcq","topic":"Split Brain","stem":"Which of the following best describes what research on split-brain patients revealed?","options":["Both hemispheres have identical abilities.","Cutting the corpus callosum causes paralysis.","The two hemispheres specialize in different functions, such as language in the left hemisphere.","The right hemisphere controls language."],"ans":2,"exp":"Split-brain studies showed lateralization, like language on the left side.","why":["","","",""]},{"id":"q8-3","type":"mcq","topic":"Split Brain","stem":"A split-brain patient looks at the center of the word HEART, so \"HE\" is in his left visual field and \"ART\" is in his right. Asked what word he saw, he will most likely say:","options":["\"He\"","\"Art\"","\"Heart\"","Nothing at all"],"ans":1,"exp":"\"ART\" reaches the left hemisphere, which can speak. \"HE\" reaches only the right hemisphere, so he could point to it with his left hand but not say it.","why":["","","",""]}]},{"name":"Mock exam","mode":"exam","exam":"Mock exam","examTips":["Turn the Timer on and answer every question without looking anything up.","Aim for about one minute per question. Flag hard ones and come back."],"tips":["A mix of exam-style questions from every deck in this unit."],"questions":[{"id":"qM1","type":"mcq","topic":"The Neuron","stem":"Maria's neurologist explains that the fatty coating around her axons is breaking down, slowing her neural signals and making walking difficult. Maria most likely has:","options":["Myasthenia gravis","Multiple sclerosis","Parkinson's disease","Alzheimer's disease"],"ans":1,"exp":"MS is the breakdown of the myelin sheath (demyelination). Myasthenia gravis is the trap: it blocks acetylcholine receptors at the muscles and doesn't damage myelin.","why":["","","",""]},{"id":"qM2","type":"mcq","topic":"The Neuron","stem":"Which of the following best describes the all-or-none principle?","options":["A stronger stimulus causes a neuron to fire with greater intensity.","Once threshold is reached, a neuron fires completely; below threshold it does not fire at all.","A neuron must receive signals from all of its dendrites before it can fire.","A neuron releases either all of its neurotransmitters or none during reuptake."],"ans":1,"exp":"A neuron's firing strength never changes. It either reaches threshold and fires fully, or it doesn't fire.","why":["","","",""]},{"id":"qM3","type":"mcq","topic":"The Neuron","stem":"A new drug stops the sending neuron from reabsorbing leftover neurotransmitters in the synapse. Which process is the drug blocking?","options":["The action potential","The refractory period","Reuptake","Threshold"],"ans":2,"exp":"Reuptake is the sending neuron reabsorbing leftover neurotransmitters. SSRIs work by blocking it.","why":["","","",""]},{"id":"qM4","type":"mcq","topic":"The Neuron","stem":"Which sequence correctly describes the path of a signal through a single neuron?","options":["Axon → soma → dendrites → terminal buttons","Soma → dendrites → terminal buttons → axon","Dendrites → soma → axon → terminal buttons","Terminal buttons → axon → soma → dendrites"],"ans":2,"exp":"Dendrites detect the message, the soma decides to fire, the impulse travels down the axon, and terminal buttons release neurotransmitters.","why":["","","",""]},{"id":"qM5","type":"mcq","topic":"The Neuron","stem":"Which of the following best describes the function of glial cells?","options":["They carry electrical impulses down the axon.","They store neurotransmitters in vesicles.","They support, nourish, and protect neurons.","They form the gap between two neurons."],"ans":2,"exp":"Glia are support cells (\"glue\"). They don't send the signal themselves.","why":["","","",""]},{"id":"qM6","type":"mcq","topic":"Neurotransmitters","stem":"Ella has been diagnosed with depression. Her doctor prescribes a medication that keeps serotonin in the synapse longer. Which type of drug is this?","options":["An SSRI","A GABA blocker","An acetylcholine blocker","An endorphin inhibitor"],"ans":0,"exp":"SSRI = selective serotonin reuptake inhibitor. Blocking reuptake leaves more serotonin in the synapse.","why":["","","",""]},{"id":"qM7","type":"mcq","topic":"Neurotransmitters","stem":"A patient with Parkinson's disease has tremors and trouble starting movements. A shortage of which neurotransmitter is most responsible?","options":["Dopamine","Serotonin","GABA","Glutamate"],"ans":0,"exp":"Low dopamine → Parkinson's. High dopamine → schizophrenia.","why":["","","",""]},{"id":"qM8","type":"mcq","topic":"Neurotransmitters","stem":"Excess activity of which neurotransmitter has been linked to schizophrenia?","options":["Dopamine","GABA","Endorphins","Acetylcholine"],"ans":0,"exp":"Too much dopamine is linked to schizophrenia; too little to Parkinson's.","why":["","","",""]},{"id":"qM9","type":"mcq","topic":"Neurotransmitters","stem":"Which of the following best describes the role of GABA?","options":["It is the main excitatory neurotransmitter and is involved in memory.","It sends hunger signals to the brain.","It is the body's natural painkiller.","It is the main inhibitory neurotransmitter and calms the nervous system."],"ans":3,"exp":"GABA is the brakes. Glutamate (the main excitatory one) is the trap.","why":["","","",""]},{"id":"qM10","type":"mcq","topic":"Neurotransmitters","stem":"Low levels of acetylcholine are most closely associated with which disorder?","options":["Parkinson's disease","Alzheimer's disease","Schizophrenia","Anxiety disorders"],"ans":1,"exp":"ACh helps with memory and movement; too little is linked to Alzheimer's. Parkinson's is dopamine.","why":["","","",""]},{"id":"qM11","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"While hiking, Leah spots a rattlesnake. Her heart races, her pupils dilate, and her digestion slows. Which division of the nervous system is responsible?","options":["Parasympathetic","Sympathetic","Somatic","Central"],"ans":1,"exp":"Sympathetic = stressed: fight, flight, or freeze.","why":["","","",""]},{"id":"qM12","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"After the snake slithers away, Leah's heart rate and breathing gradually return to normal. Which division is now most active?","options":["Parasympathetic","Sympathetic","Somatic","Central"],"ans":0,"exp":"Parasympathetic = rest and digest; it calms the body back down.","why":["","","",""]},{"id":"qM13","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which of the following is an example of the somatic nervous system at work?","options":["Your heart speeding up before a test","Your stomach digesting lunch","Your pupils shrinking in bright light","Raising your hand to answer a question"],"ans":3,"exp":"Somatic = voluntary movement. The others are automatic, so they're autonomic.","why":["","","",""]},{"id":"qM14","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"When the doctor taps Luis's knee, his leg kicks before his brain even registers the tap. Which of the following best explains why the response is so fast?","options":["Motor neurons are always faster than sensory neurons.","The signal goes to the spinal cord and straight back out, without waiting for the brain.","The cerebellum processes all reflexes instantly.","Hormones carry the signal directly to the leg."],"ans":1,"exp":"Reflexes are directed by the spinal cord, which cuts out the trip to the brain.","why":["","","",""]},{"id":"qM15","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which type of neuron carries messages from the brain and spinal cord out to the muscles?","options":["Sensory (afferent) neurons","Motor (efferent) neurons","Interneurons","Glial cells"],"ans":1,"exp":"Efferent = exit. Afferent = arrive.","why":["","","",""]},{"id":"qM16","type":"mcq","topic":"The Brain","stem":"Which of the following best describes what Phineas Gage's injury taught psychologists?","options":["The occipital lobe is responsible for processing vision.","The frontal lobe plays a major role in personality and controlling behavior.","The cerebellum controls balance and coordination.","The temporal lobe is needed to understand speech."],"ans":1,"exp":"After the rod went through his prefrontal cortex, Gage became impulsive, profane, and irritable: his personality changed, not his movement or senses.","why":["","","",""]},{"id":"qM17","type":"mcq","topic":"The Brain","stem":"Which of the following scenarios best illustrates neuroplasticity?","options":["A student drinks coffee to stay alert while studying.","After a stroke, a patient regains the ability to walk through months of therapy as other brain areas take over.","A runner's heart rate speeds up during a race.","A person blinks when dust blows toward their eyes."],"ans":1,"exp":"Plasticity is the brain reorganizing itself. The others are a drug effect, the sympathetic system, and a reflex.","why":["","","",""]},{"id":"qM18","type":"mcq","topic":"The Brain","stem":"Which of the following functions is most closely associated with the limbic system?","options":["Coordinating balance and fine motor movement","Controlling breathing and heartbeat","Regulating emotions, forming memories, and survival drives like hunger","Processing visual information"],"ans":2,"exp":"Limbic = amygdala (emotion), hippocampus (memory), hypothalamus (drives). Breathing and heartbeat are the medulla, part of the brainstem.","why":["","","",""]},{"id":"qM19","type":"mcq","topic":"The Brain","stem":"Which of the following best describes the primary function of the cerebellum?","options":["Regulating emotions and forming memories","Controlling hunger, thirst, and body temperature","Coordinating voluntary movement, balance, and posture","Producing speech"],"ans":2,"exp":"The cerebellum (\"little brain\") handles balance, coordination, and learned motor skills.","why":["","","",""]},{"id":"qM20","type":"mcq","topic":"The Brain","stem":"Which part of the brain plays a crucial role in controlling arousal and attention, and if damaged could leave a person in a coma?","options":["Hippocampus","Thalamus","Reticular formation","Hypothalamus"],"ans":2,"exp":"The reticular formation controls arousal and consciousness. The hypothalamus is the trap: it handles hunger, thirst, temperature, and the 4 Fs.","why":["","","",""]},{"id":"qM21","type":"mcq","topic":"Vision","stem":"Which of the following best explains why it is hard to see colors in a dimly lit room?","options":["Rods detect color only in bright light.","The lens can't focus in dim light.","The optic nerve shuts off in darkness.","Cones need more light to work, and rods, which work in dim light, don't detect color."],"ans":3,"exp":"Rods = reduced light, black and white. Cones = color, need brighter light.","why":["","","",""]},{"id":"qM22","type":"mcq","topic":"Vision","stem":"Which of the following correctly describes the path of light through the eye?","options":["Lens → cornea → retina → pupil","Retina → lens → pupil → cornea","Pupil → retina → cornea → lens","Cornea → pupil → lens → retina"],"ans":3,"exp":"Light enters through the cornea, passes the pupil, is focused by the lens, and lands on the retina.","why":["","","",""]},{"id":"qM23","type":"mcq","topic":"Vision","stem":"Which theory best explains why a person with red-green color blindness has trouble telling red from green?","options":["Opponent-process theory","Gate control theory","Feature detection","Trichromatic theory"],"ans":3,"exp":"Trichromatic theory: red, green, and blue cones. Color blindness usually comes from impaired red or green cones.","why":["","","",""]},{"id":"qM24","type":"mcq","topic":"Vision","stem":"Which of the following is a monocular depth cue?","options":["Retinal disparity","Comparing the slightly different images from each eye","Using both eyes to judge how close something is","Linear perspective"],"ans":3,"exp":"Linear perspective works with one eye. The other three all need both eyes (binocular).","why":["","","",""]},{"id":"qM25","type":"mcq","topic":"Vision","stem":"Which Gestalt principle explains why you see the letters on a page as separate words rather than one long string?","options":["Proximity","Similarity","Closure","Figure-ground"],"ans":0,"exp":"Proximity: things close together get grouped together.","why":["","","",""]},{"id":"qM26","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"An older adult's eardrum and middle-ear bones are damaged, but the cochlea is healthy. What type of hearing loss is this, and can it be treated?","options":["Sensorineural hearing loss; it cannot be reversed","Conduction hearing loss; it can never be treated","Conduction hearing loss; it can often be fixed with surgery","Sensorineural hearing loss; it can be fixed with surgery"],"ans":2,"exp":"Conduction = the parts that conduct sound (eardrum, ossicles). It's correctable. Sensorineural is the cochlea or auditory nerve.","why":["","","",""]},{"id":"qM27","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Which treatment would most likely help someone whose hearing loss comes from damaged hair cells in the cochlea?","options":["A cochlear implant","Surgery to repair the ossicles","Glasses with stronger lenses","Medication that raises serotonin"],"ans":0,"exp":"Hair-cell damage is sensorineural. A cochlear implant sends signals straight to the auditory nerve.","why":["","","",""]},{"id":"qM28","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"Two sounds are equally loud, but one is a high whistle and the other a low drum. What property of the sound waves is different?","options":["Frequency","Amplitude","Loudness","Localization"],"ans":0,"exp":"Frequency = pitch. Amplitude = loudness, and the question says they're equally loud.","why":["","","",""]},{"id":"qM29","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"A gymnast can do a backflip with her eyes closed because she senses where her arms and legs are. Which sense makes this possible?","options":["Vestibular sense","Olfaction","Gustation","Kinesthesis"],"ans":3,"exp":"Kinesthesis senses the position of body parts. The vestibular sense is about the head's position and balance.","why":["","","",""]},{"id":"qM30","type":"mcq","topic":"Hearing, Smell, Taste, Touch & more","stem":"The smell of fresh cookies instantly brings back a vivid childhood memory. Which of the following best explains why?","options":["Smell signals go straight to brain areas connected to the limbic system, which handles emotion and memory.","Smell is processed in the occipital lobe.","The thalamus amplifies smell signals before they reach the cortex.","Taste buds store memories of familiar foods."],"ans":0,"exp":"Smell is the only sense that skips the thalamus. It connects directly to emotion and memory areas.","why":["","","",""]}]}]}},"u5":{"images":{},"decks":[{"id":1,"name":"Health Psychology","optional":false,"sections":[{"name":"Stress","cards":[{"term":"Stress","def":"Stress activates your sympathetic nervous system (the fight/flight/freeze response), which activates hormones like cortisol. This can result in hypertension, headaches, and immunosuppression.","hook":"","asks":[{"q":"During finals week, Leo gets headaches, his blood pressure rises, and he catches every cold. What best explains all three?","right":"Stress activating his fight-or-flight system","wrong":[["Too much leptin from eating late at night during finals","Leptin signals fullness; stress explains these symptoms."],["A lack of melatonin only","That would affect sleep, not all three."],["His parasympathetic system calming him","That would lower stress."]],"exp":"Stress activates the sympathetic system and cortisol, leading to hypertension, headaches and immunosuppression."},{"q":"Which chain shows how stress affects the body, according to your slides?","right":"Sympathetic system, cortisol, then health effects","wrong":[["Parasympathetic system, melatonin, then deep and restful sleep","Stress activates the sympathetic system, not rest-and-digest."],["Leptin, then fullness, then weight loss","Not the stress chain."],["Dopamine, then reward, then motivation","Not the stress chain."]],"exp":"Stress activates the sympathetic system, which releases cortisol, which can cause hypertension, headaches and immunosuppression."}]},{"term":"Cortisol","def":"A stress hormone. Stress activates the sympathetic nervous system, which releases hormones like cortisol.","hook":"","asks":[{"q":"Which hormone rises in the body during long periods of stress?","right":"Cortisol","wrong":[["Melatonin from the pineal gland at night","Melatonin regulates sleep."],["Leptin","That signals fullness."],["Oxytocin","That is the bonding hormone."]],"exp":"Cortisol is a stress hormone."},{"q":"A researcher measures a hormone in students' saliva during exam week to see how stressed they are. Which hormone is she most likely measuring?","right":"Cortisol","wrong":[["Oxytocin, the bonding hormone released by the pituitary","Oxytocin is about bonding."],["Melatonin","That regulates sleep."],["Ghrelin","That signals hunger."]],"exp":"Cortisol is a stress hormone."}]},{"term":"Hypertension","def":"High blood pressure. One of the results of stress.","hook":"","asks":[{"q":"A doctor tells a stressed CEO her blood pressure is too high. What is the medical term?","right":"Hypertension","wrong":[["Immunosuppression, a weakened immune system","That is a weakened immune system."],["Narcolepsy","That is a sleep disorder."],["Eustress","That is good stress."]],"exp":"Hypertension = high blood pressure."},{"q":"Years of constant job stress leave a man with dangerously high blood pressure. Which stress effect is this?","right":"Hypertension","wrong":[["Immunosuppression, which weakens the body's immune system","That is a weaker immune system."],["Eustress","That is good stress."],["Hypervigilance","That is a PTSD symptom."]],"exp":"Hypertension (high blood pressure) is one result of stress."}]},{"term":"Immunosuppression","def":"A weakened immune system. One of the results of stress (along with hypertension and headaches).","hook":"Immuno-suppression = immune system pushed down.","asks":[{"q":"Students who are stressed about exams get sick more often. What effect of stress explains this?","right":"Immunosuppression","wrong":[["Hypertension, or high blood pressure","That is about blood pressure, not getting sick."],["Eustress","That is motivating stress."],["Tend-and-befriend","That is a stress response."]],"exp":"Stress pushes the immune system down."},{"q":"Which pair are both results of stress on your slides?","right":"Immunosuppression and headaches","wrong":[["Better immune function and fewer illnesses during exams","Stress weakens the immune system."],["Lower blood pressure and better sleep","Stress raises blood pressure."],["More leptin and less ghrelin","Not listed as stress results."]],"exp":"Stress can cause hypertension, headaches and immunosuppression."}]}]},{"name":"Stressors","cards":[{"term":"Eustress","def":"Motivating stress, or \"good\" stress: situations that are challenging but manageable and can lead to growth. Your slide lists changes like moving, marriage, and pregnancy.","hook":"Eu = good (like euphoria).","asks":[{"q":"Maya is nervous but excited about starting at a new school, and the challenge helps her grow. What kind of stress is this?","right":"Eustress","wrong":[["Distress from a negative, debilitating event","Hers is motivating, not debilitating."],["A catastrophe","That is a large-scale disaster."],["A daily hassle","That is everyday annoyance."]],"exp":"Eu = good: challenging but manageable stress."},{"q":"Which of these is the best example of eustress?","right":"Training hard for a race you're excited about","wrong":[["Losing your home and all of your belongings in a sudden flood","That is a catastrophe (distress)."],["A daily traffic jam","That is a daily hassle."],["A loved one's death","That is a significant life change (distress)."]],"exp":"Eustress is challenging but manageable and leads to growth."}]},{"term":"Distress","def":"Debilitating stress, or \"bad\" stress, which has a negative impact. Includes ACEs, catastrophes, significant life changes, and daily hassles.","hook":"Dis = bad.","asks":[{"q":"After losing his job and his home, Carl feels overwhelmed and can't function. What kind of stress is this?","right":"Distress","wrong":[["Eustress that motivates him to grow and improve","His stress is debilitating, not motivating."],["Hypomania","That is a mood episode."],["Tending","That is caring for others."]],"exp":"Dis = bad stress."},{"q":"Which list contains only types of distress on your slides?","right":"ACEs, catastrophes, life changes, hassles","wrong":[["Moving, marriage and pregnancy, which can lead to personal growth","Your slide lists those under eustress."],["Tending and befriending","That is a stress response."],["Alarm, resistance, exhaustion","Those are GAS stages."]],"exp":"Distress includes ACEs, catastrophes, significant life changes and daily hassles."}]},{"term":"Catastrophes","def":"Unpredictable, large-scale events, such as natural disasters. A type of distress.","hook":"","asks":[{"q":"A hurricane destroys a whole town without warning. Which type of stressor is this?","right":"A catastrophe","wrong":[["A daily hassle that everyone faces now and then","This is unpredictable and large-scale."],["A significant life change","Those are personal events like divorce."],["Eustress","This isn't good stress."]],"exp":"Catastrophes are unpredictable, large-scale events."},{"q":"What makes a wildfire a \"catastrophe\" rather than a daily hassle?","right":"It's unpredictable and large-scale","wrong":[["It only affects a single person on a single afternoon","Catastrophes affect many people."],["It is a good kind of stress","It is distress."],["It happens every day","Daily hassles are everyday."]],"exp":"Catastrophes are unpredictable, large-scale events."}]},{"term":"Significant life changes","def":"Distress like divorce or the death of a loved one.","hook":"","asks":[{"q":"Which of these is a \"significant life change\" type of distress?","right":"The death of a loved one","wrong":[["Getting stuck in traffic on the way to school","That is a daily hassle."],["An earthquake","That is a catastrophe."],["A dead phone battery","That is a daily hassle."]],"exp":"Divorce or the death of a loved one."},{"q":"Jo's parents divorce and she moves between two homes. Which type of distress is this?","right":"A significant life change","wrong":[["A catastrophe that affects the whole town at once","This is a personal life event."],["A daily hassle","It's a major change, not an everyday annoyance."],["Eustress","It's distress."]],"exp":"Divorce or the death of a loved one."}]},{"term":"Daily hassles","def":"Everyday distress like traffic, a dead cell phone, no Wi-Fi, strained budgets, and deadlines.","hook":"","asks":[{"q":"No Wi-Fi, a dead phone and a long line at lunch all in one day. What type of stress are these?","right":"Daily hassles","wrong":[["Catastrophes that affect a whole community at once","These are everyday annoyances."],["Significant life changes","These are small, not life-changing."],["ACEs","Those are childhood traumas."]],"exp":"Everyday distress."},{"q":"A student says, \"Nothing huge went wrong, but my bus was late, my phone died and I have three deadlines.\" Which type of stress is this?","right":"Daily hassles","wrong":[["A significant life change, like a divorce in the family","These are small, everyday problems."],["A catastrophe","Nothing large-scale happened."],["Eustress","This is distress."]],"exp":"Everyday distress like a dead phone, no Wi-Fi and deadlines."}]}]},{"name":"Adverse Childhood Experiences","cards":[{"term":"Adverse Childhood Experiences (ACEs)","def":"Stressful or traumatic events that happen during a child's development (ages 0–17). Negative experiences that affect a child's brain and health as they grow into adults.","hook":"","asks":[{"q":"A researcher studies how growing up with abuse affects adult health. What is she studying?","right":"Adverse Childhood Experiences","wrong":[["Daily hassles, the small annoyances of adult life","Those aren't childhood trauma."],["Eustress","That is good stress."],["The General Adaptation Syndrome","That is the body's response to ongoing stress."]],"exp":"ACEs: stressful or traumatic events from ages 0 to 17."},{"q":"A 30-year-old was neglected as a child. Why might her doctor ask about it, according to your slides?","right":"ACEs affect health into adulthood","wrong":[["ACEs only matter while the person is still a young child","ACEs affect the brain and health as children grow into adults."],["ACEs only affect teeth","Not on your slides."],["ACEs are a type of eustress","They are distress."]],"exp":"ACEs affect a child's brain and health as they grow into adults."}]},{"term":"Three types of ACEs","def":"Abuse, neglect, and household dysfunction.","hook":"A-N-H: Abuse, Neglect, Household.","asks":[{"q":"Which list names the three types of ACEs?","right":"Abuse, neglect, household dysfunction","wrong":[["Alarm, resistance, exhaustion, recovery","Those are GAS stages (and recovery isn't one)."],["Catastrophes, life changes, hassles","Those are types of distress."],["Deviant, dysfunctional, distressing","Those are the 3 Ds."]],"exp":"A-N-H: abuse, neglect, household."},{"q":"A child lives with a parent who abuses alcohol. Which of the three ACE types is this?","right":"Household dysfunction","wrong":[["Neglect of the child's physical or emotional needs","The issue described is the household situation."],["Abuse","No one is said to harm the child directly."],["Catastrophe","That isn't an ACE type."]],"exp":"A parent who abuses substances counts as household dysfunction."}]},{"term":"ACE: Abuse","def":"Physical, emotional, or sexual abuse.","hook":"","asks":[{"q":"A child is regularly hit and yelled at by a parent. Which type of ACE is this?","right":"Abuse","wrong":[["Household dysfunction like a parent in prison","This is direct harm to the child."],["Neglect","Neglect is failing to meet needs."],["A daily hassle","This is serious trauma."]],"exp":"Physical, emotional or sexual abuse."},{"q":"Which situation counts as the \"abuse\" type of ACE?","right":"A parent who constantly insults and belittles the child","wrong":[["A parent who is in prison and can't be there for the child","That is household dysfunction."],["A parent who forgets meals","That is neglect."],["Domestic violence between parents","That is household dysfunction."]],"exp":"Abuse can be physical, emotional or sexual."}]},{"term":"ACE: Neglect","def":"Physical or emotional neglect.","hook":"","asks":[{"q":"A child is often left without food or attention for days. Which type of ACE is this?","right":"Neglect","wrong":[["Abuse involving physical or emotional harm","Abuse is active harm; this is failing to meet needs."],["Household dysfunction","That covers things like domestic violence."],["A catastrophe","That is a disaster."]],"exp":"Physical or emotional neglect."},{"q":"What separates neglect from abuse as an ACE?","right":"Neglect is failing to meet needs","wrong":[["Neglect only happens in households where a parent is in prison","That is household dysfunction."],["Neglect is physical harm","That is abuse."],["Neglect is good stress","It's distress."]],"exp":"Neglect is physical or emotional neglect; abuse is harm done to the child."}]},{"term":"ACE: Household dysfunction","def":"Living with a parent who abuses substances, experiencing domestic violence, having a parent with a mental illness, or having a parent incarcerated.","hook":"","asks":[{"q":"A child grows up with a parent who is in prison. Which type of ACE is this?","right":"Household dysfunction","wrong":[["Neglect of the child's basic physical needs","This is about the household situation."],["Abuse","No one is directly harming the child here."],["Eustress","This is not good stress."]],"exp":"Includes substance abuse, domestic violence, mental illness or an incarcerated parent."},{"q":"Which situation counts as household dysfunction?","right":"A parent with a serious mental illness","wrong":[["A parent who hits the child whenever he gets bad grades at school","That is abuse."],["A parent who ignores the child's needs","That is neglect."],["Moving to a new city","That isn't listed as an ACE."]],"exp":"Substance abuse, domestic violence, mental illness or incarceration."}]},{"term":"Health risks of ACEs","def":"Behaviors: missed work, lack of physical activity, smoking, alcoholism, drug use. Physical and mental health: obesity, heart disease, depression, suicide attempts, STDs, COPD, cancer, stroke, diabetes, broken bones.","hook":"","asks":[{"q":"A doctor learns a patient had many ACEs. What should she watch for, according to your slides?","right":"Higher risks like heart disease and depression","wrong":[["A stronger immune system from early exposure to stress","ACEs raise health risks."],["Better coping skills in all cases","ACEs are linked to more problems."],["No lasting effects after age 18","Effects continue into adulthood."]],"exp":"ACEs are linked to obesity, heart disease, depression and more."},{"q":"Which behaviors are linked to ACEs on your slides?","right":"Smoking, alcoholism and drug use","wrong":[["Extra exercise, better grades and stronger friendships overall","ACEs are linked to risks, not benefits."],["Perfect sleep","Not listed."],["Less risk of disease","ACEs raise disease risk."]],"exp":"Behaviors: missed work, inactivity, smoking, alcoholism, drug use."}]}]},{"name":"General Adaptation Syndrome","cards":[{"term":"General Adaptation Syndrome (GAS)","def":"How the body responds to ongoing stress, in three stages: alarm, resistance, and exhaustion.","hook":"A-R-E: Alarm, Resistance, Exhaustion.","asks":[{"q":"Which model describes the body's response to ongoing stress in three stages?","right":"General Adaptation Syndrome","wrong":[["Tend-and-befriend theory of seeking support","That is a stress response, not a three-stage model."],["Gate control theory","That is about pain."],["The 3 Ds","Those define disorders."]],"exp":"Alarm, resistance, exhaustion."},{"q":"A nurse works months of double shifts. Which GAS sequence will her body most likely go through?","right":"Alarm, resistance, exhaustion","wrong":[["Resistance, then alarm, then a full recovery after a short while","Alarm comes first, and recovery isn't a stage."],["Exhaustion, alarm, resistance","Out of order."],["Tend, befriend, cope","That isn't GAS."]],"exp":"A-R-E: alarm, resistance, exhaustion."}]},{"term":"Alarm stage","def":"Immediate stress; the fight-or-flight response is activated.","hook":"","asks":[{"q":"Right after a car nearly hits her, Ana's heart races and she's ready to run. Which GAS stage is she in?","right":"Alarm","wrong":[["Resistance, as her body keeps adapting to stress","That comes after the first shock."],["Exhaustion","That is when resources run out."],["Recovery","That isn't a GAS stage."]],"exp":"Alarm: fight-or-flight activates."},{"q":"Which stage of GAS is the same as the fight-or-flight response kicking in?","right":"Alarm","wrong":[["Resistance, when the body keeps adapting to the stressor","That comes after the first reaction."],["Exhaustion","That is when resources run out."],["Tending","That is part of tend-and-befriend."]],"exp":"Alarm: immediate stress, fight-or-flight activated."}]},{"term":"Resistance stage","def":"Adaptive stress: the body is still in high stress with hormones like cortisol and epinephrine flowing, using up your reserves.","hook":"","asks":[{"q":"Weeks into caring for a sick parent, Jon is still running on stress hormones and using up his reserves. Which GAS stage?","right":"Resistance","wrong":[["Alarm, the first burst of fight-or-flight","That is the immediate reaction."],["Exhaustion","His reserves aren't gone yet."],["Eustress","That is a type of stress, not a stage."]],"exp":"Resistance: still high stress, using up reserves."},{"q":"In which GAS stage are cortisol and epinephrine still flowing while the body uses up its reserves?","right":"Resistance","wrong":[["Exhaustion, when the body's resources are already gone","In exhaustion the reserves are already depleted."],["Alarm","That is the first reaction."],["Recovery","Not a GAS stage."]],"exp":"Resistance: still high stress, using up reserves."}]},{"term":"Exhaustion stage","def":"The body's resources are depleted and the ability to cope is weakened, which leads to physical and mental health issues.","hook":"","asks":[{"q":"After months of nonstop stress, a nurse gets sick often and can't cope anymore. Which GAS stage is she in?","right":"Exhaustion","wrong":[["Resistance, still holding up under the stress","Her resources are now depleted."],["Alarm","That is the first reaction."],["Tending","That is caring for others."]],"exp":"Exhaustion: resources depleted, health problems follow."},{"q":"Why do people in the exhaustion stage of GAS get sick more often?","right":"Their resources are depleted","wrong":[["Their bodies are full of fresh energy reserves for fighting illness","Reserves are used up."],["They're in fight-or-flight","That is the alarm stage."],["They have too much leptin","Not on your slides."]],"exp":"Depleted resources weaken coping and lead to health issues."}]}]},{"name":"Responding to stress","cards":[{"term":"Tend-and-befriend theory","def":"A stress response, primarily observed in women, that involves seeking support, caring for others, and forming or strengthening social connections instead of fight-or-flight. Part of evolutionary psychology: believed to have evolved so females could ensure the survival of their offspring and themselves.","hook":"","asks":[{"q":"After a stressful day, Keisha calls her friends and cooks for her kids instead of fighting or fleeing. Which theory describes this?","right":"Tend-and-befriend","wrong":[["General Adaptation Syndrome of alarm, resistance and exhaustion","That describes stages of stress, not seeking support."],["Gate control theory","That is about pain."],["Opponent-process theory","That is about color."]],"exp":"Seeking support and caring for others, observed mainly in women."},{"q":"Why did tend-and-befriend evolve, according to your slides?","right":"To help females protect offspring and themselves","wrong":[["To help males win fights against rivals over territory and mates","It's described as an evolved female response."],["To lower blood pressure only","Not the reason given."],["To avoid all social contact","It involves seeking social contact."]],"exp":"Evolutionary psychology: so females could ensure the survival of offspring and themselves."}]},{"term":"Tending","def":"Caring for others: protecting and nurturing offspring, often by providing care, resources, and emotional support.","hook":"","asks":[{"q":"During a crisis, a mother focuses on protecting and comforting her children. Which part of tend-and-befriend is this?","right":"Tending","wrong":[["Befriending, reaching out to friends for support","That is building social connections."],["Problem-focused coping","That is solving the stressor itself."],["Alarm","That is a GAS stage."]],"exp":"Tending = caring for others."},{"q":"During a blackout, a mother gathers her kids, comforts them and shares food. Which part of tend-and-befriend is this?","right":"Tending","wrong":[["Befriending, building connections with friends and neighbors","She is caring for her children."],["Fight-or-flight","She isn't fighting or fleeing."],["Problem-focused coping","Not the tend-and-befriend term."]],"exp":"Tending = protecting and nurturing offspring."}]},{"term":"Befriending","def":"Seeking out and strengthening social connections for mutual support and protection.","hook":"","asks":[{"q":"After a scare, a woman reaches out to her neighbors so they can support one another. Which part of tend-and-befriend is this?","right":"Befriending","wrong":[["Tending, caring for and protecting children","That is caring for others."],["Emotion-focused coping","That is managing feelings."],["Resistance","That is a GAS stage."]],"exp":"Befriending = strengthening social connections."},{"q":"After a layoff, coworkers form a group chat to share job leads and support each other. Which part of tend-and-befriend is this?","right":"Befriending","wrong":[["Tending, protecting and nurturing one's own children","This is about social connections."],["Emotion-focused coping only","The tend-and-befriend term is befriending."],["Alarm","That is a GAS stage."]],"exp":"Befriending = strengthening social connections for mutual support."}]},{"term":"Problem-focused coping","def":"Solving the problem: dealing with the stressor itself by identifying the problem, generating solutions, evaluating options, and taking action. It tackles the root cause of the stress, not just the feelings, and works best when the stressor can be changed or controlled.","hook":"Problem-focused = fix the problem.","asks":[{"q":"Stressed about failing chemistry, Ben makes a study schedule and signs up for tutoring. What coping style is this?","right":"Problem-focused coping","wrong":[["Emotion-focused coping, managing how he feels","He is changing the situation, not just his feelings."],["Tending","That is caring for others."],["Distress","That is a type of stress."]],"exp":"Tackling the root cause of the stressor."},{"q":"When does problem-focused coping work best, according to your slides?","right":"When the stressor can be changed","wrong":[["When the stressor is completely out of the person's control","Then emotion-focused coping is used."],["Only after a catastrophe","Not on your slides."],["Only in children","Not on your slides."]],"exp":"It works best when the stressor can be changed or controlled."}]},{"term":"Emotion-focused coping","def":"Focusing on your emotional response: how you feel about the stressor, not changing the stressor itself. The goal is to regulate negative emotions or tolerate the stressor's impact. Used when the stressor seems uncontrollable or problem-focused coping isn't working.","hook":"Emotion-focused = fix the feeling.","asks":[{"q":"Unable to change her parents' divorce, Lia journals and meditates to feel calmer. What coping style is this?","right":"Emotion-focused coping","wrong":[["Problem-focused coping, fixing the cause of stress","She can't change the stressor; she is managing feelings."],["Befriending","That is building social connections."],["Alarm","That is a GAS stage."]],"exp":"Regulating your emotional response, not the stressor."},{"q":"A student's grandmother is terminally ill, which he can't change. Which coping style fits best?","right":"Emotion-focused coping","wrong":[["Problem-focused coping, fixing the cause of the stress directly","The stressor can't be changed."],["Hypertension","That is a stress result."],["Alarm","That is a GAS stage."]],"exp":"Used when the stressor seems uncontrollable."}]}]}],"intro":["Stress and cortisol, eustress vs. distress, ACEs, General Adaptation Syndrome, tend-and-befriend, and the two kinds of coping."]},{"id":2,"name":"Intro to Psychological Disorders","optional":false,"sections":[{"name":"When is it a disorder?","cards":[{"term":"When is it a disorder? (the 3 Ds)","def":"Professionals label thoughts, feelings, and behaviors as a disorder when they are deviant, dysfunctional/maladaptive, and distressing.","hook":"The 3 Ds.","asks":[{"q":"A professional decides whether someone's behavior is a disorder. Which three features does she look for?","right":"Deviant, dysfunctional, distressing","wrong":[["Dangerous, delusional, dramatic, and diagnosed early","Those aren't the 3 Ds."],["Abuse, neglect, dysfunction","Those are types of ACEs."],["Alarm, resistance, exhaustion","Those are GAS stages."]],"exp":"Deviant, dysfunctional/maladaptive and distressing."},{"q":"Aisha wears unusual clothes but is happy and functions well at school and work. Is this a disorder by the 3 Ds?","right":"No; only deviant, not dysfunctional or distressing","wrong":[["Yes, because anything unusual or different counts as a disorder","All three Ds are needed."],["Yes, because she's distressed","She is happy."],["Yes, because she can't function","She functions well."]],"exp":"A disorder must be deviant, dysfunctional and distressing."}]},{"term":"Deviant","def":"Different from social norms. One of the 3 Ds.","hook":"","asks":[{"q":"Talking loudly to yourself in a quiet library goes against social norms. Which of the 3 Ds does this describe?","right":"Deviant","wrong":[["Dysfunctional, interfering with daily life","This is about breaking norms."],["Distressing","That is about causing distress."],["Maladaptive","That is another word for dysfunctional."]],"exp":"Deviant = different from social norms."},{"q":"Why is \"deviant\" alone not enough to call something a disorder?","right":"Unusual isn't always harmful","wrong":[["Deviant behavior is always dangerous to the person and others","Not all deviant behavior is harmful."],["Deviant means distressing","Those are separate Ds."],["The DSM-5 ignores deviance","It's one of the 3 Ds."]],"exp":"A disorder must also be dysfunctional and distressing."}]},{"term":"Dysfunctional / maladaptive","def":"Interferes with the person's ability to function in daily life. One of the 3 Ds.","hook":"","asks":[{"q":"Rita's fear of germs keeps her from going to work or school. Which of the 3 Ds does this show most clearly?","right":"Dysfunctional / maladaptive","wrong":[["Deviant, going against social norms","The key point is that it stops her from functioning."],["Distressing","It may be, but the key point is functioning."],["Hypomanic","That is a mood episode."]],"exp":"It interferes with daily functioning."},{"q":"Which detail shows a behavior is dysfunctional?","right":"It keeps the person from working","wrong":[["It is unusual compared with the person's culture and social norms","That is deviant."],["It upsets the person","That is distressing."],["It is common","Common behaviors can still be dysfunctional or not."]],"exp":"Dysfunctional = interferes with daily functioning."}]},{"term":"Distressing","def":"Causes distress for the person or for others. One of the 3 Ds.","hook":"","asks":[{"q":"Omar's thoughts cause him constant suffering, even though others don't notice anything unusual. Which of the 3 Ds is clearest?","right":"Distressing","wrong":[["Deviant, since others see him as strange","Others don't notice anything."],["Dysfunctional","The key point is his suffering."],["Tending","That is caring for others."]],"exp":"It causes distress for the person or others."},{"q":"A man's behavior doesn't bother him, but it deeply upsets his family. Can it still count as distressing?","right":"Yes, distress can be to others","wrong":[["No, it only counts if the person himself is suffering from it","The card says distress for the person or for others."],["No, families don't count","They do."],["Only if it's deviant","Distressing is its own D."]],"exp":"Distressing: causes distress for the person or for others."}]},{"term":"DSM-5","def":"The Diagnostic and Statistical Manual of Mental Disorders, 5th edition. Used to classify (label) disorders in the United States.","hook":"","asks":[{"q":"Which manual do U.S. clinicians use to classify mental disorders?","right":"The DSM-5","wrong":[["The APA ethical guidelines for research studies","Those are for research ethics."],["The Codex Mendoza","That is not psychology."],["The ACE questionnaire","That measures childhood experiences."]],"exp":"Diagnostic and Statistical Manual of Mental Disorders, 5th edition."},{"q":"A therapist checks whether a client's symptoms meet official criteria to label a disorder. Which book does she use?","right":"The DSM-5","wrong":[["The MMPI personality test given to clients in many clinics","Not on your slides."],["The APA ethics code","That is about research ethics."],["A textbook on evolution","Not the manual."]],"exp":"Used to classify (label) disorders in the U.S."}]}]},{"name":"Explanations by approach","cards":[{"term":"Biological explanation","def":"Medical or genetic issues; chemical imbalances (neurotransmitters and hormones); tumors; structural issues in the brain.","hook":"","asks":[{"q":"A psychiatrist says a patient's depression comes from a serotonin imbalance. Which explanation is this?","right":"Biological","wrong":[["Psychodynamic, about unconscious childhood conflicts","That would point to the unconscious."],["Behavioral","That would point to learning."],["Sociocultural","That would point to culture."]],"exp":"Chemical imbalances, genetics and brain structure."},{"q":"Which finding would a biological explanation of a disorder point to?","right":"A tumor pressing on the brain","wrong":[["A child who learned to fear dogs after being bitten by one","That is behavioral."],["Irrational beliefs","That is cognitive."],["A lack of social support","That is humanistic."]],"exp":"Medical or genetic issues, chemical imbalances, tumors, brain structure."}]},{"term":"Psychodynamic explanation","def":"Unconscious thoughts and childhood experiences.","hook":"","asks":[{"q":"A therapist says a patient's anxiety comes from unresolved childhood conflicts he isn't aware of. Which explanation is this?","right":"Psychodynamic","wrong":[["Cognitive, about irrational thoughts he is aware of","That would point to conscious thinking patterns."],["Biological","That would point to brain chemistry."],["Evolutionary","That would point to survival."]],"exp":"Unconscious thoughts and childhood experiences."},{"q":"Which explanation would point to a client's unresolved feelings about her childhood, outside her awareness?","right":"Psychodynamic","wrong":[["Behavioral, about responses learned through conditioning","That is about learned responses."],["Biological","That is about the body."],["Sociocultural","That is about social dynamics."]],"exp":"Unconscious thoughts and childhood experiences."}]},{"term":"Behavioral explanation","def":"Responses learned in our environment through conditioning and reinforcement.","hook":"","asks":[{"q":"A child fears dogs after being bitten and then avoids them, which keeps the fear going. Which explanation is this?","right":"Behavioral","wrong":[["Humanistic, about not reaching full potential","That focuses on potential and support."],["Biological","That focuses on the body."],["Psychodynamic","That focuses on the unconscious."]],"exp":"Responses learned through conditioning and reinforcement."},{"q":"A teen is praised every time he acts helpless, so he acts more helpless. Which explanation of his behavior is this?","right":"Behavioral","wrong":[["Cognitive, about his irrational thoughts and beliefs","The cause here is reinforcement."],["Evolutionary","That is about survival."],["Psychodynamic","That is about the unconscious."]],"exp":"Responses learned through conditioning and reinforcement."}]},{"term":"Cognitive explanation","def":"Maladaptive, irrational, and dysfunctional thoughts and beliefs.","hook":"","asks":[{"q":"A therapist says a student's depression comes from thinking \"I fail at everything.\" Which explanation is this?","right":"Cognitive","wrong":[["Behavioral, about learned rewards and conditioning","That focuses on learning, not thoughts."],["Biological","That focuses on chemistry."],["Evolutionary","That focuses on survival."]],"exp":"Maladaptive, irrational thoughts and beliefs."},{"q":"A therapist links a client's anxiety to her belief that \"if I make one mistake, everyone will hate me.\" Which explanation is this?","right":"Cognitive","wrong":[["Biological, from a chemical imbalance in her brain","The cause here is a belief."],["Behavioral","That is learned through reinforcement."],["Humanistic","That is about support and potential."]],"exp":"Maladaptive, irrational thoughts and beliefs."}]},{"term":"Sociocultural explanation","def":"Social and cultural relationships and dynamics.","hook":"","asks":[{"q":"A researcher links rising teen anxiety to social media pres
