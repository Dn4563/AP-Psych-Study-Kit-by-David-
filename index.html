 a person's balance and coordination","His change was in personality, not balance."],["The hippocampus stores memories","His memory wasn't the issue."],["Brain damage never changes behavior","His behavior changed dramatically."]],"exp":"Phineas Gage's personality changed after damage to his prefrontal cortex."},{"q":"What happened to Phineas Gage?","right":"An iron rod went through his prefrontal cortex","wrong":[["He lost his hippocampus in surgery and could not form memories","Not Gage."],["He had his corpus callosum cut","That is a split-brain patient."],["He developed MS","Not Gage."]],"exp":"A railroad worker whose personality changed after the injury."}]},{"term":"Parietal lobe","def":"Top of the brain; processes body sensations (touch, pressure, temperature, pain) and spatial orientation.","hook":"","asks":[{"q":"A patient loses the ability to feel temperature and pressure on her skin and struggles with spatial orientation. Which lobe is damaged?","right":"The parietal lobe","wrong":[["The occipital lobe at the back of the brain","That processes vision."],["The temporal lobe","That processes hearing and memory."],["The frontal lobe","That handles planning and movement."]],"exp":"The parietal lobe processes body sensations and spatial orientation."},{"q":"Where is the parietal lobe?","right":"On top of the brain","wrong":[["At the very front of the brain, behind the forehead","That is the frontal lobe."],["At the back","That is the occipital lobe."],["On the sides","That is the temporal lobe."]],"exp":"Top of the brain."}]},{"term":"Somatosensory cortex","def":"Strip in the parietal lobe, directly behind the motor cortex, that registers touch and body movement sensations.","hook":"","asks":[{"q":"Which strip, directly behind the motor cortex, registers touch and body sensations?","right":"The somatosensory cortex","wrong":[["The motor cortex just in front of it","The motor cortex controls movement."],["The auditory cortex","That processes hearing."],["The prefrontal cortex","That handles judgment."]],"exp":"M before S: motor cortex, then somatosensory cortex."},{"q":"Your fingertips are very sensitive. Which strip registers that touch?","right":"The somatosensory cortex","wrong":[["The motor cortex, which controls voluntary body movement","That controls movement."],["The visual cortex","That processes sight."],["The auditory cortex","That processes sound."]],"exp":"It registers touch and body movement sensations."}]},{"term":"Temporal lobe","def":"Side of the brain, above the ears; hearing, language processing, and long-term memory storage.","hook":"Temporal = by your temples, near your ears.","asks":[{"q":"Which lobe, by your temples above your ears, processes hearing and stores long-term memories?","right":"The temporal lobe","wrong":[["The parietal lobe on top of the brain","That processes body sensations."],["The occipital lobe","That processes vision."],["The frontal lobe","That handles planning and movement."]],"exp":"Temporal = by your temples, near your ears."},{"q":"After an injury above his left ear, a man struggles to process what people say and to recall old memories. Which lobe is most likely damaged?","right":"The temporal lobe","wrong":[["The occipital lobe at the back, which handles everything we see","That is vision."],["The parietal lobe","That is touch and space."],["The cerebellum","That is balance."]],"exp":"Temporal lobe: hearing, language processing, long-term memory."}]},{"term":"Primary auditory cortex","def":"Area in the temporal lobe where hearing is processed.","hook":"","asks":[{"q":"A patient's ears work perfectly, but damage to one area of the temporal lobe leaves her unable to process sounds. Which area?","right":"The primary auditory cortex","wrong":[["The somatosensory cortex in the parietal lobe","That handles touch."],["The motor cortex","That controls movement."],["Broca's area","That controls speech production."]],"exp":"Hearing is processed in the primary auditory cortex."},{"q":"Which lobe contains the primary auditory cortex?","right":"The temporal lobe","wrong":[["The occipital lobe at the back of the brain, which processes sight","That is vision."],["The frontal lobe","That is planning and movement."],["The parietal lobe","That is touch."]],"exp":"Hearing is processed in the temporal lobe."}]},{"term":"Wernicke's area","def":"Temporal lobe area for comprehending written and spoken language.","hook":"Wernicke = words don't make sense.","asks":[{"q":"Which temporal lobe area lets you understand spoken and written language?","right":"Wernicke's area","wrong":[["Broca's area in the left frontal lobe","Broca's area produces speech."],["The amygdala","That processes fear."],["The cerebellum","That handles balance."]],"exp":"Wernicke = words don't make sense when damaged."},{"q":"A woman can still speak fluently but can no longer understand what she reads or hears. Which area is most likely damaged?","right":"Wernicke's area","wrong":[["Broca's area, which would make her speech slow and broken instead","Her speech is fluent."],["The motor cortex","That is movement."],["The occipital lobe","She can see the words."]],"exp":"Wernicke's area is for comprehending written and spoken language."}]},{"term":"Wernicke's aphasia","def":"Difficulty understanding and expressing language; speech can flow but makes little sense.","hook":"","asks":[{"q":"After a stroke, a woman speaks fluently but says, \"The table is running the purple Tuesday.\" What does she most likely have?","right":"Wernicke's aphasia","wrong":[["Broca's aphasia, with short, effortful speech","In Broca's, speech is short and halting, not fluent nonsense."],["Contralateral control","That is how the brain controls the body."],["Plasticity","That is the brain's ability to change."]],"exp":"Fluent speech that makes little sense = Wernicke's aphasia."},{"q":"Which ability is impaired in Wernicke's aphasia?","right":"Understanding language","wrong":[["Moving the mouth to speak at all, so the person is silent","Speech can flow."],["Seeing faces","Not related."],["Balance","Not related."]],"exp":"Difficulty understanding and expressing language; speech can flow but makes little sense."}]},{"term":"Occipital lobe","def":"Back of the brain; processes visual information. Has neurons that recognize lines, angles, shapes, and movement. Damage can cause blindness.","hook":"Occipital = Optical.","asks":[{"q":"A soldier's eyes are unharmed, but an injury to the back of his brain leaves him blind. Which lobe was damaged?","right":"The occipital lobe","wrong":[["The temporal lobe on the side of the brain","That processes hearing."],["The frontal lobe","That handles planning."],["The parietal lobe","That processes body sensations."]],"exp":"Occipital = optical."},{"q":"Which features do neurons in the occipital lobe recognize, according to your card?","right":"Lines, angles, shapes and movement","wrong":[["Pitch, loudness and the direction that a sound comes from","That is hearing."],["Hot and cold","That is touch."],["Tastes","That is gustation."]],"exp":"Neurons that recognize lines, angles, shapes and movement."}]}]},{"name":"Hemispheres","cards":[{"term":"Corpus callosum","def":"Large band of neural fibers connecting the left and right hemispheres so they can communicate.","hook":"","asks":[{"q":"To stop severe seizures, surgeons cut the band connecting the two hemispheres. What did they cut?","right":"The corpus callosum","wrong":[["The reticular formation in the brainstem","That controls arousal."],["The spinal cord","That connects brain to body."],["The hippocampus","That stores memories."]],"exp":"The corpus callosum lets the hemispheres communicate."},{"q":"What does the corpus callosum let the hemispheres do?","right":"Communicate","wrong":[["Control the same side of the body instead of the opposite side","Control is contralateral."],["Sleep","Not its job."],["Produce hormones","Not its job."]],"exp":"A band of fibers that lets the hemispheres communicate."}]},{"term":"Brain lateralization","def":"The tendency for certain functions to be specialized to one side of the brain.","hook":"","asks":[{"q":"Language is mostly handled by the left side of the brain and face recognition by the right. What does this show?","right":"Brain lateralization","wrong":[["Neurogenesis, the growth of new neurons","That is forming new neurons."],["The all-or-none principle","That is about neurons firing."],["Reuptake","That is reabsorbing neurotransmitters."]],"exp":"Some functions are specialized to one side of the brain."},{"q":"Which statement describes lateralization?","right":"Some functions are mainly on one side","wrong":[["Both hemispheres do exactly the same jobs in exactly the same way","That isn't lateralization."],["The brain can make new neurons anywhere","That isn't true."],["Each neuron fires completely","That is all-or-none."]],"exp":"Certain functions are specialized to one side of the brain."}]},{"term":"Contralateral control","def":"Each side of the brain controls the opposite side of the body: right brain → left body, left brain → right body.","hook":"","asks":[{"q":"A stroke damages the right side of a patient's brain. Which side of the body is most likely affected?","right":"The left side","wrong":[["The right side, the same side as the damage","Each side of the brain controls the opposite side."],["Both sides equally","Control is mostly contralateral."],["Neither side","Movement would be affected on the opposite side."]],"exp":"Right brain → left body."},{"q":"A person touches something hot with the left hand. Which hemisphere first registers it?","right":"The right hemisphere","wrong":[["The left hemisphere, on the same side as the hand that was burned","Each side controls the opposite side."],["The cerebellum only","The cortex registers it."],["The brainstem only","Not the point."]],"exp":"Right brain ↔ left body."}]},{"term":"Left hemisphere","def":"Speech, language, and comprehension; math calculations; time and sequencing; recognizing words, letters, and numbers; controls the right side of the body.","hook":"Left = Language and Logic.","asks":[{"q":"Damage to which hemisphere is most likely to affect speech, math and recognizing words?","right":"The left hemisphere","wrong":[["The right hemisphere, which recognizes faces","The right handles faces, space and emotion."],["The cerebellum","That handles balance."],["The brainstem","That handles survival functions."]],"exp":"Left = language and logic."},{"q":"Which function does your card list for the left hemisphere?","right":"Time and sequencing","wrong":[["Recognizing faces, places and objects that you have seen before","That is the right."],["Tone of speech","That is the right."],["Expressing emotion","That is the right."]],"exp":"Left: speech, language, math, time and sequencing."}]},{"term":"Right hemisphere","def":"Spatial ability; recognizing faces, places, and objects; perceiving and expressing emotion; tone and emphasis in speech; controls the left side of the body.","hook":"","asks":[{"q":"A patient can still talk but can't recognize her family's faces or hear emotion in voices. Which hemisphere is most likely damaged?","right":"The right hemisphere","wrong":[["The left hemisphere, which handles language","Her speech is fine; the left handles language."],["The medulla","That controls breathing."],["The hippocampus","That stores memories."]],"exp":"The right handles faces, emotion and tone of speech."},{"q":"Which function does your card list for the right hemisphere?","right":"Spatial ability","wrong":[["Math calculations and recognizing written words and numbers","Those are left."],["Speech production","That is left."],["Time and sequencing","That is left."]],"exp":"Right: spatial ability, faces, emotion, tone."}]}]},{"name":"Change & damage","cards":[{"term":"Plasticity","def":"The brain's ability to change — reorganizing after damage or building new pathways through experience. Example: in a blind Braille reader, touch takes over parts of the visual cortex.","hook":"Plastic = moldable.","asks":[{"q":"In a blind person who reads Braille, the sense of touch takes over parts of the visual cortex. What does this show?","right":"Plasticity","wrong":[["Lateralization of language to the left hemisphere","That is specialization, not change."],["The all-or-none principle","That is about neurons firing."],["Reuptake","That is about neurotransmitters."]],"exp":"The brain can change and reorganize."},{"q":"After a stroke, a woman relearns to speak as other brain areas take over. What does this show?","right":"Plasticity","wrong":[["Neurogenesis happening in every single area of the brain","New neurons form in only two areas."],["Contralateral control","Not the point."],["All-or-none","Not the point."]],"exp":"The brain reorganizes after damage."}]},{"term":"Neurogenesis","def":"The formation of new neurons. Only happens in two areas (one for memory, one for smell); usually a destroyed neuron cannot be replaced.","hook":"","asks":[{"q":"Why is brain damage often permanent, even though the brain can make some new neurons?","right":"New neurons form in only two areas","wrong":[["Neurons can't send signals after the age of 25","Neurons keep firing throughout life."],["Plasticity never happens in adults","The brain can still reorganize."],["Glial cells kill all new neurons","That isn't on your slides."]],"exp":"Neurogenesis happens only in two areas (memory and smell)."},{"q":"In which two areas does neurogenesis happen, according to your card?","right":"One for memory, one for smell","wrong":[["One for vision and one for hearing, at the back and sides","Not the areas on your card."],["Every part of the brain","Only two areas."],["None at all","It happens in two areas."]],"exp":"Neurogenesis happens in only two areas: one for memory, one for smell."}]}]},{"name":"Brain scans","cards":[{"term":"EEG","def":"Electroencephalogram: electrodes on the scalp record the brain's electrical activity (brain waves). Used to find seizures.","hook":"E = Electrical.","asks":[{"q":"A doctor puts electrodes on a patient's scalp to look for seizure activity in her brain waves. Which test is this?","right":"An EEG","wrong":[["A CT scan using X-rays of the brain's structure","A CT shows structure, not electrical activity."],["An MRI","An MRI uses magnets to show structure."],["A PET scan","A PET uses radioactive glucose."]],"exp":"EEG = electrical activity (brain waves)."},{"q":"Which question can an EEG answer best?","right":"Is the patient having seizures?","wrong":[["Exactly where is the tumor inside the brain, and how big is it?","That needs a structure scan like CT or MRI."],["Which region uses the most glucose?","That is PET."],["Where is blood flow highest?","That is fMRI."]],"exp":"EEG records electrical activity; used to find seizures."}]},{"term":"PET scan","def":"Positron emission tomography: radioactive glucose is injected and the scan shows where it is being used — which regions are active.","hook":"","asks":[{"q":"Researchers inject radioactive glucose to see which brain regions are most active during a task. Which scan is this?","right":"A PET scan","wrong":[["A CT scan of the brain's structure","A CT shows structure with X-rays."],["An EEG","An EEG records electrical activity."],["An MRI","An MRI shows structure with magnets."]],"exp":"PET shows where glucose is used, which regions are active."},{"q":"PET and fMRI both show brain activity. Which is more precise, according to your card?","right":"fMRI","wrong":[["PET, because it uses radioactive glucose as a tracer","Your card says fMRI is more precise."],["Neither shows activity","Both do."],["CT","CT shows structure."]],"exp":"fMRI is more precise than PET."}]},{"term":"CT scan","def":"X-rays that show brain structure — the shape and position of structures. Helps find tumors.","hook":"","asks":[{"q":"A doctor uses X-rays to check whether a patient has a brain tumor. Which scan is this?","right":"A CT scan","wrong":[["An fMRI that measures blood flow","An fMRI shows function, not X-ray images."],["An EEG","An EEG records brain waves."],["A PET scan","A PET uses radioactive glucose."]],"exp":"CT = X-rays showing structure."},{"q":"Which scans show brain structure rather than activity?","right":"CT and MRI","wrong":[["PET and fMRI, which show which regions are working hardest","Those show activity."],["EEG and PET","Those show activity."],["EEG only","That shows activity."]],"exp":"Structure: CT, MRI. Activity: PET, fMRI, EEG."}]},{"term":"MRI","def":"Magnetic resonance imaging: strong magnetic pulses build a detailed picture of brain structure (tissue, tumors, clots).","hook":"","asks":[{"q":"A doctor wants a detailed picture of a patient's brain tissue using strong magnetic pulses. Which scan is this?","right":"An MRI","wrong":[["A PET scan using radioactive glucose","A PET shows activity with glucose."],["An EEG","An EEG records electrical activity."],["A CT scan","A CT uses X-rays."]],"exp":"MRI = magnets showing detailed structure."},{"q":"What does an MRI use to build its picture?","right":"Strong magnetic pulses","wrong":[["X-rays passed through the head from many different angles","That is CT."],["Radioactive glucose","That is PET."],["Scalp electrodes","That is EEG."]],"exp":"MRI uses strong magnetic pulses."}]},{"term":"fMRI","def":"Functional MRI: shows brain function by measuring blood flow and oxygen use. More precise than PET.","hook":"f = function.","asks":[{"q":"Researchers want to see which brain areas light up while people look at faces, by measuring blood flow and oxygen. Which scan?","right":"An fMRI","wrong":[["A CT scan showing the brain's structure","A CT shows structure only."],["An MRI","A regular MRI shows structure, not function."],["An EEG","An EEG records electrical activity."]],"exp":"f = function: blood flow and oxygen use."},{"q":"A researcher wants to see which brain areas work hardest while people solve puzzles, with no radiation. Which scan fits best?","right":"fMRI","wrong":[["PET, which injects radioactive glucose to track brain activity","That uses radioactive glucose."],["CT","That shows structure with X-rays."],["A regular MRI","That shows structure, not function."]],"exp":"fMRI shows function through blood flow and oxygen use."}]}]}],"intro":["Old brain, limbic system, the four lobes (F-POT), lateralization, plasticity, and brain scans."]},{"id":5,"name":"Vision","optional":false,"sections":[{"name":"The eye","cards":[{"term":"Cornea","def":"Clear, protective outer layer where light first enters the eye.","hook":"","asks":[{"q":"Light from a lamp first passes through which clear, protective outer layer of the eye?","right":"The cornea","wrong":[["The retina at the back of the eye","The retina is the last stop, not the first."],["The lens","Light reaches the lens after the cornea and pupil."],["The optic nerve","That carries signals to the brain."]],"exp":"The cornea is where light first enters."},{"q":"A scratch on the clear outer layer of the eye blurs everything a patient sees. Which structure is scratched?","right":"The cornea","wrong":[["The retina, the light-sensitive layer at the very back of the eye","The retina is at the back, not the outer layer."],["The iris","That is the colored muscle."],["The optic nerve","That carries signals to the brain."]],"exp":"The cornea is the clear, protective outer layer."}]},{"term":"Iris","def":"Colored muscle that surrounds the pupil and controls its size. Unique enough to identify you (iris scanners).","hook":"","asks":[{"q":"An airport scanner identifies you by the colored muscle around your pupil. What is it scanning?","right":"The iris","wrong":[["The retina's rods and cones in the back of the eye","The scanner reads the colored muscle, not the retina."],["The cornea","That is clear."],["The lens","That focuses light."]],"exp":"The iris controls pupil size and is unique to you."},{"q":"In bright sunlight, which muscle makes your pupils shrink?","right":"The iris","wrong":[["The lens, which changes its shape to focus near and far","The lens focuses; the iris controls pupil size."],["The cornea","It's a clear layer, not a muscle."],["The retina","It's light-sensitive tissue."]],"exp":"The iris controls the pupil's size."}]},{"term":"Pupil","def":"Small adjustable opening that lets light through.","hook":"","asks":[{"q":"In a dark movie theater, the small opening in your eye gets bigger to let in more light. What is it?","right":"The pupil","wrong":[["The lens, which changes shape to focus","The lens focuses; the pupil lets light in."],["The cornea","The cornea is a fixed outer layer."],["The retina","That is the light-sensitive surface."]],"exp":"The pupil is the adjustable opening."},{"q":"An eye doctor shines a light in your eye and watches a small black opening shrink. What is she watching?","right":"The pupil","wrong":[["The iris, the colored ring of muscle all around it","The iris is the muscle; the opening is the pupil."],["The lens","That's behind the pupil."],["The cornea","It doesn't change size."]],"exp":"The pupil is the adjustable opening that lets light in."}]},{"term":"Lens","def":"Transparent structure behind the pupil that changes shape to focus images on the retina.","hook":"","asks":[{"q":"Which transparent structure behind the pupil changes shape to focus images on the retina?","right":"The lens","wrong":[["The cornea, the clear outer layer","The cornea protects; the lens changes shape to focus."],["The iris","That controls pupil size."],["The optic nerve","That carries signals to the brain."]],"exp":"The lens focuses the image."},{"q":"You look from your phone to a whiteboard across the room and it comes into focus. Which structure changed shape to do that?","right":"The lens","wrong":[["The cornea, the clear outer layer that light passes through first","The cornea doesn't change shape to focus."],["The pupil","The pupil changes size, not focus."],["The retina","The retina receives the image."]],"exp":"The lens changes shape to focus images on the retina."}]},{"term":"Accommodation","def":"The lens changing shape to focus on near or far objects.","hook":"","asks":[{"q":"You look up from your phone to a sign far away, and the sign comes into focus. What process happened?","right":"Accommodation","wrong":[["Dark adaptation as your pupils widen in dim light","That is adjusting to darkness."],["Transduction","That converts light into neural impulses."],["Retinal disparity","That is a depth cue."]],"exp":"The lens changes shape to focus on near or far objects."},{"q":"Which structure changes shape during accommodation?","right":"The lens","wrong":[["The pupil, which gets bigger or smaller depending on light","The pupil changes size, not shape for focus."],["The retina","Not during accommodation."],["The cochlea","That is in the ear."]],"exp":"Accommodation is the lens changing shape to focus."}]},{"term":"Retina","def":"Light-sensitive inner surface at the back of the eye containing rods and cones. Where transduction happens.","hook":"","asks":[{"q":"Where in the eye are the rods and cones, and where is light turned into neural signals?","right":"The retina","wrong":[["The cornea at the front of the eye","The cornea lets light in; it has no receptors."],["The iris","That controls pupil size."],["The lens","That focuses light."]],"exp":"The retina is the light-sensitive surface where transduction happens."},{"q":"A disease destroys the rods and cones. Which part of the eye has been damaged?","right":"The retina","wrong":[["The cornea at the front of the eye, where light first enters","Rods and cones are in the retina."],["The lens","Not where rods and cones are."],["The iris","Not where rods and cones are."]],"exp":"The retina contains the rods and cones."}]},{"term":"Transduction","def":"Converting one form of energy (like light) into neural impulses the brain can understand.","hook":"","asks":[{"q":"Light hits your retina and is turned into signals your brain can read. What is this conversion called?","right":"Transduction","wrong":[["Accommodation of the lens to focus the image","That is focusing."],["Reuptake","That is reabsorbing neurotransmitters."],["Parallel processing","That happens later, in the brain."]],"exp":"Turning one form of energy into neural impulses."},{"q":"Hearing has its own transduction step. Where does it happen?","right":"In the cochlea's hair cells","wrong":[["In the eardrum, which only vibrates when sound waves arrive","The eardrum vibrates; the hair cells transduce."],["In the ossicles","They pass vibrations."],["In the optic nerve","That is vision."]],"exp":"Transduction converts one form of energy (vibration) into neural impulses."}]},{"term":"Rods","def":"Retina receptors for black-and-white vision; let you see in dim light.","hook":"Rods = Reduced light.","asks":[{"q":"On a moonlit hike, you can see shapes but not colors. Which receptors are doing most of the work?","right":"Rods","wrong":[["Cones, which handle color and fine detail","Cones work poorly in dim light."],["Ganglion cells","Those form the optic nerve."],["Bipolar cells","Those connect receptors to ganglion cells."]],"exp":"Rods = reduced light, black and white."},{"q":"A disease destroys a patient's rods but leaves the cones. Which problem will he notice most?","right":"Seeing in dim light","wrong":[["Telling apart the colors on a brightly lit, sunny afternoon","Cones handle color and they're fine."],["Hearing","Not related."],["Balance","Not related."]],"exp":"Rods let you see in dim light."}]},{"term":"Cones","def":"Retina receptors for color and fine detail; work poorly in dim light.","hook":"Cones = Color.","asks":[{"q":"Reading small colored print in bright light depends mostly on which receptors?","right":"Cones","wrong":[["Rods, which work best in dim light","Rods don't see color or fine detail."],["Feature detectors","Those are in the visual cortex."],["Hair cells","Those are in the cochlea."]],"exp":"Cones = color and detail."},{"q":"A person with damaged cones would have the most trouble with which task?","right":"Telling red from green","wrong":[["Seeing the outline of a dark hallway at night with no lights","That uses rods."],["Hearing high notes","That is the ear."],["Keeping balance","That is vestibular."]],"exp":"Cones handle color and fine detail."}]},{"term":"Dark adaptation","def":"In darkness the pupils dilate to let more light reach the retina; it takes about 20 minutes.","hook":"","asks":[{"q":"You walk into a dark room and can barely see, but about 20 minutes later you can make out the furniture. What happened?","right":"Dark adaptation","wrong":[["Accommodation as the lens changes its shape","That is focusing, not adjusting to dark."],["Transduction","That always happens when light hits the retina."],["Sensory interaction","That is one sense affecting another."]],"exp":"Pupils dilate to let more light in; it takes about 20 minutes."},{"q":"What happens to your pupils during dark adaptation?","right":"They dilate","wrong":[["They shrink to let in less light and protect the retina","In darkness they dilate."],["They close completely","They don't close."],["They change color","They don't change color."]],"exp":"Pupils dilate to let more light reach the retina; it takes about 20 minutes."}]},{"term":"Bipolar cells","def":"Connect the rods and cones to the ganglion cells.","hook":"","asks":[{"q":"Which cells connect the rods and cones to the ganglion cells?","right":"Bipolar cells","wrong":[["Feature detectors in the visual cortex","Those are in the brain, not the retina."],["Glial cells","Those support neurons."],["Hair cells","Those are in the ear."]],"exp":"Rods/cones → bipolar cells → ganglion cells."},{"q":"In the retina, a signal passes from the rods and cones to which cells next?","right":"Bipolar cells","wrong":[["The ossicles, three tiny bones in the middle of the ear","Those are in the ear."],["The lens","That is in front of the retina."],["The cornea","That is the outer layer."]],"exp":"Rods/cones → bipolar cells → ganglion cells."}]},{"term":"Ganglion cells","def":"Cells whose axons bundle together to form the optic nerve.","hook":"","asks":[{"q":"Whose axons bundle together to form the optic nerve?","right":"Ganglion cells","wrong":[["Bipolar cells, next to the rods and cones","Bipolar cells connect receptors to ganglion cells."],["Rods","Rods are receptors."],["Cones","Cones are receptors."]],"exp":"Ganglion cell axons form the optic nerve."},{"q":"Damage to the axons of the ganglion cells would affect which structure?","right":"The optic nerve","wrong":[["The iris, the colored muscle that sets the size of the pupil","Not made of ganglion axons."],["The lens","Not made of ganglion axons."],["The cochlea","That is in the ear."]],"exp":"Ganglion cell axons bundle together to form the optic nerve."}]},{"term":"Optic nerve","def":"Carries neural impulses from the eye to the brain.","hook":"","asks":[{"q":"Which structure carries neural impulses from the eye to the brain?","right":"The optic nerve","wrong":[["The corpus callosum between the hemispheres","That connects the hemispheres."],["The cochlea","That is in the ear."],["The lens","That focuses light."]],"exp":"The optic nerve carries visual signals to the brain."},{"q":"A patient's eyes work, but a tumor presses on the cable between eye and brain. Which structure is affected?","right":"The optic nerve","wrong":[["The corpus callosum, which links the two halves of the brain","That connects the hemispheres."],["The cornea","That is the outer layer."],["The pupil","That is an opening."]],"exp":"The optic nerve carries impulses from the eye to the brain."}]}]},{"name":"In the brain","cards":[{"term":"Primary visual cortex","def":"Where visual input is first processed; located in the occipital lobe.","hook":"","asks":[{"q":"Where in the brain is visual input first processed?","right":"In the primary visual cortex","wrong":[["In the primary auditory cortex of the temporal lobe","That processes sound."],["In the motor cortex","That controls movement."],["In the hippocampus","That stores memories."]],"exp":"The primary visual cortex is in the occipital lobe."},{"q":"Damage to which lobe would affect the primary visual cortex?","right":"The occipital lobe","wrong":[["The temporal lobe, the area that processes all of the sounds we hear","That is hearing."],["The frontal lobe","That is planning and movement."],["The parietal lobe","That is touch."]],"exp":"The primary visual cortex is in the occipital lobe."}]},{"term":"Feature detectors","def":"Neurons in the visual cortex that respond to specific features like shape, angle, or movement.","hook":"","asks":[{"q":"Some neurons in your visual cortex fire only when you see a line at a certain angle. What are they?","right":"Feature detectors","wrong":[["Bipolar cells in the retina at the back of the eye","Those are in the retina, not the cortex."],["Rods","Rods detect dim light."],["Interneurons","Those relay signals in the CNS."]],"exp":"They respond to specific features like shape, angle or movement."},{"q":"A cat's neuron fires only when it sees a bar of light moving left. What kind of neuron is this?","right":"A feature detector","wrong":[["A rod, which picks up dim light in the retina of the eye","Rods are receptors, not cortex neurons."],["A motor neuron","That controls muscles."],["An interneuron in the spinal cord","Not for vision features."]],"exp":"Feature detectors respond to specific features like shape, angle or movement."}]},{"term":"Parallel processing","def":"Processing many aspects of a stimulus (color, motion, form, depth) at the same time, then combining them into one image.","hook":"","asks":[{"q":"When you see a bird fly by, your brain handles its color, motion and shape at the same time, then combines them. What is this?","right":"Parallel processing","wrong":[["Transduction of light energy in the retina","Transduction converts energy; this is combining features."],["Accommodation","That is focusing the lens."],["Closure","That is filling in gaps."]],"exp":"Processing many aspects of a stimulus at once."},{"q":"Why do we see a moving red ball as one object instead of separate color, motion and shape?","right":"The brain processes them together, then combines them","wrong":[["The eye sends just one single feature at a time to the brain","The brain handles them at the same time."],["Only the lens processes color","Not how it works."],["Feature detectors ignore motion","They detect motion."]],"exp":"Parallel processing combines many aspects into one image."}]}]},{"name":"Color","cards":[{"term":"Trichromatic theory","def":"The retina has three types of color receptors — red, green, and blue — that combine to produce any color. Explains color at the retina level.","hook":"Tri = three cones.","asks":[{"q":"Which theory explains color at the level of the retina, using red, green and blue receptors?","right":"Trichromatic theory","wrong":[["Opponent-process theory of paired colors","That explains color in the brain and afterimages."],["Gate control theory","That explains pain."],["Gestalt theory","That explains perceptual grouping."]],"exp":"Tri = three cones."},{"q":"Mixing red, green and blue light can make almost any color on a TV screen. Which theory of color vision does this match?","right":"Trichromatic theory","wrong":[["Opponent-process theory of red/green and yellow/blue pairs","That explains afterimages, not mixing three colors."],["Gate control theory","That is pain."],["Weber's law","That is differences."]],"exp":"Three types of cones combine to produce any color."}]},{"term":"Color blindness","def":"Inability to see colors normally, usually from impaired red or green cones (rarely blue).","hook":"","asks":[{"q":"A boy can't tell red from green on a traffic light. What is the most likely cause?","right":"Impaired red or green cones","wrong":[["Damaged rods that handle vision in dim light","Rods don't handle color."],["A damaged optic chiasm","That would affect visual fields."],["Too much melatonin","That affects sleep."]],"exp":"Color blindness usually comes from impaired red or green cones."},{"q":"Which theory best explains why most color blindness affects red or green?","right":"Trichromatic: those cones are impaired","wrong":[["Gate control: a gate in the spinal cord blocks the color signals","Gate control is about pain."],["Opponent-process: the eye sees too much red","Not the explanation."],["Sound localization","Not related."]],"exp":"Color blindness usually comes from impaired red or green cones."}]},{"term":"Opponent-process theory","def":"Color is processed by opposing pairs — red/green, yellow/blue, white/black — and a cell can signal only one of each pair at a time. Explains color in the brain and afterimages.","hook":"","asks":[{"q":"Which theory says color is processed in the brain by pairs like red/green and yellow/blue?","right":"Opponent-process theory","wrong":[["Trichromatic theory of three types of cones","That explains the retina, not opposing pairs."],["Gate control theory","That explains pain."],["Retinal disparity","That is a depth cue."]],"exp":"A cell can signal only one color of each pair at a time."},{"q":"Which theory explains why staring at a yellow square leaves a blue afterimage?","right":"Opponent-process theory","wrong":[["Trichromatic theory of red, green and blue cones in the retina","That doesn't explain afterimages."],["Gestalt theory","That is grouping."],["Weber's law","That is differences."]],"exp":"Opposing pairs: yellow/blue, red/green, white/black."}]},{"term":"Afterimage","def":"A visual image that persists after the stimulus is removed — e.g., stare at green, then see red on a white wall.","hook":"","asks":[{"q":"You stare at a green square for a minute, then look at a white wall and see a red square. What is this?","right":"An afterimage","wrong":[["Synesthesia, one sense triggering another","Only vision is involved."],["Closure","That is filling in gaps."],["A phantom limb","That is a feeling in an amputated limb."]],"exp":"Opponent-process theory explains afterimages."},{"q":"You stare at a red flag, then look at a white wall. What color is the afterimage?","right":"Green","wrong":[["Red, because the original image stays on the retina for a while","Afterimages show the opposing color."],["Yellow","Red's opposite is green."],["Blue","Blue's opposite is yellow."]],"exp":"Opponent pairs: red/green."}]},{"term":"Which color theory is right?","def":"Both. Trichromatic explains how the retina detects color; opponent-process explains how the brain processes it.","hook":"","asks":[{"q":"A classmate says the trichromatic and opponent-process theories can't both be right. What is the best reply?","right":"Both are right, at different stages","wrong":[["Only trichromatic theory, since it came first","Both theories explain part of color vision."],["Only opponent-process theory","Trichromatic still explains the retina."],["Neither; color is processed in the ear","Color is visual."]],"exp":"Trichromatic explains the retina; opponent-process explains the brain."},{"q":"Where does each color theory apply?","right":"Trichromatic in the retina; opponent-process in the brain","wrong":[["Opponent-process in the retina, and trichromatic in the brain itself","It's the other way around."],["Both only in the ear","They're about vision."],["Neither is accepted","Both are right."]],"exp":"Both are right, at different stages."}]}]},{"name":"Gestalt","cards":[{"term":"Gestalt","def":"An organized whole. Gestalt psychologists said we combine pieces of information into meaningful wholes (you see a face, not a set of lines).","hook":"","asks":[{"q":"You look at a few curved lines and instantly see a smiley face. What idea does this show?","right":"Gestalt: seeing an organized whole","wrong":[["Feature detection of single lines and angles","You see the whole, not separate features."],["Transduction","That converts energy into neural signals."],["Retinal disparity","That is a depth cue."]],"exp":"We combine pieces into meaningful wholes."},{"q":"Which statement best captures the Gestalt idea?","right":"The whole is seen before the parts","wrong":[["We notice each separate line before ever seeing the overall shape","Gestalt says we see wholes."],["Color comes from three cones","That is trichromatic."],["Depth needs two eyes","That is binocular cues."]],"exp":"We combine pieces into meaningful wholes."}]},{"term":"Proximity","def":"Grouping objects that are close together (how you see separate words on a page).","hook":"","asks":[{"q":"You see \"XX XX XX\" as three pairs rather than six X's. Which Gestalt principle is at work?","right":"Proximity","wrong":[["Similarity, grouping things that look alike","All the X's look alike; spacing is what groups them."],["Closure","That is filling in gaps."],["Figure-ground","That is separating objects from background."]],"exp":"We group objects that are close together."},{"q":"On a page, letters close together look like words, separated by spaces. Which principle explains this?","right":"Proximity","wrong":[["Closure, filling in the gaps to see a complete shape","No gaps are being filled."],["Similarity","The letters look alike either way."],["Figure-ground","Not the grouping principle here."]],"exp":"We group objects that are close together."}]},{"term":"Similarity","def":"Grouping objects that look alike.","hook":"","asks":[{"q":"In a grid of dots, you see rows because every other row is red. Which principle is this?","right":"Similarity","wrong":[["Proximity, grouping things that are close","The spacing is even; color does the grouping."],["Closure","That is filling in gaps."],["Interposition","That is a depth cue."]],"exp":"We group objects that look alike."},{"q":"A crowd at a game looks like two groups because one side wears blue and the other wears red. Which principle explains this?","right":"Similarity","wrong":[["Proximity, grouping things together because they are close","Grouping here is by color."],["Closure","Not filling gaps."],["Interposition","That is a depth cue."]],"exp":"We group objects that look alike."}]},{"term":"Closure","def":"Filling in gaps to see a complete, closed shape.","hook":"","asks":[{"q":"A circle drawn with small gaps still looks like a complete circle to you. Which principle explains this?","right":"Closure","wrong":[["Figure-ground, separating object from background","That is about objects standing out."],["Proximity","That is about nearness."],["Linear perspective","That is a depth cue."]],"exp":"We fill in gaps to see a complete shape."},{"q":"A logo made of broken lines still reads as a complete circle. Which principle explains this?","right":"Closure","wrong":[["Similarity, grouping together the things that look alike","The key is filling the gaps."],["Proximity","Not about nearness."],["Relative size","That is a depth cue."]],"exp":"We fill in gaps to see a complete shape."}]},{"term":"Figure-ground","def":"Organizing what you see into objects (figures) that stand out from their surroundings (ground).","hook":"","asks":[{"q":"In the famous vase/faces picture, you can see either a vase or two faces depending on what stands out. Which principle?","right":"Figure-ground","wrong":[["Closure, filling in gaps in a shape","There are no gaps to fill."],["Similarity","That is grouping things that look alike."],["Relative size","That is a depth cue."]],"exp":"Organizing a scene into a figure and its ground."},{"q":"Reading black text on a white page, you see the letters as objects and the page as background. Which principle is this?","right":"Figure-ground","wrong":[["Closure, filling in the gaps between broken lines","Not filling gaps."],["Similarity","Not grouping alike items."],["Linear perspective","That is depth."]],"exp":"Objects (figures) stand out from their surroundings (ground)."}]}]},{"name":"Depth","cards":[{"term":"Depth perception","def":"The ability to judge how far away an object is.","hook":"","asks":[{"q":"A baby refuses to crawl onto glass covering a drop-off. Which ability is the baby using?","right":"Depth perception","wrong":[["Sensory interaction between taste and smell","That is one sense affecting another."],["Accommodation","That is focusing."],["Kinesthesis","That is sensing body position."]],"exp":"Judging how far away things are."},{"q":"Which everyday task depends most on depth perception?","right":"Judging when to step off a curb","wrong":[["Telling apart the colors on the red and green traffic lights","That is color vision."],["Hearing a siren","That is hearing."],["Smelling smoke","That is smell."]],"exp":"Judging how far away an object is."}]},{"term":"Binocular cues","def":"Depth cues that need both eyes.","hook":"Bi = two eyes.","asks":[{"q":"A person who loses an eye has trouble judging the distance of a ball tossed to them. Which cues did they lose?","right":"Binocular cues","wrong":[["Monocular cues, which work with one eye","Monocular cues still work with one eye."],["Auditory cues","Hearing isn't the issue."],["Gestalt cues","Those are grouping principles."]],"exp":"Binocular cues need both eyes."},{"q":"Which depth cue is binocular?","right":"Retinal disparity","wrong":[["Linear perspective, like train tracks meeting in the distance","That is monocular."],["Interposition","That is monocular."],["Relative size","That is monocular."]],"exp":"Retinal disparity needs both eyes."}]},{"term":"Retinal disparity","def":"A binocular cue: because your eyes are about 2.5 inches apart, each retina gets a slightly different image; the bigger the difference, the closer the object.","hook":"","asks":[{"q":"Hold a finger close to your face and close each eye in turn: it seems to jump. What depth cue does this show?","right":"Retinal disparity","wrong":[["Linear perspective, lines meeting in the distance","That is a monocular cue."],["Relative clarity","That is about haziness."],["Interposition","That is about one object blocking another."]],"exp":"Each eye gets a slightly different image; a bigger difference means closer."},{"q":"Which object gives you the biggest retinal disparity?","right":"A pencil a few inches from your nose","wrong":[["A mountain far away on the horizon, many miles in the distance","Far objects give little disparity."],["A plane in the sky","Far away, little disparity."],["The moon","Far away, little disparity."]],"exp":"The bigger the difference between the two images, the closer the object."}]},{"term":"Monocular cues","def":"Depth cues that work with just one eye; used for farther distances.","hook":"Mono = one eye.","asks":[{"q":"Painters show depth on a flat canvas using cues that work with just one eye. What are these called?","right":"Monocular cues","wrong":[["Binocular cues, which need both eyes","A flat painting can't use both-eye cues."],["Feature detectors","Those are neurons."],["Opponent processes","Those are about color."]],"exp":"Mono = one eye."},{"q":"Which distances do monocular cues mostly help with?","right":"Farther distances","wrong":[["Only things a few inches from your face, like a book you are reading","Monocular cues are used for farther distances."],["Only sounds","They're visual."],["Only colors","They're about depth."]],"exp":"Monocular cues work with one eye, mostly for farther distances."}]},{"term":"Relative size","def":"Monocular cue: if two objects are assumed to be the same size, the one that looks smaller seems farther away.","hook":"","asks":[{"q":"Two people who are really the same height appear in a photo, and one looks much smaller. Which cue makes that one seem farther away?","right":"Relative size","wrong":[["Interposition, where one object blocks another","Nothing is blocked here."],["Relative clarity","That is about haze."],["Retinal disparity","That is a binocular cue."]],"exp":"If two objects are assumed the same size, the smaller-looking one seems farther."},{"q":"Two identical cars are in a photo, and one is tiny. Why does it look farther away?","right":"We assume they're the same size","wrong":[["The smaller one is blocked by the bigger one in front of it","That would be interposition."],["It looks hazier","That would be relative clarity."],["Parallel lines converge","That would be linear perspective."]],"exp":"If objects are assumed to be the same size, the smaller-looking one seems farther."}]},{"term":"Interposition","def":"Monocular cue: an object that blocks part of another is seen as closer.","hook":"","asks":[{"q":"A tree partly blocks your view of a house. Which cue tells you the tree is closer?","right":"Interposition","wrong":[["Linear perspective, parallel lines that converge","No converging lines are involved."],["Relative size","That compares sizes."],["Retinal disparity","That is binocular."]],"exp":"An object blocking another is seen as closer."},{"q":"In a painting, a person stands partly in front of a tree, hiding some of its trunk. Which cue tells you she's closer?","right":"Interposition","wrong":[["Relative clarity, since the closer object is sharper","The key is that she blocks the tree."],["Relative size","Not about size."],["Retinal disparity","A painting can't use it."]],"exp":"An object that blocks another is seen as closer."}]},{"term":"Linear perspective","def":"Monocular cue: parallel lines seem to converge in the distance (train tracks).","hook":"","asks":[{"q":"Train tracks seem to meet in the distance. Which depth cue is this?","right":"Linear perspective","wrong":[["Relative clarity, where hazy things look far away","That is about haze, not converging lines."],["Interposition","That is about blocking."],["Closure","That is a Gestalt principle."]],"exp":"Parallel lines seem to converge in the distance."},{"q":"An artist draws road edges that come together at a point near the horizon. Which cue is this?","right":"Linear perspective","wrong":[["Interposition, where one object is drawn blocking another","Nothing is blocked."],["Relative clarity","Not about haze."],["Proximity","That is grouping."]],"exp":"Parallel lines seem to converge in the distance."}]},{"term":"Relative clarity","def":"Monocular cue: sharp, clear objects seem closer; hazy ones seem farther away.","hook":"","asks":[{"q":"On a foggy day, the hazy mountains seem farther away than they really are. Which cue explains this?","right":"Relative clarity","wrong":[["Retinal disparity between the two eyes' images","That is a binocular cue."],["Relative size","That compares sizes."],["Proximity","That is a Gestalt grouping principle."]],"exp":"Sharp objects seem closer; hazy ones seem farther."},{"q":"In a landscape painting, the mountains in back are drawn faint and blurry. Which cue makes them look far?","right":"Relative clarity","wrong":[["Linear perspective, lines that come together in the distance","Not converging lines."],["Interposition","Not blocking."],["Retinal disparity","Not possible in a painting."]],"exp":"Hazy objects seem farther away."}]}]}],"intro":["The path light takes, rods and cones, color theories, Gestalt grouping, and depth cues."]},{"id":6,"name":"Hearing, Smell, Taste, Touch & more","optional":false,"sections":[{"name":"Hearing","cards":[{"term":"Audition","def":"The sense of hearing.","hook":"","asks":[{"q":"Which sense is studied when researchers test how well people hear different pitches?","right":"Audition","wrong":[["Olfaction, the sense of smell","Olfaction is smell."],["Gustation","That is taste."],["Kinesthesis","That is body position."]],"exp":"Audition is hearing."},{"q":"Which structures are part of audition?","right":"Eardrum, ossicles and cochlea","wrong":[["Rods, cones and the ganglion cells at the back of the eye","Those are vision."],["Taste buds","Those are taste."],["Semicircular canals only","Those are balance."]],"exp":"Audition is hearing."}]},{"term":"Amplitude","def":"The height of a sound wave; determines loudness. High amplitude = loud.","hook":"Amplitude = Amplifier (volume).","asks":[{"q":"You turn up the volume on your speaker. Which property of the sound wave increases?","right":"Amplitude","wrong":[["Frequency, which sets how high the pitch is","Frequency changes pitch, not volume."],["Wavelength only","Volume is amplitude."],["Transduction","That is converting energy."]],"exp":"Higher amplitude = louder."},{"q":"A whisper and a shout of the same note differ mainly in which property?","right":"Amplitude","wrong":[["Frequency, the property of a sound that sets its pitch","Same note means same pitch."],["Color","Sound has no color."],["Transduction","That is a process."]],"exp":"Amplitude determines loudness."}]},{"term":"Frequency","def":"Number of wavelengths passing a point in a given time; determines pitch. High frequency = high pitch; low frequency = bass.","hook":"","asks":[{"q":"A singer goes from a low note to a high note. Which property of the sound wave increased?","right":"Frequency","wrong":[["Amplitude, the height of the sound wave","Amplitude is loudness."],["Sound localization","That is telling where a sound comes from."],["Retinal disparity","That is visual."]],"exp":"Higher frequency = higher pitch."},{"q":"A bass guitar and a whistle are equally loud. What makes the whistle sound higher?","right":"Higher frequency","wrong":[["Higher amplitude, the height of each of the sound waves","That would be louder, not higher."],["Lower frequency","That would be lower pitch."],["More transduction","Not the answer."]],"exp":"High frequency = high pitch."}]},{"term":"Sound localization","def":"Telling where a sound comes from: the nearer ear hears it slightly louder and slightly sooner.","hook":"","asks":[{"q":"A car honks to your right, and you instantly know which side it's on. How?","right":"Your right ear hears it slightly louder and sooner","wrong":[["Your left ear hears it louder because sound crosses over","The nearer ear hears it louder and sooner."],["Your eyes tell your ears where to listen","Localization comes from the ears."],["Only the cochlea in the right ear detects it","Both ears hear it; the difference tells direction."]],"exp":"The nearer ear hears it slightly louder and slightly sooner."},{"q":"A sound comes from directly in front of you. Why is it harder to place than one from the side?","right":"Both ears hear it the same","wrong":[["Only one of your ears can hear sounds that come from in front","Both ears hear it."],["Sounds in front are always quieter","Not the reason."],["The cochlea is turned off","Not true."]],"exp":"Localization relies on one ear hearing a sound slightly louder and sooner."}]},{"term":"Eardrum","def":"Membrane between the outer and middle ear that vibrates when sound waves hit it. (Standard ear part; check the ear diagram slide.)","hook":"","asks":[{"q":"Which membrane between the outer and middle ear vibrates when sound waves hit it?","right":"The eardrum","wrong":[["The cochlea, the snail-shaped inner ear tube","The cochlea is in the inner ear."],["The ossicles","Those are tiny bones."],["The retina","That is in the eye."]],"exp":"The eardrum vibrates with sound."},{"q":"A loud blast tears a membrane between the outer and middle ear. Which type of hearing loss could this cause?","right":"Conduction hearing loss","wrong":[["Sensorineural hearing loss from damaged hair cells","The eardrum is part of conduction."],["Synesthesia","Not hearing loss."],["Prosopagnosia","Not hearing loss."]],"exp":"The eardrum is part of the sound-conducting path."}]},{"term":"Ossicles","def":"Three tiny bones in the middle ear (hammer, anvil, stirrup) that pass vibrations to the cochlea. (Check the ear diagram slide.)","hook":"","asks":[{"q":"Which three tiny bones of the middle ear pass vibrations from the eardrum to the cochlea?","right":"The ossicles","wrong":[["The semicircular canals of the vestibular sense","Those sense balance."],["The vesicles","Those store neurotransmitters."],["The ganglion cells","Those form the optic nerve."]],"exp":"Hammer, anvil and stirrup."},{"q":"If the middle-ear bones fuse and can't move, which type of hearing loss results?","right":"Conduction hearing loss","wrong":[["Sensorineural hearing loss caused by damage to the auditory nerve","The ossicles conduct sound."],["Phantom limb","Not related."],["Narcolepsy","Not related."]],"exp":"Damage to the ossicles is conduction hearing loss."}]},{"term":"Cochlea","def":"Snail-shaped, fluid-filled tube in the inner ear whose hair cells turn vibrations into neural signals. (Check the ear diagram slide.)","hook":"","asks":[{"q":"In which fluid-filled, snail-shaped tube do hair cells turn vibrations into neural signals?","right":"The cochlea","wrong":[["The eardrum between the outer and middle ear","The eardrum vibrates; it doesn't contain hair cells."],["The ossicles","Those are bones."],["The pupil","That is in the eye."]],"exp":"Transduction for hearing happens in the cochlea."},{"q":"Which part of the ear does a cochlear implant connect to?","right":"The cochlea","wrong":[["The ossicles, the three tiny bones in the middle ear","The implant is wired into the cochlea."],["The eardrum","Not where it's wired."],["The semicircular canals","Those are balance."]],"exp":"A cochlear implant is wired into the cochlea."}]},{"term":"Conduction hearing loss","def":"Damage to the parts that conduct sound through the outer and middle ear (eardrum, ossicles, auditory canal). Can be fixed with surgery.","hook":"Conduction = Correctable.","asks":[{"q":"A child's hearing loss comes from damaged middle-ear bones and can be fixed with surgery. What type is it?","right":"Conduction hearing loss","wrong":[["Sensorineural hearing loss from damaged hair cells","That type can't be reversed."],["Synesthesia","That is one sense triggering another."],["Prosopagnosia","That is face blindness."]],"exp":"Conduction = correctable (outer and middle ear)."},{"q":"Which type of hearing loss can usually be fixed with surgery?","right":"Conduction hearing loss","wrong":[["Sensorineural hearing loss from damage to the inner ear's hair cells","That can't be reversed."],["All hearing loss","Not sensorineural."],["None","Conduction can be fixed."]],"exp":"Conduction = correctable."}]},{"term":"Sensorineural hearing loss","def":"Nerve deafness: damage to the cochlea's hair cells or the auditory nerve (inner ear). Cannot be reversed.","hook":"","asks":[{"q":"Years of loud concerts destroy hair cells in a musician's cochlea. What type of hearing loss results?","right":"Sensorineural hearing loss","wrong":[["Conduction hearing loss that surgery can repair","Hair-cell damage isn't conduction loss and can't be reversed."],["Tinnitus only","That isn't on this card."],["Synesthesia","That is one sense triggering another."]],"exp":"Nerve deafness: damage to the hair cells or auditory nerve."},{"q":"Why can't sensorineural hearing loss be fixed by repairing the eardrum?","right":"The damage is in the inner ear","wrong":[["The damage is only in the outer ear canal, which surgery cannot reach","It's inner ear damage."],["The eardrum doesn't exist","It does."],["It's caused by the lens","Not related."]],"exp":"Damage to the cochlea's hair cells or the auditory nerve."}]},{"term":"Cochlear implant","def":"Device wired into the cochlea that turns sounds into electrical signals sent up the auditory nerve. Used for sensorineural hearing loss.","hook":"","asks":[{"q":"Which device can help a person with sensorineural hearing loss by sending electrical signals up the auditory nerve?","right":"A cochlear implant","wrong":[["A hearing aid that simply makes sounds louder for the ear","A cochlear implant bypasses damaged hair cells."],["A PET scan","That is a brain scan."],["An SSRI","That is an antidepressant."]],"exp":"It turns sounds into electrical signals sent up the auditory nerve."},{"q":"Which patient is the best candidate for a cochlear implant?","right":"One with damaged cochlear hair cells","wrong":[["One with a torn eardrum that surgery can easily repair","That is conduction loss."],["One with color blindness","Not related."],["One with insomnia","Not related."]],"exp":"Cochlear implants are used for sensorineural hearing loss."}]}]},{"name":"Body position","cards":[{"term":"Vestibular sense","def":"Senses the head's position and movement (balance) using fluid in the semicircular canals and vestibular sacs. Signals go to the cerebellum. The fluid keeps moving after you stop, which causes dizziness.","hook":"Vestibular = balance in the ear.","asks":[{"q":"After spinning on a playground ride, you stop but still feel dizzy. Which sense explains this?","right":"The vestibular sense","wrong":[["Kinesthesis, the sense of body part position","Kinesthesis senses body parts, not head balance."],["Audition","That is hearing."],["Olfaction","That is smell."]],"exp":"Fluid in the semicircular canals keeps moving after you stop."},{"q":"Where do vestibular signals go in the brain?","right":"The cerebellum","wrong":[["The occipital lobe at the back, where visual signals are processed","That is vision."],["Broca's area","That is speech."],["The amygdala","That is fear."]],"exp":"Vestibular signals go to the cerebellum."}]},{"term":"Kinesthesis","def":"Senses the position and movement of individual body parts using sensors in muscles, tendons, and joints; feeds the cerebellum.","hook":"Kinesthesis = kinetic body parts.","asks":[{"q":"With your eyes closed, you can still touch your nose with your finger. Which sense makes this possible?","right":"Kinesthesis","wrong":[["The vestibular sense of balance in the inner ear","That senses head position and balance."],["Gustation","That is taste."],["Audition","That is hearing."]],"exp":"Sensors in muscles, tendons and joints track body parts."},{"q":"Where are the sensors for kinesthesis?","right":"In muscles, tendons and joints","wrong":[["In the semicircular canals of the inner ear, near the cochlea","That is the vestibular sense."],["In the retina","That is vision."],["In the taste buds","That is taste."]],"exp":"Kinesthesis uses sensors in muscles, tendons and joints."}]}]},{"name":"Smell & taste","cards":[{"term":"Olfaction","def":"The sense of smell. Receptors at the top of the nasal cavity detect inhaled particles. Smell skips the thalamus and goes to areas connected to the limbic system.","hook":"","asks":[{"q":"The smell of a certain perfume instantly brings back an emotional memory. Why might smell do this more than other senses?","right":"Smell skips the thalamus for limbic areas","wrong":[["Smell is processed only in the occipital lobe with vision","Smell isn't processed with vision."],["Smell receptors are in the tongue","They are in the nasal cavity."],["Smell travels through the optic nerve","It doesn't."]],"exp":"Olfaction goes to areas connected to the limbic system."},{"q":"Which brain structure does smell skip, unlike every other sense?","right":"The thalamus","wrong":[["The cerebellum, the little brain at the back that controls balance","Smell skips the thalamus."],["The cortex","Smell reaches the cortex."],["The spinal cord","Not the point."]],"exp":"Smell skips the thalamus and goes to limbic-connected areas."}]},{"term":"Gustation","def":"The sense of taste. The tongue has about 200 taste buds, each with 50–100 receptors; taste buds regenerate about every two weeks.","hook":"","asks":[{"q":"You burn your tongue on hot soup, but a couple of weeks later your taste is back to normal. Why?","right":"Taste buds regenerate about every two weeks","wrong":[["Your olfactory receptors take over the work of tasting","Smell helps taste, but your taste buds recover."],["Taste is controlled by the cochlea","The cochlea is for hearing."],["Burns never affect taste","They can, temporarily."]],"exp":"Taste buds regenerate about every two weeks."},{"q":"About how many taste buds does the tongue have, according to your card?","right":"About 200","wrong":[["About 2 million, spread across the tongue, cheeks and throat","Your card says about 200."],["About 5","Too few."],["Exactly 1,000","Not on your card."]],"exp":"About 200 taste buds, each with 50–100 receptors."}]},{"term":"Five basic tastes","def":"Sweet, sour, salty, bitter, and umami (savory/protein).","hook":"","asks":[{"q":"A savory broth tastes rich and meaty. Which basic taste is this?","right":"Umami","wrong":[["Sour","Sour is acidic, like lemons."],["Bitter","Bitter is like coffee."],["Sweet","Sweet is sugary."]],"exp":"Sweet, sour, salty, bitter and umami (savory)."},{"q":"Which list contains only basic tastes?","right":"Sweet, sour, salty, bitter, umami","wrong":[["Sweet, sour, spicy, cold and minty, the flavors of candy","Spicy, cold and minty aren't basic tastes."],["Red, green, blue","Those are colors."],["Pressure, warmth, cold, pain","Those are touch."]],"exp":"Five basic tastes."}]},{"term":"Supertasters","def":"People with more taste buds than average, who experience tastes and pain more intensely (e.g., jalapeños burn more).","hook":"","asks":[{"q":"Lucas finds jalapeños unbearably hot while his friends barely notice. What might explain this?","right":"He may be a supertaster","wrong":[["He has sensorineural hearing loss affecting his taste","Hearing loss doesn't affect taste."],["He has fewer taste buds than average","Fewer taste buds would weaken taste."],["He has prosopagnosia","That is face blindness."]],"exp":"Supertasters have more taste buds and feel taste and pain more intensely."},{"q":"Why might a supertaster dislike very bitter coffee more than friends do?","right":"More taste buds make tastes more intense","wrong":[["Fewer taste buds make every flavor taste weaker and more bitter","Supertasters have more taste buds."],["Their cochlea is damaged","Not related."],["They lack smell","Not on your card."]],"exp":"Supertasters experience tastes more intensely."}]},{"term":"Sensory interaction","def":"One sense influencing another — like smell affecting taste (holding your nose to take bad medicine).","hook":"","asks":[{"q":"You hold your nose while taking bad-tasting medicine, and it tastes less awful. What does this show?","right":"Sensory interaction","wrong":[["Synesthesia, where senses trigger one another","Synesthesia is one sense triggering a different experience, like seeing colors."],["Dark adaptation","That is a visual adjustment."],["Gate control","That is about pain."]],"exp":"One sense (smell) influences another (taste)."},{"q":"Food tastes bland when you have a stuffy nose. What does this show?","right":"Sensory interaction","wrong":[["Sensorineural hearing loss affecting how food tastes","Not hearing."],["Synesthesia","Not one sense triggering another experience."],["Gate control","That is pain."]],"exp":"Smell affects taste."}]}]},{"name":"Touch & pain","cards":[{"term":"Touch","def":"A mix of four skin senses: pressure, warmth, cold, and pain.","hook":"","asks":[{"q":"Which four skin senses combine to make up the sense of touch?","right":"Pressure, warmth, cold, pain","wrong":[["Sweet, sour, salty, bitter","Those are tastes."],["Proximity, similarity, closure, figure-ground","Those are Gestalt principles."],["Rods, cones, bipolar and ganglion cells","Those are in the retina."]],"exp":"Touch = pressure, warmth, cold and pain."},{"q":"Feeling a hot mug, a cold ice cube and a pinch all use which sense?","right":"Touch","wrong":[["Kinesthesis, the sense of where your body parts are positioned","That tracks body position."],["Gustation","That is taste."],["Vestibular sense","That is balance."]],"exp":"Touch includes pressure, warmth, cold and pain."}]},{"term":"Gate control theory","def":"The spinal cord has a neurological \"gate\" that either blocks pain signals or lets them through to the brain. Distraction can close the gate.","hook":"","asks":[{"q":"A child bumps her knee, then rubs it and is distracted by a toy, and the pain fades. Which theory explains this?","right":"Gate control theory","wrong":[["Opponent-process theory of paired colors","That explains color vision."],["Trichromatic theory","That explains color at the retina."],["Gestalt theory","That explains grouping."]],"exp":"Distraction can close the spinal cord's pain gate."},{"q":"Why might a soldier not notice a wound until after the battle, according to gate control theory?","right":"Distraction can close the pain gate","wrong":[["His cochlea was too busy processing the loud sounds of the battle","Not related."],["Pain never reaches the brain","It can when the gate opens."],["He's a supertaster","Not related."]],"exp":"The spinal cord's gate can block pain signals; distraction can close it."}]},{"term":"Phantom limb","def":"Feeling that an amputated limb is still there, because the sensory cortex area for that limb still has activity.","hook":"","asks":[{"q":"Months after losing his leg, a veteran still feels it itch. What explains this?","right":"Phantom limb sensation","wrong":[["Synesthesia, one sense triggering another sense","Only one sense is involved."],["Conduction loss","That is a hearing problem."],["Kinesthesis","There is no limb to sense."]],"exp":"The sensory cortex area for the limb is still active."},{"q":"Which brain area explains phantom limb sensations?","right":"The sensory cortex area for that limb","wrong":[["The motor cortex area that is in charge of the opposite arm","The sensory cortex explains the feeling."],["The pineal gland","Not related."],["The cochlea","Not related."]],"exp":"The sensory cortex area for that limb still has activity."}]}]},{"name":"Unusual perception","cards":[{"term":"Synesthesia","def":"When one sense triggers another — like hearing music or seeing a number and experiencing a color.","hook":"","asks":[{"q":"Every time Mia hears a trumpet, she sees the color orange. What is this?","right":"Synesthesia","wrong":[["Sensory interaction like smell changing taste","That is one sense changing another, not triggering a new experience."],["An afterimage","That follows staring at a color."],["Prosopagnosia","That is face blindness."]],"exp":"One sense triggers another."},{"q":"Which experience is synesthesia rather than sensory interaction?","right":"Seeing blue whenever you see the number 7","wrong":[["Food tasting bland because a cold has blocked up your nose","That is sensory interaction."],["Hearing your name in a crowd","That is the cocktail party effect."],["Feeling dizzy after spinning","That is vestibular."]],"exp":"One sense triggers another experience."}]},{"term":"Prosopagnosia","def":"Face blindness: the inability to recognize faces.","hook":"","asks":[{"q":"A man can describe a face in detail but can't recognize his own brother. What condition is this?","right":"Prosopagnosia","wrong":[["Wernicke's aphasia, trouble understanding language","That is a language problem."],["Synesthesia","That is mixed senses."],["Narcolepsy","That is falling asleep suddenly."]],"exp":"Face blindness."},{"q":"A woman recognizes her son only by his voice and red jacket. Which condition might she have?","right":"Prosopagnosia","wrong":[["Color blindness that keeps her from seeing faces in color","She can see; she can't recognize faces."],["Synesthesia","Not related."],["Narcolepsy","Not related."]],"exp":"Face blindness."}]}]}],"intro":["Sound waves, hearing loss, balance, smell, taste, pain, and unusual perception."]},{"id":7,"name":"Sleep, Consciousness & Drugs","optional":false,"sections":[{"name":"Sleep & consciousness","cards":[{"term":"Sleep","def":"An altered state of consciousness. It is not a period of dormancy where your body and brain shut off: even when you are sound asleep, your brain is still active.","hook":"","asks":[{"q":"A classmate says your brain \"turns off\" when you sleep. What is the best correction?","right":"Sleep is an altered state; the brain stays active","wrong":[["The brain does turn off completely, but only in deep sleep","Even in deep sleep the brain is active."],["Only the body sleeps; the mind is fully awake","Sleep is an altered state of consciousness."],["Sleep is the same as being unconscious from a coma","A coma is different from sleep."]],"exp":"Even sound asleep, your brain is still active."},{"q":"Which finding best supports the idea that sleep is an altered state, not a shutdown?","right":"Brain activity continues during sleep","wrong":[["The heart completely stops beating for short periods during sleep","Not true."],["No one dreams","Everyone dreams."],["The brain turns off in Stage 3","The brain stays active."]],"exp":"Even sound asleep, your brain is still active."}]},{"term":"Dreaming","def":"Everyone dreams every night.","hook":"","asks":[{"q":"A friend insists she never dreams. What does your class say?","right":"Everyone dreams every night","wrong":[["Only people who sleep more than 8 hours ever dream","Everyone dreams."],["Dreaming only happens during naps","Dreaming happens every night."],["Adults stop dreaming after age 20","Everyone dreams every night."]],"exp":"She dreams; she just doesn't remember."},{"q":"Which claim agrees with your slides about dreaming?","right":"Everyone dreams every night","wrong":[["Only people with sleep disorders ever dream during the night","Everyone dreams."],["Dreams happen only in naps","Every night."],["Adults stop dreaming","Everyone dreams."]],"exp":"Everyone dreams every night."}]},{"term":"Sleep stages","def":"Sleep has four stages: NREM 1 (Stage 1), NREM 2 (Stage 2), NREM 3 (Stage 3), and REM sleep.","hook":"Three NREM stages, then REM.","asks":[{"q":"Which list shows the four stages of sleep?","right":"NREM 1, NREM 2, NREM 3, REM","wrong":[["Alpha, beta, gamma and delta stages of waking life","Those are not the stages on your slides."],["Light, medium, heavy, deep","Those aren't the stage names."],["REM 1, REM 2, REM 3, NREM","There are three NREM stages and one REM."]],"exp":"Three NREM stages, then REM."},{"q":"How many sleep stages are NREM?","right":"Three","wrong":[["Four, because every one of the sleep stages is a type of NREM","REM is the fourth, not NREM."],["One","There are three."],["Five","There are four stages total."]],"exp":"Three NREM stages, then REM."}]}]},{"name":"Circadian rhythm","cards":[{"term":"Circadian rhythm","def":"The biological clock: regular bodily rhythms that occur on a 24-hour cycle. The body is roughly synchronized with the 24-hour cycle of day and night.","hook":"","asks":[{"q":"After flying across the world, a traveler feels wide awake at 3 a.m. What has been thrown off?","right":"Her circadian rhythm","wrong":[["Her refractory period between neural firings","That is about neurons, not the 24-hour cycle."],["Her vestibular sense","That is balance."],["Her accommodation","That is focusing the eye."]],"exp":"The 24-hour biological clock."},{"q":"About how long is the cycle of the circadian rhythm?","right":"24 hours","wrong":[["About 90 minutes, the length of a single cycle of sleep stages","Your card says 24 hours."],["One week","Too long."],["One year","Too long."]],"exp":"The biological clock runs on a 24-hour cycle."}]},{"term":"Body temperature cycle","def":"Body temperature increases throughout the day, dips in the afternoon, and is lowest at night.","hook":"","asks":[{"q":"When is body temperature usually lowest?","right":"At night","wrong":[["In the late morning","It rises through the day."],["Right after lunch, when it peaks for the day","It dips in the afternoon; it's lowest at night."],["In the early evening","It is still higher than at night."]],"exp":"Temperature rises through the day, dips in the afternoon and is lowest at night."},{"q":"A student feels sluggish in mid-afternoon. Which part of the body temperature cycle might explain it?","right":"Temperature dips in the afternoon","wrong":[["Temperature is at its very highest point of the day in the afternoon","It dips in the afternoon."],["Temperature is lowest at noon","It's lowest at night."],["Temperature never changes","It changes through the day."]],"exp":"Temperature rises through the day, dips in the afternoon, and is lowest at night."}]},{"term":"Teens and young adults","def":"Most are evening-energized, with performance improving across the day.","hook":"","asks":[{"q":"A school moves the hardest test from 8 a.m. to 2 p.m. Why might this help most teens?","right":"Teens tend to do better later in the day","wrong":[["Teens are most alert early in the morning, before school","That describes most older adults."],["Teens' body temperature is highest at night","It's lowest at night."],["Teens don't have circadian rhythms","Everyone does."]],"exp":"Most teens and young adults are evening-energized."},{"q":"A teen does his best thinking at 9 p.m. Which pattern does this fit?","right":"Evening-energized teens","wrong":[["Morning-person older adults whose energy fades through the day","That pattern is older adults."],["Insomnia","Not a disorder here."],["Narcolepsy","Not a disorder here."]],"exp":"Most teens and young adults improve across the day."}]},{"term":"Older adults","def":"Most are morning people, with energy declining as the day goes on.","hook":"","asks":[{"q":"Grandpa is sharpest at 7 a.m. and fading by evening. What does this pattern match?","right":"Older adults tend to be morning people","wrong":[["Teens and young adults, who are evening-energized","Teens improve across the day."],["Narcolepsy","That is falling asleep suddenly."],["Insomnia","That is being unable to sleep."]],"exp":"Most older adults' energy declines as the day goes on."},{"q":"Grandma schedules her harder tasks for the morning. Which pattern explains why?","right":"Most older adults are morning people","wrong":[["Most older adults have the most energy late in the evening hours","Their energy declines through the day."],["Older adults don't have circadian rhythms","They do."],["Older adults don't sleep","Not true."]],"exp":"Older adults: energy declines as the day goes on."}]},{"term":"Artificial light","def":"Light from cell phones, lamps, and other devices can interfere with circadian rhythms.","hook":"","asks":[{"q":"Ana scrolls her phone in bed for an hour and then can't fall asleep. What might be interfering?","right":"Light from her screen","wrong":[["Too much leptin from a big dinner earlier that night","Leptin signals fullness; the screen light is the issue."],["Her vestibular sense","That is balance."],["Her parasympathetic system","That calms the body."]],"exp":"Artificial light can interfere with circadian rhythms."},{"q":"A sleep coach tells a client to put the phone away an hour before bed. Which card explains this advice?","right":"Artificial light can disrupt circadian rhythms","wrong":[["Artificial light boosts the body's melatonin and makes people sleepy","It interferes with the rhythm."],["Phones cause narcolepsy","Not on your card."],["Light improves REM","Not on your card."]],"exp":"Light from phones and lamps can interfere with circadian rhythms."}]}]},{"name":"Effects of sleep loss","cards":[{"term":"Sleep loss: brain","def":"Diminished attentional focus and memory consolidation, and increased risk of depression.","hook":"","asks":[{"q":"A student pulls all-nighters before tests and remembers less of what she studied. Which effect of sleep loss is this?","right":"Weaker memory consolidation","wrong":[["A lower risk of developing depression later in life","Sleep loss raises the risk of depression."],["Stronger attention","Attention weakens."],["More immune cells","Immune cell production drops."]],"exp":"Sleep loss reduces focus and memory consolidation and raises the risk of depression."},{"q":"Which mental-health risk rises with sleep loss, according to your slides?","right":"Depression","wrong":[["Schizophrenia, from a dopamine overload during the night","Not on your slides."],["Synesthesia","Not related."],["Prosopagnosia","Not related."]],"exp":"Sleep loss increases the risk of depression."}]},{"term":"Sleep loss: immune system","def":"Suppression of immune cell production and increased risk of viral infections, such as colds.","hook":"","asks":[{"q":"During finals week with little sleep, Tom keeps catching colds. Why?","right":"Sleep loss suppresses his immune system","wrong":[["Sleep loss lowers his ghrelin and makes him less hungry","Sleep loss raises ghrelin, and that's about hunger."],["Sleep loss strengthens his muscles","It weakens them."],["Colds are unrelated to sleep","Sleep loss raises the risk of viral infections."]],"exp":"Fewer immune cells, more viral infections."},{"q":"Which type of infection rises with sleep loss, per your slides?","right":"Viral infections like colds","wrong":[["Bacterial infections of the bones and joints in older adults","Your slides say viral infections like colds."],["None","Infections increase."],["Only food poisoning","Not on your slides."]],"exp":"Sleep loss suppresses immune cells and raises viral infections."}]},{"term":"Sleep loss: stomach and fat cells","def":"Increased hunger-arousing ghrelin and decreased hunger-suppressing leptin, plus increased fat cell production and greater risk of obesity.","hook":"Ghrelin = growling stomach goes up; Leptin = leave the table goes down.","asks":[{"q":"Why do people who sleep too little often gain weight?","right":"More ghrelin and less leptin","wrong":[["Less ghrelin and more leptin, so they feel full all day","It's the reverse: more hunger, less fullness."],["Their metabolism stops at night","That isn't on your slides."],["Melatonin turns into fat","That isn't how it works."]],"exp":"More hunger-arousing ghrelin, less hunger-suppressing leptin, more fat cells."},{"q":"Which long-term risk is linked to sleep loss through hunger hormones and fat cells?","right":"Obesity","wrong":[["Anorexia, from losing all interest in eating during the day","Sleep loss raises hunger."],["Color blindness","Not related."],["Hearing loss","Not related."]],"exp":"More ghrelin, less leptin, more fat cells: greater risk of obesity."}]},{"term":"Sleep loss: heart","def":"Increased risk of high blood pressure.","hook":"","asks":[{"q":"Which heart-related risk rises with
