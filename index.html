h order shows the OCD cycle?","right":"Obsession, distress, compulsion, relief","wrong":[["Compulsion, then relief, then obsession, then final distress","The obsession comes first."],["Relief, distress, obsession, compulsion","Relief follows the compulsion."],["Distress, relief, compulsion, obsession","Out of order."]],"exp":"Obsession → distress → compulsion → relief → back to obsession."},{"q":"In the OCD cycle, what happens right after the compulsion?","right":"Relief","wrong":[["A brand new obsession that is unrelated to the first one","Relief comes first, then the obsession returns."],["Distress","Distress comes before the compulsion."],["A panic attack","Not in the cycle."]],"exp":"Obsession → distress → compulsion → relief → back to obsession."}]},{"term":"Behavioral cause of OCD","def":"Compulsions are learned and maintained through operant conditioning: the anxiety reduction is the reinforcement. Behaviors may also have been learned through social learning.","hook":"","asks":[{"q":"Why do compulsions keep happening, according to the behavioral explanation of OCD?","right":"The relief from anxiety reinforces them","wrong":[["They are caused only by an inherited gene from one parent","That is a genetic explanation."],["They are unconscious childhood wishes","That is psychodynamic."],["They are false perceptions","That describes hallucinations."]],"exp":"Operant conditioning: anxiety reduction is the reinforcement."},{"q":"Why does checking the lock 15 times keep happening, according to operant conditioning?","right":"The relief from anxiety reinforces it","wrong":[["The person was punished for checking the lock as a young child","Reinforcement, not punishment, maintains it."],["Low dopamine","Not the behavioral explanation."],["It's a delusion","Not psychosis."]],"exp":"Anxiety reduction is the reinforcement."}]},{"term":"Other causes of OCD & related disorders","def":"Cognitive: maladaptive and distorted thinking. Environmental: past trauma and stressful life events. Genetic: higher incidence in twins, runs in families, specific genes identified. Biological: differences in specific brain regions; OCD is related to low serotonin and imbalances in GABA and glutamate.","hook":"","asks":[{"q":"OCD shows up more often in identical twins and runs in families. Which cause does this support?","right":"Genetic","wrong":[["Environmental trauma and stressful life events","Twin and family patterns point to genes."],["Cognitive","That is distorted thinking."],["Behavioral","That is conditioning."]],"exp":"Cognitive, environmental and genetic causes."},{"q":"Which neurotransmitter is OCD linked to being low, on your slides?","right":"Serotonin","wrong":[["Dopamine, which is too high in schizophrenia","Not the one listed for OCD."],["Melatonin","That is a hormone for sleep."],["Endorphins","Not listed."]],"exp":"OCD is related to low serotonin and imbalances in GABA and glutamate."}]}]},{"name":"Hoarding","cards":[{"term":"Hoarding disorder","def":"DSM-5 criteria: (a) persistent difficulty discarding or parting with possessions, regardless of their actual value; (b) this is due to a perceived need to save the items and distress about discarding them; (c) it results in possessions that congest and clutter active living areas, substantially compromising their use.","hook":"","asks":[{"q":"A woman's home is so packed with saved newspapers that she can't use her kitchen, and throwing any away causes her great distress. Which disorder fits?","right":"Hoarding disorder","wrong":[["Obsessive-compulsive personality disorder","That is perfectionism and rigidity, not saving items."],["Trichotillomania","That is hair-pulling."],["Agoraphobia","That is fear of places."]],"exp":"Persistent difficulty discarding possessions, with distress and clutter."},{"q":"Which detail is part of the DSM-5 criteria for hoarding disorder?","right":"Clutter makes living areas hard to use","wrong":[["Collecting only valuable items like coins and rare stamps","It's regardless of the items' value."],["Hearing voices","Not a hoarding criterion."],["Fear of crowds","That is agoraphobia."]],"exp":"Possessions congest active living areas, substantially compromising their use."}]}]},{"name":"Trauma & stressor-related","cards":[{"term":"Trauma- and stressor-related disorders","def":"Disorders that result from exposure to a traumatic or stressful event: PTSD, acute stress disorder, and adjustment disorders. They cause similar symptoms but differ in how long they last. Your slide: know the symptoms of PTSD.","hook":"","asks":[{"q":"PTSD, acute stress disorder and adjustment disorders all result from what?","right":"Exposure to a traumatic or stressful event","wrong":[["An imbalance of dopamine present since early childhood","Not the defining cause."],["Teratogens before birth","Those cause developmental problems."],["Learning a new skill","Not related."]],"exp":"Trauma- and stressor-related disorders follow a traumatic or stressful event."},{"q":"PTSD, acute stress disorder and adjustment disorders cause similar symptoms. How do they differ, according to your slide?","right":"In how long they last","wrong":[["In whether or not a traumatic event happened to the person","All follow a traumatic or stressful event."],["In which hemisphere is affected","Not on your slides."],["In whether they involve mania","Not on your slides."]],"exp":"They cause similar symptoms but differ in how long they last."}]},{"term":"Cause of trauma disorders","def":"Exposure to a traumatic or stressful event that results in psychological distress.","hook":"","asks":[{"q":"What causes trauma- and stressor-related disorders?","right":"A traumatic or stressful event","wrong":[["A genetic mutation inherited from a parent or grandparent","The cause is the event."],["Too much leptin","Not related."],["Watching TV","Not related."]],"exp":"Exposure to a traumatic or stressful event that results in distress."},{"q":"Which situation could lead to a trauma- or stressor-related disorder?","right":"Surviving a violent attack","wrong":[["Inheriting a gene for the disorder with no stressful events at all","These disorders require a traumatic or stressful event."],["Eating too little","Not a trauma."],["Studying the disorder","That is intern syndrome."]],"exp":"Exposure to a traumatic or stressful event."}]},{"term":"Symptoms of PTSD","def":"Intrusive thoughts; nightmares and flashbacks; hypervigilance (always on guard); anxiety and depression; difficulty sleeping or concentrating; substance use or self-destructive behavior.","hook":"","asks":[{"q":"Months after a car crash, a man has flashbacks, nightmares and jumps at every loud noise. What does he likely have?","right":"PTSD","wrong":[["Generalized anxiety disorder with worry about everything","His symptoms are tied to the trauma."],["Bipolar II","That is a mood disorder."],["Schizophrenia","That is psychosis."]],"exp":"Intrusive thoughts, flashbacks, nightmares, hypervigilance."},{"q":"Which set fits PTSD rather than GAD?","right":"Flashbacks and nightmares of an event","wrong":[["Constant worry about many different everyday things for six months","That is GAD."],["Fidgeting","That is ADHD."],["Binge eating","That is bulimia."]],"exp":"PTSD: intrusive thoughts, nightmares, flashbacks, hypervigilance."}]},{"term":"Hypervigilance","def":"Always being on guard. A symptom of PTSD.","hook":"","asks":[{"q":"A veteran with PTSD always sits facing the door and scans every room for danger. What symptom is this?","right":"Hypervigilance","wrong":[["Catatonic stupor, sitting still without moving","That is no movement."],["Flat affect","That is no emotion."],["A compulsion","That is an OCD behavior."]],"exp":"Always being on guard."},{"q":"Hypervigilance is a symptom of which disorder on your slides?","right":"PTSD","wrong":[["ADHD, which involves inattention and hyperactivity in children","Not listed for ADHD."],["Anorexia","Not listed."],["Bipolar II","Not listed."]],"exp":"Hypervigilance (always on guard) is a PTSD symptom."}]}]}],"intro":["Obsessive-compulsive and related disorders (OCD, hoarding), their causes, and PTSD."]},{"id":9,"name":"Feeding & Eating Disorders","optional":false,"sections":[{"name":"Eating disorders","cards":[{"term":"Feeding & eating disorders","def":"Most involve an intense focus on weight, body shape, and food, leading to dangerous eating behaviors that can seriously affect nutrition. They can cause permanent harm to the heart, digestive system, bones, teeth, and mouth, can lead to other diseases, and are linked with depression, anxiety, self-harm, and suicidal thoughts and behaviors.","hook":"","asks":[{"q":"Which group of disorders involves an intense focus on weight, body shape and food, with dangerous eating behaviors?","right":"Feeding & eating disorders","wrong":[["Obsessive-compulsive and related disorders like hoarding","Those involve obsessions and compulsions."],["Mood disorders","Those center on mood."],["Neurodevelopmental disorders","Those begin in childhood."]],"exp":"Eating disorders can cause permanent damage."},{"q":"Which body parts can eating disorders permanently harm, according to your slides?","right":"Heart, bones, teeth and digestion","wrong":[["Only the skin and hair, which grow back with time","Your slides list heart, digestive system, bones, teeth and mouth."],["Only the eyes","Not listed."],["None","They can cause permanent harm."]],"exp":"Permanent harm to the heart, digestive system, bones, teeth and mouth."}]},{"term":"The two to know","def":"Anorexia nervosa and bulimia nervosa.","hook":"","asks":[{"q":"Which two eating disorders does your class focus on?","right":"Anorexia and bulimia","wrong":[["Hoarding disorder and excoriation, the skin-picking disorder","Those are OCD-related."],["Insomnia and narcolepsy","Those are sleep disorders."],["ADHD and ASD","Those are neurodevelopmental."]],"exp":"Anorexia nervosa and bulimia nervosa."},{"q":"Your teacher says to focus on two eating disorders. Which pair is it?","right":"Anorexia and bulimia","wrong":[["Bulimia and binge-eating disorder without any purging behavior","Not the pair on your slides."],["Anorexia and OCD","OCD isn't an eating disorder."],["Hoarding and bulimia","Hoarding isn't an eating disorder."]],"exp":"Anorexia nervosa and bulimia nervosa."}]}]},{"name":"Anorexia nervosa","cards":[{"term":"Anorexia nervosa","def":"Refusal to maintain body weight at or above a minimally normal weight (restricting calories to reach a significantly low body weight), plus an intense fear of gaining weight or becoming overweight even though underweight.","hook":"Anorexia = restricting.","asks":[{"q":"A girl who is already very underweight keeps restricting calories because she's terrified of gaining weight. Which disorder fits?","right":"Anorexia nervosa","wrong":[["Bulimia nervosa, with cycles of binging and purging","She isn't binging; she restricts."],["Body dysmorphic disorder","Not the eating disorder described."],["GAD","That is worry."]],"exp":"Refusal to maintain a minimally normal weight plus fear of gaining."},{"q":"What separates anorexia from bulimia?","right":"Restricting to a very low weight","wrong":[["Recurring binge eating followed by purging to avoid gaining weight","That is bulimia."],["Fear of crowds","Not related."],["Normal weight","People with bulimia are often at a normal weight."]],"exp":"Anorexia = restricting to a significantly low body weight."}]},{"term":"Signs of anorexia","def":"Distorted self-image, intense fear of gaining weight, restricted food intake, excessive exercising, withdrawing from socializing, intentional vomiting, significant weight loss, fatigue, and dizziness or fainting.","hook":"","asks":[{"q":"Which is a sign of anorexia on your slides?","right":"Excessive exercising and restricted eating","wrong":[["Eating large amounts of food in under two hours, then purging","That describes bulimia."],["Hoarding food","Not listed."],["Hearing voices","That is schizophrenia."]],"exp":"Distorted self-image, fear of gaining, restricted intake, excessive exercise."},{"q":"A dancer exercises for hours, eats very little, faints at practice and avoids eating with friends. Which disorder do these signs fit?","right":"Anorexia nervosa","wrong":[["Bulimia nervosa, with binge eating and then purging","No binge eating is described."],["GAD","Not an eating disorder."],["ADHD","Not related."]],"exp":"Restricted intake, excessive exercise, fainting, withdrawing from socializing."}]}]},{"name":"Bulimia nervosa","cards":[{"term":"Bulimia nervosa","def":"Recurrent episodes of binge eating, plus acting to prevent weight gain with self-induced vomiting; misuse of laxatives, diuretics, or other medications; fasting; or excessive exercise.","hook":"Bulimia = binge + undo it.","asks":[{"q":"A teen at a normal weight secretly eats large amounts of food, then makes herself vomit. Which disorder fits?","right":"Bulimia nervosa","wrong":[["Anorexia nervosa, restricting food to a very low weight","She binges and is at a normal weight."],["Hoarding disorder","Not related."],["OCD","Not the best fit."]],"exp":"Binge eating plus purging or other ways to prevent weight gain."},{"q":"Which behavior is part of bulimia on your slides?","right":"Misusing laxatives after binge eating","wrong":[["Restricting calories to reach a very low body weight","That is anorexia."],["Hoarding food","Not listed."],["Refusing all food for weeks","That fits restricting."]],"exp":"Bulimia: binges plus purging, laxatives, fasting or excessive exercise."}]},{"term":"Binge eating episode","def":"Both: eating, within any 2-hour period, an amount of food definitely larger than most people would eat in a similar time and situation, and feeling you can't stop eating or control what or how much you eat.","hook":"","asks":[{"q":"Which counts as a binge eating episode under your slides' definition?","right":"Eating far more than normal in 2 hours, unable to stop","wrong":[["Eating one large meal on a holiday with family members","A binge needs both the large amount and loss of control."],["Skipping breakfast","That isn't binging."],["Snacking all day","Not the definition."]],"exp":"A definitely larger amount in 2 hours plus feeling you can't stop."},{"q":"Which two things are BOTH needed for a binge eating episode?","right":"A very large amount and a loss of control","wrong":[["Eating alone at night and then feeling some regret the next day","Not the definition."],["Eating fast food","Not required."],["Weight gain","Not required."]],"exp":"A definitely larger amount in 2 hours, plus feeling you can't stop."}]},{"term":"Signs of bulimia","def":"Hard to spot: people often binge and purge privately. Frequent bathroom visits, excessive exercising, preoccupation with body image, intense fear of gaining weight, feeling out of control, depression/anxiety/substance abuse, guilt or shame about eating, withdrawing from friends and family.","hook":"","asks":[{"q":"Why can bulimia be hard to spot?","right":"People often binge and purge in private","wrong":[["People with bulimia always have a very low body weight","Many are at a normal weight."],["It has no physical effects","It does."],["It only lasts a day","It is ongoing."]],"exp":"Frequent bathroom visits and private binging and purging."},{"q":"A friend often goes to the bathroom right after meals and seems ashamed about eating. Which disorder do these signs fit?","right":"Bulimia nervosa","wrong":[["Anorexia nervosa, restricting food to a very low weight","Frequent bathroom visits after meals point to purging."],["Panic disorder","Not related."],["OCD","Not the best fit."]],"exp":"Frequent bathroom visits, guilt or shame about eating."}]}]},{"name":"Causes","cards":[{"term":"Biological & genetic causes","def":"Biological: imbalances in brain chemistry. Genetic: family history and genetic predisposition.","hook":"","asks":[{"q":"Eating disorders run in Kim's family. Which cause does this support?","right":"Genetic predisposition","wrong":[["Cultural pressure to be thin from social media and ads","That is a cultural cause."],["Weight-related bullying","That is a social cause."],["Stress of starting college","That is stress."]],"exp":"Brain chemistry and family history."},{"q":"Which is a biological cause of eating disorders?","right":"Imbalances in brain chemistry","wrong":[["Being teased about weight in middle school and high school","That is social."],["Thin ideals in the media","That is cultural."],["Perfectionistic thinking","That is cognitive."]],"exp":"Biological: brain chemistry imbalances; genetic: family history."}]},{"term":"Social cause","def":"A history of weight-related bullying; family concerns with fitness and weight; a family focus on perfectionism or high achievement.","hook":"","asks":[{"q":"A boy develops an eating disorder after years of being teased about his weight. Which cause is this?","right":"Social","wrong":[["Cultural, from a society that values extreme thinness","This is about his personal social experience."],["Genetic","That is inherited."],["Biological","That is brain chemistry."]],"exp":"Weight-related bullying and family focus on fitness or perfection."},{"q":"Which is a social cause of eating disorders?","right":"A family focused on perfection and achievement","wrong":[["Living in a culture that values thinness and extreme dieting","That is cultural."],["Brain chemistry","That is biological."],["Moving to college","That is stress."]],"exp":"Weight-related bullying, family focus on fitness, perfectionism or achievement."}]},{"term":"Cultural cause","def":"Most prevalent in industrialized cultures with an emphasis on thinness; the presence of extreme diet and exercise information.","hook":"","asks":[{"q":"Why are eating disorders most common in industrialized cultures, according to your slides?","right":"Those cultures emphasize thinness","wrong":[["Those cultures have less stress and more free time for exercise","Not on your slides."],["Food is scarce there","Not the reason given."],["They have fewer doctors","Not the reason."]],"exp":"Emphasis on thinness and extreme diet information."},{"q":"Which setting fits the cultural cause of eating disorders?","right":"A culture full of extreme diet advice","wrong":[["A family that teases a child about weight at every dinner","That is social."],["A genetic predisposition","That is genetic."],["Starting a new job","That is stress."]],"exp":"Industrialized cultures emphasizing thinness, with extreme diet and exercise information."}]},{"term":"Cognitive cause","def":"Dysfunctional attitudes about physical appearance, perfectionism, and obsessive thoughts.","hook":"","asks":[{"q":"A student believes she must look perfect and thinks about her body constantly. Which cause of eating disorders is this?","right":"Cognitive","wrong":[["Social, from weight-related bullying by classmates","This is about her own thinking."],["Cultural","That is about society."],["Genetic","That is inherited."]],"exp":"Dysfunctional attitudes about appearance, perfectionism, obsessive thoughts."},{"q":"Which thought fits the cognitive cause of eating disorders?","right":"\"I must look perfect or I'm worthless.\"","wrong":[["\"My mom and grandmother both had an eating disorder too.\"","That points to genetics."],["\"I just moved to college.\"","That is stress."],["\"Everyone on TV is thin.\"","That is cultural."]],"exp":"Dysfunctional attitudes about appearance, perfectionism, obsessive thoughts."}]},{"term":"Stress as a cause","def":"Stress like heading to college, family issues, relationship issues, and new jobs.","hook":"","asks":[{"q":"An eating disorder starts soon after Mia moves away to college. Which cause does this fit?","right":"Stress","wrong":[["Genetic predisposition passed down from her parents","The trigger here is the life change."],["Teratogens","Those act before birth."],["Cultural","The key factor is the stressful change."]],"exp":"Stress like heading to college, family or relationship problems."},{"q":"Which event is listed as a stress that can trigger an eating disorder?","right":"Starting a new job","wrong":[["Inheriting a predisposition to eating disorders from a parent","That is genetic."],["Seeing diet ads","That is cultural."],["Being bullied","That is social."]],"exp":"Stress like college, family or relationship issues and new jobs."}]}]}],"intro":["Anorexia nervosa, bulimia nervosa, and the causes of eating disorders."]},{"id":10,"name":"Personality Disorders","optional":false,"sections":[{"name":"Personality disorders","cards":[{"term":"Personality disorders","def":"Enduring patterns of internal experience and behavior that are deviant from one's culture; pervasive and inflexible; begin in adolescence or early adulthood; stable over time; and lead to personal distress. To be a disorder, they have to interfere with daily living and normal functioning.","hook":"","asks":[{"q":"Which best describes a personality disorder?","right":"A lasting, rigid pattern starting by early adulthood","wrong":[["A brief reaction to a stressful week that goes away on its own","Personality disorders are enduring."],["A disorder that begins in early childhood","They begin in adolescence or early adulthood."],["A short manic episode","That is a mood episode."]],"exp":"Enduring, pervasive, inflexible patterns that cause distress."},{"q":"Jordan has been rigid and suspicious since his teens, in every setting, and it costs him jobs and friendships. Which feature makes this a personality disorder rather than a bad phase?","right":"It's enduring, pervasive and inflexible","wrong":[["It started only after a single stressful week at work last month","Personality disorders are enduring patterns, not brief reactions."],["It causes hallucinations","Personality disorders don't involve psychosis."],["It began in early childhood","They begin in adolescence or early adulthood."]],"exp":"Enduring, pervasive, inflexible, stable over time, and it interferes with functioning."},{"q":"A teacher calls a student \"a narcissist\" after one bragging moment. Why might a psychologist disagree that this is a disorder?","right":"One moment isn't a lasting, pervasive pattern","wrong":[["Personality disorders can only be diagnosed in children under the age of 12","They begin in adolescence or early adulthood."],["Bragging is a symptom of schizophrenia","It isn't."],["Narcissism isn't a personality disorder","Narcissistic personality disorder is one of the 10."]],"exp":"A disorder needs an enduring, inflexible pattern that interferes with functioning."}]},{"term":"Three clusters","def":"There are 10 personality disorders in three clusters. Cluster A: odd or eccentric. Cluster B: dramatic, emotional, erratic. Cluster C: anxious or fearful.","hook":"A = Awkward/odd, B = Bold/dramatic, C = Cowardly/fearful.","asks":[{"q":"How are the 10 personality disorders grouped?","right":"Odd, dramatic, and anxious clusters","wrong":[["Mild, moderate and severe levels, like substance use disorder","Those are severity levels for substance use disorder."],["Positive and negative","Those are schizophrenia symptoms."],["Alarm, resistance, exhaustion","Those are GAS stages."]],"exp":"Cluster A: odd; B: dramatic; C: anxious."},{"q":"A psychologist groups a patient's disorder with others marked by fearfulness and worry. Which cluster is it?","right":"Cluster C","wrong":[["Cluster A, the odd and eccentric group","Cluster A is odd or eccentric."],["Cluster B","Cluster B is dramatic, emotional, erratic."],["Cluster D","There are only three clusters."]],"exp":"C = cowardly/fearful (anxious)."},{"q":"Which pairing of cluster and description is correct?","right":"B: dramatic, emotional, erratic","wrong":[["A: anxious and fearful, worried about rejection","Cluster A is odd or eccentric."],["C: odd or eccentric","Cluster C is anxious or fearful."],["B: odd or eccentric","Cluster B is dramatic."]],"exp":"A = odd, B = dramatic, C = anxious."}]}]},{"name":"Cluster A: odd or eccentric","cards":[{"term":"Cluster A","def":"Odd or eccentric: paranoid, schizoid, and schizotypal personality disorders.","hook":"","asks":[{"q":"Paranoid, schizoid and schizotypal personality disorders belong to which cluster?","right":"Cluster A (odd or eccentric)","wrong":[["Cluster B, the dramatic, emotional and erratic group","Cluster B is antisocial, histrionic, narcissistic, borderline."],["Cluster C","That is anxious or fearful."],["Cluster D","There is no Cluster D."]],"exp":"A = odd or eccentric."},{"q":"Which three disorders would a psychologist group as odd or eccentric?","right":"Paranoid, schizoid, schizotypal","wrong":[["Avoidant, dependent and obsessive-compulsive personality disorders","Those are Cluster C."],["Antisocial, histrionic, narcissistic","Those are Cluster B."],["Borderline, paranoid, avoidant","That mixes all three clusters."]],"exp":"Cluster A: paranoid, schizoid, schizotypal."},{"q":"A patient is odd and eccentric and believes in magical forces. Which cluster does the likely disorder belong to?","right":"Cluster A","wrong":[["Cluster B, with dramatic and erratic behavior","Magical thinking and odd behavior point to schizotypal, Cluster A."],["Cluster C","Cluster C is anxious or fearful."],["No cluster; it's a mood disorder","This fits schizotypal personality disorder."]],"exp":"Schizotypal is in Cluster A."}]},{"term":"Paranoid personality disorder","def":"Irrational fear and distrust of others; interprets others' motives as malevolent (bad intent). No psychosis and no loss of touch with reality.","hook":"","asks":[{"q":"Jim believes coworkers secretly want to hurt him, though he's in touch with reality and has no hallucinations. Which disorder fits?","right":"Paranoid personality disorder","wrong":[["Schizophrenia with delusions of persecution","He has no psychosis."],["Social anxiety disorder","That is fear of judgment."],["Antisocial personality disorder","That is disregard for others."]],"exp":"Distrust of others' motives, without psychosis."},{"q":"Liam is convinced his coworkers are plotting against him, but he has no hallucinations and is in touch with reality. What separates this from schizophrenia?","right":"No psychosis or loss of touch with reality","wrong":[["He has delusions of persecution that come with hallucinations","He has no hallucinations or psychosis."],["He shows flat affect","Not described."],["He has catatonic stupor","Not described."]],"exp":"Paranoid personality disorder: distrust without psychosis."},{"q":"When a friend compliments her haircut, Tess assumes the friend is mocking her. Which disorder does this pattern suggest, if it is lasting?","right":"Paranoid personality disorder","wrong":[["Histrionic personality disorder, which seeks attention","She isn't seeking attention; she distrusts motives."],["Dependent personality disorder","That is clinginess."],["Schizoid personality disorder","That is indifference to others."]],"exp":"Interpreting others' motives as malevolent."}]},{"term":"Schizoid personality disorder","def":"Lack of interest in social relationships and very little emotion; indifferent to criticism or praise; lacks social skills and understanding of social norms.","hook":"","asks":[{"q":"Sara has no interest in relationships, shows little emotion and doesn't care about praise or criticism. Which disorder fits?","right":"Schizoid personality disorder","wrong":[["Avoidant personality disorder, from fear of rejection","Avoidant people want relationships but fear rejection."],["Histrionic","That seeks attention."],["Narcissistic","That needs admiration."]],"exp":"Little interest in relationships and little emotion."},{"q":"Owen lives alone, has no interest in friends or dating, shows little emotion, and doesn't care what people think. Which disorder fits?","right":"Schizoid personality disorder","wrong":[["Schizotypal personality disorder, with magical thinking","He shows no odd beliefs or magical thinking."],["Avoidant personality disorder","Avoidant people want relationships but fear rejection."],["Antisocial personality disorder","He isn't violating others' rights."]],"exp":"Schizoid: lack of interest in relationships, little emotion."},{"q":"Which detail best separates schizoid from avoidant personality disorder?","right":"Schizoid people don't want relationships","wrong":[["Avoidant people have no interest in relationships at all","Avoidant people want them but fear rejection."],["Schizoid people fear criticism intensely","They are indifferent to it."],["Avoidant people have magical thinking","That is schizotypal."]],"exp":"Schizoid: indifferent. Avoidant: wants connection, fears rejection."}]},{"term":"Schizotypal personality disorder","def":"Odd and eccentric behavior, thinking, and appearance; magical thinking (superstitious, paranormal experiences); social anxiety, suspicion, paranoia.","hook":"","asks":[{"q":"A man dresses oddly, believes he can read minds and is suspicious of others. Which disorder fits?","right":"Schizotypal personality disorder","wrong":[["Schizoid personality disorder, with no interest in others","Schizoid lacks the magical thinking and odd behavior."],["Borderline","That is unstable mood and relationships."],["Dependent","That is clingy and needy."]],"exp":"Odd behavior and appearance plus magical thinking."},{"q":"Gina dresses unusually, believes she can sense others' thoughts, and is suspicious and socially anxious. Which disorder fits best?","right":"Schizotypal personality disorder","wrong":[["Schizophrenia with hallucinations and disorganized speech","No hallucinations or psychosis are described."],["Schizoid personality disorder","Schizoid lacks the magical thinking."],["Histrionic personality disorder","That is attention-seeking."]],"exp":"Odd appearance and magical thinking point to schizotypal."},{"q":"Which pair of features most clearly points to schizotypal rather than schizoid personality disorder?","right":"Magical thinking and odd appearance","wrong":[["Indifference to praise and to criticism from other people","That fits schizoid."],["Fear of abandonment","That fits dependent."],["Need for admiration","That fits narcissistic."]],"exp":"Schizotypal adds odd beliefs and appearance."}]}]},{"name":"Cluster B: dramatic, emotional, erratic","cards":[{"term":"Cluster B","def":"Dramatic, emotional, erratic: antisocial, histrionic, narcissistic, and borderline personality disorders.","hook":"","asks":[{"q":"Antisocial, histrionic, narcissistic and borderline personality disorders belong to which cluster?","right":"Cluster B (dramatic, emotional, erratic)","wrong":[["Cluster C, the anxious and fearful group of disorders","Cluster C is avoidant, dependent, OCPD."],["Cluster A","That is odd or eccentric."],["Cluster D","There is no Cluster D."]],"exp":"B = dramatic, emotional, erratic."},{"q":"Which three disorders all belong to the dramatic, emotional, erratic cluster?","right":"Histrionic, narcissistic, borderline","wrong":[["Paranoid, schizoid and schizotypal personality disorders","Those are Cluster A."],["Avoidant, dependent, OCPD","Those are Cluster C."],["Antisocial, avoidant, paranoid","That mixes clusters."]],"exp":"Cluster B: antisocial, histrionic, narcissistic, borderline."},{"q":"A patient constantly seeks attention with theatrical displays. Which cluster does her likely disorder belong to?","right":"Cluster B","wrong":[["Cluster C, the anxious and fearful group","Histrionic is Cluster B."],["Cluster A","Cluster A is odd or eccentric."],["It isn't a personality disorder","This fits histrionic personality disorder."]],"exp":"Histrionic is in Cluster B."}]},{"term":"Antisocial personality disorder","def":"A persistent pattern of disregard for and violation of the rights and well-being of others; lack of empathy, remorse, and responsibility. Your chart: may account for half of the prison population in some countries.","hook":"","asks":[{"q":"A man repeatedly lies, steals and hurts people with no remorse. Which disorder fits?","right":"Antisocial personality disorder","wrong":[["Narcissistic personality disorder, craving admiration","Narcissism centers on admiration and entitlement."],["Avoidant","That is shyness and fear of rejection."],["Schizoid","That is lack of interest in others."]],"exp":"Disregard for others' rights, without empathy or remorse."},{"q":"Which detail from your chart is linked to antisocial personality disorder?","right":"It may be half of some prison populations","wrong":[["It is the most common disorder among college students worldwide","Not on your chart."],["It always includes hallucinations","It doesn't."],["It mostly affects children","Personality disorders begin in adolescence or early adulthood."]],"exp":"Your chart: may account for half the prison population in some countries."},{"q":"Rick bullies coworkers, lies to get ahead, and feels no remorse. Nate also wants to get ahead but mainly craves admiration and feels entitled. Which pair fits?","right":"Rick antisocial; Nate narcissistic","wrong":[["Rick narcissistic; Nate antisocial, the opposite way round","This swaps them."],["Both histrionic","Neither is mainly seeking attention through drama."],["Rick paranoid; Nate schizoid","Neither distrust nor indifference fits."]],"exp":"Antisocial: violating others without remorse. Narcissistic: need for admiration, entitlement."}]},{"term":"Histrionic personality disorder","def":"A pervasive pattern of excessive emotionality and attention-seeking; dramatic and theatrical displays to gain attention and validation; need for reassurance and approval.","hook":"Histrionic = theatrical.","asks":[{"q":"Lina is always dramatic and theatrical, needing to be the center of attention at every gathering. Which disorder fits?","right":"Histrionic personality disorder","wrong":[["Narcissistic personality disorder and its sense of entitlement","Narcissism centers on self-importance; histrionic on attention and emotion."],["Schizotypal","That is odd and eccentric."],["Dependent","That is clingy and submissive."]],"exp":"Excessive emotionality and attention-seeking."},{"q":"At every party, Lena makes a dramatic scene, needs constant approval, and gets upset if she isn't the center of attention. Which disorder fits?","right":"Histrionic personality disorder","wrong":[["Borderline personality disorder with unstable self-image","Her pattern is attention-seeking, not instability in self-image."],["Narcissistic personality disorder","Narcissism is about superiority, not theatrical attention-seeking."],["Dependent personality disorder","That is needing others to decide."]],"exp":"Histrionic = theatrical, attention-seeking."},{"q":"What best separates histrionic from narcissistic personality disorder?","right":"Histrionic seeks attention through drama","wrong":[["Histrionic people believe they are superior to everyone around them","That describes narcissism."],["Histrionic people avoid others","They seek attention."],["Narcissistic people are fearful","Narcissism isn't fearfulness."]],"exp":"Histrionic: drama and emotion for attention. Narcissistic: superiority and entitlement."}]},{"term":"Narcissistic personality disorder","def":"Exaggerated sense of self-importance; need for excessive admiration; preoccupation with power, success, or beauty; sense of entitlement; exploits others; lack of empathy, arrogant; doesn't recognize others' feelings; sensitive to criticism.","hook":"Narcissus fell in love with his own reflection.","asks":[{"q":"A boss believes he's superior to everyone, demands constant admiration and uses others to get ahead. Which disorder fits?","right":"Narcissistic personality disorder","wrong":[["Histrionic personality disorder and its dramatic attention-seeking","Histrionic is about emotion and attention, not superiority."],["Paranoid","That is distrust."],["Avoidant","That is fear of rejection."]],"exp":"Grandiose self-importance, need for admiration, entitlement."},{"q":"A manager expects special treatment, takes credit for others' work, and explodes at any criticism. Which disorder fits?","right":"Narcissistic personality disorder","wrong":[["Obsessive-compulsive personality disorder with rigid perfectionism","His issue is entitlement, not perfectionism."],["Paranoid personality disorder","That is distrust."],["Avoidant personality disorder","He isn't shy or fearful."]],"exp":"Entitlement, exploiting others, sensitivity to criticism."},{"q":"Which hook from your cards fits narcissistic personality disorder?","right":"Narcissus loved his own reflection","wrong":[["A = Awkward, B = Bold, C = Cowardly","That is the cluster hook."],["DBT = borderline","That links DBT to borderline."],["Histrionic = theatrical","That is histrionic."]],"exp":"Narcissus fell in love with his own reflection."}]},{"term":"Borderline personality disorder","def":"Instability in mood, self-image, and relationships, often leading to intense emotions, impulsivity, and difficulty maintaining stable relationships.","hook":"","asks":[{"q":"Kara's mood swings wildly, her self-image keeps changing, and her relationships are intense and unstable. Which disorder fits?","right":"Borderline personality disorder","wrong":[["Bipolar I, with full manic episodes and psychosis","Bipolar centers on mood episodes, not unstable relationships and self-image."],["Schizoid","That is detachment."],["OCPD","That is perfectionism."]],"exp":"Instability in mood, self-image and relationships."},{"q":"Maya adores a friend one week and hates her the next, keeps changing how she sees herself, and acts impulsively. Which disorder fits?","right":"Borderline personality disorder","wrong":[["Bipolar II disorder, with hypomanic and depressive episodes","Her instability is in relationships and self-image, not mood episodes."],["Histrionic personality disorder","Her key issue is instability, not attention-seeking."],["Dependent personality disorder","She isn't mainly clingy."]],"exp":"Instability in mood, self-image and relationships."},{"q":"Which therapy was originally developed for borderline personality disorder?","right":"DBT","wrong":[["REBT, which is used mainly for anxiety","REBT is mainly used for anxiety."],["Psychoanalysis","Not on your slides for borderline."],["Aversion therapy","That is for unwanted behaviors like drinking."]],"exp":"DBT = borderline."}]}]},{"name":"Cluster C: anxious or fearful","cards":[{"term":"Cluster C","def":"Anxious or fearful: avoidant, dependent, and obsessive-compulsive personality disorders.","hook":"","asks":[{"q":"Avoidant, dependent and obsessive-compulsive personality disorders belong to which cluster?","right":"Cluster C (anxious or fearful)","wrong":[["Cluster A, the odd and eccentric group of disorders","Cluster A is paranoid, schizoid, schizotypal."],["Cluster B","That is dramatic and erratic."],["Cluster E","There is no Cluster E."]],"exp":"C = anxious or fearful."},{"q":"Which three disorders share anxiety and fearfulness?","right":"Avoidant, dependent, OCPD","wrong":[["Paranoid, schizoid and schizotypal personality disorders","Those are Cluster A."],["Antisocial, histrionic, narcissistic","Those are Cluster B."],["Borderline, avoidant, schizoid","That mixes clusters."]],"exp":"Cluster C: avoidant, dependent, obsessive-compulsive."},{"q":"A patient's disorder centers on fear of abandonment and needing others to decide for her. Which cluster?","right":"Cluster C","wrong":[["Cluster B, the dramatic and erratic group","Dependent personality disorder is Cluster C."],["Cluster A","Cluster A is odd."],["It's not a personality disorder","This fits dependent personality disorder."]],"exp":"Dependent is in Cluster C."}]},{"term":"Avoidant personality disorder","def":"Extreme shyness and social anxiety; fear of rejection and criticism; feelings of inadequacy and inferiority; avoiding social situations, relationships, and activities; difficulty expressing emotions and forming intimate relationships; low self-esteem.","hook":"","asks":[{"q":"Tim wants friends but avoids people because he feels inadequate and fears rejection. Which disorder fits?","right":"Avoidant personality disorder","wrong":[["Schizoid personality disorder, with no interest in others","Schizoid people don't want relationships."],["Antisocial","That is disregard for others."],["Histrionic","That seeks attention."]],"exp":"Extreme shyness, fear of rejection, feelings of inadequacy."},{"q":"Sam turns down every invitation because he's sure people will find him boring and reject him, though he wishes he had friends. Which disorder fits?","right":"Avoidant personality disorder","wrong":[["Schizoid personality disorder, with no interest in friends","He wants friends; schizoid people don't."],["Paranoid personality disorder","He fears rejection, not plots."],["Antisocial personality disorder","He doesn't harm others."]],"exp":"Fear of rejection, feelings of inadequacy, low self-esteem."},{"q":"Which feature appears on both the avoidant personality disorder card and the social anxiety disorder card?","right":"Fear of being judged or rejected","wrong":[["Sudden panic attacks that strike out of nowhere, without warning","That is panic disorder."],["Magical thinking","That is schizotypal."],["Worry about everything for 6 months","That is GAD."]],"exp":"Avoidant: fear of rejection and criticism. Social anxiety: fear of being judged, embarrassed or rejected."}]},{"term":"Dependent personality disorder","def":"Difficulty making everyday decisions without reassurance; excessive need for advice and guidance; fear of separation and abandonment; submissive and clingy; difficulty disagreeing or asserting oneself; feeling helpless and incompetent.","hook":"","asks":[{"q":"Rosa can't pick her own clothes or lunch without asking her partner and panics at the thought of being alone. Which disorder fits?","right":"Dependent personality disorder","wrong":[["Avoidant personality disorder from fear of rejection","Avoidant centers on fearing rejection, not needing others to decide."],["Narcissistic","That needs admiration."],["Paranoid","That is distrust."]],"exp":"Needs reassurance to decide, fears separation, clingy."},{"q":"Ella can't choose a college or even a lunch order without her mom's reassurance, and she panics at the thought of being alone. Which disorder fits?","right":"Dependent personality disorder","wrong":[["Avoidant personality disorder from fear of being rejected","Her core issue is needing others to decide."],["Borderline","She isn't unstable in self-image."],["Histrionic","She isn't seeking attention."]],"exp":"Difficulty deciding without reassurance, fear of separation."},{"q":"Which behavior fits dependent personality disorder?","right":"Agreeing to avoid disagreement","wrong":[["Taking over every task because no one else can do it right","That is OCPD."],["Exploiting others","That is antisocial or narcissistic."],["Showing no emotion","That is schizoid."]],"exp":"Submissive, clingy, difficulty disagreeing or asserting oneself."}]},{"term":"Obsessive-compulsive personality disorder","def":"Perfectionism; rigid and stubborn; need for orderliness and control; stingy; strict moral codes; can't delegate because others won't do it right.","hook":"","asks":[{"q":"A manager redoes everyone's work because only his way is right, and he insists on strict order. Which disorder fits?","right":"Obsessive-compulsive personality disorder","wrong":[["OCD, with intrusive thoughts and repeated rituals","OCD involves obsessions and compulsions; OCPD is perfectionism and rigidity."],["Histrionic","That seeks attention."],["Borderline","That is unstable mood."]],"exp":"Perfectionism, rigidity, need for control, can't delegate."},{"q":"Which detail best separates OCPD from OCD?","right":"OCPD has no obsessions or rituals","wrong":[["OCPD always involves hours of handwashing and checking rituals","That is OCD."],["OCD is a personality disorder","OCD is in its own category."],["OCPD causes hallucinations","It doesn't."]],"exp":"OCPD is perfectionism and rigidity, not obsessions and compulsions."},{"q":"A manager refuses to delegate, insists on strict order, is stingy with money and holds rigid moral rules. Which disorder fits?","right":"OCPD","wrong":[["Narcissistic personality disorder and a need for admiration","He isn't seeking admiration."],["Paranoid","He isn't distrustful."],["Hoarding disorder","That is saving possessions."]],"exp":"Perfectionism, rigidity, control, stinginess, strict morals."}]}]},{"name":"Causes","cards":[{"term":"Causes of personality disorders","def":"Genetic: a possible genetic predisposition. Environmental: early childhood abuse, neglect, or trauma; an unstable, unpredictable, or unsupportive home; poor attachment. Biological: differences in brain structure or functioning. Cultural: norms and expectations, socialization, and parenting styles. Substance abuse.","hook":"","asks":[{"q":"Which is an environmental cause of personality disorders on your slides?","right":"Early childhood abuse or neglect","wrong":[["A genetic predisposition inherited from a parent","That is a genetic cause."],["Too much caffeine","Not on your slides."],["A single bad day","Not a cause."]],"exp":"Genetic predisposition plus environmental factors like abuse, neglect or an unstable home."},{"q":"A psychologist links a client's personality disorder to growing up in a chaotic, unpredictable home with poor attachment. Which kind of cause is this?","right":"Environmental","wrong":[["Genetic, a predisposition inherited from the parents","The cause described is the home, not genes."],["Biological","That is brain structure or functioning."],["Cultural","That is norms and parenting styles across a society."]],"exp":"Environmental causes: abuse, neglect, trauma, an unstable or unsupportive home, poor attachment."},{"q":"A researcher finds that cultural norms and parenting styles shape a disorder's development. Which kind of cause is she describing?","right":"Cultural","wrong":[["Biological, differences in brain structure or functioning","That is biological."],["Genetic","That is inherited predisposition."],["Substance abuse","That is a separate cause."]],"exp":"Cultural: norms, expectations, socialization, parenting styles."}]}]}],"intro":["What a personality disorder is, the three clusters (A, B, C), all 10 disorders, and causes."]},{"id":11,"name":"Treatment","optional":false,"sections":[{"name":"History","cards":[{"term":"History of treatment","def":"Very dark. People with mental illness were usually locked away in their homes or sent to psychiatric hospitals called lunatic or insane asylums, where conditions were horrible and treatments were often worse than the illness.","hook":"","asks":[{"q":"How were people with mental illness usually treated in the past, according to your slides?","right":"Locked away, often in poor asylums","wrong":[["Treated with modern medication in outpatient clinics close to home","That is today's approach."],["Given person-centered therapy","That came much later."],["Celebrated as healers","Not on your slides."]],"exp":"Very dark: locked at home or in asylums with poor conditions."},{"q":"A historian describes 1800s asylums where patients were locked away and \"treatments\" were often worse than the illness. What does this show about the history of treatment?","right":"It was very dark and often harmful","wrong":[["Asylums gave patients the same outpatient care that most people get today","Outpatient care came with deinstitutionalization."],["Patients were mostly treated with SSRIs","Modern drugs came much later."],["Most patients received person-centered therapy","That came much later."]],"exp":"Treatment history was very dark: asylums with horrible conditions."},{"q":"Before modern medication, where were people with serious mental illness usually kept?","right":"Locked at home or in asylums","wrong":[["In outpatient clinics close to home with weekly therapy sessions","That came after deinstitutionalization."],["In group therapy programs","Not the historical norm."],["In schools","Not on your slides."]],"exp":"Locked away at home or in lunatic/insane asylums."}]},{"term":"Lobotomies in history","def":"Widely used in the 1930s and 1940s. A lobotomy is a psychosurgery that severs connections in the brain's prefrontal lobe. Electroshock therapy was also used in many institutions.","hook":"","asks":[{"q":"In the 1930s and 1940s, which surgery that cut connections in the prefrontal lobe was widely used?","right":"Lobotomy","wrong":[["Transcranial magnetic stimulation using a magnetic coil","That is modern and noninvasive."],["ECT","That uses electric current, not surgery."],["Biofeedback","That uses sensors."]],"exp":"Lobotomies were widely used then."},{"q":"In which decades were lobotomies widely used, according to your slides?","right":"The 1930s and 1940s","wrong":[["The 1990s and 2000s, after the asylums had already closed","Lobotomies are rarely used today."],["The 1600s","Too early."],["Only after 2010","They are rarely used today."]],"exp":"Widely used in the 1930s and 1940s."},{"q":"Besides lobotomies, which other harsh treatment was used in many institutions in that era?","right":"Electroshock therapy","wrong":[["Person-centered therapy with unconditional positive regard","That is a later, humanistic therapy."],["Token economies","Not listed for that era."],["SSRIs","Those came later."]],"exp":"Electroshock therapy was also used in many institutions."}]},{"term":"Deinstitutionalization","def":"The late 20th-century movement to close asylums. With new medications, patients could be treated with a combination of medication and therapy on an outpatient basis.","hook":"","asks":[{"q":"In the late 1900s, many asylums closed and patients were treated as outpatients with medication and therapy. What was this movement?","right":"Deinstitutionalization","wrong":[["The eclectic approach of mixing several types of therapy","That is a therapy style."],["Lobotomy","That is a surgery."],["The diathesis-stress model","That explains disorders."]],"exp":"Closing asylums and treating people outpatient."},{"q":"What made it possible to close many asylums in the late 20th century?","right":"New medications for outpatient care","wrong":[["Lobotomies that cured most patients' illnesses completely","Lobotomies didn't cure illness and reduced functioning."],["Hypnosis","Not the reason given."],["Eysenck's study","That questioned therapy."]],"exp":"New medications let patients be treated with medication and therapy as outpatients."},{"q":"Today, Rosa has schizophrenia but lives at home, takes medication and sees a therapist weekly. Which historical change made this kind of care common?","right":"Deinstitutionalization","wrong":[["The eclectic approach of combining many therapy methods","That is a therapy style, not the closing of asylums."],["Lobotomies","Those were psychosurgery."],["Biofeedback","That is a behavioral technique."]],"exp":"Closing asylums and treating people outpatient."}]}]},{"name":"Treatment today","cards":[{"term":"Biomedical therapy","def":"Medical interventions. The biomedical approach (medical model) uses pharmacology (drugs) to treat symptoms of mental illness and counteract imbalances in the brain. It also includes more invasive treatments: ECT, psychosurgery, TMS, and lobotomies.","hook":"","asks":[{"q":"A psychiatrist treats a patient's depression with medication to correct a chemical imbalance. What approach is this?","right":"Biomedical therapy","wrong":[["Psychotherapy, talking with a trained therapist","Psychotherapy uses conversation, not drugs."],["Person-centered therapy","That is humanistic."],["Token economy","That is behavioral."]],"exp":"The medical model uses drugs to treat symptoms."},{"q":"Which list contains only biomedical treatments?","right":"Medication, ECT, TMS","wrong":[["CBT, REBT and DBT, which all work on thoughts and behavior","Those are psychotherapies."],["Free association, hypnosis","Those are psychodynamic techniques."],["Token economy, biofeedback","Those are behavioral therapies."]],"exp":"Biomedical: drugs plus ECT, psychosurgery, TMS and lobotomies."},{"q":"A psychiatrist says, \"Your depression is partly a chemical imbalance, so we'll start with medication.\" Which approach is she using?","right":"The biomedical (medical) model","wrong":[["The humanistic approach of acceptance and personal growth","That focuses on growth and acceptance."],["Psychodynamic therapy","That explores the unconscious."],["Behavioral therapy","That uses conditioning."]],"exp":"The medical model uses drugs to counteract imbalances in the brain."}]},{"term":"Psychotherapy","def":"Interactions between a trained therapist and someone seeking to overcome psychological difficulties. Usually treatment combines psychotherapy and biomedical treatment.","hook":"","asks":[{"q":"A client meets weekly with a trained therapist to talk through her problems and learn coping skills. What is this?","right":"Psychotherapy","wrong":[["Biomedical therapy using medication prescribed by a doctor","No medication is involved."],["Pharmacology","That is drug use."],["ECT","That uses electricity."]],"exp":"Interactions between a therapist and a client."},{"q":"What is usually the most effective plan, according to your slides?","right":"Psychotherapy plus biomedical treatment","wrong":[["Medication alone, without any psychotherapy or follow-up at all","Treatment usually combines both."],["Psychotherapy alone, never medication","Treatment usually combines both."],["Hypnosis alone","Not on your slides."]],"exp":"Usually treatment combines psychotherapy and biomedical treatment."},{"q":"Which of these is psychotherapy rather than biomedical therapy?","right":"Weekly CBT sessions with a therapist","wrong":[["A daily dose of lithium prescribed by a psychiatrist for bipolar","That is medication."],["ECT","That is biomedical."],["rTMS","That is biomedical."]],"exp":"Psychotherapy is interaction with a trained therapist."}]},{"term":"Who can prescribe","def":"Medications and biomedical therapies can only be prescribed by a doctor or psychiatrist. Most psychotherapy is done by clinical psychologists and psychotherapists.","hook":"","asks":[{"q":"A clinical psychologist wants to give her client an antidepressant. What does she need to do?","right":"Refer the client to a doctor or psychiatrist","wrong":[["Write the prescription herself after a single therapy session","Only doctors and psychiatrists can prescribe."],["Use free association instead","That doesn't solve prescribing."],["Nothing; anyone can prescribe","Only doctors and psychiatrists can."]],"exp":"Medications can only be prescribed by a doctor or psychiatrist."},{"q":"Which professional can prescribe ECT?","right":"A psychiatrist or doctor","wrong":[["A clinical psychologist with a doctorate degree in psychology","Only doctors and psychiatrists can prescribe biomedical therapies."],["A group therapy leader","They can't prescribe."],["A school counselor","They can't prescribe."]],"exp":"Medications and biomedical therapies can only be prescribed by a doctor or psychiatrist."},{"q":"Who does most of the psychotherapy?","right":"Clinical psychologists and psychotherapists","wrong":[["Psychiatrists, who mostly prescribe medication and run ECT","Most psychotherapy is done by psychologists and psychotherapists."],["Pharmacists","Not on your slides."],["Surgeons","Not on your slides."]],"exp":"Most psychotherapy is done by clinical psychologists and psychotherapists."}]},{"term":"Eclectic approach","def":"Combining therapy methods from the approaches that best fit the client's case. Most psychologists and therapists use it, choosing from biological, psychoanalytic, humanistic, behavioral, cognitive, group, sociocultural, and evolutionary approaches.","hook":"Eclectic = a mix.","asks":[{"q":"A therapist uses CBT techniques, some humanistic listening, and suggests medication, depending on what fits the client. What approach is this?","right":"The eclectic approach","wrong":[["A strict psychodynamic approach based only on Freud","She mixes methods."],["The medical model only","She uses more than medication."],["Deinstitutionalization","That is a historical movement."]],"exp":"Combining methods to fit the client's case."},{"q":"Why do most therapists use the eclectic approach?","right":"To fit methods to each client's case","wrong":[["Because only one approach to therapy has ever been proven to work","Eclectic means combining approaches."],["Because it avoids all medication","It can include biological methods."],["Because the law requires it","Not on your slides."]],"exp":"Combining the methods that best fit the case."},{"q":"Which therapist is using the eclectic approach?","right":"One who mixes CBT and humanistic methods","wrong":[["One who uses only Freud's free association for every client","That is one approach only."],["One who only prescribes","That is the medical model only."],["One who uses only token economies","That is one approach only."]],"exp":"Eclectic = a mix of approaches."}]}]},{"name":"Medications","cards":[{"term":"Psychotropic medications","def":"Drugs used to treat mental illness. They don't cure the disorder or treat the underlying cause; they treat the symptoms by interacting with neurotransmitters. Classes: anti-anxiety, antidepressants, and antipsychotics. Usually used with psychotherapy.","hook":"","asks":[{"q":"A patient asks if his medication will cure his disorder. What does your slide say?","right":"It treats the symptoms, not the cause","wrong":[["It permanently cures the disorder within just a few weeks","Psychotropic drugs don't cure the disorder."],["It works only with hypnosis","Not on your slides."],["It replaces all therapy","Usually treatment combines both."]],"exp":"They interact with neurotransmitters to treat symptoms."},{"q":"What do psychotropic medications actually do, according to your slides?","right":"Treat symptoms via neurotransmitters","wrong":[["Cure the underlying cause of the disorder permanently and quickly","They don't cure the disorder or its cause."],["Replace the need for any therapy","They're usually used with psychotherapy."],["Change a person's genes","Not on your slides."]],"exp":"They interact with neurotransmitters to treat symptoms."},{"q":"Which three classes of psychotropic medication are on your slides?","right":"Anti-anxiety, antidepressants, antipsychotics","wrong":[["Stimulants, depressants and hallucinogens, the drugs of abuse","Those are psychoactive drug categories."],["Antabuse, lithium, caffeine","Not the three classes listed."],["Agonists, antagonists, placebos","Those describe how drugs act."]],"exp":"Classes: anti-anxiety, antidepressants, antipsychotics."}]},{"term":"Pharmacology","def":"The use of drugs. Part of biomedical therapy.","hook":"","asks":[{"q":"Which part of biomedical therapy refers to the use of drugs?","right":"Pharmacology","wrong":[["Psychotherapy, talking with a trained therapist","That is talk therapy."],["Biofeedback","That uses sensors."],["Free association","That is psychodynamic."]],"exp":"Pharmacology = the use of drugs."},{"q":"A researcher studies how a new drug changes symptoms of depression. Which field of biomedical therapy is this?","right":"Pharmacology","wrong":[["Psychotherapy, the talking cure between a therapist and client","That is talk therapy."],["Biofeedback","That uses body sensors."],["Psychosurgery","That is surgery."]],"exp":"Pharmacology = the use of drugs."},{"q":"Which treatment falls under pharmacology?","right":"Prescribing Zoloft","wrong":[["Holding a session of free association with a client","That is psychodynamic."],["ECT","That is electrical, not a drug."],["A fear hierarchy","That is behavioral."]],"exp":"Zoloft is a drug, so prescribing it is pharmacology."}]},{"term":"Antidepressants","def":"Typically SSRIs (selective serotonin reuptake inhibitors), which block the reuptake of serotonin. Examples: Prozac, Paxil, Zoloft. Side effects: fatigue, forgetfulness, insomnia, weight gain.","hook":"","asks":[{"q":"A doctor prescribes Prozac, which blocks the reuptake of serotonin. What type of drug is it?","right":"An antidepressant","wrong":[["An antipsychotic that blocks dopamine receptors","Antipsychotics block dopamine."],["A mood stabilizer","That is lithium for bipolar."],["An anti-anxiety drug","Those increase GABA."]],"exp":"Antidepressants are typically SSRIs."},{"q":"A patient on Paxil complains of feeling tired, forgetful and unable to sleep. What explains this?","right":"Side effects of an SSRI antidepressant","wrong":[["Tardive dyskinesia caused by long-term antipsychotic use","That is a movement disorder from antipsychotics."],["Dependency on benzodiazepines","Paxil isn't a benzodiazepine."],["Withdrawal from lithium","Not described."]],"exp":"SSRI side effects: fatigue, forgetfulness, insomnia, weight gain."},{"q":"How does an SSRI like Prozac work?","right":"It blocks serotonin reuptake","wrong":[["It blocks dopamine receptors to reduce hallucinations and delusions","That is how antipsychotics work."],["It increases the effects of GABA","That is anti-anxiety drugs."],["It makes alcohol cause sickness","That is Antabuse."]],"exp":"SSRIs keep serotonin in the synapse longer."}]},{"term":"Anti-anxiety medications","def":"Reduce anxiety symptoms (tension, fear, nervousness) by depressing the central nervous system and increasing the effects of GABA. Also known as benzodiazepines. Examples: Xanax, Librium, Lorazepam, Valium, D-cycloserine (OCD and phobias). Side effects: drowsiness and dependency.","hook":"","asks":[{"q":"A drug calms a patient's panic by increasing the effects of GABA. What type of medication is it?","right":"An anti-anxiety medication","wrong":[["An antidepressant that blocks serotonin reuptake","That targets serotonin."],["An antipsychotic","That blocks dopamine."],["A stimulant","That excites the nervous system."]],"exp":"Anti-anxiety drugs (benzodiazepines) increase GABA."},{"q":"D-cycloserine appears on your slides as an anti-anxiety drug used for which conditions?","right":"OCD and phobias","wrong":[["Schizophrenia and the most severe forms of bipolar disorder","Those are treated with antipsychotics."],["Bipolar disorder only","That is lithium."],["Alcoholism","That is Antabuse."]],"exp":"D-cycloserine is listed for OCD and phobias."},{"q":"Why might a doctor be cautious about long-term Xanax use?","right":"It can cause dependency","wrong":[["It causes tardive dyskinesia in almost everyone who uses it","That is an antipsychotic side effect."],["It triggers seizures","That is ECT."],["It blocks serotonin","That is SSRIs."]],"exp":"Side effects: drowsiness and dependency."}]},{"term":"Antipsychotics","def":"Also called neuroleptics. Treat schizophrenia and severe bipolar disorder by blocking dopamine receptors, reducing positive symptoms (hallucinations, delusions); also help negative symptoms like apathy and flat affect. Examples: Haldol, Thorazine. Side effects: tardive dyskinesia, weight gain.","hook":"","asks":[{"q":"A patient with schizophrenia gets a drug that blocks dopamine receptors and reduces his hallucinations. What type of drug is it?","right":"An antipsychotic","wrong":[["An antidepressant that raises serotonin in the synapse","That targets serotonin."],["A mood stabilizer","That is for bipolar disorder."],["An anti-anxiety drug","That increases GABA."]],"exp":"Antipsychotics (neuroleptics) block dopamine."},{"q":"Which symptoms do antipsychotics mainly reduce?","right":"Hallucinations and delusions","wrong":[["Panic attacks and the constant worry of generalized anxiety","Those are treated with anti-anxiety drugs or therapy."],["Low serotonin mood","That is antidepressants."],["Alcohol cravings","That is Antabuse."]],"exp":"They block dopamine receptors, reducing positive symptoms."},{"q":"Haldol and Thorazine belong to which class, and which side effects do they carry?","right":"Antipsychotics; tardive dyskinesia, weight gain","wrong":[["Antidepressants; fatigue, forgetfulness and insomnia at night","Those are SSRI side effects."],["Anti-anxiety drugs; drowsiness","Haldol and Thorazine are antipsychotics."],["Mood stabilizers; none","Not correct."]],"exp":"Antipsychotics (neuroleptics): Haldol, Thorazine."}]},{"term":"Tardive dyskinesia","def":"A medication-induced movement disorder with repetitive, involuntary movements. A side effect of antipsychotics.","hook":"","asks":[{"q":"After years on an antipsychotic, a patient develops repetitive, involuntary movements of his face. What side effect is this?","right":"Tardive dyskinesia","wrong":[["Catatonic stupor, a lack of all movement","That is a symptom of schizophrenia, not a drug side effect."],["Narcolepsy","That is a sleep disorder."],["A fugue state","That is dissociative."]],"exp":"A movement disorder caused by antipsychotics."},{"q":"A man who has taken Thorazine for years now makes repetitive movements he can't control. What is this called?","right":"Tardive dyskinesia","wrong":[["Disorganized motor movement from untreated schizophrenia","That is a symptom of schizophrenia; this is a drug side effect."],["Catatonic stupor","That is no movement."],["A compulsion","That is OCD."]],"exp":"A medication-induced movement disorder from antipsychotics."},{"q":"Which class of drug can cause tardive dyskinesia?","right":"Antipsychotics","wrong":[["Antidepressants like Prozac, Paxil and Zoloft (SSRIs)","Their listed side effects are fatigue, forgetfulness, insomnia, weight gain."],["Benzodiazepines","Their side effects are drowsiness and dependency."],["Lithium","Not listed for tardive dyskinesia."]],"exp":"Tardive dyskinesia is an antipsychotic side effect."}]},{"term":"Mood stabilizers","def":"Used to treat bipolar disorder. Example: lithium.","hook":"Lithium = bipolar.","asks":[{"q":"Which medication is used to treat bipolar disorder?","right":"Lithium, a mood stabilizer","wrong":[["Prozac, an SSRI that blocks the reuptake of serotonin","That is an antidepressant."],["Xanax","That is an anti-anxiety drug."],["Antabuse","That is for alcohol use."]],"exp":"Lithium = bipolar."},{"q":"Ana alternates between manic weeks and deep depressions. Her psychiatrist wants to even out both highs and lows. Which drug class fits?","right":"A mood stabilizer like lithium","wrong":[["An antidepressant alone, to lift the depressive episodes only","Bipolar disorder is treated with mood stabilizers."],["An anti-anxiety drug","Not for bipolar disorder."],["Antabuse","That is for alcoholism."]],"exp":"Lithium = bipolar."},{"q":"Which pairing of drug and disorder is correct?","right":"Lithium and bipolar disorder","wrong":[["Lithium and schizophrenia's positive symptoms like hallucinations","Those are treated with antipsychotics."],["Haldol and depression","Haldol is an antipsychotic."],["Xanax and bipolar","Xanax is anti-anxiety."]],"exp":"Mood stabilizers like lithium treat bipolar disorder."}]}]},{"name":"Brain treatments","cards":[{"term":"Lobotomy","def":"A psychosurgery that cuts the main neural connections leading to the frontal lobe. Rarely used today. It may calm behavior but reduces functioning and awareness and can lead to a vegetative state.","hook":"","asks":[{"q":"Why are lobotomies rarely used today?","right":"They reduce functioning and awareness","wrong":[["They were found to cure every disorder far too quickly","They don't cure disorders."],["They require hypnosis","Not related."],["They only work in children","Not on your slides."]],"exp":"A lobotomy may calm behavior but reduces functioning and awareness."},{"q":"What did a lobotomy physically do?","right":"Cut the main connections to the frontal lobe","wrong":[["Sent magnetic pulses through a coil held near the patient's skull","That is rTMS."],["Caused a 30–60 second seizure","That is ECT."],["Blocked dopamine","That is antipsychotics."]],"exp":"Psychosurgery that cuts the main neural connections to the frontal lobe."},{"q":"Which outcome of lobotomies is on your slides?","right":"Possible vegetative state","wrong":[["Improved memory and sharper awareness for most patients","It reduces functioning and awareness."],["A complete cure","It doesn't cure."],["No side effects","It has serious effects."]],"exp":"It may calm behavior but reduces functioning and can lead to a vegetative state."}]},{"term":"Transcranial magnetic stimulation (rTMS)","def":"Repeated pulses surge through a magnetic coil held near the skull; the pulses induce electrical currents that stimulate neurons and change brain activity. Used for chronic depression. Benefits: no seizures, no memory loss, and the person is awake.","hook":"","asks":[{"q":"A doctor holds a magnetic coil near a patient's skull to stimulate neurons and treat chronic depression while he stays awake. What treatment is this?","right":"rTMS","wrong":[["ECT, which causes a seizure with an electric current","ECT uses electric current and causes a seizure."],["Lobotomy","That is surgery."],["Biofeedback","That uses body sensors."]],"exp":"Repeated magnetic pulses stimulate neurons."},{"q":"What makes rTMS different from ECT for a patient?","right":"No seizure, no memory loss, awake","wrong":[["It uses a stronger electric current of over 100 volts","rTMS uses magnetic pulses."],["It requires surgery","It doesn't."],["It is used for schizophrenia only","It's used for chronic depression."]],"exp":"rTMS benefits: no seizures, no memory loss, the person is awake."},{"q":"How does rTMS change brain activity?","right":"Magnetic pulses induce currents in neurons","wrong":[["Electrodes pass a strong current through the head to cause a seizure","That is ECT."],["Drugs block dopamine","That is antipsychotics."],["Surgery cuts connections","That is a lobotomy."]],"exp":"Pulses through a coil near the skull stimulate neurons."}]},{"term":"Electroconvulsive therapy (ECT)","def":"Electrodes on one or both sides of the head pass an electric current (up to 100 volts), causing a seizure for 30–60 seconds. Used for extreme depression; reduces the risk of suicide. Drawbacks: memory loss, 40% relapse into depression within 6 months, and no one knows why it works.","hook":"","asks":[{"q":"For a patient with extreme depression and a high risk of suicide, a doctor uses an electric current to cause a brief seizure. What is this?","right":"ECT","wrong":[["rTMS, which uses magnetic pulses near the skull","rTMS uses magnets and doesn't cause seizures."],["A lobotomy","That is surgery."],["Antabuse","That is a drug for alcohol."]],"exp":"ECT causes a 30–60 second seizure."},{"q":"Which is listed as a benefit of ECT?","right":"It reduces the risk of suicide","wrong":[["It causes no memory loss at all, unlike every other treatment","Memory loss is a drawback."],["Everyone stays well afterward","About 40% relapse within 6 months."],["We know exactly why it works","No one knows why it works."]],"exp":"ECT is used for extreme depression and reduces suicide risk."},{"q":"A doctor says, \"We don't fully understand why this treatment works, and memory loss is possible.\" Which treatment is she describing?","right":"ECT","wrong":[["rTMS, which uses repeated magnetic pulses on the brain","rTMS has no memory loss."],["SSRIs","Their side effects are different."],["DBT","That is a psychotherapy."]],"exp":"ECT drawbacks: memory loss, relapse, and no one knows why it works."}]}]},{"name":"Psychotherapy basics","cards":[{"term":"Confidentiality (cardinal rule)","def":"The cardinal rule of psychotherapy: the therapist must keep the patient's information confidential unless they believe the patient is a danger to themselves or others.","hook":"","asks":[{"q":"When may a therapist break confidentiality?","right":"When the patient is a danger to self or others","wrong":[["Whenever the patient's family members call and ask about them","Families don't automatically get access."],["Never, for any reason at all","There is an exception for danger."],["When the therapist is curious","Not a valid reason."]],"exp":"The cardinal rule, with an exception for danger."},{"q":"A client tells her therapist she cheated on a test. Can the therapist tell the school?","right":"No; she's no danger to herself or others","wrong":[["Yes, therapists must report any rule-breaking that clients mention","Confidentiality only breaks for danger to self or others."],["Yes, if the school asks","Not without a danger exception."],["Only in group therapy","Not a rule."]],"exp":"Confidentiality holds unless the client is a danger to themselves or others."},{"q":"Why is confidentiality called the \"cardinal rule\" of psychotherapy?","right":"It's the most important rule","wrong":[["It is the only ethics principle that applies to every single therapist","The other principles also apply."],["It can never be broken","It can be broken for danger."],["It was invented by Rogers","Not on your slides."]],"exp":"Cardinal rule = the most important rule."}]},{"term":"Cultural humility","def":"A \"self-first\" approach to sociocultural differences: learning about your own biases so you become more accepting of others. Self-reflection plus openness to understanding other cultures, and acknowledging power imbalances in society. First developed in physical healthcare.","hook":"","asks":[{"q":"A therapist reflects on her own biases before working with clients from different cultures. What is she practicing?","right":"Cultural humility","wrong":[["Unconditional positive regard toward every one of her clients","That is accepting the client, not examining her own biases."],["Resistance","That is a mental block in therapy."],["Free association","That is a psychodynamic method."]],"exp":"A self-first approach to cultural differences."},{"q":"A therapist reflects on her own biases and acknowledges power imbalances before working with clients from other cultures. What is she practicing?","right":"Cultural humility","wrong":[["Unconditional positive regard toward everything the client does","That is accepting the client; this is examining herself."],["Integrity","That is honesty."],["Non-directive therapy","That is about listening."]],"exp":"A self-first approach to cultural differences."},{"q":"Where was cultural humility first developed, according to your slides?","right":"In physical healthcare","wrong":[["In Freud's psychoanalysis sessions with patients in Vienna","Not on your slides."],["In prisons","Not on your slides."],["In schools","Not on your slides."]],"exp":"First developed in physical healthcare."}]},{"term":"Therapeutic alliance","def":"A trusting bond between the patient and therapist. Core elements on your slide: goals, tasks, bond, trust, collaboration, and agreement.","hook":"","asks":[{"q":"Research shows therapy works best when patient and therapist trust each other and agree on goals. What is this bond called?","right":"The therapeutic alliance","wrong":[["Unconditional positive regard from the therapist alone","That is one attitude, not the shared bond."],["Transference","Not on your slides."],["The eclectic approach","That is mixing methods."]],"exp":"Goals, tasks, bond, trust, collaboration and agreement."},{"q":"Two therapists use the same CBT techniques, but one's clients improve more. What factor might explain it?","right":"A stronger therapeutic alliance","wrong":[["Using a larger dose of medication during each therapy session","Therapists don't prescribe; the factor here is the bond."],["Less agreement on goals","Agreement helps."],["Less trust","Trust helps."]],"exp":"Therapy works best with a trusting bond between patient and therapist."},{"q":"Which list names core elements of the therapeutic alliance on your slide?","right":"Goals, tasks, bond, trust","wrong":[["Empathy, congruence and unconditional positive regard together","Those are the parts of person-centered therapy."],["Identify, challenge, replace","Those are REBT steps."],["Alarm, resistance, exhaustion","Those are GAS stages."]],"exp":"Goals, tasks, bond, trust, collaboration, agreement."}]},{"term":"Hans Eysenck","def":"In the 1950s, his study concluded that psychotherapies, especially psychoanalysis, were no more effective than no treatment at all.","hook":"","asks":[{"q":"Which researcher concluded in the 1950s that psychotherapy was no more effective than no treatment?","right":"Hans Eysenck","wrong":[["Carl Rogers, who developed person-centered therapy","Rogers developed client-centered therapy."],["Aaron Beck","Beck developed a cognitive theory of depression."],["Albert Ellis","Ellis developed REBT."]],"exp":"Eysenck's 1950s study."},{"q":"Which conclusion did Hans Eysenck reach in the 1950s?","right":"Therapy was no better than no treatment","wrong":[["Psychoanalysis was the most effective treatment available","He found it especially ineffective."],["Medication should replace therapy","Not his conclusion."],["Group therapy cures everything","Not his conclusion."]],"exp":"Eysenck: psychotherapies, especially psychoanalysis, were no more effective than no treatment."},{"q":"Which type of therapy did Eysenck especially criticize?","right":"Psychoanalysis","wrong":[["Systematic desensitization using fear hierarchies and relaxation","Not the therapy he singled out."],["DBT","Not on his study."],["Biofeedback","Not on his study."]],"exp":"He found psychoanalysis especially no better than no treatment."}]},{"term":"Is psychotherapy effective?","def":"Today, meta-analysis of many studies shows it is, especially with medication. It works best with a therapeutic alliance, the patient's positive expectations that therapy will work, and a specific action plan.","hook":"","asks":[{"q":"What does modern research say about Eysenck's claim that therapy doesn't work?","right":"Meta-analyses show it does work","wrong":[["He was right; most therapy is no better than doing nothing at all","Meta-analysis shows it is effective."],["Only hypnosis works","Not on your slides."],["Only lobotomies work","Not true."]],"exp":"It works, especially with medication and a strong therapeutic alliance."},{"q":"According to your slides, which three things help therapy work best?","right":"Alliance, positive expectations, an action plan","wrong":[["Hypnosis, dream interpretation and free association together","Those are techniques, not the factors listed."],["Medication only","It works best with medication, but that isn't the list."],["Longer sessions","Not on your slides."]],"exp":"Therapeutic alliance, positive expectations, a specific action plan."},{"q":"What kind of research shows psychotherapy is effective today?","right":"Meta-analyses of many studies","wrong":[["A single case study of one patient over a few years of treatment","One case can't show effectiveness."],["Eysenck's 1950s study","That concluded the opposite."],["Hypnosis records","Not on your slides."]],"exp":"Meta-analysis combines many studies."}]}]},{"name":"Ethics","cards":[{"term":"Fidelity and responsibility","def":"Build trust with the client, take responsibility for your actions, and maintain professional responsibility.","hook":"","asks":[{"q":"A therapist builds trust with her client and owns up when she makes a mistake. Which ethics principle is this?","right":"Fidelity and responsibility","wrong":[["Beneficence and nonmaleficence, meaning do no harm","That is about weighing harm."],["Justice","That is fairness."],["Integrity","That is honesty."]],"exp":"Build trust and take responsibility."},{"q":"A therapist double-booked a session, apologizes, and fixes the schedule so it won't happen again. Which principle is this?","right":"Fidelity and responsibility","wrong":[["Justice, giving all clients fair and equal access to care","That is about equal access."],["Integrity","That is honesty."],["Respect for rights and dignity","That is privacy and choice."]],"exp":"Build trust and take responsibility for your actions."},{"q":"Which action best shows fidelity and responsibility?","right":"Owning a mistake and keeping trust","wrong":[["Treating every single client equally re
