 Hawthorne effect, Barnum effect, confounding variables, hindsight bias, overconfidence, gambler's fallacy, social desirability bias, self-report bias, sampling bias, and wording effects (framing).","hook":"","asks":[{"q":"Which of these is one of the 11 problems with research on your slides?","right":"Wording effects (framing)","wrong":[["Operational definitions of variables","Those help research; they aren't a problem."],["Random sampling","That improves research."],["Debriefing","That is an ethics guideline."]],"exp":"Wording effects are on the list, along with placebo, Hawthorne and Barnum effects, and others."},{"q":"Which is on your slides' list of problems with research?","right":"Social desirability bias","wrong":[["Informed consent given by participants before the study begins","That is an ethics guideline."],["Replication","That improves research."],["Random sampling","That improves research."]],"exp":"Social desirability bias is one of the 11 problems."}]},{"term":"Placebo effect","def":"Experimental results caused by expectations alone. Example: participants act or claim to feel a certain way because they think they received a drug that would cause that reaction.","hook":"","asks":[{"q":"Patients given a sugar pill report less pain because they think it's medicine. What is this?","right":"The placebo effect","wrong":[["The Hawthorne effect","That is changing behavior because you're watched."],["The Barnum effect","That is believing general descriptions fit you."],["Social desirability bias","That is answering to look good."]],"exp":"Results caused by expectations alone."},{"q":"Why do drug studies give the control group a sugar pill instead of nothing?","right":"To account for the placebo effect","wrong":[["To make the control group feel guilty about not taking the real drug","Not the reason."],["To cause side effects","Not the reason."],["To save money","Not the reason."]],"exp":"Expectations alone can cause results."}]},{"term":"Hawthorne effect","def":"Participants changing their behavior because they know they are being observed.","hook":"Hawthorne = \"they're watching.\"","asks":[{"q":"Factory workers work harder during a study simply because they know researchers are watching. What is this?","right":"The Hawthorne effect","wrong":[["The placebo effect","There is no fake treatment here."],["Sampling bias in choosing the workers","That is about who is chosen to participate."],["Gambler's fallacy","That is seeing patterns in random data."]],"exp":"\"They're watching\" changes behavior."},{"q":"Why might observers hide behind a one-way mirror?","right":"So people don't act differently when watched","wrong":[["To make the placebo effect stronger in the group getting the drug","Not related."],["To get informed consent","That is done beforehand."],["To randomize the sample","Not related."]],"exp":"The Hawthorne effect: behaving differently because you know you're observed."}]},{"term":"Barnum effect","def":"Believing that personality descriptions apply specifically to you (more than to other people), even though the description is filled with information that applies to everyone. Example: your horoscope.","hook":"","asks":[{"q":"Lena reads a personality reading that says \"You sometimes doubt yourself\" and thinks it describes her perfectly. What is this?","right":"The Barnum effect","wrong":[["The Hawthorne effect","She isn't being observed."],["Hindsight bias","Nothing is being judged after an outcome."],["Confirmation of a hypothesis","This is a general statement that fits everyone."]],"exp":"Vague descriptions that fit everyone feel personal, like horoscopes."},{"q":"Why do horoscopes feel accurate to so many people?","right":"Their vague statements fit almost everyone","wrong":[["They are based on large, random, representative samples of people","Not how horoscopes work."],["They are replicated studies","Not research."],["They use operational definitions","Not research."]],"exp":"The Barnum effect."}]},{"term":"Gambler's fallacy","def":"The tendency to overestimate the occurrence of patterns in random data.","hook":"","asks":[{"q":"A roulette player bets on black because red came up six times in a row. What error is this?","right":"Gambler's fallacy","wrong":[["Placebo effect from expectations","That is a result caused by expectations of a treatment."],["Barnum effect","That is about personality descriptions."],["Wording effect","That is about how questions are phrased."]],"exp":"Seeing patterns in random data."},{"q":"A basketball fan thinks a player who missed five shots is now \"due\" to make one. What error is this?","right":"Gambler's fallacy","wrong":[["Hindsight bias, which means believing you knew it all along afterward","This is a prediction, not hindsight."],["Barnum effect","Not about descriptions."],["Placebo effect","Not about treatments."]],"exp":"Overestimating patterns in random data."}]},{"term":"Social desirability bias","def":"People giving answers that may be dishonest because they are seeking approval and/or want to highlight their character strengths.","hook":"Answering to look good.","asks":[{"q":"On a survey, many students claim they never cheat, even those who do, because they want to look honest. What is this?","right":"Social desirability bias","wrong":[["The placebo effect","There is no treatment here."],["Sampling bias","That is about who is chosen."],["The gambler's fallacy about patterns","That is about random patterns."]],"exp":"Answering to look good."},{"q":"On a survey, almost everyone says they recycle every day. Which bias might inflate this?","right":"Social desirability bias","wrong":[["Sampling bias, from asking only a narrow group of people","Even a good sample may overreport."],["Hindsight bias","Not about outcomes."],["Gambler's fallacy","Not about chance."]],"exp":"Answering to look good."}]},{"term":"Self-report bias","def":"Participants try to affect the outcome of the research and/or are unrealistic about themselves. They may try to please the researcher or even purposely challenge the researcher's hypothesis.","hook":"","asks":[{"q":"A participant who guesses the study's hypothesis purposely answers the opposite way to mess it up. What problem is this?","right":"Self-report bias","wrong":[["The Barnum effect","That is about vague personality descriptions."],["A confounding variable","That is an outside influence, not a participant's choice."],["Hindsight bias","That is \"I knew it all along.\""]],"exp":"Participants trying to affect the outcome or being unrealistic about themselves."},{"q":"Which participant shows self-report bias?","right":"One who answers to help the researcher's hypothesis","wrong":[["One who simply forgets to fill out the survey before the due date","That is nonresponse."],["One chosen at random","Not a bias."],["One in the control group","Not a bias."]],"exp":"Participants try to affect the outcome or please the researcher."}]},{"term":"Sampling bias","def":"Researchers targeting participants to make their hypothesis more likely to be proven, or failing to gather a representative sample of the population, leading to skewed results.","hook":"","asks":[{"q":"To show a new snack is popular, a company surveys only people leaving its own store. What problem is this?","right":"Sampling bias","wrong":[["The Hawthorne effect","Being watched isn't the issue."],["The Barnum effect","That is about personality descriptions."],["The placebo effect","There is no fake treatment."]],"exp":"The sample isn't representative of the population."},{"q":"A study of teen sleep uses only students from an elite boarding school. What is the problem?","right":"The sample isn't representative","wrong":[["The sample is much too large to finish analyzing in a short time","Size isn't the problem."],["It lacks a theory","Not the issue."],["It's unethical","Not the issue."]],"exp":"Sampling bias: failing to get a representative sample."}]},{"term":"Wording effects (framing)","def":"How questions are worded can skew responses.","hook":"","asks":[{"q":"More people support a policy described as \"helping the poor\" than one described as \"welfare.\" What explains this?","right":"Wording effects","wrong":[["Sampling bias","The same people could answer differently based on the wording."],["The placebo effect","There is no treatment."],["Hindsight bias","Nothing is judged after an outcome."]],"exp":"How a question is worded can skew answers."},{"q":"Which survey question is worded most neutrally?","right":"\"How do you feel about the new lunch menu?\"","wrong":[["\"Don't you agree the new lunch menu is a total disaster for students?\"","That pushes one answer."],["\"Isn't the menu great?\"","That pushes one answer."],["\"Why do you hate the menu?\"","That assumes an answer."]],"exp":"How a question is worded can skew responses."}]}]},{"name":"Ethics","cards":[{"term":"Why ethics guidelines exist","def":"Many famous psychology experiments were highly unethical and cannot be replicated. The American Psychological Association (APA) set principles to protect everyone involved in research.","hook":"","asks":[{"q":"Why can't some famous early psychology experiments be repeated today?","right":"They broke today's ethics rules","wrong":[["The original data was lost","The reason on your slides is ethics."],["They were never published","They are famous; the issue is how they treated people."],["Modern computers can't analyze them","Technology isn't the problem."]],"exp":"The APA set principles to protect everyone involved in research."},{"q":"Who set the ethics principles for psychology research, according to your slides?","right":"The American Psychological Association","wrong":[["The DSM-5, the manual used to classify mental disorders","That classifies disorders."],["Each researcher alone","Not on your slides."],["The FDA","Not on your slides."]],"exp":"The APA set principles to protect everyone involved."}]},{"term":"APA ethical guidelines","def":"Voluntary participation, confidentiality, informed consent, debriefing, no long-term physical or psychological harm, animal participants must be well cared for, and approval from a research institution.","hook":"","asks":[{"q":"Which of these is NOT one of the APA ethical guidelines?","right":"Participants must be paid","wrong":[["Informed consent before the study","That is a guideline."],["Debriefing","That is a guideline."],["Confidentiality","That is a guideline."]],"exp":"The guidelines: voluntary participation, confidentiality, informed consent, debriefing, no long-term harm, care for animals, institutional approval."},{"q":"A study keeps data private, gets consent, debriefs, and was approved. Which guideline might it still be missing?","right":"Voluntary participation","wrong":[["Confidentiality, keeping every participant's information private","Already covered."],["Informed consent","Already covered."],["Debriefing","Already covered."]],"exp":"The guidelines also include voluntary participation, no long-term harm and care for animals."}]},{"term":"Voluntary participation","def":"People choose for themselves whether to take part in a study.","hook":"","asks":[{"q":"A teacher requires every student to join a study or lose points. Which guideline does this break?","right":"Voluntary participation","wrong":[["Debriefing","Debriefing is about explaining the study afterward."],["Confidentiality","That is about keeping information private."],["Approval from an institution","That is about getting the study approved."]],"exp":"People must choose for themselves whether to take part."},{"q":"A participant wants to leave a study halfway through. What should happen?","right":"She is allowed to leave","wrong":[["She must finish the study, since she already agreed to take part","Participation is voluntary."],["She loses her privacy","Not a consequence."],["She is debriefed instead","She can leave."]],"exp":"People choose for themselves whether to take part."}]},{"term":"Confidentiality","def":"Participants' information is kept private.","hook":"","asks":[{"q":"A researcher posts participants' names next to their depression scores online. Which guideline is broken?","right":"Confidentiality","wrong":[["Informed consent","That is about explaining the study before people agree."],["Voluntary participation","That is about choosing to take part."],["Debriefing","That is about explaining the study afterward."]],"exp":"Participants' information must be kept private."},{"q":"Which practice protects confidentiality?","right":"Using code numbers instead of names","wrong":[["Publishing every participant's name next to the results of the study","That breaks confidentiality."],["Telling families","Not without consent."],["Posting results by name","That breaks it."]],"exp":"Participants' information is kept private."}]},{"term":"Informed consent","def":"Giving potential participants enough information about the study to let them choose whether or not to participate.","hook":"Informed consent = BEFORE.","asks":[{"q":"Before a study starts, participants read what will happen and sign that they agree. What is this?","right":"Informed consent","wrong":[["Debriefing","Debriefing happens AFTER the study."],["Confidentiality of the data","That is keeping data private."],["Replication","That is repeating a study."]],"exp":"Informed consent = BEFORE."},{"q":"What must happen BEFORE a participant joins a study?","right":"Informed consent","wrong":[["Debriefing, which explains the full purpose of the study to them","That happens after."],["Replication","That is repeating the study."],["Data analysis","That happens later."]],"exp":"Informed consent = before."}]},{"term":"Debriefing","def":"The explanation after the experiment of what the study was about, including its purpose and any deception.","hook":"Debriefing = AFTER.","asks":[{"q":"After a study that used deception, the researcher explains its real purpose to the participants. What is this?","right":"Debriefing","wrong":[["Informed consent","That happens BEFORE the study."],["Operationalizing","That is defining how variables are measured."],["Replicating","That is repeating the study."]],"exp":"Debriefing = AFTER."},{"q":"A study told participants it was about memory but was really about honesty. What must happen at the end?","right":"Debriefing","wrong":[["Informed consent, which is gathered before the study ever starts","That happens before."],["Replication","That is repeating."],["Random sampling","That is choosing participants."]],"exp":"Debriefing = after, including any deception."}]},{"term":"No long-term harm","def":"Studies may not cause long-term physical or psychological harm.","hook":"","asks":[{"q":"A study plans to leave participants with lasting anxiety in order to test a theory. Which guideline does it break?","right":"Avoiding lasting harm","wrong":[["Voluntary participation in the study","Even willing participants can't be harmed long-term."],["Confidentiality","The problem is harm, not privacy."],["Institutional approval","Approval doesn't make lasting harm acceptable."]],"exp":"Studies may not cause long-term physical or psychological harm."},{"q":"Which planned study would break the no-long-term-harm rule?","right":"One that leaves people with lasting fear","wrong":[["One that asks people to solve a short puzzle for ten minutes","No lasting harm."],["One with a survey","No lasting harm."],["One with a placebo","No lasting harm."]],"exp":"No long-term physical or psychological harm."}]},{"term":"Animal participants","def":"All animal participants must be well cared for.","hook":"","asks":[{"q":"A lab keeps its research rats in dirty, crowded cages without enough food. Which guideline is broken?","right":"Care for animals in research","wrong":[["Informed consent from participants","Animals can't give consent; the rule is about their care."],["Debriefing","That applies to human participants after a study."],["Confidentiality","That is about human participants' privacy."]],"exp":"All animal participants must be well cared for."},{"q":"Which practice follows the guideline for animal participants?","right":"Giving lab animals clean housing and food","wrong":[["Skipping care for the animals because they cannot give their consent","They must be well cared for."],["Using no review board","That breaks institutional approval."],["Keeping animals in crowded cages","Not well cared for."]],"exp":"All animal participants must be well cared for."}]},{"term":"Institutional approval","def":"Research needs approval from a research institution.","hook":"","asks":[{"q":"A student starts a study on classmates without asking any review board. Which guideline is missing?","right":"Approval by a review board","wrong":[["Debriefing","That comes after the study."],["Replication","That is repeating a study."],["Random sampling of classmates","That is about choosing participants."]],"exp":"Research needs approval from a research institution."},{"q":"Before a study begins, who must approve it, according to your slides?","right":"A research institution","wrong":[["Only the participants who have already agreed to take part in it","They give consent, not approval."],["The DSM-5","Not a review body."],["No one","Approval is required."]],"exp":"Research needs approval from a research institution."}]}]}],"intro":["Everything on the Unit 0 Research Methods slides: why intuition fails, the scientific method, operational definitions, descriptive and correlational research, experiments, problems with research, and ethics."]},{"id":3,"name":"Statistics & Data","optional":false,"sections":[{"name":"Descriptive statistics","cards":[{"term":"Descriptive statistics","def":"Statistics that help researchers organize data meaningfully.","hook":"","asks":[{"q":"A teacher makes a chart of how many students got each letter grade to see the overall picture. What kind of statistics is this?","right":"Descriptive statistics","wrong":[["Inferential statistics","Those decide whether results apply to a larger population."],["A meta-analysis","That combines many studies."],["A p-value","That measures how likely results are due to chance."]],"exp":"Descriptive statistics organize data meaningfully."},{"q":"Which is an example of descriptive statistics?","right":"The class's average quiz score","wrong":[["A p-value showing that a result is unlikely to be due to chance","That is inferential."],["A meta-analysis","That combines studies."],["A hypothesis","That is a prediction."]],"exp":"Descriptive statistics organize data meaningfully."}]},{"term":"Frequency distribution","def":"A count of how often each score or range of scores appears, like the tally table of ages of people entering a store on your slide.","hook":"","asks":[{"q":"A store clerk tallies how many customers fall into each age group. What has the clerk made?","right":"A frequency distribution","wrong":[["A correlation coefficient","That is a number from -1 to +1."],["A standard deviation","That measures spread around the mean."],["A hypothesis","That is a prediction."]],"exp":"A count of how often each score or range appears."},{"q":"A teacher counts how many students got each score from 0 to 10. What has she made?","right":"A frequency distribution","wrong":[["A correlation between two different variables in the class","Only one variable is counted."],["A hypothesis","That is a prediction."],["A sample","That is the participants."]],"exp":"A count of how often each score appears."}]},{"term":"Histogram","def":"A bar graph that shows a frequency distribution. Useful because it displays data visually and makes patterns in a distribution quicker to spot.","hook":"","asks":[{"q":"The clerk turns the age tallies into a bar graph to spot patterns quickly. What is the graph?","right":"A histogram","wrong":[["A scatterplot","A scatterplot shows the relationship between two variables."],["A normal curve","That is a bell-shaped distribution, not a bar graph of tallies."],["A correlation","That is a relationship, not a graph type."]],"exp":"A histogram is a bar graph of a frequency distribution."},{"q":"Why use a histogram instead of a list of scores?","right":"Patterns are quicker to spot","wrong":[["It shows cause and effect between the scores and other variables","It doesn't show cause."],["It removes outliers","It doesn't."],["It's more private","Not the reason."]],"exp":"A histogram displays data visually."}]}]},{"name":"Central tendency","cards":[{"term":"Mean","def":"The average. Add up all the numbers, then divide by how many numbers there are. Example from your slides: 2, 3, 4, 5, 5, 8 → mean = 4.5.","hook":"","asks":[{"q":"Quiz scores are 6, 8, 10 and 12. What is the mean?","right":"9","wrong":[["8","That is not the average."],["10","That is not the average."],["6","That is the range."]],"exp":"Add the numbers (36) and divide by how many there are (4): 9."},{"q":"Scores are 2, 3, 4, 5, 5 and 8. What is the mean?","right":"4.5","wrong":[["5, which is the score that appears most often in the list","That is the mode."],["6","That is the range."],["4","Not the average."]],"exp":"Sum 27 ÷ 6 = 4.5."}]},{"term":"Median","def":"The middle number when the numbers are in numerical order. If there are two middle numbers, average them. Example from your slides: 2, 4, 5, 6, 9 → median = 5.","hook":"Median = middle, like the median strip in a road.","asks":[{"q":"Ages in a group are 12, 15, 16, 19 and 40. What is the median?","right":"16","wrong":[["20.4","That is the mean."],["28","That is the range."],["15","That is not the middle value."]],"exp":"In order, the middle number is 16."},{"q":"Scores are 3, 8, 10 and 12. What is the median?","right":"9","wrong":[["8.25, which is found by adding the scores and dividing by four","That is the mean."],["9.5","Not the median."],["10","Not the median."]],"exp":"Two middle numbers (8 and 10): average them to get 9."}]},{"term":"Mode","def":"The number that appears most frequently. Example from your slides: 1, 3, 6, 6, 8 → mode = 6.","hook":"Mode = most.","asks":[{"q":"Shoe sizes in a class: 7, 8, 8, 8, 9, 10. What is the mode?","right":"8","wrong":[["8.3","That is the mean."],["3","That is the range."],["9","That appears once."]],"exp":"The mode is the number that appears most often."},{"q":"A set has no repeated numbers: 1, 4, 6, 9. What is the mode?","right":"There is no mode","wrong":[["5, which is found by averaging the two middle numbers in the list","That is the median."],["4","Not repeated."],["8","That is the range."]],"exp":"The mode is the most frequent number; here none repeats."}]},{"term":"Percentile rank","def":"The percentage of scores that are less than a given score. Your slides call it a fourth measure of central tendency. Example: in the 85th percentile on a psychology test, your score is higher than 85% of your peers.","hook":"","asks":[{"q":"Jada is in the 70th percentile on the SAT. What does this mean?","right":"She scored higher than 70% of test takers","wrong":[["She answered 70% of the questions correctly","Percentile isn't percent correct."],["She was 70th from the top","Percentile isn't a place number."],["70% of people scored higher than her","That reverses it."]],"exp":"The percentage of scores below hers."},{"q":"If you are in the 90th percentile, about what percentage of scores were higher than yours?","right":"About 10%","wrong":[["About 90%, because the percentile tells you how many beat you","Percentile is the share below you."],["50%","Not correct."],["0%","Not correct."]],"exp":"90% of scores were lower, so about 10% were higher."}]}]},{"name":"Variation","cards":[{"term":"Measures of variation","def":"Tell us how similar or different scores are.","hook":"","asks":[{"q":"Two classes both average 80 on a test, but one class's scores are much more spread out. What kind of statistic shows this difference?","right":"A measure of variation","wrong":[["A measure of central tendency","Both classes have the same average."],["A correlation coefficient","That compares two variables."],["A p-value","That measures chance, not spread."]],"exp":"Variation tells how similar or different scores are."},{"q":"Which is a measure of variation?","right":"Standard deviation","wrong":[["The median, the middle score when all the scores are put in order","That is central tendency."],["The mode","Central tendency."],["The mean","Central tendency."]],"exp":"Range and standard deviation measure variation."}]},{"term":"Range","def":"The difference between the highest and lowest scores: subtract the lowest from the highest. Example from your slides: 75, 78, 86, 92, 98, 100 → 100 − 75 = 25. Only a rough estimate of variation.","hook":"","asks":[{"q":"Test scores are 55, 70, 82, 90 and 97. What is the range?","right":"42","wrong":[["82","That is the median."],["78.8","That is the mean."],["97","That is the highest score."]],"exp":"97 − 55 = 42."},{"q":"Why is the range only a rough estimate of variation?","right":"One extreme score can change it","wrong":[["It uses every score in the set equally to describe the spread","It uses only the highest and lowest."],["It ignores the highest score","It uses it."],["It's the same as the mode","It isn't."]],"exp":"Range = highest − lowest, a rough estimate."}]},{"term":"Standard deviation","def":"How much scores vary around the mean: whether they are packed together or spread out. A more useful measure of variation than the range.","hook":"Small SD = packed together. Big SD = spread out.","asks":[{"q":"Class A's scores have a standard deviation of 3; Class B's have one of 15. What does this tell you?","right":"Class B's scores are much more spread out","wrong":[["Class B scored higher on average","SD shows spread, not the average."],["Class A has more students","SD doesn't measure class size."],["Class A's scores are more spread out than Class B's","A smaller SD means scores are packed together."]],"exp":"Small SD = packed together; big SD = spread out."},{"q":"Why is standard deviation more useful than the range?","right":"It shows how scores spread around the mean","wrong":[["It uses only the single highest and lowest scores in the whole set","That describes the range."],["It finds the middle score","That is the median."],["It counts the most common score","That is the mode."]],"exp":"Standard deviation measures how scores vary around the mean."}]},{"term":"Normal curve","def":"A bell-shaped curve where most scores fall near the mean and fewer fall near either extreme.","hook":"","asks":[{"q":"Heights of adults form a bell shape with most people near average. What is this called?","right":"A normal curve","wrong":[["A bimodal curve","That has two peaks."],["A positive skew","That has a tail to the right."],["A negative skew","That has a tail to the left."]],"exp":"Most scores near the mean, fewer at the extremes."},{"q":"On a normal curve, where do most scores fall?","right":"Near the mean","wrong":[["At the two extremes, at the far ends of the curve","Fewer scores are at the extremes."],["Only at the median of a skewed set","Not the description."],["Evenly everywhere","It's bell-shaped."]],"exp":"Most scores fall near the mean."}]},{"term":"The 68% and 95% rule","def":"In a normal curve, about 68% of scores fall within 1 standard deviation of the mean, and about 95% within 2. Your slide's IQ example: mean 100, SD 15, so about 68% score 85–115 and about 95% score 70–130.","hook":"","asks":[{"q":"IQ has a mean of 100 and an SD of 15. About what percentage of people score between 85 and 115?","right":"68%","wrong":[["95%","That is within 2 SDs (70–130)."],["50%","That isn't the rule for 1 SD."],["99%","That isn't on your slides."]],"exp":"About 68% fall within 1 SD of the mean."},{"q":"With IQ mean 100 and SD 15, about what percentage score between 70 and 130?","right":"About 95%","wrong":[["About 68%, which covers just one standard deviation each way","That is 85–115."],["About 50%","Not correct."],["About 99%","Not on your slides."]],"exp":"About 95% fall within 2 SDs."}]}]},{"name":"Skewed data","cards":[{"term":"Outlier","def":"A score far away from the rest. One or two outliers can impact results, especially the mean. Your slide's example: a billionaire moving into a poor town could push the mean income to $1,000,000, so the median and mode give a fuller picture.","hook":"","asks":[{"q":"In a town of teachers, one billionaire moves in. Which measure of income will change the most?","right":"The mean","wrong":[["The mode","The mode stays at the most common income."],["The median","The middle income barely moves."],["The number of teachers","Only one person moved in."]],"exp":"Outliers pull the mean the most."},{"q":"Why does your slide suggest using the median and mode in a town with one billionaire?","right":"The outlier pulls the mean up","wrong":[["The billionaire lowers the median income for everyone else in town","The median barely moves."],["The mode becomes the billionaire's income","The mode stays the common income."],["Means can't be calculated","They can."]],"exp":"Outliers impact the mean most."}]},{"term":"Skewed distribution","def":"When an outlier disproportionately affects the mean, a few scores stretch away from the group like a tail. The skew is named for the direction of the tail.","hook":"Skew = where the tail goes.","asks":[{"q":"Most students finish a test in 30 minutes, but a few take over 2 hours, stretching the graph out on one side. What is the graph called?","right":"A skewed distribution","wrong":[["A normal curve","A normal curve is symmetrical."],["A bimodal curve","That has two peaks."],["A symmetrical distribution","One side has a long tail."]],"exp":"A few scores stretch away like a tail."},{"q":"How is a skewed distribution named?","right":"By the direction of its tail","wrong":[["By the location of its highest peak, where most of the scores sit","It's named for the tail."],["By its mean only","Named for the tail."],["By its sample size","Not related."]],"exp":"Skew = where the tail goes."}]},{"term":"Positive skew","def":"The tail goes to the right, and the mean goes to the right too. Order: mean > median > mode.","hook":"Tail toward the bigger (positive) numbers = positive.","asks":[{"q":"On a very hard test, most scores are low but a few students score very high. What shape is the distribution?","right":"Positively skewed","wrong":[["Negatively skewed","The tail goes toward the high scores, to the right."],["Symmetrical","The scores bunch on one side."],["Bimodal","There is only one peak."]],"exp":"Tail to the right = positive skew, and mean > median > mode."},{"q":"In a positively skewed set, which is largest?","right":"The mean","wrong":[["The mode, which stays right at the highest peak of the curve","In positive skew, mean > median > mode."],["The median","Between mean and mode."],["They're all equal","That is symmetrical."]],"exp":"Positive skew: mean > median > mode."}]},{"term":"Negative skew","def":"The tail goes to the left, and the mean goes to the left too. Order: mean \u003c median \u003c mode.","hook":"","asks":[{"q":"On an easy test, most students score high but a few score very low. What shape is the distribution?","right":"Negatively skewed","wrong":[["Positively skewed","The tail goes toward the low scores, to the left."],["Normal","The scores bunch at the high end."],["Bimodal","There is only one peak."]],"exp":"Tail to the left = negative skew, and mean \u003c median \u003c mode."},{"q":"In a negatively skewed set, which is largest?","right":"The mode","wrong":[["The mean, which gets pulled out toward the long tail on the left","In negative skew, mean \u003c median \u003c mode."],["The median","Between them."],["They're all equal","That is symmetrical."]],"exp":"Negative skew: mean \u003c median \u003c mode."}]},{"term":"Symmetrical distribution","def":"No skew: mean = median = mode.","hook":"","asks":[{"q":"In a data set, the mean, median and mode are all 50. What does this tell you about its shape?","right":"It is symmetrical, with no skew","wrong":[["It is positively skewed","Then the mean would be greater than the median."],["It is negatively skewed","Then the mean would be less than the median."],["It must have two separate peaks, so it is bimodal","Equal measures point to symmetry, not two peaks."]],"exp":"No skew: mean = median = mode."},{"q":"Which shape is symmetrical?","right":"A normal (bell) curve","wrong":[["A curve with a long tail that stretches out to the right side","That is skewed."],["A curve with a left tail","That is skewed."],["A curve with one tall bar","Not necessarily symmetrical."]],"exp":"Symmetrical: mean = median = mode."}]},{"term":"The mean follows the tail","def":"In a skewed distribution, the mean always moves in the direction of the tail. The mode stays at the peak.","hook":"","asks":[{"q":"A distribution's tail stretches to the left. Where will the mean be compared with the mode?","right":"To the left of the mode","wrong":[["To the right of the mode","The mean moves toward the tail, which is on the left."],["Exactly at the mode","Only in a symmetrical distribution."],["At the highest peak","The mode stays at the peak."]],"exp":"The mean always moves in the direction of the tail."},{"q":"In a skewed distribution, which measure stays at the peak?","right":"The mode","wrong":[["The mean, which moves toward whichever side the tail is on","The mean follows the tail."],["The range","Not a center."],["The median always","The mode stays at the peak."]],"exp":"The mean moves toward the tail; the mode stays at the peak."}]},{"term":"Bimodal curve","def":"A graph with two peaks (\"bi\" means two). Each peak is a local maximum: the highest values compared with the data points right around them.","hook":"","asks":[{"q":"A graph of customers by hour shows one peak at lunch and another at dinner. What kind of curve is this?","right":"Bimodal","wrong":[["Normal","A normal curve has one peak."],["Positively skewed","Skew is about a tail, not two peaks."],["Symmetrical","Two peaks make it bimodal."]],"exp":"\"Bi\" means two peaks."},{"q":"A test given to two very different classes produces scores with two peaks. What should the teacher conclude?","right":"There may be two distinct groups","wrong":[["The test was perfectly normal, with one big group of similar scores","Two peaks suggest two groups."],["The data is skewed right","That is about a tail."],["The mean is the peak","Not with two peaks."]],"exp":"Bimodal = two peaks."}]}]},{"name":"Inferential statistics","cards":[{"term":"Inferential statistics","def":"Statistics that help determine whether results can be generalized to a larger population: confirming that results aren't just random fluctuations in the participants sampled, but true of a population.","hook":"","asks":[{"q":"A researcher wants to know whether her results from 200 students are true of all teenagers, not just chance. What does she need?","right":"Inferential statistics","wrong":[["Descriptive statistics","Those organize data; they don't generalize it."],["A histogram","That displays data visually."],["A case study","That studies one person in depth."]],"exp":"Inferential statistics decide whether results can be generalized."},{"q":"Which question needs inferential statistics?","right":"Is this result true of all teens?","wrong":[["What was the average score in this one class of students today?","That is descriptive."],["What is the most common score?","Descriptive."],["What is the range?","Descriptive."]],"exp":"Inferential statistics decide whether results generalize."}]},{"term":"3 key principles","def":"1. Representative samples are better than unrepresentative samples. 2. Bigger samples are better than small ones. 3. More estimates are better than fewer estimates.","hook":"","asks":[{"q":"Which study gives the most trustworthy estimate of teen sleep habits?","right":"A large random sample of teens nationwide","wrong":[["Five of the researcher's friends","Small and unrepresentative."],["One teen studied in great depth","One person can't represent a population."],["Hundreds of teens who all visit one sleep clinic","Not representative of all teens."]],"exp":"Representative and bigger samples are better."},{"q":"Which principle explains why one poll of 2,000 voters beats one of 20?","right":"Bigger samples are better","wrong":[["Fewer estimates are better than having many estimates to compare","More estimates are better."],["Smaller samples are fairer","Bigger is better."],["Representativeness doesn't matter","It does."]],"exp":"Representative, bigger samples and more estimates."}]},{"term":"Meta-analysis","def":"Combining the estimates of many studies instead of focusing on just one. Useful because more estimates are better than fewer.","hook":"","asks":[{"q":"A researcher combines the results of 40 studies on exercise and mood into one estimate. What is this?","right":"A meta-analysis","wrong":[["A case study","That studies one person or group in depth."],["A replication of one study","That repeats one study."],["A survey","That collects self-reports from a sample."]],"exp":"More estimates are better than fewer."},{"q":"Which key principle does a meta-analysis put into practice?","right":"More estimates beat fewer","wrong":[["Smaller samples are better because they are easier to control","Bigger samples are better."],["Unrepresentative samples are fine","Representative is better."],["One study is enough","More estimates are better."]],"exp":"Combining many studies' estimates."}]},{"term":"The café example","def":"Alex asks two friends about Café Mocha (they love it) and two about Café Latte (they don't). Her conclusion isn't reliable because of an unrepresentative sample (her friends may have unique tastes) and a small sample size (two people each isn't enough).","hook":"","asks":[{"q":"Alex decides Café Mocha is better after asking two friends. What is the best criticism?","right":"Her sample is small and unrepresentative","wrong":[["She asked too many people, making her data messy","Two people is far too small."],["Her study had no hypothesis","The issue on your slides is the sample."],["She should have used a placebo","Placebos aren't relevant here."]],"exp":"Two friends each: unrepresentative and too small."},{"q":"How should Alex improve her café study?","right":"Ask many random customers","wrong":[["Ask the same two friends again, but with a longer set of questions","Still small and unrepresentative."],["Ask only one friend","Even smaller."],["Ask the café owners","Biased."]],"exp":"Fix the unrepresentative and small sample."}]},{"term":"Statistical significance","def":"An observed difference is statistically significant when the probability that it happened by chance is low enough to reject the null hypothesis. That means strong evidence the difference is due to something other than chance.","hook":"","asks":[{"q":"A study finds that a tutoring group scored higher, and the chance that this difference happened randomly is very low. What can researchers say?","right":"The difference is statistically significant","wrong":[["The tutoring caused a huge effect","Significance doesn't tell you the size of the effect."],["The results are due to chance","Low probability of chance means the opposite."],["The study must be replicated before it means anything","It can still be significant now."]],"exp":"Low probability of chance = statistically significant."},{"q":"If a result is statistically significant, what can researchers reject?","right":"The null hypothesis","wrong":[["The independent variable that they manipulated in the study","Not what is rejected."],["The sample","Not rejected."],["The theory itself, always","Not necessarily."]],"exp":"Low chance probability lets them reject the null hypothesis."}]},{"term":"P-value","def":"A number from 0 to 1 describing how likely it is that your data happened by random chance. The smaller the p-value, the less likely the results were due to chance. A p-value of .05 or less is statistically significant.","hook":"Small p = probably real.","asks":[{"q":"Which p-value gives the strongest evidence that results were NOT due to chance?","right":"p = .01","wrong":[["p = .30","That is too high to be significant."],["p = .50","That means a 50% chance it was random."],["p = .90","That is very likely due to chance."]],"exp":"The smaller the p-value, the less likely the result was chance; .05 or less is significant."},{"q":"A study reports p = .03. What does this mean?","right":"It's statistically significant","wrong":[["There is a 97% chance that the results happened by random chance","Small p means unlikely to be chance."],["The effect is huge","P doesn't show size."],["It's not significant",".03 is below .05."]],"exp":"A p-value of .05 or less is significant."}]},{"term":"Effect size","def":"The strength of the relationship between two variables. A p-value only tells you whether an effect exists; effect size tells you how strong it is. Your slide's example: a new study technique group averaged 85 vs. 75 for the usual group, a 10-point effect.","hook":"","asks":[{"q":"Two studies are both statistically significant, but one raised scores by 2 points and the other by 15. What does the difference show?","right":"They have different effect sizes","wrong":[["They have different p-values only","A p-value says whether an effect exists, not its size."],["One study must be wrong","Both can be significant with different strengths."],["Neither result is real","Both are significant."]],"exp":"Effect size tells how strong the relationship is."},{"q":"Which tells you how big a difference is, not just whether it exists?","right":"Effect size","wrong":[["The p-value, which tells how likely the result was due to chance","That shows whether an effect exists."],["The mode","Not related."],["The sample","Not a measure."]],"exp":"Effect size measures the strength of the relationship."}]}]}],"intro":["Everything on the 0.11 Statistical Reasoning slides: histograms, mean/median/mode, percentile rank, range, standard deviation, skew, bimodal curves, and inferential statistics."]}],"sq":[{"id":"SQ1","deck":2,"q":"A researcher records how children play at recess without interacting with them or changing anything. Which method is this?","opts":["Naturalistic observation","Case study","Survey","Experiment"],"ans":0,"exp":"Observing behavior in a natural setting without controlling it is naturalistic observation."},{"id":"SQ2","deck":2,"q":"Students who miss more school tend to have lower grades. This is a:","opts":["Negative correlation","Positive correlation","Zero correlation","Proven cause-and-effect relationship"],"ans":0,"exp":"One goes up while the other goes down: negative. It still doesn't prove absences cause the lower grades."},{"id":"SQ3","deck":2,"q":"A study tests whether caffeine improves memory. One group gets caffeine, the other gets none, then both take a memory test. What is the dependent variable?","opts":["Memory test scores","Caffeine","The group with no caffeine","The number of participants"],"ans":0,"exp":"The DV is what's measured. Caffeine is the IV (what the researcher changes)."},{"id":"SQ4","deck":2,"q":"In the caffeine study, the group that gets no caffeine is the:","opts":["Control group","Experimental group","Population","Confounding variable"],"ans":0,"exp":"The control group doesn't receive the manipulated variable, so it can be compared with the experimental group."},{"id":"SQ5","deck":2,"q":"Factory workers become more productive just because they know researchers are watching them. This is the:","opts":["Hawthorne effect","Placebo effect","Barnum effect","Gambler's fallacy"],"ans":0,"exp":"Changing behavior because you know you're being observed is the Hawthorne effect."},{"id":"SQ6","deck":2,"q":"After the game, Sam says, \"I knew they would lose all along.\" This is:","opts":["Hindsight bias","Overconfidence","Gambler's fallacy","Social desirability bias"],"ans":0,"exp":"Believing after the outcome that you would have foreseen it is hindsight bias."},{"id":"SQ7","deck":2,"q":"After an experiment, participants are told the study's real purpose and about any deception. This is called:","opts":["Debriefing","Informed consent","Confidentiality","Replication"],"ans":0,"exp":"Debriefing happens after the study. Informed consent happens before."},{"id":"SQ8","deck":2,"q":"On an anonymous-looking survey about cheating, almost no students admit to cheating, even though many do. The most likely problem is:","opts":["Social desirability bias","The Hawthorne effect","The placebo effect","Gambler's fallacy"],"ans":0,"exp":"People give dishonest answers to seek approval or look good."},{"id":"SQ9","deck":1,"q":"Mr. Epstein gives his students candy to reward them for doing their homework. Which perspective fits best?","opts":["Behavioral","Cognitive","Humanistic","Psychodynamic"],"ans":0,"exp":"Rewarding a behavior so it gets repeated is the behavioral perspective."},{"id":"SQ10","deck":1,"q":"Doctors believe Rosa suffers from schizophrenia because there is too much dopamine in her brain. Which perspective fits best?","opts":["Biological","Psychodynamic","Sociocultural","Evolutionary"],"ans":0,"exp":"Neurotransmitters like dopamine belong to the biological perspective."},{"id":"SQ11","deck":1,"q":"Alex is learning to focus on positive relationships and his future potential, instead of the past, to improve his self-esteem. Which perspective fits best?","opts":["Humanistic","Psychodynamic","Behavioral","Biological"],"ans":0,"exp":"Potential, positivity, and relationships are humanistic. Focusing on the past would be psychodynamic."},{"id":"SQ12","deck":1,"q":"Juliette's therapist believes her anxiety is influenced by her poor relationship with her father as a child. Which perspective fits best?","opts":["Psychodynamic","Humanistic","Cognitive","Evolutionary"],"ans":0,"exp":"Childhood experiences shaping behavior is the psychodynamic perspective."},{"id":"SQ13","deck":1,"q":"Jason's fear of snakes is a survival instinct his ancestors also had. Which perspective fits best?","opts":["Evolutionary","Behavioral","Biological","Sociocultural"],"ans":0,"exp":"Survival instincts passed down from ancestors are evolutionary."},{"id":"SQ14","deck":1,"q":"Heather wears skirts and dresses because that is the norm in the society where she lives. Which perspective fits best?","opts":["Sociocultural","Evolutionary","Humanistic","Cognitive"],"ans":0,"exp":"Behavior shaped by culture or way of life is sociocultural."},{"id":"SQ15","deck":1,"q":"Carl takes antidepressants to help improve his mood. Which perspective fits best?","opts":["Biological","Cognitive","Humanistic","Psychodynamic"],"ans":0,"exp":"Medication changes brain chemistry, which is the biological perspective."},{"id":"SQ16","deck":1,"q":"Jason has been feeling very negatively about work, so his therapist encourages him to change how he thinks about it. Which perspective fits best?","opts":["Cognitive","Behavioral","Biological","Evolutionary"],"ans":0,"exp":"Changing thought processes is the cognitive perspective."},{"id":"SQ17","deck":3,"q":"What is the mean of 2, 4, 6, 8, 10?","opts":["6","5","8","4"],"ans":0,"exp":"2 + 4 + 6 + 8 + 10 = 30, and 30 ÷ 5 = 6."},{"id":"SQ18","deck":3,"q":"What is the median of 3, 9, 1, 7, 5?","opts":["5","7","9","3"],"ans":0,"exp":"In order: 1, 3, 5, 7, 9. The middle number is 5."},{"id":"SQ19","deck":3,"q":"What is the mode of 4, 7, 7, 2, 9, 7, 4?","opts":["7","4","9","2"],"ans":0,"exp":"7 appears three times, more than any other number."},{"id":"SQ20","deck":3,"q":"Test scores: 60, 72, 85, 90, 95. What is the range?","opts":["35","80.4","85","25"],"ans":0,"exp":"95 − 60 = 35. (80.4 is the mean, a trap.)"},{"id":"SQ21","deck":3,"q":"On a very hard test, most students score low, but a few score very high. The distribution is:","opts":["Positively skewed","Negatively skewed","Symmetrical","Bimodal"],"ans":0,"exp":"The few high scores make a tail to the right: positive skew."},{"id":"SQ22","deck":3,"q":"On a very easy quiz, most students score near 100, but a few score very low. How does the mean compare to the median?","opts":["The mean is lower than the median","The mean is higher than the median","They are equal","There is no mean"],"ans":0,"exp":"The tail goes left (negative skew), and the mean follows the tail."},{"id":"SQ23","deck":3,"q":"A study finds p = .03. What does this mean?","opts":["The result is statistically significant: it's unlikely to be due to chance","The result is not significant","The effect is very strong","3% of participants improved"],"ans":0,"exp":"p ≤ .05 is statistically significant. A p-value says nothing about how strong the effect is; that's effect size."},{"id":"SQ24","deck":3,"q":"Jada scored in the 90th percentile on a practice test. This means:","opts":["She scored higher than 90% of test takers","She got 90% of the questions right","90 people took the test","She scored 90 points above the mean"],"ans":0,"exp":"Percentile rank is the percentage of scores below yours."}],"flows":[{"id":"F2-1","title":"The scientific method","deck":2,"steps":["Observe","Develop a theory","Make a hypothesis","Test it (with operational definitions)","Evaluate the results","Modify the theory","Replicate"]}],"trees":[],"tables":[{"title":"Descriptive methods","rows":[["Method","What it is","Advantages","Disadvantages"],["Case study","One individual or group in depth","In-depth information; illustrates general principles","Misleading if the person is atypical; can overgeneralize"],["Naturalistic observation","Recording behavior in natural situations without controlling them","Non-invasive; more honest behavior","Time consuming; subjects may notice the observer; observer may misinterpret"],["Survey","Self-reported attitudes and behaviors from a sample","Lots of data fast; flexible","Wording can skew answers; people please the researcher, lie, or misremember; poor response rate"]]},{"title":"Experiments","rows":[["Research question","IV (changed)","DV (measured)"],["Does sleep deprivation cause poor memory?","Amount of sleep","Strength of memory"],["Does room temperature affect test scores?","Temperature","Test scores"],["How does exercise affect weight loss?","Amount of exercise","Weight loss (confounds: diet, sleep, genetics)"],["Do antidepressants decrease depression?","Taking the medication or not","Depression"]]},{"title":"The seven perspectives","rows":[["Perspective","Focuses on","Practice scenario from your slides"],["Psychodynamic","Unconscious mind, childhood, Freud","Juliette's anxiety comes from her poor relationship with her father as a child"],["Cognitive","Thought processes: memory, problem solving, intelligence, perception","Jason's therapist helps him change how he thinks about work"],["Behavioral","Learned experiences and rewards","Mr. Epstein gives candy for doing homework"],["Humanistic","Full potential, free will, positivity, relationships","Alex focuses on positive relationships and his future potential"],["Biological","Genes, brain chemistry, hormones, neurotransmitters","Rosa's schizophrenia from too much dopamine; Carl's antidepressants"],["Evolutionary","Survival, adaptive behavior, reproduction","Jason's fear of snakes is an instinct his ancestors also had"],["Sociocultural","Culture or way of life","Heather wears skirts because that's the norm where she lives"]]},{"title":"Central tendency","rows":[["Measure","How to find it","Example from your slides"],["Mean","Add them up, divide by how many","2, 3, 4, 5, 5, 8 → 4.5"],["Median","Put in order, take the middle (average the two middle numbers if needed)","2, 4, 5, 6, 9 → 5"],["Mode","The most frequent number","1, 3, 6, 6, 8 → 6"],["Percentile rank","% of scores below yours","85th percentile = higher than 85% of peers"]]},{"title":"Skewed data","rows":[["Shape","Tail","Order"],["Positive skew","Right","Mean > median > mode"],["Negative skew","Left","Mean \u003c median \u003c mode"],["Symmetrical","None","Mean = median = mode"],["Bimodal","Two peaks","Each peak is a local maximum"]]}],"watch":[{"deck":1,"text":"Behavioral vs. cognitive: behavioral = rewards and learned behavior; cognitive = thoughts (like changing how you think about something)."},{"deck":1,"text":"Humanistic vs. psychodynamic: humanistic looks forward (potential, positivity, relationships); psychodynamic looks back (unconscious mind, childhood)."},{"deck":1,"text":"The \"Identify the perspective\" slide has blank answers. The practice questions here use the best-fit answer for each; check them against what your teacher went over in class."},{"deck":2,"text":"Your Dependent Variable slide labels its answers \"IV = strength of memory\" and \"IV = test scores.\" Those are DVs; the slide has a typo. IV = what the researcher changes. DV = what gets measured."},{"deck":2,"text":"The positive and negative correlation slides are titled +1.0 and -1.0. Those are perfect correlations; real correlations can be anywhere from -1 to +1."},{"deck":2,"text":"Only experiments can show cause and effect. Correlation does not equal causation."},{"deck":2,"text":"Informed consent comes BEFORE the study. Debriefing comes AFTER."},{"deck":3,"text":"The mean always follows the tail: positive skew → the mean is highest; negative skew → the mean is lowest."},{"deck":3,"text":"Your slides call percentile rank a \"fourth measure of central tendency.\" Many textbooks list it separately, but go with your slides."},{"deck":3,"text":"Descriptive statistics organize and describe data (mean, median, mode, range, standard deviation). Inferential statistics decide whether results apply to a whole population (p-values, significance)."}],"practice":{"sections":[{"name":"Perspectives in Psychology","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q1-1","type":"mcq","topic":"Perspectives in Psychology","stem":"Antonio is feeling much healthier now that he is focusing on his positive traits and having good relationships. Which perspective fits best?","options":["Biological","Humanistic","Psychodynamic","Behavioral"],"ans":1,"exp":"Positivity, relationships, and well-being are humanistic.","why":["","","",""]},{"id":"q1-2","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective is based heavily on the ideas of Freud?","options":["Humanistic","Psychodynamic","Cognitive","Sociocultural"],"ans":1,"exp":"Psychodynamic: the unconscious mind and childhood experiences.","why":["","","",""]},{"id":"q1-3","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective focuses on genetics, brain chemistry, hormones, and neurotransmitters?","options":["Biological","Evolutionary","Cognitive","Behavioral"],"ans":0,"exp":"That's the biological perspective. Evolutionary is about survival and reproduction.","why":["","","",""]},{"id":"q1-4","type":"mcq","topic":"Perspectives in Psychology","stem":"Which perspective emphasizes memory, problem solving, intelligence, and perception?","options":["Behavioral","Humanistic","Cognitive","Psychodynamic"],"ans":2,"exp":"Cognitive = internal thought processes.","why":["","","",""]},{"id":"q1-5","type":"mcq","topic":"Perspectives in Psychology","stem":"Which of the following best describes the behavioral perspective?","options":["Behavior comes from the unconscious mind.","Behavior is mostly determined by genes.","Behavior depends on a person's culture.","Behavior is shaped by learned experiences, and rewarded behaviors tend to be repeated."],"ans":3,"exp":"Behavioral = learning and rewards.","why":["","","",""]},{"id":"q1-6","type":"mcq","topic":"Perspectives in Psychology","stem":"Which of the following best describes the evolutionary perspective?","options":["Behavior is shaped by childhood memories.","Behaviors exist because they helped our ancestors survive and reproduce.","Behavior is shaped by social norms.","Behavior depends on how we think about situations."],"ans":1,"exp":"Evolutionary = protection, adaptive behavior, and reproduction.","why":["","","",""]},{"id":"q1-7","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the evolutionary perspective?","options":["Fearing spiders helped his ancestors avoid dangerous bites and survive.","A frightening spider experience from early childhood is affecting him unconsciously.","His thoughts about spiders are exaggerated and unrealistic.","In his culture, spiders are treated as scary and disgusting."],"ans":0,"exp":"Survival advantage for ancestors = evolutionary. The others are psychodynamic, cognitive, and sociocultural.","why":["","","",""]},{"id":"q1-8","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the psychodynamic perspective?","options":["Fearing spiders helped his ancestors survive.","His brain chemistry makes him more anxious.","People around him taught him spiders are gross.","A frightening spider experience from early childhood is affecting him unconsciously."],"ans":3,"exp":"Unconscious mind + childhood = psychodynamic.","why":["","","",""]},{"id":"q1-9","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the cognitive perspective?","options":["He believes every spider he sees could kill him, and those thoughts drive his fear.","He inherited a gene linked to anxiety.","In his culture, spiders are seen as dangerous.","He has an unconscious memory of being bitten."],"ans":0,"exp":"Cognitive = how thought processes shape behavior.","why":["","","",""]},{"id":"q1-10","type":"mcq","topic":"Perspectives in Psychology","stem":"Charles has a terrible fear of spiders. Which explanation fits the sociocultural perspective?","options":["Fearing spiders helped his ancestors survive.","His neurotransmitter levels are unusual.","He focuses on his potential to overcome fear.","In his culture, spiders are commonly treated as scary and disgusting."],"ans":3,"exp":"Culture or way of life = sociocultural.","why":["","","",""]},{"id":"q1-11","type":"mcq","topic":"Perspectives in Psychology","stem":"Suzanne loves romantic comedy movies. Which explanation uses the biological perspective?","options":["In her culture, it's popular for women to enjoy romantic movies.","She was often taken to romantic movies as a child.","Watching them causes her brain to release feel-good chemicals like dopamine.","She enjoys predicting how the plot will turn out."],"ans":2,"exp":"Brain chemistry and neurotransmitters = biological. The culture answer is your slide's sociocultural example.","why":["","","",""]},{"id":"q1-12","type":"mcq","topic":"Perspectives in Psychology","stem":"A therapist helps a client focus on free will, self-actualization, and reaching their full potential. Which perspective is the therapist using?","options":["Psychodynamic","Behavioral","Humanistic","Biological"],"ans":2,"exp":"Free will, self-efficacy, and self-actualization are humanistic.","why":["","","",""]},{"id":"q1-13","type":"mcq","topic":"Perspectives in Psychology","stem":"A psychologist argues that a teen's aggression is mostly due to high testosterone levels. Which perspective is this?","options":["Biological","Sociocultural","Cognitive","Humanistic"],"ans":0,"exp":"Hormones = biological.","why":["","","",""]},{"id":"q1-14","type":"mcq","topic":"Perspectives in Psychology","stem":"A researcher compares how families in different countries discipline their children, expecting differences based on each country's way of life. Which perspective is this?","options":["Evolutionary","Sociocultural","Psychodynamic","Cognitive"],"ans":1,"exp":"Differences based on culture or way of life = sociocultural.","why":["","","",""]},{"id":"q1-15","type":"mcq","topic":"Perspectives in Psychology","stem":"Which of the following best explains why psychologists use different perspectives?","options":["Only one perspective can be correct.","Each perspective is used for only one type of behavior.","Each one is like a different set of lenses, giving a different explanation of the same behavior.","Perspectives are only used to diagnose disorders."],"ans":2,"exp":"Your slides: perspectives are like viewing situations through different lenses. A behavior can be explained by several.","why":["","","",""]}]},{"name":"Research Methods","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q2-1","type":"mcq","topic":"Research Methods","stem":"Which of the following best explains why psychologists rely on research instead of intuition?","options":["Intuition is always wrong.","Intuition is distorted by hindsight bias, overconfidence, and misunderstanding of probability.","Research never contains errors.","Intuition only works for experts."],"ans":1,"exp":"Your slides: psychology exists because intuition is unreliable, due to hindsight bias, misunderstanding of probability, and overconfidence.","why":["","","",""]},{"id":"q2-2","type":"mcq","topic":"Research Methods","stem":"Which of the following is the correct order of the first four steps of the scientific method?","options":["Observe → develop a theory → make a hypothesis → test it","Make a hypothesis → observe → replicate → develop a theory","Test → observe → develop a theory → evaluate","Develop a theory → replicate → observe → make a hypothesis"],"ans":0,"exp":"Observe, theory, hypothesis, test, evaluate, modify, replicate.","why":["","","",""]},{"id":"q2-3","type":"mcq","topic":"Research Methods","stem":"A researcher decides that \"smiling\" means at least four teeth showing and \"friendly\" means the photographer tells at least two jokes. These are:","options":["Hypotheses","Operational definitions","Confounding variables","Theories"],"ans":1,"exp":"Operational definitions state exactly how each variable will be measured.","why":["","","",""]},{"id":"q2-4","type":"mcq","topic":"Research Methods","stem":"Which of the following best explains why operational definitions are important?","options":["Without them, other researchers can't replicate the study.","They guarantee the hypothesis will be supported.","They replace the need for a control group.","They make the sample representative."],"ans":0,"exp":"Your slides: research cannot be replicated without operational definitions.","why":["","","",""]},{"id":"q2-5","type":"mcq","topic":"Research Methods","stem":"A researcher repeats another scientist's study with new participants to see whether the results hold up. This is:","options":["Replication","Debriefing","Sampling bias","Naturalistic observation"],"ans":0,"exp":"Replicating means doing the research a second time to check that the results are reliable.","why":["","","",""]},{"id":"q2-6","type":"mcq","topic":"Research Methods","stem":"Which research method is the only one that can establish cause and effect?","options":["Correlational study","Case study","Survey","Experiment"],"ans":3,"exp":"Experiments manipulate variables to establish cause and effect.","why":["","","",""]},{"id":"q2-7","type":"mcq","topic":"Research Methods","stem":"A psychologist spends two years studying one patient with a rare memory disorder in great detail. Which of the following is the biggest weakness of this method?","options":["It gives too little in-depth information.","The findings may not apply to others, because the patient may be atypical.","It cannot describe behavior.","It always involves deception."],"ans":1,"exp":"Case studies can be misleading if the person is atypical, and can lead to overgeneralizing.","why":["","","",""]},{"id":"q2-8","type":"mcq","topic":"Research Methods","stem":"A researcher wants to know how 2,000 teens feel about social media and needs results quickly. Which method fits best?","options":["Survey","Case study","Naturalistic observation","Experiment"],"ans":0,"exp":"Surveys collect a lot of self-reported data in a short time.","why":["","","",""]},{"id":"q2-9","type":"mcq","topic":"Research Methods","stem":"Which of the following is a disadvantage of naturalistic observation?","options":["Subjects behave less honestly than in a lab.","It requires manipulating variables.","Subjects may notice the observer and act differently.","It only studies one person."],"ans":2,"exp":"It's non-invasive, but subjects may become aware of the observer, and it can be time consuming.","why":["","","",""]},{"id":"q2-10","type":"mcq","topic":"Research Methods","stem":"As hours of sleep decrease, levels of stress increase. Which type of correlation is this?","options":["Positive","Negative","Zero","Perfect positive"],"ans":1,"exp":"One goes down while the other goes up: negative.","why":["","","",""]},{"id":"q2-11","type":"mcq","topic":"Research Methods","stem":"As salary decreases, spending also decreases. Which type of correlation is this?","options":["Positive","Negative","Zero","It isn't a correlation"],"ans":0,"exp":"Both move in the same direction (both decrease), so it's positive. Positive doesn't mean \"good.\"","why":["","","",""]},{"id":"q2-12","type":"mcq","topic":"Research Methods","stem":"Which correlation coefficient shows the strongest relationship?","options":["-0.9","+0.5","0","+0.3"],"ans":0,"exp":"Strength is how close the number is to +1 or -1. The sign only shows direction.","why":["","","",""]},{"id":"q2-13","type":"mcq","topic":"Research Methods","stem":"A study finds that students who eat breakfast earn higher grades. Which conclusion is most appropriate?","options":["Eating breakfast causes higher grades.","Higher grades cause students to eat breakfast.","Breakfast and grades are related, but the study can't show that breakfast causes better grades.","There is no relationship between them."],"ans":2,"exp":"Correlation does not equal causation. Another factor could explain both.","why":["","","",""]},{"id":"q2-14","type":"mcq","topic":"Research Methods","stem":"Ice cream sales and sunburns rise together. According to your slides, which of the following best explains this?","options":["Ice cream causes sunburns.","Sunburns make people buy ice cream.","It's a negative correlation.","Hot, sunny summer weather causes both."],"ans":3,"exp":"A third factor (summer weather) causes both, so they're correlated without one causing the other.","why":["","","",""]},{"id":"q2-15","type":"mcq","topic":"Research Methods","stem":"A researcher randomly picks 500 names from a list of every student in a school, so every student has an equal chance of being chosen. This is a:","options":["Population","Representative (random) sample","Control group","Case study"],"ans":1,"exp":"Everyone having an equal chance of inclusion makes it a representative random sample. The whole school is the population.","why":["","","",""]},{"id":"q2-16","type":"mcq","topic":"Research Methods","stem":"Plants are randomly put in a room with music or a silent room, and their height is measured after a month. What is the independent variable?","options":["Whether the plants hear music","Plant height","The type of plant","The length of the study"],"ans":0,"exp":"The IV is what the researcher manipulates.","why":["","","",""]},{"id":"q2-17","type":"mcq","topic":"Research Methods","stem":"In the same plant study, what is the dependent variable?","options":["Whether the plants hear music","The silent room","Plant height","The type of plant"],"ans":2,"exp":"The DV is what gets measured.","why":["","","",""]},{"id":"q2-18","type":"mcq","topic":"Research Methods","stem":"A study tests whether exercise causes weight loss, but the exercise group also happened to eat healthier food. Diet is a:","options":["Dependent variable","Independent variable","Control group","Confounding variable"],"ans":3,"exp":"An outside influence that affects the results is a confounding variable. Your slides list diet, sleep, and genetics for this exact example.","why":["","","",""]},{"id":"q2-19","type":"mcq","topic":"Research Methods","stem":"Patients given a sugar pill they believe is a pain medication report feeling less pain. This is the:","options":["Hawthorne effect","Placebo effect","Barnum effect","Gambler's fallacy"],"ans":1,"exp":"Results caused by expectations alone are the placebo effect.","why":["","","",""]},{"id":"q2-20","type":"mcq","topic":"Research Methods","stem":"A horoscope says, \"You sometimes doubt yourself, but you have hidden strengths,\" and Mia thinks it describes her perfectly. This is the:","options":["Hindsight bias","Placebo effect","Self-report bias","Barnum effect"],"ans":3,"exp":"Believing a general description applies specifically to you is the Barnum effect.","why":["","","",""]},{"id":"q2-21","type":"mcq","topic":"Research Methods","stem":"After a coin lands heads five times in a row, Leo bets on tails because tails is \"due.\" This is:","options":["Overconfidence","Hindsight bias","Gambler's fallacy","The Barnum effect"],"ans":2,"exp":"Seeing patterns in random data is the gambler's fallacy. Each flip is still 50/50.","why":["","","",""]},{"id":"q2-22","type":"mcq","topic":"Research Methods","stem":"A survey asks, \"Don't you agree that dangerous video games should be banned?\" The biggest problem with this question is:","options":["The placebo effect","The Hawthorne effect","Debriefing","Wording effects (framing)"],"ans":3,"exp":"The wording pushes people toward one answer.","why":["","","",""]},{"id":"q2-23","type":"mcq","topic":"Research Methods","stem":"A researcher studying the exercise habits of all Americans surveys only members of one gym. The main problem is:","options":["The placebo effect","Hindsight bias","Sampling bias","Wording effects"],"ans":2,"exp":"The sample doesn't represent the population, so the results will be skewed.","why":["","","",""]},{"id":"q2-24","type":"mcq","topic":"Research Methods","stem":"Before a study begins, participants are told what it involves so they can decide whether to take part. This is:","options":["Debriefing","Informed consent","Confidentiality","Replication"],"ans":1,"exp":"Informed consent comes before; debriefing comes after.","why":["","","",""]},{"id":"q2-25","type":"mcq","topic":"Research Methods","stem":"Which of the following would violate the APA's ethical guidelines?","options":["Debriefing participants after a study","Letting people choose whether to participate","Publishing participants' names and personal answers without permission","Getting approval from a research institution"],"ans":2,"exp":"That breaks confidentiality. The other three are required guidelines.","why":["","","",""]},{"id":"q2-26","type":"mcq","topic":"Research Methods","stem":"Overconfidence is best described as:","options":["Believing you knew the outcome all along","Seeing patterns in random data","Giving answers that make you look good","Overestimating your knowledge and/or ability"],"ans":3,"exp":"The others are hindsight bias, gambler's fallacy, and social desirability bias.","why":["","","",""]},{"id":"q2-27","type":"mcq","topic":"Research Methods","stem":"Participants in a study answer questions in ways they think the researcher wants, or exaggerate how good they are. This is:","options":["Sampling bias","The placebo effect","Self-report bias","The gambler's fallacy"],"ans":2,"exp":"Self-report bias: trying to affect the outcome, please the researcher, or being unrealistic about yourself.","why":["","","",""]}]},{"name":"Statistics & Data","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q3-1","type":"mcq","topic":"Statistics & Data","stem":"Which of the following best describes the purpose of descriptive statistics?","options":["To decide whether results apply to a whole population","To manipulate variables","To organize and summarize data meaningfully","To prove cause and effect"],"ans":2,"exp":"Descriptive statistics organize data. Deciding whether results generalize is inferential statistics.","why":["","","",""]},{"id":"q3-2","type":"mcq","topic":"Statistics & Data","stem":"Which type of graph is a bar graph that shows a frequency distribution?","options":["Scatterplot","Pie chart","Line graph","Histogram"],"ans":3,"exp":"Histograms show frequency distributions and make patterns quick to spot.","why":["","","",""]},{"id":"q3-3","type":"mcq","topic":"Statistics & Data","stem":"What is the mean of 3, 5, 7, 9, 11, 13?","options":["8","7","9","6"],"ans":0,"exp":"3 + 5 + 7 + 9 + 11 + 13 = 48, and 48 ÷ 6 = 8.","why":["","","",""]},{"id":"q3-4","type":"mcq","topic":"Statistics & Data","stem":"What is the median of 4, 10, 6, 2, 8, 12?","options":["6","8","10","7"],"ans":3,"exp":"In order: 2, 4, 6, 8, 10, 12. The two middle numbers are 6 and 8, so the median is (6 + 8) ÷ 2 = 7.","why":["","","",""]},{"id":"q3-5","type":"mcq","topic":"Statistics & Data","stem":"For the data 2, 3, 3, 5, 9, 9, 9, 12, which statement is correct?","options":["Mode = 3, median = 5, mean = 6.5","Mode = 9, median = 7, mean = 6.5","Mode = 9, median = 5, mean = 7","Mode = 9, median = 7, mean = 7"],"ans":1,"exp":"9 appears most (mode). Middle two are 5 and 9, so the median is 7. Sum is 52, and 52 ÷ 8 = 6.5.","why":["","","",""]},{"id":"q3-6","type":"mcq","topic":"Statistics & Data","stem":"Scores: 55, 70, 70, 85, 100. What is the range?","options":["45","70","76","100"],"ans":0,"exp":"100 − 55 = 45. (70 is the mode and median; 76 is the mean.)","why":["","","",""]},{"id":"q3-7","type":"mcq","topic":"Statistics & Data","stem":"Which of the following best explains why standard deviation is a more useful measure of variation than the range?","options":["It is easier to calculate.","It shows the most common score.","It shows how much all the scores vary around the mean, not just the gap between the two extremes.","It is always smaller than the mean."],"ans":2,"exp":"The range only uses the highest and lowest scores, so it's just a rough estimate.","why":["","","",""]},{"id":"q3-8","type":"mcq","topic":"Statistics & Data","stem":"Class A and Class B both averaged 80 on a test. Class A's standard deviation is 3; Class B's is 15. Which statement is true?","options":["Class A's scores are more spread out.","Class B's scores are more spread out.","Class B scored higher on average.","Both classes have the same spread."],"ans":1,"exp":"A bigger standard deviation means scores are more dispersed around the mean.","why":["","","",""]},{"id":"q3-9","type":"mcq","topic":"Statistics & Data","stem":"IQ scores have a mean of 100 and a standard deviation of 15. About what percent of people score between 85 and 115?","options":["95%","50%","99%","68%"],"ans":3,"exp":"85–115 is within 1 standard deviation of the mean: about 68%.","why":["","","",""]},{"id":"q3-10","type":"mcq","topic":"Statistics & Data","stem":"On the same IQ scale, about 95% of people score between:","options":["85 and 115","55 and 145","70 and 130","100 and 130"],"ans":2,"exp":"Within 2 standard deviations (2 × 15 = 30 points) of 100.","why":["","","",""]},{"id":"q3-11","type":"mcq","topic":"Statistics & Data","stem":"A billionaire moves into a small town where most families earn very little. Which measure best describes a typical family's income?","options":["Mean","Median","Range","Standard deviation"],"ans":1,"exp":"The outlier pulls the mean way up. Your slides say the median and mode give a fuller picture.","why":["","","",""]},{"id":"q3-12","type":"mcq","topic":"Statistics & Data","stem":"Which statement is true of a positively skewed distribution?","options":["Mean > median > mode","Mean \u003c median \u003c mode","Mean = median = mode","The tail goes to the left"],"ans":0,"exp":"Positive skew: tail to the right, and the mean follows the tail.","why":["","","",""]},{"id":"q3-13","type":"mcq","topic":"Statistics & Data","stem":"In a negatively skewed distribution, the tail points:","options":["Right, and the mean is pulled right","Left, and the mean is pulled left","Left, and the mode is pulled left","Nowhere, because it's symmetrical"],"ans":1,"exp":"Negative skew = tail to the left. The mean always follows the tail.","why":["","","",""]},{"id":"q3-14","type":"mcq","topic":"Statistics & Data","stem":"Most families in a town earn $20,000–$50,000, but a few earn millions. How is income in this town distributed?","options":["Negatively skewed","Positively skewed","Symmetrical","Bimodal"],"ans":1,"exp":"A few very high values make a tail to the right: positive skew.","why":["","","",""]},{"id":"q3-15","type":"mcq","topic":"Statistics & Data","stem":"A graph of the heights of a group of kindergartners and their parents has two clear peaks. This is a:","options":["Positive skew","Negative skew","Bimodal distribution","Normal curve"],"ans":2,"exp":"\"Bi\" means two: two peaks = bimodal.","why":["","","",""]},{"id":"q3-16","type":"mcq","topic":"Statistics & Data","stem":"Which statement best describes inferential statistics?","options":["They organize data into histograms.","They find the middle score.","They measure how spread out scores are.","They help determine whether results can be generalized to a larger population."],"ans":3,"exp":"Inferential statistics check that results aren't just chance fluctuations in the sample.","why":["","","",""]},{"id":"q3-17","type":"mcq","topic":"Statistics & Data","stem":"Which is one of the three key principles of inferential statistics on your slides?","options":["Bigger samples are better than small ones.","Fewer estimates are better than more estimates.","Unrepresentative samples are better than representative ones.","One study is enough to generalize."],"ans":0,"exp":"The three: representative samples, bigger samples, and more estimates are better.","why":["","","",""]},{"id":"q3-18","type":"mcq","topic":"Statistics & Data","stem":"Why is meta-analysis useful?","options":["It studies one person in depth.","It removes the need for a sample.","It guarantees that results are significant.","It combines the estimates of many studies instead of relying on just one."],"ans":3,"exp":"More estimates are better than fewer estimates.","why":["","","",""]},{"id":"q3-19","type":"mcq","topic":"Statistics & Data","stem":"Alex asks two friends about each café and decides Café Mocha is better. Which of the following best explains why her conclusion isn't reliable?","options":["Her p-value is too small.","She used a control group.","Her sample is small and unrepresentative.","Her effect size is too large."],"ans":2,"exp":"Your slide names both problems: unrepresentative samples and small sample size.","why":["","","",""]},{"id":"q3-20","type":"mcq","topic":"Statistics & Data","stem":"A study reports p = .20. Which conclusion is correct?","options":["The result is not statistically significant; it could easily be due to chance.","The result is significant because .20 is small.","The effect size is 20 points.","20% of participants improved."],"ans":0,"exp":"Significant means p ≤ .05. .20 is too high.","why":["","","",""]},{"id":"q3-21","type":"mcq","topic":"Statistics & Data","stem":"Which statement about p-values and effect size is correct?","options":["They mean the same thing.","Effect size tells whether a result is due to chance.","A p-value tells whether an effect likely exists; effect size tells how strong it is.","A larger p-value means a stronger effect."],"ans":2,"exp":"Your slides: unlike p-values, effect size tells how strong the effect is.","why":["","","",""]},{"id":"q3-22","type":"mcq","topic":"Statistics & Data","stem":"Students using a new study technique averaged 85; students studying as usual averaged 75. According to your slides, the 10-point difference is the:","options":["Effect size","P-value","Range","Percentile rank"],"ans":0,"exp":"Effect size shows the practical importance of the result: 85
