 questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q5-1","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Which of the following best describes neurodevelopmental disorders?","options":["Disorders that always start in adulthood","Issues in central nervous system functioning that begin to appear in early childhood","Disorders caused only by trauma","Disorders involving false beliefs and perceptions"],"ans":1,"exp":"They involve social, intellectual, academic, or interpersonal functioning.","why":["","","",""]},{"id":"q5-2","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"ADHD is characterized by a persistent pattern of:","options":["Mania and depression","Obsessions and compulsions","Delusions and hallucinations","Inattention and/or hyperactivity-impulsivity"],"ans":3,"exp":"That pattern must interfere with functioning or development.","why":["","","",""]},{"id":"q5-3","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Which of the following is an inattention symptom of ADHD?","options":["Talks excessively","Blurts out answers","Often loses things and is easily distracted","Runs and climbs excessively"],"ans":2,"exp":"Talking excessively and running are hyperactivity; blurting out is impulsivity.","why":["","","",""]},{"id":"q5-4","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"For an ADHD diagnosis, several symptoms must be present:","options":["Only at school","After age 18","Before age 12 and in two or more settings","For at least two weeks"],"ans":2,"exp":"Before 12, in 2+ settings, for 6+ months.","why":["","","",""]},{"id":"q5-5","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Why can it be difficult to diagnose ADHD in very young children?","options":["Many ADHD symptoms also occur in children without ADHD","ADHD can't exist before age 12","Young children never fidget","There is no test for ADHD in any age group"],"ans":0,"exp":"Average onset is around age 8; earlier, normal kid behavior looks similar.","why":["","","",""]},{"id":"q5-6","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Why is autism called a \"spectrum\" disorder?","options":["Its symptoms range from mild to severe","It affects all five senses","It only appears in boys","It changes color perception"],"ans":0,"exp":"Your slide: symptoms range from mild to severe.","why":["","","",""]},{"id":"q5-7","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"ADHD and ASD both have high heritability. This means they:","options":["Are always caused by teratogens","Can be cured with medication","Only appear after trauma","Tend to run in families, suggesting a strong genetic component"],"ans":3,"exp":"Heritability = tends to run in families.","why":["","","",""]},{"id":"q5-8","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"According to your slides, ASD is:","options":["More common in girls","Over 3 times more common in boys than girls","Equally common in boys and girls","Found only in adults"],"ans":1,"exp":"About 1 in 31 children aged 8; over 3 times more common in boys.","why":["","","",""]}]},{"name":"Dissociative Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q6-1","type":"mcq","topic":"Dissociative Disorders","stem":"Which of the following best describes dissociative disorders?","options":["A loss of connection between thoughts, memories, feelings, surroundings, behavior, and identity","Hearing voices that aren't there","Extreme highs and lows in mood","Fear of open spaces"],"ans":0,"exp":"They involve escaping from reality in unhealthy ways.","why":["","","",""]},{"id":"q6-2","type":"mcq","topic":"Dissociative Disorders","stem":"Which of the following is a symptom of dissociative amnesia?","options":["Loss of autobiographical information, like personal identity or relationships","Hearing voices","Grandiosity","Excessive hand washing"],"ans":0,"exp":"Dissociative amnesia = inability to recall important personal information.","why":["","","",""]},{"id":"q6-3","type":"mcq","topic":"Dissociative Disorders","stem":"The distinct personality states in dissociative identity disorder are called:","options":["Obsessions","Delusions","Diatheses","Alters"],"ans":3,"exp":"Each alter has its own identity, memories, behaviors, and perspectives.","why":["","","",""]},{"id":"q6-4","type":"mcq","topic":"Dissociative Disorders","stem":"Which of the following is the best example of a fugue state?","options":["A man feels sad for two weeks","A woman travels to another city and doesn't know who she is","A child is afraid of dogs","A student can't focus in class"],"ans":1,"exp":"Fugue: wandering or traveling without awareness of identity or situation.","why":["","","",""]},{"id":"q6-5","type":"mcq","topic":"Dissociative Disorders","stem":"Which statement best distinguishes DID from schizophrenia?","options":["They are the same disorder","Schizophrenia involves multiple personalities","DID involves multiple distinct identities; schizophrenia involves psychosis like delusions and hallucinations","DID is caused by too much dopamine"],"ans":2,"exp":"\"Split personality\" is DID, not schizophrenia.","why":["","","",""]}]},{"name":"Schizophrenia Spectrum","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q7-1","type":"mcq","topic":"Schizophrenia Spectrum","stem":"To be diagnosed on the schizophrenia spectrum, a patient must have:","options":["At least 2 symptoms for at least 6 months","One symptom for 2 weeks","Only negative symptoms for 1 month","Symptoms before age 12"],"ans":0,"exp":"Your slide: at least 2 symptoms (positive and negative) for at least 6 months.","why":["","","",""]},{"id":"q7-2","type":"mcq","topic":"Schizophrenia Spectrum","stem":"Why did the DSM-5 place schizophrenia on a spectrum?","options":["It only has one symptom","People experience its symptoms in a variety of ways","It is the same as bipolar disorder","It always has the same severity"],"ans":1,"exp":"It's a spectrum of psychotic disorders.","why":["","","",""]},{"id":"q7-3","type":"mcq","topic":"Schizophrenia Spectrum","stem":"Which of the following is a positive symptom of schizophrenia?","options":["Flat affect","Catatonic stupor","Lack of motivation","Hallucinations"],"ans":3,"exp":"Positive = added. The others are negative (absent).","why":["","","",""]},{"id":"q7-4","type":"mcq","topic":"Schizophrenia Spectrum","stem":"A patient says, \"The table sky running blue mustard because seven.\" This is an example of:","options":["Word salad (disorganized speech)","A delusion of grandeur","Flat affect","A hallucination"],"ans":0,"exp":"Stringing words together in an unusual way = word salad.","why":["","","",""]},{"id":"q7-5","type":"mcq","topic":"Schizophrenia Spectrum","stem":"A man believes he is a famous king chosen to save the world. This is a:","options":["Delusion of persecution","Delusion of grandeur","Hallucination","Negative symptom"],"ans":1,"exp":"Grandeur = false belief of importance.","why":["","","",""]},{"id":"q7-6","type":"mcq","topic":"Schizophrenia Spectrum","stem":"According to the dopamine hypothesis, what causes the positive symptoms of schizophrenia?","options":["Too little dopamine","Too little serotonin","An overproduction of dopamine","Too much GABA"],"ans":2,"exp":"This is also why antipsychotics block dopamine receptors.","why":["","","",""]},{"id":"q7-7","type":"mcq","topic":"Schizophrenia Spectrum","stem":"Which of the following is listed on your slides as a cause of schizophrenia?","options":["Too much sleep","A fear of heights","Prenatal exposure to viruses like flu, herpes, or rubella","Excessive exercise"],"ans":2,"exp":"Also genetics and imbalances in dopamine and glutamate.","why":["","","",""]},{"id":"q7-8","type":"mcq","topic":"Schizophrenia Spectrum","stem":"The diathesis-stress model suggests that:","options":["Genes alone always cause mental illness","Stress alone always causes mental illness","Mental illness only comes from childhood","Stress can trigger a genetic or biological predisposition to mental illness"],"ans":3,"exp":"Diathesis = predisposition; stress = the trigger.","why":["","","",""]}]},{"name":"OCD & Trauma Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q8-1","type":"mcq","topic":"OCD & Trauma Disorders","stem":"In OCD, obsessions are best described as:","options":["Repetitive behaviors the person feels driven to perform","False perceptions","Mood swings","Recurrent and persistent intrusive thoughts"],"ans":3,"exp":"Obsessions = thoughts; compulsions = actions.","why":["","","",""]},{"id":"q8-2","type":"mcq","topic":"OCD & Trauma Disorders","stem":"Which sequence matches the OCD cycle?","options":["Compulsion → obsession → relief → distress","Relief → obsession → compulsion → distress","Obsession → distress → compulsion → relief","Distress → relief → obsession → compulsion"],"ans":2,"exp":"The relief reinforces the compulsion, and the cycle repeats.","why":["","","",""]},{"id":"q8-3","type":"mcq","topic":"OCD & Trauma Disorders","stem":"How did the DSM-5 change the classification of OCD?","options":["It moved OCD and related disorders out of anxiety disorders into their own category","It removed OCD from the DSM","It made OCD a personality disorder","It combined OCD with schizophrenia"],"ans":0,"exp":"This showed they are distinct from anxiety disorders.","why":["","","",""]},{"id":"q8-4","type":"mcq","topic":"OCD & Trauma Disorders","stem":"Which neurotransmitter is OCD linked to being too low?","options":["Dopamine","Endorphins","Serotonin","Melatonin"],"ans":2,"exp":"Your slide: low serotonin plus imbalances in GABA and glutamate.","why":["","","",""]},{"id":"q8-5","type":"mcq","topic":"OCD & Trauma Disorders","stem":"Which of the following is one of the DSM-5 criteria for hoarding disorder?","options":["Fear of germs","Persistent difficulty discarding possessions regardless of their actual value","Hearing voices","Binge eating"],"ans":1,"exp":"Plus distress at discarding and clutter that compromises living areas.","why":["","","",""]},{"id":"q8-6","type":"mcq","topic":"OCD & Trauma Disorders","stem":"PTSD, acute stress disorder, and adjustment disorders have similar symptoms but differ in:","options":["How long they last","Whether trauma is involved","Which neurotransmitter is involved","Whether they affect adults"],"ans":0,"exp":"All three result from exposure to a traumatic or stressful event.","why":["","","",""]},{"id":"q8-7","type":"mcq","topic":"OCD & Trauma Disorders","stem":"Which of the following is a symptom of PTSD?","options":["Grandiosity","Hypervigilance, or always being on guard","Word salad","Loss of autobiographical memory only"],"ans":1,"exp":"Also intrusive thoughts, nightmares, flashbacks, anxiety, depression, and sleep problems.","why":["","","",""]}]},{"name":"Feeding & Eating Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q9-1","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following is a primary symptom of anorexia nervosa?","options":["Eating large amounts in two hours","Hearing voices","Fear of open spaces","Intense fear of gaining weight even though underweight"],"ans":3,"exp":"Anorexia also includes refusing to maintain a minimally normal weight.","why":["","","",""]},{"id":"q9-2","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following best describes bulimia nervosa?","options":["Refusing to eat and becoming severely underweight","Recurrent binge eating plus behaviors to prevent weight gain, like vomiting or laxatives","Eating non-food items","Avoiding food because of disgust"],"ans":1,"exp":"Binge + trying to prevent weight gain.","why":["","","",""]},{"id":"q9-3","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Why can bulimia nervosa be hard to spot?","options":["People often binge and purge privately","People with bulimia are always underweight","It has no symptoms","It only happens in children"],"ans":0,"exp":"Your slide: bulimia can be hard to spot because of private bingeing and purging.","why":["","","",""]},{"id":"q9-4","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following is a cognitive cause of eating disorders?","options":["Family history","Imbalances in brain chemistry","Dysfunctional attitudes about physical appearance and perfectionism","Weight-related bullying"],"ans":2,"exp":"Family history is genetic; brain chemistry is biological; bullying is social.","why":["","","",""]},{"id":"q9-5","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following is a long-term risk of eating disorders, according to your slides?","options":["Permanent harm to the heart, digestive system, bones, teeth, and mouth","Improved immune function","Lower risk of depression","Better nutrition"],"ans":0,"exp":"They're also linked with depression, anxiety, self-harm, and suicidal thoughts.","why":["","","",""]}]},{"name":"Personality Disorders","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q10-1","type":"mcq","topic":"Personality Disorders","stem":"Which of the following best describes personality disorders?","options":["Brief reactions to a stressful event","Enduring, inflexible patterns of experience and behavior that deviate from one's culture and begin in adolescence or early adulthood","Disorders that always begin in early childhood","Disorders caused only by trauma"],"ans":1,"exp":"They're stable over time and must interfere with daily living.","why":["","","",""]},{"id":"q10-2","type":"mcq","topic":"Personality Disorders","stem":"Which cluster is described as dramatic, emotional, and erratic?","options":["Cluster A","Cluster C","Cluster D","Cluster B"],"ans":3,"exp":"Cluster B: antisocial, histrionic, narcissistic, borderline.","why":["","","",""]},{"id":"q10-3","type":"mcq","topic":"Personality Disorders","stem":"Which personality disorder belongs in Cluster C?","options":["Schizoid","Avoidant","Narcissistic","Antisocial"],"ans":1,"exp":"Cluster C: avoidant, dependent, obsessive-compulsive.","why":["","","",""]},{"id":"q10-4","type":"mcq","topic":"Personality Disorders","stem":"A woman constantly needs to be the center of attention and makes dramatic, theatrical displays to get it. Which disorder fits best?","options":["Avoidant","Schizoid","Histrionic","Obsessive-compulsive"],"ans":2,"exp":"Histrionic = excessive emotionality and attention-seeking.","why":["","","",""]},{"id":"q10-5","type":"mcq","topic":"Personality Disorders","stem":"A man has an intense fear of rejection and avoids relationships, even though he wants friends. Which disorder fits best?","options":["Avoidant","Schizoid","Narcissistic","Paranoid"],"ans":0,"exp":"Schizoid people lack interest in relationships; avoidant people fear rejection.","why":["","","",""]},{"id":"q10-6","type":"mcq","topic":"Personality Disorders","stem":"Which disorder involves instability in mood, self-image, and relationships, with intense emotions and impulsivity?","options":["Borderline","Histrionic","Dependent","Schizotypal"],"ans":0,"exp":"DBT was originally developed to treat borderline personality disorder.","why":["","","",""]},{"id":"q10-7","type":"mcq","topic":"Personality Disorders","stem":"A woman believes in magic, dresses very oddly, and is suspicious of others. Which disorder fits best?","options":["Schizoid","Dependent","Antisocial","Schizotypal"],"ans":3,"exp":"Schizotypal: odd behavior and appearance, magical thinking.","why":["","","",""]},{"id":"q10-8","type":"mcq","topic":"Personality Disorders","stem":"A manager refuses to let anyone else do tasks because \"they won't do it right,\" and is rigid about rules and order. Which disorder fits best?","options":["Paranoid personality disorder","Histrionic personality disorder","Obsessive-compulsive personality disorder","Avoidant personality disorder"],"ans":2,"exp":"OCPD: perfectionism, rigidity, control, can't delegate.","why":["","","",""]},{"id":"q10-9","type":"mcq","topic":"Personality Disorders","stem":"Which of the following is listed as an environmental cause of personality disorders?","options":["Early childhood abuse, neglect, or trauma and poor attachment","Brain structure differences","Parenting styles in a culture","Genetic predisposition"],"ans":0,"exp":"Brain differences are biological; parenting styles are cultural; predisposition is genetic.","why":["","","",""]}]},{"name":"Treatment","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q11-1","type":"mcq","topic":"Treatment","stem":"Which of the following best describes deinstitutionalization?","options":["Using lobotomies in the 1930s and 1940s","Sending patients to asylums","Banning all medications","The late 20th-century movement to close asylums and treat patients with medication and therapy as outpatients"],"ans":3,"exp":"New medications made outpatient treatment possible.","why":["","","",""]},{"id":"q11-2","type":"mcq","topic":"Treatment","stem":"Who can prescribe psychotropic medications?","options":["Only a doctor or psychiatrist","Any therapist","Clinical psychologists only","School counselors"],"ans":0,"exp":"Most psychotherapy is done by clinical psychologists and psychotherapists, who can't prescribe.","why":["","","",""]},{"id":"q11-3","type":"mcq","topic":"Treatment","stem":"A therapist combines cognitive techniques with medication and group work to fit one client's needs. This is:","options":["Free association","An eclectic approach","Deinstitutionalization","A token economy"],"ans":1,"exp":"Eclectic = combining methods from different approaches.","why":["","","",""]},{"id":"q11-4","type":"mcq","topic":"Treatment","stem":"Which statement about psychotropic medications is correct?","options":["They cure psychological disorders","They treat symptoms, not the underlying cause of the disorder","They are never used with psychotherapy","They only affect hormones"],"ans":1,"exp":"Your slide: they treat symptoms by interacting with neurotransmitters.","why":["","","",""]},{"id":"q11-5","type":"mcq","topic":"Treatment","stem":"Anti-anxiety medications like Xanax and Valium work by:","options":["Blocking dopamine receptors","Blocking serotonin reuptake","Increasing the effects of GABA","Stabilizing mood with lithium"],"ans":2,"exp":"They're benzodiazepines that depress the CNS.","why":["","","",""]},{"id":"q11-6","type":"mcq","topic":"Treatment","stem":"A patient taking an antipsychotic develops repetitive, involuntary movements. This side effect is:","options":["Catatonic stupor","Tolerance","Hypomania","Tardive dyskinesia"],"ans":3,"exp":"Tardive dyskinesia is a medication-induced movement disorder.","why":["","","",""]},{"id":"q11-7","type":"mcq","topic":"Treatment","stem":"Which treatment uses magnetic pulses to treat chronic depression with no seizures and no memory loss?","options":["ECT","Lobotomy","rTMS","Lithium"],"ans":2,"exp":"ECT causes a seizure and can cause memory loss.","why":["","","",""]},{"id":"q11-8","type":"mcq","topic":"Treatment","stem":"Which is a drawback of electroconvulsive therapy (ECT)?","options":["It requires surgery on the frontal lobe","It increases suicide risk","Memory loss and a 40% relapse rate within 6 months","It only works on anxiety"],"ans":2,"exp":"ECT is used for extreme depression and reduces suicide risk, but no one knows why it works.","why":["","","",""]},{"id":"q11-9","type":"mcq","topic":"Treatment","stem":"The cardinal rule of psychotherapy is that a therapist must keep information confidential unless:","options":["The patient is a danger to themselves or others","The patient's family asks","The patient misses a session","The therapist is curious"],"ans":0,"exp":"Confidentiality is broken only for danger to self or others.","why":["","","",""]},{"id":"q11-10","type":"mcq","topic":"Treatment","stem":"What did Hans Eysenck's 1950s study conclude?","options":["Psychotherapy cures all disorders","Psychotherapy, especially psychoanalysis, was no more effective than no treatment","Medication never works","Group therapy is better than individual therapy"],"ans":1,"exp":"Today, meta-analysis shows psychotherapy is effective, especially with medication.","why":["","","",""]},{"id":"q11-11","type":"mcq","topic":"Treatment","stem":"Which ethical guideline means \"do no harm\" and weighing benefits against risks?","options":["Beneficence and nonmaleficence","Justice","Integrity","Fidelity and responsibility"],"ans":0,"exp":"Justice = equal treatment; integrity = honesty; fidelity = trust and responsibility.","why":["","","",""]},{"id":"q11-12","type":"mcq","topic":"Treatment","stem":"During free association, a patient suddenly goes blank and can't remember details. A psychodynamic therapist would call this:","options":["Resistance","Transference","Flat affect","Unconditional positive regard"],"ans":0,"exp":"Resistance is a mental block.","why":["","","",""]},{"id":"q11-13","type":"mcq","topic":"Treatment","stem":"What does research show about hypnosis?","options":["It reliably recovers repressed memories","It is the main treatment for schizophrenia","It was invented by Carl Rogers","It is NOT a valid way to retrieve memories, but it is used today for pain and anxiety"],"ans":3,"exp":"Freud used it; research shows it doesn't retrieve memories accurately.","why":["","","",""]},{"id":"q11-14","type":"mcq","topic":"Treatment","stem":"A therapist shows a caring, accepting, nonjudgmental attitude toward a client no matter what the client says. This is:","options":["Cognitive restructuring","Unconditional positive regard","Aversion therapy","Socratic questioning"],"ans":1,"exp":"A key part of Carl Rogers' person-centered therapy.","why":["","","",""]},{"id":"q11-15","type":"mcq","topic":"Treatment","stem":"Aaron Beck's negative cognitive triad involves negative thoughts about:","options":["Your parents, friends, and teachers","The past, present, and future","Your body, mind, and spirit","Yourself, the world, and the future"],"ans":3,"exp":"\"I'm worthless,\" \"No one cares,\" \"Things will never get better.\"","why":["","","",""]},{"id":"q11-16","type":"mcq","topic":"Treatment","stem":"A therapist helps a client with a fear of spiders rank situations from least to most scary while learning relaxation techniques. This is:","options":["Systematic desensitization","Aversion therapy","A token economy","Free association"],"ans":0,"exp":"Fear hierarchy + relaxation = systematic desensitization.","why":["","","",""]},{"id":"q11-17","type":"mcq","topic":"Treatment","stem":"Which therapy is described as the opposite of systematic desensitization?","options":["Exposure therapy","Biofeedback","Aversion therapy","Person-centered therapy"],"ans":2,"exp":"Aversion therapy pairs an unpleasant state with an unwanted behavior.","why":["","","",""]},{"id":"q11-18","type":"mcq","topic":"Treatment","stem":"A patient watches a screen showing her heart rate and learns to slow it down. This is:","options":["A token economy","Biofeedback","Free association","Dream interpretation"],"ans":1,"exp":"Biofeedback: monitoring, feedback, learning.","why":["","","",""]},{"id":"q11-19","type":"mcq","topic":"Treatment","stem":"Dialectical behavior therapy (DBT) was originally developed to treat:","options":["Schizophrenia","ADHD","Borderline personality disorder","Hoarding disorder"],"ans":2,"exp":"Its skills: mindfulness, distress tolerance, emotion regulation, interpersonal effectiveness.","why":["","","",""]},{"id":"q11-20","type":"mcq","topic":"Treatment","stem":"Which of the following is an advantage of group therapy over individual therapy?","options":["It's more personalized","It has more flexible scheduling","It's better for every disorder","It's cheaper and shows people they aren't the only ones with the problem"],"ans":3,"exp":"Individual therapy is more personalized and flexible but expensive.","why":["","","",""]}]},{"name":"Mock exam","mode":"exam","exam":"Mock exam","examTips":["Turn the Timer on and answer every question without looking anything up.","Aim for about one minute per question. Flag hard ones and come back."],"tips":["A mix of exam-style questions from every deck in this unit."],"questions":[{"id":"qM1","type":"mcq","topic":"Health Psychology","stem":"Which of the following best describes what happens when stress activates the sympathetic nervous system?","options":["The parasympathetic system shuts down permanently.","Hormones like cortisol are released, which can lead to hypertension, headaches, and immunosuppression.","Leptin levels rise and hunger disappears.","The body immediately returns to baseline."],"ans":1,"exp":"Stress → sympathetic nervous system → cortisol → hypertension, headaches, immunosuppression.","why":["","","",""]},{"id":"qM2","type":"mcq","topic":"Health Psychology","stem":"Which of the following is the best example of eustress?","options":["Being stuck in traffic every day","Preparing for a wedding you're excited about","Going through a divorce","Living through a natural disaster"],"ans":1,"exp":"Eustress = challenging but manageable \"good\" stress. The others are distress.","why":["","","",""]},{"id":"qM3","type":"mcq","topic":"Health Psychology","stem":"A dead phone, no Wi-Fi, and a deadline in the same afternoon are examples of:","options":["Catastrophes","Significant life changes","Eustress","Daily hassles"],"ans":3,"exp":"Daily hassles are everyday distress.","why":["","","",""]},{"id":"qM4","type":"mcq","topic":"Intro to Psychological Disorders","stem":"According to your slides, professionals label thoughts, feelings, and behaviors as a disorder when they are:","options":["Deviant, dysfunctional/maladaptive, and distressing","Rare, harmless, and temporary","Genetic, chronic, and dangerous","Diagnosed, treated, and cured"],"ans":0,"exp":"The 3 Ds.","why":["","","",""]},{"id":"qM5","type":"mcq","topic":"Intro to Psychological Disorders","stem":"A man believes that wearing his lucky socks helps his team win, but he functions well and isn't bothered by it. Why is this NOT considered a disorder?","options":["It isn't a real belief","Only women can have disorders","It isn't in the DSM-5","It isn't dysfunctional or distressing"],"ans":3,"exp":"A disorder needs all 3 Ds, not just being unusual.","why":["","","",""]},{"id":"qM6","type":"mcq","topic":"Intro to Psychological Disorders","stem":"Which approach explains disorders through chemical imbalances, genetics, tumors, or brain structure?","options":["Psychodynamic","Humanistic","Biological","Sociocultural"],"ans":2,"exp":"Biological = medical/genetic issues and neurotransmitters/hormones.","why":["","","",""]},{"id":"qM7","type":"mcq","topic":"Anxiety Disorders","stem":"Which of the following best describes anxiety disorders?","options":["Brief nervousness before a test","Persistent, excessive worry and fear that significantly interfere with daily life","Extreme mood swings between mania and depression","A loss of connection between thoughts and identity"],"ans":1,"exp":"That's the slide's definition; GAD, panic disorder, and phobias are examples.","why":["","","",""]},{"id":"qM8","type":"mcq","topic":"Anxiety Disorders","stem":"Which of the following best describes a specific phobia?","options":["An intense or irrational fear that is out of proportion to the actual threat","Constant worry about many everyday things","Sudden panic attacks for no reason","A fear of being judged in social situations"],"ans":0,"exp":"Specific phobias are tied to a particular object or situation.","why":["","","",""]},{"id":"qM9","type":"mcq","topic":"Anxiety Disorders","stem":"Which disorder is described as \"nonspecific worry and fear\" lasting at least 6 months?","options":["Specific phobia","Panic disorder","Generalized anxiety disorder","Agoraphobia"],"ans":2,"exp":"GAD worry isn't tied to one specific thing.","why":["","","",""]},{"id":"qM10","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Which of the following best describes depressive disorders?","options":["A sad, empty, or irritable mood with physical and cognitive changes that affect functioning","A temporary bad mood after a disappointment","Extreme mood swings between mania and depression","Persistent fear of social situations"],"ans":0,"exp":"Depression is a mental health condition, not just a temporary mood swing.","why":["","","",""]},{"id":"qM11","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"What is the key time difference between major depressive disorder and persistent depressive disorder?","options":["MDD lasts 2+ weeks; persistent depressive disorder lasts 2+ years","MDD lasts 2+ years; persistent lasts 2+ weeks","Both last 6 months","There is no time requirement"],"ans":0,"exp":"MDD = 2 weeks. Persistent = 2 years.","why":["","","",""]},{"id":"qM12","type":"mcq","topic":"Depressive & Bipolar Disorders","stem":"Changes in sleep in major depressive disorder can include:","options":["Only sleepwalking","Insomnia or hypersomnia","Only narcolepsy","No changes in sleep"],"ans":1,"exp":"Your slide: changes in sleep (insomnia or hypersomnia).","why":["","","",""]},{"id":"qM13","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Which of the following best describes neurodevelopmental disorders?","options":["Disorders that always start in adulthood","Disorders caused only by trauma","Issues in central nervous system functioning that begin to appear in early childhood","Disorders involving false beliefs and perceptions"],"ans":2,"exp":"They involve social, intellectual, academic, or interpersonal functioning.","why":["","","",""]},{"id":"qM14","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"ADHD is characterized by a persistent pattern of:","options":["Mania and depression","Obsessions and compulsions","Inattention and/or hyperactivity-impulsivity","Delusions and hallucinations"],"ans":2,"exp":"That pattern must interfere with functioning or development.","why":["","","",""]},{"id":"qM15","type":"mcq","topic":"Neurodevelopmental Disorders","stem":"Which of the following is an inattention symptom of ADHD?","options":["Talks excessively","Blurts out answers","Often loses things and is easily distracted","Runs and climbs excessively"],"ans":2,"exp":"Talking excessively and running are hyperactivity; blurting out is impulsivity.","why":["","","",""]},{"id":"qM16","type":"mcq","topic":"Dissociative Disorders","stem":"Which of the following best describes dissociative disorders?","options":["Hearing voices that aren't there","A loss of connection between thoughts, memories, feelings, surroundings, behavior, and identity","Extreme highs and lows in mood","Fear of open spaces"],"ans":1,"exp":"They involve escaping from reality in unhealthy ways.","why":["","","",""]},{"id":"qM17","type":"mcq","topic":"Dissociative Disorders","stem":"Which of the following is a symptom of dissociative amnesia?","options":["Loss of autobiographical information, like personal identity or relationships","Hearing voices","Grandiosity","Excessive hand washing"],"ans":0,"exp":"Dissociative amnesia = inability to recall important personal information.","why":["","","",""]},{"id":"qM18","type":"mcq","topic":"Dissociative Disorders","stem":"The distinct personality states in dissociative identity disorder are called:","options":["Obsessions","Alters","Delusions","Diatheses"],"ans":1,"exp":"Each alter has its own identity, memories, behaviors, and perspectives.","why":["","","",""]},{"id":"qM19","type":"mcq","topic":"Schizophrenia Spectrum","stem":"To be diagnosed on the schizophrenia spectrum, a patient must have:","options":["One symptom for 2 weeks","At least 2 symptoms for at least 6 months","Only negative symptoms for 1 month","Symptoms before age 12"],"ans":1,"exp":"Your slide: at least 2 symptoms (positive and negative) for at least 6 months.","why":["","","",""]},{"id":"qM20","type":"mcq","topic":"Schizophrenia Spectrum","stem":"Why did the DSM-5 place schizophrenia on a spectrum?","options":["It only has one symptom","It is the same as bipolar disorder","It always has the same severity","People experience its symptoms in a variety of ways"],"ans":3,"exp":"It's a spectrum of psychotic disorders.","why":["","","",""]},{"id":"qM21","type":"mcq","topic":"Schizophrenia Spectrum","stem":"Which of the following is a positive symptom of schizophrenia?","options":["Hallucinations","Flat affect","Catatonic stupor","Lack of motivation"],"ans":0,"exp":"Positive = added. The others are negative (absent).","why":["","","",""]},{"id":"qM22","type":"mcq","topic":"OCD & Trauma Disorders","stem":"In OCD, obsessions are best described as:","options":["Repetitive behaviors the person feels driven to perform","False perceptions","Mood swings","Recurrent and persistent intrusive thoughts"],"ans":3,"exp":"Obsessions = thoughts; compulsions = actions.","why":["","","",""]},{"id":"qM23","type":"mcq","topic":"OCD & Trauma Disorders","stem":"Which sequence matches the OCD cycle?","options":["Compulsion → obsession → relief → distress","Obsession → distress → compulsion → relief","Relief → obsession → compulsion → distress","Distress → relief → obsession → compulsion"],"ans":1,"exp":"The relief reinforces the compulsion, and the cycle repeats.","why":["","","",""]},{"id":"qM24","type":"mcq","topic":"OCD & Trauma Disorders","stem":"How did the DSM-5 change the classification of OCD?","options":["It removed OCD from the DSM","It made OCD a personality disorder","It moved OCD and related disorders out of anxiety disorders into their own category","It combined OCD with schizophrenia"],"ans":2,"exp":"This showed they are distinct from anxiety disorders.","why":["","","",""]},{"id":"qM25","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following is a primary symptom of anorexia nervosa?","options":["Eating large amounts in two hours","Hearing voices","Fear of open spaces","Intense fear of gaining weight even though underweight"],"ans":3,"exp":"Anorexia also includes refusing to maintain a minimally normal weight.","why":["","","",""]},{"id":"qM26","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Which of the following best describes bulimia nervosa?","options":["Refusing to eat and becoming severely underweight","Eating non-food items","Avoiding food because of disgust","Recurrent binge eating plus behaviors to prevent weight gain, like vomiting or laxatives"],"ans":3,"exp":"Binge + trying to prevent weight gain.","why":["","","",""]},{"id":"qM27","type":"mcq","topic":"Feeding & Eating Disorders","stem":"Why can bulimia nervosa be hard to spot?","options":["People often binge and purge privately","People with bulimia are always underweight","It has no symptoms","It only happens in children"],"ans":0,"exp":"Your slide: bulimia can be hard to spot because of private bingeing and purging.","why":["","","",""]},{"id":"qM28","type":"mcq","topic":"Personality Disorders","stem":"Which of the following best describes personality disorders?","options":["Brief reactions to a stressful event","Disorders that always begin in early childhood","Enduring, inflexible patterns of experience and behavior that deviate from one's culture and begin in adolescence or early adulthood","Disorders caused only by trauma"],"ans":2,"exp":"They're stable over time and must interfere with daily living.","why":["","","",""]},{"id":"qM29","type":"mcq","topic":"Personality Disorders","stem":"Which cluster is described as dramatic, emotional, and erratic?","options":["Cluster A","Cluster C","Cluster D","Cluster B"],"ans":3,"exp":"Cluster B: antisocial, histrionic, narcissistic, borderline.","why":["","","",""]},{"id":"qM30","type":"mcq","topic":"Personality Disorders","stem":"Which personality disorder belongs in Cluster C?","options":["Avoidant","Schizoid","Narcissistic","Antisocial"],"ans":0,"exp":"Cluster C: avoidant, dependent, obsessive-compulsive.","why":["","","",""]}]},{"name":"Practice exam: Treatment & Personality","mode":"exam","exam":"Treatment & Personality exam","examTips":["Like your test: 25 multiple-choice questions, mostly applied. Turn the Timer on and don't look anything up.","About 1 minute per question. Flag hard ones and come back."],"tips":["Every question gives a situation; name the treatment, drug, side effect, ethics principle or disorder that fits.","Wrong choices are close mix-ups (CBT vs. REBT, desensitization vs. aversion, schizoid vs. avoidant). Cross out what doesn't fit the details."],"questions":[{"id":"TP1","type":"mcq","topic":"Treatment","stem":"A man with schizophrenia starts a drug that quiets his hallucinations. Months later he develops repetitive, involuntary lip-smacking. Which drug type and side effect fit?","options":["An antidepressant (SSRI); tardive dyskinesia","A mood stabilizer; catatonic stupor","An antipsychotic; tardive dyskinesia","An anti-anxiety drug; dependency and drowsiness"],"ans":2,"exp":"Antipsychotics block dopamine to reduce positive symptoms; tardive dyskinesia is their movement side effect.","why":["Tardive dyskinesia comes from antipsychotics, and SSRIs don't treat hallucinations.","Catatonic stupor is a negative symptom of schizophrenia, not a drug side effect.","","Benzodiazepines can cause dependency, but they don't reduce hallucinations."]},{"id":"TP2","type":"mcq","topic":"Treatment","stem":"A patient is diagnosed with bipolar disorder. Which medication is the classic treatment on your slides?","options":["Prozac, an SSRI that blocks serotonin reuptake","Xanax, a benzodiazepine that boosts GABA","Lithium, a mood stabilizer","Antabuse, which makes alcohol cause sickness"],"ans":2,"exp":"Mood stabilizers like lithium treat bipolar disorder.","why":["SSRIs are antidepressants; the bipolar example is lithium.","That is an anti-anxiety drug.","","Antabuse is used in aversion therapy for alcoholism."]},{"id":"TP3","type":"mcq","topic":"Treatment","stem":"A doctor prescribes a drug that depresses the central nervous system and increases the effects of GABA to calm a patient's constant tension. Which side effects should the patient watch for?","options":["Drowsiness and dependency","Tardive dyskinesia and weight gain","Memory loss and a 40% relapse rate","Fatigue, forgetfulness and insomnia"],"ans":0,"exp":"Anti-anxiety medications (benzodiazepines) can cause drowsiness and dependency.","why":["","Those are antipsychotic side effects.","Those are ECT drawbacks.","Those are listed for antidepressants (SSRIs)."]},{"id":"TP4","type":"mcq","topic":"Treatment","stem":"A patient with chronic depression wants a brain-stimulation treatment where she stays awake, has no seizure, and has no memory loss. Which fits?","options":["Electroconvulsive therapy (ECT)","A lobotomy","Biofeedback","rTMS"],"ans":3,"exp":"rTMS uses magnetic pulses: no seizures, no memory loss, person awake.","why":["ECT causes a seizure and can cause memory loss.","That is psychosurgery and is rarely used today.","Biofeedback trains control of body responses; it doesn't stimulate the brain.",""]},{"id":"TP5","type":"mcq","topic":"Treatment","stem":"A family is considering ECT for their son's severe depression. Which concern is supported by your slides?","options":["It cuts the main connections to the frontal lobe","It only reduces the positive symptoms of schizophrenia","About 40% relapse within 6 months","It is mainly used for mild, everyday anxiety"],"ans":2,"exp":"ECT drawbacks: memory loss, about 40% relapse within 6 months, and no one knows why it works.","why":["That describes a lobotomy.","ECT is used for extreme depression.","","ECT is for extreme depression."]},{"id":"TP6","type":"mcq","topic":"Treatment","stem":"During a session, a client says he plans to seriously hurt his roommate tonight. What should the therapist do?","options":["Keep it private, because confidentiality has no exceptions at all","Wait until the next session to discuss it further","Break confidentiality to protect the roommate","Switch the client to group therapy"],"ans":2,"exp":"Confidentiality is the cardinal rule unless the client is a danger to themselves or others.","why":["The exception is danger to self or others.","The danger is immediate.","","That doesn't address the danger."]},{"id":"TP7","type":"mcq","topic":"Treatment","stem":"A therapist tells a client a treatment is proven to work, even though she knows it isn't. Which ethics principle is she violating?","options":["Justice","Integrity","Beneficence and nonmaleficence","Respect for rights and dignity"],"ans":1,"exp":"Integrity: honesty, accuracy and transparency. No lying to the client.","why":["Justice is about fairness and equal access.","","That is about weighing harm; the problem here is lying.","That is about privacy and self-determination."]},{"id":"TP8","type":"mcq","topic":"Personality","stem":"A man cons elderly people out of their savings, lies constantly, and shows no guilt. Which disorder and cluster fit best?","options":["Narcissistic, Cluster A","Antisocial, Cluster B","Paranoid, Cluster A","Schizotypal, Cluster C"],"ans":1,"exp":"Antisocial personality disorder: disregard for others' rights, no remorse. Cluster B.","why":["Narcissism is in Cluster B, and its core is self-importance, not violating others' rights.","","Paranoid personality disorder is distrust of others.","Schizotypal is Cluster A and involves odd thinking."]},{"id":"TP9","type":"mcq","topic":"Treatment","stem":"A therapist mostly listens, restates the client's feelings (\"It sounds like you feel unseen\"), and never tells him what to do. Which therapy and technique are these?","options":["Psychodynamic therapy, using free association and dream interpretation","Person-centered therapy, active listening","CBT, using cognitive restructuring","REBT, confronting irrational beliefs"],"ans":1,"exp":"Rogers' person-centered therapy uses active listening: echo, restate, clarify.","why":["The therapist isn't interpreting the unconscious.","","CBT actively challenges thoughts.","REBT is confrontational, not non-directive."]},{"id":"TP10","type":"mcq","topic":"Treatment","stem":"A therapist bluntly tells an anxious client, \"It's irrational to believe everyone must like you,\" then has him replace that belief. Which therapy is this?","options":["Person-centered therapy","REBT","Systematic desensitization","Psychodynamic therapy"],"ans":1,"exp":"REBT (Ellis) confronts irrational beliefs: identify, challenge, replace.","why":["That is non-directive and accepting, not confrontational.","","That uses relaxation and a fear hierarchy.","That explores the unconscious."]},{"id":"TP11","type":"mcq","topic":"Treatment","stem":"A client afraid of flying learns deep breathing, then imagines each step from booking a ticket to takeoff while staying calm. Which therapy is this?","options":["Aversion therapy","A token economy","Rational emotive behavior therapy (REBT)","Systematic desensitization"],"ans":3,"exp":"Systematic desensitization: a fear hierarchy plus relaxation.","why":["Aversion pairs an unwanted behavior with something unpleasant.","That rewards behavior with tokens.","REBT confronts beliefs; this uses relaxation and a fear hierarchy.",""]},{"id":"TP12","type":"mcq","topic":"Treatment","stem":"To stop drinking, a man takes a pill that makes him sick whenever he drinks alcohol. Which therapy is this, and how does it work?","options":["Aversion therapy: drinking is paired with feeling ill","Systematic desensitization: drinking is paired with relaxation","Token economy: he earns rewards for staying sober","Biofeedback: sensors show his body's reaction"],"ans":0,"exp":"Antabuse pairs a negative outcome with a previously pleasant stimulus.","why":["","That reduces fear; it doesn't make drinking unpleasant.","No rewards are involved.","No sensors or feedback are involved."]},{"id":"TP13","type":"mcq","topic":"Treatment","stem":"On a psychiatric ward, patients earn points for showering and making their beds and trade them for TV time. Which principle is at work?","options":["Operant conditioning (a token economy)","Counterconditioning (aversion therapy)","Unconditional positive regard","Free association"],"ans":0,"exp":"A token economy rewards desired behavior with tokens.","why":["","No unpleasant state is paired with a behavior.","That is a humanistic attitude, not a reward system.","That is a psychodynamic technique."]},{"id":"TP14","type":"mcq","topic":"Treatment","stem":"A woman with tension headaches watches a screen that shows her muscle tension and gradually learns to lower it on purpose. Which therapy is this?","options":["rTMS","Hypnosis","Exposure therapy","Biofeedback"],"ans":3,"exp":"Biofeedback: sensors feed body data back so you learn to control it.","why":["rTMS stimulates neurons with magnets.","Hypnosis induces relaxation but doesn't use sensor feedback.","Exposure is facing what you avoid.",""]},{"id":"TP15","type":"mcq","topic":"Treatment","stem":"A client with borderline personality disorder learns mindfulness, distress tolerance, emotion regulation and interpersonal effectiveness. Which therapy is this?","options":["REBT","DBT","Psychoanalysis","Aversion therapy"],"ans":1,"exp":"DBT, a modified CBT, was originally developed for borderline personality disorder.","why":["REBT confronts irrational beliefs.","","That explores the unconscious.","That pairs a behavior with discomfort."]},{"id":"TP16","type":"mcq","topic":"Treatment","stem":"During free association, a patient goes blank every time her mother comes up. What would a psychodynamic therapist call this?","options":["Resistance","Flat affect","Unconditional positive regard","Catatonic stupor"],"ans":0,"exp":"Resistance is a mental block during free association.","why":["","Flat affect is a lack of emotional expression in schizophrenia.","That is the therapist's accepting attitude.","That is a lack of movement."]},{"id":"TP17","type":"mcq","topic":"Treatment","stem":"A client says, \"I'm a failure, nobody cares about me, and it will never get better.\" Which theory explains this pattern, and what is it called?","options":["Rogers' unconditional positive regard","Beck's negative cognitive triad","Eysenck's finding that therapy doesn't work","Freud's interpretation of dreams"],"ans":1,"exp":"Beck: negative thoughts about me, the world and the future.","why":["That is a therapist's accepting attitude.","","Eysenck studied therapy outcomes, not thought patterns.","That is psychodynamic."]},{"id":"TP18","type":"mcq","topic":"Treatment","stem":"A student cites a 1950s study claiming therapy is no better than no treatment. Which reply best fits current evidence?","options":["Meta-analyses show it works, especially with medication","The study proved that only psychoanalysis is effective for most people","Modern research shows therapy works only without medication","Therapy works best when there is no therapeutic alliance"],"ans":0,"exp":"Eysenck's 1950s claim has been answered by meta-analyses showing therapy is effective.","why":["","Eysenck found psychoanalysis no better than nothing.","It works best with medication.","A strong alliance helps therapy work."]},{"id":"TP19","type":"mcq","topic":"Treatment","stem":"A psychologist teaches a client relaxation, challenges his negative thoughts, and refers him for medication. Which approach is this?","options":["Non-directive therapy","Psychodynamic therapy","The eclectic approach","Deinstitutionalization"],"ans":2,"exp":"Eclectic = combining methods that fit the client.","why":["She is actively directing treatment.","She isn't exploring the unconscious.","","That is the historical closing of asylums."]},{"id":"TP20","type":"mcq","topic":"Treatment","stem":"A clinical psychologist believes her client needs an antidepressant. What should happen?","options":["The psychologist prescribes it herself after a full evaluation","The client buys it without a prescription","The psychologist uses hypnosis instead","A doctor or psychiatrist prescribes it"],"ans":3,"exp":"Medications can only be prescribed by a doctor or psychiatrist.","why":["Only doctors and psychiatrists can prescribe.","It needs a doctor or psychiatrist.","Hypnosis doesn't replace medication.",""]},{"id":"TP21","type":"mcq","topic":"Treatment","stem":"Which is an advantage of group therapy over individual therapy, according to your slides?","options":["It's more personalized and more private than individual sessions","It has more flexible scheduling","It works for every disorder","It's cheaper and eases isolation"],"ans":3,"exp":"Group: cheaper, shows you aren't alone, coping skills together, relieves isolation.","why":["That describes individual therapy.","That is individual therapy.","Some disorders need individual therapy.",""]},{"id":"TP22","type":"mcq","topic":"Personality","stem":"Ben has no friends and says he doesn't want any; praise and criticism leave him unmoved. Ana has no friends but badly wants them and fears rejection. Which disorders fit?","options":["Ben schizoid; Ana avoidant","Ben avoidant; Ana schizoid","Ben schizotypal; Ana dependent","Both have dependent personality disorder"],"ans":0,"exp":"Schizoid = no interest in relationships; avoidant = wants them but fears rejection.","why":["","This swaps them: avoidant people want relationships but fear rejection.","Ben shows no magical thinking, and Ana isn't clingy for decisions.","Neither relies on others to make decisions."]},{"id":"TP23","type":"mcq","topic":"Personality","stem":"In the order listed, which clusters do paranoid, histrionic and dependent personality disorders belong to?","options":["A, B, C","B, A, C","A, C, B","C, B, A"],"ans":0,"exp":"A = odd (paranoid), B = dramatic (histrionic), C = anxious (dependent).","why":["","Paranoid is Cluster A, histrionic is Cluster B.","Histrionic is B and dependent is C.","Paranoid is A and dependent is C."]},{"id":"TP24","type":"mcq","topic":"Personality","stem":"Kara has unstable moods, a shifting self-image, and intense, stormy relationships. Which disorder fits, and which therapy was first developed for it?","options":["Bipolar I; lithium","Histrionic; REBT","Borderline; DBT","Narcissistic; psychoanalysis"],"ans":2,"exp":"Borderline: instability in mood, self-image and relationships. DBT was developed for it.","why":["Bipolar centers on mood episodes, not unstable relationships and self-image.","Histrionic is attention-seeking; REBT is mainly for anxiety.","","Narcissism is grandiosity and entitlement."]},{"id":"TP25","type":"mcq","topic":"Personality","stem":"Mark redoes all group work himself because no one else will do it right and keeps strict rules for everything, but he has no intrusive thoughts or rituals. Which fits best?","options":["Obsessive-compulsive disorder (OCD) with obsessions and compulsions","Dependent personality disorder","Paranoid personality disorder","Obsessive-compulsive personality disorder"],"ans":3,"exp":"OCPD: perfectionism, rigidity, need for control, can't delegate.","why":["He has no intrusive thoughts or rituals.","He takes control instead of relying on others.","His issue is perfectionism, not distrust.",""]}]}]}},"per":{"images":{},"decks":[{"id":1,"name":"Perception","optional":false,"sections":[{"name":"Attention","cards":[{"term":"Selective attention","def":"Focusing your conscious awareness on a particular stimulus and NOT something else.","hook":"","asks":[{"q":"While reading a great book on a noisy bus, you don't notice the conversation next to you. What is this?","right":"Selective attention","wrong":[["Inattentional blindness to an object right in front of you","That is missing a visible object, not tuning out sound while focusing."],["The Stroop effect","That is slowed color naming."],["Weber's law","That is about noticing differences."]],"exp":"Focusing on one stimulus and not others."},{"q":"Why can a student miss the teacher's announcement while texting?","right":"Attention was focused on the phone","wrong":[["The announcement was below her absolute threshold for hearing sound","She could hear it; she wasn't attending."],["She has prosopagnosia","Not related."],["The Stroop effect","Not related."]],"exp":"Selective attention: focusing on one stimulus and not others."}]},{"term":"Stroop effect","def":"Delayed reaction time when you must say the color of a word but not the name of the word. Example from your slides: the word GREEN printed in purple, where you have to say \"purple.\"","hook":"The word fights the color.","asks":[{"q":"You're asked to say the ink color of the word RED printed in blue, and you hesitate. What is this?","right":"The Stroop effect","wrong":[["The cocktail party effect of picking out one voice","That is about focusing on one voice."],["Change blindness","That is missing a change."],["Pop-out","That is something different grabbing attention."]],"exp":"The word fights the color, slowing your reaction."},{"q":"Why is naming the ink color of the word BLUE printed in red slow?","right":"The word's meaning fights the color","wrong":[["The colors are below the absolute threshold for vision in most people","Not the reason."],["Change blindness","Not related."],["Weber's law","Not related."]],"exp":"The word fights the color."}]},{"term":"Change blindness","def":"Failing to notice changes in the environment because your attention is directed elsewhere.","hook":"Missed a CHANGE.","asks":[{"q":"In a video, a person's shirt changes color between shots, and most viewers never notice. What is this?","right":"Change blindness","wrong":[["Inattentional blindness to an object that is always there","Nothing was missed entirely; a change was missed."],["Selective attention","That is the focusing itself."],["The Stroop effect","That is about color words."]],"exp":"Missing a change because attention is elsewhere."},{"q":"Which situation shows change blindness?","right":"Not noticing a friend's new haircut","wrong":[["Missing a person in a gorilla suit who walks right through a game","That is inattentional blindness."],["Hearing your name","That is the cocktail party effect."],["Reading scrambled words","That is top-down processing."]],"exp":"Missing a change."}]},{"term":"Inattentional blindness","def":"Failing to see visible objects when your attention is directed elsewhere.","hook":"Missed a THING that was right there.","asks":[{"q":"While counting basketball passes, viewers completely miss a person in a gorilla suit walking through. What is this?","right":"Inattentional blindness","wrong":[["Change blindness, missing that something has changed","Nothing changed; a visible object was missed."],["The pop-out effect","The gorilla did not pop out for them."],["Absolute threshold","That is the weakest detectable stimulus."]],"exp":"Failing to see a visible object when attention is elsewhere."},{"q":"A driver texting at a light never sees a cyclist right in front of her. What is this?","right":"Inattentional blindness","wrong":[["Change blindness, where she misses that something has changed","Nothing changed; she missed a visible object."],["Selective attention to the cyclist","She wasn't attending to the cyclist."],["Absolute threshold","The cyclist was visible."]],"exp":"Failing to see a visible object when attention is elsewhere."}]},{"term":"Change vs. inattentional blindness","def":"Both happen because attention is directed elsewhere. Change blindness = not noticing that something changed. Inattentional blindness = not seeing a visible object at all.","hook":"","asks":[{"q":"What is the key difference between change blindness and inattentional blindness?","right":"Missing a change vs. missing an object","wrong":[["One involves hearing while the other involves vision","Both are about attention to what you see."],["Only change blindness involves attention","Both happen because attention is elsewhere."],["Only inattentional blindness is real","Both are real."]],"exp":"Change blindness = not noticing a change; inattentional blindness = not seeing an object at all."},{"q":"In both change blindness and inattentional blindness, what is the cause?","right":"Attention is directed elsewhere","wrong":[["Damage to the eyes or to the occipital lobe of the brain","Not the cause."],["ESP","Not related."],["Hearing loss","Not related."]],"exp":"Both happen because attention is directed elsewhere."}]},{"term":"Cocktail party effect","def":"The ability to focus auditory attention on a particular voice or sound while filtering out others. In a crowded room, you can focus on the voice of the one person you're talking with.","hook":"","asks":[{"q":"At a loud party, you can follow your friend's voice and tune out everyone else. What is this?","right":"The cocktail party effect","wrong":[["The Stroop effect, a conflict between word and color","That is about word-color conflict."],["Change blindness","That is missing a change."],["Weber's law","That is about differences."]],"exp":"Focusing auditory attention on one voice."},{"q":"Which ability does the cocktail party effect describe?","right":"Focusing on one voice among many","wrong":[["Seeing the one face that is different in a crowd of other faces","That is pop-out."],["Reading a jumbled word","That is top-down."],["Naming ink colors","That is Stroop."]],"exp":"Focusing auditory attention on one voice while filtering out others."}]},{"term":"Hearing your name","def":"Part of the cocktail party effect: when we hear our name, our brain can register it even amongst background noise.","hook":"","asks":[{"q":"In a noisy cafeteria, you suddenly notice someone across the room say your name. What explains this?","right":"Your brain registers your name in background noise","wrong":[["Clairvoyance, perceiving events you didn't witness yourself","No scientific basis, and you did hear it."],["Inattentional blindness","You noticed it."],["Absolute threshold only","This is part of the cocktail party effect."]],"exp":"Part of the cocktail party effect."},{"q":"Which bigger effect is hearing your name across a noisy room part of?","right":"The cocktail party effect","wrong":[["The pop-out phenomenon, which is about things that look different","That is visual."],["Change blindness","That is missing changes."],["The Barnum effect","That is personality descriptions."]],"exp":"Part of the cocktail party effect."}]},{"term":"Pop-out phenomenon","def":"Something different popping out to get our attention, like the one laughing face in the cartoon of a crying movie audience on your slides.","hook":"","asks":[{"q":"In a crowd of people dressed in black, the one person in bright yellow catches your eye instantly. What is this?","right":"The pop-out phenomenon","wrong":[["Selective attention to something you chose to focus on first","You didn't choose it; it grabbed you."],["Change blindness","That is missing a change."],["Top-down processing","Pop-out is about something different grabbing attention."]],"exp":"Something different pops out to get our attention."},{"q":"On your slides, what is the example of the pop-out phenomenon?","right":"One laughing face in a crying audience","wrong":[["A gorilla in a basketball game that nobody watching seems to notice","That is inattentional blindness."],["The word GREEN in purple","That is Stroop."],["A ticking watch at 20 feet","That is a threshold."]],"exp":"Something different pops out to get our attention."}]}]},{"name":"Top-down vs. bottom-up","cards":[{"term":"Bottom-up processing","def":"Sensory receptors throughout the body register information about the external environment and send it up to the brain for processing. This is sensation.","hook":"Bottom-up = from the body up = sensation.","asks":[{"q":"Your skin registers cold air and sends that signal up to your brain. Which kind of processing is this?","right":"Bottom-up processing","wrong":[["Top-down processing, using what you already know","That uses knowledge to interpret, not raw input."],["Telepathy","No scientific basis."],["Weber's law","That is about differences."]],"exp":"From the body up: sensation."},{"q":"Which is bottom-up processing?","right":"Your ears picking up raw sound waves","wrong":[["Using what you already know to recognize a song after one note","That is top-down."],["Reading a word as a whole","That is top-down."],["Guessing a blurry shape is your coat","That is top-down."]],"exp":"Sensation: receptors send information up to the brain."}]},{"term":"Top-down processing","def":"Using your knowledge, experience, or context to understand and interpret sensory perceptions. This is perception.","hook":"Top-down = your brain's knowledge comes down = perception.","asks":[{"q":"You see a blurry shape in your dark bedroom and realize it's your coat, because you know where you hung it. Which processing is this?","right":"Top-down processing","wrong":[["Bottom-up processing, raw input from the senses","Your knowledge is doing the work here."],["Change blindness","That is missing a change."],["Absolute threshold","That is the weakest detectable stimulus."]],"exp":"Using knowledge and context to interpret: perception."},{"q":"Why can you understand a friend in a loud cafeteria even if you miss some words?","right":"You use context to fill in the gaps","wrong":[["Your ears pick up every single sound wave perfectly clearly","You miss some sounds; knowledge fills in."],["Bottom-up processing only","Context is top-down."],["ESP","No scientific basis."]],"exp":"Top-down: using knowledge and context to interpret."}]},{"term":"Reading scrambled words","def":"You can read words with scrambled middle letters as long as the first and last letters are in the right place, because the mind reads the word as a whole, not every letter by itself. An example of top-down processing.","hook":"","asks":[{"q":"You can read \"Tihs sneetnce is esay to raed\" without much trouble. What explains this?","right":"Top-down processing of whole words","wrong":[["Bottom-up processing of every single letter in order","You read words as wholes, not letter by letter."],["The Stroop effect","That slows reading color words."],["The pop-out effect","Nothing pops out."]],"exp":"The mind reads the word as a whole when first and last letters are right."},{"q":"Which letters must be in the right place for scrambled words to stay readable, per your card?","right":"The first and last letters","wrong":[["Only the vowels, which can be moved anywhere in the middle","Your card says first and last letters."],["Only the middle letters","Those can be scrambled."],["None","First and last must be right."]],"exp":"The mind reads the word as a whole."}]},{"term":"The handwriting example","def":"Being aware of squiggles like \"15\" in a messy note is bottom-up (sensation). Knowing what the squiggles mean is top-down (perception).","hook":"","asks":[{"q":"In a messy note, you notice squiggles (sensation) and then realize they say \"15\" (meaning). Which part is top-down?","right":"Knowing the squiggles mean \"15\"","wrong":[["Seeing the ink marks on the paper before knowing their meaning","That is bottom-up sensation."],["Holding the paper","Not part of the example."],["Both parts equally","Only the meaning is top-down."]],"exp":"Awareness of squiggles = bottom-up; knowing what they mean = top-down."},{"q":"In the messy-note example, which part is bottom-up?","right":"Being aware of the squiggles","wrong":[["Knowing that the squiggles on the note actually mean the number 15","That is top-down."],["Answering the note","Not part of the example."],["Forgetting the note","Not part of the example."]],"exp":"Squiggles = sensation (bottom-up); meaning = perception (top-down)."}]}]},{"name":"Thresholds","cards":[{"term":"Absolute threshold","def":"The weakest amount of a stimulus that a person can detect 50% of the time: the moment when you notice something.","hook":"","asks":[{"q":"A hearing test plays a tone more and more softly. The softest level you detect half the time is what?","right":"Your absolute threshold","wrong":[["Your difference threshold, the change you can notice","That is about noticing a change between two stimuli."],["Weber's law","That is about percentages."],["Selective attention","That is focus."]],"exp":"The weakest stimulus detected 50% of the time."},{"q":"What percentage of the time must you detect a stimulus for it to count as your absolute threshold?","right":"50%","wrong":[["100%, every single time that the stimulus is presented to you","The threshold is 50%."],["10%","Too low."],["75%","Not the definition."]],"exp":"The weakest stimulus detected 50% of the time."}]},{"term":"Absolute threshold examples","def":"Hearing a watch ticking 20 feet away; tasting one teaspoon of salt dissolved in two gallons of water; the volume of the music in your car.","hook":"","asks":[{"q":"Which is one of your slides' examples of an absolute threshold?","right":"Hearing a watch tick 20 feet away","wrong":[["Noticing music jump from level 5 to level 10 in the car","That is a just noticeable difference."],["Seeing a gorilla in a video","That is about attention."],["Reading scrambled words","That is top-down processing."]],"exp":"Watch at 20 feet, a teaspoon of salt in two gallons, car music volume."},{"q":"Tasting one teaspoon of salt in two gallons of water is an example of what?","right":"An absolute threshold","wrong":[["A just noticeable difference between two different amounts of salt","Only one stimulus is detected here."],["Weber's law","That compares differences."],["Sensory interaction","Not the example."]],"exp":"An absolute threshold example on your slides."}]},{"term":"Difference threshold (just noticeable difference)","def":"The minimum amount something needs to change before a person notices the change 50% of the time.","hook":"JND = just noticeable difference.","asks":[{"q":"Your mom turns the TV volume up one notch and you don't notice, but at three notches you do. What did three notches pass?","right":"The just noticeable difference","wrong":[["The absolute threshold, the weakest sound you can hear","You could already hear the TV."],["The Stroop effect","Not related."],["Change blindness","You did notice it."]],"exp":"The minimum change noticed 50% of the time."},{"q":"What is the difference threshold measuring?","right":"The smallest change you notice","wrong":[["The weakest stimulus that you can detect at all, half of the time","That is the absolute threshold."],["How long a sound lasts","Not the definition."],["How many senses you use","Not the definition."]],"exp":"The minimum change noticed 50% of the time."}]},{"term":"JND example","def":"Car music on level 5: you probably can't notice a change to 6, but you probably can notice a change from 5 to 10.","hook":"","asks":[{"q":"Car music is on level 5. According to your slide, which change are you most likely to notice?","right":"From 5 to 10","wrong":[["From 5 to 6, just one level louder than before","Too small a change to notice, per the slide."],["From 5 to 5","No change."],["From 5 to 5.5","Even smaller than 5 to 6."]],"exp":"5 to 6 is probably unnoticed; 5 to 10 is noticed."},{"q":"Why might you not notice the music going from level 5 to 6 in your car?","right":"The change is below the JND","wrong":[["Level 6 is below the absolute threshold for hearing sounds at all","You can hear it; the change is too small."],["The Stroop effect","Not related."],["Change blindness","That's visual attention."]],"exp":"Changes smaller than the just noticeable difference aren't noticed."}]},{"term":"Weber's law","def":"For an average person to perceive a difference, two stimuli must differ by a constant percentage, not a constant amount.","hook":"Weber = percentage.","asks":[{"q":"Adding one candle to a room lit by 2 candles is obvious, but adding one to a room with 100 candles isn't. Which law explains this?","right":"Weber's law","wrong":[["The all-or-none principle of how a neuron fires","That is about neurons firing."],["The 68% rule","That is about normal curves."],["Gate control theory","That is about pain."]],"exp":"Differences must be a constant percentage, not a constant amount."},{"q":"Why would adding $1 to a $2 snack be noticeable, but not adding $1 to a $500 phone?","right":"Weber's law: the change must be a percentage","wrong":[["The absolute threshold for prices, the smallest amount people can see","This is about noticing a change."],["The cocktail party effect","Not related."],["Top-down processing","Not the law here."]],"exp":"Two stimuli must differ by a constant percentage."}]},{"term":"Weber's law examples","def":"Add 1 ounce to a 10-ounce weight and you will detect the difference; add 1 ounce to a 100-ounce weight and you likely won't. Weight must change by 2% to notice a difference.","hook":"","asks":[{"q":"Using your slide's 2% rule, how much would you need to add to a 100-ounce weight to notice the difference?","right":"About 2 ounces","wrong":[["About 1 ounce, the same as for a 10-ounce weight","1 ounce is only 1% of 100."],["About 20 ounces","Far more than needed."],["Nothing","Some change is needed."]],"exp":"2% of 100 ounces is 2 ounces."},{"q":"Under the 2% rule on your slide, how much weight must be added to a 50-ounce weight to notice it?","right":"About 1 ounce","wrong":[["About 10 ounces, which is twenty percent of the whole weight","Far more than 2%."],["About 5 ounces","That's 10%."],["Nothing","Some change is needed."]],"exp":"2% of 50 ounces is 1 ounce."}]}]},{"name":"Extrasensory perception","cards":[{"term":"Extrasensory perception (ESP)","def":"The claim of perceiving without the senses: telepathy, clairvoyance, and precognition. There is no scientific basis for it.","hook":"","asks":[{"q":"A friend claims she can sense things without using her senses. What does science say about this?","right":"There is no scientific basis for ESP","wrong":[["It has been proven in many careful lab experiments over the years","There is no scientific basis."],["It works only for police","Psychic visions are no better than guesses."],["It is a type of bottom-up processing","Bottom-up uses the senses."]],"exp":"Telepathy, clairvoyance and precognition lack scientific support."},{"q":"Which three claims make up ESP on your slides?","right":"Telepathy, clairvoyance, precognition","wrong":[["Synesthesia, prosopagnosia and phantom limb sensations","Those are real conditions, not ESP."],["Proximity, similarity, closure","Those are Gestalt."],["Rods, cones, ganglia","Those are in the eye."]],"exp":"ESP: telepathy, clairvoyance, precognition."}]},{"term":"Telepathy","def":"Mind-to-mind communication.","hook":"Tele-path = sending a message down a path to another mind.","asks":[{"q":"A man claims he can send his thoughts straight into his twin's mind. What ESP claim is this?","right":"Telepathy","wrong":[["Clairvoyance, seeing events you weren't present for","That is perceiving distant events."],["Precognition","That is perceiving the future."],["Synesthesia","That is mixed senses, and it's real."]],"exp":"Mind-to-mind communication."},{"q":"Which claim is telepathy rather than precognition?","right":"\"I can read what you're thinking.\"","wrong":[["\"I knew the plane would crash before it ever left the ground.\"","That is precognition."],["\"I can see where the treasure is buried.\"","That is clairvoyance."],["\"I hear colors.\"","That is synesthesia."]],"exp":"Mind-to-mind communication."}]},{"term":"Clairvoyance","def":"Perceiving events you didn't actually witness, like knowing where a body is buried or how someone was murdered.","hook":"Clair-voyance = \"clear seeing\" of something you weren't there for.","asks":[{"q":"A psychic says she can \"see\" where a missing person is hidden without having been there. What ESP claim is this?","right":"Clairvoyance","wrong":[["Precognition, perceiving events in the future","She is claiming to see a present or past event."],["Telepathy","That is mind-to-mind."],["Top-down processing","That uses real senses and knowledge."]],"exp":"Perceiving events you didn't witness."},{"q":"A psychic claims she can describe how a crime happened without having been there. What claim is this?","right":"Clairvoyance","wrong":[["Telepathy, reading the thoughts of the person who is in front of her","That is mind-to-mind."],["Precognition","That is the future."],["Top-down processing","That uses real senses."]],"exp":"Perceiving events you didn't witness."}]},{"term":"Precognition","def":"Perceiving future events.","hook":"Pre = before it happens.","asks":[{"q":"A woman claims she dreamed about a plane crash before it happened. What ESP claim is this?","right":"Precognition","wrong":[["Telepathy, sending thoughts straight to another mind","That is mind-to-mind."],["Clairvoyance","That is seeing events you weren't at."],["Change blindness","That is attention."]],"exp":"Perceiving future events."},{"q":"Which claim is precognition?","right":"\"I dreamed the score before the game.\"","wrong":[["\"I can send my thoughts to my sister who lives in another city.\"","That is telepathy."],["\"I can see a hidden object.\"","That is clairvoyance."],["\"I noticed the haircut.\"","Not ESP."]],"exp":"Perceiving future events."}]},{"term":"Psychics and the police","def":"Psychic visions given to police are no more accurate than guesses made by others.","hook":"","asks":[{"q":"Police get tips from a psychic about an unsolved case. How useful are they, according to your slides?","right":"No more accurate than others' guesses","wrong":[["Usually more accurate than the evidence gathered by detectives","Not supported."],["Always correct","Not supported."],["Useful only for missing pets","Not on your slides."]],"exp":"Psychic visions are no better than guesses."},{"q":"A detective asks whether to rely on a psychic's vision. What does the evidence on your slides say?","right":"It's no better than guessing","wrong":[["It is much more accurate than the clues that detectives can find","Not supported."],["It's always wrong","It's like a guess, sometimes right."],["It's proven by science","No scientific basis."]],"exp":"Psychic visions given to police are no more accurate than others' guesses."}]},{"term":"Why psychics seem accurate","def":"Psychics make so many predictions that one of them is bound to be correct at some point, and people focus on the 1 or 2 correct predictions and forget most of the incorrect ones.","hook":"","asks":[{"q":"A psychic makes 50 predictions a year and one comes true. Why do people still believe in her?","right":"They remember hits and forget misses","wrong":[["Most of her predictions turn out to be completely correct","Most were wrong."],["She uses top-down processing","Not the reason given."],["Her predictions pass Weber's law","Not related."]],"exp":"So many predictions guarantee a hit, and people forget the misses."},{"q":"Which thinking error does \"remembering the hits and forgetting the misses\" resemble most?","right":"Focusing only on the correct predictions","wrong":[["Using every single prediction, right and wrong, when judging","That would be accurate judging."],["The Stroop effect","Not related."],["Weber's law","Not related."]],"exp":"People focus on the 1 or 2 correct predictions and forget the rest."}]}]}],"intro":["Everything on the Perception slides: attention and what we miss, top-down vs. bottom-up processing, thresholds and Weber's law, and ESP."]}],"sq":[{"id":"SQ1","deck":1,"q":"While texting and walking, Maya walks right past a friend who is waving at her and never sees him. This is:","opts":["Inattentional blindness","Change blindness","The cocktail party effect","The Stroop effect"],"ans":0,"exp":"She failed to see something visible because her attention was on her phone."},{"id":"SQ2","deck":1,"q":"In a movie, an actor's shirt is red in one shot and blue in the next, but most viewers never notice. This is:","opts":["Change blindness","Inattentional blindness","The pop-out phenomenon","The absolute threshold"],"ans":0,"exp":"Missing a change because attention is directed elsewhere is change blindness."},{"id":"SQ3","deck":1,"q":"In a crowded, noisy cafeteria, Eli is talking with one friend when he suddenly hears his own name from across the room. This is:","opts":["The cocktail party effect","Change blindness","The pop-out phenomenon","Weber's law"],"ans":0,"exp":"Your brain can register your name even amongst background noise."},{"id":"SQ4","deck":1,"q":"You see the word BLUE printed in red ink and must say the ink color. You answer more slowly than usual. This is:","opts":["The Stroop effect","Change blindness","Bottom-up processing","The difference threshold"],"ans":0,"exp":"Stroop effect: delayed reaction time when you must say the color of a word, not the word."},{"id":"SQ5","deck":1,"q":"Raj can taste one teaspoon of salt dissolved in two gallons of water about half the time. This is a measure of his:","opts":["Absolute threshold","Difference threshold","Selective attention","Top-down processing"],"ans":0,"exp":"The weakest stimulus detected 50% of the time is the absolute threshold."},{"id":"SQ6","deck":1,"q":"When Dana turns her car radio from 5 to 6, she doesn't notice, but from 5 to 10 she does. This shows her:","opts":["Difference threshold (just noticeable difference)","Absolute threshold","Inattentional blindness","Precognition"],"ans":0,"exp":"The smallest change you notice 50% of the time is the difference threshold."},{"id":"SQ7","deck":1,"q":"You can easily read \"Tihs is a vrey smiple snetecne\" even though the letters are scrambled. This is mainly:","opts":["Top-down processing","Bottom-up processing","The absolute threshold","Change blindness"],"ans":0,"exp":"You read each word as a whole using what you already know. That's top-down."},{"id":"SQ8","deck":1,"q":"A psychic tells police where a missing person's body is buried, though she never saw what happened. This claim is called:","opts":["Clairvoyance","Telepathy","Precognition","Selective attention"],"ans":0,"exp":"Clairvoyance = perceiving events you didn't witness. There's no scientific basis for it."}],"flows":[],"trees":[],"tables":[{"title":"Top-down vs. bottom-up","rows":[["Processing","Also called","What happens","Example from your slides"],["Bottom-up","Sensation","Sensory receptors register information and send it up to the brain","Being aware of the squiggles in a handwritten note"],["Top-down","Perception","Knowledge, experience, or context interprets what you sense","Knowing what the squiggles mean; reading scrambled words"]]},{"title":"Thresholds","rows":[["Term","What it measures","Example from your slides"],["Absolute threshold","The weakest stimulus you can detect 50% of the time","A watch ticking 20 feet away; 1 teaspoon of salt in 2 gallons of water"],["Difference threshold (JND)","The smallest change you notice 50% of the time","Car music from 5 to 6: probably not noticed. From 5 to 10: probably noticed"],["Weber's law","Changes must be a constant percentage, not a constant amount","1 oz added to 10 oz is noticed; 1 oz added to 100 oz isn't. Weight must change 2%"]]}],"watch":[{"deck":1,"text":"Change blindness vs. inattentional blindness is the classic trap. Both happen because attention is elsewhere. Missed a change → change blindness. Missed a visible object → inattentional blindness."},{"deck":1,"text":"Bottom-up = sensation (receptors send information u
