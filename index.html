 chronic sleep loss?","right":"High blood pressure","wrong":[["A slower and healthier resting heart rate","Sleep loss isn't good for the heart."],["Lower blood sugar","That isn't on your slides."],["Stronger arteries","That isn't on your slides."]],"exp":"Sleep loss increases the risk of high blood pressure."},{"q":"Which heart risk would a cardiologist connect to chronic sleep loss?","right":"High blood pressure","wrong":[["A heart rate that is much slower and steadier than average","Not on your slides."],["Lower cholesterol","Not on your slides."],["Stronger heart valves","Not on your slides."]],"exp":"Increased risk of high blood pressure."}]},{"term":"Sleep loss: muscles and joints","def":"Muscles: reduced strength and slower reaction time and motor learning. Joints: increased inflammation and arthritis.","hook":"","asks":[{"q":"A tired athlete reacts slowly and learns new moves poorly. Which effect of sleep loss is this?","right":"Slower reactions and motor learning","wrong":[["Less joint inflammation and stronger muscles overall","Sleep loss increases inflammation and reduces strength."],["Better balance","Not on your slides."],["Faster reaction time","Reaction time slows."]],"exp":"Reduced strength, slower reaction time and motor learning, more inflammation."},{"q":"Which joint problem rises with sleep loss, according to your slides?","right":"Inflammation and arthritis","wrong":[["Stronger cartilage and faster healing of the joints over time","Sleep loss worsens joints."],["Torn ligaments","Not on your slides."],["Broken bones","Not on your slides."]],"exp":"Joints: increased inflammation and arthritis."}]}]},{"name":"Sleep disorders","cards":[{"term":"Insomnia","def":"Can't sleep.","hook":"","asks":[{"q":"For months, Rosa lies awake for hours every night unable to sleep. Which disorder fits?","right":"Insomnia","wrong":[["Narcolepsy, which causes sudden sleep attacks","Narcolepsy is falling asleep spontaneously."],["Sleep apnea","That is stopping breathing during sleep."],["Night terrors","Those are episodes of terror in Stage 3."]],"exp":"Insomnia: can't sleep."},{"q":"Which disorder is the opposite problem from insomnia?","right":"Narcolepsy","wrong":[["Chronic trouble falling or staying asleep through the night","That is insomnia itself."],["Sleepwalking","Not the opposite."],["Sleep apnea","Not the opposite."]],"exp":"Insomnia = can't sleep; narcolepsy = falls asleep suddenly."}]},{"term":"Sleep apnea","def":"You stop breathing in your sleep.","hook":"Apnea = no air.","asks":[{"q":"A man snores loudly, stops breathing for moments during the night, and wakes up exhausted. Which disorder fits?","right":"Sleep apnea","wrong":[["Insomnia, trouble falling or staying asleep","Insomnia is being unable to sleep."],["Narcolepsy","That is falling asleep suddenly."],["Sleepwalking","That is walking while asleep."]],"exp":"Apnea = no air."},{"q":"A man's partner notices he keeps stopping breathing at night, and he's exhausted every day. Which disorder should a doctor check for?","right":"Sleep apnea","wrong":[["Narcolepsy, which causes sudden sleep attacks during the day","The key sign is stopping breathing."],["Insomnia","He is sleeping."],["Night terrors","Not about breathing."]],"exp":"You stop breathing in your sleep."}]},{"term":"Night terrors","def":"Not nightmares: intense fear or terror where you wake up screaming or crying, with no recollection the following morning. Happen in Stage 3.","hook":"","asks":[{"q":"A child wakes up screaming in Stage 3 sleep but has no memory of it the next morning. What is this?","right":"A night terror","wrong":[["A nightmare remembered from REM sleep","Night terrors are not nightmares and aren't remembered."],["Narcolepsy","That is falling asleep suddenly."],["Sleep apnea","That is stopping breathing."]],"exp":"Intense fear with no recollection, in Stage 3."},{"q":"What separates a night terror from a nightmare?","right":"It isn't remembered the next morning","wrong":[["It is always remembered in vivid detail the next morning","Night terrors aren't remembered."],["It happens only in adults","Not on your card."],["It happens while awake","It happens during sleep."]],"exp":"No recollection the following morning; happens in Stage 3."}]},{"term":"Sleepwalking","def":"A sleep disorder: walking while asleep.","hook":"","asks":[{"q":"A teenager is found in the kitchen at night, eyes open but asleep. Which sleep disorder is this?","right":"Sleepwalking","wrong":[["Narcolepsy, falling asleep during the day","She isn't falling asleep suddenly."],["Insomnia","She is asleep, not unable to sleep."],["Sleep apnea","That is about breathing."]],"exp":"Walking while asleep."},{"q":"Which disorder involves walking around while still asleep?","right":"Sleepwalking","wrong":[["Narcolepsy, where a person falls asleep suddenly during the day","That is falling asleep suddenly."],["Insomnia","That is being unable to sleep."],["Sleep apnea","That is breathing."]],"exp":"A sleep disorder: walking while asleep."}]},{"term":"Narcolepsy","def":"You fall asleep spontaneously.","hook":"Narco = sleep attack.","asks":[{"q":"A man suddenly falls asleep in the middle of conversations during the day. Which disorder fits?","right":"Narcolepsy","wrong":[["Insomnia, being unable to sleep at night","That is the opposite problem."],["Sleep apnea","That is about breathing during sleep."],["Sleepwalking","That is walking while asleep."]],"exp":"Narco = sleep attack."},{"q":"Why might a doctor tell a patient with narcolepsy not to drive?","right":"He may fall asleep suddenly","wrong":[["He cannot fall asleep at night, so he is always too tired to drive","That is insomnia."],["He stops breathing at night","That is sleep apnea."],["He walks while asleep","That is sleepwalking."]],"exp":"Narco = sleep attack."}]}]},{"name":"How drugs work","cards":[{"term":"Psychoactive drugs","def":"Chemical substances that alter perceptions and mood. They affect the synapses of neurons and the functioning of neurotransmitters.","hook":"","asks":[{"q":"Chemicals that change how people perceive and feel by affecting neurotransmitters at the synapse are called what?","right":"Psychoactive drugs","wrong":[["Hormones released by the endocrine glands","Hormones come from glands."],["Glial cells","Those are support cells."],["Placebos","Placebos have no active effect."]],"exp":"Psychoactive drugs alter perceptions and mood."},{"q":"Where in the nervous system do psychoactive drugs do their work, according to your card?","right":"At the synapses","wrong":[["Only in the bloodstream, without ever reaching the brain itself","They affect synapses and neurotransmitters."],["Only in the muscles","Not on your card."],["Only in the cochlea","Not on your card."]],"exp":"They affect the synapses and neurotransmitter functioning."}]},{"term":"Agonist","def":"A drug that fits into receptors and mimics a neurotransmitter, increasing its effects. Example: opiates mimic and increase the effects of endorphins.","hook":"Agonist = Acts like it.","asks":[{"q":"A drug fits into endorphin receptors and mimics endorphins, increasing their effects. What kind of drug is it?","right":"An agonist","wrong":[["An antagonist that blocks the neurotransmitter","An antagonist works against it."],["A hallucinogen only","This describes how it acts at receptors."],["A placebo","A placebo has no chemical effect."]],"exp":"Agonist = acts like it (opiates and endorphins)."},{"q":"Which drug acts as an agonist, according to your slides?","right":"Opiates, which mimic endorphins","wrong":[["Cocaine, which blocks dopamine from being reabsorbed","Your slides list that under antagonist/reuptake."],["Caffeine","Not listed as an agonist."],["Alcohol only","Not the example given."]],"exp":"Agonists mimic a neurotransmitter: opiates and endorphins."}]},{"term":"Antagonist","def":"A drug that blocks the effects of a neurotransmitter. Example from your slides: cocaine blocks the reuptake of dopamine.","hook":"Antagonist = Against it.","asks":[{"q":"A drug blocks the effects of a neurotransmitter instead of mimicking it. What kind of drug is it?","right":"An antagonist","wrong":[["An agonist that mimics the neurotransmitter","An agonist acts like it."],["A hormone","Hormones come from glands."],["A stimulant only","This describes how it acts."]],"exp":"Antagonist = against it."},{"q":"A drug sits in a neurotransmitter's receptors and stops it from having its effect. What kind of drug is it?","right":"An antagonist","wrong":[["An agonist, which copies the neurotransmitter and adds to its effect","That would increase the effect."],["A hormone","Not a drug type."],["A placebo","That has no chemical effect."]],"exp":"Antagonist = against it: it blocks the neurotransmitter's effects."}]},{"term":"Reuptake inhibitor","def":"A drug that blocks reuptake, so the neurotransmitter isn't reabsorbed. Your slides' example: cocaine blocks the reuptake of dopamine.","hook":"","asks":[{"q":"Cocaine keeps dopamine from being reabsorbed, so it stays in the synapse. What is this action called?","right":"Reuptake inhibition","wrong":[["Agonism, mimicking the neurotransmitter at receptors","Cocaine blocks reabsorption rather than mimicking dopamine."],["Transduction","That converts energy."],["Neurogenesis","That is forming neurons."]],"exp":"A reuptake inhibitor blocks reabsorption."},{"q":"Which medication class from your treatment unit is also a reuptake inhibitor?","right":"SSRIs","wrong":[["Benzodiazepines, which boost the calming effects of GABA","They work on GABA, not reuptake."],["Lithium","Not a reuptake inhibitor."],["Antabuse","Not a reuptake inhibitor."]],"exp":"SSRIs block serotonin reuptake."}]},{"term":"Four categories of psychoactive drugs","def":"Depressants, stimulants, hallucinogens, and opioids.","hook":"","asks":[{"q":"Which list names the four categories of psychoactive drugs?","right":"Depressants, stimulants, hallucinogens, opioids","wrong":[["Agonists, antagonists, reuptake inhibitors, placebos, sedatives","Those describe how drugs act, not the categories."],["Hormones, neurotransmitters, enzymes, vitamins","Those aren't drug categories."],["Uppers, downers, painkillers, vitamins","Not the names on your slides."]],"exp":"Depressants, stimulants, hallucinogens and opioids."},{"q":"Which category does LSD belong to?","right":"Hallucinogens","wrong":[["Depressants, which slow down the activity of the nervous system","LSD is a hallucinogen."],["Opioids","LSD isn't from the opium poppy."],["Stimulants","LSD is a hallucinogen."]],"exp":"Depressants, stimulants, hallucinogens, opioids."}]}]},{"name":"Depressants","cards":[{"term":"Depressants","def":"Drugs that slow you down by reducing neural activity. Examples: alcohol, barbiturates, sedatives, benzodiazepines.","hook":"Depress = press down.","asks":[{"q":"Which category of drugs slows you down by reducing neural activity?","right":"Depressants","wrong":[["Stimulants, which excite the nervous system","Stimulants speed you up."],["Hallucinogens","Those distort perception."],["Opioids","Those lessen pain and anxiety."]],"exp":"Depress = press down."},{"q":"Which drug is a depressant?","right":"Barbiturates","wrong":[["Amphetamines, which speed up the nervous system","Those are stimulants."],["Cocaine","A stimulant."],["LSD","A hallucinogen."]],"exp":"Depressants: alcohol, barbiturates, sedatives, benzodiazepines."}]},{"term":"Alcohol","def":"A depressant that calms the nervous system. It's perceived as a stimulant because people do crazy things, but it intensifies the effects of GABA (sluggish movements, slurred speech) and reduces glutamate (slower reactions, impaired judgment).","hook":"","asks":[{"q":"People act wild when drinking, so many think alcohol is a stimulant. What is it really?","right":"A depressant that boosts GABA","wrong":[["A stimulant that raises dopamine and glutamate","Alcohol reduces glutamate and calms the nervous system."],["A hallucinogen","It doesn't mainly distort perception."],["An opioid","It doesn't come from the opium poppy."]],"exp":"Alcohol intensifies GABA and reduces glutamate."},{"q":"Alcohol reduces glutamate. Which effect does that cause, per your card?","right":"Slower reactions and impaired judgment","wrong":[["Faster reactions and sharper thinking, like a stimulant","Alcohol is a depressant."],["Hallucinations","Not on your card."],["Lower pain only","Not the glutamate effect."]],"exp":"Reduced glutamate: slower reactions, impaired judgment."}]},{"term":"Barbiturates / sedatives","def":"Also called \"downers.\" Used to treat insomnia; effects are similar to alcohol. They mess with sleep patterns and cause dependence. They increase GABA, which has a calming effect.","hook":"","asks":[{"q":"A doctor prescribes \"downers\" for insomnia that increase GABA, with effects similar to alcohol. What are they?","right":"Barbiturates / sedatives","wrong":[["Amphetamines, which mimic adrenaline","Those are stimulants."],["Hallucinogens","Those distort perception."],["SSRIs","Those are antidepressants."]],"exp":"Downers that increase GABA; they can cause dependence."},{"q":"Why are barbiturates risky for long-term use, per your card?","right":"They disrupt sleep and cause dependence","wrong":[["They cause hallucinations and long-term memory problems for years","That fits LSD or MDMA."],["They raise blood pressure","Not on your card."],["They block dopamine","Not on your card."]],"exp":"They mess with sleep patterns and cause dependence."}]},{"term":"Benzodiazepines","def":"Valium and Xanax. Anti-anxiety drugs that calm the nervous system. They depress heartbeat and breathing.","hook":"","asks":[{"q":"Xanax and Valium are prescribed to calm anxiety. Which drug group are they?","right":"Benzodiazepines","wrong":[["Amphetamines that boost alertness and energy","Those are stimulants."],["Opioids","Those come from the opium poppy."],["Hallucinogens","Those distort perception."]],"exp":"Benzodiazepines are anti-anxiety depressants."},{"q":"Which body functions do benzodiazepines depress, per your card?","right":"Heartbeat and breathing","wrong":[["Vision and hearing, which become blurry and muffled","Not on your card."],["Hunger and thirst","Not on your card."],["Memory only","Not on your card."]],"exp":"They depress heartbeat and breathing."}]}]},{"name":"Stimulants","cards":[{"term":"Stimulants","def":"Drugs that excite the central nervous system. Examples: caffeine, nicotine, cocaine, amphetamines, meth.","hook":"","asks":[{"q":"Which category of drugs excites the central nervous system?","right":"Stimulants","wrong":[["Depressants, which reduce neural activity","Depressants slow you down."],["Opioids","Those reduce pain and anxiety."],["Hallucinogens","Those distort perception."]],"exp":"Caffeine, nicotine, cocaine, amphetamines, meth."},{"q":"Which drug is NOT a stimulant?","right":"Alcohol","wrong":[["Nicotine, the highly addictive drug found in cigarettes","Nicotine is a stimulant."],["Caffeine","A stimulant."],["Meth","A stimulant."]],"exp":"Alcohol is a depressant."}]},{"term":"Caffeine","def":"Naturally occurring (coffee, tea, chocolate); increases alertness. In high doses it can cause anxiety, heart palpitations, and insomnia.","hook":"","asks":[{"q":"After four energy drinks, Max feels anxious, his heart races and he can't sleep. Which drug's high dose explains this?","right":"Caffeine","wrong":[["Alcohol, a depressant that calms the system","Alcohol is a depressant."],["THC","That causes relaxation."],["Benzodiazepines","Those calm you."]],"exp":"High doses of caffeine cause anxiety, palpitations and insomnia."},{"q":"Which foods naturally contain caffeine, according to your card?","right":"Coffee, tea and chocolate","wrong":[["Milk, bread and rice, which most people eat every day","Not listed."],["Only energy drinks","It's naturally occurring."],["Only soda","It's naturally occurring."]],"exp":"Naturally occurring in coffee, tea and chocolate."}]},{"term":"Nicotine","def":"A highly addictive stimulant. Depending on the amount of time smoked, it can have stimulating or sedative effects. Withdrawal symptoms: irritability, headaches, nervousness.","hook":"","asks":[{"q":"A smoker who quits becomes irritable, nervous and gets headaches. Which drug is he withdrawing from?","right":"Nicotine","wrong":[["LSD, a hallucinogen that distorts perception","LSD isn't smoked like this and isn't known for these withdrawal symptoms."],["Caffeine","He quit smoking."],["Alcohol","He quit smoking."]],"exp":"Nicotine withdrawal: irritability, headaches, nervousness."},{"q":"Why can nicotine feel both stimulating and calming?","right":"Its effect depends on how long you smoke","wrong":[["It is a depressant that only seems stimulating to the user","It's a stimulant."],["It mimics endorphins","Not on your card."],["It blocks GABA","Not on your card."]],"exp":"Depending on time smoked, it can have stimulating or sedative effects."}]},{"term":"Cocaine","def":"Blocks reabsorption of dopamine to produce increased alertness, euphoria, and motivation. Followed by a huge crash with anxiety, depression, and strong cravings.","hook":"","asks":[{"q":"A drug gives a burst of euphoria by blocking dopamine reabsorption, then a crash with depression and strong cravings. Which drug?","right":"Cocaine","wrong":[["Alcohol, which increases the effects of GABA","Alcohol is a depressant."],["Heroin","That is an opioid."],["Melatonin","That is a sleep hormone."]],"exp":"Cocaine blocks dopamine reuptake, then crashes."},{"q":"Which neurotransmitter does cocaine keep in the synapse?","right":"Dopamine","wrong":[["GABA, the main calming chemical in the brain's synapses","Cocaine blocks dopamine reuptake."],["Serotonin","That is SSRIs."],["Acetylcholine","Not on your card."]],"exp":"Cocaine blocks dopamine reabsorption."}]},{"term":"Amphetamines","def":"Mimic epinephrine/adrenaline. Increase alertness and feelings of well-being and give a sense of euphoria, followed by a huge crash. Leads to a cycle of addiction. Meth and ecstasy/MDMA are forms.","hook":"","asks":[{"q":"A drug mimics adrenaline, causing alertness and euphoria followed by a huge crash. Meth is one form. Which group?","right":"Amphetamines","wrong":[["Benzodiazepines, which calm the nervous system","Those calm you down."],["Opioids","Those lessen pain."],["SSRIs","Those are antidepressants."]],"exp":"Amphetamines mimic epinephrine/adrenaline."},{"q":"Which drugs are forms of amphetamines, per your card?","right":"Meth and ecstasy (MDMA)","wrong":[["Heroin and morphine, both made from the opium poppy plant","Those are opioids."],["Xanax and Valium","Those are benzodiazepines."],["LSD and THC","Those are hallucinogens."]],"exp":"Meth and ecstasy/MDMA are forms of amphetamines."}]}]},{"name":"Hallucinogens","cards":[{"term":"Hallucinogens","def":"Substances that distort visual and auditory perception. Examples: LSD, marijuana.","hook":"","asks":[{"q":"Which category of drugs distorts what you see and hear?","right":"Hallucinogens","wrong":[["Depressants, which slow down the nervous system","Depressants slow you down."],["Stimulants","Those excite the nervous system."],["Opioids","Those lessen pain."]],"exp":"LSD and marijuana distort perception."},{"q":"Which drug on your slides is a hallucinogen?","right":"Marijuana","wrong":[["Nicotine, the stimulant that is found in cigarettes","Nicotine is a stimulant."],["Heroin","An opioid."],["Barbiturates","Depressants."]],"exp":"Hallucinogens: LSD and marijuana."}]},{"term":"LSD","def":"Produces hallucinations and delusions, like a psychotic state. Can result in psychosis, memory loss, paranoia, panic attacks, nightmares, and aggression.","hook":"","asks":[{"q":"A drug produces hallucinations and delusions, like a psychotic state, and can lead to paranoia. Which drug?","right":"LSD","wrong":[["Caffeine in very high doses from energy drinks","Caffeine causes anxiety and insomnia, not hallucinations."],["Alcohol","That is a depressant."],["Nicotine","That is a stimulant."]],"exp":"LSD is a hallucinogen."},{"q":"Which long-term risk is linked to LSD on your card?","right":"Psychosis and paranoia","wrong":[["Tardive dyskinesia, the movement side effect of antipsychotics","That is a drug side effect of antipsychotics."],["Obesity","Not on your card."],["Hearing loss","Not on your card."]],"exp":"LSD can result in psychosis, memory loss, paranoia and more."}]},{"term":"THC","def":"The active ingredient in marijuana. Can produce mild hallucinations, euphoria, relaxation, a sense of wellbeing, and a distortion of time.","hook":"","asks":[{"q":"The active ingredient in marijuana can cause mild hallucinations, relaxation and a distorted sense of time. What is it?","right":"THC","wrong":[["MDMA, a stimulant and hallucinogen","That is ecstasy."],["GABA","That is a neurotransmitter."],["Nicotine","That is in tobacco."]],"exp":"THC is marijuana's active ingredient."},{"q":"Which effect of THC is on your card?","right":"A distorted sense of time","wrong":[["Losing serotonin-producing neurons and having a permanently lower mood","That is MDMA."],["Paralysis","Not on your card."],["Night terrors","Not on your card."]],"exp":"Mild hallucinations, euphoria, relaxation, distorted time."}]},{"term":"Ecstasy (MDMA)","def":"Considered both a stimulant and a hallucinogen. Produces a euphoric high and can damage serotonin-producing neurons, resulting in a permanent deflation of mood and impairment of memory.","hook":"","asks":[{"q":"Which drug is both a stimulant and a hallucinogen and can damage serotonin-producing neurons?","right":"Ecstasy (MDMA)","wrong":[["LSD, a hallucinogen that is not a stimulant","LSD is only a hallucinogen."],["Caffeine","That is only a stimulant."],["Heroin","That is an opioid."]],"exp":"MDMA can cause lasting mood and memory problems."},{"q":"Why can ecstasy cause a lasting low mood?","right":"It can damage serotonin-producing neurons","wrong":[["It permanently raises dopamine levels in the brain's reward system","Not on your card."],["It blocks endorphins","Not on your card."],["It is an opioid","It's a stimulant and hallucinogen."]],"exp":"Damaged serotonin neurons: permanent deflation of mood and memory impairment."}]}]},{"name":"Opioids","cards":[{"term":"Opioids","def":"Drugs derived from the opium poppy that lessen pain and anxiety. Examples: heroin, codeine, morphine, methadone, OxyContin, oxycodone.","hook":"","asks":[{"q":"Heroin, codeine, morphine and oxycodone all belong to which category?","right":"Opioids","wrong":[["Hallucinogens, which distort perception","They lessen pain and anxiety."],["Stimulants","They don't excite the nervous system."],["Benzodiazepines","Those are anti-anxiety drugs."]],"exp":"Opioids come from the opium poppy."},{"q":"Where do opioids come from?","right":"The opium poppy","wrong":[["Coffee and tea leaves, which contain natural caffeine","That is caffeine."],["The adrenal glands","Those make adrenaline."],["The pineal gland","That makes melatonin."]],"exp":"Drugs derived from the opium poppy."}]},{"term":"How opioids work","def":"They act as agonists for endorphins, which reduce pain and increase positive feelings. With continued use, the brain stops producing dopamine and endorphins.","hook":"","asks":[{"q":"Why do long-term opioid users feel awful without the drug?","right":"The brain stops making endorphins and dopamine","wrong":[["Opioids permanently block serotonin receptors in the gut","Not on your slides."],["Opioids are antagonists that block pain signals","They are agonists for endorphins."],["Opioids increase GABA like alcohol","That describes depressants."]],"exp":"Opioids act as endorphin agonists; with continued use the brain stops producing its own."},{"q":"Opioids act as agonists for which natural chemical?","right":"Endorphins","wrong":[["Glutamate, the major excitatory chemical of the brain","Opioids mimic endorphins."],["Melatonin","Not on your card."],["Ghrelin","Not on your card."]],"exp":"Opioids act as agonists for endorphins."}]},{"term":"Results of opioid use","def":"Dependence, tolerance, withdrawal, and physiological and psychological addiction.","hook":"","asks":[{"q":"Which list shows results of opioid use on your slides?","right":"Dependence, tolerance, withdrawal, addiction","wrong":[["Better memory, stronger immune system, more energy, focus","These aren't results of opioid use."],["Hallucinations only","That isn't the list."],["Weight loss and insomnia only","That isn't the list."]],"exp":"Opioid use leads to dependence, tolerance, withdrawal and addiction."},{"q":"A patient on painkillers needs bigger doses and feels sick when she stops. Which two results of opioid use are these?","right":"Tolerance and withdrawal","wrong":[["Synesthesia and prosopagnosia, two unusual perception problems","Not opioid results."],["Insomnia and narcolepsy","Not the results described."],["Mania and depression","Not opioid results."]],"exp":"Results include dependence, tolerance, withdrawal and addiction."}]}]},{"name":"Addiction","cards":[{"term":"Substance use","def":"Using a substance, but it doesn't interfere with daily functioning.","hook":"","asks":[{"q":"Jen has a glass of wine at family dinners, and it never affects her work or life. How would your slides describe this?","right":"Substance use","wrong":[["Substance abuse that disrupts daily functioning","Her use doesn't interfere with her life."],["Addiction","She doesn't crave it despite consequences."],["Withdrawal","She isn't stopping a drug."]],"exp":"Use that doesn't interfere with daily functioning."},{"q":"Which situation is substance use rather than abuse?","right":"A cup of coffee each morning that causes no problems","wrong":[["Missing work over and over again because of heavy drinking at night","That interferes with functioning."],["Driving while high","That is dangerous."],["Getting arrested for drugs","That is a legal problem."]],"exp":"Use that doesn't interfere with daily functioning."}]},{"term":"Substance abuse","def":"A pattern of use that inhibits the ability to function, often puts the user in danger, and results in legal difficulties.","hook":"","asks":[{"q":"Kyle's drinking makes him miss work, drive dangerously and get arrested. How would your slides describe this?","right":"Substance abuse","wrong":[["Substance use that doesn't interfere with life","His use clearly interferes."],["Tolerance","That is needing more for the same effect."],["Withdrawal","That is distress after stopping."]],"exp":"A pattern that hurts functioning, causes danger and legal trouble."},{"q":"Which feature turns substance use into substance abuse?","right":"It harms functioning or causes danger","wrong":[["The substance is legal, cheap and easy for anyone to buy","Legality isn't the line."],["It's used once a year","Not the line."],["It tastes bad","Not the line."]],"exp":"A pattern that inhibits functioning, puts the user in danger, or causes legal trouble."}]},{"term":"Tolerance","def":"A need for larger amounts of the drug to experience the same effects.","hook":"","asks":[{"q":"A coffee drinker now needs three cups to feel the buzz one cup used to give. What is this?","right":"Tolerance","wrong":[["Withdrawal, the distress after stopping a drug","He is still using."],["Addiction","Tolerance can be part of addiction, but this is tolerance."],["Sensory interaction","That is about senses."]],"exp":"Needing larger amounts for the same effect."},{"q":"Why do people with tolerance often take more and more of a drug?","right":"The same amount works less","wrong":[["The same amount suddenly starts to work much more strongly","It's the reverse."],["They forget their dose","Not tolerance."],["They're in withdrawal","That's after stopping."]],"exp":"Tolerance: needing larger amounts for the same effect."}]},{"term":"Addiction","def":"The user craves the drug and continues to use it despite adverse consequences. Users want the drug more than they like the drug. Includes withdrawal symptoms.","hook":"Want it more than you like it.","asks":[{"q":"Sam keeps using a drug he no longer enjoys, even after losing friends over it, because he craves it. What is this?","right":"Addiction","wrong":[["Tolerance, needing more for the same effect","Tolerance alone doesn't mean craving despite consequences."],["Substance use","His use has serious consequences."],["Withdrawal","That is distress after stopping."]],"exp":"Craving and using despite consequences: wanting it more than liking it."},{"q":"What does \"wanting it more than liking it\" mean for addiction?","right":"Craving it even when it's no longer enjoyable","wrong":[["Enjoying the drug much more each time it is taken","Addicted users often enjoy it less."],["Never wanting the drug","They crave it."],["Only using it on weekends","Not the point."]],"exp":"Users want the drug more than they like it."}]},{"term":"Withdrawal","def":"The discomfort and distress that follow discontinuing an addictive drug. Can be physiological and/or psychological.","hook":"","asks":[{"q":"After quitting caffeine, Lily gets headaches and feels miserable for a week. What is she experiencing?","right":"Withdrawal","wrong":[["Tolerance, needing more for the same effect","Tolerance is about needing more, not stopping."],["Synesthesia","That is mixed senses."],["Substance use","She has stopped using."]],"exp":"Discomfort and distress after stopping an addictive drug."},{"q":"Which two kinds of withdrawal does your card describe?","right":"Physiological and psychological","wrong":[["Positive and negative, like the symptoms of schizophrenia","Not the card's terms."],["Sensory and motor","Not the card's terms."],["Alarm and resistance","Those are GAS stages."]],"exp":"Withdrawal can be physiological and/or psychological."}]}]},{"name":"Substance use disorder","cards":[{"term":"Substance use disorder","def":"A disorder characterized by continued substance craving and use despite significant life disruption and/or physical risk. Diagnosed with 11 DSM-5 criteria.","hook":"","asks":[{"q":"A doctor uses 11 DSM-5 criteria to decide whether a patient's drinking is a disorder. What is she diagnosing?","right":"Substance use disorder","wrong":[["Generalized anxiety disorder from constant worry","That is an anxiety disorder."],["Narcolepsy","That is a sleep disorder."],["Insomnia","That is a sleep disorder."]],"exp":"Craving and use despite life disruption or risk; 11 criteria."},{"q":"How many DSM-5 criteria are used to diagnose substance use disorder?","right":"11","wrong":[["25, which is the same number as the questions on the test","There are 11."],["3","That is the mild threshold."],["6","That is the severe threshold."]],"exp":"Diagnosed with 11 DSM-5 criteria."}]},{"term":"Severity levels","def":"Per your slide: mild = 3 criteria met, moderate = 4 or 5, severe = 6 or more.","hook":"","asks":[{"q":"A patient meets 5 of the 11 criteria for substance use disorder. How severe is it, per your slide?","right":"Moderate","wrong":[["Mild, which is three criteria met","Mild is 3 criteria."],["Severe","Severe is 6 or more."],["Not a disorder","5 criteria is a disorder."]],"exp":"Mild = 3, moderate = 4 or 5, severe = 6 or more."},{"q":"A patient meets 7 of the 11 criteria. What severity is that?","right":"Severe","wrong":[["Moderate, which is between four and five of the criteria","Moderate is 4–5."],["Mild","Mild is 3."],["No disorder","7 is a disorder."]],"exp":"Severe = 6 or more."}]},{"term":"Criteria: losing control","def":"Taking the substance in larger amounts or for longer than you meant to; wanting to cut down or stop but not managing to; spending a lot of time getting, using, or recovering from it; cravings and urges to use it.","hook":"","asks":[{"q":"Dan keeps drinking more than he planned and fails every time he tries to cut back. Which group of criteria is this?","right":"Losing control","wrong":[["Risk and the body, like tolerance and withdrawal","Those are about danger and the body."],["Life problems","Those are about work, school and relationships."],["Severity levels","Those count criteria."]],"exp":"Using more or longer than intended and failing to cut down."},{"q":"Which situation fits the \"losing control\" criteria?","right":"Spending hours getting and recovering from it","wrong":[["Giving up a sport or club that you used to love because of it","That is life problems."],["Using it while driving","That is risk."],["Needing more for the same effect","That is tolerance."]],"exp":"Spending a lot of time getting, using or recovering from it."}]},{"term":"Criteria: life problems","def":"Not doing what you should at work, home, or school; continuing even when it causes relationship problems; giving up important social, occupational, or recreational activities.","hook":"","asks":[{"q":"Alicia quits her soccer team and skips school because of her drug use. Which group of criteria is this?","right":"Life problems","wrong":[["Losing control over how much is used","That is about amounts and failing to cut down."],["Risk and the body","That is about danger and physical effects."],["Tolerance only","That is one criterion about the body."]],"exp":"Failing duties and giving up important activities."},{"q":"Which situation fits the \"life problems\" criteria?","right":"Fights with family because of drug use","wrong":[["Using more of the drug than planned and failing to cut back on it","That is losing control."],["Withdrawal symptoms","That is risk and the body."],["Cravings","That is losing control."]],"exp":"Continuing even when it causes relationship problems."}]},{"term":"Criteria: risk and the body","def":"Using again and again even when it puts you in danger; continuing even when you know it caused or worsened a physical or psychological problem; tolerance; withdrawal symptoms relieved by taking more.","hook":"","asks":[{"q":"Ray keeps using even though it worsened his heart condition, and he now needs more to feel anything. Which group of criteria is this?","right":"Risk and the body","wrong":[["Life problems at work, home and school","Those are about responsibilities and relationships."],["Losing control","That is about amounts and failing to cut down."],["Substance use","That isn't a criteria group."]],"exp":"Continuing despite physical harm, plus tolerance and withdrawal."},{"q":"Which situation fits the \"risk and the body\" criteria?","right":"Taking more to relieve withdrawal","wrong":[["Skipping school and family events because of the drug use","That is life problems."],["Wanting to quit but failing","That is losing control."],["Cravings","That is losing control."]],"exp":"Tolerance, and withdrawal symptoms relieved by taking more."}]}]}],"intro":["Everything on the Sleep, Consciousness, and Drugs slides: sleep, circadian rhythm, sleep loss, sleep disorders, how drugs work, the four drug categories, and addiction."]},{"id":8,"name":"Split Brain","optional":true,"sections":[{"name":"Split-brain patients","cards":[{"term":"Split-brain patient","def":"Someone whose corpus callosum has been surgically cut, usually to stop severe seizures from spreading. The two hemispheres can no longer share information.","hook":"","asks":[{"q":"Surgeons cut a patient's corpus callosum to stop severe seizures. What happens to her two hemispheres?","right":"They can no longer share information","wrong":[["They merge into a single hemisphere that controls everything","They stay separate; they just can't communicate."],["Both stop working","Each hemisphere still works."],["Only the left hemisphere survives","Both survive."]],"exp":"Split-brain: the hemispheres can't share information."},{"q":"Why are some patients' corpus callosums cut?","right":"To stop severe seizures from spreading","wrong":[["To improve their memory and help them learn faster in school","Not the reason."],["To cure blindness","Not the reason."],["To treat depression","Not the reason."]],"exp":"Usually to stop severe seizures from spreading."}]},{"term":"Left visual field (LVF)","def":"Everything to the left of where you are looking, in both eyes. It is received by the right half of each eye and sent to the right hemisphere.","hook":"Visual fields cross: left field → right brain.","asks":[{"q":"Everything to the left of where you're looking goes to which hemisphere?","right":"The right hemisphere","wrong":[["The left hemisphere, the language side of the brain","Visual fields cross: left field goes to the right brain."],["Both hemispheres equally","Each field goes to the opposite side."],["Neither; it goes to the cerebellum","It goes to the cortex."]],"exp":"Left field → right brain."},{"q":"Which half of each eye receives the left visual field?","right":"The right half of each eye","wrong":[["The left half of each eye, on the same side as the visual field","It's received by the right half."],["Only the left eye","Both eyes see it."],["Only the right eye","Both eyes see it."]],"exp":"LVF: right half of each eye → right hemisphere."}]},{"term":"Right visual field (RVF)","def":"Everything to the right of where you are looking, in both eyes. It is received by the left half of each eye and sent to the left hemisphere, the language side.","hook":"Right field → left brain → can say it.","asks":[{"q":"Everything to the right of where you're looking goes to which hemisphere?","right":"The left hemisphere","wrong":[["The right hemisphere, the face-recognition side","Visual fields cross: right field goes to the left brain."],["The brainstem","It goes to the cortex."],["Both equally","Each field goes to the opposite side."]],"exp":"Right field → left brain, the language side."},{"q":"Why can split-brain patients name objects shown in the right visual field?","right":"It reaches the language hemisphere","wrong":[["It reaches the right hemisphere, which handles faces and space","The RVF goes to the left hemisphere."],["It skips the brain","Not true."],["The eyes name it","Not true."]],"exp":"Right field → left brain → can say it."}]},{"term":"Optic chiasm","def":"The point where the optic nerves cross, so each visual field goes to the opposite hemisphere.","hook":"Chiasm looks like an X, the crossing point.","asks":[{"q":"At which X-shaped point do the optic nerves cross, so each visual field reaches the opposite hemisphere?","right":"The optic chiasm","wrong":[["The corpus callosum between the two hemispheres","That connects the hemispheres, not the optic nerves."],["The retina","That is in the eye."],["The thalamus","That relays senses."]],"exp":"Chiasm looks like an X."},{"q":"If the optic nerves didn't cross at the optic chiasm, where would the left visual field go?","right":"To the left hemisphere","wrong":[["To the right hemisphere, the way that it normally does","The crossing is what sends it to the right."],["To the cerebellum","Not related."],["Nowhere","It would still reach the brain."]],"exp":"The crossing at the chiasm sends each visual field to the opposite hemisphere."}]},{"term":"Object flashed to the right visual field","def":"Reaches only the left hemisphere. The patient can say the word and describe it, and can point to it or draw it with the right hand, but not the left.","hook":"","asks":[{"q":"A split-brain patient sees the word \"key\" flashed in her right visual field. What can she do?","right":"Say \"key\" out loud","wrong":[["Point to the key with her left hand but not name it","That happens with the left visual field."],["Say she saw nothing","That happens with the left visual field."],["Nothing at all","The left hemisphere can name it."]],"exp":"The right field reaches the left hemisphere, which can speak."},{"q":"A split-brain patient sees a cup in the right visual field. With which hand can she reach for it?","right":"Her right hand","wrong":[["Her left hand, which is controlled by the brain's right hemisphere","The left hemisphere controls the right hand."],["Neither hand","She can use the right."],["Only her left hand","Not correct."]],"exp":"Right field → left hemisphere → right hand."}]},{"term":"Object flashed to the left visual field","def":"Reaches only the right hemisphere. The patient says they saw \"nothing,\" but can point to it or draw it with the left hand.","hook":"Left field → left hand, no words.","asks":[{"q":"A split-brain patient sees a picture of a spoon in her left visual field. What happens?","right":"She says \"nothing\" but points with her left hand","wrong":[["She names the spoon out loud right away","The right hemisphere can't speak."],["She points to it with her right hand and then names it","The right hand is controlled by the left hemisphere."],["She can't respond in any way","Her left hand can point to it."]],"exp":"Left field → right hemisphere → left hand, no words."},{"q":"A split-brain patient is shown a key in the left visual field. What will she say she saw?","right":"\"Nothing\"","wrong":[["\"A key,\" because her left hemisphere can name what she saw","Her left hemisphere didn't receive it."],["\"A lock\"","Not the point."],["\"Two keys\"","Not the point."]],"exp":"She says \"nothing\" but can point to it with her left hand."}]}]},{"name":"Hemisphere styles","cards":[{"term":"Trees vs. forest","def":"The left hemisphere focuses on details and pieces (the \"trees\"). The right hemisphere sees the big picture and wholes, including the self (the \"forest\").","hook":"","asks":[{"q":"Looking at a painting, one hemisphere notices the tiny brushstrokes and the other sees the whole scene. Which sees the whole scene?","right":"The right hemisphere","wrong":[["The left hemisphere, which focuses on small details","The left focuses on details (the trees)."],["The cerebellum","That handles balance."],["Neither; only the occipital lobe sees","Both hemispheres process vision."]],"exp":"Right = the forest (the big picture)."},{"q":"Which hemisphere would notice that a crowd photo shows a concert, rather than counting individual faces?","right":"The right hemisphere","wrong":[["The left hemisphere, which focuses on the separate small pieces","The left focuses on details."],["The brainstem","Not related."],["The cerebellum","Not related."]],"exp":"Right = the forest; left = the trees."}]},{"term":"Words vs. tone","def":"In language, the left hemisphere handles words and their literal definitions. The right hemisphere handles tone, inflection, and context.","hook":"","asks":[{"q":"Your friend says \"Great job\" sarcastically. Which hemisphere picks up on the sarcastic tone?","right":"The right hemisphere","wrong":[["The left hemisphere, which handles literal word meanings","The left handles the words' literal meaning."],["The brainstem","That handles survival functions."],["The cerebellum","That handles balance."]],"exp":"Right = tone, inflection and context."},{"q":"Damage to which hemisphere would make it hardest to tell if someone is joking from their tone?","right":"The right hemisphere","wrong":[["The left hemisphere, which handles the literal meanings of words","The left handles literal words."],["The occipital lobe","That is vision."],["The cerebellum","That is balance."]],"exp":"Right: tone, inflection and context."}]},{"term":"Logic vs. intuition","def":"Left: thoughts, logic, linear and literal thinking, calculation. Right: feelings, intuition, inferences and associations, perception.","hook":"","asks":[{"q":"Solving a step-by-step math proof relies most on which hemisphere's style?","right":"The left hemisphere","wrong":[["The right hemisphere, with feelings and intuition","The right handles intuition and perception."],["The hypothalamus","That handles hunger and temperature."],["The amygdala","That processes fear."]],"exp":"Left = logic, linear thinking and calculation."},{"q":"Which task fits the right hemisphere's style on your card?","right":"Sensing that a friend is upset","wrong":[["Working through a long multi-step math problem one step at a time","That is left: logic and calculation."],["Reading words literally","That is left."],["Putting events in order","That is left."]],"exp":"Right: feelings, intuition, inferences, perception."}]}]}],"intro":["Optional extra from the Brain Lateralization & Split Brain slides. Your teacher said it may help on the test. Builds on the Hemispheres section of The Brain."]}],"sq":[{"id":"SQ1","deck":1,"q":"A neuron gets stimulation that is just below threshold. What happens?","opts":["It fires weakly","It does not fire","It fires more slowly","It enters the refractory period"],"ans":1,"exp":"All-or-none principle: no threshold, no action potential."},{"id":"SQ2","deck":1,"q":"Right after firing, a neuron is flooded with neurotransmitters but still won't fire. Why?","opts":["It's at resting potential","It's in the refractory period","Its myelin is damaged","Reuptake is blocked"],"ans":1,"exp":"During the refractory period the neuron cannot fire no matter how much it is stimulated."},{"id":"SQ3","deck":1,"q":"A patient's signals travel slowly down the axon and they have trouble walking. Which part is most likely damaged?","opts":["Dendrites","Vesicles","Myelin sheath","Soma"],"ans":2,"exp":"Myelin speeds the signal. Loss of myelin (demyelination) is multiple sclerosis."},{"id":"SQ4","deck":2,"q":"A drug blocks the reuptake of serotonin. What is it most likely used for?","opts":["Parkinson's","Depression","Schizophrenia","Paralysis"],"ans":1,"exp":"That's an SSRI. Low serotonin is linked to depression."},{"id":"SQ5","deck":2,"q":"Patients with Parkinson's disease have a shortage of which neurotransmitter?","opts":["Dopamine","GABA","Glutamate","Endorphins"],"ans":0,"exp":"Low dopamine → Parkinson's tremors. High dopamine is linked to schizophrenia."},{"id":"SQ6","deck":2,"q":"Someone has an anxiety disorder linked to a neurotransmitter that normally calms the nervous system. Which one is probably too low?","opts":["Glutamate","Norepinephrine","GABA","Substance P"],"ans":2,"exp":"GABA is the main inhibitory neurotransmitter; too little → anxiety."},{"id":"SQ7","deck":2,"q":"A runner feels euphoric and pain-free at mile 10. Which chemical is responsible?","opts":["Endorphins","Acetylcholine","Melatonin","Substance P"],"ans":0,"exp":"Endorphins are the body's natural painkillers — the runner's high."},{"id":"SQ8","deck":2,"q":"A poison blocks acetylcholine receptors. What is the most likely result?","opts":["Insomnia","Paralysis","Hallucinations","Overeating"],"ans":1,"exp":"ACh drives muscle movement; blocked receptors → paralysis."},{"id":"SQ9","deck":3,"q":"You touch a hot stove and pull your hand back before you even feel the pain. What controlled this?","opts":["The cerebellum","The spinal cord (a reflex)","The amygdala","The somatosensory cortex"],"ans":1,"exp":"Reflexes are directed by the spinal cord, which is why they are so fast."},{"id":"SQ10","deck":3,"q":"After a scare, your heart rate slows back to normal. Which division is at work?","opts":["Sympathetic","Parasympathetic","Somatic","Central"],"ans":1,"exp":"Parasympathetic = rest and digest; it calms you down."},{"id":"SQ11","deck":3,"q":"Which neurons carry the message \"this is hot\" from your fingertip to your spinal cord?","opts":["Motor (efferent)","Interneurons","Sensory (afferent)","Glial cells"],"ans":2,"exp":"Afferent = arrive. Sensory neurons carry info in toward the CNS."},{"id":"SQ12","deck":3,"q":"Why does the effect of a hormone last longer than a neurotransmitter's?","opts":["Hormones are made in the brain only","Hormones travel through the bloodstream","Hormones are always excitatory","Hormones skip the synapse by using myelin"],"ans":1,"exp":"Hormones travel in the blood: slower, but longer-lasting."},{"id":"SQ13","deck":3,"q":"You haven't eaten in hours and your stomach is releasing a hormone telling you to eat. Which one?","opts":["Leptin","Ghrelin","Oxytocin","Melatonin"],"ans":1,"exp":"Ghrelin = hungry (growling stomach). Leptin = full."},{"id":"SQ14","deck":3,"q":"Which gland is called the \"master gland\"?","opts":["Adrenal","Pineal","Pituitary","Thyroid"],"ans":2,"exp":"The pituitary signals the other glands to release their hormones."},{"id":"SQ15","deck":4,"q":"A patient speaks fluently, but their sentences make no sense and they can't understand what others say. Which area is damaged?","opts":["Broca's area","Wernicke's area","Motor cortex","Cerebellum"],"ans":1,"exp":"Wernicke's = comprehension. Broca's = producing speech."},{"id":"SQ16","deck":4,"q":"A stroke patient understands everything but can only say short phrases like \"want... water.\" Where is the damage?","opts":["Wernicke's area","Occipital lobe","Broca's area","Hippocampus"],"ans":2,"exp":"Broca's aphasia: trouble producing speech, understanding mostly intact."},{"id":"SQ17","deck":4,"q":"A rat with a damaged lateral hypothalamus will most likely:","opts":["Overeat","Lose interest in eating","Lose its balance","Stop forming memories"],"ans":1,"exp":"LH = hunger. Damage → no hunger. VMH damage → overeating."},{"id":"SQ18","deck":4,"q":"Someone who drank too much alcohol can't walk a straight line. Which structure is most affected?","opts":["Medulla","Cerebellum","Thalamus","Amygdala"],"ans":1,"exp":"The cerebellum controls balance and coordination, and alcohol hits it hard."},{"id":"SQ19","deck":4,"q":"A patient can't form new long-term memories after surgery. Which structure was most likely removed?","opts":["Hippocampus","Pons","Corpus callosum","Occipital lobe"],"ans":0,"exp":"The hippocampus moves information into long-term memory."},{"id":"SQ20","deck":4,"q":"After brain damage, a person becomes impulsive, rude, and makes poor decisions, like Phineas Gage. Which area?","opts":["Parietal lobe","Prefrontal cortex","Temporal lobe","Medulla"],"ans":1,"exp":"Prefrontal cortex = judgment, planning, personality."},{"id":"SQ21","deck":4,"q":"A researcher wants to see which brain areas are active while someone solves math problems, with the best precision. Which scan?","opts":["CT","MRI","fMRI","X-ray"],"ans":2,"exp":"fMRI shows function through blood flow and is more precise than PET. CT and MRI only show structure."},{"id":"SQ22","deck":4,"q":"A stroke damages the left hemisphere's motor cortex. Which body part is most likely affected?","opts":["Left arm","Right arm","Both legs","Neither — only speech"],"ans":1,"exp":"Contralateral control: the left brain controls the right side of the body."},{"id":"SQ23","deck":4,"q":"Damage to which structure could put someone into a coma?","opts":["Reticular formation","Cerebellum","Amygdala","Corpus callosum"],"ans":0,"exp":"The reticular formation controls arousal and consciousness."},{"id":"SQ24","deck":4,"q":"A blind person reads Braille and the brain area for their reading finger expands into the visual cortex. This shows:","opts":["Neurogenesis","Plasticity","Lateralization","Accommodation"],"ans":1,"exp":"Plasticity is the brain reorganizing based on experience or damage."},{"id":"SQ25","deck":5,"q":"You walk into a dark movie theater and can't see; after a while you can make out shapes but not colors. Which receptors are working?","opts":["Cones","Rods","Bipolar cells","Feature detectors"],"ans":1,"exp":"Rods work in dim light but don't see color. Cones need brighter light."},{"id":"SQ26","deck":5,"q":"Stare at a green flag, then look at a white wall, and you see a red flag. Which theory explains this?","opts":["Trichromatic","Opponent-process","Gate control","Gestalt"],"ans":1,"exp":"Opponent-process: tiring the green response leaves red firing — an afterimage."},{"id":"SQ27","deck":5,"q":"Railroad tracks look like they meet at the horizon. Which depth cue is this?","opts":["Retinal disparity","Interposition","Linear perspective","Relative clarity"],"ans":2,"exp":"Linear perspective is a monocular cue: parallel lines converge in the distance."},{"id":"SQ28","deck":5,"q":"One car partly blocks your view of another, so you see the first car as closer. Which cue?","opts":["Interposition","Relative size","Closure","Proximity"],"ans":0,"exp":"Interposition: whatever blocks the other object looks closer."},{"id":"SQ29","deck":5,"q":"You see a circle even though the drawing has small gaps in its outline. Which Gestalt principle?","opts":["Similarity","Proximity","Closure","Figure-ground"],"ans":2,"exp":"Closure: we fill in gaps to see a complete shape."},{"id":"SQ30","deck":5,"q":"Where does transduction happen in vision?","opts":["Cornea","Lens","Retina","Optic nerve"],"ans":2,"exp":"The retina's rods and cones turn light into neural impulses."},{"id":"SQ31","deck":5,"q":"Your eyes are about 2.5 inches apart, so each sees a slightly different image of a nearby object. This depth cue is:","opts":["Relative size","Retinal disparity","Linear perspective","Accommodation"],"ans":1,"exp":"Retinal disparity is the binocular cue."},{"id":"SQ32","deck":6,"q":"A concert leaves a fan with permanent damage to the cochlea's hair cells. What type of hearing loss is this?","opts":["Conduction — fixable with surgery","Sensorineural — irreversible","Conduction — irreversible","Vestibular"],"ans":1,"exp":"Inner-ear damage is sensorineural. A cochlear implant can help, but the damage can't be reversed."},{"id":"SQ33","deck":6,"q":"You spin in circles, stop, and still feel like the room is moving. This involves your:","opts":["Kinesthetic sense","Vestibular sense","Sense of smell","Sense of hearing"],"ans":1,"exp":"The fluid in your semicircular canals keeps moving after you stop."},{"id":"SQ34","deck":6,"q":"Which sense does NOT get routed through the thalamus?","opts":["Vision","Hearing","Touch","Smell"],"ans":3,"exp":"Smell goes straight to areas connected to the limbic system."},{"id":"SQ35","deck":6,"q":"You rub your stubbed toe and it hurts less. Which theory explains this?","opts":["Gate control theory","Opponent-process theory","Trichromatic theory","All-or-none principle"],"ans":0,"exp":"Other activity can close the spinal cord's pain \"gate.\""},{"id":"SQ36","deck":6,"q":"Food tastes bland when you have a stuffy nose. This is an example of:","opts":["Synesthesia","Sensory interaction","Supertasting","Transduction"],"ans":1,"exp":"Sensory interaction: smell strongly influences taste."},{"id":"SQ37","deck":6,"q":"A sound wave with a very high amplitude will be heard as:","opts":["High-pitched","Low-pitched","Loud","Soft"],"ans":2,"exp":"Amplitude = loudness. Frequency = pitch."},{"id":"SQ38","deck":6,"q":"With your eyes closed, you can still touch your nose with your finger. Which sense makes that possible?","opts":["Vestibular sense","Kinesthesis","Gustation","Audition"],"ans":1,"exp":"Kinesthesis senses where your individual body parts are."},{"id":"SQ39","deck":8,"q":"A picture of a cat is flashed to a split-brain patient's left visual field and a mouse to her right visual field. She will be able to use her:","opts":["Right hand to indicate she saw a cat","Left hand to indicate she saw a mouse","Right hand to indicate she saw a mouse","Either hand to indicate she saw a cat"],"ans":2,"exp":"The mouse (right visual field) goes to the left hemisphere, which controls the right hand. The cut corpus callosum stops it from reaching the right hemisphere."},{"id":"SQ40","deck":8,"q":"The word KEY is flashed to a split-brain patient's left visual field. Asked what he saw, he will most likely:","opts":["Say \"key\"","Say \"nothing,\" but pick out a key with his left hand","Say \"nothing,\" but pick out a key with his right hand","Say \"key\" and draw it with his right hand"],"ans":1,"exp":"Left visual field → right hemisphere, which can't speak but controls the left hand."},{"id":"SQ41","deck":8,"q":"The word FACE is flashed to a split-brain patient's right visual field. What does he say he saw?","opts":["\"Face\"","\"Nothing\"","He can only draw it with his left hand","He sees it in both hemispheres"],"ans":0,"exp":"Right visual field → left hemisphere, which is dominant for language, so he can say it."},{"id":"SQ42","deck":8,"q":"Why would a surgeon cut a patient's corpus callosum?","opts":["To treat Broca's aphasia","To stop severe seizures from spreading between hemispheres","To improve memory","To restore vision"],"ans":1,"exp":"The surgery is a last resort for severe seizures. The side effect is that the hemispheres can no longer share information."},{"id":"SQ43","deck":8,"q":"In a split-brain patient, information from the right visual field goes only to the:","opts":["Right hemisphere","Left hemisphere","Cerebellum","Both hemispheres equally"],"ans":1,"exp":"Visual fields cross at the optic chiasm: right field → left hemisphere."},{"id":"SQ44","deck":8,"q":"A friend understands every word of your sarcastic \"Oh, great\" but misses that you meant it sarcastically. Which hemisphere handles that part of language?","opts":["Left — words and definitions","Right — tone, inflection, and context","Left — calculation","Neither; it's the cerebellum"],"ans":1,"exp":"Left = the words. Right = tone and context."},{"id":"SQ45","deck":7,"q":"Jake scrolls on his phone in bed every night, and now he can't fall asleep at his usual time. What is most likely interfering?","opts":["Artificial light disrupting his circadian rhythm","Sleep apnea","Narcolepsy","Night terrors"],"ans":0,"exp":"Light from phones, lamps, and other devices can interfere with circadian rhythms."},{"id":"SQ46","deck":7,"q":"A child wakes up screaming and crying in intense fear, but the next morning remembers nothing. This is most likely:","opts":["A nightmare","A night terror","Narcolepsy","Insomnia"],"ans":1,"exp":"Night terrors are not nightmares: intense fear, screaming or crying, no memory the next morning. They happen in Stage 3."},{"id":"SQ47","deck":7,"q":"A drug fits into endorphin receptors and mimics endorphins, increasing their effects. The drug is acting as:","opts":["An agonist","An antagonist","A depressant","A hallucinogen"],"ans":0,"exp":"Agonists mimic a neurotransmitter and increase its effects, like opiates with endorphins."},{"id":"SQ48","deck":7,"q":"Ava used to need one cup of coffee to feel alert. Now she needs three to get the same effect. This is:","opts":["Tolerance","Withdrawal","Substance abuse","Insomnia"],"ans":0,"exp":"Tolerance: needing larger amounts of a drug to get the same effect."},{"id":"SQ49","deck":7,"q":"When Leo quits smoking, he becomes irritable, gets headaches, and feels nervous. He is experiencing:","opts":["Tolerance","Withdrawal","Narcolepsy","A hallucination"],"ans":1,"exp":"Those are the nicotine withdrawal symptoms on your slides."},{"id":"SQ50","deck":7,"q":"Which category do benzodiazepines like Valium and Xanax belong to?","opts":["Depressants","Stimulants","Hallucinogens","Opioids"],"ans":0,"exp":"Benzodiazepines calm the nervous system and depress heartbeat and breathing."},{"id":"SQ51","deck":7,"q":"A drug intensifies the effects of GABA and reduces glutamate, causing slurred speech and poor judgment. Which drug is it?","opts":["Alcohol","Cocaine","LSD","Caffeine"],"ans":0,"exp":"Alcohol: more GABA → sluggish, slurred speech; less glutamate → slow reactions, impaired judgment."},{"id":"SQ52","deck":7,"q":"After pulling an all-nighter, Sam feels unusually hungry all day. Which change best explains this?","opts":["More ghrelin and less leptin","More leptin and less ghrelin","More endorphins","Less GABA"],"ans":0,"exp":"Sleep loss increases hunger-arousing ghrelin and decreases hunger-suppressing leptin."}],"flows":[{"id":"F1-1","title":"Path of a signal through a neuron","deck":1,"steps":["Dendrites","Soma","Axon (myelin)","Terminal branches","Terminal buttons / vesicles","Synapse","Next neuron's dendrites"]},{"id":"F1-2","title":"Firing sequence","deck":1,"steps":["Resting potential","Threshold reached","Action potential","Neurotransmitters released","Reuptake","Refractory period","Back to resting"]},{"id":"F5-1","title":"Path of light to the brain","deck":5,"steps":["Cornea","Pupil (sized by iris)","Lens","Retina: rods & cones","Bipolar cells","Ganglion cells","Optic nerve","Thalamus","Visual cortex (occipital)"]},{"id":"F6-1","title":"Path of sound","deck":6,"steps":["Outer ear / auditory canal","Eardrum","Ossicles","Cochlea (hair cells)","Auditory nerve","Thalamus","Auditory cortex (temporal)"]},{"id":"F7-1","title":"Sleep stages","deck":7,"steps":["NREM 1 (Stage 1)","NREM 2 (Stage 2)","NREM 3 (Stage 3): night terrors","REM sleep"]},{"id":"F8-1","title":"Word flashed to the right visual field","deck":8,"steps":["Right visual field","Optic chiasm (crosses)","Left hemisphere","Can say it","Right hand can point / draw"]},{"id":"F8-2","title":"Word flashed to the left visual field","deck":8,"steps":["Left visual field","Optic chiasm (crosses)","Right hemisphere","Says \"nothing\"","Left hand can point / draw"]}],"trees":[],"tables":[{"title":"The chemicals","rows":[["Neurotransmitter","Main job","Too little","Too much"],["Acetylcholine","Movement, memory","Alzheimer's","Muscle spasms"],["Dopamine","Reward, movement, alertness","Parkinson's, addiction","Schizophrenia"],["Serotonin","Mood, appetite, sleep","Depression, OCD, anger","Happiness"],["Norepinephrine","Fight-or-flight, focus","Depression, ADHD","Developing fears"],["GABA","Calming (main inhibitory)","Anxiety disorders","Sleepiness"],["Glutamate","Thinking, memory (main excitatory)","—","Anxiety, OCD, migraines"],["Endorphins","Natural painkiller","—","—"],["Substance P","Pain signals","—","—"]]},{"title":"How drugs work","rows":[["Category","What it does","Examples","How it works"],["Depressants","Slow you down; reduce neural activity","Alcohol, barbiturates, sedatives, benzodiazepines (Valium, Xanax)","Increase GABA (alcohol also reduces glutamate)"],["Stimulants","Excite the central nervous system","Caffeine, nicotine, cocaine, amphetamines, meth","Cocaine blocks dopamine reuptake; amphetamines mimic adrenaline"],["Hallucinogens","Distort visual and auditory perception","LSD, marijuana (THC), ecstasy/MDMA","Ecstasy can damage serotonin-producing neurons"],["Opioids","Lessen pain and anxiety","Heroin, codeine, morphine, methadone, OxyContin, oxycodone","Agonists for endorphins"]]}],"watch":[{"deck":2,"text":"Excitatory vs. inhibitory list from your slides — Excitatory: glutamate (major), ACh, norepinephrine, substance P. Inhibitory: GABA (major), dopamine, serotonin, endorphins."},{"deck":2,"text":"Your slide spells norepinephrine's hormone name \"non-adrenaline.\" The real word is noradrenaline. Also, many textbooks say dopamine can act both ways; for your test, go with your teacher's list."},{"deck":3,"text":"The melatonin slide says the pineal gland is \"in the thalamus.\" It actually sits near the thalamus, deep in the brain."},{"deck":4,"text":"F-POT order front to back along the top: Frontal, Parietal, Occipital — with Temporal on the sides."},{"deck":4,"text":"Scans: structure only = CT, MRI. Activity/function = PET, fMRI, EEG."},{"deck":6,"text":"The vestibular slide says the vestibular sacs are \"of the cochlea.\" They sit right next to the cochlea in the inner ear but aren't part of it."},{"deck":6,"text":"Parts of the ear and eye come from diagram slides with no text. If your test has a labeling question, look at those slides directly."},{"deck":7,"text":"Your slides list the four sleep stages by name only (the details were in the video). The one stage fact on the slides: night terrors happen in Stage 3."},{"deck":7,"text":"Ecstasy/MDMA shows up twice on your slides: as a form of amphetamine (stimulant) and as a hallucinogen. It counts as both."},{"deck":7,"text":"Alcohol is a depressant, even though people think it's a stimulant because of the crazy things people do when drinking."},{"deck":8,"text":"Two-step trick: (1) the visual field goes to the opposite hemisphere, (2) that hemisphere controls the opposite hand. Only the left hemisphere can say what it saw."},{"deck":8,"text":"The slide on the left visual field says the patient can draw or point \"with the right hand.\" Its own picture shows the left hand drawing, and the left hand is correct: the left visual field reaches only the right hemisphere, which controls the left hand."}],"practice":{"sections":[{"name":"The Neuron","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q1-1","type":"mcq","topic":"The Neuron","stem":"Maria's neurologist explains that the fatty coating around her axons is breaking down, slowing her neural signals and making walking difficult. Maria most likely has:","options":["Myasthenia gravis","Parkinson's disease","Multiple sclerosis","Alzheimer's disease"],"ans":2,"exp":"MS is the breakdown of the myelin sheath (demyelination). Myasthenia gravis is the trap: it blocks acetylcholine receptors at the muscles and doesn't damage myelin.","why":["","","",""]},{"id":"q1-2","type":"mcq","topic":"The Neuron","stem":"Which of the following best describes the all-or-none principle?","options":["Once threshold is reached, a neuron fires completely; below threshold it does not fire at all.","A stronger stimulus causes a neuron to fire with greater intensity.","A neuron must receive signals from all of its dendrites before it can fire.","A neuron releases either all of its neurotransmitters or none during reuptake."],"ans":0,"exp":"A neuron's firing strength never changes. It either reaches threshold and fires fully, or it doesn't fire.","why":["","","",""]},{"id":"q1-3","type":"mcq","topic":"The Neuron","stem":"A new drug stops the sending neuron from reabsorbing leftover neurotransmitters in the synapse. Which process is the drug blocking?","options":["The action potential","The refractory period","Reuptake","Threshold"],"ans":2,"exp":"Reuptake is the sending neuron reabsorbing leftover neurotransmitters. SSRIs work by blocking it.","why":["","","",""]},{"id":"q1-4","type":"mcq","topic":"The Neuron","stem":"Which sequence correctly describes the path of a signal through a single neuron?","options":["Axon → soma → dendrites → terminal buttons","Dendrites → soma → axon → terminal buttons","Soma → dendrites → terminal buttons → axon","Terminal buttons → axon → soma → dendrites"],"ans":1,"exp":"Dendrites detect the message, the soma decides to fire, the impulse travels down the axon, and terminal buttons release neurotransmitters.","why":["","","",""]},{"id":"q1-5","type":"mcq","topic":"The Neuron","stem":"Which of the following best describes the function of glial cells?","options":["They support, nourish, and protect neurons.","They carry electrical impulses down the axon.","They store neurotransmitters in vesicles.","They form the gap between two neurons."],"ans":0,"exp":"Glia are support cells (\"glue\"). They don't send the signal themselves.","why":["","","",""]},{"id":"q1-6","type":"mcq","topic":"The Neuron","stem":"Antibodies in Jordan's body are blocking his muscles' receptor sites for acetylcholine, and his muscles are growing weak. Jordan most likely has:","options":["Myasthenia gravis","Multiple sclerosis","Parkinson's disease","Schizophrenia"],"ans":0,"exp":"Myasthenia gravis is an autoimmune disorder that blocks or destroys ACh receptors at the muscles. MS is the trap: it attacks myelin.","why":["","","",""]},{"id":"q1-7","type":"mcq","topic":"The Neuron","stem":"Which of the following best explains why neurons use chemical messengers to communicate with each other?","options":["Neurons are physically connected, so chemicals flow directly between them.","The myelin sheath blocks electrical signals from reaching the dendrites.","Dendrites can only detect electrical signals, not chemical ones.","A small gap separates neurons, so neurotransmitters carry the signal across the synapse."],"ans":3,"exp":"Neurons never touch. The electrical impulse stops at the terminal buttons, and neurotransmitters cross the synaptic gap.","why":["","","",""]},{"id":"q1-8","type":"mcq","topic":"The Neuron","stem":"Immediately after firing, a neuron will not fire again no matter how much it is stimulated. Which of the following best describes this?","options":["It is at resting potential and waiting for stimulation.","It is in the refractory period and recovering.","Its threshold has permanently increased.","Its myelin sheath has been damaged."],"ans":1,"exp":"The refractory period is the recovery time after firing, like waiting for a toilet to refill before you can flush again.","why":["","","",""]},{"id":"q1-9","type":"mcq","topic":"The Neuron","stem":"Where are neurotransmitters stored before they are released into the synapse?","options":["In the dendrites","In the soma","In the myelin sheath","In vesicles inside the terminal buttons"],"ans":3,"exp":"Vesicles are tiny sacs in the terminal buttons that hold neurotransmitters until the neuron fires.","why":["","","",""]}]},{"name":"Neurotransmitters","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q2-1","type":"mcq","topic":"Neurotransmitters","stem":"Ella has been diagnosed with depression. Her doctor prescribes a medication that keeps serotonin in the synapse longer. Which type of drug is this?","options":["A GABA blocker","An acetylcholine blocker","An SSRI","An endorphin inhibitor"],"ans":2,"exp":"SSRI = selective serotonin reuptake inhibitor. Blocking reuptake leaves more serotonin in the synapse.","why":["","","",""]},{"id":"q2-2","type":"mcq","topic":"Neurotransmitters","stem":"A patient with Parkinson's disease has tremors and trouble starting movements. A shortage of which neurotransmitter is most responsible?","options":["Serotonin","GABA","Glutamate","Dopamine"],"ans":3,"exp":"Low dopamine → Parkinson's. High dopamine → schizophrenia.","why":["","","",""]},{"id":"q2-3","type":"mcq","topic":"Neurotransmitters","stem":"Excess activity of which neurotransmitter has been linked to schizophrenia?","options":["Dopamine","GABA","Endorphins","Acetylcholine"],"ans":0,"exp":"Too much dopamine is linked to schizophrenia; too little to Parkinson's.","why":["","","",""]},{"id":"q2-4","type":"mcq","topic":"Neurotransmitters","stem":"Which of the following best describes the role of GABA?","options":["It is the main excitatory neurotransmitter and is involved in memory.","It sends hunger signals to the brain.","It is the main inhibitory neurotransmitter and calms the nervous system.","It is the body's natural painkiller."],"ans":2,"exp":"GABA is the brakes. Glutamate (the main excitatory one) is the trap.","why":["","","",""]},{"id":"q2-5","type":"mcq","topic":"Neurotransmitters","stem":"Low levels of acetylcholine are most closely associated with which disorder?","options":["Parkinson's disease","Alzheimer's disease","Schizophrenia","Anxiety disorders"],"ans":1,"exp":"ACh helps with memory and movement; too little is linked to Alzheimer's. Parkinson's is dopamine.","why":["","","",""]},{"id":"q2-6","type":"mcq","topic":"Neurotransmitters","stem":"After finishing a marathon, Kai feels euphoric and barely notices the blisters on his feet. Which neurotransmitter best explains this?","options":["Endorphins","Substance P","Glutamate","Norepinephrine"],"ans":0,"exp":"Endorphins are natural painkillers (runner's high). Substance P is the trap: it sends pain signals.","why":["","","",""]},{"id":"q2-7","type":"mcq","topic":"Neurotransmitters","stem":"Which neurotransmitter is the brain's major excitatory neurotransmitter and, in excess, is linked to migraines?","options":["GABA","Serotonin","Dopamine","Glutamate"],"ans":3,"exp":"Glutamate = go. Too much is linked to anxiety, OCD, and migraines.","why":["","","",""]},{"id":"q2-8","type":"mcq","topic":"Neurotransmitters","stem":"Sam's doctor suspects his trouble focusing is related to low levels of a chemical that also drives the fight-or-flight response. Which one?","options":["Norepinephrine","GABA","Endorphins","Acetylcholine"],"ans":0,"exp":"Norepinephrine handles fight-or-flight plus focus and attention; low levels are linked to ADHD and depression.","why":["","","",""]},{"id":"q2-9","type":"mcq","topic":"Neurotransmitters","stem":"Which of the following correctly pairs a neurotransmitter with its function?","options":["Serotonin — muscle movement","Acetylcholine — muscle movement and memory","Endorphins — sending pain signals","GABA — the major excitatory neurotransmitter"],"ans":1,"exp":"ACh = action (muscles) and memory. Serotonin is mood, endorphins relieve pain, and GABA is inhibitory.","why":["","","",""]},{"id":"q2-10","type":"mcq","topic":"Neurotransmitters","stem":"Which of the following best explains the difference between excitatory and inhibitory neurotransmitters?","options":["Excitatory ones work only in the brain; inhibitory ones work only in the spinal cord.","Excitatory ones make the receiving neuron more likely to fire; inhibitory ones make it less likely to fire.","Excitatory ones are hormones; inhibitory ones are neurotransmitters.","Excitatory ones speed up reuptake; inhibitory ones slow it down."],"ans":1,"exp":"Excite = go, inhibit = stop. It's about the next neuron's chance of firing.","why":["","","",""]}]},{"name":"Nervous & Endocrine Systems","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q3-1","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"While hiking, Leah spots a rattlesnake. Her heart races, her pupils dilate, and her digestion slows. Which division of the nervous system is responsible?","options":["Parasympathetic","Somatic","Central","Sympathetic"],"ans":3,"exp":"Sympathetic = stressed: fight, flight, or freeze.","why":["","","",""]},{"id":"q3-2","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"After the snake slithers away, Leah's heart rate and breathing gradually return to normal. Which division is now most active?","options":["Parasympathetic","Sympathetic","Somatic","Central"],"ans":0,"exp":"Parasympathetic = rest and digest; it calms the body back down.","why":["","","",""]},{"id":"q3-3","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which of the following is an example of the somatic nervous system at work?","options":["Your heart speeding up before a test","Your stomach digesting lunch","Raising your hand to answer a question","Your pupils shrinking in bright light"],"ans":2,"exp":"Somatic = voluntary movement. The others are automatic, so they're autonomic.","why":["","","",""]},{"id":"q3-4","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"When the doctor taps Luis's knee, his leg kicks before his brain even registers the tap. Which of the following best explains why the response is so fast?","options":["The signal goes to the spinal cord and straight back out, without waiting for the brain.","Motor neurons are always faster than sensory neurons.","The cerebellum processes all reflexes instantly.","Hormones carry the signal directly to the leg."],"ans":0,"exp":"Reflexes are directed by the spinal cord, which cuts out the trip to the brain.","why":["","","",""]},{"id":"q3-5","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which type of neuron carries messages from the brain and spinal cord out to the muscles?","options":["Sensory (afferent) neurons","Interneurons","Motor (efferent) neurons","Glial cells"],"ans":2,"exp":"Efferent = exit. Afferent = arrive.","why":["","","",""]},{"id":"q3-6","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which of the following best describes the role of interneurons?","options":["They carry messages from the senses to the brain.","They carry messages from the brain to the muscles.","They relay messages between sensory and motor neurons within the brain and spinal cord.","They insulate axons to speed up signals."],"ans":2,"exp":"Inter = in between. They connect sensory input to motor output inside the CNS.","why":["","","",""]},{"id":"q3-7","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which of the following best explains how the endocrine system differs from the nervous system?","options":["Hormones travel along axons, so they act faster than neurotransmitters.","Hormones travel through the bloodstream, so they act more slowly but their effects last longer.","The endocrine system controls only voluntary movement.","Hormones act only inside the brain."],"ans":1,"exp":"Blood is slower than nerves, but hormone effects linger.","why":["","","",""]},{"id":"q3-8","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Which gland is called the \"master gland\" because it signals other glands to release their hormones?","options":["Pituitary gland","Pineal gland","Adrenal gland","Thyroid gland"],"ans":0,"exp":"The pituitary regulates growth, stress, and reproduction and directs the other glands.","why":["","","",""]},{"id":"q3-9","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"After a big Thanksgiving dinner, Aiden feels full and stops eating. Which hormone is most responsible for this signal?","options":["Ghrelin","Oxytocin","Melatonin","Leptin"],"ans":3,"exp":"Leptin = leave the table (full). Ghrelin = growling stomach (hungry).","why":["","","",""]},{"id":"q3-10","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"A new mother feels a strong bond with her baby soon after giving birth. Which hormone plays the biggest role in this bonding?","options":["Testosterone","Oxytocin","Adrenaline","Ghrelin"],"ans":1,"exp":"Oxytocin is the bonding hormone: labor, mother–baby bonding, and close relationships.","why":["","","",""]},{"id":"q3-11","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"Jet lag throws off Mia's sleep-wake cycle. Which hormone, released by the pineal gland in response to darkness, regulates this cycle?","options":["Leptin","Melatonin","Estrogen","Adrenaline"],"ans":1,"exp":"Melatonin regulates the circadian rhythm and helps you sleep.","why":["","","",""]},{"id":"q3-12","type":"mcq","topic":"Nervous & Endocrine Systems","stem":"During a scary movie, Ben's adrenal glands release a hormone that raises his heart rate and blood sugar. Which hormone is it?","options":["Melatonin","Oxytocin","Leptin","Adrenaline"],"ans":3,"exp":"Adrenaline from the adrenal glands powers the fight-or-flight energy surge.","why":["","","",""]}]},{"name":"The Brain","mode":"practice","tips":["Exam-style questions from Phineas's kit for this deck. Read every choice before you pick: the wrong ones are common mix-ups."],"questions":[{"id":"q4-1","type":"mcq","topic":"The Brain","stem":"Which of the following best describes what Phineas Gage's injury taught psychologists?","options":["The frontal lobe plays a major role in personality and controlling behavior.","The occipital lobe is responsible for processing vision.","The cerebellum controls balance and coordination.","The temporal lobe is needed to understand speech."],"ans":0,"exp":"After the rod went through his prefrontal cortex, Gage became impulsive, profane, and irritable: his personality changed, not his movement or senses.","why":["","","",""]},{"id":"q4-2","type":"mcq","topic":"The Brain","stem":"Which of the following scenarios best illustrates neuroplasticity?","options":["A student drinks coffee to stay alert while studying.","A runner's heart rate speeds up during a race.","After a stroke, a patient regains the ability to walk through months of therapy as other brain areas take over.","A person blinks when dust blows toward their eyes."],"ans":2,"exp":"Plasticity is the brain reorganizing itself. The others are a drug effect, the sympathetic system, and a reflex.","why":["","","",""]},{"id":"q4-3","type":"mcq","topic":"The Brain","stem":"Which of the following functions is most closely associated with the limbic system?","options":["Coordinating balance and fine motor movement","Controlling breathing and heartbeat","Regulating emotions, forming memories, and survival drives like hunger","Processing visual information"],"ans":2,"exp":"Li
